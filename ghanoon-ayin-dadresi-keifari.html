<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قانون آیین دادرسی کیفری | هزار و یک وکیل</title>
<style>
:root{--green:#123c35;--green2:#1b574b;--gold:#c9a45c;--cream:#f8f5ee;--text:#24312e;--card:#fff;--line:#e6e0d4}
*{box-sizing:border-box}html{direction:rtl}body{margin:0;background:var(--cream);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:2;direction:rtl;text-align:right}
header{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:24px 18px;position:sticky;top:0;z-index:5;box-shadow:0 3px 18px #0002}.wrap{max-width:1050px;margin:auto}h1{margin:0;font-size:25px}.sub{opacity:.9;font-size:13px;margin-top:4px}
.search{margin-top:16px;display:flex;gap:8px;direction:rtl}.search input{flex:1;min-width:0;padding:13px 15px;border:0;border-radius:10px;font:inherit;outline:none;direction:rtl;text-align:right}.search button{border:0;border-radius:10px;padding:0 18px;background:var(--gold);color:#fff;font-weight:bold;cursor:pointer}
main{max-width:1050px;margin:25px auto;padding:0 14px}.info{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px;margin-bottom:18px}.count{font-size:13px;color:#6c746f;margin-top:7px}
.article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:14px 0;box-shadow:0 4px 18px #0000000a;direction:rtl;text-align:right}.article-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:13px}.badge{background:var(--green);color:#fff;border-radius:9px;padding:3px 10px;font-size:13px;white-space:nowrap}.article h2{font-size:18px;color:var(--green);margin:0}.article-body{white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;font-size:15px;line-height:2.25;unicode-bidi:plaintext}.article-body p{margin:0}.article-body .para{margin:0 0 10px}.article-body .subpara{margin-right:0}
mark{background:#ffe49a;border-radius:3px;padding:0 2px}.status{background:#fff3cd;color:#765c00;border-radius:10px;padding:10px 12px;margin:10px 0;display:none}.empty{text-align:center;padding:40px;color:#777}.loading{text-align:center;padding:40px;color:#666}.back{display:inline-block;margin:20px 0;color:var(--green);font-weight:bold;text-decoration:none}
@media(max-width:600px){h1{font-size:20px}.search{flex-direction:column}.search button{height:45px}.article{padding:16px}.article-body{font-size:14px}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>قانون آیین دادرسی کیفری</h1>
<div class="sub">هزار و یک وکیل — متن مواد قانون از بانک قوانین سایت</div>
<div class="search"><input id="q" placeholder="شماره ماده یا عبارت موردنظر را جست‌وجو کنید..." autocomplete="off"><button id="clear">پاک کردن</button></div>
<div id="count" class="count"></div>
<div id="status" class="status"></div>
</div></header>
<main>
<div id="app" class="loading">در حال دریافت متن قانون...</div>
<a class="back" href="index.html">← بازگشت به صفحه اصلی</a>
</main>
<script>
const SUPABASE_URL='https://yrsuwiqslntwfscelbto.supabase.co';
const SUPABASE_KEY='sb_publishable_JVjtLXkWbkgVrREhJE1fJA_vutsZn68';
const LAW_ID=8;
const app=document.getElementById('app'),q=document.getElementById('q'),count=document.getElementById('count'),status=document.getElementById('status');
let ARTICLES=[];
function digits(s){return String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));}
function norm(s){return String(s||'').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\u200d]/g,'').replace(/\s+/g,' ').trim().toLowerCase();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function highlight(text,term){const safe=escapeHtml(text);if(!term)return safe;const et=escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(!et)return safe;return safe.replace(new RegExp(et,'gi',),m=>'<mark>'+m+'</mark>');}
function articleNumber(a){const m=String(a.article_number||'').match(/\d+/);return m?parseInt(m[0],10):999999;}
function render(list,term=''){
 if(!list.length){app.innerHTML='<div class="empty">برای عبارت جست‌وجوشده موردی پیدا نشد.</div>';count.textContent='';return;}
 app.innerHTML=list.map(a=>`<article class="article"><div class="article-head"><span class="badge">ماده ${escapeHtml(a.article_number)}</span><h2>ماده ${escapeHtml(a.article_number)}</h2></div><div class="article-body">${highlight(a.content||'',term)}</div></article>`).join('');
 count.textContent=term?`${list.length} ماده برای «${term}» پیدا شد.`:`${list.length} ماده در بانک قانون آیین دادرسی کیفری موجود است.`;
}
function search(){const term=q.value.trim();if(!term){render(ARTICLES);return}const n=norm(term);const digitsTerm=digits(term);const list=ARTICLES.filter(a=>norm(a.article_number)===n||norm(a.content).includes(n)||String(a.article_number)===digitsTerm||String(a.article_number).includes(digitsTerm));render(list,term);}
async function load(){
 try{
  const url=SUPABASE_URL+'/rest/v1/law_articles?select=id,article_number,title,content,status&law_id=eq.'+LAW_ID+'&order=id.asc&limit=2000';
  const res=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();
  ARTICLES=data.filter(x=>x.status===null||x.status==='active').sort((a,b)=>articleNumber(a)-articleNumber(b)||Number(a.id)-Number(b.id));
  render(ARTICLES);
 }catch(e){console.error(e);status.style.display='block';status.textContent='دریافت متن قانون از بانک اطلاعاتی انجام نشد. لطفاً اتصال اینترنت یا دسترسی بانک قوانین را بررسی کنید.';app.innerHTML='<div class="empty">متأسفانه متن قانون در حال حاضر بارگذاری نشد.</div>';count.textContent='';}
}
q.addEventListener('input',search);document.getElementById('clear').addEventListener('click',()=>{q.value='';search();q.focus()});load();
</script>
</body></html>
