<script>
const articlesData = [{"title": "ماده ۱ (اصلاح ی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱ (اصلاح ی ۱۴/۸/۱۳۷۰)- مصوبات مجلس شورای اسلامی و نتیجه همه پرسی پس از طی مراحل قانونی به رئیس جمهور ابلاغ\nمی شود. رئیس جمهور باید ظرف مدت پنج روز آن را امضا و به مجریان ابلاغ نماید و دستور انتشار آن را صادر کند و روزنامه رسمی\nموظف است ظرف مدت ۷۲ ساعت پس از ابلاغ منتشر نماید.\nتبصره (اصلاحی ۱۴/۸/۱۳۷۰)- در صورت استنکاف رئیس جمهور از امضا یا ابلاغ در مدت مذکور در این ماده به دستور رئیس مجلس\nشورای اسلامی روزنامه رسمی موظف است ظرف مدت ۷۲ ساعت مصوبه را چاپ و منتشر نماید ."}, {"title": "ماده ۲ (اصلاحی ۲۹/۸/۱۳۴۸)", "content": "ماده ۲ (اصلاحی ۲۹/۸/۱۳۴۸)- قوانین پانزده روز پس از انتشار در سراسر کشور لازم الاجرا است مگر آ نکه در خود قانون ترتیب خاصی\nبرای موقع اجرا مقرر شده باشد ."}, {"title": "ماده ۳", "content": "ماده ۳- انتشار قوانین باید در روزنامه رسمی به عمل آید."}, {"title": "ماده ۴", "content": "ماده ۴- اثر قانون نسبت به آتیه است و قانون نسبت به ماقبل خود اثر ندارد مگر اینکه در خود قانون، مقررات خاصی نسبت به این\nموضوع اتخاذ شده باشد."}, {"title": "ماده ۵", "content": "ماده ۵- کلیه سکنه ایران اعم از اتباع داخله و خارجه مطیع قوانین ایران خواهند بود مگر در مواردی که قانون استثنا کرده باشد."}, {"title": "ماده ۶", "content": "ماده ۶- قوانین مربوط به احوال شخصیه از قبیل نکاح و طلاق و اهلیت اشخاص و ارث در مورد کلیه اتباع ایران ولو اینکه مقیم در\nخارجه باشند مجری خواهد بود."}, {"title": "ماده ۷", "content": "ماده ۷- اتباع خارجه مقیم در خاک ایران از حیث مسائل مربوطه به احوال شخصیه و اهلیت خود و همچنین از حیث حقوق ارثیه در\nحدود معاهدات مطیع قوانین و مقررات دولت متبوع خود خواهند بود ."}, {"title": "ماده ۸", "content": "ماده ۸- اموال غیرمنقول که اتباع خارجه در ایران بر طبق عهود تملک کرده یا می کنند از هر جهت تابع قوانین ایران خواهد بود ."}, {"title": "ماده ۹", "content": "ماده ۹- مقررات عهودی که بر طبق قانون اساسی بین دولت ایران و سایر دول منعقد شده باشد در حکم قانون است."}, {"title": "ماده ۱۰", "content": "ماده ۱۰- قراردادهای خصوصی نسبت به کسانی که آن را منعقد نموده اند در صورتی که مخالف صریح قانون نباشد نافذ است .\nجلد اول - در اموال\nکتاب اول - در بیان اموال و مالکیت بهطور کلی\nباب اول - در بیان انواع اموال"}, {"title": "ماده ۱۱", "content": "ماده ۱۱- اموال بر دو قسم است منقول و غیرمنقول .\nقانون مدنی\nفصل اول - در اموال غیرمنقول"}, {"title": "ماده ۱۲", "content": "ماده ۱۲- مال غیرمنقول آنست که از محلی به محل دیگر نتوان نقل نمود اعم از اینکه استقرار آن ذاتی باشد یا به واسطه عمل انسان به\nنحوی که نقل آن مستلزم خرابی یا نقص خود مال یا محل آن شود ."}, {"title": "ماده ۱۳", "content": "ماده ۱۳- اراضی و ابنیه و آسیا و هر چه که در بنا منصوب و عرفاً جزء بنا محسوب می شود غیرمنقول است و همچنین است لوله ها که\nبرای جریان آب یا مقاصد دیگر در زمین یا بنا کشیده شده باشد ."}, {"title": "ماده ۱۴", "content": "ماده ۱۴- آینه و پرده نقاشی و مجسمه و امثال آن ها در صورتی که در بنا یا زمین به کار رفته باشد به طوری که نقل آن موجب نقص یا\nخرابی خود آن یا محل آن بشود غیرمنقول است ."}, {"title": "ماده ۱۵", "content": "ماده ۱۵- ثمره و حاصل مادام که چیده یا درو نشده است غیرمنقول است اگر قسمتی از آن چیده یا درو شده باشد تنها آن قسمت\nمنقول است."}, {"title": "ماده ۱۶", "content": "ماده ۱۶- مطلق اشجار و شاخه های آن و نهال و قلمه مادام که بریده یا کنده نشده است غیر منقول است."}, {"title": "ماده ۱۷", "content": "ماده ۱۷- حیوانات و اشیایی که مالک آن را برای عمل زراعت اختصاص داده باشد از قبیل گاو و گاومیش و ماشین و اسباب و ادوات\nزراعت و تخم و غیره و به طور کلی هر مال منقول که برای استفاده از عمل زراعت لازم و مالک آن را به این امر تخصیص داده باشد از\nجهت صلاحیت محاکم و توقیف ا موال جزو ملک محسوب و در حکم مال غیرمنقول است و همچنین است تلمبه و گاو و یا حیوان\nدیگری که برای آبیاری زراعت یا خانه و باغ اختصاص داده شده است ."}, {"title": "ماده ۱۸", "content": "ماده ۱۸- حق انتفاع از اشیای غیرمنقوله مثل حق عُمریٰ و سُکنیٰ و همچنین حق ارتفاق نسبت به ملک غیر از قبیل حق العبور و\nحق المجری و دعاوی راجعه به اموال غیرمنقوله از قبیل تقاضای خلع ید و امثال آن تابع اموال غیرمنقول است.\nفصل دوم - در اموال منقوله"}, {"title": "ماده ۱۹", "content": "ماده ۱۹- اشیایی که نقل آن از محلی به محل دیگر ممکن باشد بدون اینکه به خود یا محل آن خرابی وارد آید منقول است ."}, {"title": "ماده ۲۰", "content": "ماده ۲۰- کلیه دیون از قبیل قرض و ثمن مبیع و مال الاجاره عین مستأجره از حیث صلاحیت محاکم در حکم منقول است ولو اینکه\nمبیع یا عین مستأجره از اموال غیرمنقوله باشد ."}, {"title": "ماده ۲۱", "content": "ماده ۲۱- انواع کشتی های کوچک و بزرگ و قایق ها و آسیاها و حمامهایی که در روی رودخانه و دریاها ساخته می شود و میتوان آنها\nرا حرکت داد و کلیه کارخانه هایی که نظر به طرز ساختمان جزو بنای عمارتی نباشد داخل در منقولات است ولی توقیف بعضی از اشیای\nمزبوره ممکن است نظر به اهمیت آن ها موافق ترتیبات خاصه به عمل آید ."}, {"title": "ماده ۲۲", "content": "ماده ۲۲- مصالح بنایی از قبیل سنگ و آجر و غیره که برای بنایی تهیه شده یا به واسطه خرابی از بنا جدا شده باشد مادامی که در بنا به\nکار نرفته داخل منقول است .\nفصل سوم - در اموالی که مالک خاص ندارد"}, {"title": "ماده ۲۳", "content": "ماده ۲۳- استفاده از اموالی که مالک خاص ندارد مطابق قوانین مربوطه به آن ها خواهد بود."}, {"title": "ماده ۲۴", "content": "ماده ۲۴- هیچ کس نمی تواند طرق و شوارع عامه و کوچههایی را که آخر آن ها مسدود نیست تملک نماید."}, {"title": "ماده ۲۵", "content": "ماده ۲۵- هیچ کس نمیتواند اموالی را که مورد استفاده عموم است و مالک خاص ندارد از قبیل پل ها و کاروانسراها و آب انبارهای\nعمومی و مدارس قدیمه و میدان گاه های عمومی تملک کند. و همچنین است قنوات و چاه هایی که مورد استفاده عموم است ."}, {"title": "ماده ۲۶ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۲۶ (اصلاحی ۱۴/۸/۱۳۷۰)- اموال دولتی که معد است برای مصالح یا انتفاعات عمومی مثل استحکامات و قلاع و خندق ها و\nخاکریزهای نظامی و قورخانه و اسلحه و ذخیره و سفاین جنگی و همچنین اثاثیه و ابنیه و عمارات دولتی و سیم های تلگرافی دولتی و\nموزه ها و کتابخانههای عمومی و آثار تاریخی و امثال آن ها و بالجمله آنچه از اموال منقوله و غیر منقوله که دولت به عنوان مصالح\nقانون مدنی\nعمومی و منافع ملی در تحت تصرف دارد، قابل تملک خصوصی نیست و همچنین اموالی که موافق مصالح عمومی به ایالت و ولایت\nیا ناحیه یا شهری اختصاص یافته باشد."}, {"title": "ماده ۲۷", "content": "ماده ۲۷- اموالی که ملک اشخاص نمیباشد و افراد مردم می توانند آنها را مطابق مقررات مندرجه در این قانون و قوانین مخصوصه\nمربوطه به هر یک از اقسام مختلفه آنها تملک کرده و یا از آن ها استفاده کنند مباحات نامیده می شود مثل اراضی موات یعنی زمین هایی\nکه معطل افتاده و آبادی و کشت و زرع در آنها نباشد."}, {"title": "ماده ۲۸", "content": "ماده ۲۸- اموال مجهول المالک با اذن حاکم یا مأذون از قِبَل او به مصارف فقرا می رسد.\nباب دوم - در حقوق مختلفه که برای اشخاص نسبت به اموال حاصل میشود"}, {"title": "ماده ۲۹", "content": "ماده ۲۹- ممکن است اشخاص نسبت به اموال علاقههای ذیل را دارا باشند:\n۱- مالکیت ( اعم از عین یا منفعت)\n۲- حق انتفاع\n۳- حق ارتفاق به ملک غیر\nفصل اول - در مالکیت"}, {"title": "ماده ۳۰", "content": "ماده ۳۰- هر مالکی نسبت به مایملک خود حق همه گونه تصرف و انتفاع دارد مگر در مواردی که قانون استثنا کرده باشد ."}, {"title": "ماده ۳۱", "content": "ماده ۳۱- هیچ مالی را از تصرف صاحب آن نمی توان بیرون کرد مگر به حکم قانون."}, {"title": "ماده ۳۲", "content": "ماده ۳۲- تمام ثمرات و متعلقات اموال منقوله و غیر منقوله که طبعاً یا در نتیجه عملی حاصل شده باشد بالتبع مال مالک اموال مزبوره\nاست."}, {"title": "ماده ۳۳", "content": "ماده ۳۳- نما و محصولی که از زمین حاصل می شود مال مالک زمین است چه به خودی خود روئیده باشد یا به واسطه عملیات مالک\nمگر اینکه نما یا حاصل از اصله یا حبه غیر حاصل شده باشد که در این صورت درخت و محصول، مال صاحب اصله یا حبه خواهد بود\nاگر چه بدون رضای صاحب زمین کاشته شده باشد ."}, {"title": "ماده ۳۴", "content": "ماده ۳۴- نِتاج حیوانات در ملکیت، تابع مادر است و هر کس مالک مادر شد مالک نِتاج آن هم خواهد شد ."}, {"title": "ماده ۳۵", "content": "ماده ۳۵- تصرف به عنوان مالکیت دلیل مالکیت است مگر اینکه خلاف آن ثابت شود ."}, {"title": "ماده ۳۶", "content": "ماده ۳۶- تصرفی که ثابت شود ناشی از سبب مُمَلِّک یا ناقل قانونی نبوده معتبر نخواهد بود."}, {"title": "ماده ۳۷", "content": "ماده ۳۷- اگر متصرف فعلی اقرار کند که ملک سابقاً مال مدعی او بوده است در این صورت مشارالیه نمی تواند برای رد ادعای مالکیت\nشخص مزبور به تصرف خود استناد کند مگر اینکه ثابت نماید که ملک به ناقل صحیح به او منتقل شده است ."}, {"title": "ماده ۳۸", "content": "ماده ۳۸- مالکیت زمین مستلزم مالکیت فضای مُحاذی آن است تا هرکجا بالا رود و همچنین است نسبت به زیر زمین بِالجمله مالک\nحق همه گونه تصرف در هوا و قرار دارد مگر آنچه را که قانون استثنا کرده باشد ."}, {"title": "ماده ۳۹", "content": "ماده ۳۹- هر بنا و درخت که در روی زمین است و همچنین هر بنا و حفری که در زیر زمین است ملک مالک آن زمین محسوب می شود\nمگر اینکه خلاف آن ثابت شود.\nفصل دوم - در حق انتفاع"}, {"title": "ماده ۴۰", "content": "ماده ۴۰- حق انتفاع عبارت از حقی است که به موجب آن شخص می تواند از مالی که عین آن ملک دیگری است یا مالک خاصی ندارد\nاستفاده کند.\nقانون مدنی\nمبحث اول - در عمری و رقبی و سکنی"}, {"title": "ماده ۴۱", "content": "ماده ۴۱- عُمریٰ حق انتفاعی است که به موجب عقدی از طرف مالک برای شخص به مدت عمر خود یا عمر منتفع و یا عمر شخص\nثالثی برقرار شده باشد ."}, {"title": "ماده ۴۲", "content": "ماده ۴۲- رُقبیٰ حق انتفاعی است که از طرف مالک برای مدت معینی برقرار می گردد ."}, {"title": "ماده ۴۳", "content": "ماده ۴۳- اگر حق انتفاع عبارت از سکونت در مسکنی باشد سُکنیٰ یا حق سُکنیٰ نامیده می شود و این حق ممکن است به طریق عُمریٰ\nیا به طریق رُقبیٰ برقرار شود ."}, {"title": "ماده ۴۴", "content": "ماده ۴۴- در صورتی که مالک برای حق انتفاع مدتی معین نکرده باشد حبس مطلق بوده و حق مزبور تا فوت مالک خواهد بود مگر\nاینکه مالک قبل از فوت خود رجوع کند ."}, {"title": "ماده ۴۵", "content": "ماده ۴۵- در موارد فوق حق انتفاع را فقط درباره شخص یا اشخاصی می توان برقرار کرد که در حین ایجاد حق مزبور وجود داشته باشند\nولی ممکن است حق انتفاع تَبَعاً برای کسانی هم که در حین عقد به وجود نیامده اند برقرار شود و مادامی که صاحبان حق انتفاع موجود\nهستند حق مزبور باقی و بعد از انقراض آن ها حق زائل می گردد ."}, {"title": "ماده ۴۶", "content": "ماده ۴۶- حق انتفاع ممکن است فقط نسبت بمالی برقرار شود که استفاده از آن با بقای عین ممکن باشد اعم از اینکه مال مزبور منقول\nباشد یا غیرمنقول و مشاع باشد یا مفروز ."}, {"title": "ماده ۴۷", "content": "ماده ۴۷- در حبس اعم از عُمریٰ و غیره، قبض شرط صحت است ."}, {"title": "ماده ۴۸", "content": "ماده ۴۸- منتفع باید از مالی که موضوع حق انتفاع است سوءاستفاده نکرده و در حفاظت آن تعدی یا تفریط ننماید ."}, {"title": "ماده ۴۹", "content": "ماده ۴۹- مخارج لازمه برای نگاهداری مالی که موضوع انتفاع است بر عهده منتفع نیست مگر این که خلاف آن شرط شده باشد ."}, {"title": "ماده ۵۰", "content": "ماده ۵۰- اگر مالی که موضوع حق انتفاع است بدون تعدی یا تفریط منتفع تلف شود مشارالیه مسئول آن نخواهد بود ."}, {"title": "ماده ۵۱", "content": "ماده ۵۱- حق انتفاع در موارد ذیل زایل می شود:\n۱- در صورت انقضای مدت\n۲- در صورت تلف شدن مالی که موضوع انتفاع است"}, {"title": "ماده ۵۲", "content": "ماده ۵۲- در موارد ذیل منتفع ضامن تضررات مالک است :\n۱- در صورتی که منتفع از مال موضوع انتفاع سوءاستفاده کند\n۲- در صورتی که شرایط مقرره از طرف مالک را رعایت ننماید و این عدم رعایت موجب خسارتی بر موضوع حق انتفاع باشد ."}, {"title": "ماده ۵۳", "content": "ماده ۵۳- انتقال عین از طرف مالک به غیر موجب بطلان حق انتفاع نمی شود ولی اگر منتقل الیه جاهل باشد که حق انتفاع متعلق به\nدیگری است اختیار فسخ معامله را خواهد داشت ."}, {"title": "ماده ۵۴", "content": "ماده ۵۴- سایر کیفیات انتفاع از مال دیگری به نحوی خواهد بود که مالک قرار داده یا عرف و عادت اقتضا بنماید .\nمبحث دوم - در وقف"}, {"title": "ماده ۵۵", "content": "ماده ۵۵- وقف عبارتست از اینکه عین مال حبس و منافع آن تسبیل شود ."}, {"title": "ماده ۵۶", "content": "ماده ۵۶- وقف واقع می شود به ایجاب از طرف واقف به هر لفظی که صراحتاً دلالت بر معنی آن کند و قبول طبقه اول از موقوف علیهم\nیا قائممقام قانونی آنها در صورتی که محصور باشند مثل وقف بر اولاد و اگر موقوف علیهم غیر محصور یا وقف بر مصالح عامه باشد\nدر این صورت قبول حاکم شرط است."}, {"title": "ماده ۵۷", "content": "ماده ۵۷- واقف باید مالک مالی باشد که وقف میکند و بعلاوه دارای اهلیتی باشد که در معاملات معتبر است .\nقانون مدنی"}, {"title": "ماده ۵۸", "content": "ماده ۵۸- فقط وقف مالی جائز است که با بقای عین بتوان از آن منتفع شد اعم از اینکه منقول باشد یا غیرمنقول مشاع باشد یا مفروز ."}, {"title": "ماده ۵۹", "content": "ماده ۵۹- اگر واقف عین موقوفه را به تصرف وقف ندهد وقف محقق نمی شود و هر وقت به قبض داد وقف تحقق پیدا می کند."}, {"title": "ماده ۶۰", "content": "ماده ۶۰- در قبض فوریت شرط نیست بلکه مادامی که واقف رجوع از وقف نکرده است هر وقت قبض بدهد وقف تمام می شود."}, {"title": "ماده ۶۱", "content": "ماده ۶۱- وقف بعد از وقوع آن به نحو صحت و حصول قبض لازم است و واقف نمی تواند از آن رجوع کند یا در آن تغییری بدهد یا از\nموقوفعلیهم کسی را خارج کند یا کسی را داخل در موقوف علیهم نماید یا با آن ها شریک کند یا اگر در ضمن عقد متولی معین نکرده\nبعد از آن متولی قرار دهد یا خود به عنوان تولیت دخالت کند ."}, {"title": "ماده ۶۲", "content": "ماده ۶۲- در صورتی که موقوف علیهم محصور باشند خود آنها قبض می کنند و قبض طبقه اولی کافی است و اگر موقوفعلیهم غیر\nمحصور یا وقف بر مصالح عامه باشد متولی وقف و الا حاکم قبض می کند."}, {"title": "ماده ۶۳", "content": "ماده ۶۳- ولی و وصی محجورین از جانب آن ها موقوفه را قبض می کنند و اگر خود واقف تولیت را برای خود قرار داده باشد قبض خود\nاو کفایت می کند."}, {"title": "ماده ۶۴", "content": "ماده ۶۴- مالی را که منافع آن موقتاً متعلق به دیگری است می توان وقف نمود و همچنین وقف ملکی که در آن حق ارتفاق موجود\nاست جائز است بدون اینکه به حق مزبور خللی وارد آید ."}, {"title": "ماده ۶۵", "content": "ماده ۶۵- صحت وقفی که به علت اضرار دیان واقف واقع شده باشد منوط به اجازه دیان است ."}, {"title": "ماده ۶۶", "content": "ماده ۶۶- وقف بر مقاصد غیر مشروع باطل است."}, {"title": "ماده ۶۷", "content": "ماده ۶۷- مالی که قبض و اقباض آن ممکن نیست وقف آن باطل است لیکن اگر واقف تنها قادر بر اخذ و اقباض آن نباشد و موقوفعلیه\nقادر به اخذ آن باشد صحیح است ."}, {"title": "ماده ۶۸", "content": "ماده ۶۸- هر چیزی که طبعاً یا بر حسب عرف و عادت جزء یا از توابع و متعلقات عین موقوفه محسوب می شود داخل در وقف است\nمگر اینکه واقف آن را استثنا کند به نحوی که در فصل بیع مذکور است ."}, {"title": "ماده ۶۹", "content": "ماده ۶۹- وقف بر معدوم صحیح نیست مگر به تبع موجود."}, {"title": "ماده ۷۰", "content": "ماده ۷۰- اگر وقف بر موجود و معدوم معاً واقع شود نسبت به سهم موجود صحیح و نسبت به سهم معدوم باطل است ."}, {"title": "ماده ۷۱", "content": "ماده ۷۱- وقف بر مجهول صحیح نیست."}, {"title": "ماده ۷۲", "content": "ماده ۷۲- وقف بر نفس به این معنی که واقف خود را موقوف علیه یا جزء موقوفعلیهم نماید یا پرداخت دیون یا سایر مخارج خود را\nاز منافع موقوفه قرار دهد باطل است اعم از اینکه راجع به حال حیات باشد یا بعد از فوت ."}, {"title": "ماده ۷۳", "content": "ماده ۷۳- وقف بر اولاد و اقوام و خدمه و واردین و امثال آن ها صحیح است."}, {"title": "ماده ۷۴", "content": "ماده ۷۴- در وقف بر مصالح عامه اگر خود واقف نیز مصداق موقوف علیهم واقع شود می تواند منتفع گردد ."}, {"title": "ماده ۷۵", "content": "ماده ۷۵- واقف میتواند تولیت یعنی اداره کردن امور موقوفه را مادام الحیات یا در مدت معینی برای خود قرار دهد و نیز می تواند متولی\nدیگری معین کند که مستقلاً یا مجتمعاً با خود واقف اداره کند. تولیت اموال موقوفه ممکن است به یک یا چند نفر دیگر غیر از خود\nواقف واگذار شود که هر یک مستقلاً یا منضماً اداره کنند و همچنین واقف می تواند شرط کند که خود او یا متولی که معین شده است\nنصب متولی کند و یا در این موضوع هر ترتیبی را که مقتضی بداند قرار دهد."}, {"title": "ماده ۷۶", "content": "ماده ۷۶- کسی که واقف او را متولی قرار داده می تواند بدواً تولیت را قبول یا رد کند و اگر قبول کرد دیگر نمی تواند رد نماید و اگر رد\nکرد مثل صورتیست که از اصل متولی قرار داده نشده باشد .\nقانون مدنی"}, {"title": "ماده ۷۷", "content": "ماده ۷۷- هر گاه واقف برای دو نفر یا بیشتر به طور استقلال تولیت قرار داده باشد هر یک از آن ها فوت کند دیگری یا دیگران مستقلاً\nتصرف می کنند و اگر به نحو اجتماع قرار داده باشد تصرف هر یک بدون تصویب دیگری یا دیگران نافذ نیست و بعد از فوت یکی از آن ها\nحاکم شخصی را ضمیمه آ نکه باقیمانده است می نماید که مجتمعاً تصرف کنند ."}, {"title": "ماده ۷۸", "content": "ماده ۷۸- واقف می تواند بر متولی ناظر قرار دهد که اعمال متولی به تصویب یا اطلاع او باشد ."}, {"title": "ماده ۷۹", "content": "ماده ۷۹- واقف یا حاکم نمیتواند کسی را که در ضمن عقد وقف متولی قرار داده شده است عزل کنند مگر در صورتی که حق عزل\nشرط شده باشد و اگر خیانت متولی ظاهر شود حاکم ضم امین می کند."}, {"title": "ماده ۸۰", "content": "ماده ۸۰- اگر واقف وصف مخصوصی را در شخص متولی شرط کرده باشد و متولی فاقد آن وصف گردد منعزل می شود."}, {"title": "ماده ۸۱ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۸۱ (اصلاحی ۱۴/۸/۱۳۷۰)- در اوقاف عامه که متولی معین نداشته باشد، اداره موقوفه طبق نظر ولی فقیه خواهد بود."}, {"title": "ماده ۸۲", "content": "ماده ۸۲- هر گاه واقف برای اداره کردن موقوفه ترتیب خاصی معین کرده باشد متولی باید به همان ترتیب رفتار کند و اگر ترتیبی قرار\nنداده باشد متولی باید راجع به تعمیر و اجاره و جمع آوری منافع و تقسیم آن بر مستحقین و حفظ موقوفه و غیره مثل وکیل امینی عمل\nنماید."}, {"title": "ماده ۸۳", "content": "ماده ۸۳- متولی نمی تواند تولیت را به دیگری تفویض کند مگر آ نکه واقف در ضمن وقف به او اذن داده باشد ولی اگر در ضمن وقف\nشرط مباشرت نشده باشد می تواند وکیل بگیرد ."}, {"title": "ماده ۸۴", "content": "ماده ۸۴- جائز است واقف از منافع موقوفه سهمی برای عمل متولی قرار دهد و اگر حق التولیه معین نشده باشد متولی مستحق\nاجرت المثل عمل است."}, {"title": "ماده ۸۵", "content": "ماده ۸۵- بعد از آنکه منافع موقوفه حاصل و حصه هر یک از موقوفعلیهم معین شد موقوفعلیه می تواند حصه خود را تصرف کند\nاگر چه متولی اذن نداده باشد مگر اینکه واقف اذن در تصرف را شرط کرده باشد ."}, {"title": "ماده ۸۶", "content": "ماده ۸۶- در صورتی که واقف ترتیبی قرار نداده باشد مخارج تعمیر و اصلاح موقوفه و اموری که برای تحصیل منفعت لازم است بر حق\nموقوفعلیهم مقدم خواهد بود."}, {"title": "ماده ۸۷", "content": "ماده ۸۷- واقف می تواند شرط کند که منافع موقوفه مابین موقوف علیهم به تساوی تقسیم شود یا به تفاوت و یا اینکه اختیار به متولی\nیا شخص دیگری بدهد که هر نحو مصلحت داند تقسیم کند."}, {"title": "ماده ۸۸", "content": "ماده ۸۸- بیع وقف در صورتی که خراب شود یا خوف آن باشد که منجر به خرابی گردد به طوری که انتفاع از آن ممکن نباشد در صورتی\nجایز است که عمران آن متعذر باشد یا کسی برای عمران آن حاضر نشود ."}, {"title": "ماده ۸۹", "content": "ماده ۸۹- هر گاه بعض موقوفه خراب یا مشرف به خرابی گردد به طوری که انتفاع از آن ممکن نباشد همان بعض فروخته می شود مگر\nاینکه خرابی بعض سبب سلب انتفاع قسمتی که باقیمانده است بشود، در این صورت تمام فروخته می شود."}, {"title": "ماده ۹۰", "content": "ماده ۹۰- عین موقوفه در مورد جواز بیع به اقرب به غرض واقف تبدیل می شود."}, {"title": "ماده ۹۱", "content": "ماده ۹۱- در موارد ذیل منافع موقوفات عامه صرف بریات عمومیه خواهد شد :\n۱ )در صورتی که منافع موقوفه مجهول المصرف باشد مگر اینکه قدر مُتَیّقّنی در بین باشد .\n۲ )در صورتی که صرف منافع موقوفه در مورد خاصی که واقف معین کرده است متعذر باشد .\nمبحث سوم - در حق انتفاع از مباحات"}, {"title": "ماده ۹۲", "content": "ماده ۹۲- هرکس می تواند با رعایت قوانین و نظامات راجعه به هر یک از مباحات از آن ها استفاده نماید.\nقانون مدنی\nفصل سوم - در حق ارتفاق نسبت به ملک غیر و در احکام و آثار املاک نسبت به املاک مجاور\nمبحث اول - در حق ارتفاق نسبت به ملک غیر"}, {"title": "ماده ۹۳", "content": "ماده ۹۳- ارتفاق حقی است برای شخص در ملک دیگری ."}, {"title": "ماده ۹۴", "content": "ماده ۹۴- صاحبان املاک می توانند در ملک خود هر حقی را که بخواهند نسبت به دیگری قرار دهند در این صورت کیفیت استحقاق\nتابع قرارداد و عقدیست که مطابق آن حق داده شده است ."}, {"title": "ماده ۹۵", "content": "ماده ۹۵- هر گاه زمین یا خانه کسی مجرای فاضلاب یا آب باران زمین یا خانه دیگری بوده است صاحب آن خانه یا زمین نمی تواند\nجلوگیری از آن کند مگر در صورتی که عدم استحقاق او معلوم شود ."}, {"title": "ماده ۹۶", "content": "ماده ۹۶- چشمه واقعه در زمین کسی محکوم به ملکیت صاحب زمین است مگر اینکه دیگری نسبت به آن چشمه عیناً یا انتفاعاً حقی\nداشته باشد."}, {"title": "ماده ۹۷", "content": "ماده ۹۷- هر گاه کسی از قدیم در خانه یا ملک دیگری مجرای آب به ملک خود یا حق مرور داشته صاحب خانه یا ملک نمی تواند مانع\nآب بردن یا عبور او از ملک خود شود و همچنین است سایر حقوق از قبیل حق داشتن در و شبکه و ناودان و حق شرب و غیره ."}, {"title": "ماده ۹۸", "content": "ماده ۹۸- اگر کسی حق عبور در ملک غیر ندارد ولی صاحب ملک اذن داده باشد که از ملک او عبور کنند هر وقت بخواهد می تواند از\nاذن خود رجوع کرده و مانع عبور او بشود و همچنین است سایر ارتفاقات ."}, {"title": "ماده ۹۹", "content": "ماده ۹۹- هیچ کس حق ندارد ناودان خود را به طرف ملک دیگری بگذارد یا آب باران از بام خود به بام یا ملک همسایه جاری کند و یا\nبرف بریزد مگر به اذن او ."}, {"title": "ماده ۱۰۰", "content": "ماده ۱۰۰- اگر مجرای آب شخصی در خانه دیگری باشد و در مجری خرابی به هم رسد به نحوی که عبور آب موجب خسارت خانه شود\nمالک خانه حق ندارد صاحب مجری را به تعمیر مجری اجبار کند بلکه خود او باید دفع ضرر از خود نماید چنانچه اگر خرابی مجری مانع\nعبور آب شود مالک خانه ملزم نیست ک ه مجری را تعمیر کند بلکه صاحب حق باید خود رفع مانع کند در این صورت برای تعمیر مجری\nمی تواند داخل خانه یا زمین شود ولیکن بدون ضرورت حق ورود ندارد مگر به اذن صاحب ملک ."}, {"title": "ماده ۱۰۱", "content": "ماده ۱۰۱- هرگاه کسی از آبی که ملک دیگری است به نحوی از انحا حق انتفاع داشته باشد از قبیل دایر کردن آسیا و امثال آن صاحب\nآن نمیتواند مجری را تغییر دهد به نحوی که مانع از استفاده حق دیگری باشد ."}, {"title": "ماده ۱۰۲", "content": "ماده ۱۰۲- هر گاه ملکی کلاً یا جزئاً به کسی منتقل شود و برای آن ملک حق الارتفاقی در ملک دیگر یا در جزء دیگر همان ملک موجود\nباشد آن حق به حال خود باقی می ماند مگر اینکه خلاف آن تصریح شده باشد."}, {"title": "ماده ۱۰۳", "content": "ماده ۱۰۳- هر گاه شرکای ملکی دارای حقوق و منافعی باشند و آن ملک مابین شرکا تقسیم شود هر کدام از آنها به قدر حصه مالک آن\nحقوق و منافع خواهد بود مثل اینکه اگر ملکی دارای حق عبور در ملک غیر بوده و آن ملک که دارای حق است بین چند نفر تقسیم\nشود هر یک از آنها حق عبور از همان محلی که سابقاً حق داشته است خواهد داشت ."}, {"title": "ماده ۱۰۴", "content": "ماده ۱۰۴- حق الارتفاق مستلزم وسایل انتفاع از آن حق نیز خواهد بود مثل اینکه اگر کسی حق شرب از چشمه یا حوض یا آب انبار غیر\nدارد حق عبور تا آن چشمه یا حوض و آب انبار هم برای برداشتن آب دارد ."}, {"title": "ماده ۱۰۵", "content": "ماده ۱۰۵- کسی که حق الارتفاق در ملک غیر دارد مخارجی که برای تمتع از آن حق لازم شود به عهده صاحب حق می باشد مگر اینکه\nبین او و صاحبملک برخلاف آن قراری داده شده باشد ."}, {"title": "ماده ۱۰۶", "content": "ماده ۱۰۶- مالک ملکی که مورد حق الارتفاق غیر است نمی تواند در ملک خود تصرفاتی نماید که باعث تضییع یا تعطیل حق مزبور باشد\nمگر با اجازه صاحب حق .\nقانون مدنی"}, {"title": "ماده ۱۰۷", "content": "ماده ۱۰۷- تصرفات صاحب حق در ملک غیر که متعلق حق اوست باید به اندازه ای باشد که قرار داده اند و یا به مقدار متعارف و آنچه\nضرورت انتفاع اقتضا می کند."}, {"title": "ماده ۱۰۸", "content": "ماده ۱۰۸- در تمام مواردی که انتفاع کسی از ملک دیگری به موجب اذن محض باشد مالک می تواند هر وقت بخواهد از اذن خود رجوع\nکند مگر اینکه مانع قانونی موجود باشد.\nمبحث دوم - در احکام و آثار املاک نسبت به املاک مجاور"}, {"title": "ماده ۱۰۹", "content": "ماده ۱۰۹- دیواری که مابین دو ملک واقع است مشترک مابین صاحب آن دو ملک محسوب می شود مگر اینکه قرینه یا دلیلی برخلاف\nآن موجود باشد."}, {"title": "ماده ۱۱۰", "content": "ماده ۱۱۰- بنا به طور ترصیف و وضع سرتیر از جمله قرائن است که دلالت بر تصرف و اختصاص می کنند."}, {"title": "ماده ۱۱۱", "content": "ماده ۱۱۱- هر گاه از دو طرف بنا متصل به دیوار به طور ترصیف باشد و یا از هر دو طرف بروی دیوار سرتیر گذاشته شده باشد آن دیوار\nمحکوم به اشتراک است مگر اینکه خلاف آن ثابت شود ."}, {"title": "ماده ۱۱۲", "content": "ماده ۱۱۲- هر گاه قرائن اختصاصی فقط از یک طرف باشد تمام دیوار محکوم به ملکیت صاحب آن طرف خواهد بود مگر اینکه خلافش\nثابت شود."}, {"title": "ماده ۱۱۳", "content": "ماده ۱۱۳- مخارج دیوار مشترک بر عهده کسانی است که در آن شرکت دارند ."}, {"title": "ماده ۱۱۴", "content": "ماده ۱۱۴- هیچ یک از شرکا نمی تواند دیگری را اجبار بر بنا و تعمیر دیوار مشترک نماید مگر اینکه دفع ضرر به نحو دیگر ممکن نباشد ."}, {"title": "ماده ۱۱۵", "content": "ماده ۱۱۵- در صورتی که دیوار مشترک خراب شود و احد شریکین از تجدید بنا و اجازه تصرف در مبنای مشترک امتناع نماید شریک\nدیگر می تواند در حصه خاص خود تجدید بنای دیوار را کند ."}, {"title": "ماده ۱۱۶", "content": "ماده ۱۱۶- هر گاه احد شرکا راضی به تصرف دیگری در مبنا باشد ولی از تحمل مخارج مضایقه نماید شریک دیگر می تواند بنای دیوار را\nتجدید کند و در این صورت اگر بنای جدید با مصالح مشترک ساخته شود دیوار مشترک خواهد بود و الا مختص به شریکی است که بنا\nرا تجدید کرده است ."}, {"title": "ماده ۱۱۷", "content": "ماده ۱۱۷- اگر یکی از دو شریک دیوار مشترک را خراب کند در صورتی که خراب کردن آن لازم نبوده باید آ نکه خراب کرده مجدداً آن را\nبنا کند."}, {"title": "ماده ۱۱۸", "content": "ماده ۱۱۸- هیچ یک از دو شریک حق ندارد دیوار مشترک را بالا ببرد یا روی آن بنا سرتیر بگذارد یا دریچه و رف باز کند یا هر نوع تصرفی\nنماید مگر به اذن شریک دیگر ."}, {"title": "ماده ۱۱۹", "content": "ماده ۱۱۹- هر یک از شرکا بر روی دیوار مشترک سرتیر داشته باشد نمی تواند بدون رضای شریک دیگر تیرها را از جای خود تغییر دهد و\nبه جای دیگر از دیوار بگذارد ."}, {"title": "ماده ۱۲۰", "content": "ماده ۱۲۰- اگر صاحب دیوار به همسایه اذن دهد که بر وی دیوار او سرتیر بگذارد یا روی آن بنا کند هر وقت بخواهد می تواند از اذن\nخود رجوع کند مگر اینکه به وجه ملزمی این حق را از خود سلب کرده باشد ."}, {"title": "ماده ۱۲۱", "content": "ماده ۱۲۱- هر گاه کسی به اذن صاحب دیوار بر روی دیوار سرتیری گذارده باشد و بعد آن را بردارد نمی تواند مجدداً بگذارد مگر به اذن\nجدید از صاحب دیوار و همچنین است سایر تصرفات ."}, {"title": "ماده ۱۲۲", "content": "ماده ۱۲۲- اگر دیواری متمایل به ملک غیر یا شارع و نحو آن شود که مشرف به خرابی گردد صاحب آن اجبار می شود که آن را خراب\nکند."}, {"title": "ماده ۱۲۳", "content": "ماده ۱۲۳- اگر خانه یا زمینی بین دو نفر تقسیم شود یکی از آن ها نمیتواند دیگری را مجبور کند که با هم دیواری مابین دو قسمت\nبکشند.\nقانون مدنی"}, {"title": "ماده ۱۲۴", "content": "ماده ۱۲۴- اگر از قدیم سرتیر عمارتی روی دیوار مختصی همسایه بوده و سابقه این تصرف معلوم نباشد باید به حال سابق باقی بماند و\nاگر به سبب خرابی عمارت و نحو آن سرتیر برداشته شود صاحب عمارت می تواند آن را تجدید کند و همسایه حق ممانعت ندارد مگر\nاینکه ثابت نماید وضعیت سابق به صرف اجازه او ایجاد شده بوده است ."}, {"title": "ماده ۱۲۵", "content": "ماده ۱۲۵- هر گاه طبقه تحتانی مال کسی باشد و طبقه فوقانی مال دیگری هر یک از آنها میتواند به طور متعارف در حصه اختصاصی\nخود تصرف بکند لیکن نسبت به سقف بین دو طبقه هر یک از مالکین طبقه فوقانی و تحتانی می تواند در کف یا سقف طبقه اختصاصی\nخود به طور متعارف آن اندازه تصرف نماید که مزاحم حق دیگری نباشد ."}, {"title": "ماده ۱۲۶", "content": "ماده ۱۲۶- صاحب اطاق تحتانی نسبت به دیوارهای اطاق و صاحب فوقانی نسبت به دیوارهای غرفه بالاختصاص و هر دو نسبت به سقف\nمابین اطاق و غرفه بالاشتراک متصرف شناخته می شوند."}, {"title": "ماده ۱۲۷", "content": "ماده ۱۲۷- پله فوقانی ملک صاحب طبقه فوقانی محسوب است مگر اینکه خلاف آن ثابت شود."}, {"title": "ماده ۱۲۸", "content": "ماده ۱۲۸- هیچ یک از صاحبان طبقه تحتانی و غرفه فوقانی نمی تواند دیگری را اجبار به تعمیر یا مساعدت در تعمیر دیوارها و سقف آن\nبنماید."}, {"title": "ماده ۱۲۹", "content": "ماده ۱۲۹- هر گاه سقف واقع مابین عمارت تحتانی و فوقانی خراب شود در صورتی که بین مالک فوقانی و مالک تحتانی موافقت در\nتجدید بنا حاصل نشود و قرارداد ملزمی سابقاً بین آن ها موجود نباشد هر یک از مالکین اگر تبرعاً سقف را تجدید نموده چنانچه با مصالح\nمشترکه ساخته شده باشد سقف مشترک است و اگر با مصالح مختصه ساخته شده متعلق به بانی خواهد بود ."}, {"title": "ماده ۱۳۰", "content": "ماده ۱۳۰- کسی حق ندارد خانه خود را به فضای خانه همسایه بدون اذن او خروجی بدهد و اگر بدون اذن خروجی بدهد ملزم به رفع\nآن خواهد بود."}, {"title": "ماده ۱۳۱", "content": "ماده ۱۳۱- اگر شاخه درخت کسی داخل در فضای خانه یا زمین همسایه شود باید از آنجا عطف کند و اگر نکرد همسایه می تواند آن را\nعطف کند و اگر نشد از حد خانه خود قطع کند و همچنین است حکم ریشه های درخت که داخل ملک غیر می شود."}, {"title": "ماده ۱۳۲", "content": "ماده ۱۳۲- کسی نمی تواند در ملک خود تصرفی کند که مستلزم تضرر همسایه شود مگر تصرفی که به قدر متعارف و برای رفع حاجت\nیا رفع ضرر از خود باشد ."}, {"title": "ماده ۱۳۳", "content": "ماده ۱۳۳- کسی نمی تواند از دیوار خانه خود به خانه همسایه در باز کند اگر چه دیوار ملک مختصی او باشد لیکن می تواند از دیوار\nمختصی خود روزنه یا شبکه باز کند و همسایه حق منع او را ندارد ولی همسایه هم می تواند جلو روزنه و شبکه دیوار بکشد یا پرده\nبیاویزد که مانع رؤیت شود."}, {"title": "ماده ۱۳۴", "content": "ماده ۱۳۴- هیچ یک از اشخاصی که در یک معبر یا یک مجری شریکند نمی توانند شرکای دیگر را مانع از عبور یا بردن آب شوند ."}, {"title": "ماده ۱۳۵", "content": "ماده ۱۳۵- درخت و حَفیره و نحو آن ها که فاصل مابین املاک باشد در حکم دیوار مابین خواهد بود .\nمبحث سوم - در حریم املاک"}, {"title": "ماده ۱۳۶", "content": "ماده ۱۳۶- حریم مقداری از اراضی اطراف ملک و قنات و نهر و امثال آن است که برای کمال انتفاع از آن ضرورت دارد ."}, {"title": "ماده ۱۳۷", "content": "ماده ۱۳۷- حریم چاه برای آب خوردن ( ۲۰) گز و برای زراعت ( ۳۰) گز است."}, {"title": "ماده ۱۳۸", "content": "ماده ۱۳۸- حریم چشمه و قنات از هر طرف در زمین رخوه ( ۵۰۰) گز و در زمین سخت ( ۲۵۰) گز است لیکن اگر مقادیر مذکوره در این\nماده و ماده قبل برای جلوگیری از ضرر کافی نباشد به اندازه ای که برای دفع ضرر کافی باشد به آن افزوده می شود."}, {"title": "ماده ۱۳۹", "content": "ماده ۱۳۹- حریم در حکم ملک صاحب حریم است و تملک و تصرف در آ ن که منافی باشد با آنچه مقصود از حریم است بدون اذن از\nطرف مالک صحیح نیست و بنابراین کسی نمی تواند در حریم چشمه و یا قنات دیگری چاه یا قنات بکند ولی تصرفاتی که موجب تضرر\nنشود جائز است.\nقانون مدنی\nکتاب دوم - در اسباب تملک"}, {"title": "ماده ۱۴۰", "content": "ماده ۱۴۰- تملک حاصل می شود:\n۱) به احیاء اراضی موات و حیازت اشیاء مباحه\n۲) به وسیله عقود و تعهدات\n۳) به وسیله اخذ بشفعه\n۴) به ارث\nقسمت اول - در احیاء اراضی موات و حیازت اشیا مباحه\nباب اول - در احیاء اراضی موات و مباحه"}, {"title": "ماده ۱۴۱", "content": "ماده ۱۴۱- مراد از احیای زمین آنست که اراضی موات و مباحه را به وسیله عملیاتی که در عرف آباد کردن محسوب است از قبیل زراعت،\nدرخت کاری، بنا ساختن و غیره قابل استفاده نمایند ."}, {"title": "ماده ۱۴۲", "content": "ماده ۱۴۲- شروع در احیاء از قبیل سنگ چیدن اطراف زمین یا کندن چاه و غیره تحجیر است و موجب مالکیت نمی شود ولی برای\nتحجیرکننده ایجاد حق اولویت در احیاء می نماید."}, {"title": "ماده ۱۴۳", "content": "ماده ۱۴۳- هر کس از اراضی موات و مباحه قسمتی را به قصد تملک احیاء کند مالک آن قسمت می شود."}, {"title": "ماده ۱۴۴", "content": "ماده ۱۴۴- احیای اطراف زمین موجب تملک وسط آن نیز می باشد."}, {"title": "ماده ۱۴۵", "content": "ماده ۱۴۵- احیاء کننده باید قوانین دیگر مربوطه به این موضوع را از هر حیث رعایت نماید .\nباب دوم - در حیازت مباحات"}, {"title": "ماده ۱۴۶", "content": "ماده ۱۴۶- مقصود از حیازت تصرف و وضع ید است یا مهیا کردن وسایل تصرف و استیلا ."}, {"title": "ماده ۱۴۷", "content": "ماده ۱۴۷- هر کس مال مباحی را با رعایت قوانین مربوطه به آن حیازت کند مالک آن می شود."}, {"title": "ماده ۱۴۸", "content": "ماده ۱۴۸- هر کس در زمین مباح نهری بکند و متصل کند به رودخانه آن نهر را احیاء کرده و مالک آن نهر می شود ولی مادامی که\nمتصل به رودخانه نشده است تحجیر محسوب است."}, {"title": "ماده ۱۴۹", "content": "ماده ۱۴۹- هر گاه کسی به قصد حیازت میاه مباحه نهر یا مجری احداث کند آب مباحی که در نهر یا مجرای مزبور وارد شود ملک صاحب\nمجری است و بدون اذن مالک نمیتوان از آن نهری جدا کرد یا زمینی مشروب نمود ."}, {"title": "ماده ۱۵۰", "content": "ماده ۱۵۰- هر گاه چند نفر در کندن مجری یا چاه شریک شوند به نسبت عمل و مخارجی که موجب تفاوت عمل باشد مالک آب آن\nمی شوند و به همان نسبت بین آنها تقسیم می شود."}, {"title": "ماده ۱۵۱", "content": "ماده ۱۵۱- یکی از شرکا نمی تواند از مجرای مشترک مجرایی جدا کند یا دهنه نهر را وسیع یا تنگ کند یا روی آن پل یا آسیاب بسازد یا\nاطراف آن درخت بکارد یا هر نحو تصرفی کند مگر به اذن سایر شرکا ."}, {"title": "ماده ۱۵۲", "content": "ماده ۱۵۲- اگر نصیب مفروض یکی از شرکا از آب نهر مشترک داخل مجرای مختصی آن شخص شود آن آب ملک مخصوص آن می شود\nو هر نحو تصرفی در آن می تواند بکند."}, {"title": "ماده ۱۵۳", "content": "ماده ۱۵۳- هر گاه نهری مشترک مابین جماعتی باشد و در مقدار نصیب هر یک از آن ها اختلاف شود حکم به تساوی نصیب آنها می شود\nمگر اینکه دلیلی بر زیادتی نصیب بعضی از آنها موجود باشد."}, {"title": "ماده ۱۵۴", "content": "ماده ۱۵۴- کسی نمی تواند از ملک غیر، آب به ملک خود ببرد بدون اذن مالک اگر چه راه دیگری نداشته باشد .\nقانون مدنی"}, {"title": "ماده ۱۵۵", "content": "ماده ۱۵۵- هر کس حق دارد از نهرهای مباحه اراضی خود را مشروب کند یا برای زمین و آسیاب و سایر حوائج خود از آن نهر جدا کند ."}, {"title": "ماده ۱۵۶", "content": "ماده ۱۵۶- هر گاه آب نهر کافی نباشد که تمام اراضی اطراف آن مشروب شود و مابین صاحبان اراضی در تقدم و تأخر اختلاف شود و\nهیچ یک نتواند حق تقدم خود را ثابت کند با رعایت ترتیب هر زمینی که به منبع آب نزدیکتر است به قدر حاجت حق تقدم بر زمین\nپایینتر خواهد داشت."}, {"title": "ماده ۱۵۷", "content": "ماده ۱۵۷- هر گاه دو زمین در دو طرف نهر محاذی هم واقع شوند و حق تقدم یکی بر دیگری محرز نباشد و هر دو در یک زمان بخواهند\nآب ببرند و آب کافی برای هر دو نباشد باید برای تقدم و تأخر در بردن آب به نسبت حصه قرعه زده و اگر آب کافی برای هر دو باشد به\nنسبت حصه تقسیم میکنند."}, {"title": "ماده ۱۵۸", "content": "ماده ۱۵۸- هر گاه تاریخ احیای اراضی اطراف رودخانه مختلف باشد زمینی که احیای آن مقدم بوده است در آب نیز مقدم می شود بر زمین\nمتأخر در احیاء اگر چه پایینتر از آن باشد."}, {"title": "ماده ۱۵۹", "content": "ماده ۱۵۹- هر گاه کسی بخواهد جدیداً زمینی در اطراف رودخانه احیاء کند اگر آب رودخانه زیاد باشد و برای صاحبان اراضی سابقه تضییقی\nنباشد می تواند از آب رودخانه زمین جدید را مشروب کند و الا حق بردن آب ندارد اگر چه زمین او بالاتر از سایر اراضی باشد ."}, {"title": "ماده ۱۶۰", "content": "ماده ۱۶۰- هر کس در زمین خود یا اراضی مباحه به قصد تملک قنات یا چاهی بکند تا به آب برسد یا چشمه جاری کند مالک آب آن\nمی شود و در اراضی مباحه مادامی که به آب نرسیده تحجیر محسوب است .\nباب سوم - در معادن"}, {"title": "ماده ۱۶۱", "content": "ماده ۱۶۱- معدنی که در زمین کسی واقع شده باشد ملک صاحب زمین است و استخراج آن تابع قوانین مخصوصه خواهد بود.\nباب چهارم - در اشیاء پیدا شده و حیوانات ضاله\nفصل اول - در اشیاء پیدا شده"}, {"title": "ماده ۱۶۲ (اصلاحی ۱۴/ ۸/۱۳۷۰)", "content": "ماده ۱۶۲ (اصلاحی ۱۴/ ۸/۱۳۷۰)- هر کس مالی پیدا کند که قیمت آن کمتر از یک درهم که وزن آن ۶/۱۲ نخود نقره باشد، می تواند آن\nرا تملک کند ."}, {"title": "ماده ۱۶۳ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۶۳ (اصلاحی ۱۴/۸/۱۳۷۰)- اگر قیمت مال پیداشده یک درهم که وزن آن ۶/۱۲ نخود نقره یا بیشتر باشد، پیداکننده باید یک\nسال تعریف کند و اگر در مدت مزبور صاحب مال پیدا نشد، مشارالیه مختار است که آن را به طور امانت نگاه دارد یا تصرف دیگری در\nآن بکند در صورتی که آن را به طور امانت نگاه دارد و بدون تقصیر او تلف شود، ضامن نخواهد بود .\nتبصره (الحاقی ۱۴/۸/۱۳۷۰)- در صورتی که پیداکننده مال از همان ابتدا یا پیش از پایان مدت یک سال علم حاصل کند که تعریف\nبیفایده است و یا از یافتن صاحب مال مأیوس گردد تکلیف تعریف از او ساقط می شود."}, {"title": "ماده ۱۶۴ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۶۴ (اصلاحی ۱۴/۸/۱۳۷۰)- تعریف اشیای پیداشده عبارتست از نشر و اعلان بر حسب مقررات شرعی به نحوی که بتوان گفت که\nعادتاً به اطلاع اهالی محل رسیده است ."}, {"title": "ماده ۱۶۵", "content": "ماده ۱۶۵- هر کس در بیابان یا خرابه که خالی از سکنه بوده و مالک خاصی ندارد مالی پیدا کند می تواند آن را تملک کند و محتاج به\nتعریف نیست مگر اینکه معلوم باشد که مال عهد زمان حاضر است در این صورت در حکم سایر اشیای پیداشده در آبادی خواهد بود ."}, {"title": "ماده ۱۶۶", "content": "ماده ۱۶۶- اگر کسی در ملک غیر یا ملکی که از غیر خریده مالی پیدا کند یا احتمال بدهد که مال مالک فعلی یا مالکین سابق است باید\nبه آنها اطلاع بدهد اگر آن ها مدعی مالکیت شدند و به قرائن مالکیت آن ها معلوم شد باید به آنها بدهد و الا به طریقی که فوقاً مقرر\nاست رفتار نماید ."}, {"title": "ماده ۱۶۷", "content": "ماده ۱۶۷- اگر مالی که پیدا شده است ممکن نیست باقی بماند و فاسد میشود باید به قیمت عادله فروخته شود و قیمت آن در حکم\nخود مال پیدا شده خواهد بود."}, {"title": "ماده ۱۶۸", "content": "ماده ۱۶۸- اگر مال پیداشده در زمان تعریف بدون تقصیر پیداکننده تلف شود مشارالیه ضامن نخواهد بود .\nقانون مدنی"}, {"title": "ماده ۱۶۹", "content": "ماده ۱۶۹- منافعی که از مال پیداشده حاصل می شود قبل از تملک متعلق به صاحب آنست و بعد از تملک مال پیدا کننده است.\nفصل دوم - در حیوانات ضالّه"}, {"title": "ماده ۱۷۰", "content": "ماده ۱۷۰- حیوان گمشده (ضالّه) عبارت از هر حیوان مملوکی است که بدون متصرف یافت شود ولی اگر حیوان مزبور در چراگاه یا\nنزدیک آبی یافت شود یا متمکن از دفاع خود در مقابل حیوانات درنده باشد ضاله محسوب نمی گردد ."}, {"title": "ماده ۱۷۱", "content": "ماده ۱۷۱- هر کس حیوانات ضاله پیدا نماید باید آن را به مالک آن رد کند و اگر مالک را نشناسد باید به حاکم یا قائم مقام او تسلیم\nکند و الا ضامن خواهد بود اگر چه آن را بعد از تصرف رها کرده باشد ."}, {"title": "ماده ۱۷۲", "content": "ماده ۱۷۲- اگر حیوان گمشده در نقاط مسکونه یافت شود و پیدا کننده با دسترسی به حاکم یا قائم مقام او آن را تسلیم نکند حق مطالبه\nمخارج نگاهداری آن را از مالک نخواهد داشت. هر گاه حیوان ضاله در نقاط غیر مسکونه یافت شود پیداکننده می تواند مخارج نگاهداری\nآن را از مالک مطالبه کند مشروط بر اینکه از حیوان انتفاعی نبرده باشد و الا مخارج نگاهداری با منافع حاصله احتساب و پیداکننده یا\nمالک فقط برای بقیه، حق رجوع به یکدیگر را خواهد داشت .\nباب پنجم - در دفینه"}, {"title": "ماده ۱۷۳", "content": "ماده ۱۷۳- دفینه مالی است که در زمین یا بنایی دفن شده و بر حسب اتفاق و تصادف پیدا می شود."}, {"title": "ماده ۱۷۴", "content": "ماده ۱۷۴- دفینه که مالک آن معلوم نباشد ملک کسی است که آن را پیدا کرده است ."}, {"title": "ماده ۱۷۵", "content": "ماده ۱۷۵- اگر کسی در ملک غیر دفینه پیدا نماید باید به مالک اطلاع دهد اگر مالک زمین مدعی مالکیت دفینه شد و آن را ثابت کرد\nدفینه به مدعی مالکیت تعلق می گیرد ."}, {"title": "ماده ۱۷۶", "content": "ماده ۱۷۶- دفینه که در اراضی مباحه کشف شود متعلق به مستخرج آنست ."}, {"title": "ماده ۱۷۷", "content": "ماده ۱۷۷- جواهری که از دریا استخراج می شود ملک کسی است که آن را استخراج کرده است و آنچه که آب به ساحل می اندازد ملک\nکسی است که آن را حیازت نماید ."}, {"title": "ماده ۱۷۸", "content": "ماده ۱۷۸- مالی که در دریا غرق شده و مالک از آن اعراض کرده است مال کسی است که آن را بیرون بیاورد .\nباب ششم - در شکار"}, {"title": "ماده ۱۷۹", "content": "ماده ۱۷۹- شکار کردن موجب تملک است ."}, {"title": "ماده ۱۸۰", "content": "ماده ۱۸۰- شکار حیوانات اهلی و حیوانات دیگری که علامت مالکیت در آن باشد موجب تملک نمی شود."}, {"title": "ماده ۱۸۱", "content": "ماده ۱۸۱- اگر کسی کندو یا محلی برای زنبورعسل تهیه کند زنبورعسلی که در آن جمع می شوند ملک آن شخص است همین طور است\nحکم کبوتر که در برج کبوتر جمع شود."}, {"title": "ماده ۱۸۲", "content": "ماده ۱۸۲- مقررات دیگر راجع به شکار به موجب نظامات مخصوصه معین خواهد شد .\nقسمت دوم - در عقود و معاملات و الزامات\nباب اول - در عقود و تعهدات بطور کلی"}, {"title": "ماده ۱۸۳", "content": "ماده ۱۸۳- عقد عبارت است از اینکه یک یا چند نفر در مقابل یک یا چند نفر دیگر تعهد بر امری نمایند و مورد قبول آن ها باشد.\nفصل اول - در اقسام عقود و معاملات"}, {"title": "ماده ۱۸۴", "content": "ماده ۱۸۴- عقود و معاملات به اقسام ذیل منقسم می شوند:\nلازم، جائز، خیاری، منجز و معلق .\nقانون مدنی"}, {"title": "ماده ۱۸۵", "content": "ماده ۱۸۵- عقد لازم آنست که هیچ یک از طرفین معامله حق فسخ آن را نداشته باشد مگر در موارد معینه ."}, {"title": "ماده ۱۸۶", "content": "ماده ۱۸۶- عقد جائز آنست که هر یک از طرفین بتواند هر وقتی بخواهد فسخ کند ."}, {"title": "ماده ۱۸۷", "content": "ماده ۱۸۷- عقد ممکن است به یک طرف لازم باشد و نسبت به طرف دیگر جائز ."}, {"title": "ماده ۱۸۸", "content": "ماده ۱۸۸- عقد خیاری آنست که برای طرفین یا یکی از آن ها یا برای ثالثی اختیار فسخ باشد ."}, {"title": "ماده ۱۸۹", "content": "ماده ۱۸۹- عقد منجز آنست که تأثیر آن بر حسب انشا موقوف به امر دیگری نباشد و الا معلق خواهد بود.\nفصل دوم - در شرایط اساسی برای صحت معامله"}, {"title": "ماده ۱۹۰", "content": "ماده ۱۹۰- برای صحت هر معامله شرایط ذیل اساسی است :\n۱ )قصد طرفین و رضای آن ها\n۲ )اهلیت طرفین\n۳ )موضوع معین که مورد معامله باشد\n۴ )مشروعیت جهت معامله\nمبحث اول - در قصد طرفین و رضای آن ها"}, {"title": "ماده ۱۹۱", "content": "ماده ۱۹۱- عقد محقق می شود به قصد انشا به شرط مقرون بودن به چیزی که دلالت بر قصد کند ."}, {"title": "ماده ۱۹۲", "content": "ماده ۱۹۲- در مواردی که برای طرفین یا یکی از آن ها تلفظ ممکن نباشد اشاره که مبین قصد و رضا باشد کافی خواهد بود ."}, {"title": "ماده ۱۹۳", "content": "ماده ۱۹۳- انشای معامله ممکن است به وسیله عملی که مبین قصد و رضا باشد مثل قبض و اقباض حاصل گردد مگر در مواردی\nکه قانون استثنا کرده باشد ."}, {"title": "ماده ۱۹۴", "content": "ماده ۱۹۴- الفاظ و اشارات و اعمال دیگر که متعاملین به وسیله آن انشا معامله می نمایند باید موافق باشد به نحوی که احد طرفین\nهمان عقدی را قبول کند که طرف دیگر قصد انشای او را داشته است و الا معامله باطل خواهد بود ."}, {"title": "ماده ۱۹۵", "content": "ماده ۱۹۵- اگر کسی در حال مستی یا بیهوشی یا در خواب معامله نماید آن معامله به واسطه فقدان قصد باطل است."}, {"title": "ماده ۱۹۶", "content": "ماده ۱۹۶- کسی که معامله می کند آن معامله برای خود آن شخص محسوب است مگر اینکه در موقع عقد خلاف آن را تصریح نماید\nیا بعد خلاف آن ثابت شود معذلک ممکن است در ضمن معامله که شخص برای خود می کند تعهدی هم به نفع شخص ثالثی بنماید."}, {"title": "ماده ۱۹۷", "content": "ماده ۱۹۷- در صورتی که ثمن یا مثمن معامله عین متعلق به غیر باشد آن معامله برای صاحب عین خواهد بود ."}, {"title": "ماده ۱۹۸", "content": "ماده ۱۹۸- ممکن است طرفین یا یکی از آن ها به وکالت از غیر اقدام بنماید و نیز ممکن است که یک نفر به وکالت از طرف متعاملین\nاین اقدام را به عمل آورد ."}, {"title": "ماده ۱۹۹", "content": "ماده ۱۹۹- رضای حاصل در نتیجه اشتباه یا اکراه موجب نفوذ معامله نیست ."}, {"title": "ماده ۲۰۰", "content": "ماده ۲۰۰- اشتباه وقتی موجب عدم نفوذ معامله است که مربوط به خود موضوع معامله باشد."}, {"title": "ماده ۲۰۱", "content": "ماده ۲۰۱- اشتباه در شخص طرف به صحت معامله خللی وارد نمی آورد مگر در مواردی که شخصیت طرف علت عمده عقد بوده باشد ."}, {"title": "ماده ۲۰۲", "content": "ماده ۲۰۲- اکراه به اعمالی حاصل می شود که مؤثر در شخص باشعوری بوده و او را نسبت به جان یا مال یا آبروی خود تهدید کند به\nنحوی که عادتا قابل تحمل نباشد. در مورد اعمال اکراه آمیز سن و شخصیت و اخلاق و مرد یا زن بودن شخص باید در نظر گرفته شود ."}, {"title": "ماده ۲۰۳", "content": "ماده ۲۰۳- اکراه موجب عدم نفوذ معامله است اگر چه از طرف شخص خارجی غیر از متعاملین واقع شود .\nقانون مدنی"}, {"title": "ماده ۲۰۴", "content": "ماده ۲۰۴- تهدید طرف معامله در نفس یا جان یا آبروی اقوام نزدیک او از قبیل زوج و زوجه و آباء و اولاد موجب اکراه است. در مورد\nاین ماده تشخیص نزدیکی درجه برای مؤثر بودن اکراه بسته به نظر عرف است ."}, {"title": "ماده ۲۰۵", "content": "ماده ۲۰۵- هر گاه شخصی که تهدید شده است بداند که تهدیدکننده نمیتواند تهدید خود را به موقع اجرا گذارد و یا خود شخص مزبور\nقادر باشد بر اینکه بدون مشقت اکراه را از خود دفع کند و معامله را واقع نسازد آن شخص مکره محسوب نمی شود."}, {"title": "ماده ۲۰۶", "content": "ماده ۲۰۶- اگر کسی در نتیجه اضطرار اقدام به معامله کند مکرَه محسوب نشده و معامله اضطراری معتبر خواهد بود ."}, {"title": "ماده ۲۰۷", "content": "ماده ۲۰۷- ملزم شدن شخص به انشای معامله به حکم مقامات صالحه قانونی اکراه محسوب نمی شود."}, {"title": "ماده ۲۰۸", "content": "ماده ۲۰۸- مجرد خوف از کسی بدون آ ن که از طرف آن کس تهدیدی شده باشد اکراه محسوب نمی شود."}, {"title": "ماده ۲۰۹", "content": "ماده ۲۰۹- امضای معامله بعد از رفع اکراه موجب نفوذ معامله است .\nمبحث دوم - در اهلیت طرفین"}, {"title": "ماده ۲۱۰", "content": "ماده ۲۱۰- متعاملین باید برای معامله اهلیت داشته باشند ."}, {"title": "ماده ۲۱۱", "content": "ماده ۲۱۱- برای اینکه متعاملین اهل محسوب شوند باید بالغ و عاقل و رشید باشند ."}, {"title": "ماده ۲۱۲", "content": "ماده ۲۱۲- معامله با اشخاصی که بالغ یا عاقل یا رشید نیستند به واسطه عدم اهلیت باطل است ."}, {"title": "ماده ۲۱۳", "content": "ماده ۲۱۳- معامله محجورین نافذ نیست.\nمبحث سوم - در مورد معامله"}, {"title": "ماده ۲۱۴", "content": "ماده ۲۱۴- مورد معامله باید مال یا عملی باشد که هر یک از متعاملین تعهد تسلیم یا ایفاء آن را می کنند."}, {"title": "ماده ۲۱۵", "content": "ماده ۲۱۵- مورد معامله باید مالیت داشته و متضمن منفعت عقلایی مشروع باشد ."}, {"title": "ماده ۲۱۶", "content": "ماده ۲۱۶- مورد معامله باید مبهم نباشد مگر در موارد خاصه که علم اجمالی به آن کافی است .\nمبحث چهارم - در جهت معامله"}, {"title": "ماده ۲۱۷", "content": "ماده ۲۱۷- در معامله لازم نیست که جهت آن تصریح شود ولی اگر تصریح شده باشد باید مشروع باشد و الا معامله باطل است ."}, {"title": "ماده ۲۱۸ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۲۱۸ (اصلاحی ۱۴/۸/۱۳۷۰)- هرگاه معلوم شود که معامله با قصد فرار از دین به طور صوری انجام شده آن معامله باطل است ."}, {"title": "ماده ۲۱۸ مکرر (الحاقی ۱۴/۸/۱۳۷۰)", "content": "ماده ۲۱۸ مکرر (الحاقی ۱۴/۸/۱۳۷۰)- هرگاه طلبه کار به دادگاه دادخواست داده دلائل اقامه نماید که مدیون برای فرار از دین قصد\nفروش اموال خود را دارد، دادگاه می تواند قرار توقیف اموال وی را به میزان بدهی او صادر نماید که در این صورت بدون اجازه دادگاه\nحق فروش اموال را نخواهد داشت .\nفصل سوم - در اثر معاملات\nمبحث اول - در قواعد عمومی"}, {"title": "ماده ۲۱۹", "content": "ماده ۲۱۹- عقودی که بر طبق قانون واقع شده باشد بین متعاملین و قائممقام آن ها لازم الاتباع است مگر اینکه به رضای طرفین اقاله یا\nبه علت قانونی فسخ شود."}, {"title": "ماده ۲۲۰", "content": "ماده ۲۲۰- عقود نه فقط متعاملین را به اجرای چیزی که در آن تصریح شده است ملزم می نماید بلکه متعاملین به کلیه نتایجی هم که\nبه موجب عرف و عادت یا به موجب قانون از عقد حاصل می شود ملزم می باشند."}, {"title": "ماده ۲۲۱", "content": "ماده ۲۲۱- اگر کسی تعهد اقدام به امری را بکند یا تعهد نماید که از انجام امری خودداری کند در صورت تخلف مسئول خسارت طرف\nمقابل است مشروط بر اینکه جبران خسارت تصریح شده و یا تعهد عرفاً به منزله تصریح باشد و یا بر حسب قانون موجب ضمان باشد .\nقانون مدنی"}, {"title": "ماده ۲۲۲", "content": "ماده ۲۲۲- در صورت عدم ایفای تعهد با رعایت ماده فوق حاکم می تواند به کسی که تعهد به نفع او شده است اجازه دهد که خود او\nعمل را انجام دهد و متخلف را به تأدیه مخارج آن محکوم نماید ."}, {"title": "ماده ۲۲۳", "content": "ماده ۲۲۳- هر معامله که واقع شده باشد محمول بر صحت است مگر اینکه فساد آن معلوم شود."}, {"title": "ماده ۲۲۴", "content": "ماده ۲۲۴- الفاظ عقود محمول است بر معانی عرفیه ."}, {"title": "ماده ۲۲۵", "content": "ماده ۲۲۵- متعارف بودن امری در عرف و عادت به طوری که عقد بدون تصریح هم منصرف به آن باشد به منزله ذکر در عقد است .\nمبحث دوم - در خسارات حاصله از عدم اجرای تعهدات"}, {"title": "ماده ۲۲۶", "content": "ماده ۲۲۶- در مورد عدم ایفای تعهدات از طرف یکی از متعاملین طرف دیگر نمی تواند ادعای خسارت نماید مگر اینکه برای ایفای تعهد\nمدت معینی مقرر شده و مدت مزبور منقضی شده باشد و اگر برای ایفای تعهد مدتی مقرر نبوده طرف وقتی می تواند ادعای خسارت\nنماید که اختیار موقع انجام با او بوده و ثابت نماید که انجام تعهد را مطالبه کرده است ."}, {"title": "ماده ۲۲۷", "content": "ماده ۲۲۷- متخلف از انجام تعهد وقتی محکوم به تأدیه خسارت می شود که نتواند ثابت نماید که عدم انجام به واسطه علت خارجی\nبوده است که نمیتوان مربوط به او نمود."}, {"title": "ماده ۲۲۸", "content": "ماده ۲۲۸- در صورتی که موضوع تعهد تأدیه وجه نقدی باشد حاکم می تواند با رعایت ماده ۲۲۱ مدیون را به جبران خسارت حاصله از\nتأخیر در تأدیه دین محکوم نماید."}, {"title": "ماده ۲۲۹", "content": "ماده ۲۲۹- اگر متعهد به واسطه حادثه که دفع آن خارج از حیطه اقتدار اوست نتواند از عهده تعهد خود برآید محکوم به تأدیه خسارت\nنخواهد بود."}, {"title": "ماده ۲۳۰", "content": "ماده ۲۳۰- اگر در ضمن معامله شرط شده باشد که در صورت تخلف متخلف مبلغی به عنوان خسارت تأدیه نماید حاکم نمی تواند او را\nبه بیشتر یا کمتر از آن چه که ملزم شده است محکوم کند.\nمبحث سوم - در اثر عقود نسبت باشخاص ثالث"}, {"title": "ماده ۲۳۱", "content": "ماده ۲۳۱- معاملات و عقود فقط درباره طرفین متعاملین و قائم مقام قانونی آنها مؤثر است مگر در مورد ماده ۱۹۶.\nفصل چهارم - در بیان شرایطی که در ضمن عقد می شود\nمبحث اول - در اقسام شرط"}, {"title": "ماده ۲۳۲", "content": "ماده ۲۳۲- شروط مفصله ذیل باطل است ولی مفسد عقد نیست:\n۱- شرطی که انجام آن غیر مقدور باشد .\n۲- شرطی که در آن نفع و فایده نباشد .\n۳- شرطی که نامشروع باشد ."}, {"title": "ماده ۲۳۳", "content": "ماده ۲۳۳- شروط مفصله ذیل باطل و موجب بطلان عقد است.\n۱- شرط خلاف مقتضای عقد .\n۲- شرط مجهولی که جهل به آن موجب جهل به عوضین شود ."}, {"title": "ماده ۲۳۴", "content": "ماده ۲۳۴- شرط بر سه قسم است :\n۱- شرط صفت\n۲- شرط نتیجه\n۳- شرط فعل اثباتاً یا نفیاً .\nقانون مدنی\nشرط صفت عبارت است از شرط راجعه به کیفیت یا کمیت مورد معامله. شرط نتیجه آن است که تحقق امری در خارج شرط شود.\nشرط فعل آنست که اقدام یا عدم اقدام به فعلی بر یکی از متعاملین یا بر شخص خارجی شرط شود .\nمبحث دوم - در احکام شرط"}, {"title": "ماده ۲۳۵", "content": "ماده ۲۳۵- هر گاه شرطی که در ضمن عقد شده است شرط صفت باشد و معلوم شود آن صفت موجود نیست کسی که شرط به نفع\nاو شده است خیار فسخ خواهد داشت."}, {"title": "ماده ۲۳۶", "content": "ماده ۲۳۶- شرط نتیجه در صورتی که حصول آن نتیجه موقوف به سبب خاصی نباشد آن نتیجه به نفس اشتراط حاصل می شود."}, {"title": "ماده ۲۳۷", "content": "ماده ۲۳۷- هر گاه شرط در ضمن عقد شرط فعل باشد اثباتاً یا نفیاً کسی که ملتزم به انجام شرط شده است باید آن را بجا بیاورد و در\nصورت تخلف طرف معامله می تواند به حاکم رجوع نموده تقاضای اجبار به وفای شرط بنماید ."}, {"title": "ماده ۲۳۸", "content": "ماده ۲۳۸- هر گاه فعلی در ضمن عقد شرط شود و اجبار ملتزم به انجام آن غیر مقدور ولی انجام آن به وسیله شخص دیگری مقدور\nباشد حاکم می تواند به خرج ملتزم موجبات انجام آن فعل را فراهم کند ."}, {"title": "ماده ۲۳۹", "content": "ماده ۲۳۹- هر گاه اجبار مشروط علیه برای انجام فعل مشروط ممکن نباشد و فعل مشروط هم از جمله اعمالی نباشد که دیگری بتواند\nاز جانب او واقع سازد طرف مقابل حق فسخ معامله را خواهد داشت ."}, {"title": "ماده ۲۴۰", "content": "ماده ۲۴۰- اگر بعد از عقد انجام شرط ممتنع شود یا معلوم شود که حین العقد ممتنع بوده است کسی که شرط بر نفع او شده است\nاختیار فسخ معامله را خواهد داشت مگر اینکه امتناع مستند به فعل مشروط له باشد."}, {"title": "ماده ۲۴۱", "content": "ماده ۲۴۱- ممکن است در معامله شرط شود که یکی از متعاملین برای آنچه که به واسطه معامله مشغول الذمه می شود رهن یا ضامن\nبدهد."}, {"title": "ماده ۲۴۲", "content": "ماده ۲۴۲- هر گاه در عقد شرط شده باشد که مشروط علیه مال معین را رهن دهد و آن مال تلف یا معیوب شود مشروط له اختیار فسخ\nمعامله را خواهد داشت نه حق مطالبه عوض رهن یا ارش عیب و اگر بعد از آ نکه مال را مشروط له به رهن گرفت آن مال تلف یا\nمعیوب شود دیگر اختیار فسخ ندارد ."}, {"title": "ماده ۲۴۳", "content": "ماده ۲۴۳- هر گاه در عقد شرط شده باشد که ضامنی داده شود و این شرط انجام نگیرد مشروط له حق فسخ معامله را خواهد داشت ."}, {"title": "ماده ۲۴۴", "content": "ماده ۲۴۴- طرف معامله که شرط به نفع او شده می تواند از عمل به آن شرط صرف نظر کند که در این صورت مثل آنست که این شرط\nدر معامله قید نشده باشد لیکن شرط نتیجه قابل اسقاط نیست ."}, {"title": "ماده ۲۴۵", "content": "ماده ۲۴۵- اسقاط حق حاصل از شرط ممکن است به لفظ باشد یا به فعل یعنی عملی که دلالت بر اسقاط شرط نماید ."}, {"title": "ماده ۲۴۶", "content": "ماده ۲۴۶- در صورتی که معامله به واسطه اقاله یا فسخ به هم بخورد شرطی که در ضمن آن شده است باطل می شود و اگر کسی که\nملزم به انجام شرط بوده است عمل به شرط کرده باشد می تواند عوض او را از مشروط له بگیرد .\nفصل پنجم - در معاملاتی که موضوع آن مال غیر است یا معاملات فضولی"}, {"title": "ماده ۲۴۷", "content": "ماده ۲۴۷- معامله به مال غیر جز به عنوان ولایت یا وصایت یا وکالت نافذ نیست ولو اینکه صاحب مال باطناً راضی باشد ولی اگر مالک\nیا قائممقام او پس از وقوع معامله آن را اجازه نمود در این صورت معامله صحیح و نافذ می شود."}, {"title": "ماده ۲۴۸", "content": "ماده ۲۴۸- اجازه مالک نسبت به معامله فضولی حاصل می شود به لفظ یا فعلی که دلالت بر امضای عقد نماید."}, {"title": "ماده ۲۴۹", "content": "ماده ۲۴۹- سکوت مالک ولو با حضور در مجلس عقد اجازه محسوب نمی شود."}, {"title": "ماده ۲۵۰", "content": "ماده ۲۵۰- اجازه در صورتی مؤثر است که مسبوق برد نباشد و الا اثری ندارد .\nقانون مدنی"}, {"title": "ماده ۲۵۱", "content": "ماده ۲۵۱- رد معامله فضولی حاصل می شود به هر لفظ یا فعلی که دلالت بر عدم رضای به آن نماید ."}, {"title": "ماده ۲۵۲", "content": "ماده ۲۵۲- لازم نیست اجازه یا رد فوری باشد.اگر تأخیر موجب تضرر طرف اصیل باشد مشارالیه می تواند معامله را به هم بزند ."}, {"title": "ماده ۲۵۳", "content": "ماده ۲۵۳- در معامله فضولی اگر مالک قبل از اجازه یا رد فوت نماید اجازه یا رد با وارث است ."}, {"title": "ماده ۲۵۴", "content": "ماده ۲۵۴- هر گاه کسی نسبت به مال غیر معامله نماید و بعد از آن به نحوی از انحا به معامله کننده فضولی منتقل شود صرف تملک\nموجب نفوذ معامله سابقه نخواهد بود."}, {"title": "ماده ۲۵۵", "content": "ماده ۲۵۵- هر گاه کسی نسبت به مالی معامله به عنوان فضولی نماید و بعد معلوم شود که آن مال ملک معامله کننده بوده است یا\nملک کسی بوده است که معاملهکننده می توانسته است از قبل او ولایتاً یا وکالتاً معامله نماید در این صورت نفوذ و صحت معامله\nموکول به اجازه معامل است و الا معامله باطل خواهد بود ."}, {"title": "ماده ۲۵۶", "content": "ماده ۲۵۶- هر گاه کسی مال خود و مال غیر را به یک عقدی منتقل کند یا انتقال مالی را برای خود و دیگری قبول کند معامله نسبت به\nخود او نافذ و نسبت به غیر فضولی است."}, {"title": "ماده ۲۵۷", "content": "ماده ۲۵۷- اگر عین مالی که موضوع معامله فضولی بوده است قبل از اینکه مالک معامله فضولی را اجازه یا رد کند مورد معامله دیگر\nنیز واقع شود مالک می تواند هر یک از معاملات را که بخواهد اجازه کند در این صورت هر یک را اجازه کرد معاملات بعد از آن نافذ و\nسابق بر آن باطل خواهد بود."}, {"title": "ماده ۲۵۸", "content": "ماده ۲۵۸- نسبت به منافع مالی که مورد معامله فضولی بوده است و همچنین نسبت به منافع حاصله از عوض آن اجازه یا رد از روز\nعقد مؤثر خواهد بود."}, {"title": "ماده ۲۵۹", "content": "ماده ۲۵۹- هر گاه معامل فضولی مالی را که موضوع معامله بوده است به تصرف متعامل داده باشد و مالک آن معامله را اجازه نکند\nمتصرف ضامن عین و منافع است ."}, {"title": "ماده ۲۶۰", "content": "ماده ۲۶۰- در صورتی که معامل فضولی عوض مالی را که موضوع معامله بوده است گرفته و در نزد خود داشته باشد و مالک با اجازه\nمعامله قبض عوض را نیز اجازه کند دیگر حق رجوع به طرف دیگر نخواهد داشت ."}, {"title": "ماده ۲۶۱", "content": "ماده ۲۶۱- در صورتی که مبیع فضولی به تصرف مشتری داده شود هر گاه مالک معامله را اجازه نکرد مشتری نسبت به اصل مال و منافع\nمدتی که در تصرف او بوده ضامن است اگر چه منافع را استیفا نکرده باشد و همچنین است نسبت به هر عیبی که در مدت تصرف\nمشتری حادث شده باشد."}, {"title": "ماده ۲۶۲", "content": "ماده ۲۶۲- در مورد ماده قبل مشتری حق دارد که برای استرداد ثمن عیناً یا مثلاً یا قیمتاً به بایع فضولی رجوع کند ."}, {"title": "ماده ۲۶۳", "content": "ماده ۲۶۳- هر گاه مالک معامله را اجازه نکند و مشتری هم بر فضولی بودن آن جاهل باشد حق دارد که برای ثمن و کلیه غرامات به بایع\nفضولی رجوع کند و در صورت عالم بودن فقط حق رجوع برای ثمن را خواهد داشت .\nفصل ششم - در سقوط تعهدات"}, {"title": "ماده ۲۶۴", "content": "ماده ۲۶۴- تعهدات به یکی از طرق ذیل ساقط می شود:\n۱- به وسیله وفای به عهد.\n۲- به وسیله اقاله.\n۳- به وسیله ابراء .\n۴- به وسیله تبدیل تعهد.\n۵- به وسیله تهاتر.\n۶- به وسیله مالکیت مافی الذّمه .\nقانون مدنی\nمبحث اول - در وفاء به عهد"}, {"title": "ماده ۲۶۵", "content": "ماده ۲۶۵- هر کس مالی به دیگری بدهد ظاهر در عدم تبرع است بنابراین اگر کسی چیزی به دیگری بدهد بدون اینکه مقروض آن چیز\nباشد می تواند استرداد کند ."}, {"title": "ماده ۲۶۶", "content": "ماده ۲۶۶- در مورد تعهداتی که برای متعهدله قانوناً حق مطالبه نمی باشد اگر متعهد به میل خود آن را ایفا نماید دعوی استرداد او\nمسموع نخواهد بود."}, {"title": "ماده ۲۶۷", "content": "ماده ۲۶۷- ایفای دین از جانب غیر مدیون هم جائز است اگر چه از طرف مدیون اجازه نداشته باشد ولیکن کسی که دین دیگری را ادا\nمی کند اگر با اذن باشد حق مراجعه به او دارد و الا حق رجوع ندارد ."}, {"title": "ماده ۲۶۸", "content": "ماده ۲۶۸- انجام فعلی در صورتی که مباشرت شخص متعهد شرط شده باشد به وسیله دیگری ممکن نیست مگر با رضایت متعهدله ."}, {"title": "ماده ۲۶۹", "content": "ماده ۲۶۹- وفای به عهد وقتی محقق می شود که متعهد چیزی را که می دهد مالک و یا مأذون از طرف مالک باشد و شخصا هم اهلیت\nداشته باشد."}, {"title": "ماده ۲۷۰", "content": "ماده ۲۷۰- اگر متعهد در مقام وفای به عهد مالی تأدیه نماید دیگر نمیتواند به عنوان اینکه در حین تأدیه مالک آن مال نبوده استرداد\nآن را از متعهد له بخواهد مگر اینکه ثابت کند که مال غیر و با مجوز قانونی در ید او بوده بدون اینکه اذن در تأدیه داشته باشد."}, {"title": "ماده ۲۷۱", "content": "ماده ۲۷۱- دین باید به شخص داین یا به کسی که از طرف او وکالت دارد تأدیه گردد یا به کسی که قانونا حق قبض را دارد ."}, {"title": "ماده ۲۷۲", "content": "ماده ۲۷۲- تأدیه به غیر اشخاص مذکور در ماده فوق وقتی صحیح است که داین راضی شود ."}, {"title": "ماده ۲۷۳", "content": "ماده ۲۷۳- اگر صاحب حق از قبول آن امتناع کند متعهد به وسیله تصرف دادن آن به حاکم یا قائم مقام او بری می شود و از تاریخ این\nاقدام مسئول خسارتی که ممکن است به موضوع حق وارد آید نخواهد بود ."}, {"title": "ماده ۲۷۴", "content": "ماده ۲۷۴- اگر متعهدله اهلیت قبض نداشته باشد تأدیه در وجه او معتبر نخواهد بود."}, {"title": "ماده ۲۷۵", "content": "ماده ۲۷۵- متعهدله را نمی توان مجبور نمود که چیز دیگری به غیر آنچه که موضوع تعهد است قبول نماید اگر چه آن شیء قیمتاً\nمعادل یا بیشتر از موضوع تعهد باشد."}, {"title": "ماده ۲۷۶", "content": "ماده ۲۷۶- مدیون نمی تواند مالی را که از طرف حاکم ممنوع از تصرف در آن شده است در مقام وفای به عهد تأدیه نماید ."}, {"title": "ماده ۲۷۷", "content": "ماده ۲۷۷- متعهد نمیتواند متعهدله را مجبور به قبول قسمتی از موضوع تعهد نماید ولی حاکم می تواند نظر به وضعیت مدیون مهلت\nعادله یا قرار اقساط دهد ."}, {"title": "ماده ۲۷۸", "content": "ماده ۲۷۸- اگر موضوع تعهد عین معینی باشد تسلیم آن به صاحبش در وضعیتی که حین تسلیم دارد موجب برائت متعهد می شود،\nاگر چه کسر و نقصان داشته باشد، مشروط بر اینکه کسر و نقصان از تعدی یا تفریط متعهد ناشی نشده باشد، مگر در مواردی که در\nاین قانون تصریح شده است. ولی اگر متعهد با انقضای اجل و مطالبه تأخیر در تسلیم نموده باشد، مسئول هر کسر و نقصان خواهد\nبود اگر چه کسر و نقصان مربوط به تقصیر شخص متعهد نباشد."}, {"title": "ماده ۲۷۹", "content": "ماده ۲۷۹- اگر موضوع تعهد عین شخصی نبوده و کلی باشد متعهد مجبور نیست که از فرد اعلای آن ایفا کند لیکن از فردی هم که\nعرفاً معیوب محسوب است نمی تواند بدهد."}, {"title": "ماده ۲۸۰", "content": "ماده ۲۸۰- انجام تعهد باید در محلی که عقد واقع شده به عمل آید مگر اینکه بین متعاملین قرارداد مخصوصی باشد یا عرف و عادت\nترتیب دیگری اقتضا نماید ."}, {"title": "ماده ۲۸۱", "content": "ماده ۲۸۱- مخارج تأدیه به عهده مدیون است مگر اینکه شرط خلاف شده باشد ."}, {"title": "ماده ۲۸۲", "content": "ماده ۲۸۲- اگر کسی به یک نفر دیون متعدده داشته باشد تشخیص اینکه تأدیه از بابت کدام دین است با مدیون می باشد.\nمبحث دوم - در اقاله\nقانون مدنی"}, {"title": "ماده ۲۸۳", "content": "ماده ۲۸۳- بعد از معامله طرفین می توانند به تراضی آن را اقاله و تفاسخ کنند ."}, {"title": "ماده ۲۸۴", "content": "ماده ۲۸۴- اقاله به هر لفظ یا فعلی واقع میشود که دلالت بر به هم زدن معامله کند ."}, {"title": "ماده ۲۸۵", "content": "ماده ۲۸۵- موضوع اقاله ممکن است تمام معامله واقع شود یا فقط مقداری از مورد آن ."}, {"title": "ماده ۲۸۶", "content": "ماده ۲۸۶- تلف یکی از عوضین مانع اقاله نیست در این صورت به جای آن چیزی که تلف شده است مثل آن در صورت مثلی بودن و\nقیمت آن در صورت قیمتی بودن داده می شود."}, {"title": "ماده ۲۸۷", "content": "ماده ۲۸۷- نماآت و منافع منفصله که از زمان عقد تا زمان اقاله در مورد معامله حادث می شود مال کسی است که به واسطه عقد مالک\nشده است ولی نماآت متصله مال کسی است که در نتیجه اقاله مالک می شود."}, {"title": "ماده ۲۸۸", "content": "ماده ۲۸۸- اگر مالک بعد از عقد در مورد معامله تصرفاتی کند که موجب ازدیاد قیمت آن شود در حین اقاله به مقدار قیمتی که به\nسبب عمل او زیاد شده است مستحق خواهد بود.\nمبحث سوم - در ابراء"}, {"title": "ماده ۲۸۹", "content": "ماده ۲۸۹- ابراء عبارت از این است که داین از حق خود به اختیار صرف نظر نماید ."}, {"title": "ماده ۲۹۰", "content": "ماده ۲۹۰- ابراء وقتی موجب سقوط تعهد می شود که متعهد له برای ابراء اهلیت داشته باشد ."}, {"title": "ماده ۲۹۱", "content": "ماده ۲۹۱- ابراء ذمه میت از دین صحیح است .\nمبحث چهارم - در تبدیل تعهد"}, {"title": "ماده ۲۹۲", "content": "ماده ۲۹۲- تبدیل تعهد در موارد ذیل حاصل می شود:\n۱ )وقتیکه متعهد و متعهدله به تبدیل تعهد اصلی به تعهد جدیدی که قائم مقام آن می شود به سببی از اسباب تراضی نمایند در این\nصورت متعهد نسبت به تعهد اصلی بری می شود\n۲ )وقتیکه شخص ثالث با رضایت متعهدله قبول کند که دین متعهد را ادا نماید .\n۳ )وقتیکه متعهدله مافی الذمه متعهد را به کسی دیگر منتقل نماید ."}, {"title": "ماده ۲۹۳", "content": "ماده ۲۹۳- در تبدیل تعهد تضمینات تعهد سابق به تعهد لاحق تعلق نخواهد گرفت مگر اینکه طرفین معامله آن را صراحتاً شرط کرده\nباشند.\nمبحث پنجم - در تهاتر"}, {"title": "ماده ۲۹۴", "content": "ماده ۲۹۴- وقتی دو نفر در مقابل یکدیگر مدیون باشند بین دیون آنها به یکدیگر به طریقی که در مواد ذیل مقرر است تهاتر حاصل\nمی شود."}, {"title": "ماده ۲۹۵", "content": "ماده ۲۹۵- تهاتر قهری است و بدون اینکه طرفین در این موضوع تراضی نمایند حاصل می گردد بنابراین به محض اینکه دو نفر در مقابل\nیکدیگر در آن واحد مدیون شدند هر دو دین تا اندازه ای که با هم معادله می نماید به طور تهاتر برطرف شده و طرفین به مقدار آن در\nمقابل یکدیگر بری می شوند."}, {"title": "ماده ۲۹۶", "content": "ماده ۲۹۶- تهاتر فقط در مورد دو دینی حاصل می شود که موضوع آنها از یک جنس باشد با اتحاد زمان و مکان تأدیه ولو به اختلاف\nسبب."}, {"title": "ماده ۲۹۷", "content": "ماده ۲۹۷- اگر بعد از ضمان مضمونله به مضمونعنه مدیون شود موجب فراغ ذمه ضامن نخواهد شد ."}, {"title": "ماده ۲۹۸", "content": "ماده ۲۹۸- اگر فقط محل تأدیه دینین مختلف باشد تهاتر وقتی حاصل می شود که با تأدیه مخارج مربوطه به نقل موضوع قرض از\nمحلی به محل دیگری یا به نحوی از انحا طرفین حق تأدیه در محل معین را ساقط نمایند .\nقانون مدنی"}, {"title": "ماده ۲۹۹", "content": "ماده ۲۹۹- در مقابل حقوق ثابته اشخاص ثالث تهاتر مؤثر نخواهد بود و بنابراین اگر موضوع دین به نفع شخص ثالثی در نزد مدیون\nمطابق قانون توقیف شده باشد و مدیون بعد از این توقیف از داین خود طلبهکار گردد دیگر نمی تواند به استناد تهاتر از تأدیه مال توقیف\nشده امتناع کند.\nمبحث ششم - مالکیت مافی الذمه"}, {"title": "ماده ۳۰۰", "content": "ماده ۳۰۰- اگر مدیون مالک مافیالذمه خود گردد ذمه او بری می شود مثل اینکه اگر کسی به مورث خود مدیون باشد پس از فوت\nمورث دین او به نسبت سهمالارث ساقط می شود.\nباب دوم - در الزاماتیکه بدون قرارداد حاصل می شود.\nفصل اول - در کلیات"}, {"title": "ماده ۳۰۱", "content": "ماده ۳۰۱- کسی که عمداً یا اشتباهاً چیزی را که مستحق نبوده است دریافت کند ملزم است آن را به مالک تسلیم کند ."}, {"title": "ماده ۳۰۲", "content": "ماده ۳۰۲- اگر کسی که اشتباهاً خود را مدیون می دانست آن دین را تأدیه کند حق دارد از کسی که آن را بدون حق اخذ کرده است\nاسترداد نماید ."}, {"title": "ماده ۳۰۳", "content": "ماده ۳۰۳- کسی که مالی را من غیر حق دریافت کرده است ضامن عین و منافع آنست اعم از اینکه به عدم استحقاق خود عالم باشد یا\nجاهل."}, {"title": "ماده ۳۰۴", "content": "ماده ۳۰۴- اگر کسی که چیزی را بدون حق دریافت کرده است خود را محق می دانسته لیکن در واقع محق نبوده و آن چیز را فروخته\nباشد معامله فضولی و تابع احکام مربوطه به آن خواهد بود."}, {"title": "ماده ۳۰۵", "content": "ماده ۳۰۵- در مورد مواد فوق صاحب مال باید از عهده مخارج لازمه که برای نگاهداری آن شده است برآید مگر در صورت علم متصرف\nبه عدم استحقاق خود."}, {"title": "ماده ۳۰۶", "content": "ماده ۳۰۶- اگر کسی اموال غایب یا محجور و امثال آن ها را بدون اجازه مالک یا کسی که حق اجازه دارد اداره کند باید حساب زمان\nتصدی خود را بدهد در صورتی که تحصیل اجازه در موقع مقدور بوده یا تأخیر در دخالت موجب ضرر نبوده است حق مطالبه مخارج\nنخواهد داشت ولی اگر عدم دخالت یا تأخیر در دخالت موجب ضرر صاحب مال باشد دخالت کننده مستحق اخذ مخارجی خواهد بود\nکه برای اداره کردن لازم بوده است .\nفصل دوم - در ضمان قهری"}, {"title": "ماده ۳۰۷", "content": "ماده ۳۰۷- امور ذیل موجب ضمان قهری است:\n۱) غصب و آنچه که در حکم غصب است.\n۲) اتلاف.\n۳) تسبیب.\n۴) استیفا.\nمبحث اول - در غصب"}, {"title": "ماده ۳۰۸", "content": "ماده ۳۰۸- غصب استیلا بر حق غیر است به نحو عدوان اثبات ید بر مال غیر بدون مجوز هم در حکم غصب است."}, {"title": "ماده ۳۰۹", "content": "ماده ۳۰۹- هر گاه شخصی مالک را از تصرف در مال خود مانع شود بدون آ نکه خود او تسلط بر آن مال پیدا کند غاصب محسوب\nنمیشود لیکن در صورت اتلاف یا تسبیب ضامن خواهد بود .\nقانون مدنی"}, {"title": "ماده ۳۱۰", "content": "ماده ۳۱۰- اگر کسی که مالی به عاریه یا به ودیعه و امثال آن ها در دست اوست منکر گردد از تاریخ انکار در حکم غاصب است ."}, {"title": "ماده ۳۱۱", "content": "ماده ۳۱۱- غاصب باید مال مغصوب را عیناً به صاحب آن رد نماید و اگر عین تلف شده باشد باید مثل یا قیمت آن را بدهد و اگر به\nعلت دیگری رد عین ممکن نباشد باید بدل آن را بدهد ."}, {"title": "ماده ۳۱۲", "content": "ماده ۳۱۲- هر گاه مال مغصوب مثلی بوده و مثل آن پیدا نشود غاصب باید قیمت حینالادا را بدهد و اگر مثل موجود بوده و از مالیت\nافتاده باشد باید آخرین قیمت آن را بدهد ."}, {"title": "ماده ۳۱۳", "content": "ماده ۳۱۳- هر گاه کسی در زمین خود با مصالح متعلقه به دیگری بنایی سازد یا درخت غیر را بدون اذن مالک در آن زمین غرس کند\nصاحب مصالح یا درخت می تواند قلع یا نزع آن را بخواهد مگر اینکه به اخذ قیمت تراضی نمایند ."}, {"title": "ماده ۳۱۴", "content": "ماده ۳۱۴- اگر در نتیجه عمل غاصب قیمت مال مغصوب زیاد شود غاصب حق مطالبه قیمت زیادی را نخواهد داشت مگر اینکه آن\nزیادتی عین باشد که در این صورت عین زاید متعلق به خود غاصب است ."}, {"title": "ماده ۳۱۵", "content": "ماده ۳۱۵- غاصب مسئول هر نقص و عیبی است که در زمان تصرف او به مال مغصوب وارد شده باشد هرچند مستند به فعل او نباشد ."}, {"title": "ماده ۳۱۶", "content": "ماده ۳۱۶- اگر کسی مال مغصوب را از غاصب غصب کند آن شخص نیز مثل غاصب سابق ضامن است اگر چه به غاصبیت غاصب\nاولی جاهل باشد."}, {"title": "ماده ۳۱۷", "content": "ماده ۳۱۷- مالک می تواند عین و در صورت تلف شدن عین مثل یا قیمت تمام یا قسمتی از مال مغصوب را از غاصب اولی یا از هر یک\nاز غاصبین بعدی که بخواهد مطالبه کند."}, {"title": "ماده ۳۱۸", "content": "ماده ۳۱۸- هر گاه مالک رجوع کند به غاصبی که مال مغصوب در ید او تلف شده است آن شخص حق رجوع به غاصب دیگر ندارد ولی\nاگر به غاصب دیگری به غیر آنکسی که مال در ید او تلف شده است رجوع نماید مشارالیه نیز می تواند به کسی که مال در ید او تلف\nشده است رجوع کند و یا به یکی از لاحقین خود رجوع کند تا منتهی شود به کسی که مال در ید او تلف شده است و به طور کلی ضمان\nبر عهده کسی مستقر است که مال مغصوب در نزد او تلف شده است."}, {"title": "ماده ۳۱۹", "content": "ماده ۳۱۹- اگر مالک تمام یا قسمتی از مال مغصوب را از یکی از غاصبین بگیرد حق رجوع به قدر مأخوذ به غاصبین دیگر ندارد ."}, {"title": "ماده ۳۲۰", "content": "ماده ۳۲۰- نسبت به منافع مال مغصوب هر یک از غاصبین منافع زمان تصرف خود و مابعد خود ضامن است اگر چه استیفاء منفعت\nنکرده باشد لیکن غاصبی که از عهده منافع زمان تصرف غاصبین لاحق خود برآمده است می تواند به هر یک نسبت به زمان تصرف او\nرجوع کند ."}, {"title": "ماده ۳۲۱", "content": "ماده ۳۲۱- هر گاه مالک ذمه یکی از غاصبین را نسبت به مثل یا قیمت مال مغصوب ابراء کند حق رجوع به غاصبین دیگر نخواهد\nداشت. ولی اگر حق خود را به یکی از آنان به نحوی از انحا انتقال دهد آن کس قائممقام مالک می شود و دارای همان حقی خواهد بود\nکه مالک دارا بوده است ."}, {"title": "ماده ۳۲۲", "content": "ماده ۳۲۲- ابراء ذمه یکی از غاصبین نسبت به منافع زمان تصرف او موجب ابراء ذمه دیگران از حصه آن ها نخواهد بود لیکن اگر یکی\nاز غاصبین را نسبت به منافع عین ابراء کند حق رجوع بلاحقین نخواهد داشت ."}, {"title": "ماده ۳۲۳", "content": "ماده ۳۲۳- اگر کسی ملک مغصوب را از غاصب بخرد آن کس نیز ضامن است و مالک می تواند بر طبق مقررات مواد فوق به هر یک از\nبایع و مشتری رجوع کرده عین و در صورت تلف شدن آن مثل یا قیمت مال و همچنین منافع آن را در هر حال مطالبه نماید ."}, {"title": "ماده ۳۲۴", "content": "ماده ۳۲۴- در صورتی که مشتری عالم به غصب باشد حکم رجوع هر یک از بایع و مشتری به یکدیگر در آنچه که مالک از آن ها گرفته\nاست حکم غاصب از غاصب بوده تابع مقررات فوق خواهد بود ."}, {"title": "ماده ۳۲۵", "content": "ماده ۳۲۵- اگر مشتری جاهل به غصب بوده و مالک به او رجوع نموده باشد او نیز می تواند نسبت به ثمن و خسارات به بایع رجوع کند\nاگر چه مبیع نزد خود مشتری تلف شده باشد و اگر مالک نسبت به مثل یا قیمت رجوع به بایع کند بایع حق رجوع به مشتری را نخواهد\nداشت.\nقانون مدنی"}, {"title": "ماده ۳۲۶", "content": "ماده ۳۲۶- اگر عوضی که مشتری عالم بر غصب در صورت تلف مبیع به مالک داده است زیاد بر مقدار ثمن باشد به مقدار زیاده نمی تواند\nرجوع به بایع کند ولی نسبت به مقدار ثمن حق رجوع دارد ."}, {"title": "ماده ۳۲۷", "content": "ماده ۳۲۷- اگر ترتّب ایادی بر مال مغصوب به معامله دیگری غیر از بیع باشد احکام راجعه به بیع مال غصب که فوقاً ذکرشده مُجریٰ\nخواهد بود.\nمبحث دوم - در اتلاف"}, {"title": "ماده ۳۲۸", "content": "ماده ۳۲۸- هر کس مال غیر را تلف کند ضامن آنست و باید مثل یا قیمت آن را بدهد اعم از اینکه از روی عمد تلف کرده باشد یا بدون\nعمد و اعم از اینکه عین باشد یا منفعت و اگر آن را ناقص یا معیوب کند ضامن نقص قیمت آن مال است ."}, {"title": "ماده ۳۲۹", "content": "ماده ۳۲۹- اگر کسی خانه یا بنای کسی را خراب کند باید آن را به مثل صورت اول بنا نماید و اگر ممکن نباشد باید از عهده قیمت برآید ."}, {"title": "ماده ۳۳۰", "content": "ماده ۳۳۰- اگر کسی حیوان متعلق به غیر را بدون اذن صاحب آن بکشد باید تفاوت قیمت زنده و کشته آن را بدهد و اگر کشته آن\nقیمت نداشته باشد باید تمام قیمت حیوان را بدهد، ولیکن اگر برای دفاع از نفس بکشد یا ناقص کند ضامن نیست .\nمبحث سوم - در تسبیب"}, {"title": "ماده ۳۳۱", "content": "ماده ۳۳۱- هر کس سبب تلف مالی بشود باید مثل یا قیمت آن را بدهد و اگر سبب نقص یا عیب آن شده باشد باید از عهده نقص\nقیمت آن برآید ."}, {"title": "ماده ۳۳۲", "content": "ماده ۳۳۲- هر گاه یک نفر سبب تلف مالی را ایجاد کند و دیگری مباشر تلف شدن آن مال بشود مباشر مسئول است نه مسبب مگر\nاینکه سبب اقوی باشد به نحوی که عرفاً اتلاف مستند به او باشد ."}, {"title": "ماده ۳۳۳", "content": "ماده ۳۳۳- صاحب دیوار یا عمارت یا کارخانه مسئول خساراتی است که از خراب شدن آن وارد می شود مشروط بر اینکه خرابی در نتیجه\nعیبی حاصل گردد که مالک مطلع بر آن بوده و یا از عدم مواظبت او تولید شده است ."}, {"title": "ماده ۳۳۴", "content": "ماده ۳۳۴- مالک یا متصرف حیوان مسئول خساراتی نیست که از ناحیه آن حیوان وارد می شود مگر اینکه در حفظ حیوان تقصیر کرده\nباشد لیکن در هر حال اگر حیوان به واسطه عمل کسی منشا ضرر گردد فاعل آن عمل مسئول خسارات وارده خواهد بود ."}, {"title": "ماده ۳۳۵", "content": "ماده ۳۳۵- در صورت تصادم بین دو کشتی یا دو قطار راه آهن یا دو اتومبیل و امثال آن ها مسئولیت متوجه طرفی خواهد بود که\nتصادم در نتیجه عمد یا مسامحه او حاصل شده باشد و اگر طرفین تقصیر یا مسامحه کرده باشند هر دو مسئول خواهند بود .\nمبحث چهارم - در استیفاء"}, {"title": "ماده ۳۳۶", "content": "ماده ۳۳۶- هر گاه کسی بر حسب امر دیگری اقدام به عملی نماید که عرفاً برای آن عمل اجرتی بوده و یا آن شخص عادتاً مهیای آن\nعمل باشد عامل مستحق اجرت عمل خود خواهد بود مگر اینکه معلوم شود که قصد تبرع داشته است .\nتبصره (الحاقی ۲۳/۱۰/۱۳۸۵)- چنانچه زوجه کارهایی را که شرعا به عهده وی نبوده و عرفا برای آن کار اجرت المثل باشد، به دستور زوج\nو با عدم قصد تبرع انجام داده باشد و برای دادگاه نیز ثابت شود، دادگاه اجرت المثل کارهای انجام گرفته را محاسبه و به پرداخت آن حکم\nمی نماید."}, {"title": "ماده ۳۳۷", "content": "ماده ۳۳۷- هر گاه کسی بر حسب اذن صریح یا ضمنی از مال غیر استیفا منفعت کند صاحب مال مستحق اجرت المثل خواهد بود مگر\nاینکه معلوم شود که اذن در انتفاع مجانی بوده است.\nباب سوم - در عقود معینه مختلفه\nفصل اول - در بیع\nمبحث اول - در احکام بیع"}, {"title": "ماده ۳۳۸", "content": "ماده ۳۳۸- بیع عبارت است از تملیک عین به عِوض معلوم .\nقانون مدنی"}, {"title": "ماده ۳۳۹", "content": "ماده ۳۳۹- پس از توافق بایع و مشتری در مبیع و قیمت آن عقد بیع به ایجاب و قبول واقع میشود.\nممکن است بیع به داد و ستد نیز واقع گردد ."}, {"title": "ماده ۳۴۰", "content": "ماده ۳۴۰- در ایجاب و قبول، الفاظ و عبارات باید صریح در معنی بیع باشد ."}, {"title": "ماده ۳۴۱", "content": "ماده ۳۴۱- بیع ممکن است مطلق باشد یا مشروط و نیز ممکن است که برای تسلیم تمام یا قسمتی از مبیع یا برای تأدیه تمام یا\nقسمتی از ثمن اجلی قرار داده شود ."}, {"title": "ماده ۳۴۲", "content": "ماده ۳۴۲- مقدار و جنس و وصف مبیع باید معلوم باشد و تعیین مقدار آن به وزن یا کیل یا عدد یا ذرع یا مساحت یا مشاهده تابع\nعرف بلد است ."}, {"title": "ماده ۳۴۳", "content": "ماده ۳۴۳- اگر مبیع به شرط مقدار معین فروخته شود بیع واقع می شود اگر چه هنوز مبیع شمرده نشده یا کیل یا ذرع نشده باشد ."}, {"title": "ماده ۳۴۴", "content": "ماده ۳۴۴- اگر در عقد بیع شرطی ذکر نشده یا برای تسلیم مبیع یا تأدیه قیمت موعدی معین نگشته باشد بیع قطعی و ثمن حال\nمحسوب است مگر اینکه بر حسب عرف و عادت محل یا عرف و عادت تجارت در معاملات تجارتی وجود شرطی یا موعدی معهود باشد\nاگر چه در قرارداد بیع ذکری نشده باشد .\nمبحث دوم - در طرفین معامله"}, {"title": "ماده ۳۴۵", "content": "ماده ۳۴۵- هر یک از بایع و مشتری باید علاوه بر اهلیت قانونی برای معامله اهلیت برای تصرف در مبیع یا ثمن را نیز داشته باشد ."}, {"title": "ماده ۳۴۶", "content": "ماده ۳۴۶- عقد بیع باید مقرون به رضای طرفین باشد و عقد مکره نافذ نیست ."}, {"title": "ماده ۳۴۷ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۳۴۷ (اصلاحی ۱۴/۸/۱۳۷۰) - شخص کور میتواند خرید و فروش نماید مشروط بر اینکه شخصا به طریقی غیر از معاینه یا به\nوسیله کس دیگر ولو طرف معامله جهل خود را مرتفع نماید .\nمبحث سوم - در مبیع"}, {"title": "ماده ۳۴۸", "content": "ماده ۳۴۸- بیع چیزی که خرید و فروش آن قانوناً ممنوع است و یا چیزی که مالیت و یا منفعت عقلایی ندارد یا چیزی که بایع قدرت\nبر تسلیم آن ندارد باطل است مگر اینکه مشتری خود قادر بر تَسلُّم باشد ."}, {"title": "ماده ۳۴۹", "content": "ماده ۳۴۹- بیع مال وقف صحیح نیست مگر در موردی که بین موقوف علیهم تولید اختلاف شود به نحوی که بیم سفک دماء رود یا\nمنجر به خرابی مال موقوفه گردد و همچنین در مواردی که در مبحث راجع به وقف مقرر است ."}, {"title": "ماده ۳۵۰", "content": "ماده ۳۵۰- مبیع ممکن است مفروز باشد یا مشاع یا مقدار معین به طور کلی از شیء متساویالاجزا و همچنین ممکن است کلی\nفیالذمه باشد."}, {"title": "ماده ۳۵۱", "content": "ماده ۳۵۱- در صورتی که مبیع کلی یعنی صادق بر افراد عدیده باشد بیع وقتی صحیح است که مقدار و جنس و وصف مبیع ذکر بشود ."}, {"title": "ماده ۳۵۲", "content": "ماده ۳۵۲- بیع فضولی نافذ نیست مگر بعد از اجازه مالک به طوری که در معاملات فضولی مذکور است ."}, {"title": "ماده ۳۵۳", "content": "ماده ۳۵۳- هر گاه چیز معین به عنوان جنس خاصی فروخته شود و در واقع از آن جنس نباشد بیع باطل است و اگر بعضی از آن از غیر\nجنس باشد نسبت به آن بعض باطل است و نسبت به مابقی مشتری حق فسخ دارد ."}, {"title": "ماده ۳۵۴", "content": "ماده ۳۵۴- ممکن است بیع از روی نمونه به عمل آید در این صورت باید تمام مبیع مطابق نمونه تسلیم شود و الا مشتری خیار فسخ\nخواهد داشت."}, {"title": "ماده ۳۵۵", "content": "ماده ۳۵۵- اگر ملکی به شرط داشتن مساحت معین فروخته شده باشد و بعد معلوم شود که کمتر از آن مقدار است، مشتری حق\nفسخ معامله را خواهد داشت و اگر معلوم شود که بیشتر است بایع می تواند آن را فسخ کند مگر اینکه در هر دو صورت طرفین به\nمحاسبه زیاده یا نقیصه تراضی نمایند .\nقانون مدنی"}, {"title": "ماده ۳۵۶", "content": "ماده ۳۵۶- هر چیزی که بر حسب عرف و عادت جزء یا تابع مبیع شمرده شود یا قرائن دلالت بر دخول آن در مبیع نماید داخل در بیع\nو متعلق به مشتری است اگر چه در عقد صریحاً ذکر نشده باشد و اگر چه متعاملین جاهل بر عرف باشند ."}, {"title": "ماده ۳۵۷", "content": "ماده ۳۵۷- هر چیزی که بر حسب عرف و عادت جزء یا تابع مبیع شمرده نشود داخل در بیع نمی شود مگر اینکه صریحاً در عقد ذکر\nشده باشد."}, {"title": "ماده ۳۵۸", "content": "ماده ۳۵۸- نظر به دو ماده فوق در بیع باغ اشجار و در بیع خانه ممر و مجری و هر چه ملصق به بنا باشد به طوری که نتوان آن را بدون\nخرابی نقل نمود متعلق به مشتری می شود و بر عکس زراعت در بیع زمین و میوه در بیع درخت و حمل در بیع حیوان متعلق به مشتری\nنمیشود مگر اینکه تصریح شده باشد یا بر حسب عرف از توابع شمرده شود .\nدر هر حال طرفین عقد می توانند به عکس ترتیب فوق تراضی کنند ."}, {"title": "ماده ۳۵۹", "content": "ماده ۳۵۹- هرگاه دخول شیء در مبیع عرفاً مشکوک باشد آن شیء داخل در بیع نخواهد بود مگر آ نکه تصریح شده باشد."}, {"title": "ماده ۳۶۰", "content": "ماده ۳۶۰- هر چیزی که فروش آن مستقلاً جایز است استثنای آن از مبیع نیز جائز است ."}, {"title": "ماده ۳۶۱", "content": "ماده ۳۶۱- اگر در بیع عین معین معلوم شود که مبیع وجود نداشته بیع باطل است.\nمبحث چهارم - در آثار بیع"}, {"title": "ماده ۳۶۲", "content": "ماده ۳۶۲- آثار بیعی که صحیحاً واقع شده باشد از قرار ذیل است :\n۱ )به مجرد وقوع بیع مشتری مالک مبیع و بایع مالک ثمن می شود.\n۲ )عقد بیع بایع را ضامن درک مبیع و مشتری را ضامن درک ثمن قرار می دهد.\n۳ )عقد بیع بایع را به تسلیم مبیع ملزم می نماید.\n۴ )عقد بیع مشتری را به تأدیه ثمن ملزم می کند.\nفقره اول - در ملکیت مبیع و ثمن"}, {"title": "ماده ۳۶۳", "content": "ماده ۳۶۳- در عقد بیع وجود خیار فسخ برای متبایعین یا وجود اجلی برای تسلیم مبیع یا تأدیه ثمن مانع انتقال نمی شود بنابراین اگر\nثمن یا مبیع عین معین بوده و قبل از تسلیم آن احد متعاملین مفلس شود طرف دیگر حق مطالبه آن عین را خواهد داشت ."}, {"title": "ماده ۳۶۴", "content": "ماده ۳۶۴- در بیع خیاری مالکیت از حین عقد بیع است نه از تاریخ انقضای خیار و در بیعی که قبض شرط صحت است مثل بیع صرف\nانتقال از حین حصول شرط است نه از حین وقوع بیع ."}, {"title": "ماده ۳۶۵", "content": "ماده ۳۶۵- بیع فاسد اثری در تملک ندارد ."}, {"title": "ماده ۳۶۶", "content": "ماده ۳۶۶- هر گاه کسی به بیع فاسد مالی را قبض کند باید آن را به صاحبش رد نماید و اگر تلف یا ناقص شود ضامن عین و منافع آن\nخواهد بود.\nفقره دوم - در تسلیم"}, {"title": "ماده ۳۶۷", "content": "ماده ۳۶۷- تسلیم عبارتست از دادن مبیع به تصرف مشتری به نحوی که متمکن از انحا تصرفات و انتفاعات باشد و قبض عبارت است\nاز استیلاء مشتری بر مبیع ."}, {"title": "ماده ۳۶۸", "content": "ماده ۳۶۸- تسلیم وقتی حاصل میشود که مبیع تحت اختیار مشتری گذاشته شده باشد اگر چه مشتری آن را هنوز عملاً تصرف نکرده\nباشد."}, {"title": "ماده ۳۶۹", "content": "ماده ۳۶۹- تسلیم به اختلاف مبیع به کیفیات مختلفه است و باید به نحوی باشد که عرفاً آن را تسلیم گویند ."}, {"title": "ماده ۳۷۰", "content": "ماده ۳۷۰- اگر طرفین معامله برای تسلیم مبیع موعدی قرار داده باشند قدرت بر تسلیم در آن موعد شرط است نه در زمان عقد .\nقانون مدنی"}, {"title": "ماده ۳۷۱", "content": "ماده ۳۷۱- در بیعی که موقوف به اجازه مالک است قدرت بر تسلیم در زمان اجازه معتبر است ."}, {"title": "ماده ۳۷۲", "content": "ماده ۳۷۲- اگر نسبت به بعض مبیع بایع قدرت بر تسلیم داشته و نسبت به بعض دیگر نداشته باشد بیع نسبت به بعض که قدرت بر\nتسلیم داشته صحیح است و نسبت به بعض دیگر باطل است."}, {"title": "ماده ۳۷۳", "content": "ماده ۳۷۳- اگر مبیع قبلا در تصرف مشتری بوده باشد محتاج به قبض جدید نیست و همچنین است در ثمن ."}, {"title": "ماده ۳۷۴", "content": "ماده ۳۷۴- در حصول قبض اذن بایع شرط نیست و مشتری می تواند مبیع را بدون اذن قبض کند ."}, {"title": "ماده ۳۷۵", "content": "ماده ۳۷۵- مبیع باید در محلی تسلیم شود که عقد بیع در آنجا واقع شده است مگر اینکه عرف و عادت مقتضی تسلیم در محل دیگر\nباشد و یا در ضمن بیع محل مخصوصی برای تسلیم معین شده باشد ."}, {"title": "ماده ۳۷۶", "content": "ماده ۳۷۶- در صورت تأخیر در تسلیم مبیع یا ثمن ممتنع اجبار به تسلیم می شود."}, {"title": "ماده ۳۷۷", "content": "ماده ۳۷۷- هر یک از بایع و مشتری حق دارد از تسلیم مبیع یا ثمن خودداری کند تا طرف دیگر حاضر به تسلیم شود مگر اینکه مبیع\nیا ثمن مؤجل باشد در این صورت هر کدام از مبیع یا ثمن که حال باشد باید تسلیم شود."}, {"title": "ماده ۳۷۸", "content": "ماده ۳۷۸- اگر بایع قبل از اخذ ثمن مبیع را به میل خود تسلیم مشتری نماید حق استرداد آن را نخواهد داشت مگر به موجب فسخ\nدر مورد خیار ."}, {"title": "ماده ۳۷۹", "content": "ماده ۳۷۹- اگر مشتری ملتزم شده باشد که برای ثمن ضامن یا رهن بدهد و عمل به شرط نکند بایع حق فسخ خواهد داشت و اگر بایع\nملتزم شده باشد که برای درک مبیع ضامن بدهد و عمل به شرط نکند مشتری حق فسخ دارد ."}, {"title": "ماده ۳۸۰", "content": "ماده ۳۸۰- در صورتی که مشتری مفلس شود و عین مبیع نزد او موجود باشد بایع حق استرداد آن را دارد و اگر مبیع هنوز تسلیم نشده\nباشد می تواند از تسلیم آن امتناع کند."}, {"title": "ماده ۳۸۱", "content": "ماده ۳۸۱- مخارج تسلیم مبیع از قبیل اجرت نقل آن به محل تسلیم، اجرت شمردن و وزن کردن و غیره به عهده بایع است مخارج\nتسلیم ثمن بر عهده مشتری است ."}, {"title": "ماده ۳۸۲", "content": "ماده ۳۸۲- هر گاه عرف و عادت از بابت مخارج معامله یا محل تسلیم برخلاف ترتیبی باشد که ذکر شده و یا در عقد برخلاف آن شرط\nشده باشد باید بر طبق متعارف یا مشروط در عقد رفتار شود و همچنین متبایعین می توانند آن را به تراضی تغییر دهند ."}, {"title": "ماده ۳۸۳", "content": "ماده ۳۸۳- تسلیم باید شامل آن چیزی هم باشد که اجزا و توابع مبیع شمرده می شود."}, {"title": "ماده ۳۸۴", "content": "ماده ۳۸۴- هر گاه در حال معامله مبیع از حیث مقدار معین بوده و در وقت تسلیم کمتر از آن مقدار درآید مشتری حق دارد که بیع را\nفسخ کند یا قیمت موجود را با تأدیه حصه ای از ثمن به نسبت موجود قبول نماید و اگر مبیع زیاده از مقدار معین باشد زیاده مال بایع\nاست."}, {"title": "ماده ۳۸۵", "content": "ماده ۳۸۵- اگر مبیع از قبیل خانه یا فرش باشد که تجزیه آن بدون ضرر ممکن نمی شود و به شرط بودن مقدار معین فروخته شده ولی\nدر حین تسلیم کمتر یا بیشتر درآید در صورت اولی مشتری و در صورت دوم بایع حق فسخ خواهد داشت ."}, {"title": "ماده ۳۸۶", "content": "ماده ۳۸۶- اگر در مورد دو ماده قبل معامله فسخ شود بایع باید علاوه بر ثمن، مخارج معامله و مصارف متعارف را که مشتری نموده\nاست بدهد."}, {"title": "ماده ۳۸۷", "content": "ماده ۳۸۷- اگر مبیع قبل از تسلیم بدون تقصیر و اهمال از طرف بایع تلف شود بیع منفسخ و ثمن باید به مشتری مسترد گردد مگر\nاینکه بایع برای تسلیم به حاکم یا قائم مقام او رجوع نموده باشد که در این صورت تلف از مال مشتری خواهد بود ."}, {"title": "ماده ۳۸۸", "content": "ماده ۳۸۸- اگر قبل از تسلیم در مبیع نقصی حاصل شود مشتری حق خواهد داشت که معامله را فسخ نماید ."}, {"title": "ماده
