موصیٰ به را قبض کرد دیگر نمی تواند آن را رد کند لیکن\nاگر قبل از فوت قبول کرده باشد بعد از فوت قبول ثانوی لازم نیست ."}, {"title": "ماده ۸۳۱", "content": "ماده ۸۳۱- اگر موصیٰ له صغیر یا مجنون باشد رد یا قبول وصیت با ولی خواهد بود .\nقانون مدنی"}, {"title": "ماده ۸۳۲", "content": "ماده ۸۳۲- موصیٰ له می تواند وصیت را نسبت به قسمتی از موصیٰ به قبول کند در این صورت وصیت نسبت به قسمتی که قبول شده\nصحیح و نسبت به قسمت دیگر باطل می شود."}, {"title": "ماده ۸۳۳", "content": "ماده ۸۳۳- ورثه موصیٖ نمی تواند در موصیٰ به تصرف کند مادام که موصیٰ له رد یا قبول خود را به آن ها اعلام نکرده است .\nاگر تأخیر این اعلام موجب تضرر ورثه باشد حاکم موصیٰ له را مجبور می کند که تصمیم خود را معین نماید ."}, {"title": "ماده ۸۳۴", "content": "ماده ۸۳۴- در وصیت عهدی قبول شرط نیست لیکن وصی می تواند مادام که موصیٖ زنده است وصایت را رد کند و اگر قبل از فوت\nموصیٖ رد نکرد بعد از آن حق رد ندارد گر چه جاهل بر وصایت بوده باشد .\nفصل دوم - در موصی"}, {"title": "ماده ۸۳۵", "content": "ماده ۸۳۵- موصیٖ باید نسبت به مورد وصیت جائزالتصرف باشد ."}, {"title": "ماده ۸۳۶", "content": "ماده ۸۳۶- هر گاه کسی به قصد خودکشی خود را مجروح یا مسموم کند یا اعمال دیگر از این قبیل که موجب هلاکت است مرتکب\nگردد و پس از آن وصیت نماید آن وصیت در صورت هلاکت باطل است و هر گاه اتفاقاً منتهی به موت نشد وصیت نافذ خواهد بود ."}, {"title": "ماده ۸۳۷", "content": "ماده ۸۳۷- اگر کسی به موجب وصیت یک یا چند نفر از ورثه خود را از ارث محروم کند وصیت مزبور نافذ نیست ."}, {"title": "ماده ۸۳۸", "content": "ماده ۸۳۸- موصیٖ می تواند از وصیت خود رجوع کند ."}, {"title": "ماده ۸۳۹", "content": "ماده ۸۳۹- اگر موصیٖ ثانیاً وصیتی برخلاف وصیت اول نماید وصیت دوم صحیح است .\nفصل سوم - در موصی به"}, {"title": "ماده ۸۴۰", "content": "ماده ۸۴۰- وصیت به صرف مال در امر غیر مشروع باطل است ."}, {"title": "ماده ۸۴۱", "content": "ماده ۸۴۱- موصیٰ به باید ملک موصیٖ باشد و وصیت به مال غیر ولو با اجازه مالک باطل است ."}, {"title": "ماده ۸۴۲", "content": "ماده ۸۴۲- ممکن است مالی را که هنوز موجود نشده است وصیت نمود ."}, {"title": "ماده ۸۴۳", "content": "ماده ۸۴۳- وصیت به زیاده بر ثلث ترکه نافذ نیست مگر به اجازه وراث و اگر بعض از ورثه اجازه کند فقط نسبت به سهم او نافذ است ."}, {"title": "ماده ۸۴۴", "content": "ماده ۸۴۴- هر گاه موصیٰ به مال معینی باشد آن مال تقویم می شود اگر قیمت آن بیش از ثلث ترکه باشد مازاد مال ورثه است مگر\nاینکه اجازه از ثلث کند ."}, {"title": "ماده ۸۴۵", "content": "ماده ۸۴۵- میزان ثلث به اعتبار دارایی موصیٖ در حین وفات معین می شود نه به اعتبار دارایی او در حین وصیت ."}, {"title": "ماده ۸۴۶", "content": "ماده ۸۴۶- هر گاه موصیٰ به منافع ملکی باشد دائماً یا در مدت معین به طریق ذیل از ثلث اخراج می شود:\nبدواً عین ملک با منافع آن تقویم می شود سپس ملک مزبور با ملاحظه مسلوبالمنفعه بودن در مدت وصیت تقویم شده تفاوت بین\nدو قیمت از ثلث حساب می شود.\nاگر موصیٰ به منافع دائمی ملک بوده و بدین جهت عین ملک قیمتی نداشته باشد قیمت ملک با ملاحظه منافع از ثلث محسوب می شود."}, {"title": "ماده ۸۴۷", "content": "ماده ۸۴۷- اگر موصیٰ به کلی باشد تعیین فرد با ورثه است مگر اینکه در وصیت طور دیگر مقررشده باشد ."}, {"title": "ماده ۸۴۸", "content": "ماده ۸۴۸- اگر موصیٰ به جزء مشاع ترکه باشد مثل ربع یا ثلث موصیٰ له با ورثه در همان مقدار از ترکه مشاعاً شریک خواهد بود ."}, {"title": "ماده ۸۴۹", "content": "ماده ۸۴۹- اگر موصیٖ زیاده بر ثلث به ترتیب معینی وصیت به اموری کرده باشد ورثه زیاده بر ثلث را اجازه نکنند به همان ترتیبی که\nوصیت کرده است از ترکه خارج می شود تا میزان ثلث و زاید بر ثلث باطل خواهد شد و اگر وصیت به تمام یک دفعه باشد زیاده از همه\nکسر میشود.\nقانون مدنی\nفصل چهارم - در موصی له"}, {"title": "ماده ۸۵۰", "content": "ماده ۸۵۰- موصیٰ له باید موجود باشد و بتواند مالک چیزی بشود که برای او وصیت شده است ."}, {"title": "ماده ۸۵۱", "content": "ماده ۸۵۱- وصیت برای حمل صحیح است لیکن تملک او منوط است بر اینکه زنده متولد شود ."}, {"title": "ماده ۸۵۲", "content": "ماده ۸۵۲- اگر حمل در نتیجه جرمی سقط شود موصیٰ به به ورثه او می رسد مگر اینکه جرم مانع ارث باشد ."}, {"title": "ماده ۸۵۳", "content": "ماده ۸۵۳- اگر موصیٰ لهم متعدد و محصور باشند موصیٰ به بین آنها بالسویه تقسیم میشود مگر اینکه موصیٖ طور دیگر مقرر داشته\nباشد.\nفصل پنجم - در وصی"}, {"title": "ماده ۸۵۴", "content": "ماده ۸۵۴- موصیٖ می تواند یک یا چند نفر وصی معین نماید در صورت تعداد اوصیا باید مجتمعاً عمل به وصیت کنند مگر در صورت\nتصریح به استقلال هر یک."}, {"title": "ماده ۸۵۵", "content": "ماده ۸۵۵- موصیٖ می تواند چند نفر را به نحو ترتیب وصی معین کند به این طریق که اگر اولی فوت کرد دومی وصی باشد و اگر دومی\nفوت کرد سومی باشد و هکذا ."}, {"title": "ماده ۸۵۶", "content": "ماده ۸۵۶- صغیر را می توان به اتفاق یک نفر کبیر وصی قرار داد .\nدر این صورت اجرای وصایا با کبیر خواهد بود تا موقع بلوغ و رشد صغیر ."}, {"title": "ماده ۸۵۷", "content": "ماده ۸۵۷- موصیٖ می تواند یک نفر را برای نظارت در عملیات وصی معین نماید .\nحدود اختیارات ناظر به طریقی خواهد بود که موصیٖ مقرر داشته است یا از قرائن معلوم شود ."}, {"title": "ماده ۸۵۸", "content": "ماده ۸۵۸- وصی نسبت به اموالی که بر حسب وصیت در ید او میباشد حکم امین را دارد و ضامن نمی شود مگر در صورت تعدی یا\nتفریط ."}, {"title": "ماده ۸۵۹", "content": "ماده ۸۵۹- وصی باید بر طبق وصایای موصیٖ رفتار کند و الا ضامن و منعزل است ."}, {"title": "ماده ۸۶۰", "content": "ماده ۸۶۰- غیر از پدر و جد پدری کس دیگر حق ندارد بر صغیر وصی معین کند .\nباب دوم - در ارث\nفصل اول - در موجبات ارث و طبقات مختلفه وراث"}, {"title": "ماده ۸۶۱", "content": "ماده ۸۶۱- موجب ارث دو امر است:\nنسب و سبب."}, {"title": "ماده ۸۶۲", "content": "ماده ۸۶۲- اشخاصی که به موجب نسب ارث می برند سه طبقه اند:\n۱) پدر و مادر و اولاد و اولاد اولاد.\n۲) اجداد و برادر و خواهر و اولاد آن ها.\n۳) اعمام و عمات و اخوال و خالات و اولاد آنها."}, {"title": "ماده ۸۶۳", "content": "ماده ۸۶۳- وارثین طبقه بعد وقتی ارث می برند که از وارثین طبقه قبل کسی نباشد ."}, {"title": "ماده ۸۶۴", "content": "ماده ۸۶۴- از جمله اشخاصی که به موجب سبب ارث می برند هر یک از زوجین است که در حین فوت دیگری زنده باشد ."}, {"title": "ماده ۸۶۵", "content": "ماده ۸۶۵- اگر در شخص واحد موجبات متعدده ارث جمع شود به جهت تمام آن موجبات ارث می برد مگر اینکه بعضی از آن ها مانع\nدیگری باشد که در این صورت فقط از جهت عنوان مانع می برد .\nقانون مدنی"}, {"title": "ماده ۸۶۶", "content": "ماده ۸۶۶- در صورت نبودن وارث امر ترکه متوفی راجع به حاکم است .\nفصل دوم - در حق ارث"}, {"title": "ماده ۸۶۷", "content": "ماده ۸۶۷- ارث به موت حقیقی یا به موت فرضی مورث تحقق پیدا می کند."}, {"title": "ماده ۸۶۸", "content": "ماده ۸۶۸- مالکیت ورثه نسبت به ترکه متوفی مستقر نمی شود مگر پس از ادای حقوق و دیونی که به ترکه میت تعلق گرفته ."}, {"title": "ماده ۸۶۹", "content": "ماده ۸۶۹- حقوق و دیونی که به ترکه میت تعلق می گیرد و باید قبل از تقسیم آن ادا شود از قرار ذیل است :\n۱) قیمت کفن میت و حقوقی که متعلق است به اعیان ترکه مثل عینی که متعلق رهن است .\n۲) دیون و واجبات مالی متوفی.\n۳) وصایای میت تا ثلث ترکه بدون اجازه ورثه و زیاده بر ثلث با اجازه آن ها."}, {"title": "ماده ۸۷۰", "content": "ماده ۸۷۰- حقوق مزبوره در ماده قبل باید به ترتیبی که در ماده مزبوره مقرر است تأدیه شود و مابقی اگر باشد بین وراث تقسیم گردد ."}, {"title": "ماده ۸۷۱", "content": "ماده ۸۷۱- هر گاه ورثه نسبت به اعیان ترکه معاملاتی نمایند مادام که دیون متوفی تأدیه نشده است معاملات مزبوره نافذ نبوده و دیان\nمی توانند آن را بر هم زنند ."}, {"title": "ماده ۸۷۲", "content": "ماده ۸۷۲- اموال غایب مفقودالاثر تقسیم نمیشود مگر بعد از ثبوت فوت او یا انقضای مدتی که عادتاً چنین شخصی زنده نمی ماند."}, {"title": "ماده ۸۷۳", "content": "ماده ۸۷۳- اگر تاریخ فوت اشخاصی که از یکدیگر ارث می برند مجهول و تقدم و تأخر هیچ یک معلوم نباشد اشخاص مزبور از یکدیگر\nارث نمی برند مگر آ نکه موت به سبب غرق یا هدم واقع شود که در این صورت از یکدیگر ارث می برند ."}, {"title": "ماده ۸۷۴", "content": "ماده ۸۷۴- اگر اشخاصی که بین آن ها توارث باشد بمیرند و تاریخ فوت یکی از آن ها معلوم و دیگری از حیث تقدم و تأخر مجهول باشد\nفقط آ نکه تاریخ فوتش مجهول است از آن دیگری ارث می برد .\nفصل سوم - در شرایط و جمله از موانع ارث"}, {"title": "ماده ۸۷۵", "content": "ماده ۸۷۵- شرط وراثت زنده بودن در حین فوت مورث است و اگر حملی باشد در صورتی ارث می برد که نطفه او حین الموت منعقد بوده\nو زنده هم متولد شود اگر چه فوراً پس از تولد بمیرد ."}, {"title": "ماده ۸۷۶", "content": "ماده ۸۷۶- با شک در حیات حین ولادت حکم وراثت نمی شود."}, {"title": "ماده ۸۷۷", "content": "ماده ۸۷۷- در صورت اختلاف در زمان انعقاد نطفه امارات قانونی که برای اثبات نسب مقرر است رعایت خواهد شد ."}, {"title": "ماده ۸۷۸", "content": "ماده ۸۷۸- هر گاه در حین موت مورث حملی باشد که اگر قابل وراثت متولد شود مانع از ارث تمام یا بعضی از وراث دیگر می گردد\nتقسیم ارث به عمل نمی آید تا حال او معلوم شود و اگر حمل مانع از ارث هیچ یک از سایر وراث نباشد و آن ها بخواهند ترکه را تقسیم\nکنند باید برای حمل حصه ای که مساوی حصه دو پسر از همان طبقه باشد کنار گذارند و حصه هر یک از وراث مراعا است تا حال حمل\nمعلوم شود."}, {"title": "ماده ۸۷۹", "content": "ماده ۸۷۹- اگر بین وارث غایب مفقودالاثری باشد سهم او کنار گذارده می شود تا حال او معلوم شود در صورتی که محقق گردد قبل از\nمورث مرده است حصه او به سایر وراث برمی گردد و الا به خود او یا به ورثه او می رسد ."}, {"title": "ماده ۸۸۰", "content": "ماده ۸۸۰- قتل از موانع ارث است بنابراین کسی که مورث خود را عمداً بکشد از ارث او ممنوع می شود اعم از اینکه قتل بالمباشره باشد\nیا بالتسبیب و منفرداً باشد یا به شرکت دیگری ."}, {"title": "ماده ۸۸۱ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۸۸۱ (اصلاحی ۱۴/۸/۱۳۷۰)- در صورتی که قتل عمدی مورث به حکم قانون یا برای دفاع باشد، مفاد ماده فوق مجری نخواهد بود ."}, {"title": "ماده ۸۸۱ مکرر (الحاقی ۱۴/۸/۱۳۷۰)", "content": "ماده ۸۸۱ مکرر (الحاقی ۱۴/۸/۱۳۷۰)- کافر از مسلم ارث نمی برد و اگر در بین ورثه متوفای کافری مسلم باشد وراث کافر ارث نمی برند\nاگر چه از لحاظ طبقه و درجه مقدم بر مسلم باشند .\nقانون مدنی"}, {"title": "ماده ۸۸۲", "content": "ماده ۸۸۲- بعد از لعان زن و شوهر از یکدیگر ارث نمی برند و همچنین فرزندی که به سبب انکار او لعان واقع شده از پدر و پدر از او\nارث نمی برد لیکن فرزند مزبور از مادر و خویشان مادری خود و همچنین مادر و خویشان مادری از او ارث می برند ."}, {"title": "ماده ۸۸۳", "content": "ماده ۸۸۳- هر گاه پدر بعد از لعان رجوع کند پسر از او ارث می برد لیکن از ارحام پدر و همچنین پدر و ارحام پدری از پسر ارث نمی برند ."}, {"title": "ماده ۸۸۴", "content": "ماده ۸۸۴- ولدالزنا از پدر و مادر و اقوام آنان ارث نمی برد لیکن اگر حرمت رابطه که طفل ثمره آنست نسبت به یکی از ابوین ثابت و\nنسبت به دیگری به واسطه اکراه یا شبهه زنا نباشد طفل فقط از این طرف و اقوام او ارث می برد و بالعکس ."}, {"title": "ماده ۸۸۵", "content": "ماده ۸۸۵- اولاد و اقوام کسانی که به موجب ماده ۸۸۰ از ارث ممنوع می شوند محروم از ارث نمی باشند بنابراین اولادی کسی که پدر\nخود را کشته باشد از جد مقتول خود ارث می برد اگر وارث نزدیکتری باعث حرمان آنان نشود .\nفصل چهارم - در حجب"}, {"title": "ماده ۸۸۶", "content": "ماده ۸۸۶- حجب حالت وارثی است که به واسطه بودن وارث دیگر از بردن ارث کلاً یا جزئاً محروم می شود."}, {"title": "ماده ۸۸۷", "content": "ماده ۸۸۷- حجب بر دو قسم است:\nقسم اول آنست که وارث از اصل ارث محروم می گردد مثل برادرزاده که به واسطه بودن برادر یا خواهر متوفی از ارث محروم می شود یا\nبرادر ابی که با بودن برادر ابوینی از ارث محروم می گردد .\nقسم دوم آنست که فرض وارث از حد اعلی به حد ادنی نازل می گردد مثل تنزل حصه شوهر از نصف به ربع در صورتی که برای زوجه\nاولاد باشد و همچنین تنزل حصه زن از ربع به ثمن در صورتی که برای زوج او اولاد باشد ."}, {"title": "ماده ۸۸۸", "content": "ماده ۸۸۸- ضابطه حجب از اصل ارث رعایت اقربیت به میت است بنابراین هر طبقه از وراث طبقه بعد را از ارث محروم می نمایند مگر\nدر مورد ماده ۹۳۶ و موردی که وارث دورتر بتواند به سمت قائم مقامی ارث ببرد که در این صورت هر دو ارث می برند ."}, {"title": "ماده ۸۸۹", "content": "ماده ۸۸۹- در بین وراثت طبقه اولی اگر برای میت اولادی نباشد اولاد اولاد او هرقدر که پایین بروند قائم مقام پدر یا مادر خود بوده و با\nهر یک از ابوین متوفی که زنده باشد ارث می برند ولی در بین اولاد اقرب به میت ابعد را از ارث محروم می نماید."}, {"title": "ماده ۸۹۰", "content": "ماده ۸۹۰- در بین وراث طبقه دوم اگر برای متوفی برادر یا خواهر نباشد اولاد اخوه هرقدر که پایین بروند قائم مقام پدر یا مادر خود بوده\nبا هر یک از اجداد متوفی که زنده باشد ارث می برند لیکن در بین اجداد یا اولاد اخوه اقرب به متوفی ابعد را از ارث محروم می کند.\nمفاد این ماده در مورد وارث طبقه سوم نیز مجری می باشد."}, {"title": "ماده ۸۹۱", "content": "ماده ۸۹۱- وراث ذیل حاجب از ارث ندارد :\nپدر- مادر- پسر- دختر- زوج و زوجه."}, {"title": "ماده ۸۹۲", "content": "ماده ۸۹۲- حجب از بعض فرض در موارد ذیل است :\nالف- وقتی که برای میت اولاد یا اولاد اولاد باشد در این صورت ابوین میت از بردن بیش از یک ثلث محروم می شوند مگر در مورد ماده\n۹۰۸ و ۹۰۹ که ممکن است هر یک از ابوین به عنوان قرابت یا رد بیش از یک سدس ببرد و همچنین زوج از بردن بیش از یک ربع و\nزوجه از بردن بیش از یک ثمن محروم می شود.\nب- وقتیکه برای میت چند برادر یا خواهر باشد در این صورت مادر میت از بردن بیش از یک سدس محروم می شود مشروط بر اینکه:\nاولاً - لااقل دو برادر یا یک برادر با دو خواهر یا چهار خواهر باشند.\nثانیاً - پدر آنها زنده باشد .\nثالثاً - از ارث ممنوع نباشد مگر به سبب قتل .\nرابعاً - ابوینی یا ابی تنها باشند.\nقانون مدنی\nفصل پنجم - در فرض و صاحبان فرض"}, {"title": "ماده ۸۹۳", "content": "ماده ۸۹۳- وراث بعضی به فرض بعضی به قرابت و بعضی گاه به فرض و گاهی به قرابت ارث می برند ."}, {"title": "ماده ۸۹۴", "content": "ماده ۸۹۴- صاحبان فرض اشخاصی هستند که سهم آنان از ترکه معین است و صاحبان قرابت کسانی هستند که سهم آن ها معین\nنیست."}, {"title": "ماده ۸۹۵", "content": "ماده ۸۹۵- سهام معینه که فرض نامیده می شود عبارت است از نصف، ربع، ثمن، دو ثلث، ثلث و سدس ترکه ."}, {"title": "ماده ۸۹۶", "content": "ماده ۸۹۶- اشخاصی که به فرض ارث می برند عبارتند از مادر و زوج و زوجه ."}, {"title": "ماده ۸۹۷", "content": "ماده ۸۹۷- اشخاصی که گاهی به فرض و گاهی به قرابت ارث می برند عبارتند از پدر، دختر و دخترها، خواهر و خواهرهای ابی یا ابوینی\nو کلالهامی."}, {"title": "ماده ۸۹۸", "content": "ماده ۸۹۸- وراث دیگر به غیر از مذکورین در دو ماده فوق فقط به قرابت ارث می برند ."}, {"title": "ماده ۸۹۹", "content": "ماده ۸۹۹- فرض سه وارث نصف ترکه است :\n۱ )شوهر در صورت نبودن اولاد برای متوفاه اگر چه از شوهر دیگر باشد .\n۲ )دختر اگر فرزند منحصر باشد .\n۳ )خواهر ابوینی یا ابی تنها در صورتی که منحصر به فرد باشد ."}, {"title": "ماده ۹۰۰", "content": "ماده ۹۰۰- فرض دو وارث ربع ترکه است :\n۱ )شوهر در صورت فوت زن با داشتن اولاد .\n۲ )زوجه یا زوجهها در صورت فوت شوهر بدون اولاد ."}, {"title": "ماده ۹۰۱", "content": "ماده ۹۰۱- ثمن فریضه زوجه یا زوجه ها است در صورت فوت شوهر با داشتن اولاد ."}, {"title": "ماده ۹۰۲", "content": "ماده ۹۰۲- فرض دو وارث دو ثلث ترکه است :\n۱ )دو دختر و بیشتر در صورت نبودن اولاد ذکور .\n۲ )دو خواهر و بیشتر ابوینی یا ابی تنها با نبودن برادر ."}, {"title": "ماده ۹۰۳", "content": "ماده ۹۰۳- فرض دو وارث ثلث ترکه است :\n۱ )مادر متوفی در صورتی که میت اولاد و اخوه نداشته باشد .\n۲ )کلاله امی در صورتی که بیش از یکی باشد ."}, {"title": "ماده ۹۰۴", "content": "ماده ۹۰۴- فرض سه وارث سدس ترکه است پدر و مادر و کلاله امی اگر تنها باشد ."}, {"title": "ماده ۹۰۵", "content": "ماده ۹۰۵- از ترکه میت هر صاحب فرض حصه خود را می برد و بقیه به صاحبان قرابت می رسد و اگر صاحب قرابتی در آن طبقه مساوی\nبا صاحب فرض در درجه نباشد باقی به صاحب فرض رد می شود مگر در مورد زوج و زوجه که به آن ها رد نمی شود لیکن اگر برای متوفی\nوارث به غیر از زوج نباشد زائد از فریضه به او رد می شود.\nقانون مدنی\nفصل ششم - در سهم الارث طبقات مختلفه وراث\nمبحث اول - در سهم الارث طبقه اولی"}, {"title": "ماده ۹۰۶", "content": "ماده ۹۰۶- اگر برای متوفی اولاد یا اولاد اولاد از هر درجه که باشند موجود نباشد هر یک از ابوین در صورت انفراد تمام ارث را می برد و\nاگر پدر و مادر میت هر دو زنده باشند مادر یک ثلث و پدر دو ثلث می برد لیکن اگر مادر حاجب داشته باشد سدس از ترکه متعلق به\nمادر و بقیه مال پدر است."}, {"title": "ماده ۹۰۷", "content": "ماده ۹۰۷- اگر متوفی ابوین نداشته و یک یا چند نفر اولاد داشته باشد ترکه به طریق ذیل تقسیم می شود:\nاگر فرزند منحصر به یکی باشد خواه پسر خواه دختر تمام ترکه به او می رسد .\nاگر اولاد متعدد باشند ولی تمام پسر یا تمام دختر ترکه بین آن ها بالسویه تقسیم میشود.\nاگر اولاد متعدد باشند و بعضی از آنها پسر و بعضی دختر پسر دو برابر دختر می برد ."}, {"title": "ماده ۹۰۸", "content": "ماده ۹۰۸- هر گاه پدر یا مادر متوفی یا هر دو ابوین او موجود باشند با یک دختر فرض هر یک از پدر و مادر سدس ترکه و فرض دختر\nنصف آن خواهد بود و مابقی باید بین تمام وراث به نسبت فرض آن ها تقسیم شود مگر اینکه مادر حاجب داشته باشد که در این صورت\nمادر از مابقی چیزی نمی برد ."}, {"title": "ماده ۹۰۹", "content": "ماده ۹۰۹- هر گاه پدر یا مادر متوفی یا هر دو ابوین او موجود باشند با چند دختر فرض تمام دخترها دو ثلث ترکه خواهد بود که بالسویه\nبین آنها تقسیم میشود و فرض هر یک از پدر و مادر یک سدس و مابقی اگر باشد بین تمام ورثه به نسبت فرض آن ها تقسیم می شود\nمگر اینکه مادر حاجب داشته باشد در این صورت مادر از باقی چیزی نمی برد ."}, {"title": "ماده ۹۱۰", "content": "ماده ۹۱۰- هر گاه میت اولاد داشته باشد گرچه یک نفر اولاد اولاد او ارث نمی برند ."}, {"title": "ماده ۹۱۱", "content": "ماده ۹۱۱- هر گاه میت اولادی بلاواسطه نداشته باشد اولاد اولاد او قائممقام اولاد بوده و بدین طریق جزو وارث طبقه اول محسوب و با\nهر یک از ابوین که زنده باشد ارث می برد .\nتقسیم ارث بین اولاد اولاد بر حسب نسل به عمل می آید یعنی هر نسل حصه کسی را می برد که به توسط او به میت می رسد بنابراین\nاولاد پسر دو برابر اولاد دختر می برند .\nدر تقسیم بین افراد یک نسل پسر دو برابر دختر می برد ."}, {"title": "ماده ۹۱۲", "content": "ماده ۹۱۲- اولاد اولاد تا هر درجه که پایین بروند به طریق مذکور در ماده فوق ارث می برند با رعایت اینکه اقرب به میت ابعد را محروم\nمی کند."}, {"title": "ماده ۹۱۳", "content": "ماده ۹۱۳- در تمام صور مذکوره در این مبحث هر یک از زوجین که زنده باشد فرض خود را می برد و این فرض عبارت است از نصف\nترکه برای زوج و ربع آن برای زوجه در صورتی که میت اولاد یا اولاد اولاد نداشته باشد و از ربع ترکه برای زوج و ثمن آن برای زوجه د ر\nصورتی که میت اولاد یا اولاد اولاد داشته باشد و مابقی ترکه بر طبق مقررات مواد قبل مابین سایر وراث ت قسیم می شود."}, {"title": "ماده ۹۱۴", "content": "ماده ۹۱۴- اگر به واسطه بودن چندین نفر صاحبان فرض ترکه میت کفایت نصیب تمام آن ها را نکند نقص بر بنت و بنتین وارد می شود\nو اگر پس از موضوع کردن نصیب صاحبان فرض زیادتی باشد و وارثی نباشد که زیاده را به عنوان قرابت ببرد این زیاده بین صاحبان فرض\nبر طبق مقررات مواد فوق تقسیم می شود لیکن زوج و زوجه مطلقاً و مادر اگر حاجب داشته باشد از زیادی چیزی نمی برد ."}, {"title": "ماده ۹۱۵", "content": "ماده ۹۱۵- انگشتری که میت معمولاً استعمال می کرده و همچنین قرآن و رخت های شخصی و شمشیر او به پسر بزرگ او می رسد بدون\nاینکه از حصه او از این حیث چیزی کسر شود مشروط بر اینکه ترکه میت منحصر به این اموال نباشد .\nقانون مدنی\nمبحث دوم - در سهم الارث طبقه دوم"}, {"title": "ماده ۹۱۶", "content": "ماده ۹۱۶- هر گاه برای میت وارث طبقه اولی نباشد ترکه او به وارث طبقه ثانیه می رسد ."}, {"title": "ماده ۹۱۷", "content": "ماده ۹۱۷- هر یک از وراث طبقه دوم اگر تنها باشد تمام ارث را می برد و اگر متعدد باشند ترکه بین آن ها بر طبق مواد ذیل تقسیم\nمی شود."}, {"title": "ماده ۹۱۸", "content": "ماده ۹۱۸- اگر میت اخوه ابوینی داشته باشد اخوه ابی ارث نمی برند در صورت نبودن اخوه ابوینی اخوه ابی حصه ارث آن ها را می برند .\nاخوه ابوینی و اخوه ابی هیچکدام اخوه امی را از ارث محروم نمی کنند."}, {"title": "ماده ۹۱۹", "content": "ماده ۹۱۹- اگر وارث میت چند برادر ابوینی یا چند برادر ابی یا چند خواهر ابوینی یا چند خواهر ابی باشند ترکه بین آن ها بالسویه تقسیم\nمی شود."}, {"title": "ماده ۹۲۰", "content": "ماده ۹۲۰- اگر وارث میت چند برادر و خواهر ابوینی یا چند برادر و خواهر ابی باشند حصه ذکور دو برابر اناث خواهد بود ."}, {"title": "ماده ۹۲۱", "content": "ماده ۹۲۱- اگر وراث چند برادر امی یا چند خواهر امی یا چند برادر و خواهر امی باشند ترکه بین آن ها بالسویه تقسیم میشود."}, {"title": "ماده ۹۲۲", "content": "ماده ۹۲۲- هر گاه اخوه ابوینی و اخوه امی با هم باشند تقسیم به طریق ذیل می شود:\nاگر برادر یا خواهر امی یکی باشد سدس ترکه را می برد و بقیه مال اخوه ابوینی یا ابی است که به طریق مذکور در فوق تقسیم می نمایند.\nاگر کلالهامی متعدد باشد ثلث ترکه به آن ها تعلق گرفته و بین خود بالسویه تقسیم می کنند و بقیه مال اخوه ابوینی یا ابی است که\nمطابق مقررات مذکور در فوق تقسیم می نمایند."}, {"title": "ماده ۹۲۳", "content": "ماده ۹۲۳- هر گاه ورثه اجداد یا جدات باشد ترکه به طریق ذیل تقسیم می شود:\nاگر جد یا جده تنها باشد اعم از ابی یا امی تمام ترکه به او تعلق می گیرد .\nاگر اجداد و جدات متعدد باشند در صورتی که ابی باشند ذکور دو برابر اناث می برد و اگر همه امی باشند بین آن ها بالسویه تقسیم\nمی گردد .\nاگر جد یا جده ابی و جد یا جده امی با هم باشند ثلث ترکه به جد یا جده امی می رسد و در صورت تعداد اجداد امی آن ثلث بین آن ها\nبالسویه تقسیم میشود و دو ثلث دیگر به جد یا جده ابی میرسد و در صورت تعدد حصه ذکور از آن دو ثلث دو برابر حصه اناث خواهد\nبود."}, {"title": "ماده ۹۲۴", "content": "ماده ۹۲۴- هر گاه میت اجداد و کلاله با هم داشته باشد دو ثلث ترکه به وراثی می رسد که از طرف پدر قرابت دارند و در تقسیم آن حصه\nذکور دو برابر اناث خواهد بود و یک ثلث به وراثی می رسد که از طرف مادر قرابت دارند و بین خود بالسویه تقسیم می نمایند لیکن اگر\nخویش مادری فقط یک برادر یا یک خواهر امی باشد فقط سدس ترکه به او تعلق خواهد گرفت ."}, {"title": "ماده ۹۲۵", "content": "ماده ۹۲۵- در تمام صور مذکوره در مواد فوق اگر برای میت نه برادر باشد و نه خواهر اولاد اخوه قائم مقام آنها شده و با اجداد ارث\nمی برند در این صورت تقسیم ارث نسبت به اولاد اخوه بر حسب نسل به عمل می آید یعنی هر نسل حصه کسی را می برد که به واسطه\nاو به میت میرسد بنابراین اولاد اخوه ابوینی یا ابی حصه اخوه ابوینی یا ابی تنها و اولاد کلاله امی حصه کلالهامی را می برند .\nدر تقسیم بین افراد یک نسل اگر اولاد اخوه ابوینی یا ابی تنها باشند ذکور دو برابر اناث می برد و اگر از کلاله امی باشند بالسویه تقسیم\nمی کنند."}, {"title": "ماده ۹۲۶", "content": "ماده ۹۲۶- در صورت اجتماع کلاله ابوینی و ابی و امی کلاله ابی ارث نمی برد ."}, {"title": "ماده ۹۲۷", "content": "ماده ۹۲۷- در تمام مواد مذکوره در این مبحث هر یک از زوجین که باشد فرض خود را از اصل ترکه می برد و این فرض عبارت است از\nنصف اصل ترکه برای زوج و ربع آن برای زوجه .\nمتقربین به مادر هم اعم از اجداد یا کلاله فرض خود را از اصل ترکه می برند .\nقانون مدنی\nهر گاه به واسطه ورود زوجه یا زوجه نقصی موجود گردد نقص بر کلاله ابوینی یا ابی یا بر اجداد ابی وارد می شود.\nمبحث سوم - در سهم الارث وارث طبقه سوم"}, {"title": "ماده ۹۲۸", "content": "ماده ۹۲۸- هر گاه برای میت وراث طبقه دوم نباشد ترکه او به وراث طبقه سوم می رسد ."}, {"title": "ماده ۹۲۹", "content": "ماده ۹۲۹- هر یک از وراث طبقه سوم اگر تنها باشد تمام ارث را می برد و اگر متعدد باشند ترکه بین آن ها بر طبق مواد ذیل تقسیم\nمی شود."}, {"title": "ماده ۹۳۰", "content": "ماده ۹۳۰- اگر میت اعمام یا اخوال ابوینی داشته باشد اعمام یا اخوال ابی ارث نمی برند در صورت نبودن اعمام یا اخوال ابوینی اعمام\nیا اخوال ابی حصه آنها را می برند ."}, {"title": "ماده ۹۳۱", "content": "ماده ۹۳۱- هر گاه وارث متوفی چند نفر عمو یا چند نفر عمه باشند ترکه بین آن ها بالسویه تقسیم می شود در صورتی که همه آن ها\nابوینی یا همه ابی یا همه امی باشند.\nهر گاه عمو و عمه با هم باشند در صورتی که همه امی باشند ترکه را بالسویه تقسیم می نمایند و در صورتی که همه ابوینی یا ابی حصه\nذکور دو برابر اناث خواهد بود ."}, {"title": "ماده ۹۳۲", "content": "ماده ۹۳۲- در صورتی که اعمام امی و اعمام ابوینی یا ابی با هم باشند عم یا عمه امی اگر تنها باشند سدس ترکه به او تعلق می گیرد و\nاگر متعدد باشند ثلث ترکه و این ثلث را مابین خود بالسویه تقسیم می کنند و باقی ترکه به اعمام ابوینی یا ابی می رسد که در تقسیم\nذکور دو برابر اناث می برد ."}, {"title": "ماده ۹۳۳", "content": "ماده ۹۳۳- هر گاه وراث متوفی چند نفر دایی یا چند نفر خاله یا چند نفر دایی و چند نفر خاله با هم باشند ترکه بین آن ها بالسویه تقسیم\nمی شود خواه همه ابوینی خواه همه ابی و خواه همه امی باشند."}, {"title": "ماده ۹۳۴", "content": "ماده ۹۳۴- اگر وراث میت دایی و خاله ابی یا ابوینی یا دایی و خاله امی باشند طرف امی اگر یکی باشد سدس ترکه را می برد و اگر متعدد\nباشند ثلث آن را می برند و بین خود بالسویه تقسیم می کنند و مابقی مال دایی و خالههای ابوینی یا ابی است که آنها هم بین خود\nبالسویه تقسیم می نمایند."}, {"title": "ماده ۹۳۵", "content": "ماده ۹۳۵- اگر برای میت یک یا چند نفر اعمام یا یک یا چند نفر اخوال باشد ثلث ترکه به اخوال دوثلث آن به اعمام تعلق می گیرد .\nتقسیم ثلث بین اخوال بالسویه به عمل میآید لیکن اگر بین اخوال یک نفر امی باشد سدس حصه اخوال به او میرسد و اگر چند نفر\nامی باشند ثلث آن حصه به آنها داده می شود و در صورت اخیر تقسیم بین آن ها بالسویه به عمل می آید. در تقسیم دو ثلث بین اعمام\nحصه ذکور دو برابر اناث خواهد بود لیکن اگر بین اعمام یک نفر امی باشد سدس حصه اعمام به او می رسد و اگر چند نفر امی باشند\nثلث آن حصه به آنها میرسد و در صورت اخیر آن ثلث را بالسویه تقسیم می کنند.\nدر تقسیم پنج سدس و یا دو ثلث که از حصه اعمام باقی می ماند بین اعمام ابوینی یا ابی حصه و ذکور دو برابر اناث خواهد بود ."}, {"title": "ماده ۹۳۶", "content": "ماده ۹۳۶- با وجود اعمام یا اخوال اولاد آن ها ارث نمی برند مگر در صورت انحصار وارث به یک پسرعموی ابوینی با یک عموی ابی تنها\nکه فقط در این صورت پسر عمو عمو را از ارث محروم می کند لیکن اگر با پسرعموی ابوینی خال یا خاله باشد یا اعمام متعدد باشند ولو\nابی تنها پسرعمو ارث نمی برد ."}, {"title": "ماده ۹۳۷", "content": "ماده ۹۳۷- هر گاه برای میت نه اعمام باشد و نه اخوال اولاد آن ها به جای آنها ارث می برند و نصیب هر نسل نصیب کسی خواهد بود\nکه به واسطه او به میت متصل میشود."}, {"title": "ماده ۹۳۸", "content": "ماده ۹۳۸- در تمام موارد مزبوره در این مبحث هر یک از زوجین که باشد فرض خود را از اصل ترکه می برد و این فرض عبارت است از\nنصف اصل ترکه برای زوج و ربع آن برای زوجه .\nمتقرب به مادر هم نصیب خود را از اصل ترکه می برد باقی ترکه مال متقرب به پدر است و اگر نقصی هم باشد بر متقربین به پدر وارد\nمی شود.\nقانون مدنی"}, {"title": "ماده ۹۳۹", "content": "ماده ۹۳۹- در تمام موارد مذکوره در این مبحث و دو مبحث قبل اگر وارث خنثی بوده و از جمله وراثی باشد که از ذکور آن ها دو برابر\nاناث می برند سهم الارث او به طریق ذیل معین می شود:\nاگر علائم رجولیت غالب باشد سهم الارث یک پسر از طبقه خود و اگر علائم اناثیت غلبه داشته باشد سهم الارث یک دختر از طبقه خود\nرا می برد و اگر هیچ یک از علائم غالب نباشد نصف مجموع سهم الارث یک پسر و یک دختر از طبقه خود را خواهد برد .\nمبحث چهارم - در میراث زوج و زوجه"}, {"title": "ماده ۹۴۰", "content": "ماده ۹۴۰- زوجین که زوجیت آن ها دائمی بوده و ممنوع از ارث نباشند از یکدیگر ارث می برند ."}, {"title": "ماده ۹۴۱", "content": "ماده ۹۴۱- سهم الارث زوج و زوجه از ترکه یکدیگر به طوری است که در مواد ۹۱۳- ۹۲۷ و ۹۳۸ ذکر شده است."}, {"title": "ماده ۹۴۲", "content": "ماده ۹۴۲- در صورت تعدد زوجات ربع یا ثمن ترکه که تعلق به زوجه دارد بین همه آنان بالسویه تقسیم می شود."}, {"title": "ماده ۹۴۳", "content": "ماده ۹۴۳- اگر شوهر زن خود را به طلاق رجعی مطلقه کند هر یک از آن ها که قبل از انقضای عده بمیرد دیگری از او ارث می برد لیکن\nاگر فوت یکی از آنها بعد از انقضای عده بوده و یا طلاق بائن باشد از یکدیگر ارث نمی برند ."}, {"title": "ماده ۹۴۴", "content": "ماده ۹۴۴- اگر شوهر در حال مرض زن خود را طلاق دهد و در ظرف یک سال از تاریخ طلاق به همان مرض بمیرد زوجه او ارث می برد\nاگر چه طلاق بائن باشد مشروط بر اینکه زن شوهر نکرده باشد ."}, {"title": "ماده ۹۴۵", "content": "ماده ۹۴۵- اگر مردی در حال مرض زنی را عقد کند و در همان مرض قبل از دخول بمیرد زن از او ارث نمی برد لیکن اگر بعد از دخول\nیا بعد از صحت یافتن از آن مرض بمیرد زن از او ارث می برد ."}, {"title": "ماده ۹۴۶ (اصلاحی ۶/۱۱/۱۳۸۷)", "content": "ماده ۹۴۶ (اصلاحی ۶/۱۱/۱۳۸۷)- زوج از تمام اموال زوجه ارث می برد و زوجه در صورت فرزنددار بودن زوج یک هشتم از عین اموال\nمنقول و یکهشتم از قیمت اموال غیرمنقول اعم از عرصه و اعیان ارث می برد در صورتی که زوج هیچ فرزندی نداشته باشد سهم زوجه\nیکچهارم از کلیه اموال به ترتیب فوق می باشد.\nتبصره (الحاقی ۲۶/ ۵/۱۳۸۹)- مفاد این ماده در خصوص وراث متوفایی که قبل از تصویب آن فوت کرده ولی هنوز ترکه او تقسیم نشده\nاست نیز لازم الاجرا است ."}, {"title": "ماده ۹۴۷", "content": "ماده ۹۴۷- ]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۶/۱۱/۱۳۸۷ نسخ صریح شده است.["}, {"title": "ماده ۹۴۸ (اصلاحی ۶/۱۱/۱۳۸۷)", "content": "ماده ۹۴۸ (اصلاحی ۶/۱۱/۱۳۸۷)- هرگاه ورثه از ادای قیمت امتناع کنند زن می تواند حق خود را از عین اموال استیفا کند ."}, {"title": "ماده ۹۴۹", "content": "ماده ۹۴۹- در صورت نبودن هیچ وارث دیگر به غیر از زوج یا زوجه شوهر تمام ترکه زن متوفاه خود را می برد لیکن زن فقط نصیب\nخود را و بقیه ترکه شوهر در حکم مال اشخاص بلاوارث و تابع ماده ۸۶۶ خواهد بود.\nکتاب سوم - در مقررات مختلفه"}, {"title": "ماده ۹۵۰", "content": "ماده ۹۵۰- مِثلی که در این قانون ذکر شده عبارت از مالی است که اشباه و نظائر آن نوعاً زیاد و شایع باشد مانند حبوبات و نحو آن و\nقیمی مقابل آن است معذالک تشخیص این معنی با عرف می باشد."}, {"title": "ماده ۹۵۱", "content": "ماده ۹۵۱- تعدی تجاوز نمودن از حدود اذن یا متعارف است نسبت به مال یا حق دیگری ."}, {"title": "ماده ۹۵۲", "content": "ماده ۹۵۲- تفریط عبارت است از ترک عملی که به موجب قرارداد یا متعارف برای حفظ مال غیر لازم است ."}, {"title": "ماده ۹۵۳", "content": "ماده ۹۵۳- تقصیر اعم است از تفریط و تعدی ."}, {"title": "ماده ۹۵۴", "content": "ماده ۹۵۴- کلیه عقود جائزه به موت احد طرفین منفسخ می شود و همچنین به سفه در مواردی که رشد معتبر است ."}, {"title": "ماده ۹۵۵", "content": "ماده ۹۵۵- مقررات این قانون در مورد کلیه اموری که قبل از این قانون واقع شده معتبر است.\nقانون مدنی\nجلد دوم - در اشخاص\nکتاب اول - در کلیات"}, {"title": "ماده ۹۵۶", "content": "ماده ۹۵۶- اهلیت برای دارا بودن حقوق با زنده متولد شدن انسان شروع و با مرگ او تمام می شود."}, {"title": "ماده ۹۵۷", "content": "ماده ۹۵۷- حمل از حقوق مدنی متمتع می گردد مشروط بر اینکه زنده متولد شود ."}, {"title": "ماده ۹۵۸", "content": "ماده ۹۵۸- هر انسان متمتع از حقوق مدنی خواهد بود لیکن هیچکس نمیتواند حقوق خود را اعمال و اجرا کند مگر اینکه برای این امر\nاهلیت قانونی داشته باشد."}, {"title": "ماده ۹۵۹", "content": "ماده ۹۵۹- هیچکس نمی تواند به طور کلی حق تمتع و یا حق اجرای تمام یا قسمتی از حقوق مدنی را از خود سلب کند ."}, {"title": "ماده ۹۶۰", "content": "ماده ۹۶۰- هیچ کس نمیتواند از خود سلب حریت کند و یا در حدودی که مخالف قوانین و یا اخلاق حسنه باشد از استفاده از حریت\nخود صرف نظر کند ."}, {"title": "ماده ۹۶۱", "content": "ماده ۹۶۱- جز در موارد ذیل اتباع خارجه نیز از حقوق مدنی متمتع خواهند بود:\n۱- در مورد حقوقی که قانون آن را صراحتا منحصر به اتباع ایران نموده و یا آن را صراحتا از اتباع خارجه سلب کرده است .\n۲- در مورد حقوق مربوط به احوال شخصی که قانون دولت متبوع تبعه خارجه آن را قبول نکرد .\n۳- در مورد حقوق مخصوصه که صرفا از نقطه نظر جامعه ایرانی ایجاد شده باشد ."}, {"title": "ماده ۹۶۲", "content": "ماده ۹۶۲- تشخیص اهلیت هر کس برای معامله کردن بر حسب قانون دولت متبوع او خواهد بود معذلک اگر یک نفر تبعه خارجه در\nایران عمل حقوقی انجام دهد در صورتی که مطابق قانون دولت متبوع خود برای انجام آن عمل واجد اهلیت نبوده و یا اهلیت ناقصی\nداشته است آن شخص برای انجام آن عمل و اجد اهلیت محسوب خواهد شد در صورتی که قطع نظر از تابعیت خارجی او\nمطابق قانون ایران نیز بتوان او را برای انجام آن عمل دارای اهلیت تشخیص داد .\nحکم اخیر نسبت به اعمال حقوقی که مربوط به حقوق خانوادگی و یا حقوق ارثی بوده و یا مربوط به نقل و انتقال اموال غیر منقول واقع\nدر خارج ایران می باشد شامل نخواهد بود."}, {"title": "ماده ۹۶۳", "content": "ماده ۹۶۳- اگر زوجین تبعه یک دولت نباشند روابط شخصی و مالی بین آنها تابع قوانین دولت متبوع شوهر خواهد بود."}, {"title": "ماده ۹۶۴", "content": "ماده ۹۶۴- روابط بین ابوین و اولاد تابع قانون دولت متبوع پدر است مگر اینکه نسبت طفل فقط به مادر مسلم باشد که در این صورت\nروابط بین طفل و مادر او تابع قانون دولت متبوع مادر خواهد بود."}, {"title": "ماده ۹۶۵", "content": "ماده ۹۶۵- ولایت قانونی و نصب قیم بر طبق قوانین دولت متبوع مولی علیه خواهد بود."}, {"title": "ماده ۹۶۶", "content": "ماده ۹۶۶- تصرف و مالکیت و سایر حقوق بر اشیای منقول یا غیر منقول تابع قانون مملکتی خواهد بود که آن اشیا در آنجا واقع میباشند\nمعذلک حمل و نقل شدن شیئی منقول از مملکتی به مملکت دیگر نمیتواند به حقوقی که ممکن است اشخاص مطابق قانون محل\nوقوع اولی شیئی نسبت به آن تحصیل کرده باشند خللی وارد آورد ."}, {"title": "ماده ۹۶۷", "content": "ماده ۹۶۷- ترکه منقول یا غیر منقول اتباع خارجه که در ایران واقع است فقط از حیث قوانین اصلیه از قبیل قوانین مربوطه به تعیین\nوارث و مقدار سهم الارث آن ها و تشخیص قسمتی که متوفی می توانسته است به موجب وصیت تملیک نماید تابع قانون دولت متبوع\nمتوفی خواهد بود."}, {"title": "ماده ۹۶۸", "content": "ماده ۹۶۸- تعهدات ناشی از عقود تابع قانون محل وقوع عقد است مگر اینکه متعاقدین اتباع خارجه بوده و آن را صریحاً یا ضمنا\nتابع قانون دیگری قرار داده باشند ."}, {"title": "ماده ۹۶۹", "content": "ماده ۹۶۹- اسناد از حیث طرز تنظیم تابع قانون محل تنظیم خود میباشند.\nقانون مدنی"}, {"title": "ماده ۹۷۰", "content": "ماده ۹۷۰- مامورین سیاسی یا قنسولی دول خارجه در ایران وقتی می توانند به اجرای عقد نکاح مبادرت نمایند که طرفین عقد هر دو\nتبعه دولت متبوع آنها بوده و قوانین دولت مزبور نیز این اجازه را به آن ها داده باشد در هر حال نکاح باید در دفاتر سجل احوال ثبت\nشود."}, {"title": "ماده ۹۷۱", "content": "ماده ۹۷۱- دعاوی از حیث صلاحیت محاکم و قوانین راجعه به اصول محاکمات تابع قانون محلی خواهد بود که در آنجا اقامه می شود\nمطرح بودن همان دعوی در محکمه اجنبی رافع صلاحیت محکمه ایرانی نخواهد بود ."}, {"title": "ماده ۹۷۲", "content": "ماده ۹۷۲- احکام صادره از محاکم خارجه و همچنین اسناد رسمی لازم الاجرا تنظیم شده در خارجه را نمی توان در ایران اجرا نمود مگر\nاینکه مطابق قوانین ایران امر به اجرای آن ها صادر شده باشد."}, {"title": "ماده ۹۷۳", "content": "ماده ۹۷۳- اگر قانون خارجه که باید مطابق ماده ۷ جلد اول این قانون و یا بر طبق مواد فوق رعایت گردد به قانون دیگری احاله داده\nباشد محکمه مکلف به رعایت این احاله نیست مگر اینکه احاله به قانون ایران شده باشد ."}, {"title": "ماده ۹۷۴", "content": "ماده ۹۷۴- مقررات ماده ۷ و مواد ۹۶۲ تا ۹۷۴ این قانون تا حدی به موقع اجرا گذارده می شود که مخالف عهود بینالمللی که دولت\nایران آن را امضا کرده و یا مخالف با قوانین مخصوصه نباشد ."}, {"title": "ماده ۹۷۵", "content": "ماده ۹۷۵- محکمه نمیتواند قوانین خارجی و یا قراردادهای خصوصی را که برخلاف اخلاق حسنه بوده و یا به واسطه جریحه دار کردن\nاحساسات جامعه یا به علت دیگر مخالف با نظم عمومی محسوب می شود به موقع اجرا گذارد اگر چه اجرای قوانین مزبور اصولا مجاز\nباشد.\nکتاب دوم - در تابعیت"}, {"title": "ماده ۹۷۶", "content": "ماده ۹۷۶- اشخاص ذیل تبعه ایران محسوب می شوند:\n۱- کلیه ساکنین ایران به استثنای اشخاصی که تبعیت خارجی آن ها مسلم باشد تبعیت خارجی کسانی مسلم است که مدارک تابعیت\nآنها مورد اعتراض دولت ایران نباشد .\n۲- کسانی که پدر آنها ایرانی است اعم از اینکه در ایران یا در خارجه متولد شده باشند .\n۳- کسانی که در ایران متولد شده و پدر و مادر آنان غیر معلوم باشد .\n۴- کسانی که در ایران از پدر و مادر خارجی که یکی از آن ها در ایران متولد شده به وجود آمده اند.\n۵- کسانی که در ایران از پدری که تبعه خارجه است به وجود آمده و بلافاصله پس از رسیدن به سن هیجده سال تمام لااقل ۱ سال\nدیگر در ایران اقامت کرده باشند و الا قبول شدن آن ها به تابعیت ایران بر طبق مقرراتی خواهد بود که مطابق قانون برای تحصیل تابعیت\nایران مقرر است .\n۶- هر زن تبعه خارجی که شوهر ایرانی اختیار کند .\n۷- هر تبعه خارجی که تابعیت ایران را تحصیل کرده باشد .\nتبصره - اطفال متولد از نمایندگان سیاسی و قنسولی خارجه مشمول فقره ۴ و ۵ نخواهند بود."}, {"title": "ماده ۹۷۷( اصلاحی ۲۷/۱۱/۱۳۴۸)", "content": "ماده ۹۷۷( اصلاحی ۲۷/۱۱/۱۳۴۸) -\nالف- هر گاه اشخاص مذکور در بند ۴ ماده ۹۷۶ پس از رسیدن به سن ۱۸ سال تمام بخواهند تابعیت پدر خود را قبول کنند باید ظرف\nیک سال درخواست کتبی به ضمیمه تصدیق دولت متبوع پدرشان دایر به اینکه آن ها را تبعه خود خواهد شناخت به وزارت امور خارجه\nتسلیم نمایند.\nقانون مدنی\nب- هر گاه اشخاص مذکور در بند ۵ ماده ۹۷۶ پس از رسیدن به سن ۱۸ سال تمام بخواهند به تابعیت پدر خود باقی بمانند باید ظرف\nیک سال درخواست کتبی به ضمیمه تصدیق دولت متبوع پدرشان دایر به اینکه آن ها را تبعه خود خواهد شناخت به وزارت امور خارجه\nتسلیم نمایند."}, {"title": "ماده ۹۷۸", "content": "ماده ۹۷۸- نسبت به اطفالی که در ایران از اتباع دولی متولد شده اند که در مملکت متبوع آنها اطفال متولد از اتباع ایرانی را به موجب\nمقررات تبعه خود محسوب داشته و رجوع آن ها را به تبعیت ایران منوط به اجازه می کنند معامله متقابله خواهد شد."}, {"title": "ماده ۹۷۹", "content": "ماده ۹۷۹- اشخاصی که دارای شرایط ذیل باشند می توانند تابعیت ایران را تحصیل کنند :\n۱- به سن هیجده سال تمام رسیده باشند .\n۲- ۵ سال اعم از متوالی یا متناوب در ایران ساکن بوده باشند .\n۳- فراری از خدمت نظامی نباشند .\n۴- در هیچ مملکتی به جنحه مهم یا جنایت غیر سیاسی محکوم نشده باشند.\nدر مورد فقره دوم این ماده مدت اقامت در خارجه برای خدمت دولت ایران در حکم اقامت در خاک ایران است ."}, {"title": "ماده ۹۸۰", "content": "ماده ۹۸۰- کسانی که به امور عام المنفعه ایران خدمت و یا مساعدت شایانی کرده باشند و همچنین اشخاصی که دارای عیال ایرانی\nهستند و از او اولاد دارند و یا دارای مقامات عالی علمی و متخصص در امور عام المنفعه می باشند و تقاضای ورود به تابعیت دولت\nجمهوری اسلامی ایران را می نمایند در صورتی که دولت ورود آن ها را به تابعیت دولت جمهوری اسلامی ایران صلاح بداند بدون رعایت\nشرط اقامت ممکن است با تصویب هیئت وزیران به تابعیت ایران قبول شوند ."}, {"title": "ماده ۹۸۱", "content": "ماده ۹۸۱-]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۱۴/۸/۱۳۷۰ نسخ صریح شده است .["}, {"title": "ماده ۹۸۲ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۹۸۲ (اصلاحی ۱۴/۸/۱۳۷۰)- اشخاصی که تحصیل تابعیت ایرانی نموده یا بنمایند از کلیه حقوقی که برای ایرانیان مقرر است بهره مند\nمی شوند لیکن نمیتوانند به مقامات زیر نائل گردند :\n۱- ریاست جمهوری و معاونین او .\n۲- عضویت در شورای نگهبان و ریاست قوه قضائیه .\n۳- وزارت و کفالت وزارت و استانداری و فرمانداری .\n۴- عضویت در مجلس شورای اسلامی .\n۵- عضویت شوراهای استان و شهرستان و شهر\n۶- استخدام در وزارت امور خارجه و نیز احراز هرگونه پست و یا مأموریت سیاسی .\n۷- قضاوت.\n۸- عالی ترین رده فرماندهی در ارتش و سپاه و نیروی انتظامی .\n۹- تصدی پستهای مهم اطلاعاتی و امنیتی."}, {"title": "ماده ۹۸۳", "content": "ماده ۹۸۳- درخواست تابعیت باید مستقیما یا به توسط حکام یا ولات به وزارت امور خارجه تسلیم شده و دارای منضمات ذیل باشد :\n۱- سواد مصدق اسناد هویت تقاضاکننده و عیال و اولاد او.\n۲- تصدیقنامه نظمیه دائر به تعیین مدت اقامت تقاضاکننده در ایران و نداشتن سوءسابقه و داشتن مکنت کافی یا شغل معین برای\nتأمین معاش. وزارت امور خارجه در صورت لزوم اطلاعات راجعه به شخص تقاضاکننده را تکمیل و آن را به هیئت وزرا ارسال خواهد\nقانون مدنی\nنمود تا هیئت مزبور در قبول یا رد آن تصمیم مقتضی اتخاذ کند در صورت قبول شدن تقاضا سند تابعیت به درخواست کننده تسلیم\nخواهد شد."}, {"title": "ماده ۹۸۴", "content": "ماده ۹۸۴- زن و اولاد صغیر کسانی که بر طبق این قانون تحصیل تابعیت ایران می نمایند تبعه دولت ایران شناخته می شوند ولی زن در\nظرف ۱ سال از تاریخ صدور سند تابعیت شوهر و اولاد صغیر در ظرف یک سال از تاریخ رسیدن به سن هیجده سال تمام می توانند\nاظهاریه کتبی به وزارت امور خارجه داده و تابعیت مملکت سابق شوهر و یا پدر را قبول کند لیکن به اظهاریه اولاد اعم از ذکور و اناث\nباید تصدیق مذکور در ماده ۹۷۷ ضمیمه شود."}, {"title": "ماده ۹۸۵", "content": "ماده ۹۸۵- تحصیل تابعیت ایرانی پدر به هیچ وجه درباره اولاد او که در تاریخ تقاضانامه به سن هیجده سال تمام رسیده اند مؤثر نمیباشد."}, {"title": "ماده ۹۸۶", "content": "ماده ۹۸۶- زن غیر ایرانی که در نتیجه ازدواج ایرانی می شود میتوانند بعد از طلاق یا فوت شوهر ایرانی به تابعیت اول خود رجوع نماید\nمشروط بر اینکه وزارت امور خارجه را کتبا مطلع کند ولی هر زن شوهرمرده که از شوهر سابق خود اولاد دارد نمی تواند مادام که اولاد\nاو به سن ۱۸ سال تمام نرسیده از این حق استفاده کند و در هر حال زنی که مطابق این ماده تبعه خارجه می شود حق داشتن اموال\nغیر منقوله نخواهد داشت مگر در حدودی که این حق به اتباع خارجه داده شده باشد و هر گاه دارای اموال غیر منقول بیش از آنچه که\nبرای اتباع خارجه داشتن آن جایز است بوده یا بعدا به ارث اموال غیر منقولی بیش از آن حد به او برسد باید در ظرف یک سال از تاریخ\nخروج از تابعیت ایران یا دارا شدن ملک در مورد ارث مقدار مازاد را به نحوی از انحا به اتباع ایران منتقل کند و الا اموال مزبور با نظارت\nمدعی العموم محل بفروش رسیده و پس از وضع مخارج فروش قیمت به آنها داده خواهد شد."}, {"title": "ماده ۹۸۷ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۹۸۷ (اصلاحی ۱۴/۸/۱۳۷۰) - زن ایرانی که با تبعه خارجه مزاوجت می نماید به تابعیت ایرانی خود باقی خواهد ماند مگر اینکه\nمطابق قانون مملکت زوج تابعیت شوهر به واسطه وقوع عقد ازدواج به زوجه تحمیل شود ولی در هر صورت بعد از وفات شوهر و یا\nتفریق به صرف تقدیم درخواست به وزارت امور خارجه به انضمام ورقه تصدیق فوت شوهر و یا سند تفر یق، تابعیت اصلیه زن با جمیع\nحقوق و امتیازات راجعه به آن مجدداً به او تعلق خواهد گرفت .\nتبصره ۱(اصلاحی ۱۴/۸/۱۳۷۰)- هرگاه قانون تابعیت مملکت زوج زن را بین حفظ تابعیت اصلی و تابعیت زوج مخیر بگذارد در این\nمورد زن ایرانی که بخواهد تابعیت مملکت زوج را دارا شود و علل موجهی هم برای تقاضای خود در دست داشته باشد، به شرط تقدیم\nتقاضانامه کتبی به وزارت امور خارجه ممکن است با تقاضا ی او موافقت گردد .\nتبصره ۲(اصلاحی ۱۴/۸/۱۳۷۰)- زن های ایرانی که بر اثر ازدواج تابعیت خارجی را تحصیل می کنند حق داشتن اموال غیرمنقول را در\nصورتی که موجب سلطه اقتصادی خارجی گردد، ندارند، تشخیص این امر با کمیسیونی متشکل از نمایندگان وزارتخانه های امور خارجه\nو کشور و اطلاعات است.\nمقررات ماده ۹۸۸ و تبصره آن در قسمت خروج ایرانیانی که تابعیت خود را ترک نموده اند شامل زنان مزبور نخواهد بود ."}, {"title": "ماده ۹۸۸", "content": "ماده ۹۸۸- اتباع ایران نمی توانند تبعیت خود را ترک کنند مگر به شرایط ذیل :\n۱- به سن ۲۵ سال تمام رسیده باشند .\n۲- هیئت وزرا خروج از تابعیت آنان را اجازه دهد .\n۳- قبلا تعهد نمایند که در ظرف یک سال از تاریخ ترک تابعیت حقوق خود را بر اموال غیر منقول که در ایران دارا می باشند و یا ممکن\nاست بالوراثه دارا شوند ولو قوانین ایران اجازه تملک آن را به اتباع خارجه بدهد به نحوی از انحا به اتباع ایرانی منتقل کنند زوجه و اطفال\nکسی که بر طبق این ماده ترک تابعیت می نمایند اعم از اینکه اطفال مزبور صغیر یا کبیر باشند از تبعیت ایرانی خارج نمی گردد مگر اینکه\nاجازه هیئت وزرا شامل آن ها هم باشد.\n۴- خدمت تحت السلاح خود را انجام داده باشند\nتبصره الف (اصلاحی ۲۷/۱۱/۱۳۴۸)- کسانی که بر طبق این ماده مبادرت به تقاضای ترک تابعیت ایران و قبول تابعیت خارجی می نمایند\nعلاوه بر اجرای مقرراتی که ضمن بند ( ۳) از این ماده درباره آنان مقرر است باید ظرف مدت سه ماه از تاریخ صدور سند ترک تابعیت از\nایران خارج شوند .\nقانون مدنی\nچنانچه ظرف مدت مزبور خارج نشوند مقامات صالحه امر به اخراج آن ها و فروش اموالشان صادر خواهند نمود و تمدید مهلت مقرره\nفوق حداکثر تا یک سال موکول به موافقت وزارت امور خارجه می باشد.\nتبصره ب (الحاقی ۲۷/۱۱/۱۳۴۸)- هیئت وزیران می تواند ضمن تصویب ترک تابعیت زن ایرانی بی شوهر ترک تابعیت فرزندان او را نیز\nکه فاقد پدر و جد پدری هستند و کمتر از ۱۸ سال تمام دارند و یا به جهات دیگری محجورند اجازه دهد. فرزندان زن مذکور نیز که به\nسن ۲۵ سال تمام نرسیده باشند می توانند به تابعیت از درخواست مادر تقاضای ترک تابعیت نمایند ."}, {"title": "ماده ۹۸۹", "content": "ماده ۹۸۹- هر تبعه ایرانی که بدون رعایت مقررات قانونی بعد از تاریخ ۱۲۸۰ شمسی تابعیت خارجی تحصیل کرده باشد تبعیت خارجی\nاو کانلمیکن بوده و تبعه ایران شناخته می شود و از اشتغال به وزارت و معاونت وزارت و عضویت مجالس مقننه و انجمن های ایالتی و\nولایتی و بلدی و هرگونه مشاغل دولتی محروم خواهد بود . (اصلاحی ۲۳/۰۷/۱۴۰۴)\nمتن سابق ماده ۹۸۹- هر تبعه ایرانی که بدون رعایت مقررات قانونی بعد از تاریخ ۱۲۸۰ شمسی تابعیت خارجی تحصیل کرده باشد\nتبعیت خارجی او کان لم یکن بوده و تبعه ایران شناخته می شود ولی در عین حال کلیه اموال غیر منقوله او با نظارت مدعی العموم محل\nبفروش رسیده و پس از وضع مخارج فروش قیمت آن به او داده خواهد شد و بعلاوه از اشتغال به وزارت و معاونت وزارت و عضویت\nمجالس مقننه و انجمنهای ایالتی و ولایتی و بلدی و هرگونه مشاغل دولتی محروم خواهد بود .\nتبصره (الحاقی ۱۱/۱۱/۱۳۳۷)- هیئت وزیران می تواند بنا به مصالحی به پیشنهاد وزارت امور خارجه تابعیت خارجی مشمولین این ماده را\nبه رسمیت بشناسند. به این گونه اشخاص با موافقت وزارت امور خارجه اجازه ورود به ایران یا اقامت می توان داد."}, {"title": "ماده ۹۹۰", "content": "ماده ۹۹۰- از اتباع ایران کسی که خود یا پدرشان موافق مقررات تبدیل تابعیت کرده باشند و بخواهند به تبعیت اصلیه خود رجوع نمایند\nبه مجرد درخواست به تابعیت ایران قبول خواهند شد مگر آ نکه دولت تابعیت آنها را صلاح نداند ."}, {"title": "ماده ۹۹۱ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۹۹۱ (اصلاحی ۱۴/۸/۱۳۷۰)- تکالیف مربوط به اجرای قانون تابعیت و اخذ مخارج دفتری در مورد کسانی که تقاضای تابعیت یا ترک\nتابعیت دولت جمهوری اسلامی ایران و تقاضای بقای بر تابعیت اصلی را دارند به موجب آیین نامه ای که به تصویب هیئت وزیران خواهد\nرسید معین خواهد شد .\nکتاب سوم - در اسناد سجل احوال"}, {"title": "ماده ۹۹۲", "content": "ماده ۹۹۲- سجل احوال هر کس به موجب دفاتری که برای این امر مقرر است معین می شود."}, {"title": "ماده ۹۹۳", "content": "ماده ۹۹۳- امور ذیل باید در ظرف مدت و به طریقی که به موجب قوانین یا نظامات مخصوصه مقرر است به دایره سجل احوال اطلاع\nداده شود.\n۱- ولادت هر طفل و همچنین سقط هر جنین که بعد از ماه ششم از تاریخ حمل واقع شود\n۲- ازدواج اعم از دائم و منقطع\n۳- طلاق اعم از بائن و رجعی و همچنین بذل مدت\n۴- وفات هر شخص"}, {"title": "ماده ۹۹۴", "content": "ماده ۹۹۴- حکم فوت فرضی غایب که بر طبق مقررات کتاب پنجم از جلد دوم این قانون صادر می شود باید در دفتر سجل احوال ثبت\nشود."}, {"title": "ماده ۹۹۵", "content": "ماده ۹۹۵- تغییر مطالبی که در دفاتر سجل احوال ثبت شده است ممکن نیست مگر به موجب حکم محکمه."}, {"title": "ماده ۹۹۶", "content": "ماده ۹۹۶- اگر عدم صحت مطالبی که به دائره سجل احوال اظهار شده است در محکمه ثابت گردد یا هویت کسی که در دفتر سجل\nاحوال به عنوان مجهول الهویه قید شده است معین شود و یا حکم فوت فرضی غایب ابطال گردد مراتب باید در دفاتر مربوطه سجل\nاحوال قید شود.\nقانون مدنی"}, {"title": "ماده ۹۹۷", "content": "ماده ۹۹۷- هر کس باید دارای نام خانوادگی باشد اتخاذ نام های مخصوصی که به موجب نظامنامه اداره سجل احوال معین می شود\nممنوع است."}, {"title": "ماده ۹۹۸", "content": "ماده ۹۹۸- هر کس که اسم خانوادگی او را دیگری بدون حق اتخاذ کرده باشد می تواند اقامه دعوی کرده و در حدود قوانین مربوطه تغییر\nنام خانوادگی غاصب را بخواهد .\nاگر کسی نام خانوادگی خود را که در دفاتر سجل احوال ثبت کرده است مطابق مقررات مربوطه به این امر تغییر دهد هر ذی نفع میتواند\nدر ظرف مدت و به طریقی که در قوانین یا نظامات مخصوصه مقرر است اعتراض کند"}, {"title": "ماده ۹۹۹", "content": "ماده ۹۹۹- سند ولادت اشخاصی که ولادت آنها در مدت قانونی به دائره سجل احوال اظهار شده است سند رسمی محسوب خواهد\nبود."}, {"title": "ماده ۱۰۰۰", "content": "ماده ۱۰۰۰- سایر مطالب راجع به سجل احوال به موجب قوانین و نظامنامه های مخصوصه مقرر است."}, {"title": "ماده ۱۰۰۱", "content": "ماده ۱۰۰۱- مامورین قنسولی ایران در خارجه باید نسبت به ایرانیان مقیم حوزه ماموریت خود وظایفی را که به موجب قوانین و نظامات\nجاریه به عهده دوایر سجل احوال مقرر است انجام دهند .\nکتاب چهارم - در اقامتگاه"}, {"title": "ماده ۱۰۰۲", "content": "ماده ۱۰۰۲- اقامتگاه هر شخصی عبارت از محلی است که شخص در آنجا سکونت داشته و مرکز مهم امور او نیز در آنجا باشد اگر محل\nسکونت شخصی غیر از مرکز مهم امور او باشد مرکز امور او اقامتگاه محسوب است. اقامتگاه اشخاص حقوقی مرکز عملیات آن ها خواهد\nبود."}, {"title": "ماده ۱۰۰۳", "content": "ماده ۱۰۰۳- هیچ کس نمیتواند بیش از یک اقامتگاه داشته باشد."}, {"title": "ماده ۱۰۰۴", "content": "ماده ۱۰۰۴- تغییر اقامتگاه به وسیله سکونت حقیقی در محل دیگر به عمل می آید مشروط بر اینکه مرکز مهم امور او نیز به همان محل\nانتقال یافته باشد."}, {"title": "ماده ۱۰۰۵", "content": "ماده ۱۰۰۵- اقامتگاه زن شوهردار همان اقامتگاه شوهر است معذالک زنی که شوهر او اقامتگاه معلومی ندارد و همچنین زنی که با\nرضایت شوهر خود و یا با اجازه محکمه مسکن علیحده اختیار کرده می تواند اقامتگاه شخصی علیحده نیز داشته باشد."}, {"title": "ماده ۱۰۰۶", "content": "ماده ۱۰۰۶- اقامتگاه صغیر و محجور همان اقامتگاه ولی یا قیم آن ها است."}, {"title": "ماده ۱۰۰۷", "content": "ماده ۱۰۰۷- اقامتگاه مامورین دولتی محلی است که در آنجا ماموریت ثابت دارند ."}, {"title": "ماده ۱۰۰۸", "content": "ماده ۱۰۰۸- اقامتگاه افراد نظامی که در ساخلو هستند محل ساخلو آن هاست."}, {"title": "ماده ۱۰۰۹", "content": "ماده ۱۰۰۹- اگر اشخاص کبیر که معمولا نزد دیگری کار یا خدمت می کنند در منزل کارفرما یا مخدوم خود سکونت داشته باشند اقامتگاه\nآنها همان اقامتگاه کارفرما یا مخدوم آن ها خواهد بود."}, {"title": "ماده ۱۰۱۰", "content": "ماده ۱۰۱۰- اگر ضمن معامله یا قراردادی طرفین معامله یا یکی از آن ها برای اجرای تعهدات حاصله از آن معامله محلی غیر از اقامتگاه\nحقیقی خود انتخاب کرده باشد نسبت به دعاوی راجعه به آن معامله همان محلی که انتخاب شده است اقامتگاه او محسوب خواهد شد\nو همچنین است در صورتی که برای ابلاغ اوراق دعوی و احضار و اخطار محلی را غیر از اقامتگاه حقیقی خود معین کند .\nکتاب پنجم - در غایب مفقودالاثر"}, {"title": "ماده ۱۰۱۱", "content": "ماده ۱۰۱۱- غایب مفقودالاثر کسی است که از غیبت او مدت بالنسبه مدیدی گذشته و از او به هیچ وجه خبری نباشد\nقانون مدنی"}, {"title": "ماده ۱۰۱۲", "content": "ماده ۱۰۱۲- اگر غائب مفقودالاثر برای اداره اموال خود تکلیفی معین نکرده باشد و کسی هم نباشد که قانونا حق تصدی امور او را داشته\nباشد محکمه برای اداره اموال او یک نفر امین معین می کند تقاضای تعیین امین فقط از طرف مدعی العموم و اشخاص ذینفع در این\nامر قبول می شود."}, {"title": "ماده ۱۰۱۳", "content": "ماده ۱۰۱۳- محکمه می تواند از امینی که معین می کند تقاضای ضامن یا تضمینات دیگر نماید."}, {"title": "ماده ۱۰۱۴", "content": "ماده ۱۰۱۴- اگر یکی از وراث غایب تضمینات کافیه بدهد محکمه نمی تواند امین دیگری معین نماید و وارث مزبور به این سمت معین\nخواهد شد."}, {"title": "ماده ۱۰۱۵", "content": "ماده ۱۰۱۵- وظائف و مسئولیت های امینی که به موجب مواد قبل معین میگردد همان است که برای قیم مقرر است ."}, {"title": "ماده ۱۰۱۶", "content": "ماده ۱۰۱۶- هرگاه هم فوت و هم تاریخ فوت غایب مفقودالاثر مسلم شود اموال او بین وراث موجود حین الموت تقسیم میگردد اگر\nچه یک یا چند نفر آنها از تاریخ فوت غایب به بعد فوت کرده باشد ."}, {"title": "ماده ۱۰۱۷", "content": "ماده ۱۰۱۷- اگر فوت غایب بدون تعیین تاریخ فوت ثابت گردد محکمه باید تاریخی را که فوت او در آن تاریخ محقق بوده معین کند\nدر این صورت اموال غائب بین وراثی که در تاریخ مزبور موجود بوده اند تقسیم می شود."}, {"title": "ماده ۱۰۱۸", "content": "ماده ۱۰۱۸- مفاد ماده فوق در موردی نیز رعایت می گردد که حکم موت فرضی غایب صادر شود ."}, {"title": "ماده ۱۰۱۹", "content": "ماده ۱۰۱۹- حکم موت فرضی غایب در موردی صادر می شود که از تاریخ آخرین خبری که از حیات او رسیده است مدتی گذشته باشد\nکه عادتا چنین شخصی زنده نمی ماند."}, {"title": "ماده ۱۰۲۰", "content": "ماده ۱۰۲۰- موارد ذیل از جمله مواردی محسوب است که عادتا شخص غائب زنده فرض نمی شود:\n۱- وقتیکه ده سال تمام از تاریخ آخرین خبری که از حیات غائب رسیده است گذشته و در انقضای مدت مزبور سن غائب از ۷۵ سال\nگذشته باشد.\n۲- وقتیکه یک نفر به عنوانی از عناوین جزء قشون مسلح بوده و در زمان جنگ مفقود و سه سال تمام از تاریخ انعقاد صلح بگذرد\nبدون اینکه خبری از او برسد هرگاه جنگ منتهی به انعقاد صلح نشده باشد مدت مزبور ۵ سال از تاریخ ختم جنگ محسوب می شود.\n۳- وقتیکه یک نفر حین سفر بحری در کشتی بوده که آن کشتی در آن مسافرت تلف شده است سه سال تمام از تاریخ تلف شدن\nکشتی گذشته باشد بدون اینکه از آن مسافر خبری برسد ."}, {"title": "ماده ۱۰۲۱", "content": "ماده ۱۰۲۱- در مورد فقره اخیر ماده قبل اگر با انقضای مدت های ذیل که مبدا آن از روز حرکت کشتی محسوب می شود کشتی به مقصد\nنرسیده باشد و در صورت حرکت بدون مقصد به بندری که از آنجا حرکت کرده بر نگشته و از وجود آن به هیچ وجه خبری نباشد کشتی\nتلف شده محسوب می شود\nالف- برای مسافرت در بحر خزر و داخل خلیج فارس یک سال\nب- برای مسافرت در بحر عمان - اقیانوس هند- بحر احمر- بحر سفید (مدیترانه) - بحر سیاه و بحر آزوف دو سال\nج- برای مسافرت در سایر بحار سه سال"}, {"title": "ماده ۱۰۲۲", "content": "ماده ۱۰۲۲- اگر کسی در نتیجه واقعه ای به غیر آنچه در فقره ۲ و ۳ ماده ۱۰۲۰ مذکور است دچار خطر مرگ گشته و مفقود شده و یا\nدر طیاره بوده و طیاره مفقود شده باشد وقتی می توان حکم موت فرضی او را صادر نمود که پنج سال از تاریخ دچار شدن به خطر مرگ\nبگذرد بدون اینکه خبری از حیات مفقود رسیده باشد ."}, {"title": "ماده ۱۰۲۳", "content": "ماده ۱۰۲۳- در مورد مواد ۱۰۲۰ و ۱۰۲۱ و ۱۰۲۲ محکمه وقتی می تواند حکم موت فرضی غائب را صادر نماید که در یکی از جرائد محل\nو یکی از روزنامه های کثیرالانتشار طهران اعلانی در سه دفعه متوالی هر کدام به فاصله ۱ ماه منتشر کرده و اشخاصی را که ممکن است\nاز غائب خبری داشته باشند دعوت نماید که اگر خبر دارند به اطلاع محکمه برسانند هر گاه یک سال از تاریخ اولین اعلان بگذرد و حیات\nغایب ثابت نشود حکم موت فرضی او داده می شود.\nقانون مدنی"}, {"title": "ماده ۱۰۲۴", "content": "ماده ۱۰۲۴- اگر اشخاص متعدد در یک حادثه تلف شوند فرض بر این می شود که همه آنها در آن واحد مرده اند.\nمفاد این ماده مانع از اجرای مقررات مواد ۸۷۳ و ۸۷۴ جلد اول این قانون نخواهد بود."}, {"title": "ماده ۱۰۲۵", "content": "ماده ۱۰۲۵- وراث غائب مفقودالاثر می توانند قبل از صدور حکم موت فرضی او نیز از محکمه تقاضا نمایند که دارایی او را به تصرف\nآنها بدهد مشروط بر اینکه اولا غائب مزبور کسی را برای اداره کردن اموال خود معین نکرده باشد و ثانیا دو سال تمام از آخرین خبر\nغائب گذشته باشد بدون اینکه حیات یا ممات او معلوم باشد. در مورد این ماده رعایت ماده ۱۰۲۳ راجع به اعلان مدت یک سال حتمی\nاست."}, {"title": "ماده ۱۰۲۶", "content": "ماده ۱۰۲۶- در مورد ماده قبل وراث باید ضامن و یا تضمینات کافیه دیگر بدهند تا در صورت مراجعت غائب و یا در صورتی که اشخاص\nثالث حقی بر اموال او داشته باشند از عهده اموال یا حق اشخاص ثالث برآیند تضمینات مزبور تا موقع صدور حکم موت فرضی غائب\nباقی خواهد بود."}, {"title": "ماده ۱۰۲۷", "content": "ماده ۱۰۲۷- بعد از صدور حکم فوت فرضی نیز اگر غایب پیدا شود کسانی که اموال او را به عنوان وراثت تصرف کرده اند باید آنچه را که\nاز اعیان یا عوض و یا منافع اموال مزبور حین پیدا شدن غائب موجود می باشد مسترد دارند ."}, {"title": "ماده ۱۰۲۸", "content": "ماده ۱۰۲۸- امینی که برای اداره کردن اموال غایب مفقودالاثر معین می شود باید نفقه زوجه دائم یا منقطعه که مدت او نگذشته و نفقه\nاو را زوج تعهد کرده باشد و اولاد غائب را از دارایی غایب تأدیه نماید در صورت اختلاف در میزان نفقه تعیین آن به عهده محکمه است ."}, {"title": "ماده ۱۰۲۹", "content": "ماده ۱۰۲۹- هرگاه شخصی چهار سال تمام غایب مفقودالاثر باشد زن او می تواند تقاضای طلاق کند در این صورت با رعایت ماده ۱۰۲۳\nحاکم او را طلاق می دهد."}, {"title": "ماده ۱۰۳۰", "content": "ماده ۱۰۳۰- اگر شخص غائب پس از وقوع طلاق و قبل از انقضای مدت عده مراجعت نماید نسبت به طلاق حق رجوع دارد ولی بعد از\nانقضای مدت مزبور حق رجوع ندارد .\nکتاب ششم - در قرابت"}, {"title": "ماده ۱۰۳۱", "content": "ماده ۱۰۳۱- قرابت بر دو قسم است قرابت نسبی و قرابت سببی ."}, {"title": "ماده ۱۰۳۲", "content": "ماده ۱۰۳۲- قرابت نسبی به ترتیب طبقات ذیل است :\nطبقه اول- پدر و مادر و اولاد و اولاد اولاد\nطبقه دوم- اجداد و برادر و خواهر و اولاد آن ها\nطبقه سوم- اعمام و عمات و اخوال و خالات و اولاد آن ها در هر طبقه درجات قرب و بعد قرابت نسبی به عده نسل ها در آن طبقه\nمعین می گردد\nمثلا در طبقه اول قرابت پدر و مادر با اولاد در درجه اول و نسبت به اولاد اولاد در درجه دوم خواهد بود و هکذا در طبقه دوم قرابت\nبرادر و خواهر و جد و جده در درجه اول از طبقه دوم و اولاد برادر و خواهر و جد و پدر در درجه دوم از طبقه دوم خواهد بود و در طبقه\nسوم قر ابت عمو و دایی و عمه و خاله در درجه اول از طبقه سوم و درجه اولاد آن ها در درجه دوم از آن طبقه است ."}, {"title": "ماده ۱۰۳۳", "content": "ماده ۱۰۳۳- هر کس در هر خط و به هر درجه که با یک نفر قرابت نسبی داشته باشد در همان خط و به همان درجه قرابت سببی با\nزوج یا زوجه او خواهد داشت بنابراین پدر و مادرزن یک مرد اقربای درجه اول آن مرد و برادر و خواهرشوهر یک زن از اقربای سببی\nدرجه دوم آن زن خواهند بود .\nقانون مدنی\nکتاب هفتم - در نکاح و طلاق\nباب اول - در نکاح\nفصل اول - در خواستگاری"}, {"title": "ماده ۱۰۳۴", "content": "ماده ۱۰۳۴- هر زنی را که خالی از موانع نکاح باشد می توان خواستگاری نمود."}, {"title": "ماده ۱۰۳۵", "content": "ماده ۱۰۳۵- وعده ازدواج ایجاد علقه زوجیت نمی کند اگر چه تمام یا قسمتی از مهریه که بین طرفین برای موقع ازدواج مقرر گردیده\nپرداخته شده باشد بنابراین هر یک از زن و مرد مادام که عقد نکاح جاری نشده می تواند از وصلت امتناع کند و طرف دیگر نمی تواند به\nهیچ وجه او را مجبور به ازدواج کرده یا از جهت صرف امتناع از وصلت مطالبه خسارتی نماید ."}, {"title": "ماده ۱۰۳۶", "content": "ماده ۱۰۳۶- ]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۱۴/۸/۱۳۷۰ نسخ صریح شده است.["}, {"title": "ماده ۱۰۳۷", "content": "ماده ۱۰۳۷- هر یک از نامزدها میتواند در صورت به هم خوردن وصلت منظور هدایایی را که به طرف دیگر یا ابوین او برای وصلت\nمنظور داده است مطالبه کند اگر عین هدایا موجود نباشد مستحق قیمت هدایایی خواهد بود که عادتاً نگاه داشته می شود مگر اینکه\nآن هدایا بدون تقصیر طرف دیگر تلف شده باشد ."}, {"title": "ماده ۱۰۳۸", "content": "ماده ۱۰۳۸- مفاد ماده قبل از حیث رجوع به قیمت در موردی که وصلت منظور در اثر فوت یکی از نامزدها به هم بخورد مجری نخواهد\nبود."}, {"title": "ماده ۱۰۳۹", "content": "ماده ۱۰۳۹- ]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۱۴/۸/۱۳۷۰نسخ صریح شده است.["}, {"title": "ماده ۱۰۴۰", "content": "ماده ۱۰۴۰- هر یک از طرفین می تواند برای انجام وصلت منظور از طرف مقابل تقاضا کند که تصدیق طبیب به صحت از امراض مسریه\nمهم از قبیل سیفلیس و سوزاک و سل ارائه دهد .\nفصل دوم - قابلیت صحی برای ازدواج"}, {"title": "ماده ۱۰۴۱ (اصلاحی ۱/۴/۱۳۸۱ مجمع تشخیص مصلحت نظام)", "content": "ماده ۱۰۴۱ (اصلاحی ۱/۴/۱۳۸۱ مجمع تشخیص مصلحت نظام)- عقد نکاح دختر قبل از رسیدن به سن ۱۳ سال تمام شمسی و پسر\nقبل از رسیدن به سن ۱۵ سال تمام شمسی منوط است به اذن ولی به شرط رعایت مصلحت با تشخیص دادگاه صالح ."}, {"title": "ماده ۱۰۴۲", "content": "ماده ۱۰۴۲- ]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۱۴/۸/۱۳۷۰ نسخ صریح شده است.["}, {"title": "ماده ۱۰۴۳ (اصلاحی ۱۴/ ۸/۱۳۷۰)", "content": "ماده ۱۰۴۳ (اصلاحی ۱۴/ ۸/۱۳۷۰) - نکاح دختر باکره اگر چه به سن بلوغ رسیده باشد موقوف به اجازه پدر یا جد پدر او است و هر گاه\nپدر یا جد پدری بدون علت موجه از دادن اجازه مضایقه کند اجازه او ساقط و در این صورت دختر می تواند با معرفی کامل مردی که\nمی خواهد با او ازدواج نماید و شرایط نکاح و مهری که بین آن ها قرار داده شده پس از اخذ اجازه از دادگاه مدنی خاص به دفتر ازدواج\nمراجعه و نسبت به ثبت ازدواج اقدام نماید ."}, {"title": "ماده ۱۰۴۴ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۰۴۴ (اصلاحی ۱۴/۸/۱۳۷۰) - در صورتی که پدر یا جد پدری در محل حاضر نباشند و استیذان از آن ها نیز عادتاً غیرممکن بوده و\nدختر نیز احتیاج به ازدواج داشته باشد، وی می تواند اقدام به ازدواج نماید .\nتبصره (الحاقی ۱۴/۸/۱۳۷۰)- ثبت این ازدواج در دفترخانه منوط به احراز موارد فوق در دادگاه مدنی خاص می باشد.\nفصل سوم - در موانع نکاح"}, {"title": "ماده ۱۰۴۵", "content": "ماده ۱۰۴۵- نکاح با اقارب نسبی ذیل ممنوع است اگر چه قرابت حاصل از شبهه یا زنا باشد\n۱( نکاح با پدر و اجداد و با مادر و جدات هرقدر که بالا برود .\n۲) نکاح با اولاد هرقدر که پایین برود .\n۳) نکاح با برادر و خواهر و اولاد آن ها تا هرقدر که پایین برود .\nقانون مدنی\n۴) نکاح با عمات و خالات خود و عمات و خالات پدر و مادر و اجداد و جدات."}, {"title": "ماده ۱۰۴۶", "content": "ماده ۱۰۴۶- قرابت رضاعی از حیث حرمت نکاح در حکم قرابت نسبی است مشروط بر اینکه\nاولا- شیر زن از حمل مشروع حاصل شده باشد\nثانیا- شیر مستقیما از پستان مکیده شده باشد\nثالثا- طفل لااقل یک شبانه روز و یا ۱۵دفعه متوالی شیر کامل خورده باشد بدون اینکه در بین غذای دیگر یا شیر زن دیگر را بخورد\nرابعا - شیر خوردن طفل قبل از تمام شدن دو سال از تولد او باشد\nخامسا- مقدار شیری که طفل خورده است از یک زن و از یک شوهر باشد بنابراین اگر طفل در شبانه روز مقداری از شیر یک زن و مقداری\nاز شیر زن دیگر بخورد موجب حرمت نمی شود اگر چه شوهر آن دو زن یکی باشد و همچنین اگر یک زن یک دختر و یک پسر رضاعی\nداشته باشد که هر یک را از شیر متعلق به شوهر دیگر شیر داده باشد آن پسر و یا آن دختر برادر و خواهر رضاعی نبوده و ازدواج بین\nآنها از این حیث ممنوع نمیباشد"}, {"title": "ماده ۱۰۴۷", "content": "ماده ۱۰۴۷- نکاح بین اشخاص ذیل به واسطه مُصاهره ممنوع دائمی است .\n۱ )بین مرد و مادر و جدات زن از هر درجه که باشد اعم از نسبی و رضاعی\n۲ )بین مرد و زنی که سابقا زن پدر و یا زن یکی از اجداد یا زن پسر یا زن یکی از احفاد او بوده است هرچند قرابت رضاعی باشد\n۳ )بین مرد با اناث از اولاد زن از هر درجه که باشد ولو رضاعی مشروط بر اینکه بین زن و شوهر زناشوئی واقع شده باشد"}, {"title": "ماده ۱۰۴۸", "content": "ماده ۱۰۴۸- جمع بین دو خواهر ممنوع است اگر چه به عقد منقطع باشد."}, {"title": "ماده ۱۰۴۹", "content": "ماده ۱۰۴۹- هیچ کس نمیتواند دختر برادر زن و یا دختر خواهر زن خود را بگیرد مگر با اجازه زن خود ."}, {"title": "ماده ۱۰۵۰", "content": "ماده ۱۰۵۰- هر کس زن شوهردار را با علم به وجود علقه زوجیت و حرمت نکاح و یا زنی را که در عده طلاق و یا در عده وفات است با\nعلم به عده و حرمت نکاح برای خود عقد کند عقد باطل و آن زن مطلقا بر آن شخص حرام موبد می شود."}, {"title": "ماده ۱۰۵۱", "content": "ماده ۱۰۵۱- حکم مذکور در ماده فوق در موردی نیز جاری است که عقد از روی جهل به تمام یا یکی از امور مذکوره فوق بوده و نزدیکی\nهم واقع شده باشد. در صورت جهل و عدم وقوع نزدیکی عقد باطل ولی حرمت ابدی حاصل نمی شود."}, {"title": "ماده ۱۰۵۲", "content": "ماده ۱۰۵۲- تفریقی که با لعان حاصل می شود موجب حرمت ابدی است ."}, {"title": "ماده ۱۰۵۳", "content": "ماده ۱۰۵۳- عقد در حال احرام باطل است و با علم به حرمت موجب حرمت ابدی است ."}, {"title": "ماده ۱۰۵۴", "content": "ماده ۱۰۵۴- زنای با زن شوهردار یا زنی که در عده رجعیه است موجب حرمت ابدی است ."}, {"title": "ماده ۱۰۵۵", "content": "ماده ۱۰۵۵- نزدیکی به شبهه و زنا اگر سابق بر نکاح باشد از حیث مانعیت نکاح در حکم نزدیکی با نکاح صحیح است ولی مبطل نکاح\nسابق نیست."}, {"title": "ماده ۱۰۵۶", "content": "ماده ۱۰۵۶- اگر کسی با پسری عمل شنیع کند نمیتواند مادر یا خواهر یا دختر او را تزویج کند ."}, {"title": "ماده ۱۰۵۷", "content": "ماده ۱۰۵۷- زنی که سه مرتبه متوالی زوجه یک نفر بوده و مطلقه شده بر آن مرد حرام می شود مگر اینکه به عقد دائم به زوجیت مردی\nدیگری درآمده و پس از وقوع نزدیکی با او به واسطه طلاق یا فسخ یا فوت فراق حاصل شده باشد ."}, {"title": "ماده ۱۰۵۸", "content": "ماده ۱۰۵۸- زن هر شخصی که به نه طلاق که شش تای آن عدّی است مطلقه شده باشد بر آن شخص حرام مؤبد می شود."}, {"title": "ماده ۱۰۵۹", "content": "ماده ۱۰۵۹- نکاح مسلمه با غیر مسلم جایز نیست."}, {"title": "ماده ۱۰۶۰", "content": "ماده ۱۰۶۰- ازدواج زن ایرانی با تبعه خارجه در مواردی هم که مانع قانونی ندارد موکول به اجازه مخصوص از طرف دولت است .\nقانون مدنی"}, {"title": "ماده ۱۰۶۱", "content": "ماده ۱۰۶۱- دولت می تواند ازدواج بعضی از مستخدمین و مامورین رسمی و محصلین دولتی را با زنی که تبعه خارجه باشد موکول به\nاجازه مخصوص نماید .\nفصل چهارم - شرایط صحت نکاح"}, {"title": "ماده ۱۰۶۲", "content": "ماده ۱۰۶۲- نکاح واقع می شود به ایجاب و قبول به الفاظی که صریحاً دلالت بر قصد ازدواج نماید ."}, {"title": "ماده ۱۰۶۳", "content": "ماده ۱۰۶۳- ایجاب و قبول ممکن است از طرف خود مرد و زن صادر شود و یا از طرف اشخاصی که قانونا حق عقد دارند ."}, {"title": "ماده ۱۰۶۴", "content": "ماده ۱۰۶۴- عاقد باید عاقل و بالغ و قاصد باشد."}, {"title": "ماده ۱۰۶۵", "content": "ماده ۱۰۶۵- توالی عرفی ایجاب و قبول شرط صحت عقد است ."}, {"title": "ماده ۱۰۶۶", "content": "ماده ۱۰۶۶- هرگاه یکی از متعاقدین یا هر دو لال باشند عقد به اشاره از طرف لال نیز واقع می شود مشروط بر اینکه به طور وضوح حاکی\nاز انشای عقد باشد."}, {"title": "ماده ۱۰۶۷", "content": "ماده ۱۰۶۷- تعیین زن و شوهر به نحوی که برای هیچ یک از طرفین در شخص طرف دیگر شبهه نباشد شرط صحت نکاح است ."}, {"title": "ماده ۱۰۶۸", "content": "ماده ۱۰۶۸- تعلیق در عقد موجب بطلان است."}, {"title": "ماده ۱۰۶۹", "content": "ماده ۱۰۶۹- شرط خیار فسخ نسبت به عقد نکاح باطل است ولی در نکاح دائم شرط خیار نسبت به صداق جایز است مشروط بر اینکه\nمدت آن معین باشد و بعد از فسخ مثل آنست که اصلا مهر ذکر نشده باشد."}, {"title": "ماده ۱۰۷۰", "content": "ماده ۱۰۷۰- رضای زوجین شرط نفوذ عقد است و هر گاه مکره بعد از زوال کره عقد را اجازه کند نافذ است مگر اینکه اکراه به درجه بوده\nکه عاقد فاقد قصد باشد.\nفصل پنجم - وکالت در نکاح"}, {"title": "ماده ۱۰۷۱", "content": "ماده ۱۰۷۱- هر یک از مرد و زن می تواند برای عقد نکاح وکالت به غیر دهد ."}, {"title": "ماده ۱۰۷۲", "content": "ماده ۱۰۷۲- در صورتی که وکالت به طور اطلاق داده شود وکیل نمی تواند موکله را برای خود تزویج کند مگر اینکه این اذن صریحاً به او\nداده شده باشد."}, {"title": "ماده ۱۰۷۳", "content": "ماده ۱۰۷۳- اگر وکیل از آنچه که موکل راجع به شخص یا مهر یا خصوصیات دیگر معین کرده تخلف کند صحت عقد متوقف بر تنفیذ\nموکل خواهد بود ."}, {"title": "ماده ۱۰۷۴", "content": "ماده ۱۰۷۴- حکم ماده فوق در موردی نیز جاری است که وکالت بدون قید بوده و وکیل مراعات مصلحت موکل را نکرده باشد .\nفصل ششم - در نکاح منقطع"}, {"title": "ماده ۱۰۷۵", "content": "ماده ۱۰۷۵- نکاح وقتی منقطع است که برای مدت معینی واقع شده باشد ."}, {"title": "ماده ۱۰۷۶", "content": "ماده ۱۰۷۶- مدت نکاح منقطع باید کاملا معین شود."}, {"title": "ماده ۱۰۷۷", "content": "ماده ۱۰۷۷- در نکاح منقطع احکام راجع به وراثت زن و به مهر او همان است که در باب ارث و در فصل آتی مقرر شده است .\nفصل هفتم - در مهر"}, {"title": "ماده ۱۰۷۸", "content": "ماده ۱۰۷۸- هر چیزی را که مالیت داشته و قابل تملک نیز باشد می توان مهر قرار داد ."}, {"title": "ماده ۱۰۷۹", "content": "ماده ۱۰۷۹- مهر باید بین طرفین تا حدی که رفع جهالت آن ها بشود معلوم باشد."}, {"title": "ماده ۱۰۸۰", "content": "ماده ۱۰۸۰- تعیین مقدار مهر منوط به تراضی طرفین است .\nقانون مدنی"}, {"title": "ماده ۱۰۸۱", "content": "ماده ۱۰۸۱- اگر در عقد نکاح شرط شود که در صورت عدم تأدیه مهر در مدت معین نکاح باطل خواهد بود نکاح و مهر صحیح ولی\nشرط باطل است ."}, {"title": "ماده ۱۰۸۲", "content": "ماده ۱۰۸۲- به مجرد عقد زن مالک مهر می شود و میتواند هر نوع تصرفی که بخواهد در آن بنماید .\nتبصره (الحاقی ۲۹/۴/۱۳۷۶)- چنانچه مهریه وجه رایج باشد متناسب با تغییر شاخص قیمت سالانه زمان تأدیه نسبت به سال اجرای\nعقد که توسط بانک مرکزی جمهوری اسلامی ایران تعیین می گردد محاسبه و پرداخت خواهد شد مگر اینکه زوجین در حین اجرای عقد\nبه نحو دیگری تراضی کرده باشند .\nآییننامه اجرایی این قانون حداکثر ظرف مدت سه ماه از تاریخ تصویب توسط بانک مرکزی جمهوری اسلامی ایران با همکاری وزارت\nدادگستری و وزارت امور اقتصادی و دارایی تهیه و به تصویب هیئت وزیران خواهد رسید ."}, {"title": "ماده ۱۰۸۳", "content": "ماده ۱۰۸۳- برای تأدیه تمام و یا قسمتی از مهر می توان مدت یا اقساطی قرار داد ."}, {"title": "ماده ۱۰۸۴", "content": "ماده ۱۰۸۴- هر گاه مهر عین معین باشد و معلوم گردد قبل از عقد معیوب بوده و یا بعد از عقد و قبل از تسلیم معیوب و یا تلف شود\nشوهر ضامن عیب و تلف است."}, {"title": "ماده ۱۰۸۵", "content": "ماده ۱۰۸۵- زن می تواند تا مهر به او تسلیم نشده از ایفای وظائفی که در مقابل شوهر دارد امتناع کند مشروط بر اینکه مهر او حال باشد\nو این امتناع مسقط حق نفقه نخواهد بود."}, {"title": "ماده ۱۰۸۶", "content": "ماده ۱۰۸۶- اگر زن قبل از اخذ مهر به اختیار خود به ایفای وظائفی که در مقابل شوهر دارد قیام نمود دیگر نمی تواند از حکم ماده قبل\nاستفاده کند معذلک حقی که برای مطالبه مهر دارد ساقط نخواهد شد ."}, {"title": "ماده ۱۰۸۷", "content": "ماده ۱۰۸۷- اگر در نکاح دائم مهر ذکر نشده یا عدم مهر شرط شده باشد نکاح صحیح است و طرفین می توانند بعد از عقد مهر را به\nتراضی معین کنند و اگر قبل از تراضی بر مهر معین بین آن ها نزدیکی واقع شود زوجه مستحق مهرالمثل خواهد بود ."}, {"title": "ماده ۱۰۸۸", "content": "ماده ۱۰۸۸- در مورد ماده قبل اگر یکی از زوجین قبل از تعیین مهر و قبل از نزدیکی بمیرد زن مستحق هیچ گونه مهری نیست."}, {"title": "ماده ۱۰۸۹", "content": "ماده ۱۰۸۹- ممکن است اختیار تعیین مهر به شوهر یا شخص ثالثی داده شود در این صورت شوهر یا شخص ثالث می تواند مهر را\nهرقدر بخواهد معین کند ."}, {"title": "ماده ۱۰۹۰", "content": "ماده ۱۰۹۰- اگر اختیار تعیین مهر به زن داده شود زن نمی تواند بیشتر از مهرالمثل معین نماید ."}, {"title": "ماده ۱۰۹۱", "content": "ماده ۱۰۹۱- برای تعیین مهرالمثل باید حال زن از حیث شرافت خانوادگی و سایر صفات و وضعیت او نسبت به اماثل و اقران و اقارب و\nهمچنین معمول محل و غیره در نظر گرفته شود ."}, {"title": "ماده ۱۰۹۲", "content": "ماده ۱۰۹۲- هر گاه شوهر قبل از نزدیکی زن خود را طلاق دهد زن مستحق نصف مهر خواهد بود و اگر شوهر بیش از نصف مهر را قبلا\nداده باشد حق دارد مازاد از نصف را عیناً یا مِثلاً یا قیمتاً استرداد کند ."}, {"title": "ماده ۱۰۹۳", "content": "ماده ۱۰۹۳- هر گاه مهر در عقد ذکر نشده باشد و شوهر قبل از نزدیکی و تعیین مهر زن خود را طلاق دهد زن مستحق مهرالمتعه است\nو اگر بعد از آن طلاق دهد مستحق مهرالمثل خواهد بود ."}, {"title": "ماده ۱۰۹۴", "content": "ماده ۱۰۹۴- برای تعیین مهرالمتعه حال مرد از حیث غنا و فقر ملاحظه می شود."}, {"title": "ماده ۱۰۹۵", "content": "ماده ۱۰۹۵- در نکاح منقطع عدم مهر در عقد موجب بطلان است."}, {"title": "ماده ۱۰۹۶", "content": "ماده ۱۰۹۶- در نکاح منقطع موت زن در اثنای مدت موجب سقوط مهر نمیشود و همچنین است اگر شوهر تا آخر مدت با او نزدیکی\nنکند."}, {"title": "ماده ۱۰۹۷", "content": "ماده ۱۰۹۷- در نکاح منقطع هرگاه شوهر قبل از نزدیکی تمام مدت نکاح را ببخشد باید نصف مهریه را بدهد .\nقانون مدنی"}, {"title": "ماده ۱۰۹۸", "content": "ماده ۱۰۹۸- در صورتی که عقد نکاح اعم از دائم یا منقطع باطل بوده و نزدیکی واقع نشده زن حق مهر ندارد و اگر مهر را گرفته شوهر\nمی تواند آن را استرداد نماید ."}, {"title": "ماده ۱۰۹۹", "content": "ماده ۱۰۹۹- در صورت جهل زن به فساد نکاح و وقوع نزدیکی زن مستحق مهرالمثل است ."}, {"title": "ماده ۱۱۰۰", "content": "ماده ۱۱۰۰- در صورتی که مهرالمسمی مجهول باشد یا مالیت نداشته باشد یا ملک غیر باشد در صورت اول و دوم زن مستحق مهرالمثل\nخواهد بود و در صورت سوم مستحق مثل یا قیمت آن خواهد بود مگر اینکه صاحب مال اجازه نماید ."}, {"title": "ماده ۱۱۰۱", "content": "ماده ۱۱۰۱- هر گاه عقد نکاح قبل از نزدیکی به جهتی فسخ شود زن حق مهر ندارد مگر در صورتی که موجب فسخ عنن باشد که در این\nصورت با وجود فسخ نکاح زن مستحق نصف مهر است .\nفصل هشتم - در حقوق و تکالیف زوجین نسبت به یکدیگر"}, {"title": "ماده ۱۱۰۲", "content": "ماده ۱۱۰۲- همین که نکاح به طور صحت واقع شد روابط زوجیت بین طرفین موجود و حقوق و تکالیف زوجین در مقابل همدیگر برقرار\nمی شود."}, {"title": "ماده ۱۱۰۳", "content": "ماده ۱۱۰۳- زن و شوهر مکلف به حسن معاشرت با یکدیگرند ."}, {"title": "ماده ۱۱۰۴", "content": "ماده ۱۱۰۴- زوجین باید در تشیید مبانی خانواده و تربیت اولاد خود به یکدیگر معاضدت نمایند."}, {"title": "ماده ۱۱۰۵", "content": "ماده ۱۱۰۵- در روابط زوجین ریاست خانواده از خصائص شوهر است ."}, {"title": "ماده ۱۱۰۶", "content": "ماده ۱۱۰۶- در عقد دائم نفقه زن به عهده شوهر است."}, {"title": "ماده ۱۱۰۷ (اصلاحی ۱۹/ ۸/۱۳۸۱)", "content": "ماده ۱۱۰۷ (اصلاحی ۱۹/ ۸/۱۳۸۱)- نفقه عبارت است از همه نیازهای متعارف و متناسب با وضعیت زن از قبیل مسکن، البسه، غذا، اثاث\nمنزل و هزینههای درمانی و بهداشتی و خادم در صورت عادت یا احتیاج به واسطه نقصان یا مرض ."}, {"title": "ماده ۱۱۰۸", "content": "ماده ۱۱۰۸- هر گاه زن بدون مانع مشروع از ادای وظائف زوجیت امتناع کند مستحق نفقه نخواهد بود."}, {"title": "ماده ۱۱۰۹", "content": "ماده ۱۱۰۹- نفقه مطلقه رجعیه در زمان عده بر عهده شوهر است مگر اینکه طلاق در حال نشوز واقع شده باشد لیکن اگر عده از جهت\nفسخ نکاح یا طلاق بائن باشد زن حق نفقه ندارد مگر در صورت حمل از شوهر خود که در این صورت تا زمان وضع حمل حق نفقه\nخواهد داشت."}, {"title": "ماده ۱۱۱۰ (اصلاحی ۱۹/۸/۱۳۸۱)", "content": "ماده ۱۱۱۰ (اصلاحی ۱۹/۸/۱۳۸۱)- در ایام عده وفات، مخارج زندگی زوجه عندالمطالبه از اموال اقاربی که پرداخت نفقه به عهده آنان\nاست (در صورت عدم پرداخت) تأمین می گردد ."}, {"title": "ماده ۱۱۱۱", "content": "ماده ۱۱۱۱- زن می تواند در صورت استنکاف شوهر از دادن نفقه به محکمه رجوع کند در این صورت محکمه میزان نفقه را معین و\nشوهر را به دادن آن محکوم خواهد کرد ."}, {"title": "ماده ۱۱۱۲", "content": "ماده ۱۱۱۲- اگر اجرای حکم مذکور در ماده قبل ممکن نباشد مطابق ماده ۱۱۲۹ رفتار خواهد شد ."}, {"title": "ماده ۱۱۱۳", "content": "ماده ۱۱۱۳- در عقد انقطاع زن حق نفقه ندارد مگر اینکه شرط شده یا آ نکه عقد مبنی بر آن جاری شده باشد."}, {"title": "ماده ۱۱۱۴", "content": "ماده ۱۱۱۴- زن باید در منزلی که شوهر تعیین میکند سُکنیٰ نماید مگر آ نکه اختیار تعیین منزل به زن داده شده باشد."}, {"title": "ماده ۱۱۱۵", "content": "ماده ۱۱۱۵- اگر بودن زن با شوهر در یک منزل متضمن خوف ضرر بدنی و یا مالی یا شرافتی برای زن باشد زن می تواند مسکن علیحده\nاختیار کند و در صورت ثبوت مظنه ضرر مزبور محکمه حکم بازگشت به منزل شوهر نخواهد داد و مادام که زن در بازگشتن به منزل\nمزبور معذور است نفقه بر عهده شوهر خواهد بود."}, {"title": "ماده ۱۱۱۶", "content": "ماده ۱۱۱۶- در مورد ماده فوق مادام که محاکمه بین زوجین خاتمه نیافته محل سکنای زن به تراضی طرفین معین می شود و در صورت\nعدم تراضی محکمه با جلب نظر اقربای نزدیک طرفین منزل زن را معین خواهد نمود و در صورتی که اقربایی نباشد خود محکمه محل\nمورد اطمینان را معین خواهد کرد .\nقانون مدنی"}, {"title": "ماده ۱۱۱۷", "content": "ماده ۱۱۱۷- شوهر می تواند زن خود را از حرفه یا صنعتی که منافی مصالح خانوادگی یا حیثیات خود یا زن باشد منع کند ."}, {"title": "ماده ۱۱۱۸", "content": "ماده ۱۱۱۸- زن مستقلا می تواند در دارایی خود هر تصرفی را که می خواهد بکند."}, {"title": "ماده ۱۱۱۹", "content": "ماده ۱۱۱۹- طرفین عقد ازدواج می توانند هر شرطی که مخالف با مقتضای عقد مزبور نباشد در ضمن عقد ازدواج یا عقد لازم دیگر بنمایند\nمثل اینکه شرط شود هر گاه شوهر زن دیگر بگیرد یا در مدت معینی غائب شود یا ترک انفاق نماید یا بر علیه حیات زن سوءقصد کند\nیا سوء رفتاری نماید که زندگانی آن ها با یکدیگر غیر قابل تحمل شود زن وکیل و وکیل در توکیل باشد که از اثبات تحقق شرط در\nمحکمه و صدور حکم نهایی خود را مطلقه سازد .\nباب دوم - در انحلال عقد نکاح"}, {"title": "ماده ۱۱۲۰", "content": "ماده ۱۱۲۰- عقد نکاح به فسخ یا به طلاق یا به بذل مدت در عقد انقطاع منحل می شود.\nفصل اول - در مورد امکان فسخ نکاح"}, {"title": "ماده ۱۱۲۱", "content": "ماده ۱۱۲۱- جنون هر یک از زوجین به شرط استقرار اعم از این که مستمر یا ادواری باشد برای طرف مقابل موجب حق فسخ است ."}, {"title": "ماده ۱۱۲۲ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۱۲۲ (اصلاحی ۱۴/۸/۱۳۷۰) - عیوب زیر در مرد موجب حق فسخ برای زن خواهد بود :\n۱- خصاء\n۲- عنن به شرط اینکه ولو یک بار عمل زناشوئی را انجام نداده باشد .\n۳- مقطوع بودن آلت تناسلی به اندازه ای که قادر به عمل زناشوئی نباشد ."}, {"title": "ماده ۱۱۲۳", "content": "ماده ۱۱۲۳- عیوب ذیل در زن موجب حق فسخ برای مرد خواهد بود .\n۱- قرن\n۲- جذام\n۳- برص\n۴- افضاء\n۵- زمین گیری\n۶- نابینایی از هر دو چشم"}, {"title": "ماده ۱۱۲۴", "content": "ماده ۱۱۲۴- عیوب زن در صورتی موجب حق فسخ برای مرد است که عیب مزبور در حال عقد وجود داشته است ."}, {"title": "ماده ۱۱۲۵", "content": "ماده ۱۱۲۵- جنون و عنن در مرد هرگاه بعد از عقد هم حادث شود موجب حق فسخ برای زن خواهد بود ."}, {"title": "ماده ۱۱۲۶", "content": "ماده ۱۱۲۶- هر یک از زوجین که قبل از عقد عالم به امراض مذکوره در طرف دیگر بوده بعد از عقد حق فسخ نخواهد داشت ."}, {"title": "ماده ۱۱۲۷", "content": "ماده ۱۱۲۷- هرگاه شوهر بعد از عقد مبتلا به یکی از امراض مقاربتی گردد زن حق خواهد داشت که از نزدیکی با او امتناع نماید و امتناع\nبه علت مزبور مانع حق نفقه نخواهد بود."}, {"title": "ماده ۱۱۲۸", "content": "ماده ۱۱۲۸- هر گاه در یکی از طرفین صفت خاصی شرط شده و بعد از عقد معلوم شود که طرف مذکور فاقد وصف مقصود بوده برای\nطرف مقابل حق فسخ خواهد بود خواه وصف مذکور در عقد تصریح شده یا عقد متبانیاً بر آن واقع شده باشد ."}, {"title": "ماده ۱۱۲۹", "content": "ماده ۱۱۲۹- در صورت استنکاف شوهر از دادن نفقه و عدم امکان اجرای حکم محکمه و الزام او به دادن نفقه زن می تواند برای طلاق به\nحاکم رجوع کند و حاکم شوهر او را اجبار به طلاق می نماید همچنین است در صورت عجز شوهر از دادن نفقه .\nقانون مدنی"}, {"title": "ماده ۱۱۳۰ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۱۳۰ (اصلاحی ۱۴/۸/۱۳۷۰) - در صورتی که دوام زوجیت موجب عسر و حرج زوجه باشد، وی می تواند به حاکم شرع مراجعه و\nتقاضای طلاق کند، چنانچه عسر و حرج مذکور در محکمه ثابت شود، دادگاه می تواند زوج را اجبار به طلاق نماید و در صورتی که اجبار\nمیسر نباشد زوجه به اذن حاکم شرع طلاق داده می شود.\nتبصره (الحاقی ۲۹/۴/۱۳۸۱ مصوب مجمع تشخیص مصلحت نظام)- عسر و حرج موضوع این ماده عبارت است از به وجود آمدن\nوضعیتی که ادامه زندگی را برای زوجه با مشقّت همراه ساخته و تحمل آن مشکل باشد و موارد ذیل در صورت احراز توسط دادگاه صالح\nاز مصادیق عسر و حرج محسوب می گردد :\n۱- ترک زندگی خانوادگی توسط زوج حداقل به مدت شش ماه متوالی و یا نه ماه متناوب در مدت یک سال بدون عذر موجه .\n۲- اعتیاد زوج به یکی از انواع مواد مخدر و یا ابتلای وی به مشروبات الکلی که به اساس زندگی خانوادگی خلل وارد آورد و امتناع یا عدم\nامکان الزام وی به ترک آن در مدتی که به تشخیص پزشک برای ترک اعتیاد لازم بوده است .\nدر صورتی که زوج به تعهد خود عمل ننماید و یا پس از ترک، مجدداً به مصرف موارد مذکور روی آورد، بنا به درخواست زوجه، طلاق\nانجام خواهد شد.\n۳- محکومیت قطعی زوج به حبس پنج سال یا بیشتر.\n۴- ضرب و شتم یا هرگونه سوء رفتار مستمر زوج که عرفاً با توجه به وضعیت زوجه قابل تحمل نباشد .\n۵- ابتلای زوج به بیماریهای صعبالعلاج روانی یا ساری یا هر عارضه صعب العلاج دیگری که زندگی مشترک را مختل نماید .\nموارد مندرج در این ماده مانع از آن نیست که دادگاه در سایر مواردی که عسر و حرج زن در دادگاه احراز شود، حکم طلاق صادر نماید ."}, {"title": "ماده ۱۱۳۱", "content": "ماده ۱۱۳۱- خیار فسخ فوری است و اگر طرفی که حق فسخ دارد بعد از اطلاع به علت فسخ نکاح را فسخ نکند خیار او ساقط می شود\nبه شرط این که علم به حق فسخ و فوریت آن داشته باشد تشخیص مدتی که برای امکان استفاده از خیار لازم بوده به نظر عرف و عادت\nاست."}, {"title": "ماده ۱۱۳۲", "content": "ماده ۱۱۳۲- در فسخ نکاح رعایت ترتیباتی که برای طلاق مقرر است شرط نیست .\nفصل دوم - در طلاق\nمبحث اول - در کلیات"}, {"title": "ماده ۱۱۳۳ (اصلاحی ۱۹/ ۸/۱۳۸۱)", "content": "ماده ۱۱۳۳ (اصلاحی ۱۹/ ۸/۱۳۸۱)- مرد می تواند با رعایت شرایط مقرر در این قانون با مراجعه به دادگاه تقاضای طلاق همسرش را\nبنماید.\nتبصره (الحاقی ۱۹/۸/۱۳۸۱)- زن نیز میتواند با وجود شرایط مقرر در مواد ( ۱۱۱۹)، (۱۱۲۹) و (۱۱۳۰) این قانون، از دادگاه تقاضای طلاق\nنماید."}, {"title": "ماده ۱۱۳۴", "content": "ماده ۱۱۳۴- طلاق باید به صیغه طلاق و در حضور لااقل دو نفر مرد عادل که طلاق را بشنوند واقع گردد ."}, {"title": "ماده ۱۱۳۵", "content": "ماده ۱۱۳۵- طلاق باید منجز باشد و طلاق معلق به شرط باطل است ."}, {"title": "ماده ۱۱۳۶", "content": "ماده ۱۱۳۶- طلاق دهنده باید بالغ و عادل و قاصد و مختار باشد."}, {"title": "ماده ۱۱۳۷", "content": "ماده ۱۱۳۷- ولی مجنون دائمی میتواند در صورت مصلحت مولی علیه زن او را طلاق دهد ."}, {"title": "ماده ۱۱۳۸", "content": "ماده ۱۱۳۸- ممکن است صیغه طلاق را به توسط وکیل اجرا نمود ."}, {"title": "ماده ۱۱۳۹", "content": "ماده ۱۱۳۹- طلاق مخصوص عقد دائم است و زن منقطعه به انقضای مدت یا بذل آن از طرف شوهر از زوجیت خارج می شود."}, {"title": "ماده ۱۱۴۰", "content": "ماده ۱۱۴۰- طلاق زن در مدت عادت زنانه گی یا در حال نفاس صحیح نیست مگر این که زن حامل باشد یا طلاق قبل از نزدیکی با زن\nواقع شود یا شوهر غایب باشد به طوری که اطلاع از عادت زنانه گی بودن زن نتواند حاصل کند.\nقانون مدنی"}, {"title": "ماده ۱۱۴۱", "content": "ماده ۱۱۴۱- طلاق در طهر مواقعه صحیح نیست مگر اینکه زن یائسه یا حامل باشد."}, {"title": "ماده ۱۱۴۲", "content": "ماده ۱۱۴۲- طلاق زنی که با وجود اقتضای سن عادت زنانه گی نمی شود وقتی صحیح است که از تاریخ آخرین نزدیکی با زن سه ماه\nگذشته باشد.\nمبحث دوم - در اقسام طلاق"}, {"title": "ماده ۱۱۴۳", "content": "ماده ۱۱۴۳- طلاق بر دو قسم است. بائن و رجعی ."}, {"title": "ماده ۱۱۴۴", "content": "ماده ۱۱۴۴- در طلاق بائن برای شوهر حق رجوع نیست ."}, {"title": "ماده ۱۱۴۵", "content": "ماده ۱۱۴۵- در موارد ذیل طلاق بائن است\n۱- طلاقی که قبل از نزدیکی واقع شود\n۲- طلاق یائسه\n۳- طلاق خلع و مبارات مادام که زن رجوع به عوض نکرده باشد .\n۴- سومین طلاق که بعد از سه وصلت متوالی به عمل آید اعم از اینکه وصلت در نتیجه رجوع باشد یا در نتیجه نکاح جدید"}, {"title": "ماده ۱۱۴۶", "content": "ماده ۱۱۴۶- طلاق خلع آن است که زن به واسطه کراهتی که از شوهر خود دارد در مقابل مالی که به شوهر می دهد طلاق میگیرد اعم\nاز اینکه مال مزبور عین مهر یا معادل آن و یا بیشتر و یا کمتر از مهر باشد."}, {"title": "ماده ۱۱۴۷", "content": "ماده ۱۱۴۷- طلاق مبارات آن است که کراهت از طرفین باشد ولی در این صورت عوض باید زائد بر میزان مهر نباشد ."}, {"title": "ماده ۱۱۴۸", "content": "ماده ۱۱۴۸- در طلاق رجعی برای شوهر در مدت عده حق رجوع است ."}, {"title": "ماده ۱۱۴۹", "content": "ماده ۱۱۴۹- رجوع در طلاق به هر لفظ یا فعلی حاصل می شود که دلالت بر رجوع کند مشروط بر اینکه مقرون به قصد رجوع باشد .\nمبحث سوم - در عده"}, {"title": "ماده ۱۱۵۰", "content": "ماده ۱۱۵۰- عده عبارت است از مدتی که تا انقضای آن زنی که عقد نکاح او منحل شده است نمی تواند شوهر دیگر اختیار کند."}, {"title": "ماده ۱۱۵۱", "content": "ماده ۱۱۵۱- عده طلاق و عده فسخ نکاح سه طهر است مگر اینکه زن با اقتضای سن عادت زنانگی نبیند که در این صورت عده او ۳ ماه\nاست."}, {"title": "ماده ۱۱۵۲", "content": "ماده ۱۱۵۲- عده طلاق و فسخ نکاح و بذل مدت و انقضای آن در مورد نکاح منقطع در غیر حامل دو طهر است مگر اینکه زن با اقتضای\nسن عادت زنانه گی نبیند که در این صورت ۴۵ روز است."}, {"title": "ماده ۱۱۵۳", "content": "ماده ۱۱۵۳- عده طلاق و فسخ نکاح و بذل مدت و انقضای آن در مورد زن حامله تا وضع حمل است ."}, {"title": "ماده ۱۱۵۴", "content": "ماده ۱۱۵۴- عده وفات چه در دائم و چه در منقطع در هر حال چهار ماه و ده روز است مگر اینکه زن حامل باشد که در این صورت\nعده وفات تا موقع وضع حمل است مشروط بر اینکه فاصله بین فوت شوهر و وضع حمل از چهار ماه و ده روز بیشتر باشد و الا مدت\nعده همان چهار ماه و ده روز خواهد بود."}, {"title": "ماده ۱۱۵۵", "content": "ماده ۱۱۵۵- زنی که بین او و شوهر خود نزدیکی واقع نشده و همچنین زن یائسه نه عده طلاق دارد و نه عده فسخ نکاح ولی عده وفات\nدر هر دو مورد باید رعایت شود ."}, {"title": "ماده ۱۱۵۶", "content": "ماده ۱۱۵۶- زنی که شوهر او غایب مفقودالاثر بوده و حاکم او را طلاق داده باشد باید از تاریخ طلاق عده وفات نگاه دارد ."}, {"title": "ماده ۱۱۵۷", "content": "ماده ۱۱۵۷- زنی که به شبهه با کسی نزدیکی کند باید عده طلاق نگاه دارد .\nقانون مدنی\nکتاب هشتم - در اولاد\nباب اول - در نسب"}, {"title": "ماده ۱۱۵۸", "content": "ماده ۱۱۵۸- طفل متولد در زمان زوجیت ملحق به شوهر است مشروط بر اینکه از تاریخ نزدیکی تا زمان تولد کمتر از شش ماه و بیشتر\nاز ده ماه نگذشته باشد."}, {"title": "ماده ۱۱۵۹", "content": "ماده ۱۱۵۹- هر طفلی که بعد از انحلال نکاح متولد شود ملحق به شوهر است مشروط بر اینکه مادر هنوز شوهر نکرده و از تاریخ انحلال\nنکاح تا روز ولادت طفل بیش از ده ماه نه گذشته باشد مگر آنکه ثابت شود که از تاریخ نزدیکی تا زمان ولادت کمتر از ۶ ماه و یا بیش\nاز ده ماه گذشته باشد."}, {"title": "ماده ۱۱۶۰", "content": "ماده ۱۱۶۰- در صورتی که عقد نکاح پس از نزدیکی منحل شود و زن مجددا شوهر کند و طفلی که از او متولد گردد طفل به شوهری\nملحق می شود که مطابق مواد قبل الحاق او به آن شوهر ممکن است در صورتی که مطابق مواد قبل الحاق طفل به هر دو شوهر ممکن\nباشد طفل ملحق به شوهر دوم است مگر آنکه امارات قطعیه برخلاف آن دلالت کند ."}, {"title": "ماده ۱۱۶۱", "content": "ماده ۱۱۶۱- در مورد مواد قبل هرگاه شوهر صریحاً یا ضمنا اقرار به ابوت خود نموده باشد دعوی نفی ولد از او مسموع نخواهد بود ."}, {"title": "ماده ۱۱۶۲", "content": "ماده ۱۱۶۲- در مورد مواد قبل دعوی نفی ولد باید در صورتی که عادتا پس از تاریخ اطلاع یافتن شوهر از تولد طفل برای امکان اقامه\nدعوی کافی می باشد اقامه گردد و در هر حال دعوی مزبور پس از انقضای دو ماه از تاریخ اطلاع یافتن شوهر از تولد طفل مسموع\nنخواهد بود."}, {"title": "ماده ۱۱۶۳", "content": "ماده ۱۱۶۳- در موردی که شوهر مطلع از تاریخ حقیقی تولد طفل نبوده و تاریخ تولد را بر او مشتبه نموده باشند به نوعی که موجب\nالحاق طفل به او باشد و بعدها شوهر از تاریخ حقیقی تولد مطلع شود مدت مرور زمان دعوی نفی دو ماه از تاریخ کشف خدعه خواهد\nبود."}, {"title": "ماده ۱۱۶۴", "content": "ماده ۱۱۶۴- احکام مواد قبل در مورد طفل متولد از نزدیکی به شبهه نیز جاری است اگر چه مادر طفل مشتبه نباشد ."}, {"title": "ماده ۱۱۶۵", "content": "ماده ۱۱۶۵- طفل متولد از نزدیکی به شبهه فقط ملحق به طرفی می شود که در اشتباه بوده و در صورتی که هر دو در اشتباه بوده اند\nملحق به هر دو خواهد بود."}, {"title": "ماده ۱۱۶۶", "content": "ماده ۱۱۶۶- هرگاه به واسطه وجود مانعی نکاح بین ابوین طفل باطل باشد نسبت طفل به هر یک از ابوین که جاهل بر وجود مانع بوده\nمشروع و نسبت به دیگری نامشروع خواهد بود در صورت جهل هر دو نسب طفل به هر دو مشروع است ."}, {"title": "ماده ۱۱۶۷", "content": "ماده ۱۱۶۷- طفل متولد از زنا ملحق به زانی نمی شود.\nباب دوم - در نگاهداری و تربیت اطفال"}, {"title": "ماده ۱۱۶۸", "content": "ماده ۱۱۶۸- نگاهداری اطفال هم حق و هم تکلیف ابوین است."}, {"title": "ماده ۱۱۶۹ (اصلاحی ۸/۹/۱۳۸۲ مجمع تشخیص مصلحت نظام)", "content": "ماده ۱۱۶۹ (اصلاحی ۸/۹/۱۳۸۲ مجمع تشخیص مصلحت نظام)- برای حضانت و نگهداری طفلی که ابوین او جدا از یکدیگر زندگی\nمی کنند، مادر تا سن هفت سالگی اولویت دارد و پس از آن با پدر است .\nتبصره (الحاقی ۸/۹/۱۳۸۲ مجمع تشخیص مصلحت نظام)- بعد از هفت سالگی در صورت حدوث اختلاف، حضانت طفل با
