 ۳۸۹", "content": "ماده ۳۸۹- اگر در مورد دو ماده فوق تلف شدن مبیع یا نقص آن ناشی از عمل مشتری باشد مشتری حقی بر بایع ندارد و باید ثمن را\nتأدیه کند.\nقانون مدنی\nفقره سوم - در ضَمان درک"}, {"title": "ماده ۳۹۰", "content": "ماده ۳۹۰- اگر بعد از قبض ثمن مبیع کلاً یا جزئاً مستحق للغیر درآید بایع ضامن است اگر چه تصریح به ضمان نشده باشد ."}, {"title": "ماده ۳۹۱", "content": "ماده ۳۹۱- در صورت مستحق للغیر برآمدن کل یا بعض از مبیع بایع باید ثمن مبیع را مسترد دارد و در صورت جهل مشتری به وجود\nفساد بایع باید از عهده غرامات وارده بر مشتری نیز برآید ."}, {"title": "ماده ۳۹۲", "content": "ماده ۳۹۲- در مورد ماده قبل بایع باید از عهده تمام ثمنی که اخذ نموده است نسبت به کل یا بعض برآید اگر چه بعد از عقد بیع به\nعلتی از علل در مبیع کسر قیمتی حاصل شده باشد."}, {"title": "ماده ۳۹۳", "content": "ماده ۳۹۳- راجع به زیادتی که از عمل مشتری در مبیع حاصل شده باشد مقررات ماده ۳۱۴ مجریٰ خواهد بود .\nفقره چهارم - در تأدیه ثمن"}, {"title": "ماده ۳۹۴", "content": "ماده ۳۹۴- مشتری باید ثمن را در موعد و در محل و بر طبق شرائطی که در عقد بیع مقرر شده است تأدیه نماید ."}, {"title": "ماده ۳۹۵", "content": "ماده ۳۹۵- اگر مشتری ثمن را در موعد مقرر تأدیه نکند بایع حق خواهد داشت که بر طبق مقررات راجعه به خیار تأخیر ثمن، معامله\nرا فسخ یا از حاکم اجبار مشتری را به تأدیه ثمن بخواهد .\nمبحث پنجم - در خیارات و احکام راجعه به آن\nفقره اول - در خیارات"}, {"title": "ماده ۳۹۶", "content": "ماده ۳۹۶- خیارات از قرار ذیلند :\n۱- خیار مجلس.\n۲- خیار حیوان.\n۳- خیار شرط .\n۴- خیار تأخیر ثمن.\n۵ خیار رؤیت و تخلف وصف.\n۶- خیار غَبن .\n۷- خیار عیب\n۸- خیار تدلیس.\n۹- خیار تبعُّض صفقه .\n۱۰- خیار تخلف شرط .\nاول - در خیار مجلس"}, {"title": "ماده ۳۹۷", "content": "ماده ۳۹۷- هر یک از متبایعین بعد از عقد فی المجلس و مادام که متفرق نشدهاند اختیار فسخ معامله را دارند .\nدوم - در خیار حیوان"}, {"title": "ماده ۳۹۸", "content": "ماده ۳۹۸- اگر مبیع حیوان باشد مشتری تا سه روز از حین عقد اختیار فسخ معامله را دارد .\nسوم - در خیار شرط"}, {"title": "ماده ۳۹۹", "content": "ماده ۳۹۹- در عقد بیع ممکن است شرط شود که در مدت معین برای بایع یا مشتری یا هر دو یا شخص خارجی اختیار فسخ معامله\nباشد.\nقانون مدنی"}, {"title": "ماده ۴۰۰", "content": "ماده ۴۰۰- اگر ابتدای مدت خیار ذکر نشده باشد، ابتدای آن از تاریخ عقد محسوب است و الا تابع قرارداد متعاملین است ."}, {"title": "ماده ۴۰۱", "content": "ماده ۴۰۱- اگر برای خیار شرط مدت معین نشده باشد هم شرط خیار و هم بیع باطل است .\nچهارم - در خیار تأخیر ثمن"}, {"title": "ماده ۴۰۲", "content": "ماده ۴۰۲- هر گاه مبیع عین خارجی و یا در حکم آن بوده و برای تأدیه ثمن یا تسلیم مبیع بین متبایعین اجلی معین نشده باشد اگر سه\nروز از تاریخ بیع بگذرد و در این مدت نه بایع مبیع را تسلیم مشتری نماید و نه مشتری تمام ثمن را به بایع بدهد بایع مختار در فسخ\nمعامله می شود."}, {"title": "ماده ۴۰۳", "content": "ماده ۴۰۳- اگر بایع به نحوی از انحا مطالبه ثمن نماید و به قرائن معلوم گردد که مقصود التزام به بیع بوده است خیار او ساقط خواهد\nشد."}, {"title": "ماده ۴۰۴", "content": "ماده ۴۰۴- هر گاه بایع در ظرف سه روز از تاریخ بیع تمام مبیع را تسلیم مشتری کند یا مشتری تمام ثمن را به بایع بدهد دیگر برای بایع\nاختیار فسخ نخواهد بود اگر چه ثانیاً به نحوی از انحا مبیع به بایع و ثمن به مشتری برگشته باشد ."}, {"title": "ماده ۴۰۵", "content": "ماده ۴۰۵- اگر مشتری ثمن را حاضر کرد که بدهد و بایع از اخذ آن امتناع نمود خیار فسخ نخواهد داشت ."}, {"title": "ماده ۴۰۶", "content": "ماده ۴۰۶- خیار تأخیر مخصوص بایع است و برای مشتری از جهت تأخیر در تسلیم مبیع این اختیار نمی باشد."}, {"title": "ماده ۴۰۷", "content": "ماده ۴۰۷- تسلیم بعض ثمن یا دادن آن به کسی که حق قبض ندارد خیار بایع را ساقط نمی کند."}, {"title": "ماده ۴۰۸", "content": "ماده ۴۰۸- اگر مشتری برای ثمن ضامن بدهد یا بایع ثمن را حواله دهد بعد از تحقیق حواله خیار تأخیر ساقط می شود."}, {"title": "ماده ۴۰۹", "content": "ماده ۴۰۹- هر گاه مبیع از چیزهایی باشد که در کمتر از سه روز فاسد و یا کم قیمت می شود ابتدای خیار از زمانی است که مبیع مشرف\nبه فساد یا کسر قیمت میگردد .\nپنجم - در خیار رؤیت و تخلف وصف"}, {"title": "ماده ۴۱۰", "content": "ماده ۴۱۰- هر گاه کسی مالی را ندیده و آن را فقط به وصف بخرد بعد از دیدن اگر دارای اوصافی که ذکر شده است نباشد مختار می شود\nکه بیع را فسخ کند یا به همان نحو که هست قبول نماید ."}, {"title": "ماده ۴۱۱", "content": "ماده ۴۱۱- اگر بایع مبیع را ندیده ولی مشتری آن را دیده باشد و مبیع غیر اوصافی که ذکر شده است دارا باشد فقط بایع خیار فسخ\nخواهد داشت."}, {"title": "ماده ۴۱۲", "content": "ماده ۴۱۲- هر گاه مشتری بعضی از مبیع را دیده و بعض دیگر را به وصف یا از روی نمونه خریده باشد و آن بعض مطابق وصف یا نمونه\nنباشد می تواند تمام مبیع را رد کند یا تمام آن را قبول نماید ."}, {"title": "ماده ۴۱۳", "content": "ماده ۴۱۳- هر گاه یکی از متبایعین مالی را سابقاً دیده و به اعتماد رؤیت سابق معامله کند و بعد از رؤیت معلوم شود که مال مزبور\nاوصاف سابقه را ندارد اختیار فسخ خواهد داشت ."}, {"title": "ماده ۴۱۴", "content": "ماده ۴۱۴- در بیع کلی خیار رؤیت نیست و بایع باید جنسی بدهد که مطابق با اوصاف مقرره بین طرفین باشد ."}, {"title": "ماده ۴۱۵", "content": "ماده ۴۱۵- خیار رؤیت و تخلف وصف بعد از رؤیت فوری است.\nششم - در خیار غبن"}, {"title": "ماده ۴۱۶", "content": "ماده ۴۱۶- هر یک از متعاملین که در معامله غبن فاحش داشته باشد بعد از علم به غبن میتواند معامله را فسخ کند ."}, {"title": "ماده ۴۱۷ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۴۱۷ (اصلاحی ۱۴/۸/۱۳۷۰)- غبن در صورتی فاحش است که عرفاً قابل مسامحه نباشد .\nقانون مدنی"}, {"title": "ماده ۴۱۸", "content": "ماده ۴۱۸- اگر مغبون در حین معامله عالم به قیمت عادله بوده است خیار فسخ نخواهد داشت."}, {"title": "ماده ۴۱۹", "content": "ماده ۴۱۹- در تعیین مقدار غبن شرایط معامله نیز باید منظور گردد ."}, {"title": "ماده ۴۲۰", "content": "ماده ۴۲۰- خیار غبن بعد از علم به غبن فوری است."}, {"title": "ماده ۴۲۱", "content": "ماده ۴۲۱- اگر کسی که طرف خود را مغبون کرده است تفاوت قیمت را بدهد خیار غبن ساقط نمی شود مگر اینکه مغبون به اخذ تفاوت\nقیمت راضی گردد .\nهفتم - در خیار عیب"}, {"title": "ماده ۴۲۲", "content": "ماده ۴۲۲- اگر بعد از معامله ظاهر شود که مبیع معیوب بوده مشتری مختار است در قبول مبیع معیوب با اخذ ارش یا فسخ معامله ."}, {"title": "ماده ۴۲۳", "content": "ماده ۴۲۳- خیار عیب وقتی برای مشتری ثابت می شود که عیب مخفی و موجود در حین عقد باشد."}, {"title": "ماده ۴۲۴", "content": "ماده ۴۲۴- عیب وقتی مخفی محسوب است که مشتری در زمان بیع عالم به آن نبوده است اعم از اینکه این عدم علم ناشی از آن باشد\nکه عیب واقعاً مستور بوده است یا اینکه ظاهر بوده ولی مشتری ملتفت آن نشده است ."}, {"title": "ماده ۴۲۵", "content": "ماده ۴۲۵- عیبی که بعد از بیع و قبل از قبض در مبیع حادث شود در حکم عیب سابق است."}, {"title": "ماده ۴۲۶", "content": "ماده ۴۲۶- تشخیص عیب بر حسب عرف و عادت می شود و بنابراین ممکن است بر حسب ازمنه و امکنه مختلف شود ."}, {"title": "ماده ۴۲۷", "content": "ماده ۴۲۷- اگر در مورد ظهور عیب مشتری اختیار ارش کند تفاوتی که باید به او داده شود به طریق ذیل معین می گردد :\nقیمت حقیقی مبیع در حال بی عیبی و قیمت حقیقی آن در حال معیوبی به توسط اهل خبره معین شود .\nاگر قیمت آن در حال بیعیبی مساوی با قیمتی باشد که در زمان بیع بین طرفین مقرر شده است تفاوت بین این قیمت و قیمت مبیع\nدر حال معیوبی مقدار ارش خواهد بود. و اگر قیمت مبیع در حال بی عیبی کمتر یا زیادتر از ثمن معامله باشد نسبت بین قیمت مبیع\nدر حال معیوبی و قیمت آن در حال بیعیبی معین شده و بایع باید از ثمن مقرر به همان نسبت نگاه داشته و بقیه را به عنوان ارش به\nمشتری رد کند ."}, {"title": "ماده ۴۲۸", "content": "ماده ۴۲۸- در صورت اختلاف بین اهل خبره حد وسط قیمتها معتبر است ."}, {"title": "ماده ۴۲۹", "content": "ماده ۴۲۹- در موارد ذیل مشتری نمی تواند بیع را فسخ کند و فقط می تواند ارش بگیرد :\n۱ )در صورت تلف شدن مبیع نزد مشتری یا منتقل کردن آن به غیر .\n۲ )در صورتی که تغییری در مبیع پیدا شود اعم از اینکه تغییر به فعل مشتری باشد یا نه .\n۳ )در صورتی که بعد از قبض مبیع عیب دیگری در آن حادث شود مگر اینکه در زمان خیار مختص به مشتری حادث شده باشد که در\nاین صورت مانع از فسخ و رد نیست ."}, {"title": "ماده ۴۳۰", "content": "ماده ۴۳۰- اگر عیب حادث بعد از قبض در نتیجه عیب قدیم باشد مشتری حق رد را نیز خواهد داشت ."}, {"title": "ماده ۴۳۱", "content": "ماده ۴۳۱- در صورتی که دریک عقد چند چیز فروخته شود بدون اینکه قیمت هر یک علیحده معین شده باشد و بعضی از آن ها معیوب\nدرآید مشتری باید تمام آن را رد کند و ثمن را مسترد دارد یا تمام را نگاه دارد و ارش بگیرد و تبعیض نمی تواند بکند مگر به رضای بایع ."}, {"title": "ماده ۴۳۲", "content": "ماده ۴۳۲- در صورتی که در یک عقد بایع یک نفر و مشتری متعدد باشد و در مبیع عیبی ظاهر شود یکی از مشتری ها نمیتواند سهم\nخود را به تنهایی رد کند و دیگری سهم خود را نگاه دارد مگر با رضای بایع و بنابراین اگر در رد مبیع اتفاق نکردند فقط هر یک از آن ها\nحق ارش خواهد داشت ."}, {"title": "ماده ۴۳۳", "content": "ماده ۴۳۳- اگر در یک عقد بایع متعدد باشد مشتری می تواند سهم یکی را رد و دیگری را با اخذ ارش قبول کند .\nقانون مدنی"}, {"title": "ماده ۴۳۴", "content": "ماده ۴۳۴- اگر ظاهر شود که مبیع معیوب اصلاً مالیت و قیمت نداشته بیع باطل است و اگر بعض مبیع قیمت نداشته باشد بیع\nنسبت به آن بعض باطل است و مشتری نسبت به باقی از جهت تبعض صفقه اختیار فسخ دارد ."}, {"title": "ماده ۴۳۵", "content": "ماده ۴۳۵- خیار عیب بعد از علم به آن فوری است."}, {"title": "ماده ۴۳۶", "content": "ماده ۴۳۶- اگر بایع از عیوب مبیع تبری کرده باشد به اینکه عهده عیوب را از خود سلب کرده یا با تمام عیوب بفروشد مشتری در صورت\nظهور عیب حق رجوع به بایع نخواهد داشت و اگر بایع از عیب خاصی تبری کرده باشد فقط نسبت به همان عیب حق مراجعه ندارد ."}, {"title": "ماده ۴۳۷", "content": "ماده ۴۳۷- از حیث احکام عیب ثمن شخصی مثل مبیع شخصی است.\nهشتم - در خیار تدلیس"}, {"title": "ماده ۴۳۸", "content": "ماده ۴۳۸- تدلیس عبارت است از عملیاتی که موجب فریب طرف معامله شود ."}, {"title": "ماده ۴۳۹", "content": "ماده ۴۳۹- اگر بایع تدلیس نموده باشد مشتری حق فسخ بیع را خواهد داشت و همچنین است بایع نسبت به ثمن شخصی در صورت\nتدلیس مشتری ."}, {"title": "ماده ۴۴۰", "content": "ماده ۴۴۰- خیار تدلیس بعد از علم به آن فوری است.\nنهم - در خیار تبعض صفقه"}, {"title": "ماده ۴۴۱", "content": "ماده ۴۴۱- خیار تبعض صفقه وقتی حاصل می شود که عقد بیع نسبت به بعض مبیع به جهتی از جهات باطل باشد در این صورت مشتری\nحق خواهد داشت بیع را فسخ نماید یا به نسبت قسمتی که بیع واقع شده است قبول کند و نسبت به قسمتی که بیع باطل بوده است\nثمن را استرداد کند ."}, {"title": "ماده ۴۴۲", "content": "ماده ۴۴۲- در مورد تبعض صفقه قسمتی از ثمن که باید به مشتری برگردد به طریق ذیل حساب می شود:\nآن قسمت از مبیع که به ملکیت مشتری قرارگرفته منفرداً قیمت می شود و هر نسبتی که بین قیمت مزبور و قیمتی که مجموع مبیع\nدر حال اجتماع دارد پیدا شود به همان نسبت از ثمن را بایع نگاه داشته و بقیه را باید به مشتری رد نماید ."}, {"title": "ماده ۴۴۳", "content": "ماده ۴۴۳- تبعض صفقه وقتی موجب خیار است که مشتری در حین معامله عالم به آن نباشد ولی در هر حال ثمن تقسیط می شود.\nدهم - در خیار تخلف شرط"}, {"title": "ماده ۴۴۴", "content": "ماده ۴۴۴- احکام خیار تخلف شرطی به طوری است که در مواد ۲۳۴ الی ۲۴۵ ذکر شده است.\nفقره دوم - در احکام خیارات به طور کلی"}, {"title": "ماده ۴۴۵", "content": "ماده ۴۴۵- هر یک از خیارات بعد از فوت منتقل به وراث می شود."}, {"title": "ماده ۴۴۶", "content": "ماده ۴۴۶- خیار شرط ممکن است به قید مباشرت و اختصاص به شخص مشروط له قرار داده شود در این صورت منتقل به وراث\nنخواهد شد."}, {"title": "ماده ۴۴۷", "content": "ماده ۴۴۷- هر گاه شرط خیار برای شخصی غیر از متعاملین شده باشد منتقل به ورثه نخواهد شد ."}, {"title": "ماده ۴۴۸", "content": "ماده ۴۴۸- سقوط تمام یا بعضی از خیارات را می توان در ضمن عقد شرط نمود ."}, {"title": "ماده ۴۴۹", "content": "ماده ۴۴۹- فسخ به هر لفظ یا فعلی که دلالت بر آن نماید حاصل میشود."}, {"title": "ماده ۴۵۰", "content": "ماده ۴۵۰- تصرفاتی که نوعاً کاشف از رضای معامله باشد امضای فعلی است مثل آ ن که مشتری که خیار دارد با علم به خیار مبیع را\nبفروشد یا رهن بگذارد ."}, {"title": "ماده ۴۵۱", "content": "ماده ۴۵۱- تصرفاتی که نوعاً کاشف از به هم زدن معامله باشد فسخ فعلی است ."}, {"title": "ماده ۴۵۲", "content": "ماده ۴۵۲- اگر متعاملین هر دو خیار داشته باشند و یکی از آنها امضا کند و دیگری فسخ نماید معامله منفسخ می شود.\nقانون مدنی"}, {"title": "ماده ۴۵۳", "content": "ماده ۴۵۳- در خیار مجلس و حیوان و شرط اگر مبیع بعد از تسلیم و در زمان خیار بایع یا متعاملین تلف یا ناقص شود بر عهده مشتری\nاست و اگر خیار مختص مشتری باشد تلف یا نقص به عهده بایع است ."}, {"title": "ماده ۴۵۴", "content": "ماده ۴۵۴- هر گاه مشتری مبیع را اجاره داده باشد و بیع فسخ شود اجاره باطل نمی شود مگر اینکه عدم تصرفات ناقله در عین و منفعت\nبر مشتری صریحاً یا ضمناً شرط شده که در این صورت اجاره باطل است ."}, {"title": "ماده ۴۵۵", "content": "ماده ۴۵۵- اگر پس از عقد بیع مشتری تمام یا قسمتی از مبیع را متعلق حق غیر قرار دهد مثل اینکه نزد کسی رهن گذارد فسخ معامله\nموجب زوال حق شخص مزبور نخواهد شد مگر اینکه شرط خلاف شده باشد ."}, {"title": "ماده ۴۵۶", "content": "ماده ۴۵۶- تمام انواع خیار در جمیع معاملات لازمه ممکن است موجود باشد مگر خیار مجلس و حیوان و تأخیر ثمن که مخصوص\nبیع است."}, {"title": "ماده ۴۵۷", "content": "ماده ۴۵۷- هر بیع لازم است مگر اینکه یکی از خیارات در آن ثابت شود .\nفصل دوم - در بیع و شرط"}, {"title": "ماده ۴۵۸", "content": "ماده ۴۵۸- در عقد بیع متعاملین میتوانند شرط نمایند که هر گاه بایع در مدت معینی تمام مثل ثمن را به مشتری رد کند خیار فسخ\nمعامله را نسبت به تمام مبیع داشته باشد و همچنین می توانند شرط کنند که هر گاه بعض مثل ثمن را رد کرد خیار فسخ معامله را\nنسبت به تمام یا بعض مبیع داشته باشد در هر حال حق خیار تابع قرارداد متعاملین خواهد بود و هر گاه نسبت به ثمن قید تمام یا\nبعض نشده باشد خیار ثابت نخواهد بود مگر با رد تمام ثمن ."}, {"title": "ماده ۴۵۹", "content": "ماده ۴۵۹- در بیع شرط به مجرد عقد مبیع ملک مشتری می شود با قید خیار برای بایع بنابراین اگر بایع به شرایطی که بین او و مشتری\nبرای استرداد مبیع مقرر شده است عمل ننماید بیع قطعی شده و مشتری مالک قطعی مبیع می گردد و اگر بالعکس بایع به شرایط مزبوره\nعمل نماید و مبیع را استرداد کند از حین فسخ مبیع مال بایع خواهد شد ولی نماآت و منافع حاصله از حین عقد تا حین فسخ مال\nمشتری است."}, {"title": "ماده ۴۶۰", "content": "ماده ۴۶۰- در بیع شرط مشتری نمی تواند در مبیع تصرفی که منافی خیار باشد از قبیل نقل و انتقال و غیره بنماید ."}, {"title": "ماده ۴۶۱", "content": "ماده ۴۶۱- اگر مشتری در زمان خیار از اخذ ثمن امتناع کند بایع می تواند با تسلیم ثمن به حاکم یا قائم مقام او معامله را فسخ کند ."}, {"title": "ماده ۴۶۲", "content": "ماده ۴۶۲- اگر مبیع به شرط به واسطه فوت مشتری به ورثه او منتقل شود حق فسخ بیع در مقابل ورثه به همان ترتیبی که بوده است\nباقی خواهد بود."}, {"title": "ماده ۴۶۳", "content": "ماده ۴۶۳- اگر در بیع شرط معلوم شود که قصد بایع حقیقت بیع نبوده است احکام بیع در آن مجری نخواهد بود .\nفصل سوم - در معاوضه"}, {"title": "ماده ۴۶۴", "content": "ماده ۴۶۴- معاوضه عقدی است که به موجب آن یکی از طرفین مالی می دهد به عوض مال دیگر که از طرف دیگر اخذ می کند بدون\nملاحظه اینکه یکی از عوضین مبیع و دیگری ثمن باشد."}, {"title": "ماده ۴۶۵", "content": "ماده ۴۶۵- در معاوضه احکام خاصه بیع جاری نیست.\nفصل چهارم - در اجاره"}, {"title": "ماده ۴۶۶", "content": "ماده ۴۶۶- اجاره عقدی است که به موجب آن مستأجر مالک منافع عین مستأجره می شود. اجاره دهنده را موجر و اجاره کننده را مستأجر\nو مورد اجاره را عین مستأجره گویند ."}, {"title": "ماده ۴۶۷", "content": "ماده ۴۶۷- مورد اجاره ممکن است اشیا یا حیوان یا انسان باشد .\nمبحث اول - در اجاره اشیاء"}, {"title": "ماده ۴۶۸", "content": "ماده ۴۶۸- در اجاره اشیاء مدت اجاره باید معین شود و الا اجاره باطل است .\nقانون مدنی"}, {"title": "ماده ۴۶۹", "content": "ماده ۴۶۹- مدت اجاره از روزی شروع می شود که بین طرفین مقرر شده است و اگر در عقد اجاره ابتدای مدت ذکر نشده باشد از وقت\nعقد محسوب است."}, {"title": "ماده ۴۷۰", "content": "ماده ۴۷۰- در صحت اجاره قدرت بر تسلیم عین مستأجره شرط است ."}, {"title": "ماده ۴۷۱", "content": "ماده ۴۷۱- برای صحت اجاره باید انتفاع از عین مستأجره با بقای اصل آن ممکن باشد ."}, {"title": "ماده ۴۷۲", "content": "ماده ۴۷۲- عین مستأجره باید معین باشد و اجاره عین مجهول یا مردد باطل است ."}, {"title": "ماده ۴۷۳", "content": "ماده ۴۷۳- لازم نیست که مؤجر مالک عین مستأجره باشد ولی باید مالک منافع آن باشد ."}, {"title": "ماده ۴۷۴", "content": "ماده ۴۷۴- مستأجر می تواند عین مستأجره را به دیگری اجاره بدهد مگر اینکه در عقد اجاره خلاف آن شرط شده باشد ."}, {"title": "ماده ۴۷۵", "content": "ماده ۴۷۵- اجاره مال مشاع جائز است لیکن تسلیم عین مستأجره موقوف است به اذن شریک ."}, {"title": "ماده ۴۷۶", "content": "ماده ۴۷۶- موجر باید عین مستأجره را تسلیم مستأجر کند و در صورت امتناع موجر اجبار می شود و در صورت تعذر اجبار مستأجر خیار\nفسخ دارد ."}, {"title": "ماده ۴۷۷", "content": "ماده ۴۷۷- موجر باید عین مستأجره را در حالتی تسلیم نماید که مستأجر بتواند استفاده مطلوبه از آن را بکند ."}, {"title": "ماده ۴۷۸", "content": "ماده ۴۷۸- هر گاه معلوم شود عین مستأجره در حال اجاره معیوب بوده مستأجر می تواند اجاره را فسخ کند یا به همان نحوی که بوده\nاست اجاره را با تمام اجرت قبول کند ولی اگر موجر رفع عیب کند به نحوی که به مستأجر ضرری نرسد مستأجر حق فسخ ندارد ."}, {"title": "ماده ۴۷۹", "content": "ماده ۴۷۹- عیبی که موجب فسخ اجاره می شود عیبی است که موجب نقصان منفعت یا صعوبت در انتفاع باشد."}, {"title": "ماده ۴۸۰", "content": "ماده ۴۸۰- عیبی که بعد از عقد و قبل از قبض منفعت در عین مستأجره حادث شود موجب خیار است و اگر عیب در اثنای مدت اجاره\nحادث شود نسبت به بقیه مدت خیار ثابت است."}, {"title": "ماده ۴۸۱", "content": "ماده ۴۸۱- هر گاه عین مستأجره به واسطه عیب از قابلیت انتفاع خارج شده و نتوان رفع عیب نمود اجاره باطل می شود."}, {"title": "ماده ۴۸۲", "content": "ماده ۴۸۲- اگر مورد اجاره عین کلی باشد و فردی که موجر داده معیوب درآید مستأجر حق فسخ ندارد و می تواند موجر را مجبور به\nتبدیل آن نماید و اگر تبدیل آن ممکن نباشد حق فسخ خواهد داشت."}, {"title": "ماده ۴۸۳", "content": "ماده ۴۸۳- اگر در مدت اجاره عین مستأجره به واسطه حادثه کلاً یا بعضاً تلف شود از زمان تلف نسبت به مقدار تلف شده منفسخ\nمی شود و در صورت تلف بعض آن مستأجر حق دارد اجاره را نسبت به بقیه فسخ کند یا فقط مطالبه تقلیل نسبی مال الاجاره نماید ."}, {"title": "ماده ۴۸۴", "content": "ماده ۴۸۴- موجر نمی تواند در مدت اجاره در عین مستأجره تغییری دهد که منافی مقصود مستأجر از استیجار باشد ."}, {"title": "ماده ۴۸۵", "content": "ماده ۴۸۵- اگر در مدت اجاره در عین مستأجره تعمیراتی لازم آید که تأخیر در آن موجب ضرر موجر باشد مستأجر نمی تواند مانع\nتعمیرات مزبوره گردد اگر چه در مدت تمام یا قسمتی از زمان تعمیر نتواند از عین مستأجره کلاً یا بعضاً استفاده نماید در این صورت\nحق فسخ اجاره را خواهد داشت ."}, {"title": "ماده ۴۸۶", "content": "ماده ۴۸۶- تعمیرات و کلیه مخارجی که در عین مستأجره برای امکان انتفاع از آن لازم است به عهده مالک است مگر آ نکه شرط خلاف\nشده یا عرف بلد برخلاف آن جاری باشد و همچنین است آلات و ادواتی که برای امکان انتفاع از عین مستأجره لازم می باشد."}, {"title": "ماده ۴۸۷", "content": "ماده ۴۸۷- هر گاه مستأجر نسبت به عین مستأجره تعدی یا تفریط نماید و مؤجر قادر بر منع آن نباشد موجر حق فسخ دارد ."}, {"title": "ماده ۴۸۸", "content": "ماده ۴۸۸- اگر شخص ثالثی بدون ادعای حقی در عین مستأجره یا منافع آن مزاحم مستأجر گردد در صورتی که قبل از قبض باشد\nمستأجر حق فسخ دارد و اگر فسخ ننمود می تواند برای رفع مزاحمت و مطالبه اجرت المثل به خود مزاحم رجوع کند و اگر مزاحمت بعد\nاز قبض واقع شود حق فسخ ندارد و فقط می تواند به مزاحم رجوع کند ."}, {"title": "ماده ۴۸۹", "content": "ماده ۴۸۹- اگر شخصی که مزاحمت می نماید مدعی حق نسبت به عین مستأجره یا منافع آن باشد مزاحم نمی تواند عین مزبور را از ید\nمستأجر انتزاع نماید مگر بعد از اثبات حق با طرفیت مالک و مستأجر هر دو .\nقانون مدنی"}, {"title": "ماده ۴۹۰", "content": "ماده ۴۹۰- مستأجر باید:\nاولاً - در استعمال عین مستأجره به نحو متعارف رفتار کرده و تعدی یا تفریط نکند .\nثانیاً - عین مستأجره برای همان مصرفی که در اجاره مقرر شده و در صورت عدم تعیین در منافع مقصوده که از اوضاع و احوال استنباط\nمی شود استعمال نماید.\nثالثاً - مال الاجاره را در مواعدی که بین طرفین مقرر است تأدیه کند و در صورت عدم تعیین موعد نقداً باید بپردازد ."}, {"title": "ماده ۴۹۱", "content": "ماده ۴۹۱- اگر منفعتی که در اجاره تعیین شده است به خصوصیت آن منظور نبوده مستأجر می تواند استفاده منفعتی کند که از حیث\nضرر مساوی یا کمتر از منفعت معینه باشد."}, {"title": "ماده ۴۹۲", "content": "ماده ۴۹۲- اگر مستأجر عین مستأجره را در غیر موردی که در اجاره ذکر شده باشد یا از اوضاع و احوال استنباط می شود استعمال کند\nو منع آن ممکن نباشد موجر حق فسخ اجاره را خواهد داشت ."}, {"title": "ماده ۴۹۳", "content": "ماده ۴۹۳- مستأجر نسبت به عین مستأجره ضامن نیست به این معنی که اگر عین مستأجره بدون تفریط یا تعدی او کلاً یا بعضاً تلف\nشود مسئول نخواهد بود ولی اگر مستاجر تفریط یا تعدی نماید ضامن است اگر چه نقص در نتیجه تفریط یا تعدی حاصل نشده باشد ."}, {"title": "ماده ۴۹۴", "content": "ماده ۴۹۴- عقد اجاره به محض انقضای مدت برطرف می شود و اگر پس از انقضای آن مستأجر عین مستأجره را بدون اذن مالک مدتی\nدر تصرف خود نگاه دارد موجر برای مدت مزبور مستحق اجرت المثل خواهد بود اگر چه مستأجر استیفاء منفعت نکرده باشد و اگر با\nاجازه مالک در تصرف نگاه دارد وقتی باید اجرت المثل بدهد که استیفاء منفعت کرده باشد مگر اینکه مالک اجازه داده باشد که مجاناً\nاستفاده نماید."}, {"title": "ماده ۴۹۵", "content": "ماده ۴۹۵- اگر برای تأدیه مال الاجاره ضامنی داده شده باشد ضامن مسئول اجرت المثل مذکور در ماده فوق نخواهد بود."}, {"title": "ماده ۴۹۶", "content": "ماده ۴۹۶- عقد اجاره به واسطه تلف شدن عین مستأجره از تاریخ تلف باطل می شود و نسبت به تخلف از شرایطی که بین مؤجر و\nمستأجر مقرر است خیار فسخ از تاریخ تخلف ثابت میگردد ."}, {"title": "ماده ۴۹۷", "content": "ماده ۴۹۷- عقد اجاره به واسطه فوت موجر یا مستأجر باطل نمی شود ولیکن اگر موجر فقط برای مدت عمر خود مالک منافع عین\nمستأجره بوده است اجاره به فوت موجر باطل می شود و اگر شرط مباشرت مستأجر شده باشد به فوت مستأجر باطل می گردد ."}, {"title": "ماده ۴۹۸", "content": "ماده ۴۹۸- اگر عین مستأجره به دیگری منتقل شود اجاره به حال خود باقی است مگر اینکه موجر حق فسخ در صورت نقل را برای خود\nشرط کرده باشد ."}, {"title": "ماده ۴۹۹", "content": "ماده ۴۹۹- هر گاه متولی با ملاحظه صرفه وقف مال موقوفه را اجاره دهد اجاره به فوت او باطل نمی گردد ."}, {"title": "ماده ۵۰۰", "content": "ماده ۵۰۰- در بیع شرط مشتری می تواند مبیع را برای مدتی که بایع حق خیار ندارد اجاره دهد و اگر اجاره منافی با خیار بایع باشد باید به\nوسیله جعل خیار یا نحو آن حق بایع را محفوظ دارد و الا اجاره تا حدی که منافی با حق بایع باشد باطل خواهد بود ."}, {"title": "ماده ۵۰۱", "content": "ماده ۵۰۱- اگر در عقد اجاره مدت به طور صریح ذکر نشده و مال الاجاره هم از قرار روز یا ماه یا سالی فلان مبلغ معین شده باشد اجاره\nبرای یک روز یا یک ماه یا یک سال صحیح خواهد بود و اگر مستأجر عین مستأجره را بیش از مدت های مزبوره در تصرف خود نگاه دارد\nو موجر هم تخلیه ید او را نخواهد موجر به موجب مراضات حاصله برای بقیه مدت و به نسبت زمان تصرف مستحق اجرت مقرر بین\nطرفین خواهد بود ."}, {"title": "ماده ۵۰۲", "content": "ماده ۵۰۲- اگر مستأجر در عین مستأجره بدون اذن موجر تعمیراتی نماید حق مطالبه قیمت آن را نخواهد داشت ."}, {"title": "ماده ۵۰۳", "content": "ماده ۵۰۳- هر گاه مستأجر بدون اجازه موجر در خانه یا زمینی که اجاره کرده وضع بنا یا غرس اشجار کند هر یک از موجر و مستأجر حق\nدارد هر وقت بخواهد بنا را خراب یا درخت را قطع نماید در این صورت اگر در عین مستأجره نقصی حاصل شود بر عهده مستأجر است .\nقانون مدنی"}, {"title": "ماده ۵۰۴", "content": "ماده ۵۰۴- هر گاه مستأجر به موجب عقد اجاره مجاز در بنا یا غرس بوده موجر نمی تواند مستأجر را به خراب کردن یا کندن آن اجبار\nکند و بعد از انقضای مدت اگر بنا یا درخت در تصرف مستأجر باقی بماند موجر حق مطالبه اجرت المثل زمین را خواهد داشت و اگر در\nتصرف موجر باشد مستأجر حق مطالبه اجرت المثل بنا یا درخت را خواهد داشت ."}, {"title": "ماده ۵۰۵", "content": "ماده ۵۰۵- اقساط مال الاجاره که به علت نرسیدن موعد پرداخت آن بر ذمه مستأجر مستقر نشده است به موت او حال نمی شود."}, {"title": "ماده ۵۰۶", "content": "ماده ۵۰۶- در اجاره عقار آفت زراعت از هر قبیل که باشد به عهده مستأجر است مگر اینکه در عقد اجاره طور دیگر شرط شده باشد .\nمبحث دوم - در اجاره حیوانات"}, {"title": "ماده ۵۰۷", "content": "ماده ۵۰۷- در اجاره حیوان تعیین منفعت یا به تعیین مدت اجاره است یا به بیان مسافت و محلی که راکب یا مَحمول باید به آنجا\nحمل شود."}, {"title": "ماده ۵۰۸", "content": "ماده ۵۰۸- در موردی که منفعت به بیان مدت اجاره معلوم شود تعیین راکب یا محمول لازم نیست ولی مستأجر نمی تواند زیاده بر\nمقدار متعارف حمل کند و اگر منفعت به بیان مسافت و محل معین شده باشد تعیین راکب یا محمول لازم است ."}, {"title": "ماده ۵۰۹", "content": "ماده ۵۰۹- در اجاره حیوان ممکن است شرط شود که اگر موجر در وقت معین محمول را به مقصد نرساند مقدار معینی از مال الاجاره\nکم شود."}, {"title": "ماده ۵۱۰", "content": "ماده ۵۱۰- در اجاره حیوان لازم نیست که عین مستأجره حیوان معینی باشد بلکه تعیین آن به نوع معینی کافی خواهد بود ."}, {"title": "ماده ۵۱۱", "content": "ماده ۵۱۱- حیوانی که مورد اجاره است باید برای همان مقصودی استعمال شود که قصد طرفین بوده است .\nبنابراین حیوانی که برای سواری اجاره شده است نمی توان برای بارکشی استعمال نمود .\nمبحث سوم - در اجاره اشخاص"}, {"title": "ماده ۵۱۲", "content": "ماده ۵۱۲- در اجاره اشخاص کسی که اجاره می کند مستأجر و کسی که مورد اجاره واقع می شود اجیر و مالالاجاره اجرت نامیده می شود."}, {"title": "ماده ۵۱۳", "content": "ماده ۵۱۳- اقسام عمده اجاره اشخاص از قرار ذیل است :\n۱- اجاره خدمه و کارگران از هر قبیل .\n۲- اجاره متصدیان حمل و نقل اشخاص یا مال التجاره اعم از راه خشکی یا آب یا هوا .\nفقره اول - در اجاره خدمه و کارگر"}, {"title": "ماده ۵۱۴", "content": "ماده ۵۱۴- خادم یا کارگر نمی تواند اجیر شود مگر برای مدت معینی یا برای انجام امر معینی ."}, {"title": "ماده ۵۱۵", "content": "ماده ۵۱۵- اگر کسی بدون تعیین انتهای مدت اجیر شود مدت اجاره محدود خواهد بود به مدتی که مزد از قرار آن معین شده است\nبنابراین اگر مزد اجیر از قرار روز یا هفته یا ماه یا سالی فلان مبلغ معین شده باشد مدت اجاره محدود به یک روز یا یک هفته یا یک\nماه یا یک سال خواهد بود و پس از انقضای مدت مزبور اجاره برطرف می شود ولی اگر پس از انقضای مدت اجیر به خدمت خود دوام\nدهد و موجر او را نگاه دارد اجیر نظر به مراضات حاصله به همان طوری که در زمان اجاره بین او و موجر مقرر بود مستحق اجرت خواهد\nشد.\nفقره دوم - در اجاره متصدی حمل و نقل"}, {"title": "ماده ۵۱۶", "content": "ماده ۵۱۶- تعهدات متصدیان حمل و نقل اعم از اینکه از راه خشکی یا آب یا هوا باشد برای حفاظت و نگاهداری اشیایی که به آن ها\nسپرده می شود همان است که برای امانت داران مقرر است بنابراین در صورت تفریط یا تعدی مسئول تلف یا ضایع شدن اشیایی خواهند\nبود که برای حمل به آن ها داده میشود و این مسئولیت از تاریخ تحویل اشیا به آنان خواهد بود."}, {"title": "ماده ۵۱۷", "content": "ماده ۵۱۷- مفاد ماده ۵۰۹ در مورد متصدیان حمل و نقل نیز مجری خواهد بود .\nقانون مدنی\nفصل پنجم - در مزارعه و مساقات\nمبحث اول - در مزارعه"}, {"title": "ماده ۵۱۸", "content": "ماده ۵۱۸- مزارعه عقدی است که به موجب آن احد طرفین زمینی را برای مدت معینی به طرف دیگر می دهد که آن را زراعت کرده و\nحاصل را تقسیم کنند ."}, {"title": "ماده ۵۱۹", "content": "ماده ۵۱۹- در عقد مزارعه حصه هر یک از مزارع و عامل باید به نحو اشاعه از قبیل ربع یا ثلث یا نصف و غیره معین گردد و اگر به نحو\nدیگر باشد احکام مزارعه جاری نخواهد شد ."}, {"title": "ماده ۵۲۰", "content": "ماده ۵۲۰- در مزارعه جائز است شرط شود که یکی از دو طرف علاوه بر حصه از حاصل مال دیگری نیز به طرف مقابل بدهد ."}, {"title": "ماده ۵۲۱", "content": "ماده ۵۲۱- در عقد مزارعه ممکن است هر یک از بذر و عوامل مال مزارع باشد یا عامل در این صورت نیز حصه مشاع هر یک از طرفین\nبر طبق قرارداد یا عرف بلد خواهد بود ."}, {"title": "ماده ۵۲۲", "content": "ماده ۵۲۲- در عقد مزارعه لازم نیست که متصرف زمین مالک آن هم باشد ولی لازم است که مالک منافع بوده باشد یا به عنوانی از\nعناوین از قبیل ولایت و غیره حق تصرف در آن را داشته باشد ."}, {"title": "ماده ۵۲۳", "content": "ماده ۵۲۳- زمینی که مورد مزارعه است باید برای زرع مقصود قابل باشد اگر چه محتاج به اصلاح یا تحصیل آب باشد و اگر زرع محتاج\nبه عملیاتی باشد از قبیل حفر نهر یا چاه و غیره و عامل در حین عقد جاهل به آن بوده باشد حق فسخ معامله را خواهد داشت ."}, {"title": "ماده ۵۲۴", "content": "ماده ۵۲۴- نوع زرع باید در عقد مزارعه معین باشد مگر اینکه بر حسب عرف بلد معلوم و یا عقد برای مطلق زراعت بوده باشد در\nصورت اخیر عامل در اختیار نوع زراعت مختار خواهد بود ."}, {"title": "ماده ۵۲۵", "content": "ماده ۵۲۵- عقد مزارعه عقدی است لازم ."}, {"title": "ماده ۵۲۶", "content": "ماده ۵۲۶- هر یک از مالک و زارع می تواند در صورت غبن معامله را فسخ کند ."}, {"title": "ماده ۵۲۷", "content": "ماده ۵۲۷- هر گاه زمین به واسطه فقدان آب یا علل دیگر از این قبیل از قابلیت انتفاع خارج شود و رفع مانع ممکن نباشد عقد مزارعه\nمنفسخ می شود."}, {"title": "ماده ۵۲۸", "content": "ماده ۵۲۸- اگر شخص ثالثی قبل از اینکه زمین مورد مزارعه تسلیم عامل شود آن را غصب کند عامل مختار بر فسخ می شود ولی اگر\nغصب بعد از تسلیم واقع شود حق فسخ ندارد ."}, {"title": "ماده ۵۲۹", "content": "ماده ۵۲۹- عقد مزارعه به فوت متعاملین یا احد آن ها باطل نمیشود مگر اینکه مباشرت عامل شرط شده باشد در این صورت به فوت\nاو منفسخ می شود."}, {"title": "ماده ۵۳۰", "content": "ماده ۵۳۰- هر گاه کسی به مدت عمر خود مالک منافع زمینی بوده و آن را به مزارعه داده باشد عقد مزارعه به فوت او منفسخ می شود."}, {"title": "ماده ۵۳۱", "content": "ماده ۵۳۱- بعد از ظهور ثمره زرع عامل مالک حصه خود از آن می شود."}, {"title": "ماده ۵۳۲", "content": "ماده ۵۳۲- در عقد مزارعه اگر شرط شود که تمام ثمره مال مزارع یا عامل تنها باشد عقد باطل است ."}, {"title": "ماده ۵۳۳", "content": "ماده ۵۳۳- اگر عقد مزارعه به علتی باطل شود تمام حاصل مال صاحب بذر است و طرف دیگر که مالک زمین یا آب یا صاحب عمل\nبوده است به نسبت آنچه که مالک بوده مستحق اجرت المثل خواهد بود. اگر بذر مشترک بین مزارع و عامل باشد حاصل و اجرت المثل\nنیز به نسبت بذر بین آنها تقسیم می شود."}, {"title": "ماده ۵۳۴", "content": "ماده ۵۳۴- هر گاه عامل در اثنا یا در ابتدای عمل آن را ترک کند و کسی نباشد که عمل را به جای او انجام دهد حاکم به تقاضای مزارع\nعامل را اجبار به انجام می کند و یا عمل را به خرج عامل ادامه می دهد و در صورت عدم امکان مزارع حق فسخ دارد ."}, {"title": "ماده ۵۳۵", "content": "ماده ۵۳۵- اگر عامل زراعت نکند و مدت منقضی شود مزارع مستحق اجرت المثل است.\nقانون مدنی"}, {"title": "ماده ۵۳۶", "content": "ماده ۵۳۶- هر گاه عامل به طور متعارف مواظبت در زراعت ننماید و از این حیث حاصل کم شود یا ضرر دیگر متوجه مزارع گردد عامل\nضامن تفاوت خواهد بود."}, {"title": "ماده ۵۳۷", "content": "ماده ۵۳۷- هر گاه در عقد مزارعه زرع معینی قید شده باشد و عامل غیر آن را زرع نماید مزارعه باطل و بر طبق ماده ۵۳۳ رفتار می شود."}, {"title": "ماده ۵۳۸", "content": "ماده ۵۳۸- هر گاه مزارعه در اثنای مدت قبل از ظهور ثمره فسخ شود حاصل مال مالک بذر است و طرف دیگر مستحق اجرت المثل\nخواهد بود."}, {"title": "ماده ۵۳۹", "content": "ماده ۵۳۹- هر گاه مزارعه بعد از ظهور ثمره فسخ شود هر یک از مزارع و عامل به نسبتی که بین آن ها مقرر بوده شریک در ثمره هستند\nلیکن از تاریخ فسخ تا برداشت حاصل هر یک به اخذ اجرت المثل زمین و عمل و سایر مصالح الاملاک خود که به حصه مقرر به طرف\nدیگر تعلق میگیرد مستحق خواهد بود ."}, {"title": "ماده ۵۴۰", "content": "ماده ۵۴۰- هر گاه مدت مزارعه منقضی شود و اتفاقاً زرع نرسیده باشد مزارع حق دارد که زراعت را ازاله کند یا آن را به اخذ اجرت المثل\nابقا نماید."}, {"title": "ماده ۵۴۱", "content": "ماده ۵۴۱- عامل می تواند برای زراعت اجیر بگیرد یا با دیگری شریک شود ولی برای انتقال معامله یا تسلیم زمین به دیگری رضای مزارع\nلازم است ."}, {"title": "ماده ۵۴۲", "content": "ماده ۵۴۲- خراج زمین به عهده مالک است مگر اینکه خلاف آن شرط شده باشد سایر مخارج زمین بر حسب تعیین طرفین یا متعارف\nاست.\nمبحث دوم - در مُساقات"}, {"title": "ماده ۵۴۳", "content": "ماده ۵۴۳- مساقات معامله ایست که بین صاحب درخت و امثال آن با عامل در مقابل حصه مشاع معین از ثمره واقع می شود و ثمره\nاعم است از میوه و برگ و گل و غیر آن ."}, {"title": "ماده ۵۴۴", "content": "ماده ۵۴۴- در هر مورد که مساقات باطل باشد یا فسخ شود تمام ثمره مال مالک است و عامل مستحق اجرت المثل خواهد بود."}, {"title": "ماده ۵۴۵", "content": "ماده ۵۴۵- مقررات راجعه به مزارعه که در مبحث قبل ذکر شده است در مورد عقد مساقات نیز مرعی خواهد بود مگر اینکه عامل\nنمیتواند بدون اجازه مالک معامله را به دیگری واگذار یا با دیگری شرکت نماید .\nفصل ششم - در مضاربه"}, {"title": "ماده ۵۴۶", "content": "ماده ۵۴۶- مضاربه عقدی است که به موجب آن احد متعاملین سرمایه می دهد با قید اینکه طرف دیگر با آن تجارت کرده و در سود آن\nشریک باشند صاحب سرمایه مالک و عامل مُضارب نامیده می شود."}, {"title": "ماده ۵۴۷", "content": "ماده ۵۴۷- سرمایه باید وجه نقد باشد ."}, {"title": "ماده ۵۴۸", "content": "ماده ۵۴۸- حصه هر یک از مالک و مضارب در منافع باید جزء مشاع از کل از قبیل ربع یا ثلث و غیره باشد ."}, {"title": "ماده ۵۴۹", "content": "ماده ۵۴۹- حصه های مزبوره در ماده فوق باید در عقد مضاربه معین شود مگر اینکه در عرف منجزاً معلوم بوده و سکوت در عقد\nمنصرف به آن گردد ."}, {"title": "ماده ۵۵۰", "content": "ماده ۵۵۰- مضاربه عقدی است جائز."}, {"title": "ماده ۵۵۱", "content": "ماده ۵۵۱- عقد مضاربه به یکی از علل ذیل منفسخ می شود:\n۱) در صورت موت یا جنون یا سفه احد طرفین .\n۲) در صورت مفلس شدن مالک .\n۳) در صورت تلف شدن تمام سرمایه و ربح .\n۴) در صورت عدم امکان تجارتی که منظور طرفین بوده .\nقانون مدنی"}, {"title": "ماده ۵۵۲", "content": "ماده ۵۵۲- هر گاه در مضاربه برای تجارت مدت معین شده باشد تعیین مدت موجب لزوم عقد نمی شود لیکن پس از انقضای مدت\nمضارب نمی تواند معامله بکند مگر به اجازه جدید مالک ."}, {"title": "ماده ۵۵۳", "content": "ماده ۵۵۳- در صورتی که مضاربه مطلق باشد یعنی تجارت خاصی شرط نشده باشد عامل می تواند هر قسم تجارتی را که صلاح بداند\nبنماید ولی در طرز تجارت باید متعارف را رعایت کند ."}, {"title": "ماده ۵۵۴", "content": "ماده ۵۵۴- مضارب نمی تواند نسبت به همان سرمایه با دیگری مضاربه کند یا آن را به غیر واگذار نماید مگر با اجازه مالک ."}, {"title": "ماده ۵۵۵", "content": "ماده ۵۵۵- مضارب باید اعمالی را که برای نوع تجارت متعارف و معمول بلد و زمان است بجا آورد ولی اگر اعمالی را که بر طبق عرف\nبایستی به اجیر رجوع کند خود شخصاً انجام دهد مستحق اجرت آن نخواهد بود ."}, {"title": "ماده ۵۵۶", "content": "ماده ۵۵۶- مضارب در حکم امین است و ضامن مال مضاربه نمی شود مگر در صورت تفریط یا تعدی ."}, {"title": "ماده ۵۵۷", "content": "ماده ۵۵۷- اگر کسی مالی برای تجارت بدهد و قرار گذارد که تمام منافع مال مالک باشد در این صورت معامله مضاربه محسوب\nنمیشود و عامل مستحق اجرت المثل خواهد بود مگر اینکه معلوم شود که عامل عمل را تبرعاً انجام داده است ."}, {"title": "ماده ۵۵۸", "content": "ماده ۵۵۸- اگر شرط شود که مضارب ضامن سرمایه خواهد بود و یا خسارات حاصله از تجارت متوجه مالک نخواهد شد عقد باطل\nاست مگر اینکه به طور لزوم شرط شده باشد که مضارب از مال خود به مقدار خسارت یا تلف مجاناً به مالک تملیک کند ."}, {"title": "ماده ۵۵۹", "content": "ماده ۵۵۹- در حساب جاری یا حساب به مدت ممکن است با رعایت شرط قسمت اخیر ماده قبل احکام مضاربه جاری و حق المضاربه\nبه آن تعلق بگیرد ."}, {"title": "ماده ۵۶۰", "content": "ماده ۵۶۰- به غیر از آن که فوقاً مذکور شد مضاربه تابع شرایط و مقرراتی است که به موجب عقد بین طرفین مقرر است .\nفصل هفتم - در جعاله"}, {"title": "ماده ۵۶۱", "content": "ماده ۵۶۱- جعاله عبارت است از التزام شخصی به ادای اجرت معلوم در مقابل عملی اعم از اینکه طرف معین باشد یا غیر معین ."}, {"title": "ماده ۵۶۲", "content": "ماده ۵۶۲- در جعاله ملتزم را جاعل و طرف را عامل و اجرت را جُعل می گویند."}, {"title": "ماده ۵۶۳", "content": "ماده ۵۶۳- در جعاله معلوم بودن اجرت من جمیعالجهات لازم نیست بنابراین اگر کسی ملتزم شود که هر کس گم شده او را پیدا کند\nحصه مشاع معینی از آن مال او خواهد بود جعاله صحیح است."}, {"title": "ماده ۵۶۴", "content": "ماده ۵۶۴- در جعاله گذشته از عدم لزوم تعیین عامل ممکن است عمل هم مردد و کیفیات آن نامعلوم باشد ."}, {"title": "ماده ۵۶۵", "content": "ماده ۵۶۵- جعاله تعهدی است جائز و مادامی که عمل به اتمام نرسیده است هر یک از طرفین می توانند رجوع کنند ولی اگر جاعل در\nاثنای عمل رجوع نماید باید اجرت المثل عمل عامل را بدهد ."}, {"title": "ماده ۵۶۶", "content": "ماده ۵۶۶- هر گاه در جعاله عمل دارای اجزای متعدد بوده و هر یک از اجزاء مقصود بالاصاله جاعل بوده باشد و جعاله فسخ گردد عامل\nاز اجرت المسمی به نسبت عملی که کرده است مستحق خواهد بود اعم از اینکه فسخ از طرف جاعل باشد یا از طرف خود عامل ."}, {"title": "ماده ۵۶۷", "content": "ماده ۵۶۷- عامل وقتی مستحق جعل می گردد که متعلق جعاله را تسلیم کرده یا انجام داده باشد ."}, {"title": "ماده ۵۶۸", "content": "ماده ۵۶۸- اگر عاملین متعدد به شرکت هم عمل را انجام دهند هر یک به نسبت مقدار عمل خود مستحق جعل می گردد ."}, {"title": "ماده ۵۶۹", "content": "ماده ۵۶۹- مالی که جعاله برای آن واقع شده است از وقتی که به دست عامل می رسد تا به جاعل رد کند در دست او امانت است ."}, {"title": "ماده ۵۷۰", "content": "ماده ۵۷۰- جعاله بر عمل نامشروع و یا بر عمل غیر عقلایی باطل است.\nفصل هشتم - در شرکت\nمبحث اول - در احکام شرکت"}, {"title": "ماده ۵۷۱", "content": "ماده ۵۷۱- شرکت عبارت است از اجتماع حقوق مالکین متعدد در شیئی واحد به نحو اشاعه .\nقانون مدنی"}, {"title": "ماده ۵۷۲", "content": "ماده ۵۷۲- شرکت اختیاری است یا قهری ."}, {"title": "ماده ۵۷۳", "content": "ماده ۵۷۳- شرکت اختیاری یا در نتیجه عقدی از عقود حاصل می شود یا در نتیجه عمل شرکا از قبیل مزج اختیاری یا قبول مالی مشاعاً\nدر ازای عمل چند نفر و نحو اینها."}, {"title": "ماده ۵۷۴", "content": "ماده ۵۷۴- شرکت قهری اجتماع حقوق مالکین است که در نتیجه امتزاج یا ارث حاصل می شود."}, {"title": "ماده ۵۷۵", "content": "ماده ۵۷۵- هر یک از شرکا به نسبت سهم خود در نفع و ضرر سهیم می باشد مگر اینکه برای یک یا چند نفر از آن ها در مقابل عملی\nسهم زیادتری منظور شده باشد."}, {"title": "ماده ۵۷۶", "content": "ماده ۵۷۶- طرز اداره کردن اموال مشترک تابع شرایط مقرره بین شرکا خواهد برد ."}, {"title": "ماده ۵۷۷", "content": "ماده ۵۷۷- شریکی که در ضمن عقد به اداره کردن اموال مشترک مأذون شده است می تواند هر عملی را که لازمه اداره کردن است انجام\nدهد و به هیچ وجه مسئول خسارات حاصله از اعمال خود نخواهد بود مگر در صورت تفریط یا تعدی ."}, {"title": "ماده ۵۷۸", "content": "ماده ۵۷۸- شرکا همه وقت می توانند از اذن خود رجوع کنند مگر اینکه اذن در ضمن عقد لازم داده شده باشد که در این صورت مادام\nکه شرکت باقی است حق رجوع ندارند ."}, {"title": "ماده ۵۷۹", "content": "ماده ۵۷۹- اگر اداره کردن شرکت به عهده شرکای متعدد باشد به نحوی که هر یک به طور استقلال مأذون در اقدام باشد هر یک از\nآنها می تواند منفرداً به اعمالی که برای اداره کردن لازم است اقدام کند ."}, {"title": "ماده ۵۸۰", "content": "ماده ۵۸۰- اگر بین شرکا مقرر شده باشد که یکی از مدیران نمی تواند بدون دیگری اقدام کند مدیری که به تنهایی اقدام کرده باشد در\nصورت عدم امضای شرکای دیگر در مقابل شرکا، ضامن خواهد بود اگر چه برای مأذونین دیگر امکان فعلی برای مداخله در امر اداره\nکردن موجود نبوده باشد ."}, {"title": "ماده ۵۸۱", "content": "ماده ۵۸۱- تصرفات هر یک از شرکا در صورتی که بدون اذن یا خارج از حدود اذن باشد فضولی بوده و تابع مقررات معاملات فضولی\nخواهد بود."}, {"title": "ماده ۵۸۲", "content": "ماده ۵۸۲- شریکی که بدون اذن یا در خارج از حدود اذن تصرف در اموال شرکت نماید ضامن است ."}, {"title": "ماده ۵۸۳", "content": "ماده ۵۸۳- هر یک از شرکا می تواند بدون رضایت شرکای دیگر سهم خود را جزئاً یا کلاً به شخص ثالثی منتقل کند ."}, {"title": "ماده ۵۸۴", "content": "ماده ۵۸۴- شریکی که مال الشرکه در ید اوست در حکم امین است و ضامن تلف و نقص آن نمی شود مگر در صورت تفریط یا تعدی ."}, {"title": "ماده ۵۸۵", "content": "ماده ۵۸۵- شریک غیر مأذون در مقابل اشخاصی که با آن ها معامله کرده مسئول بوده و طلبکاران فقط حق رجوع به او دارند ."}, {"title": "ماده ۵۸۶", "content": "ماده ۵۸۶- اگر برای شرکت در ضمن عقد لازمی مدت معین نشده باشد هر یک از شرکا هر وقت بخواهد می تواند رجوع کند ."}, {"title": "ماده ۵۸۷", "content": "ماده ۵۸۷- شرکت به یکی از طرق ذیل مرتفع می شود:\n۱) در صورت تقسیم .\n۲) در صورت تلف شدن تمام مال شرکت ."}, {"title": "ماده ۵۸۸", "content": "ماده ۵۸۸- در موارد ذیل شرکا مأذون در تصرف اموال مشترکه نمی باشند:\n۱) در صورت انقضای مدت مأذونیت یا رجوع از آن در صورت امکان رجوع .\n۲) در صورت فوت یا محجور شدن یکی از شرکا .\nمبحث دوم - در تقسیم اموال شرکت"}, {"title": "ماده ۵۸۹", "content": "ماده ۵۸۹- هر شریک المال می تواند هر وقت بخواهد تقاضای تقسیم مال مشترک را بنماید مگر در مواردی که تقسیم به موجب این\nقانون ممنوع یا شرکا به وجه ملزمی ملتزم بر عدم تقسیم شده باشند .\nقانون مدنی"}, {"title": "ماده ۵۹۰", "content": "ماده ۵۹۰- در صورتی که شرکا بیش از دو نفر باشند ممکن است تقسیم فقط به نسبت سهم یک یا چند نفر از آن ها به عمل آید و سهام\nدیگران به اشاعه باقی بماند ."}, {"title": "ماده ۵۹۱", "content": "ماده ۵۹۱- هر گاه تمام شرکا به تقسیم مال مشترک راضی باشند تقسیم به نحوی که شرکا تراضی نمایند به عمل می آید و در صورت\nعدم توافق بین شرکا حاکم اجبار به تقسیم می کند مشروط بر اینکه تقسیم مشتمل بر ضرر نباشد که در این صورت اجبار جائز نیست و\nتقسیم باید به تراضی باشد ."}, {"title": "ماده ۵۹۲", "content": "ماده ۵۹۲- هر گاه تقسیم برای بعضی از شرکا مضر و برای بعض دیگر بی ضرر باشد در صورتی که تقاضا از طرف متضرر باشد طرف دیگر\nاجبار می شود و اگر برعکس تقاضا از طرف غیر متضرر بشود شریک متضرر اجبار بر تقسیم نمی شود."}, {"title": "ماده ۵۹۳", "content": "ماده ۵۹۳- ضرری که مانع از تقسیم می شود عبارت است از نقصان فاحش قیمت به مقداری که عادتاً قابل مسامحه نباشد ."}, {"title": "ماده ۵۹۴", "content": "ماده ۵۹۴- هر گاه قنات مشترک یا امثال آن خرابی پیدا کرده و محتاج به تنقیه یا تعمیر شود و یک یا چند نفر از شرکا بر ضرر شریک\nیا شرکای دیگر از شرکت در تنقیه یا تعمیر امتناع نمایند شریک یا شرکای متضرر می توانند به حاکم رجوع نمایند در این صورت اگر\nملک قابل تقسیم نباشد حاکم میتواند برای قلع ماده نزاع و دفع ضرر شریک ممتنع را به اقتضای موقع به شرکت در تنقیه یا تعمیر یا\nاجاره یا بیع سهم خود اجبار کند ."}, {"title": "ماده ۵۹۵", "content": "ماده ۵۹۵- هر گاه تقسیم متضمن افتادن تمام مال مشترک یا حصه یک یا چند نفر از شرکا از مالیت باشد تقسیم ممنوع است اگر چه\nشرکا تراضی نمایند ."}, {"title": "ماده ۵۹۶", "content": "ماده ۵۹۶- در صورتی که اموال مشترک متعدد باشد قسمت اجباری در بعضی از آن ها ملازم با تقسیم باقی اموال نیست ."}, {"title": "ماده ۵۹۷", "content": "ماده ۵۹۷- تقسیم ملک از وقف جایز است ولی تقسیم مال موقوفه بین موقوفعلیهم جایز نیست."}, {"title": "ماده ۵۹۸", "content": "ماده ۵۹۸- ترتیب تقسیم آنست که اگر مال مشترک مثلی باشد به نسبت سهام شرکا افراز می شود و اگر قیمتی باشد بر حسب قیمت\nتعدیل میشود و بعد از افراز یا تعدیل در صورت عدم تراضی بین شرکا حصص آن ها به قرعه معین می گردد ."}, {"title": "ماده ۵۹۹", "content": "ماده ۵۹۹- تقسیم بعد از آنکه صحیحاً واقع شد لازم است و هیچ یک از شرکا نمی تواند بدون رضای دیگران از آن رجوع کند ."}, {"title": "ماده ۶۰۰", "content": "ماده ۶۰۰- هر گاه در حصه یک یا چند نفر از شرکا عیبی ظاهر شود که در حین تقسیم عالم به آن نبوده شریک یا شرکای مزبور حق دارند\nتقسیم را بهم بزنند ."}, {"title": "ماده ۶۰۱", "content": "ماده ۶۰۱- هر گاه بعد از تقسیم معلوم شود که قسمت به غلط واقع شده است تقسیم باطل می شود."}, {"title": "ماده ۶۰۲", "content": "ماده ۶۰۲- هر گاه بعد از تقسیم معلوم شود که مقدار معینی از اموال تقسیم شده مال غیر بوده است در صورتی که مال غیر در تمام\nحصص مفروزاً به تساوی باشد تقسیم صحیح و الا باطل است ."}, {"title": "ماده ۶۰۳", "content": "ماده ۶۰۳- ممر و مجرای هر قسمتی که از متعلقات آنست بعد از تقسیم مخصوص همان قسمت می شود."}, {"title": "ماده ۶۰۴", "content": "ماده ۶۰۴- کسی که در ملک دیگری حق ارتفاق دارد نمی تواند مانع از تقسیم آن ملک بشود ولی بعد از تقسیم حق مزبور به حال خود\nباقی می ماند."}, {"title": "ماده ۶۰۵", "content": "ماده ۶۰۵- هر گاه حصه بعضی از شرکا مجرای آب یا محل عبور حصه شریک دیگر باشد بعد از تقسیم حق مجری یا عبور ساقط نمی شود\nمگر اینکه سقوط آن شرط شده باشد و همچنین است سایر حقوق ارتفاقی ."}, {"title": "ماده ۶۰۶", "content": "ماده ۶۰۶- هر گاه ترکه میت قبل از ادای دیون تقسیم شود و یا بعد از تقسیم معلوم شود که بر میت دینی بوده است طلبه کار باید به\nهر یک از وراث به نسبت سهم او رجوع کند و اگر یک یا چند نفر از وراث معسر شده باشد طلبه کار میتواند برای سهم معسر یا معسرین\nنیز به وارث دیگر رجوع نماید .\nفصل نهم - در ودیعه\nمبحث اول - در کلیات\nقانون مدنی"}, {"title": "ماده ۶۰۷", "content": "ماده ۶۰۷- ودیعه عقدی است که به موجب آن یک نفر مال خود را به دیگری می سپارد برای آ نکه آن را مجاناً نگاه دارد. ودیعه گذار\nمودع و ودیعهگیر را مستودع یا امین می گویند."}, {"title": "ماده ۶۰۸", "content": "ماده ۶۰۸- در ودیعه قبول امین لازم است اگر چه به فعل باشد ."}, {"title": "ماده ۶۰۹", "content": "ماده ۶۰۹- کسی می تواند مالی را به ودیعه گذارد که مالک یا قائم مقام مالک باشد و یا از طرف مالک صراحتاً یا ضمناً مجاز باشد ."}, {"title": "ماده ۶۱۰", "content": "ماده ۶۱۰- در ودیعه طرفین باید اهلیت برای معامله داشته باشند و اگر کسی مالی را از کسی دیگر که برای معامله اهلیت ندارد به عنوان\nودیعه قبول کند باید آن را به ولی او رد نماید و اگر در ید او ناقص یا تلف شود ضامن است ."}, {"title": "ماده ۶۱۱", "content": "ماده ۶۱۱- ودیعه عقدی است جائز.\nمبحث دوم - در تعهدات امین"}, {"title": "ماده ۶۱۲", "content": "ماده ۶۱۲- امین باید مال ودیعه را به طوری که مالک مقرر نموده حفظ کند و اگر ترتیبی تعیین نشده باشد آن را به طوری که نسبت به\nآن مال متعارف است حفظ کند و الا ضامن است ."}, {"title": "ماده ۶۱۳", "content": "ماده ۶۱۳- هر گاه مالک برای حفاظت مال ودیعه ترتیبی مقرر نموده باشد و امین از برای حفظ مال تغییر آن ترتیب را لازم بداند می تواند\nتغییر دهد مگر اینکه مالک صریحاً نهی از تغییر کرده باشد که در این صورت ضامن است ."}, {"title": "ماده ۶۱۴", "content": "ماده ۶۱۴- امین ضامن تلف یا نقصان مالی که به او سپرده شده است نمی باشد مگر در صورت تعدی یا تفریط ."}, {"title": "ماده ۶۱۵", "content": "ماده ۶۱۵- امین در مقام حفظ مسئول وقایعی نمیباشد که دفع آن از اقتدار او خارج است."}, {"title": "ماده ۶۱۶", "content": "ماده ۶۱۶- هر گاه رد مال ودیعه مطالبه شود و امین از رد آن امتناع کند از تاریخ امتناع احکام امین به او مترتب نشده و ضامن تلف و\nهر نقص یا عیبی است که در مال ودیعه حادث شود اگر چه آن عیب یا نقص مستند به فعل او نباشد."}, {"title": "ماده ۶۱۷", "content": "ماده ۶۱۷- امین نمی تواند غیر از جهت حفاظت تصرفی در ودیعه کند یا به نحوی از انحا از آن منتفع گردد مگر با اجازه صریح یا ضمنی\nامانت گذار و الا ضامن است."}, {"title": "ماده ۶۱۸", "content": "ماده ۶۱۸- اگر مال ودیعه در جعبه سربسته یا پاکت مختوم به امین سپرده شده باشد حق ندارد آن را باز کند و الا ضامن است ."}, {"title": "ماده ۶۱۹", "content": "ماده ۶۱۹- امین باید عین مالی را که دریافت کرده است رد نماید ."}, {"title": "ماده ۶۲۰", "content": "ماده ۶۲۰- امین باید مال ودیعه را به همان حالی که موقع پس دادن موجود است مسترد دارد و نسبت به نواقصی که در آن حاصل\nشده و مربوط به عمل امین نباشد ضامن نیست."}, {"title": "ماده ۶۲۱", "content": "ماده ۶۲۱- اگر مال ودیعه قهراً از امین گرفته شود و مشارالیه قیمت یا چیز دیگری به جای آن اخذ کرده باشد باید آنچه را که در عوض\nگرفته است به امانت گذار بدهد ولی امانت گذار مجبور به قبول آن نبوده و حق دارد مستقیماً به قاهر رجوع کند ."}, {"title": "ماده ۶۲۲", "content": "ماده ۶۲۲- اگر وارث امین مال ودیعه را تلف کند باید از عهده مثل یا قیمت آن برآید اگر چه عالم به ودیعه بودن مال نبوده باشد ."}, {"title": "ماده ۶۲۳", "content": "ماده ۶۲۳- منافع حاصله از ودیعه مال مالک است."}, {"title": "ماده ۶۲۴", "content": "ماده ۶۲۴- امین باید مال ودیعه را فقط به کسی که آن را از او دریافت کرده است یا قائم مقام قانونی او یا به کسی که مأذون در اخذ\nمی باشد مسترد دارد و اگر به واسطه ضرورتی بخواهد آن را رد کند و به کسی که حق اخذ دارد دسترس نداشته باشد باید به حاکم رد\nنماید."}, {"title": "ماده ۶۲۵", "content": "ماده ۶۲۵- هر گاه مستحق للغیر بودن مال ودیعه محقق گردد باید امین آن را به مالک حقیقی رد کند و اگر مالک معلوم نباشد تابع\nاحکام اموال مجهول المالک است."}, {"title": "ماده ۶۲۶", "content": "ماده ۶۲۶- اگر کسی مال خود را به ودیعه گذارد ودیعه به فوت امانت گذار باطل و امین ودیعه را نمی تواند رد کند مگر به وراث او ."}, {"title": "ماده ۶۲۷", "content": "ماده ۶۲۷- در صورت تعدد وراث و عدم توافق بین آن ها مال ودیعه باید به حاکم رد شود .\nقانون مدنی"}, {"title": "ماده ۶۲۸", "content": "ماده ۶۲۸- اگر در احوال شخص امانت گذار تغییری حاصل گردد مثلاً اگر امانت گذار محجور شود عقد ودیعه منفسخ و ودیعه را نمی توان\nمسترد نمود مگر به کسی که حق اداره کردن اموال محجور را دارد ."}, {"title": "ماده ۶۲۹", "content": "ماده ۶۲۹- اگر مال محجوری به ودیعه گذارده شده باشد آن مال باید پس از رفع حجر به مالک مسترد شود ."}, {"title": "ماده ۶۳۰", "content": "ماده ۶۳۰- اگر کسی مالی را به سمت قیمومت یا ولایت ودیعه گذارد آن مال باید پس از رفع سمت مزبور به مالک آن رد شود مگر\nاینکه از مالک رفع حجر نشده باشد که در این صورت به قیم یا ولی بعدی مسترد می گردد ."}, {"title": "ماده ۶۳۱", "content": "ماده ۶۳۱- هر گاه کسی مال غیر را به عنوانی غیر از مستودع متصرف باشد و مقررات این قانون او را نسبت به آن مال امین قرار داده\nباشد مثل مستودع است بنابراین مستأجر نسبت به عین مستأجره قیم یا ولی نسبت به مال صغیر یا مولی علیه و امثال آنها ضامن\nنمیباشد مگر در صورت تفریط یا تعدی و در صورت استحقاق مالک به استرداد از تاریخ مطالبه او و امتناع متصرف با امکان رد متصرف\nمسئول تلف و هر نقص یا عیبی خواهد بود اگر چه مستند به فعل او نباشد."}, {"title": "ماده ۶۳۲", "content": "ماده ۶۳۲- کاروانسرادار و صاحب مهمانخانه و حمامی و امثال آن ها نسبت به اشیا و اسباب یا البسه واردین وقتی مسئول می باشند که\nاشیا و اسباب یا البسه نزد آن ها ایداع شده باشد و یا اینکه بر طبق عرف بلد در حکم ایداع باشد .\nمبحث سوم - در تعهدات امانت گذار"}, {"title": "ماده ۶۳۳", "content": "ماده ۶۳۳- امانت گذار باید مخارجی را که امانت دار برای حفظ مال ودیعه کرده است به او بدهد ."}, {"title": "ماده ۶۳۴", "content": "ماده ۶۳۴- هر گاه رد مال مستلزم مخارجی باشد بر عهده امانت گذار است.\nفصل دهم - در عاریه"}, {"title": "ماده ۶۳۵", "content": "ماده ۶۳۵- عاریه عقدی است که به موجب آن احد طرفین به طرف دیگر اجازه می دهد که از عین مال او مجاناً منتفع شود .\nعاریه دهنده را معیر و عاریه گیرنده را مستعیر گویند ."}, {"title": "ماده ۶۳۶", "content": "ماده ۶۳۶- عاریه دهنده علاوه بر اهلیت باید مالک منفعت مالی باشد که عاریه می دهد اگر چه مالک عین نباشد."}, {"title": "ماده ۶۳۷", "content": "ماده ۶۳۷- هر چیزی که بتوان با بقای اصلش از آن منتفع شد میتواند موضوع عقد عاریه گردد. منفعتی که مقصود از عاریه است\nمنفعتی است که مشروع و عقلایی باشد."}, {"title": "ماده ۶۳۸", "content": "ماده ۶۳۸- عاریه عقدی است جائز و به موت هر یک از طرفین منفسخ می شود."}, {"title": "ماده ۶۳۹", "content": "ماده ۶۳۹- هر گاه مال عاریه دارای عیوبی باشد که برای مستعیر تولید خسارتی کند معیر مسئول خسارت وارده نخواهد بود مگر اینکه\nعرفاً مسبب محسوب شود .\nهمین حکم در مورد مودع و موجر و امثال آن ها نیز جاری می شود."}, {"title": "ماده ۶۴۰", "content": "ماده ۶۴۰- مستعیر ضامن تلف یا نقصان مال عاریه نمی باشد مگر در صورت تفریط یا تعدی ."}, {"title": "ماده ۶۴۱", "content": "ماده ۶۴۱- مستعیر مسئول منقصت ناشی از استعمال مال عاریه نیست مگر اینکه در غیر مورد اذن استعمال نموده باشد و اگر عاریه\nمطلق بوده بر خلاف متعارف استفاده کرده باشد ."}, {"title": "ماده ۶۴۲", "content": "ماده ۶۴۲- اگر بر مستعیر شرط ضمان شده باشد مسئول هر کسر و نقصانی خواهد بود اگر چه مربوط به عمل او نباشد ."}, {"title": "ماده ۶۴۳", "content": "ماده ۶۴۳- اگر بر مستعیر شرط ضمان منقصت ناشی از صرف استعمال نیز شده باشد ضامن این منقصت خواهد بود ."}, {"title": "ماده ۶۴۴", "content": "ماده ۶۴۴- در عاریه طلا و نقره اعم از مسکوک و غیر مسکوک مستعیر ضامن است هرچند شرط ضمان نشده و تفریط یا تعدی هم\nنکرده باشد ."}, {"title": "ماده ۶۴۵", "content": "ماده ۶۴۵- در رد عاریه باید مفاد مواد ۶۲۴ و ۶۲۶ تا ۶۳۰ رعایت شود .\nقانون مدنی"}, {"title": "ماده ۶۴۶", "content": "ماده ۶۴۶- مخارج لازمه برای انتفاع از مال عاریه بر عهده مستعیر است و مخارج نگاهداری آن تابع عرف و عادت است مگر اینکه شرط\nخاصی شده باشد."}, {"title": "ماده ۶۴۷", "content": "ماده ۶۴۷- مستعیر نمیتواند مال عاریه را به هیچ نحوی به تصرف غیر دهد مگر به اذن معیر .\nفصل یازدهم - در قرض"}, {"title": "ماده ۶۴۸", "content": "ماده ۶۴۸- قرض عقدی است که به موجب آن احد طرفین مقدار معینی از مال خود را به طرف دیگر تملیک می کند که طرف مزبور\nمثل آن را از حیث مقدار و جنس و وصف رد نماید و در صورت تعذر رد مثل قیمت یوم الرد را بدهد ."}, {"title": "ماده ۶۴۹", "content": "ماده ۶۴۹- اگر مالی که موضوع قرض است بعد از تسلیم تلف یا ناقص شود از مال مقترض است ."}, {"title": "ماده ۶۵۰", "content": "ماده ۶۵۰- مقترض باید مثل مالی را که قرض کرده است رد کند اگر چه قیمتاً ترقی یا تنزل کرده باشد ."}, {"title": "ماده ۶۵۱", "content": "ماده ۶۵۱- اگر برای ادای قرض به وجه ملزمی اجلی معین شده باشد مقترض نمی تواند قبل از انقضای مدت طلب خود را مطالبه کند ."}, {"title": "ماده ۶۵۲", "content": "ماده ۶۵۲- در موقع مطالبه حاکم مطابق اوضاع و احوال برای مقترض مهلت یا اقساطی قرار می دهد."}, {"title": "ماده ۶۵۳", "content": "ماده ۶۵۳- ]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۱۴/۸/۱۳۷۰ نسخ صریح شده است.[\nفصل دوازدهم - در قمار و گروبندی"}, {"title": "ماده ۶۵۴", "content": "ماده ۶۵۴- قمار و گروبندی باطل و دعاوی راجعه به آن مسموع نخواهد بود. همین حکم در مورد کلیه تعهداتی که از معاملات نامشروع\nتولید شده باشد جاریست ."}, {"title": "ماده ۶۵۵ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۶۵۵ (اصلاحی ۱۴/۸/۱۳۷۰)- در دوانیدن حیوانات سواری و همچنین در تیراندازی و شمشیرزنی گروبندی جایز و مفاد ماده قبل در\nمورد آن ها رعایت نمی شود.\nفصل سیزدهم - در وکالت\nمبحث اول - در کلیات"}, {"title": "ماده ۶۵۶", "content": "ماده ۶۵۶- وکالت عقدی است که به موجب آن یکی از طرفین طرف دیگر را برای انجام امری نایب خود می نماید."}, {"title": "ماده ۶۵۷", "content": "ماده ۶۵۷- تحقق وکالت منوط به قبول وکیل است ."}, {"title": "ماده ۶۵۸", "content": "ماده ۶۵۸- وکالت ایجاباً و قبولاً به هر لفظ یا فعلی که دلالت بر آن کند واقع می شود."}, {"title": "ماده ۶۵۹", "content": "ماده ۶۵۹- وکالت ممکن است مجانی باشد یا با اجرت ."}, {"title": "ماده ۶۶۰", "content": "ماده ۶۶۰- وکالت ممکن است به طور مطلق و برای تمام امور موکل باشد یا مقید و برای امر یا امور خاصی ."}, {"title": "ماده ۶۶۱", "content": "ماده ۶۶۱- در صورتی که وکالت مطلق باشد فقط مربوط به اداره کردن اموال موکل خواهد بود ."}, {"title": "ماده ۶۶۲", "content": "ماده ۶۶۲- وکالت باید در امری داده شود که خود موکل بتواند آن را بجا آورد وکیل هم باید کسی باشد که برای انجام آن امر اهلیت\nداشته باشد."}, {"title": "ماده ۶۶۳", "content": "ماده ۶۶۳- وکیل نمی تواند عملی را که از حدود وکالت او خارج است انجام دهد ."}, {"title": "ماده ۶۶۴", "content": "ماده ۶۶۴- وکیل در محاکمه وکیل در قبض حق نیست مگر اینکه قرائن دلالت بر آن نماید و همچنین وکیل در اخذ حق وکیل در مرافعه\nنخواهد بود."}, {"title": "ماده ۶۶۵", "content": "ماده ۶۶۵- وکالت در بیع وکالت در قبض ثمن نیست مگر اینکه قرینه قطعی دلالت بر آن کند .\nمبحث دوم - در تعهدات وکیل\nقانون مدنی"}, {"title": "ماده ۶۶۶", "content": "ماده ۶۶۶- هر گاه از تقصیر وکیل خسارتی به موکل متوجه شود که عرفاً وکیل مسبب آن محسوب می گردد مسئول خواهد بود ."}, {"title": "ماده ۶۶۷", "content": "ماده ۶۶۷- وکیل باید در تصرفات و اقدامات خود مصلحت موکل را مراعات نماید و از آنچه که موکل بالصراحه به او اختیار داده یا بر\nحسب قرائن و عرف و عادت داخل اختیار او است تجاوز نکند ."}, {"title": "ماده ۶۶۸", "content": "ماده ۶۶۸- وکیل باید حساب مدت وکالت خود را به موکل بدهد و آنچه را که به جای او دریافت کرده است به او رد کند ."}, {"title": "ماده ۶۶۹", "content": "ماده ۶۶۹- هر گاه برای انجام امر دو یا چند نفر وکیل معین شده باشد هیچ یک از آن ها نمیتواند بدون دیگری یا دیگران دخالت در آن\nامر بنماید مگر اینکه هر یک مستقلاً وکالت داشته باشد در این صورت هر کدام می تواند به تنهایی آن امر را بجا آورد ."}, {"title": "ماده ۶۷۰", "content": "ماده ۶۷۰- در صورتی که دو نفر به نحو اجتماع وکیل باشند به موت یکی از آن ها وکالت دیگری باطل می شود."}, {"title": "ماده ۶۷۱", "content": "ماده ۶۷۱- وکالت در هر امر مستلزم وکالت در لوازم و مقدمات آن نیز هست مگر اینکه تصریح به عدم وکالت باشد ."}, {"title": "ماده ۶۷۲", "content": "ماده ۶۷۲- وکیل در امری نمی تواند برای آن امر به دیگری وکالت دهد مگر اینکه صریحاً یا به دلالت قرائن وکیل در توکیل باشد ."}, {"title": "ماده ۶۷۳", "content": "ماده ۶۷۳- اگر وکیل که وکالت در توکیل نداشته انجام امری را که در آن وکالت دارد به شخص ثالثی واگذار کند هر یک از وکیل و\nشخص ثالث در مقابل موکل نسبت به خساراتی که مسبب محسوب می شود مسئول خواهد بود.\nمبحث سوم - در تعهدات موکل"}, {"title": "ماده ۶۷۴", "content": "ماده ۶۷۴- موکل باید تمام تعهداتی را که وکیل در حدود وکالت خود کرده است انجام دهد. در مورد آنچه که در خارج از حدود وکالت\nانجام داده شده است موکل هیچ گونه تعهد نخواهد داشت مگر اینکه اعمال فضولی وکیل را صراحتاً یا ضمناً اجازه کند ."}, {"title": "ماده ۶۷۵", "content": "ماده ۶۷۵- موکل باید تمام مخارجی را که وکیل برای انجام وکالت خود نموده است و همچنین اجرت وکیل را بدهد مگر اینکه در عقد\nوکالت طور دیگر مقرر شده باشد ."}, {"title": "ماده ۶۷۶", "content": "ماده ۶۷۶- حق الوکاله وکیل تابع قرارداد بین طرفین خواهد بود و اگر نسبت به حق الوکاله یا مقدار آن قرارداد نباشد تابع عرف و عادت\nاست اگر عادت مسلمی نباشد وکیل مستحق اجرت المثل است."}, {"title": "ماده ۶۷۷", "content": "ماده ۶۷۷- اگر در وکالت مجانی یا با اجرت بودن آن تصریح نشده باشد محمول بر این است که با اجرت باشد .\nمبحث چهارم - در طرق مختلفه انقضاء وکالت"}, {"title": "ماده ۶۷۸", "content": "ماده ۶۷۸- وکالت به طریق ذیل مرتفع می شود:\n۱- به عزل موکل .\n۲- به استعفای وکیل .\n۳- به موت یا به جنون وکیل یا موکل ."}, {"title": "ماده ۶۷۹", "content": "ماده ۶۷۹- موکل می تواند هر وقت بخواهد وکیل را عزل کند مگر اینکه وکالت وکیل و یا عدم عزل در ضمن عقد لازمی شرط شده\nباشد."}, {"title": "ماده ۶۸۰", "content": "ماده ۶۸۰- تمام اموری که وکیل قبل از رسیدن خبر عزل به او در حدود وکالت خود بنماید نسبت به موکل نافذ است ."}, {"title": "ماده ۶۸۱", "content": "ماده ۶۸۱- بعد از اینکه وکیل استعفا داد مادامی که معلوم است موکل به اذن خود باقی است می تواند در آنچه وکالت داشته اقدام کند ."}, {"title": "ماده ۶۸۲", "content": "ماده ۶۸۲- محجوریت موکل موجب بطلان وکالت می شود مگر در اموری که حجر مانع از توکیل در آن ها نمی باشد و همچنین است\nمحجوریت وکیل مگر در اموری که حجر مانع از اقدام در آن نباشد ."}, {"title": "ماده ۶۸۳", "content": "ماده ۶۸۳- هر گاه متعلق وکالت از بین برود یا موکل عملی را که مورد وکالت است خود انجام دهد یا به طور کلی عملی که منافی با\nوکالت وکیل باشد بجا آورد، مثل اینکه مالی را که برای فروش آن وکالت داده بود خود بفروشد وکالت منفسخ می شود.\nقانون مدنی\nقانون مدنی\nفصل چهاردهم - در ضمان عقدی\nمبحث اول - در کلیات"}, {"title": "ماده ۶۸۴", "content": "ماده ۶۸۴- عقد ضمان عبارت است از اینکه شخصی مالی را که بر ذمه دیگری است به عهده بگیرد. متعهد را ضامن طرف دیگر را\nمضمونله و شخص ثالث را مضمون عنه یا مدیون اصلی می گویند."}, {"title": "ماده ۶۸۵", "content": "ماده ۶۸۵- در ضمان رضای مدیون اصلی شرط نیست ."}, {"title": "ماده ۶۸۶", "content": "ماده ۶۸۶- ضامن باید برای معامله اهلیت داشته باشد ."}, {"title": "ماده ۶۸۷", "content": "ماده ۶۸۷- ضامن شدن از محجور و میت صحیح است."}, {"title": "ماده ۶۸۸", "content": "ماده ۶۸۸- ممکن است از ضامن ضمانت کرد ."}, {"title": "ماده ۶۸۹", "content": "ماده ۶۸۹- هر گاه چند نفر ضامن شخصی شوند ضمانت هر کدام که مضمونله قبول کند صحیح است."}, {"title": "ماده ۶۹۰", "content": "ماده ۶۹۰- در ضمان شرط نیست که ضامن مالدار باشد لیکن اگر مضمون له در وقت ضمان به عدم تمکن ضامن جاهل بوده باشد\nمی تواند عقد ضمان را فسخ کند ولی اگر ضامن بعد از عقد غیرملی شود مضمون له خیاری نخواهد داشت."}, {"title": "ماده ۶۹۱", "content": "ماده ۶۹۱- ضمان دینی که هنوز سبب آن ایجاد نشده است باطل است."}, {"title": "ماده ۶۹۲", "content": "ماده ۶۹۲- در دین حال ممکن است ضامن برای تأدیه آن اجلی معین کند و همچنین می تواند در دین مؤجل تعهد پرداخت فوری آن\nرا بنماید ."}, {"title": "ماده ۶۹۳", "content": "ماده ۶۹۳- مضمون له می تواند در عقد ضمان از ضامن مطالبه رهن کند اگر چه دین اصلی رهنی نباشد ."}, {"title": "ماده ۶۹۴", "content": "ماده ۶۹۴- علم ضامن به مقدار و اوصاف و شرایط دینی که ضمانت آن را می نماید شرط نیست بنابراین اگر کسی ضامن دین شخص\nبشود بدون اینکه بداند آن دین چه مقدار است ضمان صحیح است لیکن ضمانت یکی از چند دین به نحو تردید باطل است ."}, {"title": "ماده ۶۹۵", "content": "ماده ۶۹۵- معرفت تفصیلی ضامن به شخص مضمون له یا مضمون عنه لازم نیست ."}, {"title": "ماده ۶۹۶", "content": "ماده ۶۹۶- هر دینی را ممکن است ضمانت نمود اگر چه شرط فسخی در آن موجود باشد ."}, {"title": "ماده ۶۹۷", "content": "ماده ۶۹۷- ضمان عهده از مشتری یا بایع نسبت به درک مبیع یا ثمن در صورت مستحق للغیر درآمدن آن جایز است .\nمبحث دوم - در اثر ضمان بین ضامن و مضمون له"}, {"title": "ماده ۶۹۸", "content": "ماده ۶۹۸- بعد از اینکه ضمان به طور صحیح واقع شد ذمه مضمون عنه بری و ذمه ضامن به مضمون له مشغول میشود."}, {"title": "ماده ۶۹۹", "content": "ماده ۶۹۹- تعلیق در ضمان مثل اینکه ضامن قید کند که اگر مدیون نداد من ضامنم باطل است ولی التزام به تأدیه ممکن است معلق\nباشد."}, {"title": "ماده ۷۰۰", "content": "ماده ۷۰۰- تعلیق ضامن به شرایط صحت آن مثل اینکه ضامن قید کند که اگر مضمون عنه مدیون باشد من ضامنم موجب بطلان آن\nنمیشود."}, {"title": "ماده ۷۰۱", "content": "ماده ۷۰۱- ضمان عقدی است لازم و ضامن یا مضمون له نمیتوانند آن را فسخ کنند مگر در صورت اعسار ضامن به طوری که در ماده\n۶۹۰ مقرر است یا در صورت بودن حق فسخ نسبت بدین مضمون له و یا در صورت تخلف از مقررات عقد ."}, {"title": "ماده ۷۰۲", "content": "ماده ۷۰۲- هر گاه ضمان مدت داشته باشد مضمون له نمیتواند قبل از انقضای مدت مطالبه طلب خود را از ضامن کند اگر چه دین حال\nباشد."}, {"title": "ماده ۷۰۳", "content": "ماده ۷۰۳- در ضمان حال مضمون له حق مطالبه طلب خود را دارد اگر چه دین مؤجل باشد ."}, {"title": "ماده ۷۰۴", "content": "ماده ۷۰۴- ضمان مطلق محمول به حال است مگر آنکه به قرائن معلوم شود که مؤجل بوده است .\nقانون مدنی"}, {"title": "ماده ۷۰۵", "content": "ماده ۷۰۵- ضمان مؤجل به فوت ضامن حال می شود."}, {"title": "ماده ۷۰۶", "content": "ماده ۷۰۶- ]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۱۴/۸/۱۳۷۰ نسخ صریح شده است .["}, {"title": "ماده ۷۰۷", "content": "ماده ۷۰۷- اگر مضمونله ذمه مضمونعنه را بری کند ضامن بری نمی شود مگر اینکه مقصود ابراء از اصل دین باشد ."}, {"title": "ماده ۷۰۸", "content": "ماده ۷۰۸- کسی که ضامن درک مبیع است در صورت فسخ بیع به سبب اقاله یا خیار از ضمان بری می شود.\nمبحث سوم - در اثر ضمان بین ضامن و مضمون عنه"}, {"title": "ماده ۷۰۹", "content": "ماده ۷۰۹- ضامن حق رجوع به مضمون عنه ندارد مگر بعد از ادای دین ولی می تواند در صورتی که مضمون عنه ملتزم شده باشد که در\nمدت معینی برائت او را تحصیل نماید و مدت مزبور هم منقضی شده باشد رجوع کند ."}, {"title": "ماده ۷۱۰", "content": "ماده ۷۱۰- اگر ضامن با رضایت مضمون له حواله کند به کسی که دین را بدهد و آن شخص قبول نماید مثل آنست که دین را ادا کرده\nاست و حق رجوع به مضمون عنه دارد و همچنین است حواله مضمون له به عهده ضامن."}, {"title": "ماده ۷۱۱", "content": "ماده ۷۱۱- اگر ضامن دین را تأدیه کند و مضمون عنه آن را ثانیاً بپردازد ضامن حق رجوع به مضمون له نخواهد داشت و باید به\nمضمونعنه مراجعه کند و مضمون عنه میتواند از مضمونله آنچه را که گرفته است مسترد دارد ."}, {"title": "ماده ۷۱۲", "content": "ماده ۷۱۲- هر گاه مضمون له فوت شود و ضامن وارث او باشد حق رجوع به مضمون عنه دارد ."}, {"title": "ماده ۷۱۳", "content": "ماده ۷۱۳- اگر ضامن به مضمونله کمتر از دین داده باشد زیاده بر آنچه داده نمیتواند از مدیون مطالبه کند اگر چه دین را صلح به\nکمتر کرده باشد ."}, {"title": "ماده ۷۱۴", "content": "ماده ۷۱۴- اگر ضامن زیادتر از دین به داین بدهد حق رجوع به زیاده ندارد مگر در صورتی که به اذن مضمون عنه داده باشد."}, {"title": "ماده ۷۱۵", "content": "ماده ۷۱۵- هر گاه دین مدت داشته و ضامن قبل از موعد آن را بدهد مادام که دین حال نشده است نمی تواند از مدیون مطالبه کند."}, {"title": "ماده ۷۱۶", "content": "ماده ۷۱۶- در صورتی که دین حال باشد هر وقت ضامن ادا کند می تواند رجوع به مضمون عنه نماید هرچند ضمان مدت داشته و موعد\nآن نرسیده باشد مگر آ نکه مضمون عنه اذن به ضمان مؤجل داده باشد."}, {"title": "ماده ۷۱۷", "content": "ماده ۷۱۷- هر گاه مضمون عنه دین را ادا کند ضامن بری می شود هرچند ضامن به مضمون عنه اذن در ادا نداده باشد."}, {"title": "ماده ۷۱۸", "content": "ماده ۷۱۸- هر گاه مضمون له ضامن را از دین ابراء کند ضامن و مضمون عنه هر دو بری میشوند."}, {"title": "ماده ۷۱۹", "content": "ماده ۷۱۹- هر گاه مضمون له ضامن را ابراء یا دیگری مجاناً دین را بدهد ضامن حق رجوع به مضمون عنه ندارد ."}, {"title": "ماده ۷۲۰", "content": "ماده ۷۲۰- ضامنی که به قصد تبرع ضمانت کرده باشد حق رجوع به مضمون عنه ندارد .\nمبحث چهارم - در اثر ضمان بین ضامنین"}, {"title": "ماده ۷۲۱", "content": "ماده ۷۲۱- هر گاه اشخاص متعدد از یک شخص و برای یک قرض به نحو تسهیم ضمانت کرده باشند مضمون له به هر یک از آن ها فقط\nبه قدر سهم او حق رجوع دارد و اگر یکی از ضامنین تمام قرض را تأدیه نماید به هر یک از ضامنین دیگر که اذن تأدیه داده باشد می تواند\nبه قدر سهم او رجوع کند ."}, {"title": "ماده ۷۲۲", "content": "ماده ۷۲۲- ضامن ضامن حق رجوع به مدیون اصلی ندارد و باید به مضمون عنه خود رجوع کند و به همین طریق هر ضامنی به\nمضمونعنه خود رجوع می کند تا به مدیون اصلی برسد ."}, {"title": "ماده ۷۲۳", "content": "ماده ۷۲۳- ممکن است کسی در ضمن عقد لازمی به تأدیه دین دیگری ملتزم شود در این صورت تعلیق به التزام مبطل نیست مثل\nاینکه کسی التزام خود را به تأدیه دین مدیون معلق به عدم تأدیه او نماید .\nقانون مدنی\nفصل پانزدهم - در حواله"}, {"title": "ماده ۷۲۴", "content": "ماده ۷۲۴- حواله عقدی است که به موجب آن طلب شخصی از ذمه مدیون به ذمه شخص ثالثی منتقل می گردد .\nمدیون را محیل، طلبه کار را محتال، شخص ثالث را محال علیه می گویند."}, {"title": "ماده ۷۲۵", "content": "ماده ۷۲۵- حواله محقق نمیشود مگر با رضای محتال و قبول محال علیه."}, {"title": "ماده ۷۲۶", "content": "ماده ۷۲۶- اگر در مورد حواله محیل مدیون محتال نباشد احکام حواله در آن جاری نخواهد بود ."}, {"title": "ماده ۷۲۷", "content": "ماده ۷۲۷- برای صحت حواله لازم نیست که محال علیه مدیون به محیل باشد در این صورت محال علیه پس از قبولی در حکم ضامن\nاست."}, {"title": "ماده ۷۲۸", "content": "ماده ۷۲۸- در صحت حواله ملائت محال علیه شرط نیست ."}, {"title": "ماده ۷۲۹", "content": "ماده ۷۲۹- هر گاه در وقت حواله محالعلیه معسر بوده و محتال جاهل به اعسار او باشد محتال میتواند حواله را فسخ و به محیل\nرجوع کند ."}, {"title": "ماده ۷۳۰", "content": "ماده ۷۳۰- پس از تحقق حواله ذمه محیل از دینی که حواله داده بری و ذمه محال علیه مشغول می شود."}, {"title": "ماده ۷۳۱", "content": "ماده ۷۳۱- در صورتی که محال علیه مدیون محیل نبوده بعد از ادای وجه حواله می تواند به همان مقداری که پرداخته است رجوع به\nمحیل نماید."}, {"title": "ماده ۷۳۲", "content": "ماده ۷۳۲- حواله عقدی است لازم و هیچ یک از محیل و محتال و محال علیه نمی تواند آن را فسخ کند مگر در مورد ماده ۷۲۹ و یا در\nصورتی که خیار فسخ شرط شده باشد ."}, {"title": "ماده ۷۳۳", "content": "ماده ۷۳۳- اگر در بیع بایع حواله داده باشد که مشتری ثمن را به شخصی بدهد یا مشتری حواله داده باشد که بایع ثمن را از کسی بگیرد\nو بعد بطلان بیع معلوم گردد حواله باطل می شود و اگر محتال ثمن را اخذ کرده باشد باید مسترد دارد ولی اگر بیع به واسطه فسخ یا\nاقاله منفسخ شود حواله باطل نبوده لیکن محال علیه بری و بایع یا مشتری می تواند به یکدیگر رجوع کند .\nمفاد این ماده در مورد سایر تعهدات نیز جاری خواهد بود .\nفصل شانزدهم - در کفالت"}, {"title": "ماده ۷۳۴", "content": "ماده ۷۳۴- کفالت عقدی است که به موجب آن احد طرفین در مقابل طرف دیگر احضار شخص ثالثی را تعهد می کند.\nمتعهد را کفیل، شخص ثالث را مکفول و طرف دیگر را مکفول له میگویند."}, {"title": "ماده ۷۳۵", "content": "ماده ۷۳۵- کفالت به رضای کفیل و مکفول له واقع میشود."}, {"title": "ماده ۷۳۶", "content": "ماده ۷۳۶- در صحت کفالت علم کفیل به ثبوت حقی بر عهده مکفول شرط نیست بلکه دعوی حق از طرف مکفول له کافی است اگر\nچه مکفول منکر آن باشد."}, {"title": "ماده ۷۳۷", "content": "ماده ۷۳۷- کفالت ممکن است مطلق باشد یا موقت و در صورت موقت بودن باید مدت آن معلوم باشد ."}, {"title": "ماده ۷۳۸", "content": "ماده ۷۳۸- ممکن است شخص دیگر کفیل کفیل شود."}, {"title": "ماده ۷۳۹", "content": "ماده ۷۳۹- در کفالت مطلق مکفولله هر وقت بخواهد میتواند احضار مکفول را تقاضا کند ولی در کفالت موقت قبل از رسیدن موعد\nحق مطالبه ندارد ."}, {"title": "ماده ۷۴۰", "content": "ماده ۷۴۰- کفیل باید مکفول را در زمان و مکانی که تعهد کرده است حاضر نماید و الا باید از عهده حقی که بر عهده مکفول ثابت\nمی شود برآید ."}, {"title": "ماده ۷۴۱", "content": "ماده ۷۴۱- اگر کفیل ملتزم شده باشد که مالی در صورت عدم احضار مکفول بدهد باید به نحوی که ملتزم شده است عمل کند .\nقانون مدنی"}, {"title": "ماده ۷۴۲", "content": "ماده ۷۴۲- اگر در کفالت محل تسلیم معین نشده باشد کفیل باید مکفول را در محل عقد تسلیم کند مگر اینکه عقد منصرف به محل\nدیگر باشد."}, {"title": "ماده ۷۴۳", "content": "ماده ۷۴۳- اگر مکفول غایب باشد به کفیل مهلتی که برای حاضر کردن مکفول کافی باشد داده می شود."}, {"title": "ماده ۷۴۴", "content": "ماده ۷۴۴- اگر کفیل مکفول را در غیر زمان و مکان مقرر یا برخلاف شرایطی که کرده اند تسلیم کند قبول آن بر مکفول له لازم نیست\nلیکن اگر قبول کرد کفیل بری می شود و همچنین اگر مکفولله برخلاف مقرر بین طرفین تقاضای تسلیم نماید کفیل ملزم به قبول\nنیست."}, {"title": "ماده ۷۴۵", "content": "ماده ۷۴۵- هر کس شخصی را از تحت اقتدار ذی حق یا قائم مقام او بدون رضای او خارج کند در حکم کفیل است و باید آن شخص را\nحاضر کند و الا باید از عهده حقی که بر او ثابت شود برآید ."}, {"title": "ماده ۷۴۶", "content": "ماده ۷۴۶- در موارد ذیل کفیل بری می شود.\n۱ (در صورت حاضر کردن مکفول به نحوی که متعهد شده است .\n۲( در صورتی که مکفول در موقع مقرر شخصاً حاضر شود .\n۳) در صورتی که ذمه مکفول به نحوی از انحا از حقی که مکفول له بر او دارد بری شود .\n۴) در صورتی که مکفول له کفیل را بری نماید .\n۵) در صورتی که حق مکفول له به نحوی از انحا به دیگری منتقل شود.\n۶) در صورت فوت مکفول ."}, {"title": "ماده ۷۴۷ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۷۴۷ (اصلاحی ۱۴/۸/۱۳۷۰) - هر گاه کفیل مکفول خود را مطابق شرایط مقرره حاضر کند و مکفول له از قبول آن امتناع نماید\nکفیل می تواند احضار مکفول و امتناع مکفول له را با شهادت معتبر نزد حاکم و یا احضار نزد حاکم اثبات نماید ."}, {"title": "ماده ۷۴۸", "content": "ماده ۷۴۸- فوت مکفول له موجب برائت کفیل نمی شود."}, {"title": "ماده ۷۴۹", "content": "ماده ۷۴۹- هر گاه یک نفر در مقابل چند نفر از شخصی کفالت نماید به تسلیم او به یکی از آنها در مقابل دیگران بری نمی شود."}, {"title": "ماده ۷۵۰", "content": "ماده ۷۵۰- در صورتی که شخصی کفیل کفیل باشد و دیگری کفیل او و هکذا هر کفیل باید مکفول خود را حاضر کند و هر کدام از آنها\nکه مکفول اصلی را حاضر کرد او و سایرین بری می شوند و هر کدام که به یکی از جهات مزبوره در ماده ۷۴۶ بری شد کفیلهای مابعد او\nهم بری می شوند."}, {"title": "ماده ۷۵۱", "content": "ماده ۷۵۱- هر گاه کفالت به اذن مکفول بوده و کفیل با عدم تمکن از احضار حقی را که به عهده او است ادا نماید و یا به اذن او ادای\nحق کند می تواند به مکفول رجوع کرده آنچه را که داده اخذ کند و اگر هیچ یک به اذن مکفول نباشد حق رجوع نخواهد داشت .\nفصل هفدهم - در صلح"}, {"title": "ماده ۷۵۲", "content": "ماده ۷۵۲- صلح ممکن است یا در مورد رفع تنازع موجود و یا جلوگیری از تنازع احتمالی در مورد معامله و غیر آن واقع شود ."}, {"title": "ماده ۷۵۳", "content": "ماده ۷۵۳- برای صحت صلح طرفین باید اهلیت معامله و تصرف در مورد صلح داشته باشند ."}, {"title": "ماده ۷۵۴", "content": "ماده ۷۵۴- هر صلح نافذ است جز صلح بر امری که غیر مشروع باشد."}, {"title": "ماده ۷۵۵", "content": "ماده ۷۵۵- صلح با انکار دعوی نیز جائز است بنابراین درخواست صلح اقرار محسوب نمی شود."}, {"title": "ماده ۷۵۶", "content": "ماده ۷۵۶- حقوق خصوصی که از جرم تولید می شود ممکن است مورد صلح واقع شود ."}, {"title": "ماده ۷۵۷", "content": "ماده ۷۵۷- صلح بلاعوض نیز جائز است.\nقانون مدنی"}, {"title": "ماده ۷۵۸", "content": "ماده ۷۵۸- صلح در مقام معاملات هرچند نتیجه معامله را که به جای آن واقع شده است می دهد لیکن شرایط و احکام خاصه آن\nمعامله را ندارد بنابراین اگر مورد صلح عین باشد در مقابل عوض نتیجه آن همان نتیجه بیع خواهد بود بدون اینکه شرایط و احکام\nخاصه بیع در آن مجری شود."}, {"title": "ماده ۷۵۹", "content": "ماده ۷۵۹- حق شفعه در صلح نیست هر چند در مقام بیع باشد."}, {"title": "ماده ۷۶۰", "content": "ماده ۷۶۰- صلح عقد لازمست اگر چه در مقام عقود جائزه واقع شده باشد و بر هم نمی خورد مگر در موارد فسخ به خیار یا اقاله ."}, {"title": "ماده ۷۶۱", "content": "ماده ۷۶۱- صلحی که در مورد تنازع یا مبنی بر تسامح باشد قاطع بین طرفین است و هیچ یک نمی تواند آن را فسخ کند اگر چه به\nادعای غبن باشد مگر در صورت تخلف شرط با اشتراط خیار ."}, {"title": "ماده ۷۶۲", "content": "ماده ۷۶۲- اگر در طرف مصالحه و یا در مورد صلح اشتباهی واقع شده باشد صلح باطل است ."}, {"title": "ماده ۷۶۳", "content": "ماده ۷۶۳- صلح به اکراه نافذ نیست ."}, {"title": "ماده ۷۶۴", "content": "ماده ۷۶۴- تدلیس در صلح موجب خیار فسخ است."}, {"title": "ماده ۷۶۵", "content": "ماده ۷۶۵- صلح دعوی مبتنی بر معامله باطله باطل است ولی صلح دعوی ناشی از بطلان معامله صحیح است."}, {"title": "ماده ۷۶۶", "content": "ماده ۷۶۶- اگر طرفین به طور کلی تمام دعاوی واقعیه و فرضیه خود را به صلح خاتمه داده باشند کلیه دعاوی داخل در صلح محسوب\nاست اگر چه منشا دعوی در حین صلح معلوم نباشد مگر اینکه صلح به حسب قرائن شامل آن نگردد ."}, {"title": "ماده ۷۶۷", "content": "ماده ۷۶۷- اگر بعد از صلح معلوم گردد که موضوع صلح منتفی بوده است صلح باطل است ."}, {"title": "ماده ۷۶۸", "content": "ماده ۷۶۸- در عقد صلح ممکن است احد طرفین در عوض مال الصلحی که می گیرد متعهد شود که نفقه معینی همه ساله یا همهماهه\nتا مدت معین تأدیه کند این تعهد ممکن است به نفع طرفین مصالحه یا به نفع شخص یا اشخاص ثالث واقع شود ."}, {"title": "ماده ۷۶۹", "content": "ماده ۷۶۹- در تعهد مذکوره در ماده قبل به نفع هر کس که واقع شده باشد ممکن است شرط نمود که بعد از فوت منتفع نفقه به وراث\nاو داده شود."}, {"title": "ماده ۷۷۰", "content": "ماده ۷۷۰- صلحی که بر طبق دو ماده فوق واقع می شود به ورشکستگی یا افلاس متعهد نفقه فسخ نمی شود مگر اینکه شرط شده باشد .\nفصل هیجدهم - در رهن"}, {"title": "ماده ۷۷۱", "content": "ماده ۷۷۱- رهن عقدی است که به موجب آن مدیون مالی را برای وثیقه به داین می دهد.\nرهن دهنده را راهن و طرف دیگر را مرتهن می گویند."}, {"title": "ماده ۷۷۲", "content": "ماده ۷۷۲- مال مرهون باید به قبض مرتهن یا به تصرف کسی که بین طرفین معین می گردد داده شود ولی استمرار قبض شرط صحت\nمعامله نیست."}, {"title": "ماده ۷۷۳", "content": "ماده ۷۷۳- هر مالی که قابل نقل و انتقال قانونی نیست نمیتواند مورد رهن واقع شود ."}, {"title": "ماده ۷۷۴", "content": "ماده ۷۷۴- مال مرهون باید عین معین باشد و رهن دین و منفعت باطل است ."}, {"title": "ماده ۷۷۵", "content": "ماده ۷۷۵- برای هر مالی که در ذمه باشد ممکن است رهن داده شود ولو عقدی که موجب اشتغال ذمه است قابل فسخ باشد ."}, {"title": "ماده ۷۷۶", "content": "ماده ۷۷۶- ممکن است یک نفر مالی را در مقابل دو یا چند دین که به دو یا چند نفر دارد رهن بدهد در این صورت مرتهنین باید به\nتراضی معین کنند که رهن در تصرف چه کسی باشد و همچنین ممکن است دو نفر یک مال را به یک نفر در مقابل طلبی که از آن ها\nدارد رهن بدهند ."}, {"title": "ماده ۷۷۷", "content": "ماده ۷۷۷- در ضمن عقد رهن یا به موجب عقد علیحده ممکن است راهن مرتهن را وکیل کند که اگر در موعد مقرر راهن قرض خود\nرا ادا ننموده مرتهن از عین مرهونه یا قیمت آن طلب خود را استیفا کند و نیز ممکن است قرار دهد وکالت مزبور بعد از فوت مرتهن با\nورثه او باشد و بالاخره ممکن است که وکالت به شخص ثالث داده شود .\nقانون مدنی"}, {"title": "ماده ۷۷۸", "content": "ماده ۷۷۸- اگر شرط شده باشد که مرتهن حق فروش عین مرهونه را ندارد باطل است ."}, {"title": "ماده ۷۷۹", "content": "ماده ۷۷۹- هر گاه مرتهن برای فروش عین مرهونه وکالت نداشته باشد و راهن هم برای فروش آن و ادای دین حاضر نگردد مرتهن به\nحاکم رجوع می نماید تا اجبار به بیع یا ادای دین به نحو دیگر بکند."}, {"title": "ماده ۷۸۰", "content": "ماده ۷۸۰- برای استیفای طلب خود از قیمت رهن مرتهن بر هر طلبه کار دیگری رجحان خواهد داشت ."}, {"title": "ماده ۷۸۱", "content": "ماده ۷۸۱- اگر مال مرهون به قیمتی بیش از طلب مرتهن فروخته شود مازاد مال مالک آن است و اگر برعکس حاصل فروش کمتر\nباشد مرتهن باید برای نقیصه به راهن رجوع کند ."}, {"title": "ماده ۷۸۲", "content": "ماده ۷۸۲- در مورد قسمت اخیر ماده قبل اگر راهن مفلس شده باشد مرتهن با غرماء شریک می شود."}, {"title": "ماده ۷۸۳", "content": "ماده ۷۸۳- اگر راهن مقداری از دین را ادا کند حق ندارد مقداری از رهن را مطالبه نمایند و مرتهن می تواند تمام آن را تا تأدیه کامل دین\nنگاه دارد مگر اینکه بین راهن و مرتهن ترتیب دیگری مقررشده باشد ."}, {"title": "ماده ۷۸۴", "content": "ماده ۷۸۴- تبدیل رهن به مال دیگر به تراضی طرفین جائز است ."}, {"title": "ماده ۷۸۵", "content": "ماده ۷۸۵- هر چیزی که در عقد بیع بدون قید صریح به عنوان متعلقات جزء مبیع محسوب می شود در رهن نیز داخل خواهد بود ."}, {"title": "ماده ۷۸۶", "content": "ماده ۷۸۶- ثمره رهن و زیادتی که ممکن است در آن حاصل شود در صورتی که متصل باشد جزء رهن خواهد بود و در صورتی که\nمنفصل باشد متعلق به راهن است مگر اینکه ضمن عقد بین طرفین ترتیب دیگری مقرر شده باشد ."}, {"title": "ماده ۷۸۷", "content": "ماده ۷۸۷- عقد رهن نسبت به مرتهن جایز و نسبت به راهن لازم است و بنابراین مرتهن می تواند هر وقت بخواهد آن را بر هم زند ولی\nراهن نمی تواند قبل از اینکه دین خود را ادا نماید و یا به نحوی از انحای قانونی از آن بری شود رهن را مسترد دارد ."}, {"title": "ماده ۷۸۸", "content": "ماده ۷۸۸- به موت راهن یا مرتهن رهن منفسخ نمی شود ولی در صورت فوت مرتهن راهن می تواند تقاضا نماید که رهن به تصرف\nشخص ثالثی که به تراضی او و ورثه معین می شود داده شود.\nدر صورت عدم تراضی شخص مزبور از طرف حاکم معین می شود."}, {"title": "ماده ۷۸۹", "content": "ماده ۷۸۹- رهن در ید مرتهن امانت محسوب است و بنابراین مرتهن مسئول تلف یا ناقص شدن آن نخواهد بود مگر در صورت تقصیر ."}, {"title": "ماده ۷۹۰", "content": "ماده ۷۹۰- بعد از برائت ذمه مدیون رهن در ید مرتهن امانت است لیکن اگر با وجود مطالبه آن را رد ننماید ضامن آن خواهد بود اگر\nچه تقصیر نکرده باشد ."}, {"title": "ماده ۷۹۱", "content": "ماده ۷۹۱- اگر عین مرهونه به واسطه عمل خود راهن یا شخص دیگری تلف شود باید تلف کننده بدل آن را بدهد و بدل مزبور رهن\nخواهد بود."}, {"title": "ماده ۷۹۲", "content": "ماده ۷۹۲- وکالت مذکور در ماده ۷۷۷ شامل بدل مزبور در ماده فوق نخواهد بود."}, {"title": "ماده ۷۹۳", "content": "ماده ۷۹۳- راهن نمی تواند در رهن تصرفی کند که منافی حق مرتهن باشد مگر به اذن مرتهن ."}, {"title": "ماده ۷۹۴", "content": "ماده ۷۹۴- راهن می تواند در رهن تغییراتی بدهد یا تصرفات دیگری که برای رهن نافع باشد و منافی حقوق مرتهن هم نباشد به عمل\nآورد بدون اینکه مرتهن بتواند او را منع کند، در صورت منع اجازه با حاکم است .\nفصل نوزدهم - در هبه"}, {"title": "ماده ۷۹۵", "content": "ماده ۷۹۵- هبه عقدی است که به موجب آن یکنفر مالی را مجاناً به کس دیگری تملیک می کند تملیک کننده واهب طرف دیگر را\nمتهب، مالی را که مورد هبه است عین موهوبه می گویند."}, {"title": "ماده ۷۹۶", "content": "ماده ۷۹۶- واهب باید برای معامله و تصرف در مال خود اهلیت داشته باشد ."}, {"title": "ماده ۷۹۷", "content": "ماده ۷۹۷- واهب باید مالک مالی باشد که هبه میکند.\nقانون مدنی"}, {"title": "ماده ۷۹۸", "content": "ماده ۷۹۸- هبه واقع نمیشود مگر با قبول و قبض متهب اعم از اینکه مباشر قبض خود متهب باشد یا وکیل او و قبض بدون اذن واهب\nاثری ندارد ."}, {"title": "ماده ۷۹۹", "content": "ماده ۷۹۹- در هبه به صغیر یا مجنون یا سفیه قبض ولی معتبر است."}, {"title": "ماده ۸۰۰", "content": "ماده ۸۰۰- در صورتی که عین موهوبه در ید متهب باشد محتاج به قبض نیست ."}, {"title": "ماده ۸۰۱", "content": "ماده ۸۰۱- هبه ممکن است معوض باشد و بنابراین واهب می تواند شرط کند که متهب مالی را به او هبه کند یا عمل مشروعی را مجاناً\nبجا آورد ."}, {"title": "ماده ۸۰۲", "content": "ماده ۸۰۲- اگر قبل از قبض واهب یا متهب فوت کند هبه باطل می شود."}, {"title": "ماده ۸۰۳", "content": "ماده ۸۰۳- بعد از قبض نیز واهب می تواند با بقای عین موهوبه از هبه رجوع کند مگر در موارد ذیل :\n۱ )در صورتی که متهب پدر یا مادر یا اولاد واهب باشد .\n۲ )در صورتی که هبه معوض بوده و عوض هم داده شده باشد .\n۳ )در صورتی که عین موهوبه از ملکیت متهب خارج شده یا متعلق حق غیر واقع شود خواه قهراً مثل اینکه متّهب به واسطه فلس\nمحجور شود خواه اختیاراً مثل اینکه عین موهوبه به رهن داده شود .\n۴ )در صورتی که در عین موهوبه تغییری حاصل شود ."}, {"title": "ماده ۸۰۴", "content": "ماده ۸۰۴- در صورت رجوع واهب نماآت عین موهوبه اگر متصل باشد مال واهب و اگر منفصل باشد مال متهب خواهد بود ."}, {"title": "ماده ۸۰۵", "content": "ماده ۸۰۵- بعد از فوت واهب یا متهب رجوع ممکن نیست ."}, {"title": "ماده ۸۰۶", "content": "ماده ۸۰۶- هر گاه داین طلب خود را به مدیون ببخشد حق رجوع ندارد ."}, {"title": "ماده ۸۰۷", "content": "ماده ۸۰۷- اگر کسی مالی را به عنوان صدقه به دیگری بدهد حق رجوع ندارد .\nقسمت سوم - در اخذ بشفعه"}, {"title": "ماده ۸۰۸", "content": "ماده ۸۰۸- هر گاه مال غیر منقول قابل تقسیمی بین دو نفر مشترک باشد و یکی از دو شریک حصه خود را به قصد بیع به شخص ثالثی\nمنتقل کند شریک دیگر حق دارد قیمتی را که مشتری داده به او بدهد و حصه مبیعه را تملک کند .\nاین حق را حق شفعه و صاحب آن را شفیع می گویند."}, {"title": "ماده ۸۰۹", "content": "ماده ۸۰۹- هر گاه بنا و درخت بدون زمین فروخته شود حق شفعه نخواهد بود ."}, {"title": "ماده ۸۱۰", "content": "ماده ۸۱۰- اگر ملک دو نفر در ممر یا مجری مشترک باشد و یکی از آن ها ملک خود را با حق ممر یا مجری بفروشد دیگری حق شفعه\nدارد اگر چه در خود ملک مشاعاً شریک نباشد ولی اگر ملک را بدون ممر یا مجری بفروشد دیگری حق شفعه ندارد ."}, {"title": "ماده ۸۱۱", "content": "ماده ۸۱۱- اگر حصه یکی از دو شریک وقف باشد متولی یا موقوف علیهم حق شفعه ندارد ."}, {"title": "ماده ۸۱۲", "content": "ماده ۸۱۲- اگر مبیع متعدد بوده و بعض آن قابل شفعه و بعض دیگر قابل شفعه نباشد حق شفعه را می توان نسبت به بعضی که قابل\nشفعه است به قدر حصه آن بعض از ثمن اجرا نمود ."}, {"title": "ماده ۸۱۳", "content": "ماده ۸۱۳- در بیع فاسد حق شفعه نیست."}, {"title": "ماده ۸۱۴", "content": "ماده ۸۱۴- خیاری بودن بیع مانع از اخذ به شفعه نیست."}, {"title": "ماده ۸۱۵", "content": "ماده ۸۱۵- حق شفعه را نمی توان فقط نسبت به یک قسمت از مبیع اجرا نمود صاحب حق مزبور یا باید از آن صرف نظر کند یا نسبت\nبه تمام مبیع اجرا نماید .\nقانون مدنی"}, {"title": "ماده ۸۱۶", "content": "ماده ۸۱۶- اخذ به شفعه هر معامله را که مشتری قبل از آن و بعد از عقد بیع نسبت به مورد شفعه نموده باشد باطل می نماید."}, {"title": "ماده ۸۱۷", "content": "ماده ۸۱۷- در مقابل شریکی که به حق شفعه تملک می کند مشتری ضامن درک است نه بایع لیکن اگر در مواقع اخذ به شفعه مورد\nشفعه هنوز به تصرف مشتری داده نشده باشد شفیع حق رجوع به مشتری نخواهد داشت ."}, {"title": "ماده ۸۱۸", "content": "ماده ۸۱۸- مشتری نسبت به عیب و خرابی و تلفی که قبل از اخذ به شفعه در ید او حادث شده باشد ضامن نیست و همچنین است\nبعد از اخذ به شفعه و مطالبه در صورتی که تعدی یا تفریط نکرده باشد ."}, {"title": "ماده ۸۱۹", "content": "ماده ۸۱۹- نماآتی که قبل از اخذ به شفعه در مبیع حاصل میشود در صورتی که منفصل باشد مال مشتری و در صورتی که متصل باشد\nمال شفیع است ولی مشتری می تواند بنایی را که کرده یا درختی را که کاشته قلع کند ."}, {"title": "ماده ۸۲۰", "content": "ماده ۸۲۰- هر گاه معلوم شود که مبیع حینالبیع معیوب بوده و مشتری ارش گرفته است شفیع در موقع اخذ به شفعه مقدار ارش را از\nثمن کسر میگذارد .\nحقوق مشتری در مقابل بایع راجع به درک مبیع همان است که در ضمن عقد بیع مذکور شده است ."}, {"title": "ماده ۸۲۱", "content": "ماده ۸۲۱- حق شفعه فوری است."}, {"title": "ماده ۸۲۲", "content": "ماده ۸۲۲- حق شفعه قابل اسقاط است اسقاط به هر چیزی که دلالت بر صرف نظر کردن از حق مزبور نماید واقع می شود."}, {"title": "ماده ۸۲۳", "content": "ماده ۸۲۳- حق شفعه بعد از موت شفیع به وارث یا وراث او منتقل می شود."}, {"title": "ماده ۸۲۴", "content": "ماده ۸۲۴- هر گاه یک یا چند نفر از وراث حق خود را اسقاط کند باقی وراث نمی توانند آن را فقط نسبت به سهم خود اجرا نمایند و باید\nیا از آن صرف نظر کنند یا نسبت به تمام مبیع اجرا نمایند .\nقسمت چهارم - در وصایا و ارث\nباب اول - در وصایا\nفصل اول - در کلیات"}, {"title": "ماده ۸۲۵", "content": "ماده ۸۲۵- وصیت بر دو قسم است: تملیکی و عهدی."}, {"title": "ماده ۸۲۶", "content": "ماده ۸۲۶- وصیت تملیکی عبارت است از اینکه کسی عین یا منفعتی را از مال خود برای زمان بعد از فوتش به دیگری مجاناً تملیک\nکند.\nوصیت عهدی عبارت است از اینکه شخصی یک یا چند نفر را برای انجام امر یا اموری یا تصرفات دیگری مأمور می نماید.\nوصیتکننده موصیٖ، کسی که وصیت تملیکی به نفع او شده است موصیٰ له، مورد وصیت موصیٰ به و کسی که به موجب وصیت عهدی\nولی بر مورد ثلث یا بر صغیر قرار داده می شود وصی نامیده می شود."}, {"title": "ماده ۸۲۷", "content": "ماده ۸۲۷- تملیک به موجب وصیت محقق نمی شود مگر با قبول موصیٰ له پس از فوت موصیٖ ."}, {"title": "ماده ۸۲۸", "content": "ماده ۸۲۸- هر گاه موصیٰ له غیر محصور باشد مثل اینکه وصیت برای فقرا یا امور عام المنفعه شود قبول شرط نیست ."}, {"title": "ماده ۸۲۹", "content": "ماده ۸۲۹- قبول موصیٰ له قبل از فوت موصیٖ مؤثر نیست و موصیٖ می تواند از وصیت خود رجوع کند حتی در صورتی که موصیٰ له\nموصیٰ به را قبض کرده باشد ."}, {"title": "ماده ۸۳۰", "content": "ماده ۸۳۰- نسبت به موصیٰ له رد یا قبول وصیت بعد از فوت موصیٖ معتبر است بنابراین اگر موصیٰ له قبل از فوت موصیٖ وصیت را رد\nکرده باشد بعد از فوت می تواند آن را قبول کند و اگر بعد از فوت آن را قبول و
