رعایت\nمصلحت کودک به تشخیص دادگاه می باشد."}, {"title": "ماده ۱۱۷۰", "content": "ماده ۱۱۷۰- اگر مادر در مدتی که حضانت طفل با او است مبتلا به جنون شود یا به دیگری شوهر کند حق حضانت با پدر خواهد بود."}, {"title": "ماده ۱۱۷۱", "content": "ماده ۱۱۷۱- در صورت فوت یکی از ابوین حضانت طفل با آ نکه زنده است خواهد بود هرچند متوفی پدر طفل بوده و برای او قیم معین\nکرده باشد .\nقانون مدنی"}, {"title": "ماده ۱۱۷۲", "content": "ماده ۱۱۷۲- هیچ یک از ابوین حق ندارند در مدتی که حضانت طفل به عهده آن ها است از نگاهداری او امتناع کند در صورت امتناع یکی\nاز ابوین حاکم باید به تقاضای دیگری یا به تقاضای قیم یا یکی از قرباء و یا به تقاضای مدعی العموم نگاهداری طفل را به هر یک از ابوین\nکه حضانت به عهده اوست الزام کند و در صورتی که الزام ممکن یا مؤثر نباشد حضانت را به خرج پدر و هرگاه پدر فوت شده باشد به\nخرج مادر تامین کند."}, {"title": "ماده ۱۱۷۳ (اصلاحی ۱۱/ ۸/۱۳۷۶)", "content": "ماده ۱۱۷۳ (اصلاحی ۱۱/ ۸/۱۳۷۶) - هرگاه در اثر عدم مواظبت یا انحطاط اخلاقی پدر یا مادری که طفل تحت حضانت اوست، صحت\nجسمانی و یا تربیت اخلاقی طفل در معرض خطر باشد، محکمه می تواند به تقاضای اقربای طفل یا به تقاضای قیم او یا به تقاضای رئیس\nحوزه قضایی هر تصمیمی را که برای حضانت طفل مقتضی بداند، اتخاذ کند .\nموارد ذیل از مصادیق عدم مواظبت و یا انحطاط اخلاقی هر یک از والدین است :\n۱- اعتیاد زیانآور به الکل، مواد مخدر و قمار.\n۲- اشتهار به فساد اخلاق و فحشا.\n۳- ابتلا به بیماریهای روانی با تشخیص پزشکی قانونی.\n۴- سوءاستفاده از طفل یا اجبار او به ورود در مشاغل ضد اخلاقی مانند فساد و فحشا، تکدی گری و قاچاق .\n۵- تکرار ضرب و جرح خارج از حد متعارف ."}, {"title": "ماده ۱۱۷۴", "content": "ماده ۱۱۷۴- در صورتی که به علت طلاق یا به هر علت دیگر ابوین طفل در یک منزل سکونت نداشته باشند هر یک از ابوین که طفل\nتحت حضانت او نمیباشد حق ملاقات طفل خود را دارد تعیین زمان و مکان ملاقات و سایر جزئیات مربوطه به آن در صورت اختلاف\nبین ابوین با محکمه است."}, {"title": "ماده ۱۱۷۵", "content": "ماده ۱۱۷۵- طفل را نمی توان از ابوین و یا از پدر و یا از مادری که حضانت با او است گرفت مگر در صورت وجود علت قانونی."}, {"title": "ماده ۱۱۷۶", "content": "ماده ۱۱۷۶- مادر مجبور نیست که به طفل خود شیر بدهد مگر در صورتی که تغذیه طفل به غیر شیر مادر ممکن نباشد ."}, {"title": "ماده ۱۱۷۷", "content": "ماده ۱۱۷۷- طفل باید مطیع ابوین خود بوده و در هر سنی که باشد باید با آنها احترام کند ."}, {"title": "ماده ۱۱۷۸", "content": "ماده ۱۱۷۸- ابوین مکلف هستند که در حدود توانایی خود به تربیت اطفال خویش بر حسب مقتضی اقدام کنند و نباید آنها را مهمل\nبگذارند ."}, {"title": "ماده ۱۱۷۹", "content": "ماده ۱۱۷۹- ابوین حق تنبیه طفل خود را دارند ولی به استناد این حق نمی توانند طفل خود را خارج از حدود تادیب تنبیه نمایند .\nباب سوم - در ولایت قهری پدر و جد پدری"}, {"title": "ماده ۱۱۸۰", "content": "ماده ۱۱۸۰- طفل صغیر تحت ولایت قهری پدر و جد پدری خود میباشد و همچنین است طفل غیر رشید یا مجنون در صورتی که عدم\nرشد یا جنون او متصل به صغر باشد ."}, {"title": "ماده ۱۱۸۱", "content": "ماده ۱۱۸۱- هر یک از پدر و جد پدری نسبت به اولاد خود ولایت دارند ."}, {"title": "ماده ۱۱۸۲", "content": "ماده ۱۱۸۲- هرگاه طفل هم پدر و هم جد پدری داشته باشد و یکی از آن ها محجور یا به علتی ممنوع از تصرف در اموال مولی علیه گردد\nولایت قانونی او ساقط می شود."}, {"title": "ماده ۱۱۸۳", "content": "ماده ۱۱۸۳- در کلیه امور مربوطه به اموال و حقوقی مالی مولی علیه ولی نماینده قانونی او میباشد."}, {"title": "ماده ۱۱۸۴(اصلاحی ۱/۳/۱۳۷۹)", "content": "ماده ۱۱۸۴(اصلاحی ۱/۳/۱۳۷۹)- هرگاه ولی قهری طفل رعایت غبطه صغیر را ننماید و مرتکب اقداماتی شود که موجب ضرر مولی علیه\nگردد به تقاضای یکی از اقارب وی و یا به درخواست رئیس حوزه قضایی پس از اثبات، دادگاه ولی مذکور را عزل و از تصرف در اموال\nصغیر منع و برای اداره امور مالی طفل فرد صالحی را به عنوان قیم تعیین می نماید.\nقانون مدنی\nهمچنین اگر ولی قهری به واسطه کبر سن و یا بیماری و امثال آن قادر به اداره اموال مولی علیه نباشد و شخصی را هم برای این امر\nتعیین ننماید طبق مقررات این ماده فردی به عنوان امین به ولی قهری منضم می گردد ."}, {"title": "ماده ۱۱۸۵", "content": "ماده ۱۱۸۵- هر گاه ولی قهری طفل محجور شود مدعیالعموم مکلف است مطابق مقررات راجعه به تعیین قیم قیمی برای طفل معین\nکند."}, {"title": "ماده ۱۱۸۶", "content": "ماده ۱۱۸۶- در مواردی که برای عدم امانت ولی قهری نسبت به دارایی طفل امارات قویه موجود باشد مدعی العموم مکلف است از\nمحکمه ابتدایی رسیدگی به عملیات او را بخواهد محکمه در این مورد رسیدگی کرده در صورتی که عدم امانت او معلوم شد مطابق ماده\n۱۱۸۴ رفتار می نماید."}, {"title": "ماده ۱۱۸۷", "content": "ماده ۱۱۸۷- هر گاه ولی قهری منحصر به واسطه غیبت یا حبس یا به هر علتی که نتواند به امور مولیعلیه رسیدگی کند و کسی را هم از\nطرف خود معین نکرده باشد حاکم یک نفر امین به پیشنهاد مدعی العموم برای تصدی و اداره اموال مولی علیه و سایر امور راجعه به او\nموقتا معین خواهد کرد ."}, {"title": "ماده ۱۱۸۸", "content": "ماده ۱۱۸۸- هر یک از پدر و جد پدری بعد از وفات دیگری میتواند برای اولاد خود که تحت ولایت او می باشند وصی معین کند تا بعد\nاز فوت خود در نگاهداری و تربیت آنها مواظبت کرده و اموال آن ها را اداره نماید ."}, {"title": "ماده ۱۱۸۹", "content": "ماده ۱۱۸۹- هیچ یک از پدر و جد پدری نمیتواند با حیات دیگری برای مولی علیه خود وصی معین کند."}, {"title": "ماده ۱۱۹۰", "content": "ماده ۱۱۹۰- ممکن است پدر یا جد پدری به کسی که به سمت وصایت معین کرده اختیار تعیین وصی بعد فوت خود را برای مولی علیه\nبدهد."}, {"title": "ماده ۱۱۹۱", "content": "ماده ۱۱۹۱- اگر وصی منصوب از طرف ولی قهری به نگهداری یا تربیت مولی علیه یا اداره امور او اقدام نکند یا امتناع از انجام وظائف خود\nبنماید منعزل می شود."}, {"title": "ماده ۱۱۹۲", "content": "ماده ۱۱۹۲- ولی مسلم نمی تواند برای امور مولی علیه خود وصی غیر مسلم معین کند."}, {"title": "ماده ۱۱۹۳", "content": "ماده ۱۱۹۳- همین که طفل کبیر و رشید شد از تحت ولایت خارج می شود و اگر بعدا سفیه یا مجنون شود قیمی برای او معین می شود."}, {"title": "ماده ۱۱۹۴", "content": "ماده ۱۱۹۴- پدر و جد پدری و وصی منصوب از طرف یکی از آنان ولی خاص طفل نامیده شود .\nکتاب نهم - در خانواده\nفصل اول - در الزام به انفاق"}, {"title": "ماده ۱۱۹۵", "content": "ماده ۱۱۹۵- احکام نفقه زوجه همان است که به موجب فصل هشتم از باب اول از کتاب هفتم مقرر شده و بر طبق همین فصل مقرر\nمی شود."}, {"title": "ماده ۱۱۹۶", "content": "ماده ۱۱۹۶- در روابط بین اقارب فقط اقارب نسبی و در خط عمودی اعم از صعودی و یا نزولی ملزم به انفاق یکدیگرند ."}, {"title": "ماده ۱۱۹۷", "content": "ماده ۱۱۹۷- کسی مستحق نفقه است که ندار بوده و نتواند به وسیله اشتغال به شغلی وسائل معیشت خود را فراهم سازد ."}, {"title": "ماده ۱۱۹۸", "content": "ماده ۱۱۹۸- کسی ملزم به انفاق است که متمکن از دادن نفقه باشد یعنی بتواند نفقه بدهد بدون اینکه از این حیث در وضع معیشت\nخود دچار مضیقه گردد برای تشخیص تمکن باید کلیه تعهدات و وضع زندگانی شخصی او در جامعه در نظر گرفته شود ."}, {"title": "ماده ۱۱۹۹", "content": "ماده ۱۱۹۹- نفقه اولاد بر عهده پدر است پس از فوت پدر یا عدم قدرت او به انفاق به عهده اجداد پدری است با رعایت الاقرب فالاقرب\nدر صورت نبودن پدر و اجداد پدری و یا عدم قدرت آن ها نفقه بر عهده مادر است.\nهر گاه مادر هم زنده و یا قادر به انفاق نباشد با رعایت الاقرب فالاقرب به عهده اجداد و جدات مادری و جدات پدری واجب النفقه است و\nاگر چند نفر از اجداد و جدات مزبور از حیث درجه اقربیت مساوی باشند نفقه را باید به حصه متساوی تأدیه کنند ."}, {"title": "ماده ۱۲۰۰", "content": "ماده ۱۲۰۰- نفقه ابوین با رعایت الاقرب فالاقرب به عهده اولاد و اولاد اولاد است\nقانون مدنی"}, {"title": "ماده ۱۲۰۱", "content": "ماده ۱۲۰۱- هر گاه یک نفر هم در خط عمودی صعودی و هم در خط عمودی نزولی اقارب داشته باشد که از حیث الزام به انفاق در درجه\nمساوی هستند نفقه او را باید اقارب مزبور به حصه متساوی تأدیه کنند بنابراین اگر مستحق نفقه پدر و مادر و اولاد بلافصل داشته باشد\nنفقه او را باید پدر و اولا د او متساویا تأدیه کنند بدون اینکه مادر سهمی بدهد و همچنین اگر مستحق نفقه مادر و اولاد بلافصل داشته\nباشد نفقه او را باید مادر و اولاد متساویا بدهند ."}, {"title": "ماده ۱۲۰۲", "content": "ماده ۱۲۰۲- اگر اقارب واجب النفقه متعدد باشند و منفق نتواند نفقه همه آنها را بدهد اقارب در خط عمودی نزولی مقدم بر اقارب در\nخط عمودی صعودی خواهند بود."}, {"title": "ماده ۱۲۰۳", "content": "ماده ۱۲۰۳- در صورت بودن زوجه و یک یا چند نفر واجب النفقه دیگر زوجه مقدم بر سایرین خواهد بود."}, {"title": "ماده ۱۲۰۴", "content": "ماده ۱۲۰۴- نفقه اقارب عبارت است از مسکن و البسه و غذا و اثاث البیت به قدر رفع حاجت با در نظر گرفتن درجه استطاعت منفق ."}, {"title": "ماده ۱۲۰۵ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۲۰۵ (اصلاحی ۱۴/۸/۱۳۷۰)- در موارد غیبت یا استنکاف از پرداخت نفقه، چنانچه الزام کسی که پرداخت نفقه بر عهده اوست\nممکن نباشد دادگاه می تواند با مطالبه افراد واجب النفقه به مقدار نفقه از اموال غایب یا مستنکف در اختیار آن ها یا متکفل مخارج آنان\nقرار دهد و در صورتی که اموال غایب یا مستنکف در اختیار نباشد همسر وی یا دیگری با اجازه دادگاه می توانند نفقه را به عنوان قرض\nبپردازند و از شخص غایب یا مستنکف مطالبه نمایند ."}, {"title": "ماده ۱۲۰۶", "content": "ماده ۱۲۰۶- زوجه در هر حال می تواند برای نفقه زمان گذشته خود اقامه دعوی نماید و طلب او از بابت نفقه مزبور طلب ممتازه بوده و\nدر صورت افلاس یا ورشکستگی شوهر زن مقدم بر غرما خواهد بود ولی اقارب فقط نسبت به آتیه می توانند مطالبه نفقه نمایند.\nکتاب دهم - در حجر و قیمومت\nفصل اول - در کلیات"}, {"title": "ماده ۱۲۰۷", "content": "ماده ۱۲۰۷- اشخاص ذیل محجور و از تصرف در اموال و حقوق مالی خود ممنوع هستند :\n۱- صغار.\n۲- اشخاص غیر رشید .\n۳- مجانین."}, {"title": "ماده ۱۲۰۸", "content": "ماده ۱۲۰۸- غیر رشید کسی است که تصرفات او در اموال و حقوق مالی خود عقلایی نباشد ."}, {"title": "ماده ۱۲۰۹", "content": "ماده ۱۲۰۹- ]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۱۴/۸/۱۳۷۰ نسخ صریح شده است.["}, {"title": "ماده ۱۲۱۰ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۲۱۰ (اصلاحی ۱۴/۸/۱۳۷۰) - هیچکس را نمی توان بعد از رسیدن به سن بلوغ به عنوان جنون یا عدم رشد محجور نمود مگر آ نکه\nعدم رشد یا جنون او ثابت شده باشد .\nتبصره ۱(الحاقی ۱۴/۸/۱۳۷۰)- سن بلوغ در پسر پانزده سال تمام و در دختر نه سال تمام قمری است.\nتبصره ۲ (الحاقی ۱۴/۸/۱۳۷۰)- اموال صغیری را که بالغ شده است در صورتی می توان به او داد که رشد او ثابت شده باشد ."}, {"title": "ماده ۱۲۱۱", "content": "ماده ۱۲۱۱- جنون به هر درجه که باشد موجب حجر است ."}, {"title": "ماده ۱۲۱۲", "content": "ماده ۱۲۱۲- اعمال و اقوال صغیر تا حدی که مربوط به اموال و حقوق مالی او باشد باطل و بلااثر است معذالک صغیر ممیز می تواند\nتملک بلاعوض کند. مثل قبول هبه و صلح بلاعوض و حیازت مباحات ."}, {"title": "ماده ۱۲۱۳", "content": "ماده ۱۲۱۳- مجنون دائمی مطلقاً و مجنون ادواری در حال جنون نمی تواند هیچ تصرفی در اموال و حقوق مالی خود بنماید ولو با اجازۀ\nولی یا قیم خود لکن اعمال حقوقی که مجنون ادواری در حال افاقه می نماید نافذ است مشروط بر اینکه افاقه او مسلم باشد.\nقانون مدنی"}, {"title": "ماده ۱۲۱۴", "content": "ماده ۱۲۱۴- معاملات و تصرفات غیر رشید در اموال خود نافذ نیست مگر با اجازه ولی یا قیم او اعم از اینکه این اجازه قبلا داده شده\nباشد یا بعد از انجام عمل. معذالک تملکات بلاعوض از هر قبیل که باشد بدون اجازه هم نافذ است ."}, {"title": "ماده ۱۲۱۵", "content": "ماده ۱۲۱۵- هر گاه کسی مالی را به تصرف صغیر غیر ممیز و یا مجنون بدهد صغیر یا مجنون مسئول ناقص یا تلف شدن آن مال نخواهد\nبود."}, {"title": "ماده ۱۲۱۶", "content": "ماده ۱۲۱۶- هر گاه صغیر یا مجنون یا غیر رشید باعث ضرر غیر شود ضامن است ."}, {"title": "ماده ۱۲۱۷", "content": "ماده ۱۲۱۷- اداره اموال صغار و مجانین و اشخاص غیر رشید به عهده ولی یا قیم آنان است به طوری که در باب سوم از کتاب هشتم و\nمواد بعد مقرر است.\nفصل دوم - در موارد نصب قیم و ترتیب آن"}, {"title": "ماده ۱۲۱۸", "content": "ماده ۱۲۱۸- برای اشخاص ذیل نصب قیم می شود:\n۱- برای صغاری که ولی خاص ندارند .\n۲- برای مجانین و اشخاص غیر رشید که جنون یا عدم رشد آن ها متصل به زمان صغر آن ها بوده و ولی خاص نداشته باشند.\n۳- برای مجانین و اشخاص غیر رشید که جنون یا عدم رشد آن ها متصل به زمان صغر آن ها نباشد"}, {"title": "ماده ۱۲۱۹ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۲۱۹ (اصلاحی ۱۴/۸/۱۳۷۰) - هر یک از ابوین مکلف است در مواردی که به موجب ماده قبل باید برای اولاد آن ها قیم معین شود\nمراتب را به دادستان حوزه اقامت خود و یا نماینده او اطلاع داده از او تقاضا نماید که اقدام لازم را برای نصب قیم به عمل آورد ."}, {"title": "ماده ۱۲۲۰", "content": "ماده ۱۲۲۰- در صورت نبودن هیچ یک از ابوین یا عدم اطلاع آن ها انجام تکلیف مقرر در ماده قبل به عهده اقربائی است که با شخص\nمحتاج به قیم در یکجا زندگی می نمایند."}, {"title": "ماده ۱۲۲۱", "content": "ماده ۱۲۲۱- اگر کسی که به موجب ماده ۱۲۱۸ باید برای او نصب قیم شود زن یا شوهر داشته باشد زوج یا زوجه نیز مکلف به انجام\nتکلیف مقرر در ماده ۱۲۱۹ خواهند بود."}, {"title": "ماده ۱۲۲۲(اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۲۲۲(اصلاحی ۱۴/۸/۱۳۷۰) - در هر موردی که دادستان به نحوی از انحا به وجود شخصی که مطابق ماده ۱۲۱۸ باید برای او نصب\nقیم شود مسبوق گردید، باید به دادگاه مدنی خاص رجوع و اشخاصی را که برای قیمومیت مناسب می داند به آن دادگاه معرفی کند .\nدادگاه مدنی خاص از میان اشخاص مزبور یک یا چند نفر را به سمت قیم معین و حکم نصب او را صادر می کند و نیز دادگاه مذکور\nمی تواند علاوه بر قیم یک یا چند نفر را به عنوان ناظر معین نماید در این صورت دادگاه باید حدود اختیارات ناظر را تعیین کند .\nاگر دادگاه مدنی خاص اشخاصی را که معرفی شده اند معتمد ندید، اشخاص دیگری را از دادسرا خواهد خواست ."}, {"title": "ماده ۱۲۲۳ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۲۲۳ (اصلاحی ۱۴/۸/۱۳۷۰) - در مورد مجانین دادستان باید قبلا رجوع به خبره کرده نظریات خبره را به دادگاه مدنی خاص ارسال\nدارد. در صورت اثبات جنون دادستان به دادگاه رجوع می کند تا نصب قیم شود در مورد اشخاص غیر رشید نیز دادستان مکلف است که\nقبلا به وسیله مطلعین اطلاعات کافیه در باب سفاهت او به دست آورده و در صورتی که سفاهت را مسلم دید، در دادگاه مدنی خاص\nاقامه دعوی نماید و پس از صدور حکم عدم رشد برای نصب قیم به دادگاه رجوع نمای د."}, {"title": "ماده ۱۲۲۴", "content": "ماده ۱۲۲۴- حفظ و نظارت در اموال صغار و مجانین و اشخاص غیر رشید مادام که برای آن ها قیم معین نشده به عهده مدعی العموم\nخواهد بود.\nطرز حفظ و نظارت مدعی العموم به موجب نظامنامۀ وزارت عدلیه معین خواهد شد ."}, {"title": "ماده ۱۲۲۵", "content": "ماده ۱۲۲۵- همینکه حکم جنون یا عدم رشد یک نفر صادر و به توسط محکمه شرع برای او قیم معین گردید مدعی العموم میتواند\nحجر او را اعلان نماید انتشار حجر هرکسی که نظر به وضعیت دارایی او ممکن است طرف معاملات بالنسبه عمده واقع گردد الزامی\nاست.\nقانون مدنی"}, {"title": "ماده ۱۲۲۶", "content": "ماده ۱۲۲۶- اسامی اشخاصی که بعد از کبر و رشد به علت جنون یا سفیه محجور می گردند باید در دفتر مخصوص ثبت شود. مراجعه\nبه دفتر مزبور برای عموم آزاد است ."}, {"title": "ماده ۱۲۲۷ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۲۲۷ (اصلاحی ۱۴/۸/۱۳۷۰)- فقط کسی را محاکم و ادارات و دفاتر اسناد رسمی به قیمومیت خواهند شناخت که نصب او\nمطابق قانون توسط دادگاه به عمل آمده باشد."}, {"title": "ماده ۱۲۲۸ (اصلاحی ۱۴/ ۸/۱۳۷۰)", "content": "ماده ۱۲۲۸ (اصلاحی ۱۴/ ۸/۱۳۷۰)- در خارج ایران کنسول و یا جانشین وی می تواند نسبت به ایرانیانی که باید مطابق ماده ۱۲۱۸ برای\nآنها قیم نصب شود و در حوزه مأموریت او ساکن یا مقیم اند موقتاً نصب قیم کند و باید تا ۱۰ روز پس از نصب قیم مدارک عمل خود\nرا به وسیله وزارت امور خارجه به وزارت دادگستری بفرستد. نصب قیم مزبور وقتی قطعی می گردد که دادگاه مدنی خاص تهران تصمیم\nکنسول یا جانشین او را تنفیذ کند ."}, {"title": "ماده ۱۲۲۹", "content": "ماده ۱۲۲۹- وظائف و اختیاراتی که به موجب قوانین و نظامات مربوطه در مورد دخالت مدعیان عمومی در امور صغار و مجانین و\nاشخاص غیر رشید مقرر است در خارج ایران به عهده مامورین قنسولی خواهد بود ."}, {"title": "ماده ۱۲۳۰", "content": "ماده ۱۲۳۰- اگر در عهود و قراردادهای منعقده بین دولت ایران و دولتی که مامور قنسولی ماموریت خود را در مملکت آن دولت اجرا\nمی کنند ترتیبی برخلاف مقررات دو ماده فوق اتخاذ شده باشد مامورین مذکور مفاد آن دو ماده را تا حدی که با مقررات عهد نامه یا\nقرارداد مخالف نباشد اجرا خواهند کرد ."}, {"title": "ماده ۱۲۳۱", "content": "ماده ۱۲۳۱- اشخاص ذیل نباید به سمت قیمومت معین شوند:\n۱- کسانی که خود تحت ولایت یا قیمومت هستند.\n۲- کسانی که به علت ارتکاب جنایت یا یکی از جنحه های ذیل به موجب حکم قطعی محکوم شده باشند:\nسرقت - خیانت در امانت- کلاهبرداری - اختلاس- هتک ناموس یا منافیات عفت- جنحه نسبت به اطفال- ورشکستگی به تقصیر .\n۳- کسانی که حکم ورشکستگی آن ها صادر و هنوز عمل ورشکستگی آن ها تصفیه نشده است.\n۴- کسانی که معروف به فساد اخلاق باشند.\n۵- کسی که خود یا اقربای طبقۀ اول او دعوایی بر محجور داشته باشد."}, {"title": "ماده ۱۲۳۲", "content": "ماده ۱۲۳۲- با داشتن صلاحیت برای قیمومت اقربای محجور مقدم بر سایرین خواهند بود ."}, {"title": "ماده ۱۲۳۳", "content": "ماده ۱۲۳۳- زن نمی تواند بدون رضایت شوهر خود سمت قیمومت را قبول کند ."}, {"title": "ماده ۱۲۳۴", "content": "ماده ۱۲۳۴- در صورتی که محکمه بیش از یک نفر را برای قیمومت معین کند می تواند وظائف آنها را تفکیک نماید .\nفصل سوم - در اختیارات و وظائف و مسئولیت قیم و حدود آن نظارت مدعی العموم در امور صغار و مجانین و اشخاص غیر رشید"}, {"title": "ماده ۱۲۳۵", "content": "ماده ۱۲۳۵- مواظبت شخص مولیعلیه و نمایندگی قانونی او در کلیه امور مربوطه به اموال و حقوق مالی او با قیم است."}, {"title": "ماده ۱۲۳۶ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۲۳۶ (اصلاحی ۱۴/۸/۱۳۷۰)- قیم مکلف است قبل از مداخله در امور مالی مولی علیه صورت جامعی از کلیه دارایی او تهیه کرده\nو یک نسخه از آن را به امضای خود برای دادستانی که مولی علیه در حوزه آن سکونت دارد، بفرستد و دادستان یا نماینده او باید نسبت\nبه میزان دارایی مولی علیه تحقیقات لازمه به عمل آورد ."}, {"title": "ماده ۱۲۳۷", "content": "ماده ۱۲۳۷- مدعی العموم یا نماینده او باید بعد از ملاحظه صورت دارایی مولی علیه مبلغی را که ممکن است مخارج سالیانه مولی علیه\nبالغ بر آن گردد و مبلغی را که برای اداره کردن دارایی مزبور ممکن است لازم شود معین نماید قیم نمی تواند بیش از مبالغ مزبور خرج\nکند مگر با تصویب مدعیالعموم."}, {"title": "ماده ۱۲۳۸", "content": "ماده ۱۲۳۸- قیمی که تقصیر در حفظ مال مولی علیه بنماید مسئول ضرر و خسارتی است که از نقصان یا تلف آن مال حاصل شده اگر\nچه نقصان یا تلف مستند به تفریط یا تعدی قیم نباشد .\nقانون مدنی"}, {"title": "ماده ۱۲۳۹", "content": "ماده ۱۲۳۹- هر گاه معلوم شود که قیم عامداً مالی را که متعلق به مولی علیه بوده جزء صورت دارایی او قید نکرده و یا باعث شده است\nکه آن مال در صورت مزبور قید نشود مسئول هر ضرر و خسارتی خواهد بود که از این حیث ممکن است به مولی علیه وارد شود بعلاوه\nدر صورتی که عمل مزبور از روی سوءنیت بوده قیم معزول خواهد شد ."}, {"title": "ماده ۱۲۴۰", "content": "ماده ۱۲۴۰- قیم نمیتواند به سمت قیمومت از طرف مولی علیه با خود معامله کند اعم از اینکه مال مولی علیه را به خود منتقل کند\nیا مال خود را به او انتقال دهد ."}, {"title": "ماده ۱۲۴۱", "content": "ماده ۱۲۴۱- قیم نمیتواند اموال غیر منقول مولی علیه را بفروشد و یا رهن گذارد یا معامله کند که در نتیجه آن خود مدیون مولی علیه\nشود مگر با لحاظ غبطه مولی علیه و تصویب مدعیالعموم در صورت اخیر شرط حتمی تصویب مدعی العموم ملائت قیم میباشد. و نیز\nنمیتواند برای مولی علیه بدون ضرورت و احتیاج قرض کند مگر با تصویب مدعی العموم."}, {"title": "ماده ۱۲۴۲", "content": "ماده ۱۲۴۲- قیم نمی تواند دعوی مربوطه به مولی علیه را به صلح خاتمه دهد مگر با تصویب مدعی العموم."}, {"title": "ماده ۱۲۴۳ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۲۴۳ (اصلاحی ۱۴/۸/۱۳۷۰)- در صورت وجود موجبات موجه دادستان می تواند از دادگاه مدنی خاص تقاضا کند که از قیم\nتضمیناتی راجع به اداره اموال مولی علیه بخواهد. تعیین نوع تضمین به نظر دادگاه است. هر گاه قیم برای دادن تضمین حاضر نشد از\nقیمومت عزل می شود."}, {"title": "ماده ۱۲۴۴", "content": "ماده ۱۲۴۴- قیم باید لااقل سالی یکمرتبه حساب تصدی خود را به مدعی العموم یا نماینده او بدهد و هر گاه در ظرف یک ماه از تاریخ\nمطالبه مدعی العموم حساب ندهد به تقاضای مدعی العموم معزول می شود."}, {"title": "ماده ۱۲۴۵", "content": "ماده ۱۲۴۵- قیم باید حساب زمان تصدی خود را پس از کبر و رشد یا رفع حجر به مولی علیه سابق خود بدهد هر گاه قیمومت او قبل\nاز رفع حجر خاتمه یابد حساب زمان تصدی باید به قیم بعدی داده شود ."}, {"title": "ماده ۱۲۴۶", "content": "ماده ۱۲۴۶- قیم می تواند برای انجام امر قیمومت مطالبه اجرت کند .\nمیزان اجرت مزبور با رعیت کار قیم و مقدار اشتغالی که از امر قیمومت برای او حاصل می شود و محلی که قیم در آنجا اقامت دارد و\nمیزان عایدی مولی علیه تعیین می گردد ."}, {"title": "ماده ۱۲۴۷", "content": "ماده ۱۲۴۷- مدعی العموم میتواند اعمال نظارت در امور مولی علیه را کلا یا بعضاً به اشخاص موثق یا هیئت یا مؤسسه واگذار نماید.\nشخص یا هیئت یا مؤسسه که برای اعمال نظارت تعیین شده در صورت تقصیر یا خیانت مسئول ضرر و خسارت وارده به مولی علیه\nخواهند بود.\nفصل چهارم - در موارد عزل قیم"}, {"title": "ماده ۱۲۴۸", "content": "ماده ۱۲۴۸- در موارد ذیل قیم معزول می شود:\n۱- اگر معلوم شود که قیم فاقد صفت امانت بوده و یا این صفت از او سلب شود.\n۲- اگر قیم مرتکب جنایت و یا مرتکب یکی از جنحه های ذیل شده و به موجب حکم قطعی محکوم گردد :\nسرقت - خیانت در امانت- کلاهبرداری - اختلاس- هتک ناموس- منافیات عفت- جنحه نسبت به اطفال- ورشکستگی به تقصیر یا\nتقلب.\n۳- اگر قیم به علتی غیر از علل فوق محکوم به حبس شود و بدین جهت نتواند امور مالی مولی علیه را اداره کند .\n۴- اگر ورشکسته اعلان شود .\n۵- اگر عدم لیاقت یا توانایی قیم در اداره اموال مولی علیه معلوم شود.\n۶- در موارد مواد ۱۲۳۹ و ۱۲۴۳ و ۱۲۴۴ با تقاضای مدعی العموم."}, {"title": "ماده ۱۲۴۹", "content": "ماده ۱۲۴۹- اگر قیم مجنون یا فاقد رشد گردد منعزل می شود.\nقانون مدنی"}, {"title": "ماده ۱۲۵۰", "content": "ماده ۱۲۵۰- هر گاه قیم در امور مربوطه به اموال مولی علیه یا جنحه یا جنایت نسبت به شخص او مورد تعقیب مدعی العموم واقع شود\nمحکمه به تقاضای مدعی العموم موقتاً قیم دیگری برای اداره اموال مولی علیه معین خواهد کرد ."}, {"title": "ماده ۱۲۵۱", "content": "ماده ۱۲۵۱- هر گاه زن بی شوهری ولو مادر مولی علیه که به سمت قیمومت معین شده است اختیار شوهر کند باید مراتب را در ظرف\nیک ماه از تاریخ انعقاد نکاح به دادستان حوزه اقامت خود یا نماینده او اطلاع دهد .\nدر این صورت دادستان یا نماینده او می تواند با رعایت وضعیت جدید آن زن تقاضای تعیین قیم جدید و یا ضمّ ناظر کند ."}, {"title": "ماده ۱۲۵۲", "content": "ماده ۱۲۵۲- در مورد ماده قبل اگر قیم ازدواج خود را در مدت مقرر به مدعی العموم یا نماینده او اطلاع ندهد مدعی العموم می تواند\nتقاضای عزل او را بکند .\nفصل پنجم - در خروج از تحت قیمومت"}, {"title": "ماده ۱۲۵۳", "content": "ماده ۱۲۵۳- پس از زوال سببی که موجب تعیین قیم شده قیمومت مرتفع می شود."}, {"title": "ماده ۱۲۵۴ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۲۵۴ (اصلاحی ۱۴/۸/۱۳۷۰) - خروج از قیمومت را ممکن است خود مولی علیه یا هر شخص ذینفع دیگری تقاضا نماید. تقاضانامه\nممکن است مستقیماً یا توسط دادستان حوزه ای که مولی علیه در آنجا سکونت دارد، یا نماینده او به دادگاه مدنی خاص همان حوزه داده\nشود."}, {"title": "ماده ۱۲۵۵", "content": "ماده ۱۲۵۵- در مورد ماده قبل مدعی العموم یا نماینده او مکلف است قبلا نسبت به رفع علت تحقیقات لازمه به عمل آورده مطابق\nنتیجه حاصله از تحقیقات در محکمه اظهار عقیده نماید. در مورد کسانی که حجر آن ها مطابق ماده ۱۲۲۵ اعلان می شود رفع حجر نیز\nباید اعلان گردد ."}, {"title": "ماده ۱۲۵۶", "content": "ماده ۱۲۵۶- رفع حجر هر محجور باید در دفتر مذکور در ماده ۱۲۲۶ و در مقابل اسم آن محجور قید شود.\nجلد سوم - در ادله اثبات دعوی"}, {"title": "ماده ۱۲۵۷", "content": "ماده ۱۲۵۷- هر کس مدعی حقی باشد باید آن را اثبات کند و مدعی علیه هر گاه در مقام دفاع مدعی امری شود که محتاج به دلیل باشد\nاثبات امر بر عهده او است."}, {"title": "ماده ۱۲۵۸", "content": "ماده ۱۲۵۸- دلائل اثبات دعوی از قرار ذیل است :\n۱- اقرار .\n۲- اسناد کتبی.\n۳- شهادت.\n۴- امارات .\n۵- قسم.\nکتاب اول - در اقرار\nباب اول - در شرایط اقرار"}, {"title": "ماده ۱۲۵۹", "content": "ماده ۱۲۵۹- اقرار عبارت از اخبار به حقی است برای غیر بر ضرر خود ."}, {"title": "ماده ۱۲۶۰", "content": "ماده ۱۲۶۰- اقرار واقع می شود به هر لفظی که دلالت بر آن نماید."}, {"title": "ماده ۱۲۶۱", "content": "ماده ۱۲۶۱- اشاره شخص لال که صریحاً حاکی از اقرار باشد صحیح است .\nقانون مدنی"}, {"title": "ماده ۱۲۶۲", "content": "ماده ۱۲۶۲- اقرار کننده باید بالغ و عاقل و قاصد و مختار باشد بنابراین اقرار صغیر و مجنون در حال دیوانگی و غیر قاصد و مکره مؤثر\nنیست."}, {"title": "ماده ۱۲۶۳", "content": "ماده ۱۲۶۳- اقرار سفیه در امور مالی مؤثر نیست ."}, {"title": "ماده ۱۲۶۴", "content": "ماده ۱۲۶۴- اقرار مفلس و ورشکسته نسبت به اموال خود بر ضرر دیان نافذ نیست ."}, {"title": "ماده ۱۲۶۵", "content": "ماده ۱۲۶۵- اقرار مدعی افلاس و ورشکستگی در امور راجعه به اموال خود به ملاحظه حفظ حقوق دیگران منشا اثر نمی شود تا افلاس\nیا عدم افلاس او معین گردد ."}, {"title": "ماده ۱۲۶۶", "content": "ماده ۱۲۶۶- در مقرله اهلیت شرط نیست لیکن بر حسب قانون باید بتواند دارای انچه که به نفع او اقرار شده است بشود ."}, {"title": "ماده ۱۲۶۷", "content": "ماده ۱۲۶۷- اقرار به نفع متوفی درباره ورثه او مؤثر خواهد بود ."}, {"title": "ماده ۱۲۶۸", "content": "ماده ۱۲۶۸- اقرار معلق مؤثر نیست ."}, {"title": "ماده ۱۲۶۹", "content": "ماده ۱۲۶۹- اقرار به امری که عقلا یا عادتا ممکن نباشد و یا بر حسب قانون صحیح نیست اثری ندارد ."}, {"title": "ماده ۱۲۷۰", "content": "ماده ۱۲۷۰- اقرار برای حمل در صورتی مؤثر است که زنده متولد شود ."}, {"title": "ماده ۱۲۷۱", "content": "ماده ۱۲۷۱- مقرله اگر به کلی مجهول باشد اقرار اثری ندارد و اگر فی الجمله معلوم باشد مثل اقرار برای یکی از دو نفر معین صحیح\nاست."}, {"title": "ماده ۱۲۷۲", "content": "ماده ۱۲۷۲- در صحت اقرار تصدیق مقرله شرط نیست لیکن اگر مفاد اقرار را تکذیب کند اقرار مزبور در حق او اثری نخواهد داشت ."}, {"title": "ماده ۱۲۷۳", "content": "ماده ۱۲۷۳- اقرار به نسبت در صورتی صحیح است که اولا تحقق نسب بر حسب عادت و قانون ممکن باشد ثانیا کسی که به نسب او\nاقرار شده تصدیق کند مگر در مورد صغیری که اقرار بر فرزندی او شده به شرط آ نکه منازعی در پیش نباشد ."}, {"title": "ماده ۱۲۷۴", "content": "ماده ۱۲۷۴- اختلاف مقر و مقرله در سبب اقرار مانع صحت اقرار نیست .\nباب دوم - در آثار اقرار"}, {"title": "ماده ۱۲۷۵", "content": "ماده ۱۲۷۵- هر کس اقرار به حقی برای غیر کند ملزم به اقرار خود خواهد بود ."}, {"title": "ماده ۱۲۷۶", "content": "ماده ۱۲۷۶- اگر کذب اقرار نزد حاکم ثابت شود آن اقرار اثری نخواهد داشت ."}, {"title": "ماده ۱۲۷۷", "content": "ماده ۱۲۷۷- انکار بعد از اقرار مسموع نیست لیکن اگر مقر ادعا کند که اقرار او فاسد یا مبنی بر اشتباه یا غلط بوده شنیده می شود و\nهمچنین است در صورتی که برای اقرار خود عذری ذکر کند که قابل قبول باشد مثل اینکه بگوید اقرار به گرفتن وجه در مقابل سند یا\nحواله بوده که وصول نشده لیکن دعاوی مذکوره مادامی که اثبات نشده مضر به اقرار نیست ."}, {"title": "ماده ۱۲۷۸", "content": "ماده ۱۲۷۸- اقرار هر کس فقط نسبت به خود آن شخص و قائم مقام او نافذ است و در حق دیگری نافذ نیست مگر در موردی که قانون\nآن را ملزم قرار داده باشد ."}, {"title": "ماده ۱۲۷۹", "content": "ماده ۱۲۷۹- اقرار شفاهی واقع در خارج از محکمه را در صورتی می توان به شهادت شهود اثبات کرد که اصل دعوی به شهادت شهود\nقابلاثبات باشد و یا ادله و قرائنی بر وقوع اقرار موجود باشد ."}, {"title": "ماده ۱۲۸۰", "content": "ماده ۱۲۸۰- اقرار کتبی در حکم اقرار شفاهی است ."}, {"title": "ماده ۱۲۸۱", "content": "ماده ۱۲۸۱- قید دین در دفتر تجار به منزله اقرار کتبی است ."}, {"title": "ماده ۱۲۸۲", "content": "ماده ۱۲۸۲- اگر موضوع اقرار در محکمه مقید به قید یا وصفی باشد مقرله نمی تواند آن را تجزیه کرده از قسمتی از آ ن که به نفع او است\nبر ضرر مقر استفاده نماید و از جزء دیگران صرف نظر کند.\nقانون مدنی"}, {"title": "ماده ۱۲۸۳", "content": "ماده ۱۲۸۳- اگر اقرار دارای دو جزء مختلف اثر باشد که ارتباط تامی با یکدیگر داشته باشند مثل اینکه مدعی علیه اقرار به اخذ وجه از\nمدعی نموده و مدعی رد شود مطابق ماده ۱۱۳۴ اقدام خواهد شد.\nکتاب دوم - در اسناد"}, {"title": "ماده ۱۲۸۴", "content": "ماده ۱۲۸۴- سند عبارت است از هر نوشته که در مقام دعوی یا دفاع قابل استناد باشد ."}, {"title": "ماده ۱۲۸۵", "content": "ماده ۱۲۸۵- شهادت نامه سند محسوب نمیشود و فقط اعتبار شهادت را خواهد داشت ."}, {"title": "ماده ۱۲۸۶", "content": "ماده ۱۲۸۶- سند بر دو نوع است. رسمی و عادی"}, {"title": "ماده ۱۲۸۷", "content": "ماده ۱۲۸۷- اسنادی که در اداره ثبت اسناد و املاک و یا دفتر اسناد رسمی یا در نزد سایر مامورین رسمی در حدود صلاحیت آن ها و بر\nطبق مقررات قانونی تنظیم شده باشند رسمی است ."}, {"title": "ماده ۱۲۸۸", "content": "ماده ۱۲۸۸- مفاد سند در صورتی معتبر است که مخالف قوانین نباشد ."}, {"title": "ماده ۱۲۸۹", "content": "ماده ۱۲۸۹- غیر از اسناد مذکوره در ماده ۱۲۸۷ سایر اسناد عادی است."}, {"title": "ماده ۱۲۹۰", "content": "ماده ۱۲۹۰- اسناد رسمی درباره طرفین و وراث و قائم مقام آنان معتبر است و اعتبار آنها نسبت به اشخاص ثالث در صورتی است\nکه قانون تصریح کرده باشد ."}, {"title": "ماده ۱۲۹۱", "content": "ماده ۱۲۹۱- اسناد عادی در دو مورد اعتبار اسناد رسمی را داشته دربارۀ طرفین و وراث و قائم مقام آنان معتبر است.\n۱- اگر طرفی که سند بر علیه او اقامه شده است صدور آن را از منتسب الیه تصدیق نماید.\n۲- هر گاه در محکمه ثابت شود که سند مزبور را طرفی که آن را تکذیب یا تردید کرده فی الواقع امضا یا مهر کرده است ."}, {"title": "ماده ۱۲۹۲", "content": "ماده ۱۲۹۲- در مقابل اسناد رسمی یا اسنادی که اعتبار اسناد رسمی را دارد انکار و تردید مسموع نیست و طرف می تواند ادعای جعلیت\nبه اسناد مزبور کند یا ثابت نماید که اسناد مزبور به جهتی از جهات قانونی از اعتبار افتاده است."}, {"title": "ماده ۱۲۹۳", "content": "ماده ۱۲۹۳- هر گاه سند به وسیله یکی از مامورین رسمی تنظیم اسناد تهیه شده لیکن مامور صلاحیت تنظیم آن سند را نداشته و یا\nرعایت ترتیبات مقرره قانونی را در تنظیم سند نکرده باشد سند مزبور در صورتی که دارای امضا یا مهر طرف باشد عادی است ."}, {"title": "ماده ۱۲۹۴", "content": "ماده ۱۲۹۴- عدم رعایت مقررات راجع به حق تمبر که به اسناد تعلق می گیرد سند را از رسمیت خارج نمی کند."}, {"title": "ماده ۱۲۹۵", "content": "ماده ۱۲۹۵- محاکم ایران به اسناد تنظیم شده در کشورهای خارجه همان اعتباری را خواهند داد که آن اسناد مطابق قوانین کشوری که\nدر آنجا تنظیم شده دارا می باشد مشروط بر اینکه:\nاولا- اسناد مزبوره به علتی از علل قانونی از اعتبار نیفتاده باشد.\nثانیاً - مفاد آن ها مخالف با قوانین مربوطه به نظم عمومی یا اخلاق حسنه ایران نباشد .\nثالثاً - کشوری که اسناد در آنجا تنظیم شده به موجب قوانین خود یا عهود اسناد تنظیم شده در ایران را نیز معتبر بشناسد .\nرابعاً - نماینده سیاسی یا قنسولی ایران در کشوری که سند در آنجا تنظیم شده یا نماینده سیاسی و یا قنسولی کشور مزبور در ایران\nتصدیق کرده باشد که سند موافق قوانین محل تنظیم یافته است ."}, {"title": "ماده ۱۲۹۶", "content": "ماده ۱۲۹۶- هر گاه موافقت اسناد مزبور در ماده قبل با قوانین محل تنظیم خود به توسط نماینده سیاسی یا قنسولی خارجه در ایران\nتصدیق شده باشد قبول شدن سند در محاکم ایران متوقف بر این است که وزارت امور خارجه و یا در خارج تهران حکام ایالات و ولایات\nامضای نماینده خارجه را تصدیق کرده باشند."}, {"title": "ماده ۱۲۹۷", "content": "ماده ۱۲۹۷- دفاتر تجارتی در موارد دعوای تاجری بر تاجر دیگر در صورتی که دعوی از محاسبات و مطالبات تجارتی حاصل شده باشد\nدلیل محسوب می شود مشروط بر اینکه دفاتر مزبوره مطابق قانون تجارت تنظیم شده باشند .\nقانون مدنی"}, {"title": "ماده ۱۲۹۸", "content": "ماده ۱۲۹۸- دفتر تاجر در مقابل غیر تاجر سندیت ندارد فقط ممکن است جزء قرائن و امارات قبول شود لیکن اگر کسی به دفتر تاجر\nاستناد کرد نمی تواند تفکیک کرده آنچه را که بر نفع او است قبول و آنچه که بر ضرر او است رد کند مگر آ نکه بیاعتباری آنچه را که بر\nضرر اوست ثابت کند."}, {"title": "ماده ۱۲۹۹", "content": "ماده ۱۲۹۹- دفتر تجارتی در موارد مفصله ذیل دلیل محسوب نمی شود:\n۱- در صورتی که مدلل شود اوراق جدیدی به دفتر داخل کرده اند یا دفتر تراشیدگی دارد .\n۲- وقتیکه در دفتر بیترتیبی و اغتشاشی کشف شود که بر نفع صاحب دفتر باشد .\n۳- وقتیکه بیاعتباری دفتر سابقا به جهتی از جهات در محکمه مدلل شده باشد."}, {"title": "ماده ۱۳۰۰", "content": "ماده ۱۳۰۰- در مواردی که دفتر تجارتی بر نفع صاحب آن دلیل نیست بر ضرر او سندیت دارد ."}, {"title": "ماده ۱۳۰۱", "content": "ماده ۱۳۰۱- امضایی که در روی نوشته یا سندی باشد بر ضرر امضاکننده دلیل است."}, {"title": "ماده ۱۳۰۲", "content": "ماده ۱۳۰۲- هر گاه در ذیل یا حاشیه یا ظهر سندی که در دست ابراز کننده بوده مندرجاتی باشد که حکایت از بی اعتباری یا از اعتبار\nافتادن تمام یا قسمتی از مفاد سند نماید مندرجات مزبوره معتبر محسوبست اگر چه تاریخ و امضا نداشته و یا به وسیله خط کشیدن\nو یا نحو دیگر باطل شده باشد."}, {"title": "ماده ۱۳۰۳", "content": "ماده ۱۳۰۳- در صورتی که بطلان مندرجات مذکوره در ماده قبل ممضی به امضای طرف بوده و یا طرف بطلان آن را قبول کند و یا آ نکه\nبطلان آن در محکمه ثابت شود مندرجات مزبوره بلااثر خواهد بود ."}, {"title": "ماده ۱۳۰۴", "content": "ماده ۱۳۰۴- هر گاه امضای تعهدی در خود تعهدنامه نشده و در نوشته علیحده شده باشد آن تعهدنامه بر علیه امضاکننده دلیل است در\nصورتی که در نوشته مصرح باشد که به کدام تعهد یا معامله مربوط است ."}, {"title": "ماده ۱۳۰۵", "content": "ماده ۱۳۰۵- در اسناد رسمی تاریخ تنظیم معتبر است حتی بر علیه اشخاص ثالث ولی در اسناد عادی تاریخ فقط درباره اشخاصی که\nشرکت در تنظیم آن ها داشته و ورثه آنان و کسی که به نفع او وصیت شده معتبر است .\nکتاب سوم - در شهادت\nباب اول - در موارد شهادت\nماده ۱۳۰۶تا ۱۳۰۸- ]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۱۴/۸/۱۳۷۰ نسخ صریح شده اند.["}, {"title": "ماده ۱۳۰۹", "content": "ماده ۱۳۰۹- در مقابل سند رسمی یا سندی که اعتبار آن در محکمه محرز شده دعوی که مخالف با مفاد یا مندرجات آن باشد به شهادت\nاثبات نمی گردد .\nمواد ۱۳۱۰ و ۱۳۱۱- ]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۱۴/۸/۱۳۷۰ نسخ صریح شده اند.["}, {"title": "ماده ۱۳۱۲", "content": "ماده ۱۳۱۲- احکام مذکور در فوق در موارد ذیل جاری نخواهد بود :\n۱- در مواردی که اقامه شاهد برای تقویت یا تکمیل دلیل باشد مثل این که دلیلی بر اصل دعوت موجود بوده ولی مقدار یا مبلغ مجهول\nباشد و شهادت بر تعیین مقدار یا مبلغ اقامه گردد .\n۲- در مواردی که به واسطه حادثه گرفتن سند ممکن نیست از قبیل حریق و سیل و زلزله و غرق کشتی که کسی مال خود را به دیگری\nسپرده و تحصیل سند برای صاحب مال در آن موقع ممکن نیست .\n۳- نسبت به کلیه تعهداتی که عادتاً تحصیل سند معمول نمی باشد مثل اموالی که اشخاص در مهمانخانه ها و قهوه خانه ها و کاروانسراها\nو نمایشگاهها می سپارند و مثل حق الزحمه اطبا و قابله همچنین انجام تعهداتی که برای آن عادتا تحصیل سند معمول نیست مثل\nکارهایی که به مقاطعه و نحو آن تعهد شده اگر چه اصل تعهد به موجب سند باشد\nقانون مدنی\n۴- در صورتی که سند به واسطه حوادث غیرمنتظره مفقود یا تلف شده باشد .\n۵- در موارد ضمان قهری و امور دیگری که داخل در عقود و ایقاعات نباشد ."}, {"title": "ماده ۱۳۱۳ (اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۳۱۳ (اصلاحی ۱۴/۸/۱۳۷۰) - در شاهد بلوغ، عقل، عدالت، ایمان و طهارت مولد شرط است .\nتبصره ۱ (الحاقی ۱۴/۸/۱۳۷۰)- عدالت شاهد باید با یکی از طرق شرعی برای دادگاه احراز شود .\nتبصره ۲ (الحاقی ۱۴/۸/۱۳۷۰)- شهادت کسی که نفع شخصی بهصورت عین یا منفعت یا حق رد دعوی داشته باشد و نیز شهادت کسانی\nکه تکدی را شغل خود قرار دهند پذیرفته نمی شود."}, {"title": "ماده ۱۳۱۳ مکرر", "content": "ماده ۱۳۱۳ مکرر- ]به موجب قانون اصلاح موادی از قانون مدنی مصوب ۱۴/۸/۱۳۷۰ نسخ صریح شده است.["}, {"title": "ماده ۱۳۱۴", "content": "ماده ۱۳۱۴- شهادت اطفالی را که به سن ۱۵ سال تمام نرسیده اند فقط ممکن است برای مزید اطلاع استعمال نمود مگر در مواردی\nکه قانون شهادت این قبیل اطفال را معتبر شناخته باشد .\nباب دوم - در شرایط شهادت"}, {"title": "ماده ۱۳۱۵", "content": "ماده ۱۳۱۵- شهادت باید از روی قطع و یقین باشد نه به طور شک و تردید ."}, {"title": "ماده ۱۳۱۶", "content": "ماده ۱۳۱۶- شهادت باید مطابق با دعوی باشد ولی اگر در لفظ مخالف و در معنی موافق یا کمتر از ادعا باشد ضرری ندارد ."}, {"title": "ماده ۱۳۱۷", "content": "ماده ۱۳۱۷- شهادت شهود باید مفاداً متحد باشد بنابراین اگر شهود به اختلاف شهادت دهند قابل اثر نخواهد بود مگر در صورتی که از\nمفاد اظهارات آن ها قدر متیقنی به دست آید."}, {"title": "ماده ۱۳۱۸", "content": "ماده ۱۳۱۸- اختلاف شهود در خصوصیات امر اگر موجب اختلاف در موضوع شهادت نباشد اشکالی ندارد ."}, {"title": "ماده ۱۳۱۹", "content": "ماده ۱۳۱۹- در صورتی که شاهد از شهادت خود رجوع کند یا معلوم شود برخلاف واقع شهادت داده است به شهادت او ترتیب اثر داده\nنمیشود."}, {"title": "ماده ۱۳۲۰", "content": "ماده ۱۳۲۰- شهادت بر شهادت در صورتی مسموع است که شاهد اصل وفات یافته یا به واسطه مانع دیگری مثل بیماری و سفر و حبس\nو غیره نتواند حاضر شود .\nکتاب چهارم - در امارات"}, {"title": "ماده ۱۳۲۱", "content": "ماده ۱۳۲۱- اماره عبارت از اوضاع و احوالی است که به حکم قانون یا در نظر قاضی دلیل بر امری شناخته می شود."}, {"title": "ماده ۱۳۲۲", "content": "ماده ۱۳۲۲- امارات قانونی اماراتی است که قانون آن را دلیل بر امری قرار داده مثل امارات مذکوره در این قانون از قبیل مواد ۳۵ و ۱۰۹\nو ۱۱۰۰ و ۱۱۵۸ و ۱۱۵۹ و غیر آنها و سایر امارات مصرحه در قوانین دیگر ."}, {"title": "ماده ۱۳۲۳", "content": "ماده ۱۳۲۳- امارات قانونی در کلیه دعاوی اگر چه از دعاوی باشد که به شهادت شهود قابل اثبات نیست معتبر است مگر آ نکه دلیل\nبرخلاف آن موجود باشد ."}, {"title": "ماده ۱۳۲۴", "content": "ماده ۱۳۲۴- اماراتی که به نظر قاضی واگذار شده عبارت است از اوضاع و احوالی در خصوص مورد و در صورتی قابل استناد است که\nدعوی به شهادت شهود قابل اثبات باشد یا ادله دیگری را تکمیل کند .\nکتاب پنجم - در قسم"}, {"title": "ماده ۱۳۲۵", "content": "ماده ۱۳۲۵- در دعاوی که به شهادت شهود قابل اثبات است مدعی می تواند حکم به دعوی خود را که مورد انکار مدعی علیه است منوط\nبه قسم او نماید.\nقانون مدنی"}, {"title": "ماده ۱۳۲۶", "content": "ماده ۱۳۲۶- در موارد ماده فوق مدعی علیه نیز میتواند در صورتی که مدعی سقوط دین یا تعهد یا نحو آن باشد حکم به دعوی را منوط\nبه قسم مدعی کند."}, {"title": "ماده ۱۳۲۷", "content": "ماده ۱۳۲۷- مدعی یا مدعی علیه در مورد ۲ ماده قبل در صورتی می تواند تقاضای قسم از طرف دیگر نماید که عمل یا موضوع دعوی\nمنتسب به شخص آنطرف باشد بنابراین در دعاوی بر صغیر و مجنون نمی توان قسم را بر ولی یا وصی یا قیم متوجه کرد مگر نسبت به\nاعمال صادره از شخص آن ها آن هم مادامی که به ولایت یا وصایت یا قیمومت باقی هستند و همچنین است در کلیه مواردی که امر\nمنتسب به یک طرف باشد ."}, {"title": "ماده ۱۳۲۸(اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۳۲۸(اصلاحی ۱۴/۸/۱۳۷۰) - کسی که قسم متوجه او شده است در صورتی که بطلان دعوی طرف را اثبات نکند یا باید قسم یاد\nنماید یا قسم را به طرف دیگر رد کند و اگر نه قسم یاد کند و نه آن را به طرف دیگر رد نماید با سوگند مدعی، به حکم حاکم مدعی علیه\nنسبت به ادعایی که تقاضای قسم برای آن داده شده است، محکوم می گردد ."}, {"title": "ماده ۱۳۲۸مکرر (الحاقی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۳۲۸مکرر (الحاقی ۱۴/۸/۱۳۷۰)- دادگاه می تواند نظر به اهمیت موضوع دعوی و شخصیت طرفین و اوضاع و احوال مؤثر مقرر\nدارد که قسم با تشریفات خاص مذهبی یاد شود یا آن را به نحو دیگری تغلیظ نماید .\nتبصره - چنانچه کسی که قسم متوجه به او شده تشریفات تغلیظ را قبول نکند و قسم بخورد ناکل محسوب نمی شود."}, {"title": "ماده ۱۳۲۹", "content": "ماده ۱۳۲۹- قسم به کسی متوجه می گردد که اگر اقرار کند اقرارش نافذ باشد ."}, {"title": "ماده ۱۳۳۰", "content": "ماده ۱۳۳۰- تقاضای قسم قابل توکیل است و وکیل در دعوی می تواند طرف را قسم دهد لیکن قسم یاد کردن قابل توکیل نیست و\nوکیل نمی تواند به جای موکل قسم یاد کند ."}, {"title": "ماده ۱۳۳۱", "content": "ماده ۱۳۳۱- قسم قاطع دعوی است و هیچگونه اظهاری که منافی با قسم باشد از طرف پذیرفته نخواهد شد ."}, {"title": "ماده ۱۳۳۲", "content": "ماده ۱۳۳۲- قسم فقط نسبت به اشخاصی که طرف دعوی بوده اند و قائممقام آنها مؤثر است."}, {"title": "ماده ۱۳۳۳", "content": "ماده ۱۳۳۳- در دعوی بر متوفی در صورتی که اصل حق ثابت شده و بقای آن در نظر حاکم ثابت نباشد حاکم می تواند از مدعی بخواهد\nکه بر بقای حق خود قسم یاد کند. در این مورد کسی که از او مطالبه قسم شده است نمی تواند قسم را به مدعی علیه رد کند. حکم این\nماده در موردی که مدرک دعوی سند رسمی است جاری نخواهد بود ."}, {"title": "ماده ۱۳۳۴", "content": "ماده ۱۳۳۴- در مورد ماده ۱۲۸۳ کسی که اقرار کرده است می تواند نسبت به انچه که مورد ادعای اوست از طرف مقابل تقاضای قسم\nکند مگر اینکه مدرک دعوی مدعی سند رسمی یا سندی باشد که اعتبار آن در محکمه محرز شده است ."}, {"title": "ماده ۱۳۳۵(اصلاحی ۱۴/۸/۱۳۷۰)", "content": "ماده ۱۳۳۵(اصلاحی ۱۴/۸/۱۳۷۰) - توسل به قسم وقتی ممکن است که دعوای مدنی نزد حاکم به موجب اقرار یا شهادت یا علم قاضی\nبر مبنای اسناد یا امارات ثابت نشده باشد، در این صورت مدعی می تواند حکم به دعوی خود را که مورد انکار مدعی علیه است، منوط به\nقسم او نماید."}];
const list=document.getElementById('list'),q=document.getElementById('q'),count=document.getElementById('count'),empty=document.getElementById('empty');
document.getElementById('total').textContent=articlesData.length;
const faDigits='۰۱۲۳۴۵۶۷۸۹';
function normalize(s){return s.toLowerCase().replace(/[۰-۹]/g,d=>String(faDigits.indexOf(d))).replace(/[يى]/g,'ی').replace(/ك/g,'ک')}
function appendHighlighted(el,text,term){if(!term){el.textContent=text;return}const hay=normalize(text),needle=normalize(term);let pos=0,at;while((at=hay.indexOf(needle,pos))!==-1){el.append(document.createTextNode(text.slice(pos,at)));const mark=document.createElement('mark');mark.className='hit';mark.textContent=text.slice(at,at+needle.length);el.append(mark);pos=at+needle.length;if(!needle.length)break}el.append(document.createTextNode(text.slice(pos)))}
function render(items,term=''){list.replaceChildren();empty.style.display=items.length?'none':'block';count.textContent=term?(items.length+' ماده یافت شد'):'';for(const art of items){const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='cardhead';const title=document.createElement('span');title.className='title';appendHighlighted(title,art.title,term);const btn=document.createElement('button');btn.className='copy';btn.type='button';btn.textContent='📋 کپی ماده';btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(art.content+'\n\nمنبع: قانون مدنی');btn.textContent='✅ کپی شد';setTimeout(()=>btn.textContent='📋 کپی ماده',1600)}catch(e){btn.textContent='کپی ناموفق'}});head.append(title,btn);const body=document.createElement('div');body.className='body';appendHighlighted(body,art.content,term);card.append(head,body);list.append(card)}}
render(articlesData);let timer; q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{const term=q.value.trim(),needle=normalize(term);const found=term?articlesData.filter(a=>normalize(a.title+' '+a.content).includes(needle)):articlesData;render(found,term)},180)});
</script></body></html>
