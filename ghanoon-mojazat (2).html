د در حکم جرم واقع شده در جمهوری اسالمی ایران .است"},{"n":5,"t":"هر شخص ایرانی یا غیرایرانی که در خارج از قلمرو حاکمیت ایران مرتکب یکی از جرایم زیر یا جرایم مقرر در قوانین خاص گردد، طبق قوانین جمهوری اسالمی ایران محاکمه و مجازات می شود و هرگاه رسیدگی به این جرایم در خارج از ایران به صدور حکم محکومیت و اجرای آن منتهی شود، دادگاه ایران در تعیین مجازات های تعز یری، میزان محکومیت اجراء شده را محاسبه :می کند الف- اقدام علیه نظام، امنیت داخلی یا خارجی، تمامیت ارضی یا استقالل جمهوری اسالمی ایران ب- جعل مهر، امضاء، حکم، فرمان یا دست خط مقام رهبری یا استفاده از آن پ- جعل مهر، امضاء، حکم، فرمان یا دست خط رسمی رییس جمهور، رییس قوه قضاییه، رییس و نمایندگان مجلس شورای اسالمی، رییس مجلس خبرگان، رییس دیوان عالی کشور، دادستان کل کشور، اعضای شورای نگهبان، رییس و اعضای مجمع .تشخیص مصلحت نظام، وزرا یا معاونان رییس جمهور یا استفاده از آنها قانون مجازات اسالمی مصوب92 ت- جعل آراء مراجع قضایی یا اجرائیه ه .ای صادره از این مراجع یا سایر مراجع قانونی و یا استفاده از آنها ث- جعل اسکناس رایج یا اسناد تعهدآور بانکی ایران و همچنین جعل اسناد خزانه و اوراق مشارکت صادر شده یا تضمین شده از .طرف دولت یا تهیه یا ترویج سکه قلب در مورد مسکوکات رایج داخل"},{"n":6,"t":"به جرایم مستخدمان دولت اعم از ایرانی یا غیر ایرانی که در رابطه با شغل و وظیفه خود در خارج از قلمرو حاکمیت ایران مرتکب شده اند و به جرایم مأموران سیاسی و کنسولی و دیگر وابستگان دولت ایران که از مصونیت سیاسی برخوردارند طبق قوانین .جمهوری اسالمی ایران رسیدگی می شود ما ده7 - عالوه بر موارد مذکور در مواد فوق هر یک از اتباع ایران در خارج از کشور مرتکب جرمی شود، در صورتی که در ایران یافت و یا به ایران اعاده گردد، طبق قوانین جمهوری اسالمی ایران محاکمه و مجازات :می شود مشروط بر این که الف- رفتار ارتکابی به موجب قانون جمهوری ا .سالمی ایران جرم باشد ب- در صورتی که جرم ارتکابی از جرایم موجب تعزیر باشد، متهم در محل وقوع جرم محاکمه و تبرئه نشده یا در صورت ،محکومیت مجازات .کالً یا بعضاً درباره او اجراء نشده باشد پ- طبق قوانین ایران موجبی برای منع یا موقوفی تعقیب یا موقوفی اجرای مجازا ت .یا سقوط آن نباشد"},{"n":8,"t":"هرگاه شخص غیرایرانی در خارج از ایران علیه شخصی ایرانی یا علیه کشور ایران مرتکب جرمی به جز جرایم مذکور در ،مواد قبل شود و در ایران یافت و یا به ایران اعاده گردد، طبق قوانین جزایی جمهوری اسالمی ایران به جرم او رسیدگی می شود مشروط :بر این که الف- ،متهم در جرایم موجب تعزیر در محل وقوع جرم، محاکمه و تبرئه نشده یا در صورت محکومیت مجازات کالً یا بعضاً درباره .او اجراء نشده باشد ب- .رفتار ارتکابی در جرایم موجب تعزیر به موجب قانون جمهوری اسالمی ایران و قانون محل وقوع، جرم باشد"},{"n":9,"t":"مرتکب جرایمی که به موجب قانون خاص یا عهدنامه ها و مقررات بین المللی در هر کشوری یافت شود در همان کشور محاکمه می شود، اگر در ایران یافت شود طبق قوانین جزایی جمهوری اسالمی ایران محاکمه و مجازات .می گردد قانون مجازات اسالمی مصوب92 فصل سوم- قلمرو اجرای قوانین جزایی در زمان"},{"n":10,"t":"در م قررات و نظامات دولتی مجازات و اقدام تأمینی و تربیتی باید به موجب قانونی باشد که قبل از وقوع جرم مقرر شده است و مرتکب هیچ رفتاری اعم از فعل یا ترک فعل را نمی توان به موجب قانون مؤخر به مجازات یا اقدامات تأمینی و تربیتی محکوم کرد لکن چنانچه پس از وقوع جرم، قانونی مبنی بر تخفیف یا عدم اجرای مجازات یا اقدام تأمینی و تربیتی یا از جهاتی مساعدتر به ،حال مرتکب وضع شود، نسبت به جرایم سابق بر وضع آن قانون تا صدور حکم قطعی، مؤثر است. هرگاه به موجب قانون سابق حکم قطعی الزم االجراء، صادر شده باشد به ترتیب زیر عمل :می شود الف - اگر رفتاری که در گذشته جرم بوده است به موجب قانون الحق جرم شناخته نشود، حکم قطعی اجراء نمی شود و اگر در جریان اجراء باشد اجرای آن موقوف می شود. در این موارد و همچنین در موردی که حکم قبالً اجراء شده است هیچ گونه اثر کیفری .بر آن مترتب نیست ب- گر ا مجازات جرمی به موجب قانون الحق، تخفیف یابد، قاضی اجرای احکام موظف است قبل از شروع به اجراء یا در حین ،اجراء از دادگاه صادرکننده حکم قطعی، اصالح آن را طبق قانون جدید تقاضا کند. محکوم نیز می تواند از دادگاه صادرکننده حکم تخفیف مجازات را تقاضا نماید. دادگا ،ه صادرکننده حکم با لحاظ قانون الحق مجازات قبلی را تخفیف می دهد. مقررات این بند در مورد اقدام تأمینی و تربیتی که در مورد اطفال بزهکار اجراء می شود نیز جاری است. در این صورت ولی یا سرپرست وی نیز می .تواند تخفیف اقدام تأمینی و تربیتی را تقاضا نماید تبصره- مقررات فوق در مورد قوانینی که برای مدت معین و با موارد خاص وضع شده است، مگر به تصریح قانون الحق، اعمال .نمی شود"},{"n":11,"t":"قوانین زیر نسبت به جرایم سابق بر وضع قانون، فوراً اجراء می شود الف- قوانین مربوط به تشکیالت قضایی و صالحیت ب- قوانین مربوط به ا دله اثبات دعوی تا پیش از اجرای حکم پ- قوانین مربوط به شیوه دادرسی ت- قوانین مربوط به مرور زمان قانون مجازات اسالمی مصوب92 تبصره- در صورتی که در مورد بند (ب) حکم قطعی صادر شده باشد، پرونده برای بررسی به دادگاه صادرکننده حکم قطعی ارسال .می شود فصل چهارم- ،قانونی بودن جرایم مجازات ها و دادرسی کیفری"},{"n":12,"t":"حکم به مجازات یا اقدام تأمینی و تربیتی و اجرای آنها باید از طریق دادگاه صالح، به موجب قانون و با رعایت شرایط و .کیفیات مقرر در آن باشد"},{"n":13,"t":"حکم به مجازات یا اقدام تأمینی و تربیتی و اجرای آنها حسب مورد نباید از میزان و کیفیتی که در قانون یا حکم دادگاه مشخص شده است تجاوز کند و هرگونه صدمه و خسارتی که از این جهت حاصل شود، در صورتی که از روی عمد یا تقصیر باشد .حسب مورد موجب مسؤولیت کیفری و مدنی است و در غیر این صورت، خسارت از بیت المال جبران می شود بخش دوم - مجازات ها فصل اول- مجازات های اصلی"},{"n":14,"t":"مجازات :های مقرر در این قانون چهار قسم است • الف- حد • ب- قصاص • پ- دیه • ت- تعزیر تبصره- چنانچه رابطه علیت بین رفتار شخص حقوقی و خسارت وارد شده احراز شود دیه و خسارت، قابل مطالبه خواهد بود اعمال مجازات تعزیری بر ( اشخاص حقوقی مطابق"},{"n":20,"t":".) خواهد بود"},{"n":15,"t":"حد .مجازاتی است که موجب، نوع، میزان و کیفیت اجرای آن در شرع مقدس، تعیین شده است"},{"n":16,"t":"قصاص مجازات اصلی جنایات عمدی بر نفس، اعضاء و منافع است که به شرح مندرج در کتاب سوم این قانون اعمال .می شود"},{"n":17,"t":"دیه اعم از مقدر و غیرمقدر، مالی است که در شرع مقدس برای ایراد جنایت غیرعمدی بر نفس، اعضاء و منافع و یا .جنایت عمدی در مواردی که به هر جهتی قصاص ندارد به موجب قانون مقرر می شود قانون مجازات اسالمی مصوب92"},{"n":18,"t":"تعزیر مجازاتی است که مشمول عنوان حد، قصاص یا دیه نیست و به موجب قانون د ر موارد ارتکاب محرمات شرعـی یا نقض مقررات حکومتی تعیین و اعمال می گردد. نوع، مقدار، کیفیت اجراء و مقررات مربوط به تخفیف، تعلیق، سقوط و سایر احکام تعزیر به موجب قانون تعیین می شود. دادگاه در صدور حکم تعزیری، با رعایت مقررات قانونی، موارد زیر را مورد توجه قر :ار می دهد الف- انگیزه مرتکب و وضعیت ذهنی و روانی وی حین ارتکاب جرم ب- شیوه ارتکاب جرم، گستره نقض وظیفه و نتایج زیان بار آن پ- اقدامات مرتکب پس از ارتکاب جرم ت- سوابق و وضعیت فردی، خانوادگی و اجتماعی مرتکب و تأثیر تعزیر بر وی تبصره - چنانچه دادگاه در حکم صا دره مجازات حبس را بیش از حداقل مجازات مقرر در قانون تعیین کند، باید مبتنی بر بندهای مقرر در این ماده و یا سایر جهات قانونی، علت صدور حکم به بیش از حداقل مجازات مقرر قانونی را ذکر کند. عدم رعایت مفاد این تبصره موجب مجازات .انتظامی درجه چهار می باشد"},{"n":19,"t":"مجازات :های تعزیری به هشت درجه تقسیم می شود درجه1 ـ حبس بیش از بیست و پنج سال ( ـ جزای نقدی بیش از یک میلیارد۱.۰۰۰.۰۰۰.۰۰۰ ) ریال جزای نقدی مندرج در این بند به موجب مصوبه مورخ25 / 12 / 1399 هیات وزیران به دو میلیارد و هشتصد میلیون ریال ( ۲.۸۰۰.۰۰۰.۰۰۰) تعدی ل شد ـ مصادره کل اموال ـ انحالل شخص حقوقی درجه2 قانون مجازات اسالمی مصوب92 ـ حبس بیش از پانزده تا بیست و پنج سال ( ـ جزای نقدی بیش از پانصد و پنجاه میلیون۵۵۰.۰۰۰.۰۰۰ ) ( ریال تا یک میلیارد۱.۰۰۰.۰۰۰.۰۰۰ ) ریال جزای نقدی مندرج در این بند به موجب مصوبه مورخ25 / 12 / 1399 هیات وزیران به یک میلیارد و پانصد میلیون ریال ( ۱.۵۰۰.۰۰۰.۰۰۰ ( ) تا دو میلیارد و هشتصد میلیون ریال۲.۸۰۰.۰۰۰.۰۰۰) تعدیل شد درجه3 ـ حبس بیش از ده تا پانزده سال ( ـ جزای نقدی بیش از سیصد و شصت میلیون۳۶۰.۰۰۰.۰۰۰ )ریال تا پانصد وپنجاه میلیو( ن۵۵۰.۰۰۰.۰۰۰ ) ریال جزای نقدی مندرج در این بند به موجب مصوبه مورخ25 / 12 / 1399 ( هیات وزیران به یک میلیارد ریال۱.۰۰۰.۰۰۰.۰۰۰ ) تا یک ( و نیم میلیارد ریال۱.۵۰۰.۰۰۰.۰۰۰ ) تعدیل شد درجه4 ـ حبس بیش از پنج تا ده سال (ـ جزای نقدی بیش از یکصد و هشتاد میلیون۱۸۰.۰۰۰.۰۰۰ ) ( ریال تا سیصد و شصت میلیون۳۶۰.۰۰۰.۰۰۰ ) ریال جزای نقدی مندرج در این بند به موجب مصوبه مورخ25 / 12 / 1399 ( هیات وزیران به پانصد میلیون ریال۵۰۰.۰۰۰.۰۰۰ ) تا یک ( میلیارد ریال۱.۰۰۰.۰۰۰.۰۰۰ ) تعدیل شد ـ انفصال دائم از خدمات دولتی و عمومی درجه5 ـ حبس بیش از دو تا پنج سال ( ـ جزای نقدی بیش از هشتاد میلیون۸۰.۰۰۰.۰۰۰ ) ( ریال تا یکصد و هشتاد میلیون۱۸۰.۰۰۰.۰۰۰ ) ریال قانون مجازات اسالمی مصوب92 جزای نقدی مندرج در این بند به موجب مصوبه مورخ25 / 12 / 1399 هیات وزیران به دویست و چهل میلیون ریال ( ۲۴۰.۰۰۰.۰۰۰ () تا پانصد میلیون ریال۵۰۰.۰۰۰.۰۰۰ ) ریال تعدیل شد ـ محرومیت از حقوق اجتماعی بیش از پنج تا پانزده سال ـ ممنوعیت دایم از یک یا چند فعالیت شغلی یا اجتماعی برای اشخاص حقوقی ـ ممنوعیت دایم از دعوت عمومی برای افزایش سرمایه برای اشخاص حقوقی درجه6 ـ حبس بیش از شش ماه تا دو سال ( ـ جزای نقدی بیش از بیست میلیون۲۰.۰۰۰.۰۰۰ ) ( ریال تا هشتاد میلیون۸۰.۰۰۰.۰۰۰ ) ریال جزای نقدی مندرج در این بند به موجب مصوبه مورخ25 / 12 / 1399 ( هیات وزیران به شصت میلیون ریال۶۰.۰۰۰.۰۰۰ ) تا (دویست و چهل میلیون ریال۲۴۰.۰۰۰.۰۰۰) تعدیل شد ـ شالق از سی و یک تا هفتاد و چهار ضربه و تا نود و نه ضربه در جرایم منافی عفت ـ محرومیت از حقوق اجتماعی بیش از شش ماه تا پنج سال ـ انتشار حکم قطعی در رسانه ها ـ ممنوعیت از یک یا چند فعالیت شغلی یا اجتماعی برای اشخاص حقوقی حداکثر تا مدت پنج سال ـ ممنوعیت از دعوت عمومی برای افزایش سرمایه برای اشخاص حقوقی حداکثر تا مدت پنج سال ـ ممنوعیت از اصدار برخی از اسناد تجاری توسط اشخاص حقوقی حداکثر تا مدت پنج سال درجه7 ـ حبس از نود و یک روز تا شش ماه قانون مجازات اسالمی مصوب92 ـ جزای نقد( ی بیش از ده میلیون۱۰.۰۰۰.۰۰۰ ) ( ریال تا بیست میلیون۲۰.۰۰۰.۰۰۰ ) ریال جزای نقدی مندرج در این بند به موجب مصوبه مورخ25 / 12 / 1399 ( هیات وزیران به سی میلیون ریال۳۰.۰۰۰.۰۰۰ ) تا شصت ( میلیون ریال۶۰.۰۰۰.۰۰۰ ) تعدیل شد ـ شالق از یازده تا سی ضربه ـ محرومیت از حقوق اجتماعی تا شش ماه درجه8 ـ حبس تا سه ماه ( ـ جزای نقدی تا ده میلیون۱۰.۰۰۰.۰۰۰ ) ریال جزای نقدی مندرج در این بند به موجب مصوبه مورخ25 / 12 / 1399 (هیات وزیران به سی میلیون ریال۳۰.۰۰۰.۰۰۰ ) تعدیل شد ـ شالق تا ده ضربه تبصره1- موارد محرومیت از حقوق اجتماعی همان است که در مجازات .های تبعی ذکر شده است تبصره2- مجازاتی که حداقل آن منطبق بر یکی از درجات فوق و حداکثر آن منطبق با درجه باالتر باشد، از درجه باالتر محسوب .می شود تبصره3 - درصورت تعدد مجازات ،ها مجازات شدیدتر و در صورت عدم امکان تشخیص مجازات ،شدیدتر مجازات حبس مالک است. همچنین اگر مجازاتی با هیچ یک از بندهای هشت گانه این ماده مطابقت نداشته باشد مجازات درجه هفت محسوب می .شود تبصره4- مقررات این ماده و تبصره های آن تنها جهت تعیین درجه مجازات است و تأثیری در میزان حداقل و حداکثر مجازات .های مقرر در قوانین جاری ندارد قانون مجازات اسالمی مصوب92 تبصره5- ضبط اشیاء و اموالی که در ارتکاب جرم به کار رفته یا مقصود از آن به کارگیری در ارتکاب جرم بوده است از شمول این ( ماده و بند (ب)"},{"n":215,"t":") این قانون عمل خوا هد شد. در هر مورد که حکم به مصادره اموال .صادر می شود باید هزینه های متعارف زندگی محکوم و افراد تحت تکفل او مستثنی شود تبصره6 - .تمام حبس های ابد غیرحدی مقرر در قانون به حبس درجه یک تبدیل می شود"},{"n":143,"t":") این قانون م سؤول شناخته شود، با توجه به شدت جرم ارتکابی و نتایج زیان بار آن به یک تا دو مورد از موارد زیر محکوم می شود، این امر مانع از مجازات :شخص حقیقی نیست • الف- انحالل شخص حقوقی • ب- مصادره کل اموال • پ- ممنوعیت از یک یا چند فعالیت شغلی یا اجتماعی به طور دائم یا حداکثر برای مدت پنج سال • ت- ممنوعیت از دعوت عمومی برای افزایش سرمایه به طور دائم یا حداکثر برای مدت پنج سال • ث- ممنوعیت از اصدار برخی از اسناد تجاری حداکثر برای مدت پنج سال • ج- جزای نقدی • چ- انتشار حکم محکومیت به وسیله رسانه ها تبصره- مجازات موضوع این ماده، در مورد اشخاص حقوقی دولتی و یا عمومی غیردولتی در مواردی که اعمال حاکمیت می .کنند، اعمال نمی شود"},{"n":21,"t":"میزان جزای نقدی قابل اعمال بر اشخاص حقوقی حداقل دو برابر و حداکثر چهار برابر مبلغی است که در قانون برای ارتکاب همان جرم به وسیله اشخاص حقیقی تعیین می .شود"},{"n":22,"t":"انحالل شخص حقوقی و مصادره اموال آن زمانی اعمال می شود که برای ارتکاب جرم، به وجود آمده یا با انحراف از .هدف مشروع نخستین، فعالیت خود را منحصراً در جهت ارتکاب جرم تغییر داده باشد فصل دوم- مجازات های تکمیلی و تبعی"},{"n":23,"t":"دادگاه می تواند فردی را که به حد، قصاص یا مجازات ،تعزیری محکوم کرده است، با رعایت شرایط مقرر در این قانون متناسب با جرم ارتکابی و خصوصیات وی به یک یا چند مجازات از مجازات های تکمیلی بندها و تبصره های این ماده محکوم .نماید قانون مجازات اسالمی مصوب92 • الف- اقامت اجباری در محل معین • ب- منع از اقامت در محل یا محل های معین • پ- منع از اشتغال به شغل، حرفه یا کار معین • ت- انفصال از خدمات دولتی و عمومی • ث- منع از رانندگی با وسایل نقلیه موتوری و یا تصدی وسایل موتوری • ج- منع از داشتن دسته چک و یا اصدار اسناد تجارتی • چ- منع از حمل سالح • ح- منع از خروج اتباع ایران از ک شور • خ- اخراج بیگانگان از کشور • د- الزام به خدمات عمومی • ذ- منع از عضویت در احزاب، گروه ها و دستجات سیاسی یا اجتماعی • ر- توقیف وسایل ارتکاب جرم یا رسانه یا مؤسسه دخیل در ارتکاب جرم • ز- الزام به یادگیری حرفه، شغل یا کار معین • ژ- الزام به تحصیل • س - انتشار حکم محکوم یت قطعی تبصره1- مدت مجازات .تکمیلی بیش از دو سال نیست مگر در مواردی که قانون به نحو دیگری مقرر نماید تبصره2 - چنانچه مجازات تکمیلی و مجازات اصلی از یک نوع باشد، فقط مجازات .اصلی مورد حکم قرار می گیرد تبصره3 - آیین نامه راجع به کیفیت اجرای مجازات تکمیلی ظرف شش ماه از تاریخ الزم االجراء شدن این قانون توسط وزیر .دادگستری تهیه می شود و به تصویب رییس قوه قضاییه می رسد"},{"n":24,"t":"چنانچه محکوم طی مدت اجرای مجازات تکمیلی، مفاد حکم را رعایت ننماید، دادگاه صادرکننده حکم به پیشنهاد قاضی اجرای احکام برای بار او ل مدت مجازات تکمیلی مندرج در حکم را تا یک سوم افزایش می دهد و در صورت تکرار، بقیه مدت محکومیت را به حبس یا جزای نقدی درجه هفت یا هشت تبدیل می کند. همچنین بعد از گذشتن نیمی از مدت مجازات تکمیلی، دادگاه می تواند با پیشنهاد قاضی اجرای حکم در صورت اطمینان به ع دم تکرار جرم و اصالح مجرم، نسبت به لغو یا کاهش مدت زمان مجازات .تکمیلی وی اقدام کند قانون مجازات اسالمی مصوب92"},{"n":25,"t":"محکومیت قطعی کیفری در جرایم عمدی، پس از اجرای حکم یا شمول مرور زمان، در مدت زمان مقرر در این ماده محکوم را از حقوق اجتماعی به عنوان مجازات :تبعی محروم می کند الف- هفت سال در محکومیت به مجازات های سالب حیات و حبس ابد از تاریخ توقف اجرای حکم اصلی ب- ،سه سال در محکومیت به قطع عضو، قصاص عضو در صورتی که دیه جنایت وارد شده بیش از نصف دیه مجنی علیه باشد نفی بلد و حبس تا درجه چهار پ- دو سال در محکومیت به شالق حدی، قصاص عضو در صورتی که دیه جنایت وارد شده نصف دیه مجنیٌ علیه یا کمتر از آن باشد و حبس درجه پنج تبصره1- در غیر موارد فوق، مراتب محکومیت در پیشینه کیفری محکوم درج می شود لکن در گواهی های صادره از مراجع ذی ربط منعکس نمی گردد مگر به درخواست مراجع قضایی برای تعیین یا با زنگری در مجازات تبصره2- ،در مورد جرایم قابل گذشت در صورتی که پس از صدور حکم قطعی با گذشت شاکی یا مدعی خصوصی اجرای مجازات .موقوف شود اثر تبعی آن نیز رفع می شود تبصره3 - در عفو و آزادی مشروط، اثر تبعی محکومیت پس از گذشت مدت های فوق از زمان عفو یا اتمام مدت آزادی مشروط .رفع می شود. محکوم در مدت زمان آزادی مشروط و همچنین در زمان اجرای حکم نیز از حقوق اجتماعی محروم می گردد"},{"n":26,"t":"حقوق اجتماعی موضوع این قانون به شرح زیر است الف- داوطلب شدن در انتخابات ریاست جمهوری، مجلس خبرگان رهبری، مجلس شورای اسالمی و ش وراهای اسالمی شهر و روستا ب- عضویت در شورای نگهبان، مجمع تشخیص مصلحت نظام یا هیأت دولت و تصدی معاونت رییس جمهور پ- تصدی ریاست قوه قضاییه، دادستانی کل کشور، ریاست دیوان عالی کشور و ریاست دیوان عدالت اداری ت- انتخاب شدن یا عضویت در انجمن ها، شوراها، احزاب و جمعیت ها به موجب قانون یا با رأی مردم ث- عضویت در هیأت های منصفه و امناء و شوراهای حل اختالف قانون مجازات اسالمی مصوب92 ج- اشتغال به عنوان مدیر مسؤول یا سردبیر رسانه های گروهی چ - استخدام و یا اشتغال در کلیه دستگاه های حکومتی اعم از قوای سه گانه و سازمان ها و شرکت های وابسته به آنها، صدا و سیمای جمهوری اسالمی ایران، نیروهای مسلح و سایر نهادهای تحت نظر رهبری، شهرداری ها و مؤسسات مأمور به خدمات عمومی و دستگاه های مستلزم تصریح یا ذکر نام برای شمول قانون بر آنها ح- اشتغال به عنوان وکیل دادگستری و تصدی دفاتر ثبت اسناد رسمی و ازدواج و طالق و دفتریاری خ- انتخاب شدن به سمت قیم، امین، متولی، ناظر یا متصدی موقوفات عام د- انتخاب شدن به سمت داوری یا کارشناسی در مراجع رسمی ذ- استفاده از نشان های دولتی و عناوین افتخاری ر- تأسیس، اداره یا عضویت در هیأت مدیره شرکت های دولتی، تعاونی و خصوصی یا ثبت ،نام تجارتی یا مؤسسه آموزشی، پژوهشی فرهنگی و علمی تبصره1- مستخدمان دستگاه های حکومتی در صورت محرومیت از حقوق اجتماعی، خواه به عنوان مجازات اصلی و خواه مجازات .تکمیلی یا تبعی، حسب مورد در مدت مقرر در حکم یا قانون، از خدمت منفصل می شوند تبصره2- هر کس به ع نوان مجازات ( تبعی از حقوق اجتماعی محروم گردد پس از گذشت مواعد مقرر در"},{"n":27,"t":"مدت حبس از روزی آغاز می شود که محکوم، به موجب حکم قطعی الزم االجراء حبس می گردد. در صورتی که فرد پیش از صدور حکم به علت اتهام یا اتهاماتی که در پرونده مطرح بوده بازداشت شده باشد، مدت بازداشت قبلی در حکم محاسبه می شود. در صورتی که مجازات مورد حکم، شالق تعزیری یا جزای نقدی باشد، هر روز بازداشت، معادل سه ضربه شالق یا یک ( میلیون000 / 000 /1) ریال است. چنانچه مجازات .متعدد باشد به ترتیب نسبت به حبس، شالق و جزای نقدی محاسبه می گردد قانون مجازات اسالمی مصوب92"},{"n":28,"t":"کلیه مبالغ مذکور در این قانون و سایر قوا نین از تاریخ تصویب آنها در مورد تمام جرائم و تخلفات از جمله مجازات ،نقدی به تناسب نرخ تورم اعالم شده از سوی بانک مرکزی، هر سه سال یک بار به پیشنهاد وزیر دادگستری و تصویب هیأت وزیران تعدیل .و در مورد احکامی که بعد از آن صادر می شود، الزم االجراء می گردد ماد ه29 - هرگاه بازداشت بدل از جزای نقدی توأم با مجازات حبس باشد بازداشت بدل از جزای نقدی از تاریخ اتمام حبس شروع می شود که از حداکثر مدت حبس مقرر در قانون برای آن جرم بیشتر نیست و در هر حال مدت بازداشت بدل از جزای نقدی نباید .از سه سال تجاوز کند"},{"n":30,"t":"منع از اشتغال به شغل، کسب، حرفه یا کار معین مستلزم لغو جواز کار یا پروانه کسب، حرفه یا کار است مشروط به این .که جرم به سبب اشتغال به شغل، کسب، حرفه یا کار ارتکاب یابد یا آن اشتغال وقوع جرم را تسهیل نماید"},{"n":31,"t":"منع از رانندگی و تصدی وسیله نقلیه موتوری مستلزم .ابطال گواهینامه و ممنوعیت از درخواست مجدد است"},{"n":32,"t":"منع از اصدار چک مستلزم ابطال برگه های سفید دسته چک و انسداد حساب جاری و ممنوعیت از درخواست مجدد .افتتاح حساب جاری است"},{"n":33,"t":".منع از حمل اسلحه مجاز مستلزم ابطال پروانه حمل و توقیف سالح است"},{"n":34,"t":".منع از خروج اتباع ایران از کشور مستلزم ابطال گذرنامه و ممنوعیت از درخواست مجدد است"},{"n":35,"t":"اخراج موقت یا دائم بیگانگان محکوم به مجازات از کشور پس از اجرای مجازات .و با حکم دادگاه انجام می شود"},{"n":36,"t":"حکم محکومیت قطعی در جرایم موجب حد محاربه و افساد فی االرض یا تعزیر تا درجه چهار و نیز کالهبرداری بیش از ( یک میلیارد000 / 000 / 000 / 1 ) ریال در صورتی که موجب اخالل در نظم یا امنیت نباشد در یکی از روزنامه های محلی در یک .نوبت منتشر می شود تبصره- انتشار حکم محکومیت قطعی در جرایم زیر که میزان مال موضوع جرم ارتک( ابی، یک میلیارد000 / 000 / 000 / 1 ) ریال :یا بیش از آن باشد، الزامی است و در رسانه ملی یا یکی از روزنامه های کثیر االنتشار منتشر می شود • الف- رشاء و ارتشاء • ب- اختالس قانون مجازات اسالمی مصوب92 • پ- اعمال نفوذ برخالف حق و مقررات قانونی در صورت تحصیل مال توسط مجرم یا دیگری • ت- مداخله وزرا و نمایندگان مجلس و کارمندان دولت در معامالت دولتی و کشوری • ث- تبانی در معامالت دولتی • ج- أخذ پورسانت در معامالت خارجی • چ- تعدیات مأموران دولتی نسبت به دولت • ح- جرایم گمرکی • خ- قاچاق کاال و ارز • د- جرایم مالیاتی • ذ- پولشویی • ر- اخالل در نظام اقتصادی کشور • ز- تصرف غیرقانونی در اموال عمومی یا دولتی فصل چهارم- تخفیف مجازات و معافیت از آن"},{"n":37,"t":"در صورت وجود یک یا چند جهت از جهات تخفیف، دادگاه می تواند مجازات تعزیری را به نحوی که به حال متهم :مناسب تر باشد به شرح زیر تقلیل دهد یا تبدیل کند الف- تقلیل مجازات حبس به میزان یک تا سه درجه در مجازات های درجه چهار و باالتر؛ ب- تقلیل مجازات حبس درجه پنج و درجه شش به میزان یک تا دو درجه یا تبدیل این مجازات و مجازات حبس درجه هفت حسب مورد به جزای نقدی متناسب با همان درجه؛ پ- تبدیل مصادره کل اموال به جزای نقدی درجه یک تا چهار؛ ت- تقلیل انفصال دائم به انفصال موقت به میزان پنج تا پانزده سال؛ ث- تقلیل سایر مجازات های تعزیری به میزان یک یا دو درجه یا تبدیل آن به مجازات دیگر از همان درجه یا یک درجه پایین تر؛ تبصره - چنانچه در اجرای مقررات این ماده یا سایر مقرراتی که به موجب آن مجازات تخفیف می یابد، حکم به حبس کمتر از نود و یک روز صادر شود، به مجازات .جایگزین مربوط تبدیل می شود قانون مجازات اسالمی مصوب92"},{"n":38,"t":"جهات تخفیف عبارتند از الف- گذشت شاکی یا مدعی خصوصی ب- همکاری مؤثر متهم در شناسایی شرکا یا معاونان، تحصیل ادله یا کشف اموال و اشیاء حاصله از جرم یا به کار رفته برای ارتکاب آن پ- اوضاع و احوال خاص مؤثر در ارتکاب جرم، از قبیل رفتار یا گفتار تحریک آمیز بزه دیده یا وجود انگیزه شرافتمندانه در ارتکاب جرم ت- اعالم متهم قبل از تعقیب یا اقرار مؤثر وی در حین تحقیق و رسیدگی ث- ندامت، حسن سابقه و یا وضع خاص مت هم از قبیل کهولت یا بیماری ج- کوشش متهم به منظور تخفیف آثار جرم یا اقدام وی برای جبران زیان ناشی از آن چ- خفیف بودن زیان وارده به بزه دیده یا نتایج زیانبار جرم ح- مداخله ضعیف شریک یا معاون در وقوع جرم تبصره1- دادگاه مکلف است جهات تخفیف مجازات را در حکم.خود قید کند تبصره2- هرگاه نظیر جهات مندرج در این ماده در مواد خاصی پیش بینی شده باشد، دادگاه نمی تواند به موجب همان ،جهات مجازات .را دوباره تخفیف دهد"},{"n":39,"t":"در جرایم تعزیری درجه های هفت و هشت در صورت احراز جهات تخفیف چنانچه دادگاه پس از احراز مجرمیت ت شخیص دهد که با عدم اجرای مجازات نیز مرتکب، اصالح می شود در صورت فقدان سابقه کیفری مؤثر و گذشت شاکی و جبران .ضرر و زیان یا برقراری ترتیبات جبران آن می تواند حکم به معافیت از کیفر صادر کند قانون مجازات اسالمی مصوب92 فصل پنجم- تعویق صدور حکم"},{"n":40,"t":"در جرایم موجب تعزیر درجه شش تا ،هشت دادگاه می تواند پس از احراز مجرمیت متهم با مالحظه وضعیت فردی خانوادگی و اجتماعی و سوابق و اوضاع و احوالی که موجب ارتکاب جرم گردیده است در صورت وجود شرایط زیر صدور حکم را به :مدت شش ماه تا دو سال به تعویق اندازد الف- وجود جهات تخفیف ب- پیش بینی اصالح م رتکب پ- جبران ضرر و زیان یا برقراری ترتیبات جبران ت- فقدان سابقه کیفری مؤثر تبصره- ( محکومیت مؤثر، محکومیتی است که محکوم را به تبع اجرای حکم، بر اساس"},{"n":41,"t":".تعویق به شکل ساده یا مراقبتی است الف- در تعویق س اده مرتکب به طور کتبی متعهد می گردد، در مدت تعیین شده به وسیله دادگاه، مرتکب جرمی نشود و از نحوه .رفتار وی پیش بینی شود که در آینده نیز مرتکب جرم نمی شود ب- در تعویق مراقبتی عالوه بر شرایط تعویق ساده، مرتکب متعهد می گردد دستورها و تدابیر مقرر شده به وسیله دادگاه را در مدت .تعویق رعایت کند یا به موقع اجراء گذارد تبصره1- .دادگاه نمی تواند قرار تعویق صدور حکم را به صورت غیابی صادر کند تبصره2- چنانچه متهم در بازداشت باشد، دادگاه پس از صدور قرار تعویق صدور حکم، بالفاصله دستور آزادی وی را صادر می .نماید. دادگاه می تواند در این مورد تأمین مناسب اخذ نماید. در هر صورت اخذ تأمین نباید به بازداشت مرتکب منتهی گردد"},{"n":42,"t":"تعویق مراقبتی همراه با تدابیر زیر است الف- حضور به موقع در زمان و مکان تعیین شده توسط مقام قضایی یا مددکار اجتماعی ناظر قانون مجازات اسالمی مصوب92 ب- ارائه اطال عات و اسناد و مدارک تسهیل کننده نظارت بر اجرای تعهدات محکوم برای مددکار اجتماعی پ- اعالم هرگونه تغییر شغل، اقامتگاه یا جابه جایی در مدت کمتر از پانزده روز و ارائه گزارشی از آن به مددکار اجتماعی ت- کسب اجازه از مقام قضایی به منظور مسافرت به خارج از کشور تب صره- .تدابیر یاد شده می تواند از سوی دادگاه همراه با برخی تدابیر معاضدتی از قبیل معرفی مرتکب به نهادهای حمایتی باشد"},{"n":43,"t":"در تعویق مراقبتی، دادگاه صادرکننده قرار می تواند با توجه به جرم ارتکابی و خصوصیات مرتکب و شرایط زندگی او به نحوی که در زندگی وی یا خانواده اش اختالل اساسی و عمده ایجاد نکند مرتکب را به اجرای یک یا چند مورد از دستورهای زیر در :مدت تعویق، ملزم نماید الف- حرفه آموزی یا اشتغال به حرفه ای خاص ب- اقامت یا عدم اقامت در مکان معین پ- درمان بیماری یا ترک اعتیاد ت- پرداخت نفقه افراد واجب النفقه ث- خودداری از تصدی کلیه یا برخی از وسایل نقلیه موتوری ج- خودداری از فعالیت حرفه ای مرتبط با جرم ارتکابی یا استفاده از وسایل مؤثر در آن چ- خودداری از ارتباط و معاشرت با شرکا یا معاونان جرم یا دیگر اشخاص از قبیل بزه دیده به تشخیص دادگاه ح - گذراندن دوره یا دو ،ره های خاص آموزش و یادگیری مهارت های اساسی زندگی یا شرکت در دوره های تربیتی، اخالقی، مذهبی تحصیلی یا ورزشی"},{"n":44,"t":"در مدت تعویق، در صورت ارتکاب جرم موجب حد، قصاص، جنایات عمدی موجب دیه یا تعزیر تا درجه هفت، دادگاه به لغو قرار تعویق اقدام و حکم محکومیت صادر می کند. در صورت عدم اجرای دستورهای دادگاه، قاضی می تواند برای یک بار تا .نصف مدت مقرر در قرار به مدت تعویق اضافه یا حکم محکومیت صادر کند قانون مجازات اسالمی مصوب92 تبصره- در صورت الغای قرار تعویق و صدور حکم محکومیت، صدور قرار تعلیق اجرای مجازات .ممنوع است"},{"n":45,"t":"پس از گذشت مدت تعویق با توجه به میزان پایبندی مرتکب به اجرای دستورهای دادگاه، گزارش های مددکار اجتماعی .و نیز مالحظه وضعیت مرتکب، دادگاه حسب مورد به تعیین کیفر یا صدور حکم معافیت از کیفر اقدام می کند فصل ششم- تعلیق اجرای مجازات"},{"n":46,"t":"در جرایم تعزیری درجه سه تا هشت دادگاه می تواند در صورت وجود شرایط مقرر برای تعویق صدور حکم، اجرای تمام یا قسمتی از مجازات را از یک تا پنج سال معلق نماید. دادستان یا قاضی اجرای احکام کیفری نیز پس از اجرای یک سوم مجازات می تواند از دادگاه صادرکننده حکم قطعی، تقاضای تعلیق نماید. همچنین محکوم می تواند پس از تحمل یک سوم مجازات، در صورت .دارا بودن شرایط قانونی، از طریق دادستان یا قاضی اجرای احکام کیفری تقاضای تعلیق نماید"},{"n":47,"t":"صدور حکم و اجرای مجازات :در مورد جرایم زیر و شروع به آنها قابل تعویق و تعلیق نیست الف- جرایم علیه امنیت داخلی و خارجی کشور، خرابکاری در تأسیسات آب، برق، گاز، نفت و مخابرات ب- جرایم سازمان یافته، سرقت مسلحانه یا مقرون به آزار، آدم ربایی و اسید پاشی پ- قدرت نمایی و ایجاد مزاحمت با چاقو یا هر نوع اسلحه دیگر، جرایم علیه عفت عمومی، تشکیل یا اداره مراکز فساد و فحشا ت- قاچاق عمده مواد مخدر یا روان گردان، مشروبات الکلی و سالح و مهمات و قاچاق انسان ث- تعزیر بدل از قصاص نفس، معاونت در قتل عمدی و محاربه و افساد فی االرض ج- ( جرایم اقتصادی، با موضوع جرم بیش از یکصد میلیون000 / 000 / 100 ) ریال تبصره- در جرائم علیه ،امنیت داخلی و خارجی کشور در صورت همکاری مؤثر مرتکب در کشف جرم و شناسایی سایر متهمان تعلیق بخشی از مجازات بالمانع است. همچنین تعلیق مجازات ( جرائم علیه عفت عمومی (به جز جرائم موضوع مواد639 ) و ( 640) کتاب پنجم قانون مجازات اسالمی تعزیرات و مجازات های بازدا رنده مصوب2/3/ 1375 با اصالحات و الحاقات بعدی) و کالهبرداری و کلیه جرائم در حکم کالهبرداری و جرائمی که مجازات کالهبرداری درباره آنها مقرر شده یا طبق قانون کالهبرداری محسوب می( شود و شروع به جرائم مقرر در این تبصره، بالمانع است. رعایت"},{"n":48,"t":"تعلیق مجازات با رعایت مقررات مندرج در تعویق صدور حکم، ممکن است به .طور ساده یا مراقبتی باشد"},{"n":49,"t":"قرار تعلیق اجرای مجازات به وسیله دادگاه ضمن حکم محکومیت یا پس از صدور آن صادر می گردد. کسی که اجرای حکم مجازات وی به طورکلی معلق شده است، اگر در بازداشت باشد فوری آزاد می .گردد"},{"n":50,"t":"چنانچه محکومی که مجازات ،او معلق شده است در مدت تعلیق بدون عذر موجه از دستورهای دادگاه تبعیت نکند دادگاه صادرکننده حکم قطعی می تواند به درخواست دادستان یا قاضی اجرای احکا م، برای بار اول یک تا دو سال به مدت تعلیق اضافه یا قرار تعلیق را لغو نماید. تخلف از دستور دادگاه برای بار دوم، موجب الغای قرار تعلیق و اجرای مجازات می .شود"},{"n":51,"t":"تعلیق اجرای مجازات محکوم نسبت به حق مدعی خصوصی تأثیری ندارد و حکم پرداخت خسارت یا دیه در ا ین موارد اجراء می .شود"},{"n":52,"t":"هرگاه محکوم از تاریخ صدور قرار تا پایان مدت تعلیق، مرتکب جرم عمدی موجب حد، قصاص، دیه یا تعزیر تا درجه هفت نشود، محکومیت تعلیقی بی اثر می .شود"},{"n":53,"t":"در صورتی که قسمتی از مجازات یا یکی از مجازات های مورد حکم معلق،شود مدت تعلیق از زمان خاتمه اجرای مجازات غیرمعلق محاسبه می .گردد تبصره- در مواردی که به موجب قوانین اداری و استخدامی، محکومیت کیفری موجب انفصال است در صورت تعلیق، محکومیت معلق، موجب انفصال نمی .گردد، مگر آنکه در قانون تصریح یا قرار تعلیق لغو شود"},{"n":54,"t":"هرگاه محکوم از تاریخ صدور قرار تا پایان مدت تعلیق، مرتکب یکی از جرایم عمدی موجب حد، قصاص، دیه یا تعزیر تا درجه هفت شود، پس از قطعیت حکم اخیر، دادگاه قرار تعلیق را لغو و دستور اجرای حکم معلق را نیز صادر و مراتب را به دادگاه صادرکننده قرار تعلیق اعالم می کند. دادگاه به هنگام صدور قرار تعلیق به طور صریح به محکوم اعالم می کند که اگر در مدت تعلیق مرتکب یکی از جرایم فوق شود، عالوه بر مجازات ،جرم اخیر مجازات معلق نیز درباره وی اجراء می .شود"},{"n":55,"t":"هرگاه پس از صدور قرار تعلیق، دادگاه احراز نماید که محکوم دا رای سابقه محکومیت کیفری مؤثر یا محکومیت های قطعی دیگری بوده است که در میان آنها محکومیت تعلیقی وجود داشته و بدون توجه به آن اجرای مجازات معلق شده است، قرار تعلیق را لغو می کند. دادستان یا قاضی اجرای احکام نیز موظف است در صورت اطالع از موارد فوق، لغو تعلی ق مجازات را از دادگاه .درخواست نماید. حکم این ماده در مورد تعویق صدور حکم نیز جاری است قانون مجازات اسالمی مصوب92 فصل هفتم - نظام نیمه آزادی"},{"n":56,"t":"نظام نیمه آزادی، شیوه ای است که بر اساس آن محکوم می تواند در زمان اجرای حکم حبس، فعالیت های حرفه ،ای آموزشی، حرفه ،آموزی درمانی و نظایر اینها را در خارج از زندان انجام دهد. اجرای این فعالیت ها زیر نظر مراکز نیمه آزادی است که در سازمان زندان ها و اقدامات تأمینی و تربیتی تأسیس می .شود"},{"n":57,"t":"در حبس های تعزیری درجه پنج تا هفت دادگاه صادرکننده حکم قطعی می تواند مشروط به گذشت شاکی و سپردن تأمین مناسب و تعهد به انجام یک فعالیت شغلی، حرفه ای، آموزشی، حرفه آموزی، مشارکت در تداوم زندگی خانوادگی یا درمان اعتیاد یا بیماری که در فرآیند اصالح یا جبران خسارت وارد بر بزه دیده مؤثر است، محکوم را با رضایت خود او، تحت نظام نیمه آز ادی قرار دهد. همچنین محکوم می تواند در طول دوره تحمل مجازات در صورت دارا بودن شرایط قانونی، صدور حکم نیمه .آزادی را تقاضا نماید و دادگاه موظف به رسیدگی است تبصره - مقررات این ماده در مورد حبس های تعزیری درجه دو، درجه سه و درجه چهار، در صورت گذراندن یک چه ارم مدت حبس .قابل اِعمال است فصل هشتم- نظام آزادی مشروط"},{"n":58,"t":"در مورد محکومیت به حبس تعزیری، دادگاه صادر کننده حکم می تواند در مورد محکومان به حبس بیش از ده سال پس از تحمل نصف و در سایر موارد پس از تحمل یک سوم مدت مجازات به پیشنهاد دادستان یا قاضی اجرای احکام با رعایت شرایط :زیر حکم به آزادی مشروط را صادرکند الف- محکوم در مدت اجرای مجازات .همواره از خود حسن اخالق و رفتار نشان دهد ب- حاالت و رفتار محکوم نشان دهد که پس از آزادی، دیگر مرتکب جرمی نمی .شود پ- به تشخیص دادگاه محکوم تا آنجا که استطاعت دارد ضرر و زیان مورد حکم یا مورد موافقت مدعی خصوصی را بپردازد یا قراری .برای پرداخت آن ترتیب دهد ت- .محکوم پیش از آن از آزادی مشروط استفاده نکرده باشد قانون مجازات اسالمی مصوب92 انقضای مواعد فوق و همچنین مراتب مذکور در بندهای (الف) و (ب) این ماده پس از گزارش رییس زندان محل به تأیید قاضی اجرای احکام می رسد. قاضی اجرای احکام موظف است مواعد مقرر و وضعیت زندانی را درباره تحقق شرایط مذکور بررسی و در .صورت احراز آن، پیشنهاد آزادی مشروط را به دادگاه تقدیم نماید"},{"n":59,"t":"مدت آزادی مشروط شامل بقیه مدت مجازات می شود، لکن دادگاه می تواند مدت آن را تغییر دهد و در هر حال آزادی مشروط نمی تواند کمتر از یک سال و بیشتر از پنج سال باشد جز در مواردی که مدت باقیمانده کمتر از یک سال باشد که در این صورت مدت آزادی مشروط معادل بقیه مدت حبس .است"},{"n":60,"t":"دادگاه می تواند با توجه به اوضاع و اح وال وقوع جرم و خصوصیات روانی و شخصیت محکوم، او را در مدت آزادی مشروط، به اجرای دستورهای مندرج در قرار تعویق صدور حکم، ملزم کند. دادگاه، دستورهای مذکور و آثار عدم تبعیت از آنها و نیز آثار ارتکاب جرم جدید را در حکم خود قید و به محکوم تفهیم می .کند"},{"n":61,"t":"هرگاه محکوم در مدت آزادی مشروط بدون عذر موجه از دستورهای دادگاه تبعیت نکند برای بار اول یک تا دو سال به مدت آزادی مشروط وی افزوده می شود. در صورت تکرار یا ارتکاب یکی از جرایم عمدی موجب حد، قصاص، دیه یا تعزیر تا درجه هفت، عالوه بر مجازات جرم جدید، مدت باقی مانده محکومیت نیز به اجراء در می آید، در غیر این صورت آزادی او قطعی می.شود"},{"n":62,"t":"در جرایم تعزیری از درجه پنج تا درجه هشت، دادگاه می تواند در صورت وجود شرایط مقرر در تعویق مراقبتی، محکوم به حبس را با رضایت وی در محدوده مکانی مشخص تحت نظارت سامانه ( .سیستم) های الکترونیکی قرار دهد تبصره1- دادگاه در صورت لزوم می .تواند محکوم را تابع تدابیر نظارتی یا دستورهای ذکر شده در تعویق مراقبتی قرار دهد تبصره2 - مقررات این ماده در مورد حبس های تعزیری درجه دو، درجه سه و درجه چهار نیز پس از گذراندن یک چهارم مجاز ات .های حبس قابل اِعمال است تبصره3 - قوه قضائیه می تواند برای اجرای تدابیر نظارتی موضوع این ماده یا سایر مقرراتی که به موجب آن متهم یا محکوم تحت نظارت الکترونیکی قرار می گیرد، با نظارت سازمان زندان ها و اقدامات تأمینی و تربیتی کشور از ظرفیت بخش خصوصی استفاده کند. آیین نامه اجرائی این تبصره توسط معاونت حقوقی قوه قضائیه با همکاری مرکز آمار و فناوری و سازمان زندان ها و اقدامات تأمینی و تربیتی کشور تهیه می شود و به تصویب رئیس قوه قضائیه می .رسد"},{"n":63,"t":"آیین نامه اجرایی مواد مربوط به نظام نیمه آ زادی و آزادی مشروط ظرف شش ماه از تاریخ الزم االجرا ء شدن این قانون به وسیله سازمان زندان ها و اقدامات تأمینی و تربیتی کشور تهیه می شود و به تصویب رییس قوه قضاییه می .رسد قانون مجازات اسالمی مصوب92 فصل نهم- مجازات های جایگزین حبس"},{"n":64,"t":"مجازات های جایگزین حبس عبارت از دوره مراقبت، خدمات عمومی رایگان، جزای نقدی، جزای نقدی روزانه و محرومیت از حقوق اجتماعی ،است که در صورت گذشت شاکی و وجود جهات تخفیف با مالحظه نوع جرم و کیفیت ارتکاب آن آثار ناشی از جرم، سن، مهارت، وضعیت، شخصیت و سابقه مجرم، وضعیت بزه دیده و سایر اوضاع و ا حوال، تعیین و اجراء می .شود تبصره- دادگاه در ضمن حکم، به سنخیت و تناسب مجازات مورد حکم با شرایط و کیفیات مقرر در این ماده تصریح می .کند دادگاه نمی تواند به بیش از دو نوع از مجازات .های جایگزین حکم دهد"},{"n":65,"t":" ی یا بیمارستانی موجود به این افراد اختصاص داده می .شود"},{"n":151,"t":"هرگاه کسی بر اثر اکراه غیرقابل تحمل مرتکب رفتاری شود که طبق قانون جرم محسوب می شود مجازات .نمی گردد در جرایم موجب تعزیر، اکراه کننده به مجازات فاعل جرم محکوم می شود. د ر جرایم موجب حد و قصاص طبق مقررات مربوط .رفتار می شود"},{"n":152,"t":"هر کس هنگام بروز خطر شدید فعلی یا قریب الوقوع از قبیل آتش سوزی، سیل، طوفان، زلزله یا بیماری به منظور حفظ نفس یا مال خود یا دیگری مرتکب رفتاری شود که طبق قانون جرم محسوب می شود قابل مجازات نیست مشروط بر این که .خطر را عمداً ایجاد نکند و رفتار ارتکابی با خطر موجود متناسب و برای دفع آن ضرورت داشته باشد تبصره- کسانی که حسب وظیفه یا قانون مکلف به مقابله با خطر می باشند نمی توانند با تمسک به این ماده از ایفای وظایف .قانونی خود امتناع نمایند"},{"n":153,"t":"هر کس در حال خواب، بیهوشی و مانند آنها، مرتکب رفتاری شود که طبق قانون جرم محسوب می شود مجازات نمی .گردد مگر این که شخص با علم به این که در حال خواب یا بیهوشی مرتکب جرم می شود، عمداً بخوابد و یا خود را بیهوش کند"},{"n":154,"t":"مستی و بی ارادگی حاصل از مصرف اختی اری مسکرات، مواد مخدر و روان گردان و نظایر آنها، مانع مجازات نیست مگر این که ثابت شود مرتکب حین ارتکاب جرم به طور کلی مسلوب االختیار بوده است. لکن چنانچه ثابت شود مصرف این مواد به منظور ارتکاب جرم یا با علم به تحقق آن بوده است و جرم مورد نظر واقع شود، به م جازات .هر دو جرم محکوم می شود"},{"n":155,"t":"جهل به حکم، مانع از مجازات مرتکب نیست مگر اینکه تحصیل علم عادتاً برای وی ممکن نباشد یا جهل به حکم .شرعاً عذر محسوب شود تبصره- جهل به نوع یا میزان مجازات مانع از مجازات .نیست قانون مجازات اسالمی مصوب92"},{"n":156,"t":"هرگاه فردی در مقام دفاع از نفس، عرض، ناموس، مال یا آزادی تن خود یا دیگری در برابر هرگونه تجاوز یا خطر فعلی یا قریب الوقوع با رعایت مراحل دفاع مرتکب رفتاری شود که طبق قانون جرم محسوب می شود، در صورت اجتماع شرایط زیر مجازات :نمی شود الف- رفتار ارتکابی برای دفع تجاوز یا خطر ضرورت داشته .باشد ب- .دفاع مستند به قرائن معقول یا خوف عقالیی باشد پ- .خطر و تجاوز به سبب اقدام آگاهانه یا تجاوز خود فرد و دفاع دیگری صورت نگرفته باشد ت- .توسل به قوای دولتی بدون فوت ی معتبر نیست مگر آن که قاضی به عدم .فراموشی، سهو و امثال آن در مورد شهادت علم داشته باشد"},{"n":181,"t":"عادل کسی است که در نظر قاضی یا شخصی که بر عدالت وی گواهی می دهد، اهل معصیت نباشد. شهادت شخصی ،که اشتهار به فسق داشته باشد مرتکب گناه کبیره شود یا بر گناه صغیره اصرار داشته باشد تا احراز تغییر در اعمال او و اطمینان از .صالحیت و عدالت وی، پذیرفته نمی شود"},{"n":182,"t":"در شهادت شرعی، در صورت تعدد شهود، وحدت موضوع شهادت ضروری است و باید مفاد شهادت ها در خصوصیات مؤثر در اثبات جرم یکسا ن باشد. هرگاه اختالف مفاد شهادت ها موجب تعارض شود و یا وحدت موضوع را مخدوش کند، شهادت .شرعی محسوب نمی شود"},{"n":183,"t":".شهادت باید از روی قطع و یقین به نحوی که مستند به امور حسی و از طریق متعارف باشد، اداء شود"},{"n":184,"t":"شهادت باید با لفظ یا نوشتن باشد و در صو رت تعذر، با فعل از قبیل اشاره واقع شود و در هر صورت باید روشن و بدون .ابهام باشد"},{"n":185,"t":".در صورت وجود تعارض بین دو شهادت شرعی، هیچ یک معتبر نیست"},{"n":186,"t":"چنانچه حضور شاهد متعذر باشد، گواهی به صورت مکتوب، صوتی- تصویری زنده و یا ضبط شده، با احراز شرایط و .صحت انتساب، معتبر است قانون مجازات اسالمی مصوب92"},{"n":187,"t":"در شهادت شرعی نباید علم به خالف مفاد شهادت وجود داشته باشد. هرگاه قرائن و امارات بر خالف مفاد شهادت شرعی باشد، دادگاه، تحقیق و بررسی الزم را انجام می دهد و در صورتی که به خالف واقع بودن شهادت، علم حاصل کند، شهادت مع.تبر نیست"},{"n":188,"t":"شهادت بر شهادت شرعی در صورتی معتبر است که شاهد اصلی فوت نموده و یا به علت غیبت، بیماری و امثال آن .حضور وی متعذر باشد تبصره1- .شاهد بر شهادت شاهد اصلی باید واجد شرایط مقرر برای شاهد اصلی باشد تبصره2 - شهادت بر شهادت شاهد فرع، معتبر نی.ست"},{"n":189,"t":".جرایم موجب حد و تعزیر با شهادت بر شهادت اثبات نمی شود لکن قصاص، دیه و ضمان مالی با آن قابل اثبات است"},{"n":190,"t":"در صورتی که شاهد اصلی، پس از اقامه شهادت به وسیله شهود فرع و پیش از صدور رأی، منکر شهادت شود، گواهی شهود فرع از اعتبار ساقط می.شود اما بر انکار پس از صدور حکم، اثری مترتب نیست"},{"n":191,"t":"شاهد شرعی قابل جرح و تعدیل است. جرح شاهد عبارت از شهادت بر فقدان یکی از شرایطی که قانون برای شاهد .شرعی مقرر کرده است و تعدیل شاهد عبارت از شهادت بر وجود شرایط مذکور برای شاهد شرعی است"},{"n":192,"t":"ق .اضی مکلف است حق جرح و تعدیل شهود را به طرفین اعالم کند"},{"n":193,"t":"جرح شاهد شرعی باید پیش از ادای شهادت به عمل آید مگر آن که موجبات جرح پس از شهادت معلوم شود. در این صورت، جرح تا پیش از صدور حکم به عمل می آید و در هر حال دادگاه مکلف است به موضوع جرح، رسیدگی .و اتخاذ تصمیم کند"},{"n":194,"t":".در صورت رد شاهد شرعی از سوی قاضی یا جرح وی، مدعی صالحیت شاهد می تواند برای اثبات آن دلیل اقامه کند"},{"n":195,"t":"در اثبات جرح یا تعدیل شاهد، ذکر اسباب آن الزم نیست و گواهی مطلق به تعدیل یا جرح، کفایت می کند مشروط بر آن که شاهد دا .رای شرایط شرعی باشد تبصره- در اثبات یا نفی عدالت، علم شاهد به عدالت یا فقدان آن الزم است و حسن ظاهر به تنهایی برای احراز عدالت کافی .نیست قانون مجازات اسالمی مصوب92"},{"n":196,"t":".هرگاه گواهی شهود معرفی شده در اثبات جرح یا تعدیل شاهد با یکدیگر معارض باشد از اعتبار ساقط است"},{"n":197,"t":"هر ،گاه دادگاه، شهود معرفی شده را واجد شرایط قانونی تشخیص دهد، شهادت را می پذیرد و در غیر این صورت شهادت را شهادت شرعی محسوب نمی کند و اگر از وضعیت آنها اطالع نداشته باشد تا زمان احراز شرایط و کشف وضعیت که نباید بیش از ده روز طول بکشد، رسیدگی را متوقف و پس از آن، حسب مورد، اتخاذ تصمیم می کند مگر این که به نظر قاضی احراز .شرایط در مدت ده روز ممکن نباشد"},{"n":198,"t":"رجوع از شهادت شرعی، قبل از اجرای مجازات موجب سلب اعتبار شهادت می شود و اعاده شهادت پس از رجوع از .آن، مسموع نیست"},{"n":199,"t":"نصاب شهادت در کلیه جرایم، دو شاهد مرد است مگر در زنا، لواط، تفخیذ و مساحقه که با چهار شاهد مرد اثبات می گردد. برای اثبات زنای موجب حد جلد، تراشیدن و یا تبعید، شهادت دو مرد و چهار زن عادل نیز کافی است. زمانی که مجازات غیر از موارد مذکور است، حداقل شهادت سه مرد و دو زن عادل ال زم است. در این مورد هرگاه دو مرد و چهار زن عادل به آن شهادت .دهند تنها حد شالق، ثابت می شود. جنایات موجب دیه با شهادت یک شاهد مرد و دو شاهد زن نیز قابل اثبات است"},{"n":200,"t":"در خصوص شهادت بر زنا یا لواط، شاهد باید حضوری عملی را که زنا یا لواط با آن محقق می ش ود دیده باشد و هرگاه شهادت مستند به مشاهده نباشد و همچنین در صورتی که شهود به عدد الزم نرسند شهادت درخصوص زنا یا لواط، قذف محسوب .می شود و موجب حد است فصل چهارم- سوگند"},{"n":201,"t":".سوگند عبارت از گواه قراردادن خداوند بر درستی گفتار اداء کننده سوگند است"},{"n":202,"t":".اداء کننده سوگند باید عاقل، بالغ، قاصد و مختار باشد"},{"n":203,"t":"سوگند باید مطابق قرار دادگاه و با لفظ جالله والله، بالله، تالله یا نام خداوند متعال به سایر زبان ها اداء شود و در صورت نیاز به تغلیظ و قبول اداءکننده سوگند، دادگاه کیفیت ادای آن را ا ز حیث زمان، مکان، الفاظ و مانند آنها تعیین می کند. در هر .صورت، بین مسلمان و غیر مسلمان در ادای سوگند به نام خداوند متعال تفاوتی وجود ندارد"},{"n":204,"t":".سوگند باید مطابق با ادعاء صریح در مقصود و بدون هرگونه ابهام باشد و از روی قطع و یقین اداء شود"},{"n":205,"t":".سوگند باید با لفظ باشد و در صورت تعذر، با نوشتن یا اشاره ای که روشن در مقصود باشد، اداء شود قانون مجازات اسالمی مصوب92"},{"n":206,"t":"در مواردی که اشاره، مفهوم نباشد یا قاضی به زبان شخصی که سوگند یاد می کند، آشنا نباشد و یا اداء کننده سوگند قادر به تکلم نباشد، دادگاه به وسیله مترجم یا م.تخصص امر، مراد وی را کشف می کند"},{"n":207,"t":".سوگند فقط نسبت به طرفین دعوی و قائم مقام آنها مؤثر است"},{"n":208,"t":"حدود و تعزیرات با سوگند نفی یا اثبات نمی شود لکن قصاص، دیه، ارش و ضرر و زیان ناشی از جرایم، مطابق مقررات .این قانون با سوگند اثبات می گردد"},{"n":209,"t":"هرگاه در دعاوی مالی مانند دیه جنایات و همچنین دعاویی که مقصود از آن مال است مانند جنایت خطایی و شبه عمدی موجب دیه، برای مدعی خصوصی امکان اقامه بینه شرعی نباشد، وی می تواند با معرفی یک شاهد مرد یا دو شاهد زن به ضمیمه یک سوگند، ادعای خود را فقط از جنبه مال .ی اثبات کند تبصره- .در موارد مذکور در این ماده، ابتداء شاهد واجد شرایط شهادت می دهد و سپس سوگند توسط مدعی اداء می شود"},{"n":210,"t":"هرگاه ثابت شود سوگند، دروغ و یا اداء کننده سوگند فاقد شرایط قانونی بوده است، به سوگند مزبور ترتیب اثر داده نمی .شود فصل پنجم- علم قاضی"},{"n":211,"t":"علم قاضی عبارت از یقین حاصل از مستندات بین در امری است که نزد وی مطرح می شود. در مواردی که مستند .حکم، علم قاضی است، وی موظف است قرائن و امارات بین مستند علم خود را به طور صریح در حکم قید کند تبصره- مواردی از قبیل نظریه کارشناس، معاینه محل، تحقیقات محلی، اظهارات مطلع، گزارش ضابطان و سایر قرائن و امارات ،که نوعاً علم آور باشند می تواند مستند علم قاضی قرار گیرد. در هر حال مجرد علم استنباطی که نوعاً موجب یقین قاضی نمی شود .نمی تواند مالک صدور حکم باشد"},{"n":212,"t":"در صورتی که ع لم قاضی با ادله قانونی دیگر در تعارض باشد اگرعلم، بین باقی بماند، آن ادله برای قاضی معتبر نیست و قاضی با ذکر مستندات علم خود و جهات رد ادله دیگر، رأی صادر می کند. چنانچه برای قاضی علم حاصل نشود، ادله قانونی .معتبر است و بر اساس آنها رأی صادر می شود"},{"n":213,"t":"در تعارض سایر ادله با یکدیگر، اقرار بر شهادت شرعی، قسامه و سوگند مقدم است. همچنین شهادت شرعی بر قسامه .و سوگند تقدم دارد قانون مجازات اسالمی مصوب92 بخش ششم- مسایل متفرقه"},{"n":214,"t":"مجرم باید مالی را که در اثر ارتکاب جرم تحصیل کرده است، اگر موجود باشد عین آن را و اگر موجود نباشد مثل آن را و در صورت عدم امکان رد مثل، قیمت آن را به صاحبش رد کند و از عهده خسارات وارده نیز برآید. هرگاه از حیث جزایی وجهی بر .عهده مجرم تعلق گیرد، استرداد اموال یا تأدیه خسارت مدعیان خصوصی بر آن مقدم است"},{"n":216,"t":"اجرای احکام حدود، قصاص و دیات براساس آیین نامه ای است که تا شش ماه از تاریخ الزم االجراء شدن این قانون .توسط رییس قوه قضاییه تهیه، تصویب و ابالغ می شود قانون مجازات اسالمی مصوب92 کتاب دوم- حدود بخش اول- مواد عمومی"},{"n":217,"t":"در جرایم موجب حد، مرتکب در صورتی مسؤول است که عالوه بر داشتن علم قصد و شرایط مسؤولیت کیفری به .حرمت شرعی رفتار ارتکابی نیز آگاه باشد"},{"n":218,"t":"در جرایم موجب حد هرگاه متهم ادعای فقدان علم یا قصد یا وجود یکی از موانع مسؤولیت کیفری را در زمان ارتکاب جرم نماید در صورتی که احتمال صدق گفتار وی داده شود و اگر ادعاء کند که اقرا ر او با تهدید و ارعاب یا شکنجه گرفته شده است .ادعای مذکور بدون نیاز به بینه و سوگند پذیرفته می شود تبصره1- در جرایم محاربه و افساد فی االرض و جرایم منافی عفت با عنف، اکراه، ربایش یا اغفال، صرف ادعاء، مسقط حد نیست .و دادگاه موظف به بررسی و تحقیق است تبصره2 - .اقرار در صورتی اعتبار شرعی دارد که نزد قاضی در محکمه انجام گیرد"},{"n":219,"t":"دادگاه نمی تواند کیفیت، نوع و میزان حدود شرعی را تغییر یا مجازات .را تقلیل دهد یا تبدیل یا ساقط نماید این مجازات ،ها تنها از طریق توبه و عفو به کیفیت مقرر در این قانون قابل سقوط .تقلیل یا تبدیل است"},{"n":220,"t":"( در مورد حدودی که در این قانون ذکر نشده است طبق اصل یکصد و شصت و هفتم167 ) قانون اساسی جمهوری .اسالمی ایران عمل می شود بخش دوم - جرایم موجب حد فصل اول- زنا"},{"n":221,"t":"زنا عبارت است از جماع مرد و زنی که علقه زوجیت بین آنها .نبوده و از موارد وطی به شبهه نیز نباشد تبصره1- .جماع با دخول اندام تناسلی مرد به اندازه ختنه گاه در قُبُل یا دُ بُر زن محقق می شود تبصره2 - هرگاه طرفین یا یکی از آنها نابالغ باشد، زنا محقق است لکن نابالغ مجازات نمی شود و حسب مورد به اقدامات تأمینی و .تربیتی مقرر در کتاب اول این قانون محکوم می گردد قانون مجازات اسالمی مصوب92"},{"n":222,"t":"جماع با میت، زنا است، مگر جماع زوج با زوجه متوفای خود که زنا نیست لکن موجب سی و یک تا هفتاد و چهار ضربه .شالق تعزیری درجه شش می شود"},{"n":223,"t":"هرگاه متهم به زنا، مدعی زوجیت یا وطی به شبهه باشد، ادعا ی وی بدون بینه یا سوگند پذیرفته می شود مگر آن که .خالف آن با حجت شرعی الزم ثابت شود"},{"n":224,"t":"حد زنا در موارد زیر اعدام است • الف- زنا با محارم نسبی • ب- زنا با زن پدر که موجب اعدام زانی است . • پ- .زنای مرد غیرمسلمان با زن مسلمان که موجب اعدام زانی است • ت- .زنای به عنف یا اکراه از سوی زانی که موجب اعدام زانی است تبصره1- مجازات .زانیه در بندهای (ب) و (پ) حسب مورد، تابع سایر احکام مربوط به زنا است تبصره2 - هرگاه کسی با زنی که راضی به زنای با او نباشد در حال بیهوشی، خواب یا مستی زنا کند رفتار او در حکم زنای به عنف است. در زنا از طریق اغفال و فریب دادن دختر نابالغ یا از طریق ربایش، تهدید و یا ترساندن زن اگر چه موجب تسلیم شدن او شود .نیز حکم فوق جاری است"},{"n":225,"t":"حد زنا برای زانی محصن و زانیه محصنه رجم است. در صورت عدم امکان اجرای رجم با پیشنهاد دادگاه صا درکننده حکم قطعی و موافقت رییس قوه قضاییه چنانچه جرم با بینه ثابت شده باشد، موجب اعدام زانی محصن و زانیه محصنه است و در .غیر این صورت موجب صد ضربه شالق برای هریک می باشد"},{"n":226,"t":"احصان در هریک از مرد و زن به نحو زیر را مطالبه کند. چنانچه قذف شوندگان یکجا شکایت نمایند بیش از یک حد جاری نمی شود"},{"n":258,"t":"کسی که دیگری را به یک یا چند سبب، یک بار یا بیشتر قبل از اجرای حد، قذف نماید فقط به یک حد محکوم می شود، لکن اگر پ س از اجرای حد، قذف را تکرار نماید حد نیز تکرار می شود و اگر بگوید آن چه گفته ام حق بود به سی و یک تا هفتاد .و چهار ضربه شالق تعزیری درجه شش محکوم می گردد"},{"n":259,"t":"پدر یا جد پدری که فرزند یا نوه خود را قذف کند به سی و یک تا هفتاد و چهار ضربه شالق تعزیری در جه شش محکوم .می گردد"},{"n":260,"t":"حد قذف اگر اجراء نشده و مقذوف نیز گذشت نکرده باشد به همه ورثه به غیر از همسر منتقل می گردد و هر یک از .ورثه می تواند تعقیب و اجرای آن را مطالبه کند هر چند دیگران گذشت کرده باشند تبصره- در صورتی که قاذف، پدر یا جد پدری وارث باشد، وارث نمی .تواند تعقیب متهم یا اجرای حد را مطالبه کند"},{"n":261,"t":"در موارد زیر حد قذف در هر مرحله از مراحل تعقیب، رسیدگی و اجراء ساقط می :شود قانون مجازات اسالمی مصوب92 • الف- .هرگاه مقذوف، قاذف را تصدیق نماید • ب- هرگاه آن چه به مقذوف نسبت داده شده با شهادت یا علم قاضی اثبات .شود • پ- .هرگاه مقذوف و در صورت فوت وی، ورثه او، گذشت کند • ت- .هرگاه مردی زنش را پس از قذف به زنای پیش از زوجیت یا زمان زوجیت لعان کند • ث- .هرگاه دو نفر یکدیگر را قذف کنند، خواه قذف آنها همانند، خواه مختلف باشد • تبصره- مجازات مرتکبان در بند (ث)، سی و یک تا هفت .اد و چهار ضربه شالق تعزیری درجه شش است فصل پنجم- سبّ نبی"},{"n":262,"t":"هر کس پیامبر اعظم صلی الله علیه و آله و سلم و یا هریک از انبیاء عظام الهی را دشنام دهد یا قذف کند ساب النّبی است و به اعدام محکوم می .شود تبصره- قذف هر یک از ائمه معصومین علیهم ّالسالم و یا حضرت فاطمه زهرا سالم الله علیها یا دشنام به ایشان در حکم سب .نبی است"},{"n":263,"t":"هرگاه متهم به سب، ادعاء نماید که اظهارات وی از روی اکراه، غفلت، سهو یا در حالت مستی یا غضب یا سبق لسان یا بدون توجه به معانی کلمات و یا نقل قول از دیگری بوده است سا ب النّبی محسوب نمی .شود تبصره- هرگاه سب در حالت مستی یا غضب یا به نقل از دیگری باشد و صدق اهانت کند موجب تعزیر تا هفتاد و چهار ضربه شالق .است فصل ششم- مصرف مسکر"},{"n":264,"t":"مصرف مسکر از قبیل خوردن، تزریق و تدخین آن کم باشد یا زیاد، جامد باشد یا مایع، مست کند یا نکند، خالص باشد یا مخلوط به گونه .ای که آن را از مسکر بودن خارج نکند، موجب حد است تبصره- خوردن فقاع (آب .جو مسکر) موجب حد است هرچند مستی نیاورد"},{"n":265,"t":".حد مصرف مسکر، هشتاد ضربه شالق است"},{"n":266,"t":"غیرمسلمان تنها در صورت تظاهر به مصرف مسکر، محکوم به حد می .شود قانون مجازات اسالمی مصوب92 تبصره- اگر مصرف مسکر توسط غیرمسلمان علنی نباشد لکن مرتکب در حال مستی در معابر یا اماکن عمومی ظاهر شود به مجازات مقرر برای تظاهر به عمل حرام محکوم می .گردد فصل هفتم - سرقت"},{"n":267,"t":"سرقت عبارت از ربودن مال متعلق به غیر.است"},{"n":268,"t":"سرقت در صورتی که دارای تمام شرایط زیر باشد موجب حد است • الف- .شیء مسروق شرعاً مالیت داشته باشد • ب- .مال مسروق در حرز باشد • پ- .سارق هتک حرز کند • ت- .سارق مال را از حرز خارج کند • ث- .هتک حرز و سرقت مخفیانه باشد • ج- سارق پدر یا جد پدری صاحب مال نبا .شد • چ- .ارزش مال مسروق در زمان اخراج از حرز، معادل چهار و نیم نخود طالی مسکوک باشد • ح- .مال مسروق از اموال دولتی یا عمومی، وقف عام و یا وقف بر جهات عامه نباشد • خ- .سرقت در زمان قحطی صورت نگیرد • د- .صاحب مال از سارق نزد مرجع قضایی شکایت کند • ذ- صاحب مال قبل.از اثبات سرقت سارق را نبخشد • ر- .مال مسروق قبل از اثبات سرقت تحت ید مالک قرار نگیرد • ز- .مال مسروق قبل از اثبات جرم به ملکیت سارق در نیاید • ژ .ـ مال مسروق از اموال سرقت شده یا مغصوب نباشد"},{"n":269,"t":"حرز عبارت از مکان متناسبی است که مال عرفاً در آن از دستبرد مح .فوظ می ماند"},{"n":270,"t":"در صورتی که مکان نگهداری مال از کسی غصب شده باشد، نسبت به وی و کسانی که از طرف او حق دسترسی به .آن مکان را دارند، حرز محسوب نمی شود"},{"n":271,"t":"هتک حرز عبارت از نقض غیرمجاز حرز است که از طریق تخریب دیوار یا باالرفتن از آن یا بازکردن یا شکستن قفل و .امثال آن محقق می شود قانون مجازات اسالمی مصوب92"},{"n":272,"t":"هرگاه کسی مال را توسط مجنون، طفل غیرممیز، حیوان یا هر وسیله بی اراده ای از حرز خارج کند مباشر محسوب .می شود و در صورتی که مباشر طفل ممیز باشد رفتار آمر حسب مورد مشمول یکی از سرقتهای تعزیری است"},{"n":273,"t":".در صورتی که مال در حرزهای متعدد باشد، مالک، اخراج از بیرونی ترین حرز است"},{"n":274,"t":".ربایش مال به اندازه نصاب باید در یک سرقت انجام شود"},{"n":275,"t":".هرگاه دو یا چند نفر به طور مشترک مالی را بربایند باید سهم جداگانه هر کدام از آنها به حد نصاب برسد"},{"n":276,"t":".سرقت در صورت فقدان هر یک از شرایط موجب حد، حسب مورد مشمول یکی از سرقت های تعزیری است"},{"n":277,"t":"هرگاه شریک یا صاحب حق، بیش از سهم خود، سرقت نماید و مازاد بر سهم او به حد نصاب برسد، مستوجب حد .است"},{"n":278,"t":"حد سرقت به شرح زیر است • الف- در مرتبه اول، قطع چه ار انگشت دست راست سارق از انتهای آن است، به طوری که انگشت شست و کف دست .باقی بماند • ب- .در مرتبه دوم، قطع پای چپ سارق از پایین برآمدگی است، به نحوی که نصف قدم و مقداری از محل مسح باقی بماند • پ- .در مرتبه سوم، حبس ابد است • ت- در مرتبه چهارم، اعدام است هر .چند سرقت در زندان باشد تبصره1- .هرگاه سارق، فاقد عضو متعلق قطع باشد، حسب مورد مشمول یکی از سرقت های تعزیری می شود تبصره2 - درمورد بند (پ) این ماده و سایر حبس هایی که مشمول عنوان تعزیر نیست هرگاه مرتکب حین اجرای مجازات توبه نماید و مقام رهبری آزادی او را مصلحت بداند با عفو ایشان از حبس آزاد می شود. همچنین مقام رهبری می تواند مجازات او را به مجازات .تعزیری دیگری تبدیل نماید فصل هشتم- محاربه"},{"n":279,"t":"محاربه عبارت از کشیدن سالح به قصد جان، مال یا ناموس مردم یا ارعاب آنها است، به نحوی که موجب ناامنی در محیط گردد. هرگاه کسی با انگیزه شخصی به سوی یک یا چند شخص خاص سالح بکشد و عمل او جنبه عمومی نداشته باشد و .نیز کسی که به روی مردم سالح بکشد، ولی در اثر ناتوانی موجب سلب امنیت نشود، محارب محسوب نمی شود قانون مجازات اسالمی مصوب92"},{"n":280,"t":"فرد یا گروهی که برای دفاع و مقابله با محاربان .دست به اسلحه ببرد محارب نیست"},{"n":281,"t":".راهزنان، سارقان و قاچاقچیانی که دست به سالح ببرند و موجب سلب امنیت مردم و راهها شوند محاربند"},{"n":282,"t":"حد محاربه یکی از چهار مجازات :زیر است • الف- اعدام • ب- صلب • پ- قطع دست راست و پای چپ • ت- نفی بلد"},{"n":283,"t":"( انتخاب هر یک از امور چهارگانه مذکور در"},{"n":284,"t":"مدت نفی بلد در هر حال کمتر از یک سال نیست، اگر چه محارب بعد از دستگیری توبه نماید و در صورتی که توبه .نکند همچنان در تبعید باقی می ماند"},{"n":285,"t":"در نفی بلد، محارب باید تحت مرا .قبت قرار گیرد و با دیگران معاشرت، مراوده و رفت و آمد نداشته باشد فصل نهم- بغی و افساد فی االرض"},{"n":286,"t":"هر کس به طور گسترده، مرتکب جنایت علیه تمامیت جسمانی افراد، جرائم علیه امنیت داخلی یا خارجی کشور، نشر اکاذیب، اخالل در نظام اقتصادی کشور، احراق و تخریب، پخش مواد سمی و میکروبی و خطرناک یا دایرکردن مراکز فساد و فحشا یا معاونت در آنها گردد به گونه ای که موجب اخالل شدید در نظم عمومی کشور، ناامنی یا ورود خسارت عمده به تمامیت جسمانی افراد یا اموال عمومی و خصوصی، یا سبب اشاعه فساد یا فحشا در حد وسیع گردد مفسد فی االرض محسوب و به اعدام محکوم .می گردد تبصره- هرگاه دادگاه از مجموع ادله و شواهد قصد اخالل گسترده در نظم عمومی، ایجاد ناامنی، ایراد خسارت عمده و یا اشاعه فساد یا فحشا در حد وسیع و یا علم به مؤثربودن اقدامات انجام شده را احراز نکند و جرم ارتکابی مشمو ل مجازات قانونی دیگری .نباشد، با توجه به میزان نتایج زیانبار جرم، مرتکب به حبس تعزیری درجه پنج یا شش محکوم می شود"},{"n":287,"t":"گروهی که در برابر اساس نظام جمهوری اسالمی ایران، قیام مسلحانه کند باغی محسوب می شود و در صورت استفاده از سالح، اعضای آن به مجازات اع .دام محکوم می گردند قانون مجازات اسالمی مصوب92"},{"n":288,"t":"هرگاه اعضای گروه باغی، قبل از درگیری و استفاده از سالح، دستگیر شوند، چنانچه سازمان و مرکزیت آن وجود داشته باشد به حبس تعزیری درجه سه و در صورتی که سازمان و مرکزیت آن از بین رفته باشد به حبس تعزیری درجه پنج محکوم .می شوند کتاب سوم- قصاص بخش اول- مواد عمومی فصل اول- اقسام و تعاریف جنایات"},{"n":289,"t":".جنایت بر نفس، عضو و منفعت بر سه قسم عمدی ، شبه عمدی و خطای محض است"},{"n":290,"t":"جنایت در موارد زیر عمدی محسوب می شود الف- هرگاه مرتکب با انجام کاری قصد ایراد جنایت بر فرد یا افرادی معین یا فرد یا افرادی غیرمعین از یک جمع را داشته باشد و .در عمل نیز جنایت مقصود یا نظیر آن واقع شود، خواه کار ارتکابی نوعاً موجب وقوع آن جنایت یا نظیر آن بشود، خواه نشود ب- هرگاه مرتکب، عمداً کاری انجام دهد که نوعاً موجب جنایت واقع شده یا نظیر آن، می گردد، هرچند قصد ارتکاب آن جنایت و .نظیر آن را نداشته باشد ولی آگاه و متوجه بوده که آن کار نوعاً موجب آن جنایت یا نظیر آن می شود پ- ًهرگاه مرتکب قصد ارتکاب جنایت واقع شده یا نظیرآن را نداشته و کاری را هم که انجام داده است، نسبت به افراد متعارف نوعا م وجب جنایت واقع شده یا نظیر آن، نمی شود لکن در خصوص مجنی علیه، به علت بیماری، ضعف، پیری یا هر وضعیت دیگر و یا به علت وضعیت خاص مکانی یا زمانی نوعاً موجب آن جنایت یا نظیر آن می شود مشروط بر آنکه مرتکب به وضعیت نامتعارف مجنی علیه یا وضعیت خاص مکانی یا زمانی آ .گاه و متوجه باشد ت- هرگاه مرتکب قصد ایراد جنایت واقع شده یا نظیر آن را داشته باشد، بدون آن که فرد یا جمع معینی مقصود وی باشد، و در .عمل نیز جنایت مقصود یا نظیر آن، واقع شود، مانند اینکه در اماکن عمومی بمب گذاری کند تبصره1- در بند (ب) عدم آگاهی و توجه مرت کب باید اثبات گردد و در صورت عدم اثبات، جنایت عمدی است مگر جنایت واقع شده فقط به علت حساسیت زیاد موضع آسیب، واقع شده باشد و حساسیت زیاد موضع آسیب نیز غالباً شناخته شده نباشد که در این صورت آگاهی و توجه مرتکب باید اثبات شود و در صورت عدم اثبات، جنایت عمدی ث .ابت نمی شود قانون مجازات اسالمی مصوب92 تبصره2 - در بند (پ) باید آگاهی و توجه مرتکب به این که کار نوعاً نسبت به مجنی علیه، موجب جنایت واقع شده یا نظیر آن می .شود ثابت گردد و در صورت عدم اثبات، جنایت عمدی ثابت نمی شود"},{"n":291,"t":"جنایت در موارد زیر شبه عمدی محسوب می شود الف- هرگاه مرتکب نسبت به مجنی علیه قصد رفتاری را داشته لکن قصد جنایت واقع شده یا نظیر آن را نداشته باشد و از مواردی .که مشمول تعریف جنایات عمدی می گردد، نباشد ب- هرگاه مرتکب، جهل به موضوع داشته باشد مانند آنکه جنایتی را با اعتقاد به اینکه موضوع رفتار وی شیء یا حیوان و یا افراد ( مشمول"},{"n":302,"t":".) این قانون است به مجنی علیه وارد کند، سپس خالف آن معلوم گردد پ- .هرگاه جنایت به سبب تقصیر مرتکب واقع شود، مشروط بر اینکه جنایت واقع شده مشمول تعریف جنایت عمدی نباشد"},{"n":292,"t":"جنایت در موارد زیر خطای محض محسوب می :شود الف- .در حال خواب و بیهوشی و مانند آنها واقع شود ب- به .وسیله صغیر و مجنون ارتکاب یابد پ- جنایتی که در آن مرتکب نه قصد جنایت بر مجنی علیه را داشته باشد و نه قصد ایراد فعل واقع شده بر او را، مانند آنکه تیری .به قصد شکار رها کند و به فردی برخورد نماید تبصره- در مورد بندهای (الف) و (پ) هرگاه مرتکب آگاه و متوجه باشد که اقدام او نوعاً موجب جنایت بر دیگری می گردد، جنایت .عمدی محسوب می شود"},{"n":293,"t":"هرگاه فردی مرتکب جنایت عمدی گردد لکن نتیجه رفتار ارتکابی، بیشتر از مقصود وی واقع شود، چنانچه جنایت واقع شده، مشمول تعری ،ف جنایات عمدی نشود، نسبت به جنایت کمتر، عمدی و نسبت به جنایت بیشتر، شبه عمدی محسوب می شود مانند آنکه انگشت کسی را قطع کند و به سبب آن دست وی قطع شود و یا فوت کند که نسبت به قطع انگشت عمدی و نسبت به .قطع دست و یا فوت شبه عمدی است"},{"n":294,"t":"اگر کسی به علت ا شتباه در هویت، مرتکب جنایتی بر دیگری شود در صورتی که مجنی علیه و فرد مورد نظر هردو ( مشمول"},{"n":295,"t":"هرگاه کسی فعلی که انجام آن را بر عهده گرفته یا وظیفه خاصی را که قانون بر عهده او گذاشته است، ترک کند و به ،سبب آن، جنایتی واقع شود، چنانچه توانایی انجام آن فعل را داشته باشد جنایت حاصل به او مستند می شود و حسب مورد عمدی شبه عمدی، یا خطای محض است، مانند این که مادر یا دایه ای که شیردادن را بر عهده گرفته است، کودک را شیر ندهد یا پزشک یا پرستار وظیفه قانونی خو .د را ترک کند فصل دوم- تداخل جنایات"},{"n":296,"t":"اگر کسی، عمداً جنایتی را بر عضو فردی وارد سازد و او به سبب سرایت جنایت فوت کند، چنانچه جنایت واقع شده مشمول تعریف جنایات عمدی باشد، قتل عمدی محسوب می شود، در غیر این صورت، قتل شبه عمدی است و مرتکب عالوه بر .قصاص عضو به پرداخت دیه نفس نیز محکوم می شود"},{"n":297,"t":"اگر مرتکب با یک ضربه عمدی، موجب جنایتی بر عضو شود که منجر به قتل مجنی علیه گردد، چنانچه جنایت واقع شده مشمول تعریف جنایات عمدی باشد، قتل عمدی محسوب می شود و به علت نقص عضو یا جراحتی که سبب قتل شده است .به قصاص یا دیه محکوم نمی گردد"},{"n":298,"t":"اگر کسی با یک ضربه عمدی، موجب جنایات متعدد بر اعضای مجنی علیه شود، چنانچه همه آنها به طور مشترک .موجب قتل او شود و قتل نیز مشمول تعریف جنایات عمدی باشد فقط به قصاص نفس محکوم می شود"},{"n":299,"t":"اگر کسی با ضربه های متعد د عمدی، موجب جنایات متعدد و قتل مجنی علیه شود و قتل نیز مشمول تعریف جنایات ،عمدی باشد، چنانچه برخی از جنایت ها موجب قتل شود و برخی در وقوع قتل نقشی نداشته باشند، مرتکب عالوه بر قصاص نفس حسب مورد، به قصاص عضو یا دیه جنایت هایی که تأثیری در قتل ند ب جنایت در حال مستی و عدم تعادل روانی در اثر مصرف موادمخدر، روان گردان و مانند آنها، موجب قصاص است مگر اینکه ثابت شود بر اثر مستی و عدم تعادل روانی، مرتکب به کلی مسلوب االختیار بوده است که د ر این صورت، عالوه بر دیه به مجازات تعزیری مقرر در کتاب پنجم «تعزیرات» محکوم می شود. لکن اگر ثابت شود که مرتکب قبالً خود را برای چنین عملی مست کرده و یا علم داشته است که مستی و عدم تعادل روانی وی ولو نوعاً موجب ارتکاب آن جنایت یا نظیر آن از جانب او می شود ، جنایت، عمدی محسوب می .گردد"},{"n":308,"t":"اگر پس از تحقیق و بررسی به وسیله مقام قضایی، در بالغ یا عاقل بودن مرتکب، هنگام ارتکاب جنایت، تردید وجود داشته باشد و ولی دم یا مجنی علیه ادعاء کند که جنایت عمدی در حال بلوغ وی یا افاقه او از جنون سابقش انجام گرفته است لکن مرتکب خالف آن را ادعاء کند، ولی دم یا مجنی علیه باید برای ادعاء خود بینه اقامه کند. در صورت عدم اقامه بینه، قصاص منتفی است. اگر حالت سابق بر زمان جنایت، افاقه مرتکب بوده است، مرتکب باید جنون خود در حال ارتکاب جرم را اثبات کند تا قصاص ساقط شود؛ در غ یر این صورت با سوگند ولی دم یا مجنی علیه یا ولی او قصاص ثابت می .شود"},{"n":309,"t":"این ادعاء ،که مرتکب، پدر یا یکی از اجداد پدری مجنی علیه است، باید در دادگاه ثابت شود و در صورت عدم اثبات حق قصاص، حسب مورد، با سوگند ولی دم یا مجنی علیه یا ولی او ثابت می .شود قانون مجازات اسالمی مصوب92"},{"n":310,"t":"هرگاه غیرِمسلمان، مرتکب جنایت عمدی بر مسلمان، ذمی، مستأمن یا معاهد شود، حق قصاص ثابت است. در این امر، تفاوتی میان ادیان، فرقه ها و گرایش ،های فکری نیست. اگر مسلمان، ذمی، مستأمن یا معاهد، بر غیرِمسلمانی که ذمی مستأمن و معاهد نیست جنایتی وارد کند، قصاص نمی شود. در این صورت مرتکب به مجازات تعزیری مقرر در کتاب پنجم «تعزیرات» محکوم می .شود تبصره1- غیرمسلمانانی که ذمی، مستأمن و معاهد نیستند و تابعیت ایران را دارند یا تابعیت کشورهای خارجی را دارند و با رعایت قوانین و مقررات وارد کشور شده اند، در حکم مستأمن می .باشند تبصره2 - اگر مجنی علیه غیرمسلمان باشد و مرتکب پیش از اجرای قصاص، مسلمان شود، قصاص ساقط و عالوه بر پرداخت دیه به مجازات تعزیری مقرر در کتاب پنجم «تعزیرات»، محکوم می .شود"},{"n":311,"t":"اگر پس از تحقیق و بررسی به وسیله مقام قضایی، در مسلمان بودن مجنی علیه، هنگام ارتکاب جنایت، تردید وجود داشته و حالت او پیش از جنایت، عدم اسالم باشد و ولی دم یا مجنی علیه ادعاء کند که جنایت عمدی در حال اسالم او انجام شده است و مرتکب ادعاء کند که ارتکاب جنایت، پیش از اسالم آوردن وی بوده است، ادعای ولی دم یا مجنی علیه باید ثابت شود و در صورت عدم اثبات، قصاص منتفی است و مرتکب به پرداخت دیه و مجازات تعزیری مقرر در کتاب پنجم «تعزیرات» محکوم می شود. اگر حالت پیش از زمان جنایت، اسالم او بوده است، وقوع جنایت در حالت عدم اسالم مجنی علیه باید اثبات شود تا قصا ص ساقط گردد و در صورت عدم اثبات، حسب مورد با سوگند ولی دم یا مجنی علیه یا ولی او قصاص ثابت می شود. حکم این ماده در صورتی که در مجنون بودن مجنی .علیه تردید وجود داشته باشد نیز جاری است فصل چهارم- راه های اثبات جنایت"},{"n":312,"t":"جنایات عالوه بر طرق مقرر در کتاب اول «کلیات» این قانون از طریق قسامه نیز ثابت می .شود"},{"n":313,"t":"قسامه عبارت از سوگند هایی است که در صورت فقدان ادله دیگر غیر از سوگند منکر و وجود لوث، شاکی برای اثبات جنایت عمدی یا غیرعمدی یا خصوصیات آن و متهم برای دفع اتهام از خود اقامه می ک.ند"},{"n":314,"t":"لوث عبارت از وجود قرائن و اماراتی است که موجب ظن قاضی به ارتکاب جنایت یا نحوه ارتکاب از جانب متهم می .شود"},{"n":315,"t":"فقدان قرائن و امارات موجب ظن و صرف حضور فرد در محل وقوع جنایت، از مصادیق لوث محسوب نمی شود و او با ادای یک سوگند، تبرئه می .گردد قانون مجازات اسالمی مصوب92"},{"n":316,"t":"مقام قضایی موظف است در صورت استناد به قسامه، قرائن و امارات موجب لوث را در حکم خود ذکر کند. مواردی که سوگند یا قسامه، توسط قاضی رد می .شود، مشمول این حکم است"},{"n":317,"t":"در صورت حصول لوث، نخست از متهم، مطالبه دلیل بر نفی اتهام می شود. اگر د لیلی ارائه شود، نوبت به قسامه شاکی نمی رسد و متهم تبرئه می گردد. در غیر این صورت با ثبوت لوث، شاکی می تواند اقامه قسامه کند یا از متهم درخواست .قسامه نماید"},{"n":318,"t":"اگر شاکی اقامه قسامه نکند و از مطالبه قسامه از متهم نیز خودداری ورزد، متهم در جنایات عمدی، با تأمین مناسب و در جنایات غیر عمدی، بدون تأمین آزاد می شود لکن حق اقامه قسامه یا مطالبه آن برای شاکی باقی می .ماند تبصره- در مواردی که تأمین گرفته می شود، حداکثر سه ماه به شاکی فرصت داده می شود تا اقامه قسامه نماید یا از متهم مطالبه قسامه کند و پس از پایان مهلت از تأمین أخذ شده رفع اثر می .شود"},{"n":319,"t":"اگر شاکی از متهم درخواست قسامه کند و وی حاضر به قسامه نشود به پرداخت دیه محکوم می شود و اگر اقامه قسامه کند، تبرئه می گردد و شاکی حق ندارد برای بار دیگر، با قسامه یا بینه، دعوی را علیه او تجدی د کند. در این مورد متهم نمی .تواند قسامه را به شاکی رد نماید"},{"n":320,"t":"اقامه قسامه یا مطالبه .آن از متهم، باید حسب مورد، توسط صاحب حق قصاص یا دیه، یا ولی یا وکیل آنها باشد همچنین است اقامه قسامه برای برائت متهم که حسب مورد به وسیله متهم، ولی یا وکیل آنها صورت می گیرد. اتیان سوگند به .وسیله افراد قابل توکیل نیست"},{"n":321,"t":"اگر مجنی علیه یا ولی دم فوت کند هر یک از وارثان متوفی، بدون نیاز به توافق دیگر ورثه متوفی یا دیگر اولیای دم ، حق مطالبه یا اقامه .قسامه را دارند"},{"n":322,"t":"اگر برخی از ورثه ، اصل اتهام یا برخی خصوصیات آن را از متهم نفی کنند، حق دیگران با وجود لوث، برای اقامه قسامه .محفوظ است"},{"n":323,"t":"اگر چند نفر، متهم به شرکت در یک جنایت باشند و لوث علیه همه آنان باشد، اقامه یک قسامه برای اثبات شرکت آنان در ارتکاب جنایت، کافی است و لزومی به .اقامه قسامه برای هر یک نیست قانون مجازات اسالمی مصوب92"},{"n":324,"t":"اگر شاکی ادعاء کند که تنها یک شخص معین از دو یا چند نفر، مجرم است و قسامه بر شرکت در جنایت اقامه شود شاکی نمی تواند غیر از آن یک نفر را قصاص کند و چنانچه دیه قصاص شونده بیش از سهم دیه جنایت او باشد شریک یا شرکای د یگر باید مازاد دیه مذکور را به قصاص .شونده بپردازند. رجوع شاکی از اقرارِ به انفراد مرتکب، پس از اقامه قسامه مسموع نیست"},{"n":325,"t":"اگر برخی از صاحبان حق قصاص یا دیه از متهم درخواست قسامه کنند، قسامه متهم فقط حق مطالبه کنندگان را ساقط می کند و حق دیگران بر ای اثبات ادعایشان محفوظ است و اگر بتوانند موجب قصاص را اثبات کنند، باید پیش از استیفای .قصاص، سهم دیه گروه اول را حسب مورد به خود آنها یا به مرتکب بپردازند"},{"n":326,"t":"اگر شاکی علی رغم حصول لوث علیه متهم اقامه قسامه نکند و از او مطالبه قسامه کند و متهم دربا ره اصل جنایت یا خصوصیات آن، ادعای عدم علم کند ، شاکی می توا ,"t":"قتل یا هر جنایت دیگر، می تواند نسبت به هر یک از شرکا حسب مورد عمدی، شبه .عمدی یا خطای محض باشد"},{"n":370,"t":"ثابت نبودن حق قصاص بر بعضی از شر کاء به هر دلیل، مانند فقدان شرطی از شرایط معتبر در قصاص یا غیرعمدی بودن جنایت نسبت به او، مانع از حق قصاص بر دیگر شرکا نیست و هر یک از شرکا حکم خود را دارند ."},{"n":371,"t":"هرگاه کسی آسیبی به شخصی وارد کند و بعد از آن دیگری او را به قتل برساند قاتل همان نفر د وم است اگر چه آسیب سابق به تنهایی موجب مرگ می گردید و اولی فقط به قصاص عضو محکوم می .شود"},{"n":372,"t":"هرگاه کسی آسیبی به شخصی وارد کند به گونه ای که وی را در حکم مرده قرار دهد و تنها آخرین رمق حیات در او باقی بماند و در این حال دیگری با انجام رفتاری به حی ات غیرمستقر او پایان دهد نفر اول قصاص می شود و نفر دوم به مجازات جنایت بر میت محکوم می ( گردد. حکم این ماده و"},{"n":373,"t":"در موارد شرکت در جنایت عمدی، حسب مورد ، مجنی علیه یا ولی دم می تواند یکی از شرکا در جنایت عمدی را قصاص کند و دیگران باید بالفاصله سهم خود از دیه را به قصاص شونده بپردازند و یا این که همه شرکا یا بیش از یکی از آنان را قصاص قانون مجازات اسالمی مصوب92 کند ، مشروط بر این که دیه مازاد بر جنایت پدیدآمده را پیش از قصاص، به قصاص شوندگان بپردازد. اگر قصاص شوندگان همه شرکا نباشند، هر یک از شرکا که قصاص نمی .شود نیز باید سهم خود از دیه جنایت را به نسبت تعداد شرکا بپردازد تبصره- اگر مجنی علیه یا ولی دم، خواهان قصاص برخی از شرکا باشد و از حق خود نسبت به برخی دیگر مجانی گذشت کند یا با آنان مصالحه نماید، در صورتی که دیه قصاص شوندگان بیش از سهم جنایتشان باشد، باید پیش از قصاص، مازاد دیه آنان را به قصاص .شوندگان بپردازد"},{"n":374,"t":"هرگاه دیه جنایت، بیش از دیه مقابل آن جنایت در مرتکب باشد مانند این که زنی، مردی را یا غیرمسلمانی، مسلمانی را عمداً به قتل برساند یا دست وی را قطع کند، اگر مرتکب یک نفر باشد، صاحب حق قصاص افزون بر قصاص، حق گرفتن فاضل دیه را ندارد و اگر مرتکبان متعدد باشند، صاحب حق قصاص می تواند پس از پرداخت مازاد دیه قصاص شوندگان بر دیه جنایت به آنان، همگی را قصاص کند . همچنین می ،تواند به اندازه دیه جنایت از شرکا در جنایت، قصاص کند و چیزی نپردازد، که در این صورت، شرکایی که قصاص نمی شوند، سهم دیه خود از جنایت را به قصاص شوندگان می پردازند. افزون بر این، صاحب حق قصاص می تواند یکی از آنان را که دیه اش کمتر از دیه جنایت است، قصاص کند و فاضل دیه را از دیگ ر شرکا بگیرد لکن صاحب حق قصاص نمی تواند بیش از این مقدار را از هر یک مطالبه کند، مگر در صورتی که بر مقدار بیشتر مصالحه نماید. همچنین اگر صاحب حق قصاص خواهان قصاص همه آنان که دیه مجموعشان بیش از دیه جنایت است باشد، نخست باید فاضل دیه قصاص شونده نسبت به .سهمش از جنایت را به او بپردازد و سپس قصاص نماید فصل هفتم - اکراه در جنایت"},{"n":375,"t":"اکراه در قتل مجوز قتل نیست و مرتکب، قصاص می شود و اکراه کننده، به حبس ابد محکوم می .گردد تبصره1- اگر اکراه شونده طفل غیرممیز یا مجنون باشد فقط اکراه کننده محکوم به .قصاص است تبصره2 - اگر اکراه شونده طفل ممیز باشد عاقله او دیه مقتول را می پردازد و اکراه کننده به حبس ابد محکوم می .شود"},{"n":376,"t":"مجازات حبس ابد برای اکراه کننده مشروط به وجود شرایط عمومی قصاص در اکراه کننده و حق اولیای دم می باشد و قابل گذشت و مصا لحه است. اگر اکراه کننده به هر علت به حبس ابد محکوم نشود ، به مجازات معاون در قتل محکوم می .شود"},{"n":377,"t":".اکراه در جنایت بر عضو موجب قصاص اکراه کننده است قانون مجازات اسالمی مصوب92"},{"n":378,"t":"ادعای اکراه برجنایت بر عضو باید در دادگاه ثابت شود و در صورت عدم اثبات با سوگند صاحب حق قصاص، مباشر قصاص می .شود"},{"n":379,"t":"هرگاه کسی دیگری را به رفتاری اکراه کند که موجب جنایت بر اکراه شونده گردد، جنایت عمدی است و اکراه کننده قصاص می شود مگر اکراه کننده قصد جنایت بر او را نداشته و آگاهی و توجه به اینکه این اکراه نوعاً موجب جنایت بر او می شود نیز نداشته باشد که در این صورت جنایت شبه عمدی است و اکراه کننده به پرداخت دیه محکوم می .شود"},{"n":380,"t":"اگر شخصی برای دفاع و رهایی از اکراه با رعایت شرایط مقرر در دفاع مشروع، مرتکب قتل اکراه کننده شود یا آسیبی به او وارد کند ، قصاص، دیه و تعزیر ندا رد . بخش دوم - قصاص نفس"},{"n":381,"t":"مجازات قتل عمدی در صورت تقاضای ولی دم و وجود سایر شرایط مقرر در قانون، قصاص و در غیر این صورت مطابق مواد دیگر این قانون از حیث دیه و تعزیر عمل می .گردد"},{"n":382,"t":"هرگاه زن مسلمانی عمداً کشته شود، حق قصاص ثابت است لکن اگر قاتل، مرد مسلمان باشد، ولی دم باید پیش از قصاص، نصف دیه کامل را به او بپردازد و اگر قاتل، مرد غیرمسلمان باشد، بدون پرداخت چیزی قصاص می شود. در قصاص مرد غیرمسلمان به سبب قتل زن غیرمسلمان، پرداخت مابه .التفاوت دیه آنها الزم است"},{"n":383,"t":"اگر یک نفر، د و یا چند نفر را عمداً به قتل برساند، اولیای دم هر یک از مقتوالن می توانند به تنهایی و بدون گرفتن رضایت اولیای مقتوالن دیگر و بدون پرداخت سهمی.از دیه به آنان اقدام به قصاص کنند"},{"n":384,"t":"اگر یک نفر، دو یا چند نفر را عمداً به قتل برساند و اولیای دم همه مقتوالن، خواهان قصاص باشند، قاتل بدون این که دیه ای بپردازد، قصاص می ،شود. اگر اولیای دم برخی از مقتوالن، خواهان قصاص باشند و اولیای دم مقتول یا مقتوالن دیگر خواهان دیه باشند، درصورت موافقت قاتل به پرداخت دیه به آنان در مقابل گذشت از حق قصاص شان، دیه آن ان از اموال قاتل پرداخت می .شود و بدون موافقت قاتل، حق اخذ دیه از او و یا اموالش را ندارند"},{"n":385,"t":"اگر قتل در یکی از ماه های حرام (محرم، رجب، ذی القعده و ذی الحجه) یا در حرم مکه مکرمه واقع شده باشد یا قاتل در زمان یا مکان مذکور، قصاص گردد و قصاص مست لزم پرداخت فاضل دیه از سوی ولی دم به قاتل باشد ، فاضل دیه تغلیظ نمی شود . همچنین دیه ای که ولی دم به دیگر اولیاء می پردازد تغلیظ نمی شود، لکن اگر قتل در زمان یا مکان مذکور باشد، دیه قانون مجازات اسالمی مصوب92 ای که شرکای قاتل، به علت سهمشان از جنایت، حسب مورد به قصاص شونده یا ولی دم و یا به هر دوی آنان می پردازند، تغلیظ می .شود بخش سوم - قصاص عضو فصل اول- موجب قصاص عضو"},{"n":386,"t":"مجازات جنایت عمدی بر عضو در صورت تقاضای مجنی علیه یا ولی او و وجود سایر شرایط مقرر در قانون، قصاص و در غیر این صورت مطابق قانون از حیث دیه و تعزیر عمل می .گردد"},{"n":387,"t":"جنایت بر عضو عبارت از هر آسیب کمتر از قتل مانند قطع عضو، جرح و صدمه .های وارد بر منافع است"},{"n":388,"t":"زن و مرد مسلمان، در قصاص عضو برابرند و مرد به سبب آسیبی که به زن وارد می کند، به قصاص محکوم می شود لکن اگر دیه جنایت وارد بر زن ، مساوی یا بیش از ثلث دیه کامل باشد، قصاص پس از پرداخت نصف دیه عضو مورد قصاص به مرد، اجرا می شود. حکم مذکور درصورتی که مجنی علیه زن غیرمسلمان و مرتکب مرد غیرمسلمان باشد نیز جاری است. ولی اگر مجنی علیه، زن مسلمان و مرتکب، مرد غیرمسلمان باشد، مرتکب بدون پرداخت نصف دیه، قصاص می .شود"},{"n":389,"t":"اگر به علت یک یا چند ضربه، جنایت ،های متعددی در یک یا چند عضو به وجود آید، حق قصاص برای هر جنایت به طور جداگانه ثابت است و مجنی علیه می تواند درباره بعضی با مرتکب مصالحه نماید، نسبت به بعضی دیگر گذشت و بعضی را .قصاص کند"},{"n":390,"t":"اگر جنایت بر عضو، دارای مراتب باشد، مجنی علیه می تواند با رضایت مرتکب قسمتی از جنایت را قصاص کند مانند آن که در جراحت موضحه به متالحمه و در قطع دست از آرنج به قطع دست از مچ بسنده و از قصاص قسمت دیگر گذشت یا .مصالحه نماید"},{"n":391,"t":"هرگاه کسی جنایت عمدی بر اعضای متعدد یک نفر وارد کند و امکان قصاص همه آنها نباشد مانند این که هر دو دست یک نفر را قطع کند و خود یک دست بیشتر نداشته باشد ، مرتکب در مقابل جنایت هایی که قصاص آن امکان دارد، قصاص می شود و برای دیگر جنایات ، به پرداخت دیه و ت عزیر مقرر در کتاب پنجم «تعزیرات» محکوم می .شود"},{"n":392,"t":"هرگاه کسی جنایت عمدی براعضای چند نفر وارد کند، اگر امکان قصاص همه آنها باشد، قصاص می شود و اگر امکان قصاص برای همه جنایات نباشد مجنی علیه اول که جنایت بر او پیش از دیگری واقع شده است، در استیفای قص اص مقدم است و در صورت انجام قصاص، مرتکب برای جنایاتی که محلی برای قصاص آن نیست به پرداخت دیه و تعزیر مقرر در کتاب پنجم قانون مجازات اسالمی مصوب92 «تعزیرات» محکوم می شود. اگر وقوع دو جنایت، در یک زمان باشد، هریک از دو مجنی علیه می توانند مبادرت به قصاص کنند و پس از استیفای قصاص، بر ای دیگر جنایت هایی که قصاص ممکن نیست، مرتکب به پرداخت دیه و تعزیر مقرر در کتاب پنجم «تعزیرات» محکوم می شود. درصورتی که پس از قصاص اول، محل قصاص برای مجنی علیه دوم باقی باشد لکن کمتر از عضو مورد جنایت از او باشد، می تواند مقدار موجود را قصاص کند و مابه التفاوت را دیه بگیرد مانند این که مرتکب، نخست انگشت دست راست کسی و آن گاه دست راست شخص دیگری را قطع کرده باشد که در این صورت، مجنی علیه اول در اجرای قصاص مقدم است و با اجرای قصاص او، مجنی علیه دوم می تواند دست راست مرتکب را قصاص کند و دیه انگشت خود را .نیز از او بگیرد فصل دوم- شرایط قصاص عضو"},{"n":393,"t":"در قصاص عضو، عالوه بر شرایط عمومی قصاص، شرایط
