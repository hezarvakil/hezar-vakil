ه موجب تغ ییر رنگ پوست یا ورم بدن می شود، قصاص ساقط است و مرتکب عالوه بر پرداخت دیه به تعزیر مقرر در کتاب پنجم «تعزیرات» نیز محکوم می .شود .حکم مذکور در هر مورد دیگری که خطر تجاوز در قصاص عضو یا منافع وجود داشته باشد نیز جاری است"},{"n":402,"t":"اگر شخصی یک چشم کسی را د رآورد یا کور کند، قصاص می شود، گرچه مرتکب بیش از یک چشم نداشته باشد و دیه ای به وی پرداخت نمی .شود. این حکم در مورد همه اعضای زوج بدن جاری است"},{"n":403,"t":"اگر شخصی که دارای دو چشم است، چشم کسی را که فقط یک چشم دارد، درآورد یا آن را کور کند، مجنی علیه می تواند یک چشم مرتکب را قصاص کند و نصف دیه کامل را هم دریافت دارد یا از قصاص یک چشم مرتکب منصرف شود و دیه کامل ،بگیرد مگر اینکه مجنی علیه یک چشم خود را قبالً در اثر قصاص یا جنایتی که استحقاق دیه آن را داشته است، از دست داده باشد که در این صورت می تواند یک.چشم مرتکب را قصاص کند و یا با رضایت مرتکب، نصف دیه کامل را دریافت نماید"},{"n":404,"t":"اگر شخصی بدون آسیب رساندن به حدقه چشم دیگری، بینایی آن را از بین ببرد، فقط بینایی چشم مرتکب، قصاص می شود. چنانچه بدون آسیب به حدقه چشم مرتکب، قصاص ممکن نباشد ، تبدیل به دیه می شود و مرتکب به پرداخت دیه و تعزیر مقرر در قانون محکوم می .شود قانون مجازات اسالمی مصوب92"},{"n":405,"t":"چشم سالم، در برابر چشم هایی که از لحاظ دید و یا شکل، متعارف نیستند، قصاص می .شود"},{"n":406,"t":"پلک دارای مژه، در برابر پلک بدون مژه قطع نمی شود لکن پلک چشم بینا در برابر پلک چش م نابینا قصاص می .شود"},{"n":407,"t":"قطع الله گوش که موجب زوال شنوایی یا قطع بینی که موجب زوال بویایی شود، دو جنایت محسوب می .شود"},{"n":408,"t":".قطع بینی یا گوش، موجب قصاص است گرچه حسب مورد حس بویایی و شنوایی نداشته باشند"},{"n":409,"t":"قطع زبان یا لب، موجب قصاص .است و باید مقدار و محل آنها رعایت شود"},{"n":410,"t":"اگر شخص گویا، زبان کسی را که الل است قطع کند، قصاص ساقط است و دیه گرفته می شود لکن زبان کسی که الل است، در برابر زبان الل دیگری و زبان گویا قصاص می شود و زبان دارای حس چشایی در برابر زبان بدون حس چشایی قصا ص می .شود"},{"n":411,"t":"زبان گویا در برابر زبان کودکی که هنوز به حد سخن گفتن نرسیده است، قصاص می شود مگر آن که الل بودن کودک .ثابت شود"},{"n":412,"t":"اگر کسی دندان دیگری را بشکند یا بکند به قصاص محکوم می ،شود و در قصاص آن، رعایت تساوی در محل دندان .الزم است"},{"n":413,"t":"اگر دندان کسی توسط دیگری کنده شود، چنانچه تا زمان قصاص، دندان سالمی به جای آن بروید، مرتکب قصاص نمی شود و به تعزیر مقرر در کتاب پنجم «تعزیرات» و ارش جراحت و مدتی که مجنی علیه بدون دندان بوده است محکوم می .شود اگر دندان جدید معیوب باشد، مرتکب افزون بر محکومیت های مذکور، به پرداخت ارش عیب نیز محکوم می شود. اگر مجنی علیه کودک باشد، صدور حکم به مدت متعارف برای روییدن دندان به تأخیر می افتد و در صورت رویش دندان یک صدم دیه پرداخت می شود. اگر مجنی ،علیه در این مدت فوت کند، مرتکب افزون بر تعزیر مذکور به پرداخت دیه محکوم می .شود"},{"n":414,"t":"اگر دندان مرتکب، شیری و دندان مجنی علیه غیرشیری باشد، مجنی علیه بین قصاص دندان شیری و تأخیر قصاص .تا رویش دندان غیرشیری در مرتکب، مختار است"},{"n":415,"t":"اگر دندان مجنی علیه پس از اجرای قصاص یا گرفتن دیه بروید، چیزی برعهد ه مجنی علیه نیست و اگر گرفتن دیه به جهت عدم امکان قصاص بوده باشد دیه نیز بازگردانده نمی .شود قانون مجازات اسالمی مصوب92"},{"n":416,"t":".اگر دندان مرتکب، پس از اجرای قصاص بروید، مجنی علیه حق قصاص دوباره آن را ندارد بخش چهارم- اجرای قصاص فصل اول- مواد عمومی"},{"n":417,"t":"در اجرای قصاص، اذن .مقام رهبری یا نماینده او الزم است"},{"n":418,"t":"استیذان از مقام رهبری در اجرای قصاص، برای نظارت بر صحت اجراء و رعایت حقوق صاحب حق قصاص و اطراف دیگر دعوی است و نباید مراسم استیذان، مانع از امکان استیفای قصاص توسط صاحب حق قصاص و محروم شدن او از حق خود .شود"},{"n":419,"t":"اجرای قصاص و مباشرت در آن، حسب مورد، حق ولی دم و مجنی علیه است که در صورت مرگ آنان، این حق به ورثه ایشان منتقل می شود و باید پس از استیذان از مقام رهبری از طریق واحد اجرای احکام کیفری مربوط انجام.گیرد"},{"n":420,"t":"اگر صاحب حق قصاص، بر خالف مقررات اقد ام به قصاص کند به تعزیر مقرر در کتاب پنجم «تعزیرات» محکوم می .شود"},{"n":421,"t":"هیچ ،کس غیر از مجنی علیه یا ولی او حق قصاص مرتکب را ندارد و اگر کسی بدون اذن آنان او را قصاص کند .مستحق قصاص است"},{"n":422,"t":"در هر حق قصاصی هر یک از صاحبان آن به طور مستقل حق قصاص دارند لکن هیچ یک از آنان در مقام استیفای نباید حق دیگران را از بین ببرد و در صورتی ،که بدون اذن و موافقت دیگر افرادِ خواهانِ قصاص، مبادرت به استیفای قصاص کند .ضامن سهم دیه دیگران است"},{"n":423,"t":"در هر حق قصاصی اگر بعضی از صاحبان آن، خواهان دیه باشند یا از ق صاص مرتکب گذشت کرده باشند، کسی که خواهان قصاص است باید نخست سهم دیه دیگران را در صورت گذشت آنان به مرتکب و در صورت درخواست دیه به خود آنان .بپردازد"},{"n":424,"t":"در هر حق قصاصی اگر بعضی از صاحبان آن، غایب باشند و مدت غیبت آنان کوتاه باشد صدور حکم تا آمدن غایب به تعویق می افتد و اگر غیبت طوالنی باشد و یا امیدی به بازگشتن آنان نباشد مقام رهبری به عنوان ولی غایب به جای آنان تصمیم می گیرد و چنانچه زمان بازگشت معلوم نباشد مقام رهبری برای آنها پس از گذشت زمان کوتاه و قبل از طوالنی شدن زمان غیبت قانون مجازات اسالمی مصوب92 اتخاذ تصمیم می نمای د، کسانی که حاضرند، می توانند پس از تأمین سهم غایبان در دادگاه ، قصاص کنند و اگر حاضران، گذشت کنند یا با او مصالحه نمایند، حق قصاص غایبان محفوظ است و اگر آنان پس از حاضر شدن، خواهان قصاص باشند، باید نخست سهم دیه کسانی را که گذشت نموده اند یا با مرتکب مصال حه کرده .اند به مرتکب بپردازند و سپس قصاص کنند"},{"n":425,"t":"اگر مرتکب عمداً جنایتی بر دیگری وارد کند و دیه جنایت وارد شده بر مجنی علیه بیش از دیه آن در مرتکب باشد مانند آنکه زن مسلمانی مرد مسلمانی را به قتل برساند صاحب حق قصاص نمی تواند افزون بر قصاص، تفاوت .دیه را نیز مطالبه کند"},{"n":426,"t":"در موارد ثبوت حق قصاص، اگر دیه جنایت وارده بر مجنی علیه کمتر از دیه آن در مرتکب باشد، صاحب حق قصاص در صورتی می تواند قصاص را اجراء کند که نخست فاضل دیه را به او بپردازد و بدون پرداخت آن اجرای قصاص جایز نیست و در صورت مخال فت و اقدام به قصاص، افزون بر الزام به پرداخت فاضل دیه، به مجازات مقرر در کتاب پنجم «تعزیرات» محکوم می .شود"},{"n":427,"t":"در مواردی که صاحب حق قصاص برای اجرای قصاص باید بخشی از دیه را به دیگر صاحبان حق قصاص بپردازد ، پرداخت آن باید پیش از قصاص صورت گیرد و در صورت تخلفِ صاحبِ حقِ قصاص از این امر ، افزون بر پرداخت دیه مذکور به مجازات مقرر درکتاب پنجم «تعزیرات» محکوم می .شود"},{"n":428,"t":"در مواردی که جنایت، نظم و امنیت عمومی را بر هم زند یا احساسات عمومی را جریحه دار کند و مصلحت در اجرای قصاص باشد لکن خواهان قصا ص تمکن از پرداخت فاضل دیه یا سهم دیگر صاحبان حق قصاص را نداشته باشد، با درخواست دادستان و تأیید رییس قوه قضاییه، مقدار مذکور از بیت المال پرداخت می .شود"},{"n":429,"t":"در مواردی که محکوم به قصاص، در زندان است و صاحب حق قصاص، بدون عذر موجه یا به علت ناتوانی د ر پرداخت فاضل دیه یا به جهت انتظار برای بلوغ یا افاقه ولی دم یا مجنی علیه، مرتکب را در وضعیت نامعین رها نماید، با شکایت محکوم علیه از این امر، دادگاه صادرکننده حکم، مدت مناسبی را مشخص و به صاحب حق قصاص اعالم می کند تا ظرف مهلت مقرر نسبت به گذشت، مصالحه یا اجرای قصاص اقدام کند. در صورت عدم اقدام او در این مدت ، دادگاه می تواند پس از تعیین تعزیر براساس کتاب پنجم «تعزیرات» و گذشتن مدت زمان آن با أخذ وثیقه مناسب و تأیید رییس حوزه قضایی و رییس کل دادگستری استان تا تعیین تکلیف از سوی صاحب حق قصاص، مرتکب را آزاد .کند"},{"n":430,"t":"در موارد لزوم پرداخت فاضل دیه اگر مقتول یا صاحب حق قصاص، طلبی از مرتکب داشته باشد، طلب مذکور با رضایت .صاحب آن، هر چند بدون رضایت مرتکب، به عنوان فاضل دیه، قابل محاسبه است قانون مجازات اسالمی مصوب92"},{"n":431,"t":"فاضل دیه یا سهم پرداختی شرکا از دیه جنایت، متعلق به قصاص شونده است و او می تواند آن را به صاحب حق قصاص یا شرکای خود ببخشد و یا هر نوع تصرف مالکانه دیگری در آن انجام دهد لکن اگر آن را دریافت کرده باشد و قصاص .صورت نگیرد، باید آن را برگرداند"},{"n":432,"t":"هرگاه مجنی علیه پیش از استیفای حقِ قصاص، فوت کند و ترکه ا و برای ادای دیون او کافی نباشد، صاحب حق قصاص، بدون اداء یا تضمین آن دیون، حق استیفای قصاص را دارد لکن حق گذشت مجانی، بدون اداء یا تضمین دیون را ندارد و اگر به هر علت، قصاص به دیه تبدیل شود، باید در ادای دیون مذکور صرف شود. این حکم در مورد ترکه مقتول نیز جا .ری است"},{"n":433,"t":"اگر مجنی علیه یا همه اولیای دم، پیش از قصاص یا در حین اجرای آن از قصاص مرتکب گذشت کنند، قصاص متوقف می شود و آنان ضامن خساراتی که در حین اجرای قصاص به مرتکب رسیده است، نمی باشند و اگر برخی از آنان گذشت نمایند یا مصالحه کنند، خواهان قصا .ص باید پیش از اجرای قصاص، سهم آن ها را حسب مورد به آنان یا مرتکب بپردازد"},{"n":434,"t":"هرگاه کسی فردی را که مرتکب جنایت عمدی شده است فراری دهد به تحویل وی الزام می شود. اگر در موارد قتل و جنایت بر عضو که منجر به قطع یا نقص عضو یا از بین رفتن یکی از منافع آن شده است، بازداشت فراری دهنده مؤثر در حضور مرتکب یا الزام فراری دهنده به احضار مرتکب باشد، دادگاه باید با درخواست صاحب حق قصاص تا زمان دستگیری مرتکب، فراری دهنده را بازداشت کند. اگر مرتکب پیش از دستگیری بمیرد یا دستگیری وی متعذر شود یا صاحب حق قصاص رضای ت دهد، فراری دهنده آزاد می شود و صاحب حق قصاص در همه موارد قصاص نفس و عضو، می تواند در صورت فوت مرتکب یا تعذر دستگیری او، دیه را از اموال وی یا فراری دهنده بگیرد. فراری دهنده می .تواند پس از پرداخت دیه برای دریافت آن به مرتکب رجوع کند"},{"n":435,"t":"هرگاه در جنایت عمدی، به علت مرگ یا فرار، دسترسی به مرتکب ممکن نباشد با درخواست صاحب حق، دیه جنایت از اموال مرتکب پرداخت می شود و در صورتی که مرتکب مالی نداشته باشد در خصوص قتل عمد، ولی دم می تواند دیه را از عاقله بگیرد و در صورت نبود عاقله یا عدم دسترسی به آ ن ها یا عدم تمکن آن ها، دیه از بیت المال پرداخت می شود و در غیرقتل، دیه بر بیت المال خواهد بود. چنانچه پس از اخذ دیه، دسترسی به مرتکب جنایت اعم از قتل و غیرقتل، ممکن شود درصورتی که اخذ دیه به جهت گذشت از قصاص نباشد، حق قصاص حسب مورد برای ولی دم یا مجن ،ی علیه محفوظ است، لکن باید قبل از قصاص .دیه گرفته شده را برگرداند فصل دوم- اجرای قصاص نفس"},{"n":436,"t":"قصاص نفس فقط به شیوه های متعارف، که کمترین آزار را به قاتل می رساند، جایز است و مثله کردن او پس از قصاص، ممنوع و موجب دیه و تعزیر مقرر در کتاب پنجم .«تعزیرات» است قانون مجازات اسالمی مصوب92"},{"n":437,"t":"زن حامله، که محکوم به قصاص نفس است، نباید پیش از وضع حمل قصاص شود. اگر پس از وضع حمل نیز بیم تلف طفل باشد، تا زمانی که حیات طفل محفوظ بماند، قصاص به تأخیر می .افتد"},{"n":438,"t":"اگر پس از اجرای قصاص نفس، قاتل زنده بماند، حق قصاص برای ولی دم محفوظ است لکن اگر وی را به گونه ای که جایز نیست، قصاص کرده باشد، در صورتی که قاتل آسیب ببیند مشروط به شرایط قصاص عضو از جمله عدم خوف تلف ولی دم، قاتل حق قصاص عضو او را دارد و حق قصاص نفس نیز برای ولی دم باقی است ولی قبل از اجرای قصاص نفس، قاتل بای د حق خود را استیفاء، مصالحه یا گذشت کند لکن اگر ولی دم نخواهد دوباره قصاص کند، قاتل حق قصاص او را ندارد. اگر قاتل برای فرار از قصاص نفس حاضر به گذشت، مصالحه و استیفای حق خود نشود با شکایت ولی دم از این امر، دادگاه مدت مناسبی را مشخص و به قاتل اعالم می کند تا ظرف مهلت مقرر به گذشت، مصالحه یا مطالبه قصاص عضو اقدام کند. در صورت عدم اقدام او در این مدت، ولی دم به تعزیر مقرر در قانون محکوم می شود و با مطالبه او قصاص نفس اجراء می گردد و حق قصاص عضو .برای ورثه جانی، محفوظ است فصل سوم- اجرای قصاص عضو"},{"n":439,"t":"ابزار قطع و جرح در قصاص عضو باید تیز، غیرآلوده و مناسب با اجرای قصاص باشد و ایذاء مرتکب، بیش از مقدار جنایت او ممنوع و موجب تعزیر مقرر در قانون است. اگر مرتکب، بیمار یا شرایط زمان و مکان به گونه ای باشد که در قصاص، بیم سرایت به نفس یا صدمه دیگر باشد ،در صورت امکان ، موانع رفع و قصاص اجراء می شود. در غیر این صورت تا برطرف شدن بیم سرایت ، قصاص به تأخیر می.افتد"},{"n":440,"t":"قصاص عضو را می ،توان فوراً اجراء کرد لکن اگر علم به سرایت وجود نداشته باشد و قصاص اجراء شود و پس از آن جنایت سرایت کند و سرایت پدید آمده، عمدی محسوب شود، مرتکب حسب مورد، به قصاص نفس یا عضو محکوم می شود لکن پیش از اجرای قصاص نفس ولی دم باید، دیه جنایتی را که به عنوان قصاص عضو بر مرتکب وارد شده است به او بپردازد و اگر سرایت پدیدآمده، غیرعمدی محسوب شود، مرتکب به دیه جنایتی که به وسیله س رایت، پدیدآمده است، محکوم می شود و دیه مقداری که قصاص شده است کسر نمی .شود"},{"n":441,"t":"برای رعایت تساوی قصاص عضو با جنایت، باید حدود جراحت کامالً اندازه گیری شود و هر چیزی که مانع از استیفای .قصاص یا موجب ازدیاد آن باشد، برطرف گردد"},{"n":442,"t":"اگر مرتکب به سبب حرکت یا غیرآن، موجب شود که قصاص بیش از جنایت انجام شود، قصاص کننده ضامن نیست و اگر قصاص کننده یا فرد دیگری موجب زیاده باشد حسب مورد به قصاص یا دیه محکوم می .شود قانون مجازات اسالمی مصوب92"},{"n":443,"t":"اگر زن حامله، محکوم به قصاص عضو باشد و در اجرای قصاص، پیش یا پس از وضع حمل، بیم تلف یا آسیب بر طفل باشد، قصاص تا زمانی که بیم مذکور بر طرف شود به تأخیر می .افتد"},{"n":444,"t":"قصاص کردن مرتکب در جنایت بر عضو، بدون بیهوش کردن وی یا بی حس کردن عضو او، حق مجنی علیه است مگر این که جنایت در حال بیهوشی یا بی حسی عضو مجنیٌ علیه اتفا .ق افتاده باشد"},{"n":445,"t":"مداوا و بیهوش کردن مرتکب و بی .حس کردن عضو او پس از اجرای قصاص جایز است"},{"n":446,"t":"اگر شخصی همه یا مقداری از عضو دیگری را قطع کند و مجنی علیه قسمت جدا شده را پیوند بزند، قصاص ساقط نمی .شود"},{"n":447,"t":"در کلیه مواردی که در این کتاب ب ه کتاب پنجم «تعزیرات» ارجاع داده شده است، در خصوص قتل عمدی مطابق ماده ( 612 ( ) آن قانون و در سایر جنایات عمدی مطابق"},{"n":614,"t":") و تبصره آن عمل می .شود کتاب چهارم- دیات بخش اول- مواد عمومی فصل اول- تعریف دیه و موارد آن"},{"n":448,"t":"دیه مقدر، مال معینی است که در شرع مقدس به سبب جنایت غیرعمدی بر نفس، عضو یا منفعت، یا جنایت عمدی .در مواردی که به هر جهتی قصاص ندارد، مقرر شده است"},{"n":449,"t":"ارش، دیه غیرمقدر است که میزان آن در شرع تعیین نشده است و دادگاه با لحاظ نوع و کیفیت جنایت و تأثیر آن بر سالمت مجنی علیه و میزان خس ارت وارده با در نظر گرفتن دیه مقدر و با جلب نظر کارشناس میزان آن را تعیین می کند. مقررات .دیه مقدر در مورد ارش نیز جریان دارد مگر این که در این قانون ترتیب دیگری مقرر شود"},{"n":450,"t":"در جنایت شبه ،عمدی، خطای محض و جنایت عمدی که قصاص در آن جایز یا ممکن نیست در صورت درخواست مجنی علیه یا ولی دم دیه پرداخت می .شود مگر به نحو دیگری مصالحه شود"},{"n":451,"t":"در صورتی که قاتل از ورثه مقتول باشد چنانچه قتل عمدی باشد از اموال و دیه مقتول و در صورتی که خطای محض یا شبه عمدی باشد از دیه وی ارث نمی برد. در موارد فقدان و.ارث دیگر، مقام رهبری وارث است قانون مجازات اسالمی مصوب92 فصل دوم- ضمان دیه"},{"n":452,"t":"دیه، حسب مورد حق شخصی مجنی علیه یا ولی دم است و احکام و آثار مسؤولیت مدنی یا ضمان را دارد. ذمه مرتکب جز با پرداخت دیه، مصالحه، ابراء و تهاتر، بری نمی .گردد تبصره- ورثه مقتول به جز بستگان مادری به نسبت سهم االرث از دیه مقتول نیز ارث می .برند"},{"n":453,"t":"هرگاه دو یا چند نفر به نحو اشتراک مرتکب جنایت موجب دیه گردند، حسب مورد هریک از شرکا یا عاقله آنها به طور .مساوی مکلّف به پرداخت دیه است فصل سوم- راه های اثبات دیه"},{"n":454,"t":"ادله.اثبات دیه، عالوه بر قسامه، همان ادله اثبات دیون و ضمان م ت زن بالغ و از طریق مقاربت انجام گرفته باشد، تنها پرداخت دی.ه کامل زن ثابت خواهد بود پ- افضای ناشی از وطی به شبهه عالوه بر مهر المثل و دیه، در صورت ازاله بکارت، موجب ارش البکاره نیز می .باشد مبحث چهاردهم- دیه اندام تناسلی و بیضه"},{"n":662,"t":"قطع و از بین بردن اندام تناسلی مرد تا ختنه ،گاه و یا بیشتر از آن موجب دیه کامل است و در کمتر از ختنه گاه به نسبت ختنه گاه محاسبه و به همان نسبت دیه پرداخت می .شود تبصره1 - ،در این حکم تفاوتی بین اندام کودک، جوان، پیر، عقیم و شخصی که دارای بیضه سالم یا معیوب یا فاقد بیضه است .وجود ندارد تبصره2- هرگاه با یک ضربه تا خت نه گاه از بین برود و سپس مرتکب یا شخص دیگری باقیمانده یا قسمتی دیگر از اندام تناسلی را از بین ببرد، نسبت به ختنه .گاه، دیه کامل و در مقدار بیشتر، ارش ثابت است تبصره3 - هرگاه قسمتی از ختنه گاه را شخصی و قسمت دیگر از ختنه گاه را شخص دیگری قطع کند، هریک ب ه نسبت مساحتی که از ختنه گاه قطع کرده اند، ضامن می باشند و چنانچه شخصی قسمتی از ختنه گاه را قطع کند و دیگری باقیمانده ختنه گاه را به قانون مجازات اسالمی مصوب92 انضمام تمام یا قسمتی از اندام تناسلی قطع کند، نسبت به جنایت اول، دیه به مقدار مساحت قطع شده از ختنه گاه و نسبت به جنایت .دوم، ارش مقدار قطع شده از اندام تناسلی ثابت است"},{"n":663,"t":"قطع اندام تناسلی فلج، موجب یک سوم دیه کامل و فلج کردن اندام سالم موجب دو سوم دیه کامل است لکن در قطع .اندام عنین ثلث دیه کامل ثابت است تبصره- قطع قسمتی از اندام فلج به نسبت تمام اندام تناسلی، خ واه قسمت مقطوع ختنه .گاه باشد خواه غیر آن دیه دارد"},{"n":664,"t":"قطع و از بین بردن هر یک از دو طرف اندام تناسلی زن، موجب نصف دیه کامل زن است و قطع و از بین بردن بخشی از آن، به همان نسبت دیه دارد. در این حکم فرقی میان باکره و غیرباکره، خردسال و بزرگسال سالم و معیوب از قبیل رتقاء و قرناء .نیست"},{"n":665,"t":".قطع دو بیضه یکباره دیه کامل و قطع بیضه چپ، دو ثلث دیه و قطع بیضه راست، ثلث دیه دارد تبصره- .فرقی در حکم مذکور بین جوان و پیر و کودک و بزرگ و عنین و سالم و مانند آن نیست"},{"n":666,"t":"دیه ورم کردن یک بیضه، دو دهم دیه کامل است و اگر تورم مانع راه رفتن مفید شود دیه آن هشت دهم دیه کامل .است"},{"n":667,"t":"قطع بیضه ها یا اندام تناسلی  کامل"},{"n":717,"t":"هرگاه در اثر جنایت وارد بر مادر، جنین از بین برود، عالوه بر دیه یا ارش جنایت بر مادر، دیه جنین نیز در هر مرحله ای از رشد که باشد پرداخت می .شود"},{"n":718,"t":"هرگاه زنی جنین خود را، در هر مرحله ای که باشد، به عمد، شبه عمد یا خطاء از بین ببرد، دیه جنین، حسب مورد توسط مرتکب یا عاقله او پرداخت می .شود تبصره- هرگاه جنینی که بقای آن برای مادر خطر جانی دارد به منظور حفظ نفس مادر سقط شود، دیه ثابت نمی .شود قانون مجازات اسالمی مصوب92"},{"n":719,"t":"هرگاه چند جنین در یک رحم باشند سقط هر یک .از آنها، دیه جداگانه دارد"},{"n":720,"t":"دیه اعضاء و دیگر صدمات وارد بر جنین در مرحله ای که استخوان بندی آن کامل شده ولی روح در آن دمیده نشده است به نسبت دیه جنین در این مرحله محاسبه می گردد و بعد از دمیده شدن روح، حسب جنسیت جنین، دیه محاسبه می شود و چنان چه بر اثر همان جنایت جنین از بین برود، فقط دیه جنین پرداخت می .شود"},{"n":721,"t":"هرگاه در اثر جنایت و یا صدمه، چیزی از زن سقط شود که به تشخیص کارشناس مورد وثوق، منشأ انسان بودن آن ثابت نگردد، دیه و ارش ندارد لکن اگر در اثر آن، صدمه ای بر مادر وارد گردد، حسب مورد دیه یا ارش تعیین می .شود فصل هشتم- دیه جنایت بر میت"},{"n":722,"t":"دیه جنایت بر میت، یک دهم دیه کامل انسان زنده است مانند جدا کردن سر از بدن میت که یک دهم دیه و جداکردن یک دست، یک بیستم دیه و هر دو دست، یک دهم دیه و یک انگشت، یک صدم دیه کامل دارد. دیه جراحات وارده به سر و صورت و سایر اعضاء و جوارح میت به همین نسبت محاسبه می .شود تبصره- دیه جنایت بر میت به ارث نمی رسد بلکه متعلق به خود میت است که در ،صورت مدیون بودن وی و عدم کفایت ترکه صرف پرداخت بدهی او می گردد و در غیر این صورت برای او در امور خیر صرف می .شود"},{"n":723,"t":"هرگاه آسیب وارده بر میت، دیه مقدر نداشته باشد، یک دهم ارش چنین جنایتی نسبت به انسان زنده محاسبه و پرداخت می .گردد"},{"n":724,"t":"قطع اعضاء میت برای پیوند به دیگری در صورتی .که با وصیت او باشد، دیه ندارد"},{"n":725,"t":"دیه جنایت بر میت حالّ است مگر اینکه مرتکب نتواند فوراً آن را پرداخت کند که در این صورت به او مهلت مناسب داده می .شود"},{"n":726,"t":"دیه جنایت بر میت خواه عمدی باشد یا خطایی توسط خود مرتکب پرداخت می .شود"},{"n":727
