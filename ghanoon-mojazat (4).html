<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قانون مجازات اسلامی | هزار و یک وکیل</title><style>:root{--n:#0d1b2a;--g:#c8a45d;--c:#f7f3ea}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#222;font-family:Tahoma,Arial,sans-serif;line-height:2}header{background:var(--n);color:#fff;padding:24px;text-align:center;border-bottom:4px solid var(--g)}header h1{margin:0}main{max-width:1100px;margin:24px auto;padding:0 15px}.bar{position:sticky;top:8px;background:#f7f3eaf2;padding:12px 0;z-index:2}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:12px;font:inherit}.info{color:#666;font-size:13px;margin:7px 0}article{background:#fff;border:1px solid #e6e0d4;border-radius:12px;padding:18px;margin:12px 0}h2{font-size:19px;color:var(--n);border-right:4px solid var(--g);padding-right:10px;margin:0 0 7px}.none{display:none;text-align:center;padding:30px;color:#777}a{color:var(--n)}mark{background:#f4df96}</style></head><body><header><h1>هزار و یک وکیل</h1><div>مجموعه حقوقی | قانون مجازات اسلامی</div></header><main><div class="bar"><input id="q" placeholder="شماره ماده یا عبارت موردنظر را جست‌وجو کنید..."><div class="info" id="info"></div></div><div id="list"></div><div id="none" class="none">موردی پیدا نشد.</div><p><a href="index.html">← بازگشت به صفحه اصلی</a></p></main><script>
const SUPABASE_URL='https://yrsuwiqslntwfscelbto.supabase.co';
const SUPABASE_KEY='sb_publishable_JVjtLXkWbkgVrREhJE1fJA_vutsZn68';
const q=document.getElementById('q'),list=document.getElementById('list'),info=document.getElementById('info'),none=document.getElementById('none');
let A=[];
function norm(s){return String(s).replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).toLowerCase()}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function highlight(s,x){if(!x)return esc(s);const e=x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return esc(s).replace(new RegExp('('+e+')','gi'),'<mark>$1</mark>')}
function render(){
  const x=q.value.trim(), n=norm(x); list.innerHTML=''; let count=0;
  for(const a of A){
    if(n && !norm('ماده '+a.n+' '+a.t).includes(n)) continue;
    count++;
    list.insertAdjacentHTML('beforeend','<article><h2>ماده '+esc(a.n)+'</h2><div>'+highlight(a.t,x)+'</div></article>');
  }
  none.style.display=count?'none':'block';
  info.textContent=n?count+' ماده یافت شد':'تعداد مواد: '+A.length;
}
async function loadLaw(){
  info.textContent='در حال دریافت قانون از پایگاه داده...';
  try{
    const url=SUPABASE_URL+'/rest/v1/law_articles?law_id=eq.7&select=article_number,content&order=id.asc&limit=1000';
    const r=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=await r.json();
    A=rows.map(x=>({n:x.article_number,t:x.content||''}));
    render();
  }catch(e){
    list.innerHTML=''; none.style.display='block'; none.textContent='خطا در دریافت اطلاعات قانون از پایگاه داده. لطفاً اتصال اینترنت و تنظیمات Supabase را بررسی کنید.'; info.textContent='خطا در اتصال';
  }
}
q.addEventListener('input',render);loadLaw();
</script></body></html>
