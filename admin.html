<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت | هزار و یک وکیل</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      padding: 11px 20px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
      font-size: 15px;
    }

    #logout {
      float: left;
      background: #777;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border-bottom: 1px solid #eee;
      padding: 12px 8px;
      text-align: right;
      vertical-align: top;
    }

    th {
      background: #f0f0f0;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #b00020;
      margin-top: 10px;
    }

    .success {
      color: #087f23;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginBox" class="card">
    <h1>ورود مدیر</h1>

    <label>ایمیل</label>
    <input id="email" type="email" placeholder="ایمیل مدیر">

    <label>رمز عبور</label>
    <input id="password" type="password" placeholder="رمز عبور">

    <button onclick="login()">ورود</button>

    <div id="loginMessage"></div>
  </div>

  <div id="adminBox" class="hidden">

    <div class="card">
      <button id="logout" onclick="logout()">خروج</button>
      <h1>پنل مدیریت</h1>
      <p>درخواست‌های مشاوره</p>
    </div>

    <div class="card">
      <button onclick="loadRequests()">به‌روزرسانی درخواست‌ها</button>

      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>نام</th>
              <th>شماره تماس</th>
              <th>موضوع</th>
              <th>توضیحات</th>
              <th>وضعیت</th>
              <th>تاریخ</th>
            </tr>
          </thead>

          <tbody id="requestsTable">
          </tbody>
        </table>
      </div>
    </div>

  </div>

</div>

<script>
  const SUPABASE_URL = 'https://yrsuwiqslntwfscelbto.supabase.co';

  const SUPABASE_KEY = 'sb_publishable_JVjtLXkWbkgVrREhJE1fJA_vutsZn68';

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const message = document.getElementById('loginMessage');

    message.textContent = '';

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      message.className = 'error';
      message.textContent = 'ورود انجام نشد. ایمیل یا رمز عبور را بررسی کنید.';
      console.error(error);
      return;
    }

    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminBox').classList.remove('hidden');

    loadRequests();
  }

  async function logout() {
    await supabaseClient.auth.signOut();

    document.getElementById('adminBox').classList.add('hidden');
    document.getElementById('loginBox').classList.remove('hidden');
  }

  async function loadRequests() {
    const { data, error } = await supabaseClient
      .from('consultation_requests')
      .select('*')
      .order('created_at', { ascending: false });

    const table = document.getElementById('requestsTable');

    table.innerHTML = '';

    if (error) {
      console.error(error);
      table.innerHTML =
        '<tr><td colspan="6">خطا در دریافت درخواست‌ها</td></tr>';
      return;
    }

    if (!data || data.length === 0) {
      table.innerHTML =
        '<tr><td colspan="6">درخواستی ثبت نشده است.</td></tr>';
      return;
    }

    data.forEach(request => {
      const row = document.createElement('tr');

      row.innerHTML = `
        <td>${escapeHtml(request.name || '')}</td>
        <td>${escapeHtml(request.phone || '')}</td>
        <td>${escapeHtml(request.subject || '')}</td>
        <td>${escapeHtml(request.description || '')}</td>
        <td>${escapeHtml(request.status || '')}</td>
        <td>${request.created_at ? new Date(request.created_at).toLocaleString('fa-IR') : ''}</td>
      `;

      table.appendChild(row);
    });
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }
</script>

</body>
</html>
