3, "text": "اشخاص زیر بحبس تأدیبی از سه ماه تا یکسال یا به جزای نقد ی از بیست هزار تا دویست هزار ریال یا بهر دو مجازات محکوم خواهند شد: 1- هرکس عامدا مانع حضور دارنده سهم شر کت در جلسات مجامع عمومی صاحبان سهام بشود. 2- هرکس با خدعه و نیرنگ خود ر ا دارنده سهم یا قطعات سهم معرفی کند و یا باینطریق در اخذ رأی در مجمع عمومی صاحبان سهام شر کتنماید اعم از آنکه اینکار را شخصا یا توسط دیگر ی انجام دهد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به25.000.000 تا 150.000.000 ریال تعدیل یافته است."}, {"number": 254, "text": "رئیس و اعضاء هیأت مدیره شر کت سهامی که حداکثر تا 6 ماه پس از پایان هر سال مالی مجمع عمومی عادی صاحبان سهام ر ا دعوت نکنند یا مدار ک مقرر در ماده 232 را بموقع تنظیم و تسلیم ننمایند بحبس از دو تا ششماه یا به جزای نقد ی از بیست هزار تا دویست هزار ریال یا بهر دو مجازات محکوم خواهند شد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به30.000.000 تا 60.000.000ریال تعدیل یافته است."}, {"number": 255, "text": "رئیس و اعضاء هیأت مدیره هر شر کت سهامی که صورت حاضرین در مجمع ر ا مطابق ماده 99 تنظیم نکنند به جزای نقد ی از بیستهزار تا دویست هزار ریال محکوم خواهند شد جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به30.000.000 تا 60.000.000ریال تعدیل یافته است."}, {"number": 256, "text": "هیأت رئیسه هر مجمع عمومی که صورت جلسه مذکور در ماده 105 را تنظیم نکند. بمجازات مذکور در ماده قبل محکوم خواهد شد."}, {"number": 257, "text": "رئیس و اعضاء هیأت رئیسه هر مجمع عمومی که مقررات راجع بحق رأی صاحبان سهام را رعایت نکرده باشند بمجازات مذکور درماده 255 محکوم خواهند شد."}, {"number": 258, "text": "اشخاص زیر بحبس تأدیبی از یکسال تا سه سال محکوم خواهند شد: 1- رئیس و اعضاء هیأت مدیره و مدیر عامل شر کت که بدون صورت دارائی و ترازنامه یا باستناد صورت دارائی و ترازنامه مزور منافع موهومی را بین صاحبان سهام تقسیم کرده باشند. 2- رئیس و اعضاء هیأت مدیره و مدیر عامل شر کت که ترازنامه غیر واقع بمنظور پنهان داشتن وضعیت واقعی شر کت بصاحبان سهام ارائه یا منتشر کرده باشند. 3- رئیس و اعضاء هیأت مدیره و مدیر عامل شر کت که اموال یا اعتبارات شر کت را برخلاف منافع شر کت برای مقاصد شخصی یا برای شر کت یا مؤسسه دیگریکه خود بطور مستقیم یا غیر مستقیم در آن ذینفع میباشند مورد استفاده قرار دهند. 4- رئیس و اعضاء هیأت مدیره و مدیر عامل شر کت که با سوء نیت از اختیارات خود بر خلاف منافع شر کت برای مقاصد شخصی یا بخاطرشر کت یا مؤسسه دیگریکه خود بطور مستقیم یا غیر مستقیم در آن ذینفع میباشند استفاده کنند."}, {"number": 259, "text": "رئیس و اعضای هیأت مدیره شر کت که متعمد ا مجمع عمومی صاحبان سهام را در هر موقع که انتخاب بازرسان شر کت باید انجام پذیرد باین منظور دعوت ننمایند و یا بازرسان شر کت را بمجامع عمومی صاحبان سهام دعوت نکنند بحبس از دو تا ششماه یا جزای نقد ی از بیستهزار تا دویست هزار ریال یا بهر دو مجازات محکوم خواهند شد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به25.000.000 تا 60.000.000ریال تعدیل یافته است."}, {"number": 260, "text": "رئیس و اعضاء هیأت مدیره و مدیر عامل که عامدا مانع یا مخل انجام وظایف بازرسان شر کت بشوند یا اسناد و مدار کی را که برای انجام وظایف آنها لزم است در اختیار بازرسان قرار ندهند بحبس تأدیبی از سه ماه تا دو سال یا بجزای نقد ی از بیست هزار ریال تا دویست هزار ریال یا بهر دو مجازات محکوم خواهند شد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به25.000.000 تا 150.000.000 ریال تعدیل یافته است."}, {"number": 261, "text": "رئیس و اعضاء هیأت مدیر ه و مدیر عامل هر شر کت سهامی که قبل از به ثبت رسیدن افزایش سرمایه یا در صورتیکه ثبت افزایشسرمایه مزورانه یا بدون رعایت تشریفات لزم انجام گرفته باشد سهام یا قطعات سهام جدید صادر و منتشر کنند به جزای نقد ی از ده هزار تا یکصد هزارریال محکوم خواهند شد. و در صورتیکه قبل از پرداخت تمامی مبلغ اسمی سهام مبادرت بصدور و انتشار سهام جدید یا قطعات سهام جدید بنمایند بحبس تأدیبی از دو ماه تا ششماه و به جزای نقد ی از بیست هزار تا دویست هزار ریال محکوم خواهند شد. جزای نقدی مندرج در این بند به موجب مصو به هیا ت وزیران مورخ 25/12/1399 در هر دو صورت به 30.000.000 تا 60.000.000ریال تعدیل یافته است."}, {"number": 262, "text": "رئیس و اعضاء هیأت مدیره و مدیر عامل هر شر کت سهامی که مرتکب جرائم زیر بشوند به جزای نقد ی از بیست هزار تا دویستهزار ریال محکوم خواهند شد: 1- در صورتیکه در موقع افزایش سرمایه شر کت باستثنای مواردیکه در این قانون پیشبینی شده است حق تقدم صاحبان سهام را نسبت بپذیرهنویسی و خرید سهام جدید رعایت نکنند و یا مهلتی را که جهت پذیرهنویسی سهام جدید باید در نظر گرفته شود بصاحبان سهام ندهند. 2- در صورتیکه شر کت قبلا اوراق قرضه قابل تعویض با سهم منتشر کرده باشد حقوق دارندگان اینگونه اوراق قرضه را نسبت بتعویض اوراقآنها با سهام شر کت در نظر نگرفته یا قبل از انقضاء مدتیکه طی آن این قبیل اوراق قرضه قابل تعویض با سهام شر کت است اوراق قرضه جدید قابلتعویض یا قابل تبدیل بسهام منتشر کنند یا قبل از تبدیل یا تعویض اوراق قرضه یا بازپرداخت مبلغ آنها سرمایه شر کت را مستهلک سازند یا آنرا ازطریق بازخرید سهام کاهش دهند یا اقدام بتقسیم اندوخته کنند یا در نحوه تقسیم منافع تغییراتی بدهند. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به30.000.000 تا 60.000.000ریال تعدیل یافته است."}, {"number": 263, "text": "رئیس و اعضاء هیئت مدیره و مدیر عامل هر شر کت سهامی که عالما برای سلب حق تقدم از صاحبان سهام نسبت بپذیرهنویسی سهام جدید بمجمع عمومی اطلاعات نادرست بدهند یا اطلاعات نادرست را تصدیق کنند بحبس از ششماه تا سه سال یا به جزای نقد ی از یکصد هزارریال تا یکمیلیون ریال یا بهر دو مجاز ات محکوم خواهند شد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به100.000.000 تا 000 /000 /300 ریال تعدیل یافته است."}, {"number": 264, "text": "رئیس و اعضاء هیأت مدیره هر شر کت سهامی که در مورد کاهش سرمایه عالما مقررات زیر را رعایت نکنند به جزای نقد ی از بیستهزار ریال تا دویست هزار ریال محکوم خواهند شد: 1- در صورت عدم رعایت تساو ی حقوق صاحبان سهام. 2- در صورتیکه پیشنهاد راجع بکاهش سرمایه حداقل چهل و پنج روز قبل از تشکیل مجمع عمومی فوقالعاده ببازرس شر کت تسلیم نشدهباشد. 3- در صورتیکه تصمیم مجمع عمومی دائر بر تصویب کاهش سرمایه و مهلت و شرائط آن در روزنامه رسمی و روزنامه کثیرالنتشار ی کهاعلانات مربوط بشر کت در آن نشر میگردد آگهی نشده باشد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به30.000.000 تا 60.000.000ریال تعدیل یافته است."}, {"number": 265, "text": "رئیس و اعضاء هیأت مدیره هر شر کت سهامی که در صورت از میان رفتن بیش از نصف سرمایه شر کت بر اثر زیانهای وارده حداکثر تادو ماه مجمع عمومی فوقالعاده صاحبان سهام را دعوت ننمایند تا موضوع انحلال یا بقاء شر کت مورد شور و رأی واقع شود و حداکثر تا یکماه نسبت به ثبت و آگهی تصمیم مجمع مذکور اقدام ننمایند بحبس از دو ماه تا ششماه یا به جزای نقد ی از ده هزار تا یکصد هزار ریال یا بهر دو مجازات محکوم خواهند شد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به30.000.000 تا 60.000.000ریال تعدیل یافته است."}, {"number": 266, "text": "هرکس با وجود منع قانونی عالما سمت بازرسی را در شر کت سهامی بپذیرد و بآن عمل کند بحبس تأدیبی از دو ماه تا ششماه یا جزای نقد ی از بیست هزار تا یکصد هزار ریال یا بهر دو مجازات محکوم خواهد شد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به30.000.000 تا 60.000.000ریال تعدیل یافته است."}, {"number": 267, "text": "هرکس در سمت بازرسی شر کت سهامی عالما راجع باوضاع شر کت بمجمع عمومی در گزارشهای خود اطلاعات خلاف حقیقت بدهد و یا اینگونه اطلاعات را تصدیق کند بحبس تأدیبی از سه ماه تا دو سال محکوم خواهد شد."}, {"number": 268, "text": "مدیر یا مدیران تصفیه هر شر کت سهامی که عالما مرتکب جرائم زیر بشوند بحبس تأدیبی از دو ماه تا ششماه یا بجزای نقد ی ازبیست هزار تا دویست هزار ریال یا بهر دو مجازات محکوم خواهند شد: 1- در صورتیکه ظرف یکماه پس از انتخاب تصمیم راجع بانحلال شر کت و نام و نشانی خود را بمرجع ثبت شر کتها اعلام نکنند. 2- در صورتیکه تا ششماه پس از شروع بامر تصفیه مجمع عمومی عادی صاحبان سهام شر کت را دعوت نکرده وضعیت اموال و مطالبات وقروض شر کت و نحوه تصفیه امور شر کت و مدتی را که جهت پایان دادن بامر تصفیه لزم میداند باطلاع مجمع عمومی نرسانند. 3- در صورتیکه قبل از خاتمه امر تصفیه همه ساله مجمع عمومی عادی صاحبان سهام شر کت را با رعایت شرایط و تشریفاتی که در این قانوناساسنامه شر کت پیشبینی شده است دعوت نکرده صور ت دارائی منقول و غیر منقول و ترازنامه و حساب سود و زیان عملیات خود را بضمیمه گزارشی حاکی از اعمالی که تا آنموقع انجام دادهاند بمجمع مذکور تسلیم نکنند. 4- در صورتیکه در خاتمه دوره تصد ی خود بدون آنکه تمدید مدت مأموریت خود را خواستار شوند بعملیات خود ادامه دهند. 5- در صورتیکه ظرف یکماه پس از ختم تصفیه مراتب را بمرجع ثبت شر کتها اعلام ننمایند. 6- در صورتیکه پس از اعلام ختم تصفیه وجوهی را که باقیمانده است در حساب مخصوصی در یکی از بانکهای ایرانی تودیع ننمایند وصورت اسامی بستانکاران و صاحبان سهامی را که حقوق خود را استیفاء نکردهاند بآن بانک تسلیم نکرده مراتب را طی آگهی ختم تصفیه باطلاع اشخاص ذینفع نرسانند. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به30.000.000 تا 60.000.000ریال تعدیل یافته است."}, {"number": 269, "text": "مدیر تصفیه یا مدیر ان هر شر کت سهامی که مرتکب جرائم زیر شوند بحبس تأدیبی از یک سال تا سه سال محکوم خواهند شد: 1- در صورتیکه اموال یا اعتبارات شر کت در حال تصفیه را برخلاف منافع شر کت یا برای مقاصد شخصی یا برای شر کت یا مؤسسه دیگر ی کهخود بطور مستقیم یا غیر مستقیم در آن ذینفع میباشند مور د استفاده قرار دهند. 2- در صورتیکه برخلاف ماده 213 به انتقال دارائی شر کت مبادرت کنند یا بدون رعایت حقوق بستانکاران و موضوع کردن قروضی که هنوزموعد تأدیه آن نرسیده دارائی شر کت را بین صاحبان سهام تقسیم نمایند. بخش 12 - مقررات مختلف مربوط به شر کتهای سهام ی"}, {"number": 270, "text": "هرگاه مقررات قانونی در مورد تشکیل شر کت سهامی یا عملیات آن یا تصمیماتی که توسط هر یک از ار کان شر کت اتخاذ میگردد رعایت نشود بر حسب مورد بنا بدرخواست هر ذینفع بطلان شر کت یا عملیات یا تصمیمات مذکور بحکم دادگاه اعلان خواهد شد لیکن مؤسسین ومدیران و باز رسان و صاحبان سهام شر کت نمیتوانند در مقابل اشخاص ثالث به این بطلان استناد نمایند."}, {"number": 271, "text": "در صورتیکه قبل از صدور حکم بطلان شر کت یا بطلان عملیات یا تصمیمات آن در مرحله بدو ی موجبات بطلان مرتفع شده باشد دادگاه قرار سقوط دعوای بطلان را صادر خواهد کرد."}, {"number": 272, "text": "دادگاهی که دعوای بطلان نزد آن اقامه شده است میتواند بنا بدرخواست خوانده مهلتی که از ششماه بیشتر نباشد برای رفع موجبات بطلان تعیین نماید. ابتدای مهلت مذکور تاریخ وصول پرونده از دفتر بدادگاه است.در صورتیکه ظرف مهلت مقرر موجبات بطلان برطرف نشده باشد دادگاه حکم مقتضی صادر خواهد کرد."}, {"number": 273, "text": "در صورت صدور حکم قطعی بر بطلان شر کت یا بطلان عملیات یا تصمیمات شر کت کسانیکه مسئول بطلان هستند متضامنا مسئول خساراتی خواهند بود که از آن بطلان بصاحبان سهام و اشخاص ثالث متوجه شده است."}, {"number": 274, "text": "دادگاهی که حکم بطلان شر کت را صادر مینماید باید ضمن حکم خود یک یا چند نفر را بعنوان مدیر تصفیه تعیین کند تا بر طبق مقررات این قانون انجام وظیفه نمایند."}, {"number": 275, "text": "در هر مورد که بر اثر انحلال یا بطلان شر کت مدیر تصفیه باید از طرف دادگاه تعیین شود و مدیر یا مدیران تصفیهای که توسط دادگاه تعیین شدهاند حاضر بقبول سمت مدیریت تصفیه نباشند دادگاه امر تصفیه را به اداره تصفیه امور ورشکستگی حوزه خود ارجاع مینماید. تبصره - تعیین حقالزحمه مدیر یا مدیران تصفیهای که توسط دادگاه تعیین میشود بعهده دادگاه است."}, {"number": 276, "text": "شخص یا اشخاصی که مجموع سهام آنها حداقل یک پنجم مجموع سهام شر کت باشد میتوانند در صورت تخلف یا تقصیر رئیس واعضاء هیئت مدیره و یا مدیر عامل بنام و از طرف شر کت و بهزینه خود علیه رئیس یا تمام یا بعضی از اعضاء هیئت مدیره و مدیر عامل اقامه دعو ی نمایند و جبران کلیه خسارات وارده بشر کت را از آنها مطالبه کنند. در صورت محکومیت رئیس یا هر یک از اعضاء هیأت مدیره یا مدیر عامل به جبران خسارات شر کت و پرداخت هزینه دادرسی حکم بنفع شر کتاجراء و هزینهای که از طرف اقامهکننده دعو ی پرداخت شده از مبلغ محکوم به و ی مسترد خواهد شد. در صورت محکومیت اقامهکنندگان دعو ی پرداخت کلیه هزینهها و خسارات بعهده آنان است."}, {"number": 277, "text": "مقررات اساسنامه و تصمیمات مجامع عمومی نباید بنحو ی از انحاء حق صاحبان سهام را در مورد اقامه دعوای مسئولیت علیه مدیران شر کت محدود نماید."}, {"number": 278, "text": "شرکت سهامی خاص در صورتی میتواند بشر کت سهامی عام تبدیل شود که اول موضوع بتصویب مجمع عمومی فوقالعادهشر کت سهامی خاص رسیده باشد ثانیا سرمایه آن حداقل بمیزانی باشد که برای شر کتهای سهامی عام مقرر شده است و یا شر کت سرمایه خود را بمیزان مذکور افزایش دهد. ثالثا دو سال تمام از تاریخ تأسیس و ثبت شر کت گذشته و دو ترازنامه آن بتصویب مجمع عمومی صاحبان سهام رسیدهباشد. رابعا اساسنامه آن با رعایت مقررات این قانون در مورد شر کتهای سهامی عام تنظیم یا اصلاح شده باشد."}, {"number": 279,
