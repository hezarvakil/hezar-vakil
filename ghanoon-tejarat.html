مقررات اساسنامه تعیین میشوند برسد."}, {"number": 26, "text": "در ورقه سهم نکات زیر باید قید شود: 1- نام شر کت و شمار ه ثبت آن در دفتر ثبت شر کتها. 2- مبلغ سرمایه ثبت شده و مقدار پرداخت شده آن. 3- تعیین نوع سهم. 4- مبلغ اسمی سهم و مقدار پرداخت شده آن به حروف و باعداد. 5- تعداد سهامی که هر ورقه نماینده آنست."}, {"number": 27, "text": "تا زمانی که اوراق سهام صادر نشده است شر کت باید بصاحبان سهام گواهینامه موقت سهم بدهد که معرف تعداد و نوع سهام و مبلغ پرداخت شده آن باشد. این گواهینامه در حکم سهم است ولی در هر حال ظرف مدت یکسال پس از پرداخت تمامی مبلغ اسمی سهم باید ورقه سهم صادر و بصاحب سهم تسلیم و گواهی موقت سهم مسترد و ابطال گردد."}, {"number": 28, "text": "تا وقتی که شر کت به ثبت نرسیده صدور ورقه سهم یا گواهینامه موقت سهم ممنوع است. در صورت تخلف امضاءکنندگان مسئول جبران خسارات اشخاص ثالث خواهند بود."}, {"number": 29, "text": "در شر کتهای سهامی عام مبلغ اسمی هر سهم نباید از ده هزار ریال بیشتر باشد."}, {"number": 30, "text": "مادام که تمامی مبلغ اسمی هر سهم پرداخت نشده صدو ر ورقه سهم بینام یا گواهینامه موقت بینام ممنوع است. بتعهد کننده اینگونه سهام گواهینامه موقت با نام داده خواهد شد که نقل و انتقال آن تابع مقررات مربوط بنقل و انتقال سهام بانام است."}, {"number": 31, "text": "در مورد صدور گواهینامه موقت سهم مواد 25 و 26 باید رعایت شود."}, {"number": 32, "text": "مبلغ اسمی سهام و همچنین قطعات سهام در صورت تجزیه باید متساو ی باشد."}, {"number": 33, "text": "مبلغ پرداخت نشده سهام هر شر کت سهامی باید ظرف مدت مقرر در اساسنامه مطالبه شود. در غیر اینصورت هیأت مدیره شر کت بایدمجمع عمومی فوقالعاده صاحبان سهام را بمنظور تقلیل سرمایه شر کت تا میزان مبلغ پرداخت شده سرمایه دعوت کند و تشکیل دهد وگرنه هر ذینفعحق خواهد داشت که برای تقلیل سرمایه ثبت شده شر کت تا میزان مبلغ پرداخت شده بدادگاه رجوع کند. تبصره - مطالبه مبلغ پرداخت نشده سهام یا هر مقدار از آن باید از کلیه صاحبان سهام و بدون تبعیض بعمل آید."}, {"number": 34, "text": "کسی که تعهد ابتیاع سهمی را نموده مسئول پرداخت تمام مبلغ اسمی آن میباشد و در صورتیکه قبل از تأدیه تمام مبلغ اسمی سهم آنرا بدیگر ی انتقال دهد بعد از انتقال سهم دارنده سهم مسئول پرداخت بقیه مبلغ اسمی آن خواهد بود."}, {"number": 35, "text": "در هر موقع که شر کت بخواهد تمام یا قسمتی از مبلغ پرداخت نشده سهام را مطالبه کند باید مراتب را از طریق نشر آگهی در روزنامه کثیرالنتشار ی که آگهی های مربوط بشر کت در آن منتشر میشود بصاحبان فعلی سهام اطلاع دهد و مهلت معقول و متناسبی برای پرداخت مبلغمورد مطالبه مقرر دارد. پس از انقضای چنین مهلتی هر مبلغ که تأدیه نشده باشد نسبت به آن خسارت دیر کرد از قرار نرخ رسمی بهره بعلاوه چهاردرصد در سال بمبلغ تأدیه نشده علاوه خواهد شد و پس از اخطار از طرف شر ک ت بصاحب سهم و گذشتن یکماه اگر مبلغ مورد مطالبه و خسارت تأخیر آن تماما پرداخت نشود شر کت اینگونه سهام را در صورتیکه در بورس اوراق بهادار پذیرفته شده باشد از طریق بورس وگرنه از طریق مزایده بفروش خواهد رسانید. از حاصل فروش سهم بدوا کلیه هزینههای مترتبه برداشت گردیده و در صورتیکه خالص حاصل فروش از بدهی صاحب سهم (بابت اصل و هزینهها و خسار ت دیر کرد) بیشتر باشد مازاد به و ی پرداخت میشود."}, {"number": 36, "text": "در مورد ماده 35 آگهی فروش سهم با قید مشخصات سهام مورد مزایده فقط یکنوبت در روزنامه کثیرالنتشار ی که آگهیهای مربوط بشر کت در آن نشر میگردد منتشر و یک نسخه از آگهی به وسیله پست سفارشی برای صاحب سهم ارسال میشود. هرگاه قبل از تاریخی که برای فروش معین شده است کلیه بدهیهای مربوط بسهام اعم از اصل- خسارات - هزینهها به شر کت پرداخت شود شر کت از فروش سهام خوددار ی خواهد کرد. در صورت فروش سهام نام صاحب سهم سابق از دفاتر شر کت حذف و اوراق سهام یا گواهینامه موقت سهام با قید کلمه المثنی بنام خریدار صادرو اوراق سهام یا گواهینامه موقت سهام قبلی ابطال میشود و مراتب برای اطلاع عموم آگهی میگردد."}, {"number": 37, "text": "دارندگان سهام مذکور در ماده 35 حق حضور و رأی در مجامع عمومی صاحبان سهام شر کت را نخواهند داشت و در احتساب حد نصاب تشکیل مجامع عمومی تعداد اینگونه سهام از کل تعداد سهام شر کت کسر خواهد شد. بعلاوه حق دریافت سود قابل تقسیم و حق رجحان در خرید سهام جدید شر کت و همچنین حق دریافت اندوخته قابل تقسیم نسبت باینگونه سهام معلق خواهد ماند."}, {"number": 38, "text": "در مورد ماده 37 هرگاه دارندگان سهام قبل از فروش سهام بدهی خود را بابت اصل و خسارات و هزینه ها ب در و در مر کز شر کت نگاهدار ی خواهد شد تا هر موقع که دارندگان سهام بانام بشر کت مراجعه کنند سهام بانام آنان اخذ و ابطال و سهام بینام بآنها داده شود."}, {"number": 48, "text": "پس از تبدیل کلیه سهام بینام بسهام بانام و یا تبدیل سهام بانام بسهام بینام و یا حسب مورد پس از گذشتن هر یک از مهلتهایمذکور در مواد 44 و 47 شرکت باید مر جع ثبت شر کتها را از تبدیل سهام خود کتبا مطلع سازد تا مراتب طبق مقررات به ثبت رسیده و برای اطلاععموم آگهی شود."}, {"number": 49, "text": "دارندگان سهامیکه بر طبق مواد فوق سهام خود را تعویض ننموده باشند نسبت بآن سهام حق حضور و رأی در مجامع عمومی صاحبانسهام را نخواهند داشت."}, {"number": 50, "text": "در مورد تعویض گواهی نامه موقت سهام یا اوراق سهام بانام یا بینام بر طبق مفاد مواد 47 و 49 عمل خواهد شد. بخش 4 -اوراق قرضه"}, {"number": 51, "text": "شرکت سهامی عام میتواند تحت شر ایط مندرج در این قانون اوراق قرضه منتشر کند."}, {"number": 52, "text": "ورقه قرضه ورقه قابل معاملهایست که معرف مبلغی وام است با بهره معین که تمامی آن یا اجزاء آن در موعد یا مواعد معینی بایدمسترد گردد. برای ورقه قرضه ممکن است علاوه بر بهره حقوق دیگر ی نیز شناخته شود."}, {"number": 53, "text": "دارندگان اوراق قرضه در اداره امور شر کت هیچگونه دخالتی نداشته و فقط بستانکار شر کت محسوب میشوند."}, {"number": 54, "text": "پذیرهنویسی و خرید اوراق قرضه عمل تجار ی نمیباشد."}, {"number": 55, "text": "انتشار اوراق قرضه ممکن نیست مگر وقتی که کلیه سرمایه ثبت شده شر کت تأدیه شده و دو سال تمام از تاریخ ثبت شر کت گذشته و دوترازنامه آن بتصویب مجمع عمومی رسیده باشد."}, {"number": 56, "text": "هرگاه انتشار اوراق قرضه در اساسنامه شر کت پیشبینی نشده باشد مجمع عمومی فوقالعاده صاحبان سهام میتواند بنا به پیشنهاد هیئت مدیره انتشار اوراق قرضه را تصویب و شرایط آنرا تعیین کند. اساسنامه و یا مجمع عمومی میتواند به هیئت مدیره شر کت اجازه دهد که طی مدتی که از دو سال تجاوز نکند یک یا چند بار بانتشار اوراق قرضه مبادرت نماید. تبصره - در هر بار انتشار مبلغ اسمی اوراق قرضه و نیز قطعات اوراق قرضه (در صورت تجزیه) باید متساو ی باشد."}, {"number": 57, "text": "تصمیم راجع بفر وش اوراق قرضه و شرایط صدور و انتشار آن باید همراه با طرح اطلاعیه انتشار او راق قرضه کتبا بمرجع ثبت شر کت ها اعلام شود. مرجع مذکور مفاد تصمیم را ثبت و خلاصه آنرا همراه با طرح اطلاعیه انتشار اوراق قرضه بهزینه شر کت در روزنامه رسمیآگهی خواهد نمود. تبصره - قبل از انجام تشریفات مذکور در ماده فوق هر گونه آگهی برای فروش اوراق قر ضه ممنوع است."}, {"number": 58, "text": "اطلاعیه انتشار اوراق قرضه باید مشتمل بر نکات زیر بوده و توسط دارندگان امضاء مجاز شر کت امضاء شده باشد: 1- نام شر کت 2- موضوع شر کت 3- شماره و تاریخ ثبت شر کت. 4- مرکز اصلی شر کت. 5- مدت شر کت. 6- مبلغ سرمایه شر کت و تصریح باینکه کلیه آن پرداخت شده است. 7- در صورتیکه شر کت سابقا اوراق قرضه صادر کرده است مبلغ و تعداد و تاریخ صدور آن و تضمیناتی که احتمال برای بازپرداخت آن در نظرگرفته شده است و همچنین مبالغ بازپرداخت شده آن و در صورتیکه اوراق قر ضه سابق قابل تبدیل بسهام شر کت بوده باشد مقدار ی از آن گونه اوراققرضه که هنوز تبدیل بسهم نشده است. 8- در صورتیکه شر کت سابقا اوراق قرضه مؤسسه دیگر ی را تضمین کرده باشد مبلغ و مدت و سایر شرایط تضمین مذکور. 9- مبلغ قرضه و مدت آن و همچنین مبلغ اسمی هر ورقه و نرخ بهرهای که بقرضه تعلق میگیرد و ترتیب محاسبه آن و ذکر سایر حقوقی کهاحتمال برای اوراق قرضه در نظر گرفته شده است و همچنین موعد یا مواعد و شرایط بازپرداخت اصل و پرداخت بهره و غیره و در صورتیکه اوراققرضه قابل بازخرید باشد شرایط و ترتیب بازخرید. 10- تضمیناتی که احتمال بر ای اوراق قرضه در نظر گرفته شده است. 11- اگر اوراق قرضه قابل تعویض با سهام شر کت یا قابل تبدیل بسهام شر کت باشد مهلت و سایر شرایط تعویض یا تبدیل. 12- خلاصه گزارش وضع مالی شر کت و خلاصه ترازنامه آخرین سال مالی آن که بتصویب مجمع عمومی صاحبان سهام رسیده است."}, {"number": 59, "text": "پس از انتشار آگهی مذکور در ماده 57 شرکت باید تصمیم مجمع عمومی و اطلاعیه انتشار اوراق قرضه را با قید شماره و تاریخ آگهیمنتشر شده در روزنامه رسمی و همچنین شماره و تاریخ روزنامه رسمی که آگهی در آن منتشر شده است در روز نامه کثیرالنتشار ی که آگهیهای مربوط به شر کت در آن نشر میگردد آگهی کند."}, {"number": 60, "text": "ورقه قرضه باید شامل نکات زیر بوده و بهمان ترتیبی که برای امضای اوراق سهام مقرر شده است امضاء بشود: 1- نام شر کت 2- شماره و تاریخ ثبت شر کت 3- مرکز اصلی شر کت. 4- مبلغ سرمایه شر کت 5- مدت شر کت. 6- مبلغ اسمی و شماره ترتیب و تاریخ صدور ورقه قرضه. 7- تاریخ و شرایط بازپرداخت قرضه و نیز شرایط بازخرید ورقه قرضه (اگر قابل بازخرید باشد) . 8- تضمیناتی که احتمال برای قرضه در نظر گرفته شده است. 9- در صورت قابلیت تعویض اور اق قرضه با سهام شر ایط و ترتیباتی که باید برای تعویض رعایت شود با ذکر نام اشخاص یا مؤسساتی که تعهدتعویض اوراق قرضه را کردهاند. 10- در صورت قابلیت تبدیل ورقه قرضه بسهام شر کت مهلت و شرایط این تبدیل."}, {"number": 61, "text": "اوراق قرضه ممکن است قابل تعویض با سهام شر کت باشد در اینصورت مجمع عمومی فوقالعاده باید بنا به پیشنهاد هیئت مدیره وگزارش خاص بازرسان شر کت مقارن اجازه انتشار اوراق قرضه افزایش سرمایه شر کت را اقلا برابر با مبلغ قرضه تصویب کند."}, {"number": 62, "text": "افزایش سرمایه مذکور در ماده 61 قبل از صدور اوراق قرضه باید بوسیله یک یا چند بانک و یا مؤسسه مالی معتبر پذیرهنویسی شده باشدو قراردادیکه در موضوع اینگونه پذیرهنویسی و شرایط آن و تعهد پذیرهنویس مبنی بر دادن اینگونه سهام بدارندگان اوراق قرضه و سایر شرایط مربوط بآن بین شر کت و اینگونه پذیرهنویسان منعقد شده است نیز باید به تصویب مجمع عمومی مذکور در ماده 61 برسد وگرنه معتبر نخواهد بود. تبصره - شورای پول و اعتبار شرایط بانکها و مؤسسات مالی را که میتوانند افزایش سرمایه شر کتها را پذیرهنویسی کنند تعیین خواهد نمود."}, {"number": 63, "text": "در مور د مواد 61 و 62 حق رجحان سهامداران شر کت در خرید سهام قابل تعویض با اوراق قرضه خود بخود منتفی خواهد بود."}, {"number": 64, "text": "شرایط و ترتیب تعویض ورقه قرضه با سهم باید در ورقه قرضه قید شود. تعویض ورقه قرضه با سهم تابع میل و رضایت دارنده ورقه قرضه است. دارنده ورقه قرضه در هر موقع قبل از سررسید ورقه میتواند تحت شرایط و بترتیبی که در ورقه قید شده است آنرا با سهم شر کت تعویض کند."}, {"number": 65, "text": "از تاریخ تصمیم مجمع مذکور در ماده 61 تا انقضای موعد یا مو اعد اوراق قرضه شر کت نمیتواند اوراق قرضه جدید قابل تعویض یا قابلتبدیل بسهام منتشر کند یا سرمایه خود را مستهلک سازد یا آنرا از طریق بازخرید سهام کاهش دهد یا اقدام بتقسیم اندوخته کند یا در نحوه تقسیم منافع تغییراتی بدهد. کاهش سرمایه شر کت در نتیجه زیانهای وارده که منتهی به تقلیل مبلغ اسمی سهام و یا تقلیل عده سهام بشود شامل سهامی نیز که دارندگان اوراق قرضه در نتیجه تبدیل اوراق خود دریافت میدارند میگردد و چنین تلقی میشود که اینگونه دارندگان اوراق قرضه از همان موقع انتشاراوراق مزبور سهامدار شر کت بودهاند."}, {"number": 66, "text": "از تاریخ تصمیم مجمع مذکور در ماده 61 تا انقضای موعد یا مواعد اوراق قرضه صدور سهام جدید در نتیجه انتقال اندوخته به سرمایه وبطور کلی دادن سهم و یا تخصیص یا پرداخت وجه به سهامداران تحت عناوینی از قبیل جایزه یا منافع انتشار سهام ممنوع خواهد بود مگر آنکهحقوق دارندگان اوراق قرضه که متعاقبا اوراق خود را با سهام شر کت تعویض میکنند بنسبت سهامیکه در نتیجه معاوضه مالک میشوند حفظ شود. بمنظور فوق شر کت باید تدابیر لزم را اتخاذ کند تا دارندگان اوراق قرضه که متعاقبا اوراق خود را با سهام شر کت تعویض میکنند بتوانند بنسبت وتحت همان شرایط حقوق مالی مذکور را استیفا نمایند."}, {"number": 67, "text": "سهامیکه جهت تعویض با اوراق قرضه صادر میشود بانام بوده و تا انقضای موعد یا مواعد اوراق قرضه وثیقه تعهد پذیرهنویسان در برابردارندگان اوراق قرضه دائر بتعویض سهام با اوراق مذکور میباشد و نزد شر کت نگاهدار ی خواهد شد اینگونه سهام تا انقضاء موعد یا مواعد اوراققرضه فقط قابل انتقال بدارندگان اوراق مزبور بوده و نقل و انتقال اینگونه سهام در دفاتر شر کت ثبت نخواهد شد مگر وقتی که تعویض و ر قه قرضه با سهم احراز گر دد."}, {"number": 68, "text": "سهامیکه جهت تعویض با اوراق قرضه صادر میشود مادام که این تعویض بعمل نیامده است تا انقضاء موعد یا مواعد اوراق قرضه قابل تأمین و توقیف نخواهد بود."}, {"number": 69, "text": "اوراق قرضه ممکن است قابل تبدیل بسهام شر کت باشد در این صورت مجمع عمومی فوقالعادهای که اجازه انتشار اوراق قرضه رامیدهد شرایط و مهلتی را که طی آن دارندگان این گونه اوراق خواهند توانست اوراق خود را بسهام شر کت تبدیل کنند تعیین و اجازه افزایش سرمایه را به هیئت مدیره خواهد داد."}, {"number": 70, "text": "در مورد ماده 69 هیئت مدیره شر کت بر اساس تصمیم مجمع عمومی مذکور در همان ماده در پایان مهلت مقرر معادل مبلغ بازپرداختنشده اوراق قرضهایکه جهت تبدیل بسهام شر کت عرضه شده است سرمایه شر کت را افزایش داده و پس از ثبت این افزایش در مرجع ثبت شر کتها سهام جدید صادر و بدارندگان اوراق مذکور معادل مبلغ بازپرداخت نشده اوراقی که بشر کت تسلیم کردهاند سهم خواهد داد."}, {"number": 71, "text": "در مورد اوراق قرضه قابل تبدیل بسهم مجمع عمومی باید بنا به پیشنهاد هیئت مدیره و گزارش خاص بازرسان شر کت اتخاذ تصمیم نماید و همچنین مواد 63 و 64 در مورد اوراق قرضه قابل تبدیل بسهم نیز باید رعایت شود. بخش 5 -مجامع عمومی"}, {"number": 72, "text": "مجمع عمومی شر کت سهامی از اجتماع صاحبان سهام تشکیل میشود. مقررات مربوط بحضور عده لزم برای تشکیل مجمع عمومی و آراء لزم جهت اتخاذ تصمیمات در اساسنامه معین خواهد شد مگر در مواردی که بموجب قانون تکلیف خاص برای آن مقرر شده باشد."}, {"number": 73, "text": "مجامع عمومی بترتیب عبارتند از: 1- مجمع عمومی مؤسس. 2- مجمع عمومی عادی 3- مجمع عمومی فوقالعاده."}, {"number": 74, "text": "وظایف مجمع عمومی مؤسس بقرار زیر است: 1- رسیدگی بگزارش مؤسسین و تصویب آن و همچنین احراز پذیرهنویسی کلیه سهام شر کت و تأدیه مبالغ لزم. 2- تصویب طرح اساسنامه شر کت و در صورت لزوم اصلاح آن. 3- انتخاب اولین مدیران و باز ر س یا بازرسان شر کت. 4- تعیین روزنامه کثیرالنتشار ی که هر گونه دعوت و اطلاعیه بعد ی برای سهامداران تا تشکیل اولین مجمع عمومی عادی در آن منتشر خواهدشد. تبصره - گزارش مؤسسین باید حداقل پنج روز قبل از تشکیل مجمع عمومی مؤسس در محلی که در آگهی دعوت مجمع تعیین شده است برای مراجعه پذیر هنویسان سهام آماده باشد."}, {"number": 75, "text": "در مجمع عمومی مؤسس حضور عدهای از پذیرهنویسان که حداقل نصف سرمایه شر کت را تعهد نموده باشند ضرور ی است. اگر در اولیندعوت اکثریت مذکور حاصل نشد مجامع عمومی جدید فقط تا دو نوبت توسط مؤسسین دعوت میشوند مشروط بر اینکه لاقل بیست روز قبل ازانعقاد آن مجمع آگهی دعوت آن با قید دستور جلسه قبل و نتیجه آن در روزنامه کثیرالنتشار ی که در اعلامیه پذیرهنویسی معین شده است منتشر گردد.مجمع عمومی جدید وقتی قانونی است که صاحبان لاقل یک سوم سرمایه شر کت در آن حاضر باشند. در هر یک از دو مجمع فوق کلیه تصمیمات باید به اکثریت دو ثلث آراء حاضرین اتخاذ شود. در صورتیکه در مجمع عمومی یک سوم اکثریت لزم حاضر نشد مؤسسین عدم تشکیل شر کت را اعلام میدارند. تبصره - در مجمع عمومی مؤسس کلیه مؤسسین و پذیرهنویسان حق حضور دارند و هر سهم دارای یک رأی خواهد بود."}, {"number": 76, "text": "هرگاه یک یا چند نفر از مؤسسین آورده غیر نقد داشته باشند مؤسسین باید قبل از اقدام بدعوت مجمع عمومی مؤسس نظر کتبی کارشناس رسمی وزارت دادگستر ی را در مورد ارزیابی آوردههای غیر نقد جلب و آنرا جزء گزارش اقدامات خود در اختیار مجمع عمومی موسس بگذارند. در صورتیکه موسسین برای خود مزایائی مطالبه کرده باشند باید توجیه آن بضمیمه گزارش مزبور به مجمع موسس تقدیم شود."}, {"number": 77, "text": "گزارش مربوط بار زیابی آوردههای غیر نقد و علل و موجبات مزایای مطالبه شده باید در مجمع عمومی موسس مطرح گردد. دارندگان آورده غیر نقد و کسانیکه مزایای خاصی برای خود مطالبه کردهاند در موقعیکه تقویم آورده غیر نقد ی که تعهد کردهاند یا مزایای آنها موضوع رأی است حق رأی ندار ند و آن قسمت از سرمایه غیر نقد که موضوع مذاکره و رأی است از حیث حد نصاب جزء سرمایه شر کت منظور نخواهد شد."}, {"number": 78, "text": "مجمع عمومی نمیتواند آوردههای غیر نقد را بیش از آنچه که از طرف کارشناس رسمی دادگستر ی ارزیابی شده است قبول کند."}, {"number": 79, "text": "هرگاه آورده غیر نقد یا مزایائی که مطالبه شده است تصویب نگردد دومین جلسه مجمع بفاصله مدتی که از یکماه تجاوز نخواهد کرد تشکیل خواهد شد.و در فاصله دو جلسه اشخاصی که آورده غیر نقد آنها قبول نشده است در صورت تمایل میتوانند تعهد غیر نقد خود را بتعهد نقد تبدیل و مبالغ لزم را تأدیه نمایند و اشخاصی که مزایای مورد مطالبه آنها تصویب نشده میتوانند با انصراف از آن مزایا در شر کت باقی بمانند. درصورتیکه صاحبان آورده غیر نقد و مطالبهکنندگان مزایا بنظر مجمع تسلیم نشوند تعهد آنها نسبت بسهام خود باطل شده محسوب میگردد و سایر پذیره نویسان میتوانند بجای آنها سهام شر کت را تعهد و مبالغ لزم را تأدیه کنند."}, {"number": 80, "text": "در جلسه دوم مجمع عمومی مؤسس که بر طبق ماده قبل بمنظور رسیدگی بوضع آوردههای غیر نقد و مزایای مطالبه شده تشکیلمیگردد باید بیش از نصف پذیرهنویسان هر مقدار از سهام شر کت که تعهد شده است حاضر باشند. در آگهی دعوت این جلسه باید نتیجه جلسه قبل ودستور جلسه دوم قید گردد."}, {"number": 81, "text": "در صورتیکه در جلسه دوم معلوم گردد که در اثر خروج دارندگان آورده غیر نقد و یا مطالبهکنندگان مزایا و عدم تعهد و تأدیه سهام آنها از طرف سایر پذیر ه نویسان قسمتی از سرمایه شر کت تعهد نشده است و باین ترتیب شر کت قابل تشکیل نباشد موسسین باید ظرف ده روز از تاریخ تشکیل آن مجمع مراتب را بمرجع ثبت شر کتها اطلاع دهند تا مرجع مزبور گواهینامه مذکور در ماده 19 این قانون را صادر کند."}, {"number": 82, "text": "در شر کتهای سهامی خاص تشکیل مجمع عمومی موسس الزامی نیست لیکن جلب نظر کارشناس مذکور در ماده 76 این قانون ضرور ی است و نمیتوان آوردههای غیر نقد را به مبلغی بیش از ارزیابی کارشناس قبول نمود."}, {"number": 83, "text": "هر گونه تغییر در مواد اساسنامه یا در سرمایه شر کت یا انحلال شر کت قبل از موعد منحصرا در صلاحیت مجمع عمومی فوقالعادهمیباشد."}, {"number": 84, "text": "در مجمع عمومی فوقالعاده دارندگان بیش از نصف سهامیکه حق رأی دارند باید حاضر باشند. اگر در اولین دعوت حد نصاب مذکور حاصل نشد مجمع برای بار دوم دعوت و با حضور دارندگان بیش از یک سوم سهامی که حق رأی دارند رسمیت یافته و اتخاذ تصمیم خواهد نمود بشرط آنکه در دعوت دوم نتیجه دعوت اول قید شده باشد."}, {"number": 85, "text": "تصمیمات مجمع عمومی فوقالعاده همواره باکثریت دو سوم آراء حاضر در جلسه رسمی معتبر خواهد بود."}, {"number": 86, "text": "مجمع عمومی عادی میتواند نسبت بکلیه امور شر کت بجز آنچه که در صلاحیت مجمع عمومی موسس و فوقالعاده است تصمیم بگیرد."}, {"number": 87, "text": "در مجمع عمومی عادی حضور دارندگان اقلا بیش از نصف سهامی که حق رأی دارند ضرور ی است. اگر در اولین دعوت حد نصاب مذکورحاصل نشد مجمع برای بار دوم دعوت خواهد شد و با حضور هر عده از صاحبان سهامی که حق رأی دارد رسمیت یافته و اخذ تصمیم خواهد نمود. بشرط آنکه در دعوت دوم نتیجه دعوت اول قید شده باشد."}, {"number": 88, "text": "در مجمع عمومی عادی تصمیمات همواره باکثریت نصف بعلاوه یک آراء حاضر در جلسه رسمی معتبر خواهد بود مگر در مورد انتخاب مدیران و بازرسان که اکثریت نسبی کافی خواهد بود. در مورد انتخاب مدیران تعداد آر اء هر رأی دهنده در عدد مدیرانی که باید انتخاب شوند ضرب میشود و حق رأی هر رأی دهنده برابر با حاصل ضرب مذکور خواهد بود. رأی دهنده میتواند آراء خود را بیک نفر بدهد یا آنرا بین چند نفر ی که مایل باشد تقسیم کند. اساسنامه شر کت نمیتواند خلاف این ترتیب را مقرر دارد."}, {"number": 89, "text": "مجمع عمومی عادی باید سالی یکبار در موقعی که در اساسنامه پیشبینی شده است برای رسیدگی بترازنامه و حساب سود و زیانسال مالی قبل و صورت دارائی و مطالبات و دیون شر کت و صورتحساب دوره عملکرد سالیانه شر کت و رسیدگی بگزارش مدیر ان و بازرس یا بازرسان و سایر امور مربوط بحسابهای سال مالی تشکیل شود. تبصره - بدون قرائت گزارش بازرس یا بازرسان شر کت در مجمع عمومی اخذ تصمیم نسبت بترازنامه و حساب سود و زیان سال مالی معتبرنخواهد بود."}, {"number": 90, "text": "تقسیم سود و اندوخته بین صاحبان سهام فقط پس از تصویب مجمع عمومی جائز خواهد بود و در صورت وجود منافع تقسیم ده درصداز سود ویژه سالنه بین صاحبان سهام الزامی است."}, {"number": 91, "text": "چنانچه هیئت مدیره مجمع عمومی عادی سالنه را در موعد مقرر دعوت نکند بازرس یا بازر سان شر کت مکلفند رأسا اقدام بدعوت مجمع مزبور بنمایند."}, {"number": 92, "text": "هیئت مدیره و همچنین بازرس یا بازرسان شر کت میتوانند در مواقع مقتضی مجمع عمومی عادی را بطور فوقالعاده دعوت نمایند. دراینصورت دستور جلسه مجمع باید در آگهی دعوت قید شود."}, {"number": 93, "text": "در هر موقعی که مجمع عمومی صاحبان سهام بخو اهد در حقوق نوع مخصوصی از سهام شر کت تغییر بدهد تصمیم مجمع قطعی نخواهد بود مگر بعد از آنکه دارندگان اینگونه سهام در جلسة خاصی آن تصمیم را تصویب کنند و برای آنکه تصمیم جلسه خاص مذکور معتبر باشد باید دارندگان لاقل نصف اینگونه سهام در جلسه حاضر باشند و اگر در این دعوت این حد نصاب حاصل نشود در دعوت دوم حضور دارندگان اقلا یکسوم اینگونه سهام کافی خواهد بود. تصمیمات همواره باکثریت دو سوم آراء معتبر خواهد بود."}, {"number": 94, "text": "هیچ مجمع عمومی نمیتواند تابعیت شر کت را تغییر بدهد و یا هیچ اکثریتی نمیتواند بر تعهدات صاحبان سهام بیفزاید."}, {"number": 95, "text": "سهامدارانی که اقلا یک پنجم سهام شر کت را مالک باشند حق دارند که دعوت صاحبان سهام را برای تشکیل مجمع عمومی از هیئتمدیره خواستار شوند و هیئت مدیره باید حداکثر تا بیست روز مجمع مورد درخواست را با رعایت تشریفات مقرره دعوت کند در غیر اینصورت درخواستکنندگان میتوانند دعوت مجمع را از بازرس یا بازرسان شر کت خواستار شوند و بازرس یا بازرسان مکلف خواهند بود که با رعایت تشریفات مقرره مجمع مورد تقاضا را حداکثر تا ده روز دعوت نمایند وگرنه آنگونه صاحبان سهام حق خواهند داشت مستقیما بدعوت مجمع اقدام کنند بشرط آنکه کلیه تشریفات راجع بدعوت مجمع را رعایت نموده و در آگهی دعوت بعدم اجابت درخواست خود توسط هیئت مدیره و بازرسان تصریح نمایند."}, {"number": 96, "text": "در مورد ماده 95 دستور مجمع منحصرا موضوعی خواهد بود که در تقاضانامه ذکر شده است و هیئترئیسه مجمع از بین صاحبان سهامانتخاب خواهد شد."}, {"number": 97, "text": "در کلیه موارد دعوت صاحبان سهام برای تشکیل مجامع عمومی باید از طریق نشر آگهی در روزنامه کثیرالنتشار ی که آگهیهای مربوط بشر کت در آن نشر میگردد بعمل آید. هر یک از مجامع عمومی سالیانه باید روزنامه کثیرالنتشار ی را که هر گونه دعوت و اطلاعیه بعد ی برایسهامدار ان تا تشکیل مجمع عمومی سالنه بعد در آن منتشر خواهد شد تعیین نمایند. این تصمیم باید در روزنامه کثیرالنتشار ی که تا تاریخ چنینتصمیمی جهت نشر دعوتنامهها و اطلاعیههای مربوط بشر کت قبلا تعیین شده منتشر گردد. تبصره - در مواقعی که کلیه صاحبان سهام در مجمع حاضر باشند نشر آگهی و تشریفات دعوت الزامی نیست."}, {"number": 98, "text": "فاصله بین نشر دعوتنامه مجمع عمومی و تاریخ تشکیل آن حداقل ده روز و حداکثر چهل روز خواهد بود."}, {"number": 99, "text": "قبل از تشکیل مجمع عمومی هر صاحب سهمی که مایل بحضور در مجمع عمومی باشد باید با ارائه ورقه سهم یا تصدیق موقت سهم متعلق بخود به شر کت مراجعه و ورقه ورود به جلسه را دریافت کند. فقط سهامدارانی حق ورود بمجمع را دارند که ورقه ورودی دریافت کرده باشند. از حاضرین در مجمع صورتی ترتیب داده خواهد شد که در آن هویت کامل و اقامتگاه و تعداد سهام و تعداد آراء هر یک از حاضرین قید و بامضاء آنان خواهد رسید."}, {"number": 100, "text": "در آگهی دعوت صاحبان سهام برای تشکیل مجمع عمومی دستور جلسه و تاریخ و محل تشکیل مجمع با قید ساعت و نشانی کامل باید قید شود."}, {"number": 101, "text": "مجامع عمومی توسط هیئترئیسهای مر کب از یک ر ئیس و یک منشی و دو ناظر ادار ه میشود. در صورتیکه ترتیب دیگر ی دراساسنامه پیشبینی نشده باشد ریاست مجمع با رئیس هیئت مدیره خواهد بود مگر در مواقعی که انتخاب یا عزل بعضی از مدیران یا کلیه آنها جزودستور جلسه مجمع باشد که در اینصورت رئیس مجمع از بین سهامداران حاضر در جلسه باکثریت نسبی انتخاب خواهد شد. ناظران از بین صاحبانسهام انتخاب خواهند شد ولی منشی جلسه ممکن است صاحب سهم نباشد."}, {"number": 102, "text": "در کلیه مجامع عمومی حضور و کیل یا قائممقام قانونی صاحب سهم و همچنین حضور نماینده یا نمایندگان شخصیت حقوقی به شرط ارائه مدر ک و کالت یا نمایندگی بمنزله حضور خود صاحب سهم است."}, {"number": 103, "text": "در کلیه مواردی که در این قانون اکثریت آراء در مجامع عمومی ذکر شده است مراد اکثریت آراء حاضرین در جلسه است."}, {"number": 104, "text": "هرگاه در مجمع عمومی تمام موضوعات مندرج در دستور مجمع مورد اخذ تصمیم واقع نشود هیئت رئیسه مجمع با تصویب مجمعمیتواند اعلام تنفس نموده و تاریخ جلسه بعد را که نباید دیرتر از دو هفته باشد تعیین کند. تمدید جلسه محتاج بدعوت و آگهی مجدد نیست و درجلسات بعد مجمع با همان حد نصاب جلسه اول ر سمیت خواهد داشت."}, {"number": 105, "text": "از مذاکرات و تصمیمات مجمع عمومی صورت جلسهای توسط منشی ترتیب داده میشود که بامضاء هیئت رئیسه مجمع رسیده و یکنسخه از آن در مر کز شر کت نگهدار ی خواهد شد."}, {"number": 106, "text": "در مواردیکه تصمیمات مجمع عمومی متضمن یکی از امور ذیل باشد یک نسخه از صورت جلسه مجمع باید جهت ثبت به مرجع شر کتها ارسال گر دد: 1- انتخاب مدیران و باز رس یا بازرسان. 2- تصویب ترازنامه. 3- کاهش یا افزایش سرمایه و هر نوع تغییر در اساسنامه. 4- انحلال شر کت و نحوه تصفیه آن. بخش 6 -هیئت مدی ره"}, {"number": 107, "text": "شرکت سهامی بوسیله هیئت مدیرهای که از بین صاحبان سهام انتخاب شده و کلا یا بعضا قابل عزل میباشند اداره خواهد شد. عدهاعضای هیئت مدیره در شر کتهای سهامی عمومی نباید از پنج نفر کمتر باشد."}, {"number": 108, "text": "مدیران شر کت توسط مجمع عمومی مؤسس و مجمع عمومی عادی انتخاب میشوند."}, {"number": 109, "text": "مدت مدیریت مدیران در اساسنامه معین میشود لیکن این مدت از دو سال تجاوز نخواهد کرد. انتخاب مجدد مدیران بلامانع است."}, {"number": 110, "text": "اشخاص حقوقی را میتوان بمدیریت شر کت انتخاب نمود. در این صورت شخص حقوقی همان مسئولیتهای مدنی شخص حقیقیعضو هیئت مدیره را داشته و باید یک نفر را بنمایندگی دائمی خود جهت انجام وظایف مدیریت معرفی نماید. چنین نمایندهای مشمول همان شرایط و تعهدات و مسئولیتهای مدنی و جزائی عضو هیئت مدیره بوده و از جهت مدنی با شخص حقوقی که او را بنمایندگی تعیین نموده است مسئولیت تضامنی خواهد داشت. شخص حقوقی عضو هیئت مدیره میتواند نماینده خود را عزل کند بشرط آنکه در همان موقع جانشین او را کتبا بشر کت معرفی نماید وگرنه غایب محسوب میشود."}, {"number": 111, "text": "اشخاص ذیل نمیتوانند بمدیریت شر کت انتخاب شوند: 1- محجورین و کسانیکه حکم ورشکستگی آنها صادر شده است. 2- کسانیکه بعلت ارتکاب جنایت یا یکی از جنحههای ذیل بموجب حکم قطعی از حقوق اجتماعی کلا یا بعضا محروم شده باشند در مدت محرومیت: سرقت- خیانت در امانت- کلاهبردار ی- جنحههائی که بموجب قانون در حکم خیانت در امانت یا کلاهبردار ی شناخته شده است- اختلاس- تدلیس- تصرف غیر قانونی در اموال عمومی. تبصره - دادگاه شهرستان بتقاضای هر ذینفع حکم عزل هر مدیر ی را که برخلاف مفاد این ماده انتخاب شود یا پس از انتخاب مشمول مفاد اینماده گردد صادر خواهد کرد و حکم دادگاه مزبور قطعی خواهد بود."}, {"number": 112, "text": "در صورتیکه بر اثر فوت یا استعفا یا سلب شرایط از یک یا چند نفر از مدیران تعداد اعضاء هیئت مدیره از حداقل مقرر در این قانونکمتر شود اعضاء علیالبدل بترتیب مقرر در اساسنامه وال بترتیب مقرر توسط مجمع عمومی جای آنانرا خواهند گرفت و در صورتیکه عضوعلیالبدل تعیین نشده باشد و یا تعداد اعضاء علیالبدل کافی برای تصد ی محلهای خالی در هیئت مدیره نباشد مدیران باقیمانده باید بلافاصله مجمععمومی عادی شر کت را جهت تکمیل اعضاء هیئت مدیره دعوت نمایند."}, {"number": 113, "text": "در مورد ماده 112 هرگاه هیئت مدیره حسب مورد از دعوت مجمع عمومی برای انتخاب مدیر ی که سمت او بلامتصد ی ماندهخوددار ی کند هر ذینفع حق دار د از بازرس یا بازرسان شر کت بخواهد که بدعوت مجمع عمومی عادی جهت تکمیل عده مدیران با رعایت تشریفات لزم اقدام کنند و بازرس یا بازرسان مکلف بانجام چنین درخواستی میباشند."}, {"number": 114, "text": "مدیران باید تعداد سهامی را که اساسنامه شر کت مقرر کرده است دارا باشند. این تعداد سهام نباید از تعداد سهامی که بموجب اساسنامهجهت دادن رأی در مجامع عمومی لزم است کمتر باشد. این سهام برای تضمین خساراتی است که ممکن است از تقصیرات مدیران منفردا یا مشتر کا برشر کت وارد شود. سهام مذکور با اسم بوده و قابل انتقال نیست و مادام که مدیر ی مفاصا حساب دوره تصد ی خود در شر کت را دریافت نداشته باشد سهام مذکور در صندوق شر کت بعنوان وثیقه باقی خواهد ماند."}, {"number": 115, "text": "در صورتیکه مدیر ی هنگام انتخاب مالک تعداد سهام لزم بعنوان وثیقه نباشد و همچنین در صورت انتقال قهر ی سهام مورد وثیقه و یا افزایش یافتن تعداد سهام لزم بعنوان وثیقه مدیر باید ظر ف مدت یکماه تعداد سهام لز م بعنوان وثیقه را تهیه و بصندوق شر کت بسپارد وگرنه مستعفی محسوب خواهد شد."}, {"number": 116, "text": "تصویب ترازنامه و حساب سود و زیان هر دوره مالی شر کت بمنزله مفاصا حساب مدیران برای همان دوره مالی میباشد و پس ازتصویب ترازنامه و حساب سود و زیان دو ره مالی که طی آن مدت مدیریت مدیران منقضی یا بهر نحو دیگر ی از آنان سلب سمت شده است سهام مورد وثیقه اینگونه مدیران خود بخود از قید وثیقه آزاد خواهد شد."}, {"number": 117, "text": "بازرس یا بازرسان شر کت مکلفند هر گونه تخلفی از مقررات قانونی و اساسنامه شر کت در مورد سهام وثیقه مشاهده کنند بمجمع عمومی عادی گزارش دهند."}, {"number": 118, "text": "جز درباره موضوعاتی که بموجب مقررات این قانون اخذ تصمیم و اقدام درباره آنها در صلاحیت خاص مجامع عمومی است مدیرانشر کت دارای کلیه اختیارات لزم برای اداره امور شر کت میباشند مشروط بر آنکه تصمیمات و اقدامات آنها در حدود موضوع شر کت باشد. محدودکردن اختیارات مدیران در اساسنامه یا بموجب تصمیمات مجامع عمومی فقط از لحاظ ر و ابط بین مدیران و صاحبان سهام معتبر بوده و در مقابلاشخاص ثالث باطل و کانلمیکن است."}, {"number": 119, "text": "هیئت مدیره در اولین جلسه خود از بین اعضای هیئت یک رئیس و یک نایب رئیس که باید شخص حقیقی باشند برای هیئت مدیرهتعیین مینماید. مدت ریاست رئیس و نیابت نایب ر ئیس هیئت مدیره بیش از مدت عضویت آنها در هیئت مدیره نخواهد بود. هیئت مدیره در هر موقعمیتواند رئیس و نایب رئیس هیئت مدیره را از سمتهای مذکور عزل کند. هر ترتیبی خلاف این ماده مقر ر شود کانلمیکن خواهد بود. تبصره 1 - از نظر اجرای مفاد این ماده شخص حقیقی که بعنوان نماینده شخص حقوقی عضو هیئت مدیره معرفی شده باشد در حکم عضوهیئت مدیره تلقی خواهد شد. تبصره 2 - هرگاه رئیس هیئت مدیره موقتا نتواند وظایف خود ر ا انجام دهد وظایف او را نایب رئیس هیئت مدیره انجام خواهد داد."}, {"number": 120, "text": "رئیس هیئت مدیره علاوه بر دعوت و اداره جلسات هیئت مدیره موظف است که مجامع عمومی صاحبان سهام را در مواردی که هیئتمدیره مکلف بدعوت آنها میباشد دعوت نماید."}, {"number": 121, "text": "برای تشکیل جلسات هیئت مدیر ه حضور بیش از نصف اعضاء هیئت مدیره لزم است. تصمیمات باید باکثریت آراء حاضرین اتخاذ گردد مگر آنکه در اساسنامه اکثریت بیشتر ی مقرر شده باشد."}, {"number": 122, "text": "ترتیب دعوت و تشکیل جلسات هیئت مدیره را اساسنامه تعیین خواهد کرد. ولی در هر حال عدهای از مدیران که اقلا یک سوم اعضاء هیئت مدیره را تشکیل دهند میتوانند در صورتیکه از تاریخ تشکیل آخرین جلسه هیئت مدیره حداقل یک ماه گذشته باشد با ذکر دستور جلسه هیئتمدیره را دعوت نمایند."}, {"number": 123, "text": "برای هر یک از جلسات هیئت مدیره باید صور تجلسهای تنظیم و لاقل بامضاء اکثریت مدیران حاضر در جلسه برسد. درصورت جلسات هیئت مدیره نام مدیرانی که حضور دارند یا غایب میباشند و خلاصهای از مذاکرات و همچنین تصمیمات متخذ در جلسه با قید تاریخ در آن ذکر میگردد. هر یک از مدیران که با تمام یا بعضی از تصمیمات مندرج در صورتجلسه مخالف باشد نظر او باید در صورت جلسه قید شود."}, {"number": 124, "text": "هیئت مدیره باید اقلا یک نفر شخص حقیقی را بمدیریت عامل شر کت برگز یند و حدود اختیارات و مدت تصد ی و حقالزحمه او راتعیین کند در صورتیکه مدیر عامل عضو هیئت مدیره باشد دوره مدیریت عامل او از مدت عضویت او در هیئت مدیر ه بیشتر نخواهد بود. مدیر عامل شر کت نمیتواند در عین حال رئیس هیئت مدیره همان شر کت باشد مگر با تصویب سه چهارم آراء حاضر در مجمع عمومی. تبصره - هیئت مدیره در هر موقع میتواند مدیر عامل را عزل نماید."}, {"number": 125, "text": "مدیر عامل شر کت در حدود اختیاراتی که توسط هیئت مدیره به او تفویض شده است نماینده شر کت محسوب و از طرف شر کت حقامضاء دارد."}, {"number": 126, "text": "اشخاص مذکور در ماده 111 نمیتوانند بمدیریت عامل شر کت انتخاب شوند و همچنین هیچکس نمیتواند در عین حال مدیریتعامل بیش از یک شر کت را داشته باشد. تصمیمات و اقدامات مدیر عاملی که بر خلاف مفاد این ماده انتخاب شده است در مقابل صاحبان سهام واشخاص ثالث معتبر و مسئولیتهای سمت مدیریت عامل شامل حال او خواهد شد."}, {"number": 127, "text": "هرکس برخلاف ماده 126 بمدیریت عامل انتخاب شود یا پس از انتخاب مشمول ماده مذکور گردد دادگاه شهرستان بتقاضای هرذینفع حکم عزل او را صادر خواهد کرد و چنین حکمی قطعی خواهد بود."}, {"number": 128, "text": "نام و مشخصات و حدود اختیارات مدیر عامل باید با ارسال نسخهای از صورتجلسه هیئت مدیره به مرجع ثبت شر کت ها اعلام و پساز ثبت در روزنامه رسمی آگهی شود."}, {"number": 129, "text": "اعضاء هیئت مدیره و مدیر عامل شر کت و همچنین مؤسسات و شر کتهائی که اعضای هیئت مدیره و یا مدیر عامل شر کت شریک یاعضو هیئت مدیره یا مدیر عامل آنها باشند نمیتوانند بدون اجازه هیئت مدیره در معاملاتیکه با شر کت یا بحساب شرکت میشود بطور مستقیم یاغیر مستقیم طرف معامله واقع و یا سهیم شوند و در صورت اجازه نیز هیئت مدیره مکلف است بازرس شر کت را از معاملهای که اجازه آن داده شده بلافاصله مطلع نماید و گزارش آنرا به اولین مجمع عمومی عادی صاحبان سهام بدهد و بازرس نیز مکلف است ضمن گزارش خاصی حاو ی جزئیات معامله نظر خود را درباره چنین معاملهای بهمان مجمع تقدیم کند. عضو هیئت مدیره یا مدیر عامل ذینفع در معامله در جلسه هیئت مدیره و نیز درمجمع عمومی عادی هنگام اخذ تصمیم نسبت بمعامله مذکور حق رأی نخواهد داشت."}, {"number": 130, "text": "معاملات مذکور در ماده 129 در هر حال ولو آنکه توسط مجمع عادی تصویب نشود در مقابل اشخاص ثالث معتبر است مگر در موارد تدلیس و تقلب که شخص ثالث در آن شر کت کرده باشد. در صورتیکه بر اثر انجام معامله بشر کت خسارتی وارد آمده باشد جبران خسارت بر عهده هیئت مدیره و مدیر عامل یا مدیران ذینفع و مدیرانی است که اجازه آن معامله را دادهاند که همگی آنها متضامنا مسئول جبران خسارت وارده بشر کت میباشند."}, {"number": 131, "text": "در صورتیکه معاملات مذکور در ماده 129 این قانون بدون اجازه هیئت مدیره صورت گرفته باشد هرگاه مجمع عمومی عادی شر کتآنها را تصویب نکند آن معاملات قابل ابطال خواهد بود و شر کت میتواند تا سه سال از تاریخ انعقاد معامله و در صورتیکه معامله مخفیانه انجام گرفته باشد تا سه سال از تاریخ کشف آن بطلان معامله را از دادگاه صلاحیتدار درخواست کند. لیکن در هر حال مسئولیت مدیر و مدیران و یا مدیر عامل ذینفعدر مقابل شر کت باقی خواهد بود. تصمیم بدرخواست بطلان معامله با مجمع عمومی عادی صاحبان سهام است که پس از استماع گزارش بازرسمشعر بر عدم رعایت تشریفات لزم جهت انجام معامله در این مورد رأی خواهد داد. مدیر یا مدیر عامل ذینفع در معامله حق شر کت در رأی نخواهدداشت. مجمع عمومی مذکور در این ماده بدعوت هیئت مدیره یا بازرس شر کت تشکیل خواهد شد."}, {"number": 132, "text": "مدیر عامل شر کت و اعضاء هیئت مدیره باستثناء اشخاص حقوقی حق ندارند هیچگونه وام یا اعتبار از شر کت تحصیل نمایند وشر کت نمیتواند دیون آنان را تضمین یا تعهد کند. اینگونه عملیات بخودی خود باطل است. در مورد بانکها و شر کتهای مالی و اعتبار ی معاملات مذکور در این ماده بشرط آنکه تحت قیود و شرایط عادی و جار ی انجام گیرد معتبر خواهد بود. ممنوعیت مذکور در این ماده شامل اشخاصی نیز که بنمایندگی شخص حقوقی عضو هیئت مدیره در جلسات هیئت مدیره شر کت میکنند و همچنی ن شامل همسر و پدر و مادر و اجداد و اولد و اولداول د و برادر و خواهر اشخاص مذکور در این ماده میباشد."}, {"number": 133, "text": "مدیران و مدیر عامل نمیتوانند معاملاتی نظیر معاملات شر کت که متضمن رقابت با عملیات شر کت باشد انجام دهند. هر مدیر ی که ازمقررات این ماده تخلف کند و تخلف او موجب ضرر شر کت گردد مسئول جبران آن خواهد بود، منظور از ضرر در این ماده اعم است از ورود خسارت یا تفویت منفعت."}, {"number": 134, "text": "مجمع عمومی عادی صاحبان سهام میتواند با توجه بساعات حضور اعضاء غیرموظف هیئت مدیره در جلسات هیئت مزبور پرداخت مبلغی را بآنها بطور مقطوع بابت حق حضور آنها در جلسات تصویب کند مجمع عمومی این مبلغ را با توجه بتعداد ساعات و اوقاتی که هر عضو هیئت مدیره در جلسات هیئت حضور داشته است تعیین خواهد کرد. همچنین در صورتیکه در اساسنامه پیشبینی شده باشد مجمع عمومی میتواند تصویب کند که نسبت معینی از سود خالص سالنه شر کت بعنوان پاداش باعضاء هیئت مدیره تخصیص داده شود اعضاء غیرموظف هیئتمدیره حق ندارند بجز آنچه در این ماده پیشبینی شده است در قبال سمت مدیریت خود بطور مستمر یا غیر مستمر بابت حقوق یا پاداش یاحقالزحمه وجهی از شر کت دریافت کنند."}, {"number": 135, "text": "کلیه اعمال و اقدامات مدیران و مدیرعامل شر کت در مقابل اشخاص ثالث نافذ و معتبر است و نمیتوان بعذر عدم اجرای تشریفات مربوط بطرز انتخاب آنها اعمال و اقدامات آنان را غیر معتبر دانست."}, {"number": 136, "text": "در صورت انقضاء مدت مأموریت مدیران تا زمان انتخاب مدیران جدید مدیران سابق کماکان مسئول امور شر کت و اداره آن خواهند بود.هرگاه مراجع موظف بدعوت مجمع عمومی بوظیفه خود عمل نکنند هر ذینفع میتواند از مرجع ثبت شر کتها دعوت مجمع عمومی عادی را برایانتخاب مدیران تقاضا نماید."}, {"number": 137, "text": "هیئت مدیره باید لاقل هر ششماه یکبار خلاصه صورت دارائی و قروض شر کت را تنظیم کرده ببازرسان بدهد."}, {"number": 138, "text": "هیئت مدیره موظف است بعد از انقضای سال مالی شر کت ظرف مهلتی که در اساسنامه پیشبینی شده است مجمع عمومی سالنه را برای تصویب عملیات سال مالی قبل و تصویب ترازنامه و حساب سود و زیان شر کت دعوت نماید."}, {"number": 139, "text": "هر صاحب سهم میتواند از پانزده روز قبل از انعقاد مجمع عمومی در مر کز شر کت بصورت حسابها مراجعه کرده و از ترازنامه وحساب سود و زیان و گزارش عملیات مدیران و گزارش بازرسان رونوشت بگیرد."}, {"number": 140, "text": "هیئت مدیره مکلف است هر سال یک بیستم از سود خالص شر کت را بعنوان اندوخته قانونی موضوع نماید. همین که اندوخته قانونی بیک دهم سرمایه شر کت رسید موضوع کردن آن اختیار ی است و در صورتیکه سرمایه شر کت افزایش یابد کسر یک بیستم مذکور ادامه خواهد یافت تا وقتیکه اندوخته قانونی بیک دهم سرمایه بالغ گردد."}, {"number": 141, "text": "اگر بر اثر زیانهای وارده حداقل نصف سرمایه شر کت از میان برود هیئت مدیره مکلف است بلافاصله مجمع عمومی فوقالعاده صاحبان سهام ر ا دعوت نماید تا موضوع انحلال یا بقاء شر کت مورد شور و رأی واقع شود. هرگاه مجمع مزبور رأی بانحلال شر کت ندهد باید در همانجلسه و با رعایت مقررات ماده 6 این قانون سرمایه شر کت را بمبلغ سرمایه موجود کاهش دهد. در صورتیکه هیئت مدیره برخلاف این ماده بدعوت مجمع عمومی فوقالعاده مبادرت ننماید و یا مجمعی که دعوت میشود نتواند مطابق مقررات قانونی منعقد گردد هر ذینفع میتواند انحلال شر کت را از دادگاه صلاحیتدار درخواست کند."}, {"number": 142, "text": "مدیران و مدیر عامل شر کت در مقابل شر کت و اشخاص ثالث نسبت بتخلف از مقر ر ات قانونی یا اساسنامه شر کت و یا مصوبات مجمع عمومی بر حسب مورد منفردا یا مشتر کا مسئول میباشند و دادگاه حدود مسئولیت هر یک را برای جبران خسارت تعیین خواهد نمود."}, {"number": 143, "text": "در صورتیکه شر کت ورشکسته شود یا پس از انحلال معلوم شود که دارائی شر کت برای تأدیه دیون آن کافی نیست دادگاه صلاحیتدارمیتواند بتقاضای هر ذینفع هر یک از مدیران و یا مدیر عاملی را که ورشکستگی شر کت یا کافی نبودن دارائی شر کت بنحو ی از انحاء معلول تخلفات او بوده است منفردا یا متضامنا بتأدیه آن قسمت از دیونی که پرداخت آن از دارائی شر کت ممکن نیست محکوم نماید. بخش 7 - بازرسان"}, {"number": 144, "text": "مجمع عمومی عادی در هر سال یک یا چند بازرس انتخاب میکند تا بر طبق این قانون بوظائف خود عمل کنند. انتخاب مجددبازرس یا بازرسان بلامانع است. مجمع عمومی عادی در هر موقع میتواند بازرس یا بازرسان را عزل کند بشرط آنکه جانشین آنها را نیز انتخاب نماید. تبصره - در حوزههائی که وزارت اقتصاد اعلام میکند وظائف بازرسی شر کتها را در شر کتهای سهامی عام اشخاصی میتوانند ایفا کنند که نامآنها در فهرست رسمی بازرسان شر کتها درج شده باشد. شرایط تنظیم فهر ست و احراز صلاحیت بازرسی در شر کتهای سهامی عام و درج نام اشخاص صلاحیتدار در فهرست مذکور و مقررات و تشکیلات شغلی بازرسان تابع آئیننامهای میباشد که به پیشنهاد وزارت اقتصاد و تصویب کمیسیونهای اقتصاد مجلسین قابل اجرا خواهد بود."}, {"number": 145, "text": "انتخاب اولین بازرس یا بازرسان شر کتهای سهامی عام در مجمع عمومی مؤسس و انتخاب اولین بازرس یا بازرسان شر کتهایسهامی خاص طبق ماده 20 این قانون بعمل خواهد آمد."}, {"number": 146, "text": "مجمع عمومی عادی باید یک یا چند بازرس علیالبدل نیز انتخاب کند تا در صورت معذوریت یا فوت یا استعفاء یا سلب شرایط یا عدمقبول سمت توسط بازرس یا بازرسان اصلی جهت انجام وظائف بازرسی دعوت شوند."}, {"number": 147, "text": "اشخاص زیر نمیتوانند بسمت بازرسی شر کت سهامی انتخاب شوند: 1- اشخاص مذکور در ماده 111 اینقانون. 2- مدیران و مدیر عامل شر کت. 3- اقرباء سببی و نسبی مدیران و مدیر عامل تا درجه سوم از طبقه اول و دوم. 4- هرکس که خود یا همسرش از اشخاص مذکور در بند 2 موظفا حقوق دریافت میدارد."}, {"number": 148, "text": "بازرس یا باز رسان علاوه بر وظائفی که در سایر مواد اینقانون بر ای آنان مقرر شده است مکلفند درباره صحت و درستی صورت دارائی و صورت حساب دوره عملکرد و حساب سود و زیان و ترازنامهای که مدیران برای تسلیم به مجمع عمومی تهیه میکنند و همچنین درباره صحتمطالب و اطلاعاتی که مدیران در اختیار مجامع عمومی گذاشتهاند اظهار نظر کنند. بازرسان باید اطمینان حاصل نمایند که حقوق صاحبان سهام درحدودی که قانون و اساسنامه شر کت تعیین کرده است بطور یکسان رعایت شده باشد و در صورتی که مدیران اطلاعاتی برخلاف حقیقت در اختیارصاحبان سهام قرار دهند بازر سان مکلفند که مجمع عمومی را از آن آگاه سازند."}, {"number": 149, "text": "بازرس یا بازرسان میتوانند در هر موقع هر گونه رسیدگی و بازر سی لزم را انجام داده و اسناد و مدار ک و اطلاعات مربوط بشر کت رامطالبه کرده و مورد رسیدگی قرار دهند. بازرس یا بازر سان میتوانند بمسئولیت خود در انجام وظائفی که بر عهده دارند از نظر کارشناسان استفاده کنند بشرط آنکه آنها را قبلا بشر کت معرفی کرده باشند. این کارشناسان در مواردیکه بازرس تعیین میکند مانند خود بازرس حق هر گونه تحقیق ورسیدگی را خواهند داشت."}, {"number": 150, "text": "بازرس یا بازرسان موظفند با توجه بماده 148 اینقانون گزارش جامعی راجع بوضع شر کت به مجمع عمومی عادی تسلیم کنند.گزارش بازرسان باید لاقل ده روز قبل از تشکیل مجمع عمومی عادی جهت مر اجعه صاحبان سهام در مر کز شر کت آماده باشد. تبصره - در صورتیکه شر کت بازرسان متعدد داشته باشد هر یک میتو اند بتنهائی وظایف خود را انجام دهد لیکن کلیه بازرسان باید گزارش واحد ی تهیه کنند. در صورت وجود اختلاف نظر بین بازرسان موارد اختلاف با ذکر دلیل در گزارش قید خواهد شد."}, {"number": 151, "text": "بازرس یا بازرسان باید هر گونه تخلف یا تقصیر ی که در امور شر کت از ناحیه مدیران و مدیرعامل مشاهده کنند باولین مجمع عمومیاطلاع دهند و در صورتیکه ضمن انجام مأموریت خود از وقوع جرمی مطلع شوند باید بمرجع قضائی صلاحیتدار اعلام نموده و نیز جریان را باولین مجمع عمومی گزارش دهند."}, {"number": 152, "text": "در صورتیکه مجمع عمومی بدون دریافت گزارش بازرس یا بر اساس گزارش اشخاصی که برخلاف ماده 147 این قانون بعنوانبازرس تعیین شدهاند صورت دارائی و ترازنامه و حساب سود و زیان شر کت را مورد تصویب قرار دهد این تصویب به هیچوجه اثر قانونی نداشته ازدرجه اعتبار ساقط خواهد بود."}, {"number": 153, "text": "در صورتیکه مجمع عمومی بازرس معین نکرده باشد یا یک یا چند نفر از بازرسان بعللی نتوانند گزارش بدهند یا از دادن گزارشامتناع کنند رئیس دادگاه شهرستان بتقاضای هر ذینفع بازرس یا بازر سان را بتعداد مقرر در اساسنامه شر کت انتخاب خواهد کرد تا وظایف مربوطه راتا انتخاب بازرس بوسیله مجمع عمومی انجام دهند. تصمیم رئیس دادگاه شهرستان در اینمورد غیر قابل شکایت است."}, {"number": 154, "text": "بازرس یا بازرسان در مقابل شر کت و اشخاص ثالث نسبت به تخلفاتی که در انجام وظایف خود مرتکب میشوند طبق قواعد عمومی مربوط بمسئولیت مدنی مسئول جبران خسارات وارده خواهند بود."}, {"number": 155, "text": "تعیین حقالزحمه بازرس با مجمع عمومی عادی است."}, {"number": 156, "text": "بازرس نمیتواند در معاملاتی که با شر کت یا به حساب شر کت انجام میگیرد بطور مستقیم یا غیر مستقیم ذینفع شود. بخش 8 - تغییرات در سرما یه شر ک ت"}, {"number": 157, "text": "سرمایه شر کت را میتوان از طریق صدور سهام جدید و یا از طریق بالبردن مبلغ اسمی سهام موجود افزایش داد."}, {"number": 158, "text": "تأدیه مبلغ اسمی سهام جدید بیکی از طرق زیر امکانپذیر است: 1- پرداخت مبلغ اسمی سهم بنقد. 2- تبدیل مطالبات نقد ی حال شده اشخاص از شر کت بسهام جدید. 3- انتقال سود تقسیم نشده یا اندوخته یا عواید حاصله از اضافه ارزش سهام جدید بسرمایه شر کت. 4- تبدیل اوراق قرضه بسهام. تبصره 1 - فقط در شر کت سهامی خاص تأدیه مبلغ اسمی سهام جدید بغیر نقد نیز مجاز است. تبصره 2 - انتقال اندوخته قانونی بسرمایه ممنوع است."}, {"number": 159, "text": "افزایش سرمایه از طریق بالبردن مبلغ اسمی سهام موجود در صورتیکه برای صاحبان سهام ایجاد تعهد کند ممکن نخواهد بود مگر آنکه کلیه صاحبان سهام با آن موافق باشند."}, {"number": 160, "text": "شرکت میتواند سهام جدید را برابر مبلغ اسمی بفروشد یا اینکه مبلغی علاوه بر مبلغ اسمی سهم بعنوان اضافه ارزش سهم ازخریداران دریافت کند. شر کت میتواند عواید حاصله از اضافه ارزش سهام فروخته شده را باندوخته منتقل سازد یا نقدا بین صاحبان سهام سابق تقسیم کند یا در ازاء آن سهام جدید بصاحبان سهام سابق بدهد."}, {"number": 161, "text": "مجمع عمومی فوقالعاده به پیشنهاد هیئت مدیره پس از قرائت گزارش بازر س یا بازرسان شر کت در مورد افزایش سرمایه شر کت اتخاذ تصمیم میکند. تبصره 1 - مجمع عمومی فوقالعاده که در مورد افزایش سرمایه اتخاذ تصمیم میکند شرایط مربوط به فر وش سهام جدید و تأدیه قیمت آنرا تعیین یا اختیار تعیین آنرا به هیئت مدیره واگذار خواهد کرد. تبصره 2 - پیشنهاد هیئت مدیره راجع بافزایش سرمایه باید متضمن توجیه لزوم افزایش سرمایه و نیز شامل گزارشی درباره امور شر کت از بدوسال مالی در جریان و اگر تا آنموقع مجمع عمومی نسبت به حسابهای سال مالی قبل تصمیم نگرفته باشد حاکی از وضع شر کت از ابتدای سال مالی قبل باشد گزارش بازرس یا بازرسان باید شامل اظهار نظر درباره پیشنهاد هیئت مدیره باشد."}, {"number": 162, "text": "مجمع عمومی فوقالعاده میتواند به هیئت مدیره اجازه دهد که ظرف مدت معینی که نباید از پنج سال تجاوز کند سرمایه شر کت را تامیزان مبلغ معینی بیکی از طرق مذکور در این قانون افزایش دهد."}, {"number": 163, "text": "هیئت مدیره در هر حال مکلف است در هر نوبت پس از عملی ساختن افزایش سرمایه حداکثر ظرف یکماه مر اتب را ضمن اصلاحاساسنامه در قسمت مربوط بمقدار سرمایه ثبت شده شر کت بمرجع ثبت شر کتها اعلام کند تا پس از ثبت جهت اطلاع عموم آگهی شود."}, {"number": 164, "text": "اساسنامه شر کت نمیتواند متضمن اختیار افزایش سرمایه برای هیئت مدیره باشد."}, {"number": 165, "text": "مادام که سرمایه قبلی شر کت تماما تأدیه نشده است افزایش سرمایه شر کت تحت هیچ عنوانی مجاز نخواهد بود."}, {"number": 166, "text": "در خرید سهام جدید صاحبان سهام شر کت به نسبت سهامی که مالکند حق تقدم دارند و این حق قابل نقل و انتقال است مهلتی که طی آن سهامداران میتوانند حق تقدم مذکور را اعمال کنند کمتر از شصت رو ز نخواهد بود. این مهلت از روز ی که برای پذیرهنویسی تعیین میگردد شروع میشود."}, {"number": 167, "text": "مجمع عمومی فوقالعاده که افزایش سرمایه را از طریق فروش سهام جدید تصویب میکند یا اجاز ه آنرا به هیئت مدیره میدهد حقتقدم صاحبان سهام را نسبت به پذیرهنویسی تمام یا قسمتی از سهام جدید از آنان سلب کند بشرط آنکه چنین تصمیمی پس از قر ائت گزارش هیئتمدیره و گزارش بازرس یا بازرسان شر کت اتخاذ گردد وگرنه باطل خواهد بود. تبصره - گزارش هیئت مدیره مذکور در این ماده باید مشتمل بر توجیه لزوم افزایش سرمایه و سلب حق تقدم از سهامداران و معرفی شخص یااشخاصی که سهام جدید برای تخصیص بآنها در نظر گرفته شده است و تعداد و قیمت اینگونه سهام و عواملی که در تعیین قیمت در نظر گرفته شدهاست باشد. گزارش بازرس یا بازرسان باید حاکی از تأیید عوامل و جهاتی باشد که در گزارش هیئت مدیره ذکر شده است."}, {"number": 168, "text": "در مورد ماده 167 چنانچه سلب حق تقدم در پذیرهنویسی سهام جدید از بعضی از صاحبان سهام بنفع بعضی دیگر انجام میگیرد سهامدارانی که سهام جدید برای تخصیص بآنها در نظر گرفته شده است حق ندارند در اخذ رأی درباره سلب حق تقدم سایر سهامداران شر کت کنند. دراحتساب حد نصاب رسمیت جلسه و اکثریت لزم جهت معتبر بودن تصمیمات مجمع عمومی سهام سهامدارانی که سهام جدید برای تخصیص به آنهادر نظر گرفته شده است بحساب نخواهد آمد."}, {"number": 169, "text": "در شر کتهای سهامی خاص پس از اتخاذ تصمیم راجع بافزایش سرمایه از طریق انتشار سهام جدید باید مراتب از طریق نشر آگهی درروزنامه کثیرالنتشار ی که آگهیهای مربوط بشر کت در آن نشر میگردد یاطلاع صاحبان سهام برسد در این آگهی باید اطلاعات مربوط بمبلغ افزایشسرمایه و مبلغ اسمی سهام جدید و حسب مورد مبلغ اضافه ارزش سهم و تعداد سهامی که هر صاحب سهم به نسبت سهام خود حق تقدم در خرید آنهارا دارد و مهلت پذیرهنویسی و نحوه پرداخت ذکر شود. در صورتیکه برای سهام جدید شرایط خاصی در نظر گرفته شده باشد چگونگی این شرایط درآگهی قید خواهد شد."}, {"number": 170, "text": "در شر کتهای سهامی عام پس از اتخاذ تصمیم راجع بافزایش سرمایه از طریق انتشار سهام جدید باید آگهی به نحو مذکور در ماده169 منتشر و در آن قید شود که صاحبان سهام بینام برای دریافت گواهینامه حق خرید سهامی که حق تقدم در خرید آنرا دارند ظرف مهلت معین که نباید کمتر از بیست روز باشد به مراکزی که از طرف شر کت تعیین و در آگهی قید شده است مراجعه کنند. برای صاحبان سهام بانام گواهینامههای حقخرید باید توسط پست سفارشی ارسال گردد."}, {"number": 171, "text": "گواهینامه حق خرید سهم مذکور در ماده فوق باید مشتمل بر نکات زیر باشد: 1- نام و شماره ثبت و مر کز اصلی شر کت. 2- مبلغ سرمایه فعلی و همچنین مبلغ افزایش سرمایه شر کت. 3- تعداد و نوع سهامی که دارنده گواهینامه حق خرید آنرا دارد با ذکر مبلغ اسمی سهم و حسب مورد مبلغ اضافه ارزش آن. 4- نام بانک و مشخصات حساب سپردهای که وجوه لزم باید در آن پرداخته شود. 5- مهلتی که طی آن دارنده گواهینامه میتواند از حق خرید مندرج در گواهینامه استفاده کند. 6- هر گونه شرایط دیگر ی که بر ای پذیرهنویسی مقرر شده باشد. تبصره - گواهینامه حق خرید سهم باید بهمان ترتیبی که برای امضای اوراق سهام شر کت مقرر است بامضاء برسد."}, {"number": 172, "text": "در صورتیکه حق تقدم در پذیرهنویسی سهام جدید از صاحبان سهام سلب شده باشد یا صاحبان سهام از حق تقدم خود ظرف مهلت مقرر استفاده نکنند حسب مورد تمام یا باقیمانده سهام جدید عرضه و بمتقاضیان فروخته خواهد شد."}, {"number": 173, "text": "شرکتهای سهامی عام باید قبل از عرضه کردن سهام جدید برای پذیرهنویسی عمومی ابتدا طرح اعلامیه پذیرهنویسی سهام جدید را بمرجع ثبت شر کتها تسلیم و رسید دریافت کنند."}, {"number": 174, "text": "طرح اعلامیه پذیرهنویسی مذکور در ماده 173 باید بامضای دارندگان امضای مجاز شر کت رسیده و مشتمل بر نکات زیر باشد: 1- نام و شماره ثبت شر کت. 2- موضوع شر کت و نوع فعالیتهای آن. 3- مرکز اصلی شر کت و در صورتیکه شر کت شعبی داشته باشد نشانی شعب آن. 4- در صورتیکه شر کت برای مدت محدود تشکیل شده باشد تاریخ انقضاء مدت آن. 5- مبلغ سرمایه شر کت قبل از افزایش سرمایه. 6- اگر سهام ممتاز منتشر شده باشد تعداد و امتیازات آن. 7- هویت کامل اعضاء هیئت مدیره و مدیر عامل شر کت. 8- شرایط حضور و حق رأی صاحبان سهام در مجامع عمومی. 9- مقررات اساسنامه راجع به تقسیم سود و تشکیل اندوخته و تقسیم دارائی بعد از تصفیه. 10- مبلغ و تعداد اوراق قرضه قابل تبدیل بسهم که شر کت منتشر کرده است و مهلت و شرایط تبدیل اوراق قرضه بسهم. 11- مبلغ بازپرداخت نشده انواع دیگر اوراق قرضهای که شر کت منتشر کر ده است و تضمینات مربوط بآن. 12- مبلغ دیون شر کت و همچنین مبلغ دیون اشخاص ثالث که توسط شر کت تضمین شده است. 13- مبلغ افزایش سرمایه. 14- تعداد و نوع سهام جدید ی که صاحبان سهام با استفاده از حق تقدم خود تعهد کردهاند. 15- تاریخ شروع و خاتمه مهلت پذیرهنویسی. 16- مبلغ اسمی و نوع سهامی که باید تعهد شود و حسب مورد مبلغ اضافه ارزش سهم. 17- حداقل تعداد سهامی که هنگام پذیرهنویسی باید تعهد شود. 18- نام بانک و مشخصات حساب سپردهای که وجوه لزم باید در آن پرداخته شود. 19- ذکر نام روزنامه کثیرالنتشاریکه اطلاعیهها و آگهیهای شر کت در آن نشر میشود."}, {"number": 175, "text": "آخرین ترازنامه و حساب سود و زیان شر کت که بتصویب مجمع عمومی رسیده است باید به ضمیمه طرح اعلامیه پذیرهنویسی سهامجدید بمرجع ثبت شر کتها تسلیم گردد و در صورتیکه شر کت تا آنموقع ترازنامه و حساب سود و زیان تنظیم نکرده باشد این نکته باید در طرحاعلامیه پذیرهنویسی قید شود."}, {"number": 176, "text": "مرجع ثبت شر کتها پس از وصول طرح اعلامیه پذیرهنویسی و ضمائم آن و تطبیق مندرجات آنها با مقررات قانونی اجازه انتشاراعلامیه پذیرهنویسی سهام جدید را صادر خواهد نمود."}, {"number": 177, "text": "اعلامیه پذیرهنویسی سهام جدید باید علاوه بر روزنامه کثیرالنتشاریکه آگهیهای شر کت در آن نشر میگردد اقلا در دو روزنامه کثیرالنتشار دیگر آگهی شود و نیز در بانکی که تعهد سهام در نزد آن بعمل میآید در معرض دید علاقمندان قرار داده شود. در اعلامیه پذیرهنویسی باید قید شود که آخرین ترازنامه و حساب سود و زیان شر کت که بتصویب مجمع عمومی رسیده است در نزد مرجع ثبت شر کتها و در مر کز شر کت برای مراجعه علاقمندان آماده است."}, {"number": 178, "text": "خریداران ظرف مهلتی که در اعلامیه پذیرهنویسی سهام جدید معین شده است و نباید از دو ماه کمتر باشد به بانک مراجعه و ورقه تعهدسهام را امضاء کرده و مبلغی را که باید پرداخته شود تأدیه و رسید دریافت خواهند کرد."}, {"number": 179, "text": "پذیرهنویسی سهام جدید بموجب ورقه تعهد خرید سهم که باید شامل نکات زیر باشد بعمل خواهد آمد: 1- نام و موضوع و مر کز اصلی و شماره ثبت شر کت. 2- سرمایه شر کت قبل از افزایش سرمایه. 3- مبلغ افزایش سرمایه. 4- شماره و تاریخ اجازه انتشار اعلامیه پذیرهنویسی سهام جدید و مرجع صدور آن. 5- تعداد و نوع سهامی که مورد تعهد واقع میشود و مبلغ اسمی آن. 6- نام بانک و شماره حسابی که بهای سهم در آن پرداخته میشود. 7- هویت و نشانی کامل پذیرهنویس."}, {"number": 180, "text": "مقررات مواد 14 و 15 این قانون در مورد تعهد خرید سهم جدید نیز حاکم است."}, {"number": 181, "text": "پس از گذشتن مهلتی که برای پذیرهنویسی معین شده است و در صورت تمدید بعد از انقضای مدت تمدید شده هیئت مدیره حداکثر تا یکماه به تعهدات پذیره نویسان رسیدگی کرده و تعداد سهام هر یک از تعهد کنندگانرا تعیین و اعلام و مراتب را جهت ثبت و آگهی به مرجع ثبتشر کتها اطلاع خواهد داد. هر گاه پس از رسیدگی به اوراق پذیرهنویسی مقدار سهام خریدار ی شده بیش از میزان افزایش سرمایه باشد هیئت مدیره مکلف است ضمن تعیین تعدادسهام هر خریدار دستور استرداد وجه سهام اضافه خریدار ی شده را ببانک مربوط بدهد."}, {"number": 182, "text": "هرگاه افزایش سرمایه شر کت تا نه ماه از تاریخ تسلیم طرح اعلامیه پذیرهنویسی مذکور در ماده 174 بمرجع ثبت شر کتها به ثبتنرسد بدرخواست هر یک از پذیرهنویسان سهام جدید مرجع ثبت شر کت که طرح اعلامیه پذیرهنویسی بآن تسلیم شده است گواهینامه ای حاکی ازعدم ثبت افزایش سرمایه شر کت صادر و ببانکی که تعهد سهام و تأدیه وجوه در آن بعمل آمده است ارسال میدارد تا اشخاصیکه سهام جدید راپذیرهنویسی کردهاند ببانک مراجعه و وجوه پرداختی خود را مسترد دارند. در این صورت هر گونه هزینهایکه بر ای افزایش سرمایه شر کت پرداخت یاتعهد شده باشد بعهده شر کت قرار میگیرد."}, {"number": 183, "text": "برای ثبت افزایش سرمایه شر کتهای سهامی خاص فقط تسلیم اظهارنامه به ضمیمه مدار ک زیر به مرجع ثبت شر کتها کافی خواهدبود: 1- صورت جلسه مجمع عمومی فوقالعاده که افزایش سرمایه را تصویب نموده یا اجازه آنرا به هیئت مدیره داده است و در صورت اخیرصورت جلسه هیئت مدیره که افزایش سرمایه را مورد تصویب قرار داده است. 2- یک نسخه از روزنامهای که آگهی مذکور در ماده 169 این قانون در آن نشر گردیده است. 3- اظهارنامه مشعر بر فروش کلیه سهام جدید و در صورتیکه سهام جدید امتیازاتی داشته باشد باید شرح امتیازات و موجبات آن در اظهارنامه قید شود. 4- در صورتیکه قسمتی از افزایش سرمایه بصورت غیر نقد باشد باید تمام قسمت غیر نقد تحویل گردیده و با رعایت ماده 82 این قانون بتصویب مجمع عمومی فوقالعاده رسیده باشد مجمع عمومی فوقالعاده در اینمورد با حضور صاحبان سهام شر کت و پذیرهنویسان سهام جدیدتشکیل شده و رعایت مقررات مواد 77 لغایت 81 این قانون در آن قسمت که به آورده غیر نقد مربوط میشود الزامی خواهد بود و یک نسخه ازصورت جلسه مجمع عمومی فوقالعاده باید باظهارنامه مذکور در این ماده ضمیمه شود. تبصره - اظهارنامههای مذکور در این ماده باید بامضاء کلیه هیئت مدیره رسیده باشد."}, {"number": 184, "text": "وجوهی که بحساب افزایش سرمایه تأدیه میشود باید در حساب سپرده مخصوصی نگاهدار ی شود. تأمین و توقیف و انتقال وجوهمزبور بحساب های شر کت ممکن نیست مگر پس از به ثبت رسیدن افزایش سرمایه شر کت."}, {"number": 185, "text": "در صورتیکه مجمع عمومی فوقالعاده صاحبان سهام افزایش سرمایه شر کت را از طریق تبدیل مطالبات نقد ی حال شده اشخاص ازشر کت تصویب کرده باشد سهام جدید ی که در نتیجه اینگونه افزایش سرمایه صادر خواهد شد با امضاء ورقه خرید سهم توسط طلبکارانی که مایل به پذیرهنویسی سهام جدید باشند انجام میگیرد."}, {"number": 186, "text": "در ورقه خرید سهم مذکور در ماده 185 نکات مندرج در بندهای 1 و 2 و 3 و 5 و 7 و 8 ماده 179 باید قید شود."}, {"number": 187, "text": "در مورد ماده 185 پس از انجام پذیرهنویسی باید در موقع به ثبت رسانیدن افزایش سرمایه در مرجع ثبت شر کتها صورت کاملی ازمطالبات نقد ی حال شده ، بستانکاران پذیرهنویس ر ا که بسهام شر کت تبدیل شده است بضمیمه رونوشت اسناد و مدار ک حاکی از تصفیه آنگونه مطالبات که بازرسان شر کت صحت آنرا تأیید کرده باشند همراه با صورت جلسه مجمع عمومی فوقالعاده و اظهارنامه هیئت مدیره مشعر بر اینکه کلیه این سهام خریدار ی شده و بهای آن دریافت شده است بمرجع ثبت شر کتها تسلیم شود."}, {"number": 188, "text": "در موردیکه افزایش سرمایه از طریق بالبردن مبلغ اسمی سهام موجود صورت میگیرد کلیه افزایش سرمایه باید نقدا پر داخت شود ونیز سهام جدید ی که در قبال افزایش سرمایه صادر میشود باید هنگام پذیرهنویسی بر حسب مورد کلا پرداخته یا تهاتر شود."}, {"number": 189, "text": "علاوه بر کاهش اجبار ی سرمایه مذکور در ماده 141 مجمع عمومی فوقالعاده شر کت میتواند به پیشنهاد هیأت مدیره در مورد کاهش سرمایه شر کت بطور اختیار ی اتخاذ تصمیم کند مشروط بر آنکه بر اثر کاهش سرمایه بتساو ی حقوق صاحبان سهام لطمهای وارد نشود و سرمایه شر کت از حداقل مقرر در ماده 5 این قانون کمتر نگردد. تبصره - کاهش اجبار ی سرمایه از طریق کاهش تعداد یا مبلغ اسمی سهام صورت میگیرد و کاهش اختیار ی سرمایه از طریق کاهش بهای اسمیسهام بنسبت متساو ی و رد مبلغ کاهش یافته هر سهم بصاحب آن انجام میگیر د."}, {"number": 190, "text": "پیشنهاد هیأت مدیره راجع بکاهش سرمایه باید حداقل چهل و پنج روز قبل از تشکیل مجمع عمومی فوقالعاده ببازرس یا بازرسان شر کت تسلیم گردد. پیشنهاد مزبور باید متضمن توجیه لزوم کاهش سرمایه و همچنین شامل گزارشی درباره امور شر کت از بدو سال مالی در جریان و اگر تا آنموقع مجمععمومی نسبت بحسابهای سال مالی قبل تصمیم نگرفته باشد حاکی از وضع شر کت از ابتدای سال مالی قبل باشد."}, {"number": 191, "text": "بازرس یا بازرسان شر کت پیشنهاد هیأت مدیره را مورد رسیدگی قرار داده و نظر خود را طی گزار شی به مجمع عمومی فوقالعاده تسلیمخواهد نمود و مجمع عمومی پس از استماع گزارش بازرس تصمیم خواهد گرفت."}, {"number": 192, "text": "هیأت مدیره قبل از اقدام بکاهش اختیار ی سرمایه باید تصمیم مجمع عمومی را درباره کاهش حداکثر ظرف یکماه در روزنامه رسمی و روزنامه کثیرالنتشار ی که آگهیهای مربوط بشر کت در آن نشر میگردد آگهی کند."}, {"number": 193, "text": "در مورد کاهش اختیار ی سرمایه شر کت هر یک از دارندگان اوراق قرضه و یا بستانکارانیکه منشاء طلب آنها قبل از تاریخ نشر آخرینآگهی مذکور در ماده 192 باشد میتوانند ظر ف دو ماه از تاریخ نشر آخرین آگهی اعتراض خود را نسبت بکاهش سرمایه شر کت بدادگاه تقدیم کنند."}, {"number": 194, "text": "در صورتیکه بنظر دادگاه اعتراض نسبت بکاهش سرمایه وارد تشخیص شود و شر کت جهت تأمین پرداخت طلب معترض وثیقهایکه بنظر دادگاه کافی باشد نسپار د در اینصورت آن دین حال شده و دادگاه حکم بپرداخت آن خواهد داد."}, {"number": 195, "text": "در مهلت دو ماه مذکور در ماده 193 و همچنین در صورتیکه اعتراضی شده باشد تا خاتمه اجرای حکم قطعی دادگاه شر کت از کاهشسرمایه ممنوع است."}, {"number": 196, "text": "برای کاهش بهای اسمی سهام شر کت و رد مبلغ کاهش یافته هر سهم هیئت مدیره شر کت باید مراتب را طی اطلاعیهای باطلاع کلیه صاحبان سهم برساند. اطلاعیه شر کت باید در روزنامه کثیرالنتشاریکه آگهیهای مربوط بشر کت در آن نشر میگردد منتشر شود و برای صاحبان سهامبانام توسط پست سفارشی ار سال گردد."}, {"number": 197, "text": "اطلاعیه مذکور در ماده 196 باید مشتمل بر نکات زیر باشد: 1- نام و نشانی مر کز اصلی شر کت. 2- مبلغ سرمایه شر کت قبل از اتخاذ تصمیم در مورد کاهش سرمایه. 3- مبلغی که هر سهم به آن میزان کاهش مییابد یا بهای اسمی هر سهم پس از کاهش. 4- نحوه پرداخت و مهلتی که برای بازپرداخت مبلغ کاهش یافته هر سهم در نظر گرفته شده و محلی که در آن این بازپرداخت انجام میگیرد."}, {"number": 198, "text": "خرید سهام شر کت توسط همان شر کت ممنوع است. بخش 9 - انحلال و تصفیه"}, {"number": 199, "text": "شرکت سهامی در موارد زیر منحل میشود: 1- وقتیکه شر کت موضوعی را که بر ای آن تشکیل شده است انجام داده یا انجام آن غیر ممکن شده باشد. 2- در صورتیکه شر کت برای مدت معین تشکیل گردیده و آنمدت منقضی شده باشد مگر اینکه مدت قبل از انقضاء تمدید شده باشد. 3- در صورت ورشکستگی 4- در هر موقع که مجمع عمومی فوقالعاده صاحبان سهام بهر علتی رأی بانحلال شر کت بدهد 5- در صورت صدور حکم قطعی دادگاه"}, {"number": 200, "text": "انحلال شر کت در صورت ورشکستگی تابع مقررات مربوط به ورشکستگی است."}, {"number": 201, "text": "در موارد زیر هر ذینفع میتواند انحلال شر کت را از دادگاه بخواهد 1- در صورتیکه تا یکسال پس از به ثبت رسیدن شر کت هیچ اقدامی جهت انجام موضوع آن صورت نگرفته باشد و نیز در صورتیکه فعالیتهای شر کت در مدت بیش از یکسال متوقف شده باشد. 2- در صورتیکه مجمع عمومی سالنه برای رسیدگی بحساب های هر یک از سالهای مالی تا ده ماه از تاریخی که اساسنامه معین کرده استتشکیل نشده باشد. 3- در صورتیکه سمت تمام یا بعضی از اعضای هیئت مدیره و همچنین سمت مدیر عامل شر کت طی مدتی زائد بر ششماه بلامتصد ی ماندهباشد. 4- در مورد بندهای یک و دو ماده 199 در صورتیکه مجمع عمومی فوقالعاده صاحبان سهام جهت اعلام انحلال شر کت تشکیل نشود و یا رای بانحلال شر کت ندهد."}, {"number": 202, "text": "در مورد بندهای یک و دو و سه ماده 201 دادگاه بلافاصله بر حسب مورد بمراجعی که طبق اساسنامه و این قانون صلاحیت اقدامدارند مهلت متناسبی که حداکثر از ششماه تجاوز نکند میدهد تا در رفع موجبات انحلال اقدام نمایند. در صورتیکه ظرف مهلت مقرر موجبات انحلال رفع نشود دادگاه حکم بانحلال شر کت میدهد."}, {"number": 203, "text": "تصفیه امور شر کت سهامی با رعایت مقررات این قانون انجام میگیرد. مگر در مورد ورشکستگی که تابع مقررات مربوط بورشکستگی میباشد."}, {"number": 204, "text": "امر تصفیه با مدیران شر کت است مگر آنکه اساسنامه شر کت یا مجمع عمومی فوقالعادهای که رأی بانحلال میدهد ترتیب دیگر ی مقرر داشته باشد."}, {"number": 205, "text": "در صورتیکه بهر علت مدیر تصفیه تعیین نشده باشد یا تعیین شده ولی بوظائف خود عمل نکند هر ذینفع حق دارد تعیی ن مدیرتصفیه را از دادگاه بخواهد در مواردی نیز که انحلال شر کت بموجب حکم دادگاه صورت میگیرد مدیر تصفیه را دادگاه ضمن صدور حکم انحلال شر کت تعیین خواهد نمود."}, {"number": 206, "text": "شرکت بمحض انحلال در حال تصفیه محسوب میشود و باید در دنبال نام شر کت همه جا عبارت در حال تصفیه ذکر شود و ناممدیر یا مدیران تصفیه در کلیه اوراق و آگهیهای مربوط بشر کت قید گردد."}, {"number": 207, "text": "نشانی مدیر یا مدیران تصفیه همان نشانی مر کز اصلی شر کت خواهد بود مگر آنکه بموجب تصمیم مجمع عمومی فوقالعاده یا حکم دادگاه نشانی دیگر ی تعیین شده باشد."}, {"number": 208, "text": "تا خاتمه امر تصفیه شخصیت حقوقی شر کت جهت انجام امور مربوط بتصفیه باقی خواهد ماند و مدیران تصفیه موظف بخاتمه دادن کارهای جار ی و اجرای تعهدات و وصول مطالبات و تقسیم دارائی شر کت میباشند و هرگاه برای اجرای تعهدات شر کت معاملات جدید یلزم شود مدیران تصفیه انجام خواهند داد."}, {"number": 209, "text": "تصمیم راجع به انحلال و اسامی مدیر یا مدیران تصفیه و نشانی آنها با رعایت ماده 207 این قانون باید ظرف پنج روز از طرف مدیرانتصفیه بمرجع ثبت شر کت اعلام شود تا پس از ثبت برای اطلاع عموم در روزنامه رسمی و ر و زنامه کثیرالنتشار ی که اطلاعیهها و آگهیهای مربوط بشر کت در آن نشر میگردد آگهی شود در مدت تصفیه منظور از روزنامه کثیرالنتشار روزنامه کثیرالنتشار ی است که توسط آخرین مجمع عمومیعادی قبل از انحلال تعیین شده است."}, {"number": 210, "text": "انحلال شر کت مادام که به ثبت نرسیده و اعلان نشده باشد نسبت به اشخاص ثالث بلااثر است."}, {"number": 211, "text": "از تاریخ تعیین مدیر یا مدیران تصفیه اختیارات مدیران شر کت خاتمه یافته و تصفیه شر کت شروع میشود. مدیران تصفیه باید کلیهاموال و دفاتر و اوراق و اسناد مربوط بشر کت را تحویل گرفته بلافاصله امر تصفیه شر کت را عهدهدار شوند."}, {"number": 212, "text": "مدیران تصفیه نماینده شر کت در حال تصفیه بوده و کلیه اختیارات لزم را جهت امر تصفیه حتی از طریق طرح دعو ی و ارجاع به داور ی و حق سازش دارا میباشند و میتوانند برای طرح دعاو ی و دفاع از دعاو ی و کیل تعیین نمایند. محدود کردن اختیارات مدیر ان تصفیه باطل و کانلمیکناست."}, {"number": 213, "text": "انتقال دارائی شر کت در حال تصفیه کلا یا بعضا بمدیر یا مدیران تصفیه و یا باقارب آنها از طبقه اول و دوم تا درجه چهارم ممنوعاست. هر نقل و انتقالی که برخلاف مفاد این ماده انجام گیرد باطل خواهد بود."}, {"number": 214, "text": "مدت مأموریت مدیر یا مدیران تصفیه نباید از دو سال تجاوز کند. اگر تا پایان مأموریت مدیران تصفیه امر تصفیه خاتمه نیافته باشد مدیریا مدیران تصفیه باید با ذکر علل و جهات خاتمه نیافتن تصفیه امور شر کت مهلت اضافی را که برای خاتمه دادن بامر تصفیه لزم میدانند و تدابیر ی راکه جهت پایان دادن بامر تصفیه در نظر گرفتهاند باطلاع مجمع عمومی صاحبان سهام رسانیده تمدید مدت مأموریت خود را خواستار شوند."}, {"number": 215, "text": "هرگاه مدیر یا مدیران تصفیه توسط دادگاه تعیین شده باشند تمدید مدت مأموریت آنان با رعایت شرایط مندرج در ماده 214 با دادگاهخواهد بود."}, {"number": 216, "text": "مدیر یا مدیران تصفیه توسط همان مرجعی که آنان را انتخاب کرده است قابل عزل میباشند."}, {"number": 217, "text": "مادام که امر تصفیه خاتمه نیافته است مدیران تصفیه باید همه ساله مجمع عمومی عادی صاحبان سهام شر کت را با رعایت شرایط و تشریفاتیکه در قانون و اساسنامه پیشبینی شده است دعوت کرده صورت دارائی منقول و غیر منقول و ترازنامه و حساب سود و زیان عملیات خود را بضمیمه گزارشی حاکی از اعمالیکه تا آن موقع انجام دادهاند بمجمع عمومی مذکور تسلیم کنند."}, {"number": 218, "text": "در صورتیکه بموجب اساسنامه شر کت یا تصمیم مجمع عمومی صاحبان سهام برای دوره تصفیه یک یا چند ناظر معین شده باشد ناظر باید بعملیات مدیران تصفیه رسیدگی کرده گزارش خود را بمجمع عمومی عادی صاحبان سهام تسلیم کند."}, {"number": 219, "text": "در مدت تصفیه دعوت مجامع عمومی در کلیه موارد بعهده مدیران تصفیه است. هرگاه مدیران تصفیه باین تکلیف عمل نکنند ناظرمکلف بدعوت مجمع عمومی خواهد بود و در صورتیکه ناظر نیز به تکلیف خود عمل نکند یا ناظر پیشبینی یا معین نشده باشد دادگاه به تقاضایهر ذینفع حکم بتشکیل مجمع عمومی خواهد داد."}, {"number": 220, "text": "صاحبان سهام حق دارند مانند زمان قبل از انحلال شر کت از عملیات و حسابها در مدت تصفیه کسب اطلاع کنند."}, {"number": 221, "text": "در مدت تصفیه مقررات راجع بدعوت و تشکیل مجامع عمومی و شرایط حد نصاب و اکثریت مجامع مانند زمان قبل از انحلال باید رعایت شود و هر گونه دعوتنامه و اطلاعیهایکه مدیران تصفیه برای صاحبان سهام منتشر میکنند باید در روزنامه کثیر النتشار ی که اطلاعیهها وآگهیهای مربوط بشر کت در آن درج میگردد منتشر شود."}, {"number": 222, "text": "در مواردیکه بموجب این قانون مدیران تصفیه مکلف بدعوت مجامع عمومی و تسلیم گزارش کارهای خود میباشند هرگاه مجمععمومی مورد نظر دو مرتبه با رعایت تشریفات مقرر در این قانون دعوت شده ولی تشکیل نگردد و یا اینکه تشکیل شده و نتواند تصمیم بگیرد مدیرانتصفیه باید گزارش خود و صورت حسابهای مقرر در ماده 217 این قانون را در روزنامه کثیرالنتشار ی که اطلاعیهها و آگهیهای مربوط بشر کت درآن درج میگردد برای اطلاع عموم سهامداران منتشر کنند."}, {"number": 223, "text": "آن قسمت از دارائی نقد ی شر کت که در مدت تصفیه مورد احتیاج نیست بین صاحبان سهام به نسبت سهام تقسیم میشود بشرط آنکه حقوق بستانکاران ملحوظ و معادل دیونی که هنوز موعد تأدیه آن نرسیده است موضوع شده باشد."}, {"number": 224, "text": "پس از ختم تصفیه و انجام تعهدات و تأدیه کلیه دیون دارائی شر کت بدوا بمصرف بازپرداخت مبلغ اسمی سهام به سهامداران خواهد رسید و مازاد بترتیب مقر ر در اساسنامه شر کت و در صور تیکه اساسنامه ساکت باشد به نسبت سهام بین سهامداران تقسیم خواهد شد."}, {"number": 225, "text": "تقسیم دارائی شر کت بین صاحبان سهام خواه در مدت تصفیه و خواه پس از آن ممکن نیست مگر آنکه شروع تصفیه و دعوت بستانکاران قبلا سه مرتبه و هر مرتبه بفاصله یکماه در روزنامه رسمی و روزنامه کثیرالنتشار ی که اطلاعیهها و آگهیهای مربوط بشر کت در آن درج میگردد آگهی شده و لاقل ششماه از تاریخ انتشار اولین آگهی گذشته باشد."}, {"number": 226, "text": "تخلف از ماده 225 مدیران تصفیه را مسئول خسارات بستانکارانی قرار خواهد داد که طلب خود را دریافت نکردهاند."}, {"number": 227, "text": "مدیران تصفیه مکلفند ظرف یکماه پس از ختم تصفیه مراتب را بمرجع ثبت شر کتها اعلام دارند تا به ثبت رسیده و در روزنامهرسمی و روزنامه کثیرالنتشار ی که اطلاعیهها و آگهیهای مربوط بشر کت در آن درج میگردد آگهی شود و نام شر کت از دفتر ثبت شر کتها و دفترثبت تجارتی حذف گر دد."}, {"number": 228, "text": "پس از اعلام ختم تصفیه مدیران تصفیه باید وجوهی را که باقیمانده است در حساب مخصوصی نزد یکی از بانکهای ایران تودیع وصورت اسامی بستانکاران و صاحبان سهامی را که حقوق خود را استیفاء نکردهاند نیز بآن بانک تسلیم و مراتب را طی آگهی مذکور در همان ماده باطلاع اشخاص ذینفع برسانند تا برای گرفتن طلب خود ببانک مراجعه کنند. پس از انقضاء دهسال از تاریخ انتشار آگهی ختم تصفیه هر مبلغ از وجوه که در بانک باقیمانده باشد در حکم مال بلاصاحب بوده و از طرف بانک با اطلاع دادستان شهرستان محل بخزانه دولت منتقل خواهد شد."}, {"number": 229, "text": "دفاتر و سایر اسناد و مدار ک شر کت تصفیه شده باید تا ده سال از تاریخ اعلام ختم تصفیه محفوظ بماند باین منظور مدیران تصفیه باید مقارن اعلام ختم تصفیه بمرجع ثبت شر کتها دفاتر و اسناد و مدار ک مذکور را نیز بمرجع ثبت شر کتها تحویل دهند تا نگهدار ی و بر ای مراجعهاشخاص ذینفع آماده باشد."}, {"number": 230, "text": "در صورتیکه مدیر تصفیه قصد استعفا از سمت خود را داشته باشد باید مجمع عمومی عادی صاحبان سهام شر کت را جهت اعلاماستعفای خود و تعیین جانشین دعوت نماید. در صورتیکه مجمع عمومی عادی مزبور تشکیل نشود یا نتواند مدیر تصفیه جدید ی را انتخاب کند و نیزهرگاه مدیر تصفیه توسط دادگاه تعیین شده باشد مدیر تصفیه مکلف است که قصد استعفای خود را بدادگاه اعلام کند و تعیین مدیر تصفیه جدید را ازدادگاه بخواهد. در هر حال استعفای مدیر تصفیه تا هنگامی که جانشین او بترتی ب مذکور در این ماده انتخاب نشده و مراتب طبق ماده 209 این قانونثبت و آگهی نشده باشد کانلمیکن است."}, {"number": 231, "text": "در صورت فوت یا حجر یا ورشکستگی مدیر تصفیه اگر مدیران تصفیه متعدد باشند و مدیر تصفیه متوفی یا محجور یا ورشکسته توسط مجمع عمومی شر کت انتخاب شده باشد مدیر یا مدیران تصفیه باقیمانده باید مجمع عمومی عادی شر کت را جهت انتخاب جانشین مدیر تصفیه متوفی یا محجور یا ورشکسته دعوت نمایند و در صورتیکه مجمع عمومی عادی مزبور تشکیل نشود یا نتواند جانشین مدیر تصفیه متوفی یا محجور یاورشکسته را انتخاب کند یا در صورتیکه مدیر تصفیه متوفی یا محجور یا ورشکسته توسط دادگاه تعیین شده باشد مدیر یا مدیران تصفیه باقیمانده مکلفند تعیین جانشین مدیر تصفیه متوفی یا محجور یا ورشکسته را از دادگاه بخواهند. اگر امر تصفیه منحصرا بعهده یک نفر باشد در صورت فوت یا حجر یا ورشکستگی مدیر تصفیه در صورتیکه مدیر تصفیه توسط مجمع عمومیشر کت انتخاب شده باشد هر ذینفع میتواند از مرجع ثبت شر کتها بخواهد که مجمع عمومی عادی صاحبان سهام شرکت را جهت تعیین جانشینمدیر تصفیه مذکور دعوت نماید و در صورتیکه مجمع عمومی عادی مزبور تشکیل نگردد یا نتواند جانشین مدیر تصفیه را انتخاب نماید یا در صورتیکه مدیر تصفیه متوفی یا محجور یا ورشکسته توسط دادگاه تعیین شده باشد هر ذینفع میتواند تعیین جانشین را از دادگاه بخواهد. بخش 10 - حسابهای شر ک ت"}, {"number": 232, "text": "هیأت مدیره شر کت باید پس از انقضای سال مالی صورت دارائی و دیون شر کت را در پایان سال و همچنین تر ازنامه و حساب عملکردو حساب سود و زیان شر کت را بضمیمه گزارشی درباره فعالیت و وضع عمومی شر کت طی سال مالی مزبور تنظیم کند. اسناد مذکور در این ماده باید اقلا بیست روز قبل از تاریخ مجمع عمومی عادی سالنه در اختیار بازرسان گذاشته شود."}, {"number": 233, "text": "در تنظیم حساب عملکرد و حساب سود و زیان و ترازنامه شر کت باید همان شکل و روشهای ارزیابی که در سال مالی قبل از آن بکاررفته است ر عایت شود. با وجود این در صورتیکه تغیی ر ی در شکل و روشهای ارزیابی سال قبل از آن مورد نظر باشد باید اسناد مذکور بهر دو شکل وهر دو روش ارزیابی تنظیم گردد تا مجمع عمومی با ملاحظه آنها و با توجه بگزارش هیأت مدیره و بازرسان نسبت به تغییرات پیشنهادی تصمیم بگیرد."}, {"number": 234, "text": "در ترازنامه باید استهلاک اموال و اندوختههای لزم در نظر گر فته شود ولو آنکه پس از وضع استهلاک و اندوختهها سود قابل تقسیم باقی نماند یا کافی نباشد. پائین آمدن ارزش دارائی ثابت خواه در نتیجه استعمال خواه بر اثر تغییرات فنی و خواه بعلل دیگر باید در استهلاکات منظور گردد. برای جبران کاهشاحتمالی ارزش سایر اقلام دارائی و زیانها و هزینههای احتمالی باید ذخیره لزم منظور گردد."}, {"number": 235, "text": "تعهداتی که شر کت آنرا تضمین کرده است باید با قید مبلغ در ذیل ترازنامه آورده شود."}, {"number": 236, "text": "هزینههای تأسیس شر کت باید قبل از تقسیم هر گونه سود مستهلک شود. هزینههای افزایش سرمایه باید حداکثر تا پنج سال از تاریخی که اینگونه هزینهها بعمل آمده مستهلک شود. در صورتیکه سهام جدید ی که در نتیجه افزایش سرمایه صادر میشود به قیمتی بیش از مبلغ اسمی فروخته شده باشد هزینههای افزایش سرمایه را میتوان از محل این اضافه ارزش مستهلک نمود."}, {"number": 237, "text": "سود خالص شر کت در هر سال مالی عبارتست از درآمد حاصل در همان سال مالی منهای کلیه هزینهها و استهلاکات و ذخیرهها."}, {"number": 238, "text": "از سود خالص شر کت پس از وضع زیانهای وارده در سالهای قبل باید معادل یک بیستم آن بر طبق ماده 140 بعنوان اندوخته قانونی موضوع شود. هر تصمیم برخلاف این ماده باطل است."}, {"number": 239, "text": "سود قابل تقسیم عبارتست از سود خالص سال مالی شر کت منهای زیانهای سالهای مالی قبل و اندوخته قانونی مذکور در ماده238 و سایر اندوختههای اختیار ی بعلاوه سود قابل تقسیم سالهای قبل که تقسیم نشده است."}, {"number": 240, "text": "مجمع عمومی پس از تصویب حساب های سال مالی و احراز اینکه سود قابل تقسیم وجود دار د مبلغی از آنرا که باید بین صاحبانسهام تقسیم شود تعیین خواهد نمود. علاوه بر این مجمع عمومی میتو اند تصمیم بگیرد که مبالغی از اندوختههائی که شر کت در اختیار دارد بین صاحبان سهام تقسیم شود در این صورت در تصمیم مجمع عمومی باید صریحا قید شود که مبالغ مورد نظر از کدام یک از اندوختهها باید برداشت وتقسیم گردد. هر سودی که بدون رعایت مقررات این قانون تقسیم شود منافع موهوم تلقی خواهد شد. نحوه پرداخت سود قابل تقسیم توسط مجمع عمومی تعیین میشود و اگر مجمع عمومی در خصوص نحوه پرداخت تصمیمی نگرفته باشد هیئت مدیره نحوه پرداخت را تعیین خو اهد نمود ولی درهر حال پرداخت سود بصاحبان سهام باید ظرف هشت ماه پس از تصمیم مجمع عمومی راجع به تقسیم سود انجام پذیرد"}, {"number": 241, "text": "با رعایت شرایط مقرر در ماده (134) نسبت معینی از سود خالص سال مالی شر کت که ممکن است جهت پاداش هیأت مدیر ه در نظر گرفته شود، بههیچ وجه نباید در شر کتهای سهامی عام از سهدرصد (3%) و در شر کتهای سهامی خاص از ششدرصد (6%) سودی که در همان سال به صاحبان سهام قابل پرداخت است، تجاوز کند. در هر حال این پاداش نمیتواند برای هر عضو موظف از معادل یکسال حقوق پایه و ی و بر ای هر عضو غیرموظف از حداقل پاداش اعضای موظف هیأت مدیره بیشتر باشد. مقررات اساسنامه و هرگونه تصمیمی که مخالف با مفاد این ماده باشد، باطل و بلااثر است. تبصر ه 1- شرکتهای دولتی، مشمول مقررات این ماده در خصوص پاداش هیأت مدیره نیستند و تابع حکم مقرر در ماده (78) قانون مدیریت خدمات کشور ی مصوب 8 /7 /1386 میباشند. تبصره 2- هیچ فردی نمیتواند اصالتا یا به نمایندگی از شخص حقوقی همزمان در بیش از یک شر کت که تمام یا بخشی از سرمایه آن متعلق به دولت یا نهادها یا  تعدیل یافته است."}, {"number": 244, "text": "اشخاص زیر بحبس تأدیبی از سه ماه تا یکسال یا به جزای نقد ی از پنجاه هزار ریال تا پانصد هزار ریال یا بهر دو مجازات محکومخواهند شد: 1- هرکس عالما سهام یا گواهینامه موقت سهام بدون ذکر مبلغ اسمی صادر کند یا بفروشد یا به معرض فروش گذارد. 2- هر کس سهام بینام را قبل از آنکه تمام مبلغ اسمی آن پرداخت شده باشد بفروشد یا به معرض فروش گذارد. 3- هرکس سهام بانام را قبل از آنکه اقلا سی و پنج درصد مبلغ اسمی آن پرداخت شده باشد بفروشد یا به معرض فروش گذارد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به50.000.000 تا 200.000.000 ریال تعدیل یافته است"}, {"number": 245, "text": "هرکس عالما در هر یک از عملیات مذکور در ماده 244 شرکت کند یا انجام آن عملیات را تسهیل نماید بر حسب مورد بمجازات شریک یا معاون محکوم خواهد شد."}, {"number": 246, "text": "رئیس و اعضاء هیأت مدیره هر شر کت سهامی در صورت ارتکاب هر یک از جرائم زیر بحبس تأدیبی از دو ماه تا ششماه یا به جزای نقد ی از سی هزار تا سیصد هزار ریال یا بهر دو مجازات محکوم خواهند شد: 1- در صورتیکه ظرف مهلت مقرر در این قانون قسمت پرداخت نشده مبلغ اسمی سهام شر کت را مطالبه نکنند و یا دو ماه قبل از پایان مهلتمذکور مجمع عمومی فوقالعاده را جهت تقلیل سرمایه شر کت تا میزان مبلغ پرداخت شده دعوت ننمایند. 2- در صورتیکه قبل از پرداخت کلیه سرمایه شر کت بصدور اوراق قرضه مبادرت کرده یا صدور آنرا اجازه دهند. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به30.000.000 تا 60.000.000ریال تعدیل یافته است"}, {"number": 247, "text": "در مورد بند یک ماده 246 در صورتیکه هر یک از اعضاء هیأت مدیره قبل از انقضاء مهلت مقرر در جلسه هیأت مزبور صریحا اعلام کند که باید به تکلیف قانونی برای سلب مسئولیت جزائی عمل شود و باین اعلام از طرف سایر اعضاء هیأت مدیره توجه نشود و جر م تحقق پیدا کند عضو هیأت مدیره که تکلیف قانونی را اعلام کرده است مجرم شناخته نخواهد شد. سلب مسئولیت جزائی از عضو هیأت مدیره منوط باینست کهعضو هیأت مدیره علاوه بر اعلام تکلیف قانونی در جلسه هیأت مزبور مراتب را از طریق ارسال اظهارنامه رسمی بهر یک از اعضاء هیأت مدیره اعلام نماید. در صورتیکه جلسات هیأت مدیره بهر علت تشکیل
