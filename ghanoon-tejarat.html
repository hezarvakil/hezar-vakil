<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>قانون تجارت مصوب ۱۳۱۱</title><style>body{font-family:Tahoma,Vazirmatn,sans-serif;background:#f7f5ef;color:#222;line-height:2;margin:0}header{background:#1a3c5e;color:#fff;text-align:center;padding:24px 12px}h1{margin:0;font-size:1.5rem}main{max-width:850px;margin:24px auto;padding:0 16px}h2{color:#1a3c5e;border-bottom:2px solid #c9a227;padding-bottom:6px;margin-top:40px}.article{background:#fff;border:1px solid #e0dccf;border-radius:8px;padding:12px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}.num{color:#c9a227;font-weight:bold}footer{text-align:center;color:#888;font-size:.85rem;padding:20px}</style></head><body><header><h1>قانون تجارت مصوب ۱۳۱۱</h1></header><main id="content"></main><footer>نسخهٔ نمایشی — تولید شده به‌صورت خودکار</footer><script>
const DATA={"tejarat": [{"number": 1, "text": "تاجر کسی است که شغل معمولی خود را معاملات تجارتی قرار بدهد."}, {"number": 2, "text": "معاملات تجارتی از قرار ذیل است: 1) خرید یا تحصیل هر نوع مال منقول بقصد فروش یا اجاره اعم از اینکه تصرفاتی در آن شده یا نشده باشد. 2) تصدی به حمل و نقل از راه خشکی یا آب یا هوا بهر نحو ی که باشد. 3) هر قسم عملیات دللی یا حقالعمل کار ی (کمیسیون) و یا عاملی و همچنین تصد ی بهر نوع تأسیساتی که برای انجام بعضی امور ایجاد میشود از قبیل تسهیل معاملات ملکی یا پیدا کردن خدمه یا تهیه و رسانیدن ملزومات و غیره. 4) تأسیس و به کار انداختن هر قسم کارخانه مشروط بر اینکه برای رفع حوائج شخصی نباشد. 5) تصدی بعملیات حراجی. 6) تصدی بهر قسم نمایشگاههای عمومی. 7) هر قسم عملیات صرافی و بانکی. 8) معاملات برواتی اعم از اینکه بین تاجر یا غیر تاجر باشد. 9) عملیات بیمه بحر ی و غیر بحر ی 10) کشتی ساز ی و خرید و فروش کشتی و کشتیرانی داخلی یا خارجی و معاملات راجعه به آنها."}, {"number": 3, "text": "معاملات ذیل باعتبار تاجر بودن متعاملین یا یکی از آنها تجارتی محسوب میشود: 1) کلیه معاملات بین تجار و کسبه و صرافان و بانکها. 2) کلیه معاملاتی که تاجر یا غیر تاجر برای حوائج تجارتی خود مینماید. 3) کلیه معاملاتیکه اجزاء یا خدمه یا شاگرد تاجر برای امور تجارتی ارباب خود مینماید. 4) کلیه معاملات شر کت های تجارتی."}, {"number": 4, "text": "معاملات غیر منقول بهیچوجه تجارتی محسوب نمیشود."}, {"number": 5, "text": "کلیه معاملات تجار تجارتی محسوب است مگر اینکه ثابت شود معامله مربوط بامور تجارتی نیست. باب دوم- دفاتر تجارتی و دفتر ثبت تجارتی فصل اول- دفاتر تجارتی"}, {"number": 6, "text": "هر تاجر ی به استثنای کسبه جزء مکلف است دفاتر ذیل یا دفاتر دیگر ی را که وزارت عدلیه بموجب نظامنامه قائممقام این دفاتر قرارمیدهد داشته باشد: 1) دفتر روزنامه. 2) دفتر کل. 3) دفتر دارائی. 4) دفتر کپیه."}, {"number": 7, "text": "دفتر روزنامه دفتر ی است که تاجر باید همه روزه مطالبات و دیون و داد و ستد تجارتی و معاملات راجع به اوراق تجارتی (از قبیل خرید و فروش و ظهرنویسی) و بطور کلی جمیع واردات و صادرات تجارتی خود را بهر اسم و رسمی که باشد و وجوهی را که برای مخارج شخصی خود برداشت میکند در آن دفتر ثبت نماید."}, {"number": 8, "text": "دفتر کل دفتر ی است که تاجر باید کلیه معاملات را لاقل هفته یکمرتبه از دفتر روزنامه استخراج و انواع مختلفه آن را تشخیص و جدا کرده هر نوعی را در صفحه مخصوصی در آن دفتر بطور خلاصه ثبت کند."}, {"number": 9, "text": "دفتر دارائی دفتر ی است که تاجر باید هر سال صورت جامعی از کلیه دارائی منقول و غیر منقول و دیون و مطالبات سال گذشته خود را بریز ترتیب داده در آن دفتر ثبت و امضاء نماید و این کار باید تا پانزدهم فرو ردین سال بعد انجام پذیرد."}, {"number": 10, "text": "دفتر کپیه دفتر ی است که تاجر باید کلیه مراسلات و مخابرات و صورت حسابهای صادره خود را در آن بترتیب تاریخ ثبت نماید. تبصره- تاجر باید کلیه مراسلات و مخابرات و صورت حسابهای وارده را نیز بترتیب تاریخ ورود مرتب نموده و در لفاف مخصوصی ضبط کند."}, {"number": 11, "text": "دفاتر مذکور در ماده 6 به استثناء دفتر کپیه قبل از آنکه در آن چیزی نوشته شده باشد بتوسط نماینده اداره ثبت (که مطابق نظامنامه وزارت عدلیه معین میشود) امضاء خواهد شد. برای دفتر کپیه امضاء مزبور لزم نیست ولی باید اوراق آن دارای نمره ترتیبی باشد. در موقع تجدید سالیانه هر دفتر مقررات این ماده رعایت خواهد شد. حق امضاء از قرار هر صد صفحه یا کسور آن دو ریال و بعلاوه مشمول ماده (135) قانون ثبت اسناد است."}, {"number": 12, "text": "دفتری که برای امضاء بمتصد ی امضاء تسلیم میشود باید دارای نمره ترتیبی و قیطان کشیده باشد و متصد ی امضاء مکلف است صفحات دفتر را شمرده در صفحه اول و آخر هر دفتر مجموع عدد صفحات آنرا با تصریح باسم و رسم صاحب دفتر نوشته با قید تاریخ امضاء و دو طرف قیطان را با مهر سربی که وزارت عدلیه برای این مقصود تهیه مینماید منگنه کند. لزم است کلیه اعداد حتی تاریخ با تمام حروف نوشته شود."}, {"number": 13, "text": "کلیه معاملات و صادرات و واردات در دفاتر مذکوره فوق باید بترتیب تاریخ در صفحات مخصوصه نوشته شود- تراشیدن و حککردن و همچنین جای سفید گذاشتن بیش از آنچه که در دفترنویسی معمول است و در حاشیه و یا بین سطور نوشتن ممنوع است و تاجر باید تمام آن دفاتر را از ختم هر سالی لاقل تا ده سال نگاهدارد."}, {"number": 14, "text": "دفاتر مذکور در ماده 6 و سایر دفاتر ی که تجار برای امور تجارتی خود بکار میبرند در صورتی که مطابق مقررات این قانون مرتب شده باشد بین تجار- در امور تجارتی- سندیت خو اهد داشت و غیر اینصور ت فقط بر علیه صاحب آن معتبر خواهد بود."}, {"number": 15, "text": "تخلف از ماده 6 و ماده 11 مستلزم دویست تا ده هزار ریال جزای نقد ی است. این مجازات را محکمه حقوق رأسا و بدون تقاضای مدعیالعموم می تواند حکم بدهد و اجرای آن مانع اجرای مقررات راجع به تاجر ورشکستة که دفتر مرتب ندارد نخواهد بود. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به000 /000 /10 تا 60.000.000ریال تعدیل یافته است فصل دوم - دفتر ثبت تجارتی"}, {"number": 16, "text": "در نقاطی که وزارت عدلیه مقتضی دانسته و دفتر ثبت تجارتی تأسیس کند کلیه اشخاصی که در آن نقاط بشغل تجارت اشتغال دارند اعماز ایرانی و خارجی باستثنای کسبه جزء باید در مدت مقرر اسم خود را در دفتر ثبت تجارتی به ثبت برسانند و ال بجزای نقد ی از از دویست تا دو هزار ریال محکوم خواهند شد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به000 /000 /10 تا 60.000.000ریال تعدیل یافته است"}, {"number": 17, "text": "مقررات مربوطه بدفتر ثبت تجارتی را وزارت عدلیه با تصریح بموضوعاتی که باید به ثبت برسد بموجب نظامنامه معین خواهد کرد."}, {"number": 18, "text": "شش ماه پس از الزامی شدن ثبت تجارتی هر تاجر ی که مکلف بثبت است باید در کلیه اسناد و صورت حسابها و نشریات خطی یا چاپی خود در ایران تصریح نماید که در تحت چه نمره بثبت رسیده و ال علاوه بر مجاز ات مقرر در فوق بجزای نقد ی از دویست تا دو هزار ریال محکوم می شود. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به000 /000 /10 تا 60.000.000ریال تعدیل یافته است"}, {"number": 19, "text": "کسبه جزء مذکور در این فصل و فصل اول مطابق مقررات نظامنامه وزارت عدلیه تشخیص میشوند. باب سوم- شر کتهای تجارتی فصل اول- در اقسام مختلفه شر کت ها و قواعد راجعه بآنها"}, {"number": 20, "text": "شرکتهای تجارتی بر هفت قسم است: 1) شرکت سهامی. 2) شرکت با مسئولیت محدود. 3) شرکت تضامنی. 4) شرکت مختلط غیر سهامی. 5) شرکت مختلط سهامی. 6) شرکت نسبی. 7) شرکت تعاونی تولید و مصرف. مبحث اول- شرکت های سهامی"}, {"number": 21, "text": "شرکت سهامی شر کتی است که بر ای امور تجارتی تشکیل و سرمایه آن به سهام تقسیم شده و مسئولیت صاحبان سهام محدود بسهامآنها است."}, {"number": 22, "text": "در اسم شر کت سهامی نام هیچیک از شر کاء قید نخواهد شد- در اسم شر کت باید کلمه (سهامی) قید شود."}, {"number": 23, "text": "سهام ممکن است با اسم یا بیاسم باشد."}, {"number": 24, "text": "سهام بیاسم بصورت سند در وجه حامل مرتب و دارنده آن مالک شناخته میشود مگر آنکه خلاف آن قانونا ثابت گردد- نقل و انتقالاین نوع سهام به قبض و اقباض بعمل میآید."}, {"number": 25, "text": "انتقال سهام با اسم باید در دفتر شر کت به ثبت برسد صاحب سهم باید شخصا یا به توسط و کیل انتقال ر ا در دفتر شر کت تصدیق و امضا نماید."}, {"number": 26, "text": "سهام ممکن است نقد ی باشد یا غیر نقد ی- سهام غیر نقد ی سهامی است که در ازاء آن بجای وجه نقد چیز دیگر ی از قبیل کارخانه وامتیازنامه و غیره داده شود."}, {"number": 27, "text": "قیمت سهام و همچنین قیمت قطعات سهام (در صورت تجزیه) متساو ی خواهد بود."}, {"number": 28, "text": "در صورتیکه سرمایه شر کتهای سهامی از دویست هزار ریال تجاوز نکند سهام یا قطعات سهام نباید کمتر از پنجاه ریال باشد و هر گاه سرمایه زائد بر دویست هزار ریال باشد سهام و قطعات سهام کمتر از یکصد ریال نخواهد بود."}, {"number": 29, "text": "مادام که شر کت سهامی تشکیل نشده سهام یا تصدیق موقتی (اعم از بااسم یا بیاسم) نمیتوان صادر کرد هر سهم یا تصدیق موقتی که قبل از تشکیل شر کت بکسی داده شده باشد باطل و صادر کنندگان متضامنا مسئول خساراتی هستند که بدارندگان این قبیل اوراق وارد شده است. تا زمانیکه پنجاه درصد قیمت اسمی سهام تأدیه نشده نمیتوان سهام بیاسم یا تصدیق موقتی بیاسم انتشار داد."}, {"number": 30, "text": "کسانیکه تعهد ابتیاع سهام کردهاند تا موقعی که پنجاه درصد قیمت اسمی سهام خود را نپرداختهاند مسئول تأدیه بقیه قیمت آن خواهند بود اگر چه سهام خود را بدیگر ی منتقل کرده و منتقلالیه نیز پرداخت بقیه را تعهد کرده باشد."}, {"number": 31, "text": "بعد از تأدیه پنجاه درصد نیز کسیکه تعهد ابتیاع سهمی را کرده است از تأدیه بقیه قیمت آن بر ی نخواهد بود مگر اینکه اساسنامه شر کتآنرا تجویز کرده باشد که در اینصورت منتقلالیه مسئول تأدیه آن بقیه است."}, {"number": 32, "text": "هر کس تعهد ابتیاع سهامی را کرده و در موعد مقرر وجه تعهد شده را نپردازد علاوه بر آن وجه بخسار ات تأخیر تأدیه (از قر ار صد ی دوازده در سال و بنسبت مدت تأخیر) محکوم خواهد شد."}, {"number": 33, "text": "اساسنامه شر کت میتواند نسبت باشخاص مذکور در ماده فوق ترتیب دیگر ی اتخاذ نموده حتی مقرر دارد که در صورت عدم تأدیه بقیه قیمت سهام مقدار تأدیه شده از آن بابت بلاعوض تعلق بشر کت یافته و تعهد کننده نسبت بسهام تعهد ی هیچ حقی نداشته باشد لیکن در اینصورت پرداخت وجه تعهد شده باید لاقل سه مرتبه بوسیله مکتوب با قبض رسید مطالبه و از تاریخ آخرین مکتوب یکماه منقضی شده باشد در مورد سهام بیاسم بجای مکتوب اعلان در جراید بعمل خواهد آمد مفاد این ماده باید در موقع تعهد صریحا در دفتر شر کت قید شده و متعهد ذیل آنرا امضاء نماید."}, {"number": 34, "text": "خواه در سهام بااسم و خواه در سهام بیاسم مادام که قیمت آنها کاملا تأدیه نشده است باید آن مقدار از قیمت که پرداخته شده صریحا رو ی سهم قید شود بعلاوه شر کت مکلف است در هر گونه اسناد و صورت حسابها و اعلانات و نشریات و غیره که بطور خطی یا چاپی صادر یامنتشر مینماید میزان سرمایه خود و آنقسمتی را که تأدیه شده است صریحا قید کند."}, {"number": 35, "text": "هر شر کت سهامی میتواند بموجب رأی مجمع عمومی که مطابق ماده (74) اینقانون تشکیل شده باشد سهام ممتازة ترتیب دهد کهنسبت بسایر سهام رجحان و مزایائی داشته باشد ولی ایجاد این نوع سهام مشروط است باینکه اساسنامه شر کت چنی ن اقدامی را تجویز کرده باشد. 2- تشکیل شر کت"}, {"number": 36, "text": "شرکت سهامی بموجب شر کتنامه که در دو نسخه نوشته شده باشد تشکیل میشود یکی از نسختین بطوریکه در ماده (50) مقرراست ضمیمه اظهارنامه مدیر شر کت و دیگر ی در مر کز اصلی شر کت ضبط خواهد شد."}, {"number": 37, "text": "شرکت باید دارای اساسنامة باشد که نکات ذیل مخصوصا در آن تصریح بشود: 1) اسم و مر کز اصلی شر کت. 2) موضوع شر کت. 3) مدت شر کت در صور تیکه شر کت برای مدت معینی تشکیل شود. 4) مقدار سرمایه شر کت و مقدار قیمت سهام. 5) نوع سهام (که سهام بااسم است یا بیاسم) عده هر نوع از سهام و تعیین اینکه سهام بااسم و بیاسم بچه شکل ممکن است بهم تبدیل شود درصورتیکه این تبدیل اساسا پذیرفته باشد. 6) هیئت های اداره و تفتیش. 7) عده سهامی را که مدیران شر کت باید بصندوق شر کت بسپارند. 8) مقررات راجع بدعوت مجمع عمومی و حق رأی صاحبان سهام و طریقه شور و اخذ رأی. 9) مطالبی که برای قطع آن در مجموع عمومی اکثریت مخصوصی لزم است. 10) طرز ترتیب صورت حساب سالیانه و رسیدگی به آن و همچنین اصولی که برای حساب منافع و تقسیم آن باید رعایت شود. 11) طریق تغییر اساسنامه."}, {"number": 38, "text": "تشکیل شر کتهای سهامی محقق نمیشود مگر بعد از آنکه تأدیه تمام سرمایه شر کت تعهد شده باشد بعلاوه هر گاه سهام یا قطعات آن زائد بر پنجاه ریال نباشد تعهد کنندگان باید تمام وجه را تأدیه نمایند و ال باید لاقل ثلث قیمت سهام را نقدا بپردازند و در هر حال وجهی که پرداخته میشود نباید کمتر از 50 ریال باشد."}, {"number": 39, "text": "چیزی که در ازاء سهام غیر نقد ی تعهد شده تماما باید تحویل شود."}, {"number": 40, "text": "مؤسسین باید پس از تنظیم نوشتة که حاکی از تعهد پرداخت سرمایه شر کت و تأدیه واقعی ثلث سرمایه نقد ی است مجمع عمومی شر کت را دعوت نمایند این مجمع اولین مدیرهای شر کت و همچنین مفتش (کمیسر) هائی را که بموجب ماده (62) مقرر است معین میکند."}, {"number": 41, "text": "هر گاه یکی از تعهد کنندگان سهم غیر نقد ی اختیار کند یا مزایای خاصی برای خود مطالبه نماید مجمع عمومی در جلسه اول که منعقدمیشود امر بتقویم سهم غیر نقد ی نموده یا موجبات مزایای مطالبه شده را تحت نظر میگیر د تصویب قطعی تقویم یا موجبات مزایا بعمل نمیآید وتشکیل شر کت واقع نمیشود مگر در جلسه دیگر مجمع عمومی که بر حسب دعوت جدید منعقد خواهد شد و برای اینکه در جلسه دوم تقویم یاموجبات مزایا تصویب شود باید لاقل پنج روز قبل از انعقاد جلسه راپرتی در این خصوص طبع و بین تمام تعهد کنندگان توزیع شده باشد تصویب امور مذکور باید باکثریت دو ثلث تعهد کنندگان حاضر باشد و جلسه مجمع عمومی قانونی نخواهد بود مگر اینکه عددا نصف کل شر کائی که خرید سهامنقد ی را تعهد کردهاند حاضر بوده و نصف کل سرمایه نقد ی را دارا باشند کسانی که دارای سهم غیر نقد ی هستند یا مزایای خاصی برای خود مطالبه کر دهاند در موقعیکه سهم غیر نقد ی یا مزایای آنها موضوع رأی است حق رأی ندار ند آن قسمت از سرمایه غیر نقد ی که موضوع مذاکره و رأی است درجزو سرمایه شر کت محسوب نخواهد شد اگر در جلسه دوم مجمع عمومی نصف تعهد کنند گان سهام نقد ی و نصف سرمایه نقد ی حاضر نشده مجمع بطور موقت تصمیم خواهد گرفت و مطابق قسمت اخیر ماده (45) رفتار میشود. هر گاه سهام غیر نقد ی یا موجبات مزایائی که مطالبه شده و تصویب نشود هر یک از تعهد کنندگان میتواند از شر کت خارج شود."}, {"number": 42, "text": "تصویب مراتب مذکور در ماده فوق مانع نیست از اینکه بعدا نسبت بآنها دعو ی تزویر و تقلب اقامه شود."}, {"number": 43, "text": "هر گاه شر کت بین اشخاصی منعقد شود که سرمایههای غیر نقد ی مشاعا و منحصرا متعلق بخودشان باشد رعایت ترتیبات مذکوره درماده (41) راجع بتقویم سهام غیر نقد ی لزم نخواهد بود."}, {"number": 44, "text": "اظهارنامة که بموجب ماده (50) بدایره ثبت اسناد باید تسلیم شود مؤسسین شر کت تهیه نموده با اسناد مربوطه باولین مجمععمومی تقدیم مینمایند تا مجمع صحت یا سقم آنرا معین کند."}, {"number": 45, "text": "مجمع عمومی که در باب صحت اظهارات مؤسسین اظهار رأی و اولین مدیرها و مفتشین را انتخاب مینماید باید از یک عده صاحبانسهام مر کب شود که لاقل نصف سرمایه شر کت را دارا باشند- اگر در مجمع عمومی عدة که نصف سرمایه را دارا باشند حاضر نشدند تصمیمات مجمع موقتی خواهد بود در این صورت مجمع عمومی جدید ی دعوت میشود و اگر پس از آنکه لاقل یکماه قبل از انعقاد مجمع دو دفعه متوالی بفاصلههشت روز بوسیله یکی از جراید محلی تصمیمات موقتی مجمع سابق اعلان و منتشر شد و مجمع جدید آن را تصویب نمود تصمیمات مزبوره قطعیمیشود مشروط بر اینکه در مجمع جدید عدة حاضر شوند که لاقل ثلث سرمایه شر کت را دارا باشند. تبصره- جراید ی که اعلانات فوق را باید منتشر نمایند همه ساله توسط وزارت عدلیه معین و اعلان خواهد شد."}, {"number": 46, "text": "مجمع عمومی فوق اولین مدیرها و مفتشین شر کت را انتخاب میکند مفتشین برای سال اول و مدیران منتها برای مدت چهار سال معینمیشوند مدیرها را میتوان پس از انقضاء مدت چهار سال مجددا انتخاب نمود مگر آنکه اساسنامه شر کت غیر از این مقرر داشته باشد ولی در صورتیکه بر حسب مقررات اساسنامه تعیین آنها مو کول بتصویب مجمع عمومی نباشد مدت مدیر ی آنها بیش از دو سال نخواهد بود."}, {"number": 47, "text": "در صورتی که مدیرها و مفتشینی که از طرف مجمع عمومی انتخاب شدهاند قبول انجام وظیفه نمایند قبولی آنها در صورت مجلس قید وشر کت از همان تاریخ تشکیل میگردد. 3- مدی رها ی شر کت و وظا ی ف آنها"}, {"number": 48, "text": "شرکت سهامی بواسطه یک یا چند نفر نماینده موظف یا غیر موظف که از میان شر کاء بسمت مدیر ی و برای مدت محدودی معین شده و قابل عزل میباشند اداره خواهد شد."}, {"number": 49, "text": "در صورتی که چند نفر بسمت مدیر ی معین شده باشند باید یک نفر از میان خود بسمت ریاست انتخاب کنند- رئیس مزبور و هر یکاز مدیران میتوانند در صورتی که اساسنامه شر کت اجازه داده باشد با تصویب یکدیگر یکنفر شخص خارج را بجای خود معین کنند ولی مسئولیتاعمال شخص خارج بعهده خود آنها خواهد بود."}, {"number": 50, "text": "برای این که تعهد و تأدیه وجه سرمایه از طرف شر کاء ثابت شود باید مدیر شر کت وقوع آنرا بموجب نوشتة که بدایره ثبت اسناد مر کزاصلی شر کت میسپارد و بثبت میرسد اعلام نماید و باید اسامی شر کاء را با مقدار ی از سرمایة که پرداخته شده با یک نسخه از اساسنامه و یکی ازنسختین شر ک تنامه بنوشته مزبور منضم نماید."}, {"number": 51, "text": "مسئولیت مدیر شر کت در مقابل شر کاء همان مسئولیتی است که و کیل در مقابل مو کل دارد."}, {"number": 52, "text": "مدیرها باید یک عده سهامی را که بموجب اساسنامه مقرر است دارا باشند این سهام برای تضمین خساراتی است که ممکن است ازاعمال ادار ی مدیرها مشتر کا یا منفردا بر شر کت و ارد شود- سهام مذکوره با اسم بوده و قابل انتقال نیست و بوسیله مهر ی که بر رو ی آنها زده میشودغیر قابل انتقال بودن آنها معلوم و در صندوق شر کت ودیعه خواهد ماند."}, {"number": 53, "text": "مدیرهای شر کت نمیتوانند بدون اجازه مجمع عمومی در معاملاتیکه با شر کت یا بحساب شر کت میشود بطور مستقیم یاغیر مستقیم سهیم شوند و در صورت اجازه باید صورت مخصوص آنرا همهساله بمجمع عمومی بدهند."}, {"number": 54, "text": "مدیران هر شر کت سهامی باید شش ماه بشش ماه خلاصه صورت دار ائی و قروض شر کت را مرتب کرده بمفتشین بدهند."}, {"number": 55, "text": "مدیران هر شر کت سهامی باید مطابق ماده (9) این قانون صورت حسابیکه متضمن دارائی منقول و غیر منقول و همچنی ن صورت مطالبات و قر وض شر کت باشد مرتب کنند- این صورت حساب و همچنین بیلان حساب نفع و ضرر شر کت باید لاقل چهل روز قبل از انعقاد مجمععمومی به مفتشین داده شود که بمجمع مزبور بدهند."}, {"number": 56, "text": "از پانزده روز قبل از انعقاد مجمع عمومی هر صاحب سهم میتواند در مر کز شر کت بصورت حساب و صورت اسامی صاحبان سهاممراجعه کرده و از بیلان که متضمن خلاصه صورت حساب شر کت است و از راپورت مفتشین سواد بگیرد."}, {"number": 57, "text": "همهساله لاقل یک بیستم از عایدات خالص شر کت برای تشکیل سرمایه احتیاطی موضوع خواهد شد- همینکه سرمایه احتیاطی بعشر سرمایه شر کت رسید موضوع کردن این مقدار اختیار ی است."}, {"number": 58, "text": "اگر بواسطه ضررهای وارده نصف سرمایه شر کت از میان برود مدیران شر کت مکلفند تمام صاحبان سهام را بر ای انعقاد مجمع عمومیدعوت نمایند تا موضوع انحلال یا بقاء شر کت مورد شور و رأی شود- تصمیم این مجمع در هر حال منتشر خو اهد شد."}, {"number": 59, "text": "هر گاه مدیران شر کت برخلاف ماده فوق مجمع عمومی را دعوت نکردند و یا مجمعی که دعوت میشود نتواند مطابق مقررات قانونی منعقد گردد هر ذیحقی میتواند انحلال شر کت را از محاکم صالحه بخواهد."}, {"number": 60, "text": "هر گاه یک یا چند نفر از ارباب سهامی که مجموع سهام آنها لاقل معادل یک خمس سرمایه شر کت باشد کتبا تقاضای انعقاد مجمععمومی فوقالعاده نمایند و منظور خود را در آن تقاضانامه تصریح نموده باشند باید مجمع عمومی بطور فوقالعاده منعقد شود."}, {"number": 61, "text": "مدیرهای شر کت در مقابل شر کت یا اشخاص ثالث برای تخلف از مقررات این قانون و تقصیراتی که در اعمال ادار ی شر کت مرتکب شوند موافق قواعد عمومی مسئول میباشند مخصوصا در موقعیکه منافع موهومی را تقسیم نمایند یا از تقسیم منافع موهومی جلوگیر ی نکنند. 4- مفتشین شر کت و وظا ی ف آنها"}, {"number": 62, "text": "مجمع عمومی سالیانه یک یا چند مفتش (کمیسر) معین میکند- مفتشین مزبور که ممکن است از غیر شر کاء نیز انتخاب شوند مأموریت خواهند داشت که در موضوع اوضاع عمومی شر کت و همچنین در باب بیلان (خلاصه جمع و خرج) و صورت حسابهائیکه مدیرها تقدیم میکنند راپرتی بمجمع عمومی سال آینده بدهند- تصمیماتی که بدون این راپرت راجع بتصدیق بیلان و صورت حسابهای مدیران اخذ میشود معتبرنخواهد بود- در صورتیکه مجمع عمومی مفتشین مذکور را معین نکرده باشد یا یک یا چند نفر از مفتشینی که معین شدهاند نتوانند راپرت بدهند یا ازدادن راپرت امتناع نمایند رئیس محکمه بدایت مر کز اصلی شر کت بتقاضای هر ذیحقی و پس از احضار مدیران شر کت مفتشین را انتخاب و یا بجای آنهایی که نتوانستهاند یا امتناع کردهاند مفتشین جدید ی معین میکند."}, {"number": 63, "text": "در ظرف سه ماه قبل از تاریخی که بموجب اساسنامه شر کت برای انعقاد مجمع عمومی معین است مفتشین میتوانند بدفاتر شر کتمراجعه نموده و از عملیات آن تحقیقاتی بنمایند مفتشین میتوانند در مواقعیکه ضرورت فور ی دارد مجمع عمومی را دعوت نمایند."}, {"number": 64, "text": "حدود مسئولیت مفتشین و اثرات آن همان است که راجع بحدود مسئولت [سئولیت و کلاء و اثرات آن در مقابل مو کلین قانونا معین است. 5- مجمع عمومی شر کت"}, {"number": 65, "text": "مجمع عمومی شر کت باید لاقل سالی یک دفعه در موقعیکه بموجب اساسنامه معین است منعقد شود."}, {"number": 66, "text": "اساسنامه معین میکند برای حق ورود در مجمع چند سهم (بعنوان و کالت یا مالکیت) باید داشت."}, {"number": 67, "text": "عده آر ائی که هر یک از شر کاء به نسبت عده سهام خود دارند بموجب اساسنامه معین میگردد."}, {"number": 68, "text": "در جلسات مجمع عمومی هیچکدام از صاحبان سهام معمولی و صاحبان سهام ممتازه از حیث رأی تفاوتی ندارند مگر اینکه اساسنامه شر کت طور دیگر مقرر کرده باشد."}, {"number": 69, "text": "دارندگان سهامی که عده سهام هر یک از آن ها برای حضور یا رأی در مجمع عمومی کافی نیست میتوانند باندازة که مجموع عده سهام آنها برای داشتن حق حضور و رأی کافی باشد با یکدیگر متفق شده یک نفر را از میان خود برای حضور و رأی در مجمع مذکور معین نمایند."}, {"number": 70, "text": "در مجامع عمومی که برای رسیدگی بسهمالشر که و مزایا مطابق ماده (41) و در مجامعیکه برای تعیین اولین مدیرها و مفتشین وتصدیق اظهارات مؤسسین مطابق ماده (45) منعقد میشود کلیه صاحبان سهام قطع نظر از عده سهامی که دارند میتوانند حضور بهمرسانند."}, {"number": 71, "text": "مجمع عمومی شر کت جز در موارد مذکور در مواد (41 و 45 و 74) باید مر کب از یک عده صاحبان سهامی باشد که لاقل ثلث سرمایه شر کت را دارا باشند و اگر در دفعه اول این حد نصاب حاصل نشد مجمع عمومی جدید ی مطابق شرایط مقرر در اساسنامه شر کت تشکیل و تصمیمات این مجمع قطعی خواهد بود ولو اینکه حد نصاب فوق حاصل نشود."}, {"number": 72, "text": "تصمیمات مجمع عمومی باکثریت آراء خواهد بود."}, {"number": 73, "text": "در مواردیکه مجمع عمومی شر کاء نسبت بحقوق نوع مخصوصی از سهام تصمیمی نماید که تغییر ی در حقوق آنها بدهد آن تصمیم قطعی نخواهد بود مگر بعد از آنکه صاحبان سهام مزبوره در جلسه خاصی آن تصمیم را تصویب نمایند و برای اینکه آراء جلسه خاص مذکور معتبرباشد باید حاضرین جلسه لاقل صاحب بیش از نصف سرمایه مجموع سهامی باشد که موضوع مذاکره است."}, {"number": 74, "text": "در مجامع عمومی که برای امتداد مدت شر کت یا برای انحلال شر کت قبل از موعد مقر ر یا هر نوع تغییر دیگر ی در اساسنامه تشکیل میشود باید عدة از صاحبان سهام که بیش از سه ربع سرمایه شر کت را دارا باشند حاضر گردند. اگر در مجمع عمومی عدة که سه ربع سرمایه شر کت را دارا باشند حاضر نشدند ممکن است مجمع عمومی جدید ی دعوت کرد مشروط بر اینکه لاقل یکماه قبل از انعقاد مجمع دو دفعه متوالی بفاصله هشت روز بوسیله یکی از جراید محل (که سالیانه از طرف وزارت عدلیه معین میشود) دستورجلسه قبل و نتیجه آن اعلان گردد. مجمع عمومی جدید وقتی قانونی است که صاحبان لاقل نصف سرمایه شر کت حاضر باشند اگر این حد نصاب حاصل نشد ممکن است با رعایت تشریفات فوق مجمع عمومی دیگر ی دعوت نمود این مجمع با حضور صاحبان لاقل ثلث سرمایه شر کت حق تصمیم خواهد داشت در هر یک از سهمجمع فوق تصمیمات باکثریت دو ثلث آراء حاضر گرفته میشود. در این مجامع کلیه صاحبان سهام قطع نظر از عده سهام خود حق حضور و بنسبت هر یک سهم یک ر أی دارند ولو اینکه اساسنامه برخلاف این مقررداشته باشد. هیچ مجمع عمومی تابعیت شر کت را نمیتواند تغییر بدهد. بر تعهدات صاحبان سهام با هیچ اکثریتی نمیتوان افزود."}, {"number": 75, "text": "در مجمع عمومی ورقه حاضر و غائبی خواهد بود حاو ی اسم و محل اقامت و عده سهام هر یک از شر کاء ورقه مزبور پس از تصدیقهیئت رئیسه مجمع در مر کز شر کت حفظ و بهر کسی تقاضا نماید ارائه میشود. 6- در تبد ی ل سهام"}, {"number": 76, "text": "هر گاه شر کت بخواهد بموجب مقررات اساسنامه سهام بیاسم خود را بسهام بااسم تبدیل نماید باید اعلانی در این موضوع منتشر کرده و مهلتی که کمتر از ششماه نباشد بصاحبان سهام بدهد تا در ظرف مهلت مزبور سهام خود را بسهام جدید تبدیل نمایند."}, {"number": 77, "text": "اعلان مذکور در فوق باید در مجله رسمی عدلیه و در یکی از جراید کثیرالنتشار مر کز اصلی شر کت دو دفعه و بفاصله ده روز منتشرشود در صورتیکه مر کز اصلی شر کت در خارج از طهران باشد باید در یکی از روزنامههای یومیه طهران که همه ساله از طرف وزارت عدلیه برای انتشاراین قبیل اعلانات معین میشود نیز منتشر گردد. ابتداء مهلت از تاریخ اولین انتشار اعلان در مجله رسمی خواهد بود."}, {"number": 78, "text": "هر صاحب سهمی که سهام خود را تا انقضاء مهلت مذکور در ماده (76) بسهام جدید تبدیل نکند دیگر نمیتواند تقاضای تبدیل نماید وشر کت حق خواهد داشت سهام جدید ی را که در ازاء سهام تبدیل نشده موجود میباشد باشخاص دیگر بطریق مزایده بفروشد."}, {"number": 79, "text": "قیمت سهامی که بطریق مذکور در فوق فروخته میشود در مر کز اصلی شر کت یا در بانک ملی ایران ودیعه گذاشته خواهد شد و هر گاهدر ظرف ده سال از تاریخ فروش سهام صاحب سهم سهام سابق خود را نداده و وجهی را که بطریق فوق امانت گذاشته شده است مطالبه ننماید نسبتبحق او مرور زمان حاصل شده و وجه مزبور در حکم اموال بلاصاحب بوده و مدیر شر کت مکلف است آنرا بمقامات صلاحیتدار تسلیم نماید- هرمدیر شر کت که باین تکلیف عمل نکند بتأدیه سه برابر وجه مذکور محکوم خواهد شد."}, {"number": 80, "text": "در صورتیکه شر کت بخواهد سهام با اسم خود را بسهام بیاسم تبدیل نماید باید مراتب را بطریقی که فوقا مقرر است یکمرتبهاعلان نماید و اگر در ظرف مهلتی که معین میشود و نباید کمتر از دو ماه باشد صاحبان سهام سهام بااسم خود را بسهام بیاسم تبدیل نکنند سهام بااسمی که در دست آنها باقی میماند باطل و سهام جدید در مر کز اصلی شر کت به اسم آنها ودیعه خواهد بود."}, {"number": 81, "text": "در هر موقع که شر کت بخواهد تصدیقهای موقتی را که به اشخاص داده تبدیل بسهام کند در مورد تصدیقهای موقتی بیاسم مطابقمقررات مواد (76) و (77) و (78) و (79) و در مورد تصدیق موقتی با اسم مطابق ماده (80) رفتار خواهد شد. 7- بطلان شر کت و ی ا بطلا ن اعمال و ت صمیمات آن"}, {"number": 82, "text": "هر شر کت سهامی که مقررات یکی از مواد 28- 29- 36- 37- 38- 39- 41- 44- 45- 46- 47 - 50 اینقانون را رعایت نکرده باشد از درجه اعتبار ساقط و بلااثر خواهد بود لیکن شر کاء نمیتوانند در مقابل اشخاص خارج باین بطلان استناد نمایند."}, {"number": 83, "text": "در هر مورد که موافق مقررات ماده قبل محکمه بر بطلان شر کت یا اعمال و تصمیمات آن حکم کند مؤسسینی که مسئول این بطلانهستند و همچنین مفتشین و مدیرهائی که در حین حدوث سبب بطلان یا بلافاصله پس از آن سر کار بوده و انجام وظیفه نکردهاند متضامنا مسئولخساراتی خواهند بود که از این بطلان بصاحبان سهام و اشخاص ثالثی متوجه میشود همین مسئولیت ممکن است بشر کائی متوجه شود که سهم غیر نقد ی آنها تقویم و تصویب نشده یا مزایائی که مطالبه کر دهاند بتصدیق نرسیده باشد."}, {"number": 84, "text": "هر گاه قبل از اقامه دعو ی برای ابطال شر کت یا برای ابطال عملیات و قراردادهای شر کت موجبات بطلان مرتفع شود دعوای ابطال درمحکمه پذیرفته نخواهد شد."}, {"number": 85, "text": "اگر از تاریخ رفع موجبات بطلان یکسال منقضی شده و اشخاص خارج از جهت معاملاتیکه با ایشان شده است باستناد امور ی کهموجب بطلان بوده دعوای خسار ت نکرده باشند دیگر دعو ی مزبور از آنها پذیرفته نمیشود."}, {"number": 86, "text": "هر گاه مقرر شده باشد که مجمع عمومی مخصوصی برای رفع موجبات بطلان منعقد شود و دعوت اعضاء نیز برای انعقاد مجمع موافقاساسنامه بعمل آمده باشد دعوای بطلان از تاریخ دعوت مجمع در محکمه پذیرفته نخواهد شد مگر اینکه مجمع مزبور موجبات بطلان را رفع ننماید."}, {"number": 87, "text": "هر گاه از تاریخ حدوث سبب بطلان شر کت ده سال گذشته و اقامه دعو ی بطلان و خسارت نشده باشد دیگر دعو ی مذکور پذیرفته نخواهد شد."}, {"number": 88, "text": "استرداد منافعی که بین شر کاء تقسیم شده ممکن نیست مگر اینکه تقسیم بدون ترتیب صورت دارائی یا مخالف نتیجه حاصل از صورت مزبور بعمل آمده باشد در اینصورت نیز فقط تا پنجسال اقامه دعو ی استرداد میتوان نمود. مبداء مرور زمان روز تقسیم منافع است. 8- مقررات ج زائی"}, {"number": 89, "text": "هر کس سهام یا قطعات سهام شر کتی را که در مورد آن یکی از مواد 28- 29- 36- 37- 38- 39 - 44 و 50 این قانون رعایت نشده صادر نماید به پانصد الی ده هزار ریال جزای نقد ی علاوه بر خسارات وارده بشر کت یا افراد محکوم خواهد شد. در مواردیکه عمل مشمول ماده 238قانون مجازات عمومی است مر تکب بمجازات مقرر در آن ماده نیز محکوم میشود."}, {"number": 90, "text": "حکم فوق درباره اشخاصی نیز مقرر است که برخلاف واقع خود را صاحب سهام یا قطعات سهام قلمداد کرده و در مجمع عمومی واردشوند یا در دادن رأی شر کت نمایند و یا سهامی را برای اینکه بطور تقلب استعمال شود بدیگر ی بدهند. در مورد این ماده علاوه بر جزای نقد یمتخلف را میتوان بیک تا ششماه حبس تأدیبی نیز محکوم نمود."}, {"number": 91, "text": "هر کس سهام یا قطعات سهامی را که در مورد آن ها مقررات یکی از مواد 28- 29- 38 و 39 رعایت نشده با علم بعدم رعایت قانون معامله کر ده یا شر کت در معامله داشته و یا قیمت آنها را اعلان نموده باشد به پانصد الی ده هزار ریال جزای نقد ی محکوم خواهد شد. مقررات این ماده مانع نخواهد بود که اگر عمل مشمول ماده 238 قانون مجازات عمومی باشد مرتکب بمجازات حبس مذکور در آن ماده نیز محکوم شود."}, {"number": 92, "text": "اشخاص ذیل کلاه بردار محسوب میشوند: 1- هر کس برخلاف حقیقت مدعی وقوع تعهد ابتیاع سهام یا تأدیه قیمت سهام شده یا وقوع تعهد و یا تأدیة را که واقعیت ندارد اعلام یا جعلیاتی منتشر کند که به این وسایل دیگر ی را وادار بتعهد خرید سهام یا تأدیه قیمت سهام نماید اعم از اینکه عملیات مذکور مؤثر شده یا نشده باشد. 2- هر کس بطور تقلب برای جلب تعهد یا پرداخت قیمت سهام اسم اشخاصی را برخلاف واقع بعنوانی از عناوین جزء شر کت قلمداد نماید. 3- مدیرهائی که با نبودن صورت دارائی یا باستناد صورت دارائی مزوّر منافع موهومی را بین صاحبان سهام تقسیم نموده باشند. 9- در انحلال شر کت"}, {"number": 93, "text": "شرکت سهامی در موارد ذیل منحل میشود: 1- وقتیکه شر کت مقصودی را که برای آن تشکیل شده بود انجام داده یا انجام آن غیر ممکن شده باشد. 2- وقتیکه شر کت برای مدت معینی تشکیل و مدت منقضی شده باشد. 3- در صورتیکه شر کت ورشکست شود. 4- در صورت تصمیم مجمع عمومی. مبحث دوم- شر کت با مسئولیت محدود"}, {"number": 94, "text": "شرکت با مسئولیت محدود شر کتی است که بین دو یا چند نفر برای امور تجارتی تشکیل شده و هر یک از شر کاء بدون اینکه سرمایه بسهام یا قطعات سهام تقسیم شده باشد- فقط تا میزان سرمایه خود در شر کت مسئو ل قروض و تعهدات شر کت است."}, {"number": 95, "text": "در اسم شر کت باید عبارت (با مسئولیت محدود) قید شود و ال آن شر کت در مقابل اشخاص ثالث شر کت تضامنی محسوب و تابعمقررات آن خواهد بود. اسم شر کت نباید متضمن اسم هیچیک از شر کاء باشد و ال شریکی که اسم او در اسم شر کت قید شده در مقابل اشخاص ثالث حکم شریک ضامن درشر کت تضامنی را خواهد داشت."}, {"number": 96, "text": "شرکت با مسئولیت محدود وقتی تشکیل میشود که تمام سرمایه نقد ی تأدیه و سهمالشر که غیر نقد ی نیز تقویم و تسلیم شده باشد."}, {"number": 97, "text": "در شر کتنامه باید صراحتا قید شده باشد که سهمالشر کههای غیر نقد ی هر کدام بچه میزان تقویم شده است."}, {"number": 98, "text": "شرکاء نسبت به قیمتی که در حین تشکیل شر کت برای سهمالشر کههای غیر نقد ی معین شده در مقابل اشخاص ثالث مسئولیت تضامنیدارند."}, {"number": 99, "text": "مرور زمان دعاو ی ناشی از مقررات فوق ده سال از تاریخ تشکیل شر کت است."}, {"number": 100, "text": "هر شر کت با مسئولیت محدود که برخلاف مواد 96 و 97 تشکیل شده باشد باطل و از درجه اعتبار ساقط است لیک ن شر کاء در مقابل اشخاص ثالث حق استناد باین بطلان ندارند."}, {"number": 101, "text": "اگر حکم بطلان شر کت باستناد ماده قبل صادر شود شر کائی که بطلان مستند بعمل آنها است و هیئت نظار و مدیرهائی که در حین حدوث سبب بطلان یا بلافاصله پس از آن سر کار بوده و انجام وظیفه نکردهاند در مقابل شر کاء دیگر و اشخاص ثالث نسبت بخسارات ناشیه از این بطلان متضامنا مسئول خواهند بود. مدت مرور زمان ده سال از تاریخ حدوث موجب بطلان است."}, {"number": 102, "text": "سهمالشر که شر کاء نمیتواند بشکل اوراق تجارتی قابل انتقال اعم از بااسم یا بیاسم و غیره درآید. سهمالشر که را نمیتوان منتقل بغیر نمود مگر با رضایت عدة از شر کاء که لاقل سه ربع سرمایه متعلق به آنها بوده و اکثریت عددی نیز داشته باشند."}, {"number": 103, "text": "انتقال سهمالشر که بعمل نخواهد آمد مگر بموجب سند رسمی."}, {"number": 104, "text": "شرکت با مسئولیت محدود بوسیله یک یا چند نفر مدیر موظف یا غیر موظف که از بین شر کاء یا از خارج برای مدت محدود یانامحدودی معین میشوند اداره میگردد."}, {"number": 105, "text": "مدیران شر کت کلیه اختیارات لزمه را برای نمایندگی و اداره شر کت خواهند داشت مگر اینکه در اساسنامه غیر این ترتیب مقرر شده باشد هر قر ارداد راجع به محدود کردن اختیارات مدیران که در اساسنامه تصریح به آن نشده در مقابل اشخاص ثالث باطل و کان لم یکن است."}, {"number": 106, "text": "تصمیمات راجعه بشر کت باید باکثریت لاقل نصف سرمایه اتخاذ شود- اگر در دفعه اولی این اکثریت حاصل نشد باید تمام شر کاء مجددا دعوت شوند در اینصورت تصمیمات باکثریت عددی شر کاء اتخاذ میشود اگر چه اکثریت مزبور دارای نصف سرمایه نباشد. اساسنامه شر کت میتواند ترتیبی برخلاف مراتب فوق مقرر دارد."}, {"number": 107, "text": "هر یک از شر کاء به نسبت سهمی که در شر کت دارد دارای رأی خواهد بود مگر اینکه اساسنامه ترتیب دیگر ی مقرر داشته باشد."}, {"number": 108, "text": "روابط بین شر کاء تابع اساسنامه است- اگر در اساسنامه راجع به تقسیم نفع و ضرر مقررات خاصی نباشد تقسیم مزبور بنسبت سرمایه شر کاء بعمل خواهد آمد."}, {"number": 109, "text": "هر شر کت با مسئولیت محدود که عده شر کاء آن بیش از دوازده نفر باشد باید دارای هیئت نظار بوده و هیئت مزبور لاقل سالی یکمرتبه مجمع عمومی شر کاء را تشکیل دهد. هیئت نظار باید بلافاصله بعد از انتخاب شدن تحقیق کرده و اطمینان حاصل کند که دستور مو اد 96 و 97 رعایت شده است. هیئت نظار میتواند شر کاء را برای انعقاد مجمع عمومی فوقالعاده دعوت نماید مقررات مواد 165- 167- 168 و 170 در مورد شر کتهای با مسئولیت محدود نیز رعایت خواهد شد."}, {"number": 110, "text": "شرکاء نمیتوانند تابعیت شر کت را تغییر دهند مگر باتفاق آراء."}, {"number": 111, "text": "هر تغییر دیگر ی راجع باساسنامه باید باکثریت عددی شر کاء که لاقل سه ربع سرمایه ر ا نیز دارا باشند بعمل آید مگر اینکه در اساسنامه اکثریت دیگر ی مقرر شده باشد."}, {"number": 112, "text": "در هیچ مورد اکثریت شر کاء نمیتو اند شریکی را مجبور بازدیاد سهمالشر که خود کند."}, {"number": 113, "text": "مفاد ماده 78 این قانون راجع به تشکیل سرمایه احتیاطی در شر کت های با مسئولیت محدود نیز لزمالرعایه است."}, {"number": 114, "text": "شرکت با مسئولیت محدود در موارد ذیل منحل میشود: الف) در مورد فقرات 1- 2- 3 ماده 93. ب) در صورت تصمیم عدة از شر کاء که سهم الشر که آنها بیش از نصف سرمایه شر کت باشد. ج) در صورتیکه بواسطه ضررهای وارده نصف سرمایه شر کت از بین رفته و یکی از شر کاء تقاضای انحلال کرده و محکمه دل یل او را موجّه دیده و سایر شر کاء حاضر نباشند سهمی را که در صورت انحلال به او تعلق میگیرد پرداخته و او را از شر کت خارج کنند. د) در مورد فوت یکی از شر کاء اگر بموجب اساسنامه پیش بینی شده باشد."}, {"number": 115, "text": "اشخاص ذیل کلاه بردار محسوب میشوند: الف) مؤسسین و مدیرانی که برخلاف واقع پرداخت تمام سهم الشر که نقد ی و تقویم و تسلیم سهم الشر که غیرنقد ی را در اوراق و اسنادی که باید برای ثبت شر کت بدهند اظهار کرده باشند. ب ) کسانی که بوسیله متقلبانه سهم الشر که غیرنقد ی را بیش از قیمت واقعی آن تقویم کرده باشند. ج) مدیرانی که با نبودن صورت دارائی یا باستناد صورت دارائی مزوّر منافع موهومی ر ا بین شر کاء تقسیم کنند. مبحث سوم- شر کت تضامنی"}, {"number": 116, "text": "شرکت تضامنی شر کتی است که در تحت اسم مخصوصی برای امور تجارتی بین دو یا چند نفر با مسئولیت تضامنی تشکیل میشود : اگر دارائی شر کت برای تأدیه تمام قروض کافی نباشد هر یک از شر کاء مسئول پرداخت تمام قروض شر کت است. هر قرار ی که بین شر کاء برخلاف این ترتیب داده شده باشد در مقابل اشخاص ثالث کان لم یکن خواهد بود."}, {"number": 117, "text": "در اسم شر کت تضامنی باید عبارت (شر کت تضامنی) و لاقل اسم یک نفر شر کاء ذکر شود. در صورتی که اسم شر کت مشتمل بر اسامی تمام شر کاء نباشد باید بعد از اسم شریک یا شر کائی که ذکر شده است عبارتی از قبیل (و شر کاء) یا (و برادران) قید شود."}, {"number": 118, "text": "شرکت تضامنی وقتی تشکیل میشود که تمام سرمایه نقد ی تأدیه و سهم الشر که غیرنقد ی نیز تقویم و تسلیم شده باشد."}, {"number": 119, "text": "در شر کت تضامنی منافع به نسبت سهمالشر که بین شر کاء تقسیم میشود مگر آنکه شر کتنامه غیر از این تر تیب را مقرر داشته باشد."}, {"number": 120, "text": "در شر کت تضامنی شر کاء باید لاقل یک نفر از میان خود یا از خارج بسمت مدیر ی معین نمایند."}, {"number": 121, "text": "حدود مسئولیت مدیر یا مدیران شر کت تضامنی همان است که در ماده 51 مقرر شده."}, {"number": 122, "text": "در شر کتهای تضامنی اگر سهمالشر که یک یا چند نفر غیر نقد ی باشد باید سهمالشر که مزبور قبلا بتراضی تمام شر کاء تقویم شود."}, {"number": 123, "text": "در شر کت تضامنی هیچیک از شر کاء نمیتواند سهم خود را بدیگر ی منتقل کند مگر برضایت تمام شر کاء."}, {"number": 124, "text": "مادام که شر کت تضامنی منحل نشده مطالبه قروض آن باید از خود شر کت بعمل آید و پس از انحلال طلبکاران شر کت میتوانند برای وصول مطالبات خود بهر یک از شر کاء که بخواهند و یا بتمام آنها رجوع کنند و در هر حال هیچیک از شر کاء نمیتواند باستناد اینکه میزان قروض شر کت از میزان سهم او در شر کت تجاوز مینماید از تأدیه قروض شر کت امتناع ورزد فقط در روابط بین شرکاء مسئولیت هر یک از آنها در تأدیه قروض شر کت بنسبت سرمایة خواهد بود که در شر کت گذاشته است آنهم در صورتی که در شر کتنامه ترتیب دیگر ی اتخاذ نشده باشد."}, {"number": 125, "text": "هر کس بعنوان شریک ضامن در شر کت تضامنی موجودی داخل شود متضامنا با سایر شر کاء مسئو ل قروضی هم خواهد بود که شر کت قبل از ورود او داشته اعم از اینکه در اسم شر کت تغییر ی داده شده یا نشده باشد. هر قرار ی که بین شر کاء برخلاف این ترتیب داده شده باشد در مقابل اشخاص ثالث کان لم یکن خو اهد بود."}, {"number": 126, "text": "هر گاه شر کت تضامنی منحل شود مادام که قروض شر کت از دارائی آن تأدیه نشده هیچیک از طلبکاران شخصی شر کاء حقی در آن دارائی نخواهد داشت اگر دارائی شر کت برای پرداخت قروض آن کفایت نکند طلبکاران شر کت حق دارند بقیه طلب خود را از تمام یا فرد فرد شر کاء ضامن مطالبه کنند ولی در این مورد طلبکاران شر کت بر طلبکاران شخصی شر کاء حق تقدم نخواهند داشت."}, {"number": 127, "text": "بورشکستگی شر کت تضامنی بعد از انحلال نیز میتوان حکم داد مشروط باینکه دار ائی شر کت تقسیم نشده باشد."}, {"number": 128, "text": "ورشکستگی شر کت ملازمه قانونی با ور شکستگی شر کاء و ورشکستگی بعضی از شر کاء ملازمه قانونی با ورشکستگی شر کت ندارد."}, {"number": 129, "text": "طلبکاران شخصی شر کاء حق ندارند طلب خود را از دارائی شر کت تأمین یا وصو ل کنند ولی میتوانند نسبت بسهمیه مدیون خود ازمنافع شر کت یا سهمی که در صورت انحلال شر کت ممکن است بمدیون مزبور تعلق گیرد هر اقدام قانونی که مقتضی باشد بعمل آورند. طلبکار ان شخصی شر کاء در صورتیکه نتوانسته باشند طلب خود را از دارائی شخصی مدیون خود وصول کنند و سهم مدیون از منافع شر کت کافی بر ای تأدیه طلب آنها نباشد می توانند انحلال شر کت را تقاضا نمایند (اعم از اینکه شر کت برای مدت محدود یا غیر محدود تشکیل شده باشد) مشروط بر اینکه لاقل شش ماه قبل قصد خود را بوسیله اظهارنامه رسمی باطلاع شر کت رسانیده باشند در اینصورت شر کت یا بعضی از شر کاء می توانند مادام که حکم نهائی انحلال صادر نشده با تأدیه طلب دائنین مزبور تا حد دارائی مدیون در شر کت یا با جلب رضایت آنان بطریق دیگر از انحلال شر کت جلوگیر ی کنند."}, {"number": 130, "text": "نه مدیون شر کت میتواند در مقابل طلبی که ممکن است از یکی از شر کاء داشته باشد استناد به تهاتر کند نه خود شریک میتواند درمقابل قرضی که ممکن است طلبکار او بشر کت داشته باشد به تهاتر استناد نماید معذالک کسی که طلبکار شر کت و مدیون بیکی از شر کاء بوده وپس از انحلال شر کت طلب او لوصول مانده در مقابل آن شر کت حق استناد به تهاتر خواهد داشت."}, {"number": 131, "text": "در صورت ورشکستگی یکی از شر کاء و همچنین در صورتیکه یکی از طلبکار ان شخصی یکی از شر کاء بموجب ماده 129 انحلال شر کت را تقاضا کرد سایر شر کاء می توانند سهمی آن شریک را از دارائی شر کت نقدا تأدیه کرده و او را از شر کت خارج کنند."}, {"number": 132, "text": "اگر در نتیجه ضررهای وار ده سهمالشر که شر کاء کم شود مادام که این کمبود جبران نشده تأدیه هر نوع منفعت بشر کاء ممنوع است."}, {"number": 133, "text": "جز در مورد فوق هیچ یک از شر کاء ر ا شر کت نمیتواند بتکمیل سرمایة که بعلت ضررهای وارده کم شده است ملزم کرده و یا او رامجبور نماید بیش از آنچه که در شر کتنامه مقرر شده است بشر کت سرمایه دهد."}, {"number": 134, "text": "هیچ شریکی نمیتواند بدون رضایت سایر شر کاء (بحساب شخصی خود یا بحساب شخص ثالث) تجارتی از نوع تجارت شر کت نموده و یا بعنوان شریک ضامن یا شریک با مسئولیت محدود در شر کت دیگر ی که نظیر آن تجارت را دارد داخل شود."}, {"number": 135, "text": "هر شر کت تضامنی می تواند با تصویب تمام شر کاء بشر کت سهامی مبدل گردد در اینصورت رعایت تمام مقررات راجعه بشر کت سهامی حتمی است."}, {"number": 136, "text": "شرکت تضامنی در موارد ذیل منحل می شود: الف) در مورد فقرات 1- 2- 3 ماده 93. ب) در صورت تراضی تمام شر کاء: ج) در صورتی که یکی از شر کاء بدلئلی انحلال شر کت را از محکمه تقاضا نماید و محکمه آن دلئل را موجّه دانسته و حکم بانحلال بدهد. د) در صورت فسخ یکی از شر کاء مطابق ماده 137. هـ) در صورت ورشکستگی یکی از شر کاء مطابق ماده 138. و) در صورت فوت یا محجوریت یکی از شر کاء مطابق مواد 139 و 140. تبصره- در مورد بند (ج) هر گاه دلئل انحلال منحصرا مربوط بشریک یا شر کاء معینی باشد محکمه میتواند بتقاضای سایر شر کاء بجای انحلال حکم اخراج آن شریک یا شر کای معین را بدهد."}, {"number": 137, "text": "فسخ شر کت در صورتی ممکن است که در اساسنامه این حق از شر کاء سلب نشده و ناشی از قصد اضرار نباشد- تقاضای فسخ باید شش ماه قبل از فسخ کتبا بشر کاء اعلام شود. اگر موافق اساسنامه باید سال بسال بحساب شر کت رسیدگی شود فسخ در موقع ختم محاسبه سالیانه بعمل میآید."}, {"number": 138, "text": "در مورد ورشکستگی یکی از شر کاء انحلال وقتی صورت می گیرد که مدیر تصفیه کتبا تقاضای انحلال شر کت را نموده و از تقاضای مزبور ششماه گذشته و شر کت مدیر تصفیه را از تقاضای انحلال منصرف نکرده باشد."}, {"number": 139, "text": "در صورت فوت یکی از شر کاء بقاء شر کت موقوف برضایت سایر شر کاء و قائم مقام متوفی خواهد بود- اگر سایر شر کاء ببقاء شر کت تصمیم نموده باشند قائم مقام متوفی باید در مدت یکماه از تاریخ فوت رضایت یا عدم رضایت خود را راجع ببقاء شر کت کتبا اعلام نماید در صورتیکه قائم مقام متوفی رضایت خود را اعلام نمود نسبت باعمال شر کت در مدت مزبور از نفع و ضرر شریک خواهد بود ولی در صورت اعلام عدم رضایت در منافع حاصله در مدت مذکور شریک بوده و نسبت بضرر آن مدت سهیم نخواهد بود. سکوت تا انقضای یکماه در حکم اعلام رضایت است."}, {"number": 140, "text": "در مورد محجوریت یکی از شر کاء مطابق مدلول ماده فوق عمل خواهد شد. مبحث چهارم- در شر کت مختلط غیر سهامی"}, {"number": 141, "text": "شرکت مختلط غیرسهامی شر کتی است که برای امور تجارتی در تحت اسم مخصوصی بین یک یا چند نفر شریک ضامن و یک یا چند نفر شریک با مسئولیت محدود بدون انتشار سهام تشکیل می شود. شریک ضامن مسئول کلیه قر وضی است که ممکن است علاوه بر دارائی شر کت پیدا شود- شریک با مسئولیت محدود کسی است که مسئولیت اوفقط تا میزان سرمایة است که در شر کت گذارده و یا بایستی بگذارد. در اسم شر کت باید عبارت (شر کت مختلط) و لاقل اسم یکی از شر کاء ضامن قید شود."}, {"number": 142, "text": "روابط بین شر کاء با رعایت مقررات ذیل تابع شر کتنامه خواهد بود."}, {"number": 143, "text": "هر یک از شر کاء با مسئو لیت محدود که اسمش جزء اسم شر کت باشد در مقابل طلبکاران شر کت شریک ضامن محسوب خواهد شد. هر قرار ی که برخلاف این ترتیب بین شر کاء داده شده باشد در مقابل اشخاص ثالث بیاثر است."}, {"number": 144, "text": "اداره شر کت مختلط غیر سهامی بعهده شریک یا شر کای ضامن و حدود اختیارات آنها همان است که در مورد شر کاء شر کت تضامنی مقرر است."}, {"number": 145, "text": "شریک با مسئولیت محدود نه بعنوان شریک حق اداره کردن شر کت را دارد نه اداره امور شر کت از وظایف او است."}, {"number": 146, "text": "اگر شریک با مسئولیت محدود معاملة برای شر کت کند- در مورد تعهدات ناشیه از آن معامله در مقابل طرف معامله حکم شریک ضامن را خواهد داشت مگر اینکه تصریح کرده باشد معامله را بسمت و کالت از طرف شر کت انجام میدهد."}, {"number": 147, "text": "هر شریک با مسئولیت محدود حق نظارت در امور شر کت داشته و میتواند از رو ی دفاتر اسناد شر کت برای اطلاع شخص خود ر اجع بوضعیت مالی شر کت صورت خلاصه ترتیب دهد. هر قراردادی که بین شر کاء برخلاف این ترتیب داده شود از درجه اعتبار ساقط است."}, {"number": 148, "text": "هیچ شریک با مسئولیت محدود نمی تواند بدون رضایت سایر شر کاء شخص ثالثی را با انتقال تمام یا قسمتی از سهم الشر که خود باو داخل در شر کت کند."}, {"number": 149, "text": "اگر یک یا چند نفر از شر کاء با مسئولیت محدود حق خود را در شر کت بدون اجازه سایرین کلا یا بعضا بشخص ثالثی واگذار نمایند شخص مزبور نه حق دخالت در اداره شر کت و نه حق تفتیش در امور شر کت را خواهد داشت."}, {"number": 150, "text": "در مورد تعهداتی که شر کت مختلط غیرسهام ی ممکن است قبل از ثبت شر کت کرده باشد شریک با مسئولیت محدود در مقابل اشخاص ثالث در حکم شریک ضامن خواهد بود مگر ثابت نماید که اشخاص مزبور از محدود بودن مسئولیت او اطلاع داشتهاند."}, {"number": 151, "text": "شریک ضامن را وقتی میتوان شخصا برای قروض شر کت تعقیب نمود که شر کت منحل شده باشد."}, {"number": 152, "text": "هر گاه شر کت بطریقی غیر از ورشکستگی منحل شود و شریک با مسئولیت محدود هنوز تمام یا قسمتی از سهم الشر که خود را نپرداخته و یا پس از تأدیه مسترد داشته است طلبکاران شر کت حق دارند معادل آنچه که از بابت سهم الشر که باقی مانده است مستقیما بر علیه شریک با مسئولت [یت محدود اقامه دعو ی نمایند. اگر شر کت ورشکست شود حق مزبور را مدیر تصفیه خواهد داشت."}, {"number": 153, "text": "اگر در نتیجه قرارداد با شر کاء ضامن و یا در اثر برداشت قبلی از سرمایه شر کت شریک با مسئولیت محدود از سهم الشر که خود که به ثبت رسیده است بکاهد این تقلیل مادام که به ثبت نرسیده و بر طبق مقررات راجعه به نشر شر کتها منتشر نشده است در مقابل طلبکاران شر کت معتبرنبوده و طلبکاران مزبور میتوانند برای تعهداتی که از طرف شر کت قبل از ثبت و انتشار تقلیل سرمایه بعمل آمده است تأدیه همان سرمایه اولیه شریک با مسئولیت محدود را مطالبه نمایند."}, {"number": 154, "text": "بشریک با مسئولیت محدود فرع نمیتوان داد مگر در صورتی که موجب کسر سرمایه او در شر کت نشود. اگر در نتیجه ضررهای وارده سهم الشر که شریک با مسئولیت محدود کسر شد مادام که این کمبود جبران نشده تأدیه هر ربح یا منفعتی باو ممنوع است. هر گاه وجهی برخلاف حکم فوق تأدیه گردید شریک با مسئولیت محدود تا معادل وجه دریافتی مسئول تعهدات شر کت است مگر در موردیکه با حسن نیت و باعتبار بیلان مرتبی وجهی گرفته باشد."}, {"number": 155, "text": "هر کس بعنوان شریک با مسئولیت محدود در شر کت مختلط غیر سهامی موجودی داخل شود تا معادل سهمالشر که خود مسئول قروضی خواهد بود که شر کت قبل از ورود او داشته خواه اسم شر کت عوض شده یا نشده باشد. هر شرطی که برخلاف این ترتیب باشد در مقابل اشخاص ثالث کان لم یکن خواهد بود."}, {"number": 156, "text": "اگر شر کت مختلط غیرسهامی ورشکست شود دارائی شر کت بین طلبکاران خود شر کت تقسیم شده و طلبکاران شخصی شر کاء در آن حقی ندارند- سهم الشر که شر کاء با مسئولیت محدود نیز جزو دارائی شر کت محسوب است."}, {"number": 157, "text": "اگر دارائی شر کت برای تأدیه تمام قروض آن کافی نباشد طلبکاران آن حق دارند بقیه طلب خود را از دارائی شخصی تمام یا هر یک از شر کاء ضامن وصول کنند در این صورت بین طلبکاران شر کت و طلبکاران شخصی شر کاء ضامن تفاوتی نخو اهد بود."}, {"number": 158, "text": "در صورت ورشکستگی یکی از شر کاء با مسئولیت محدود خود شر کت یا طلبکاران آن با طلبکاران شخصی شریک مزبور متساو ی الحقوق خواهند بود."}, {"number": 159, "text": "مقررات مواد 129 و 130 در شر کتهای مختلط غیر سهامی نیز لزمالرعایه است."}, {"number": 160, "text": "اگر شریک ضامن بیش از یک نفر باشد مسئولیت آنها در مقابل طلبکاران و روابط آنها با یکدیگر تابع مقررات راجع بشر کتهای تضامنی است."}, {"number": 161, "text": "مقررات مواد 136- 137- 138- 139 و 140 در مورد شر کتهای مختلط غیر سهامی نیز جار ی است. مرگ یا محجوریت یا ورشکستگی شریک یا شر کاء با مسئولیت محدود موجب انحلال شر کت نمیشود. مبحث پنجم- شر کت مختلط سهامی"}, {"number": 162, "text": "شرکت مختلط سهامی شر کتی است که در تحت اسم مخصوصی بین یک عده شر کاء سهامی و یک یا چند نفر شریک ضامن تشکیل میشود. شر کاء سهامی کسانی هستند که سرمایه آنها بصورت سهام یا قطعات سهام متساو یالقیمه در آمده و مسئولیت آنها تا میزان همان سرمایة است که در شر کت دار ند. شریک ضامن کسی است که سرمایه او بصورت سهام در نیامده و مسئول کلیه قروضی است که ممکن است علاوه بر دارائی شر کت پیدا شود در صورت تعدّد شریک ضامن مسئولیت آنها در مقابل طلبکاران و روابط آنها با یکدیگر تابع مقررات شر کت تضامنی خواهد بود."}, {"number": 163, "text": "در اسم شر کت باید عبارت (شر کت مختلط) و لاقل اسم یکی از شر کاء ضامن قید شود."}, {"number": 164, "text": "مدیریت شر کت مختلف سهامی مخصوص به شریک یا شر کاء ضامن است."}, {"number": 165, "text": "در هر یک از شر کت های مختلط سهامی هیئت نظار ی لاقل مر کب از سه نفر از شر کاء برقرار میشود و این هیئت را مجمع عمومی شر کاء بلافاصله بعد از تشکیل قطعی شر کت و قبل از هر اقدامی در امور شر کت معین میکند انتخاب هیئت بر حسب شرایط مقرر در اساسنامه شر کت تجدید میشود در هر صورت اولین هیئت نظار برای یکسال انتخاب خواهد شد."}, {"number": 166, "text": "اولین هیئت نظار باید بعد از انتخاب شدن بلافاصله تحقیق کرده و اطمینان حاصل کند که تمام مقررات مواد 28 - 29- 38- 39- 41 و 50 این قانون رعایت شده است."}, {"number": 167, "text": "اعضاء هیئت نظار از جهت اعمال ادار ی و نتایج حاصله از آن هیچ مسئولیتی ندارند لیکن هر یک از آنها در انجام مأموریت خود بر طبق قوانین معموله مملکتی مسئول اعمال و تقصیرات خود میباشند."}, {"number": 168, "text": "اعضاء هیئت نظار دفاتر و صندوق و کلیه اسناد شر کت را تحت تدقیق در آورده همه ساله راپورتی بمجمع عمومی میدهند و هر گاه در تنظیم صورت دارائی بی ترتیبی و خطائی مشاهده نمایند در راپورت مزبور ذکر نموده و اگر مخالفتی با پیشنهاد مدیر شر کت در تقسیم منافع داشته باشند دلئل خود را بیان میکنند."}, {"number": 169, "text": "هیئت نظار میتواند شر کاء را برای انعقاد مجمع عمومی دعوت نماید و با موافقت رأی مجمع مزبور بر طبق فقر ه (ب ) ماده 181 شرکترا منحل کند."}, {"number": 170, "text": "تا پانزده روز قبل از انعقاد مجمع عمومی هر صاحب سهمی میتواند (خود یا نماینده او) در مر کز اصلی شر کت حاضر شده از صورت بیلان و صورت دارائی و راپورت هیئت نظار اطلاع حاضر کند."}, {"number": 171, "text": "ورشکستگی هیچیک از شر کاء ضامن موجب انحلال شر کت نخواهد شد مگر در مورد ماده 138."}, {"number": 172, "text": "حکم مواد 124 و 134 در مورد شر کت مختلط سهامی و شر کاء ضامن آن جار ی است."}, {"number": 173, "text": "هر گاه شر کت مختلط سهامی ورشکست شود شر کاء سهامی تمام قیمت سهام خود را نپرداخته باشند مدیر تصفیه آنچه را که بر عهده آنها باقی است وصول میکند."}, {"number": 174, "text": "اگر شر کت بطریقی غیر از ورشکستگی منحل شد هر یک از طلبکاران شر کت میتواند بهر یک از شر کاء سهامی که از بابت قیمت سهام خود مدیون شر کت است رجوع کرده در حدود بدهی آن شریک طلب خود را مطالبه نماید مادام که شر کت منحل نشده طلبکار ان برای وصول طلب خود حق رجوع بهیچیک از شر کاء سهامی ندارند."}, {"number": 175, "text": "اگر شر کت مختلط ور شکست شد تا قروض شر کت از دارائی آن تأدیه نشده طلبکاران شخصی شر کاء ضامن حقی به دارائی شر کت ندارند."}, {"number": 176, "text": "مفاد مواد 28- 29- 38- 39- 41 و 50 شامل شر کتهای مختلط سهامی است."}, {"number": 177, "text": "هر شر کت مختلط سهامی که برخلاف مواد 28- 29- 39 و 50 تشکیل شود باطل است لیکن شر کاء نمی توانند در مقابل اشخاص خارج باین بطلان استناد نمایند."}, {"number": 178, "text": "هر گاه شر کت بر حسب ماده قبل محکوم به بطلان شود مطابق ماده 101 رفتار خواهد شد."}, {"number": 179, "text": "مفاد مواد 84- 85- 86- 87 این قانون در مورد شر کت های مختلط نیز باید رعایت شود."}, {"number": 180, "text": "مفاد مواد 89- 90- 91 و 92 این قانون در مورد شر کت مختلط نیز لزمالرعایه است."}, {"number": 181, "text": "شرکت مختلط در موارد ذیل منحل میشود: الف) در مورد فقرات 1- 2- 3 ماده 93. ب) بر حسب تصمیم مجمع عمومی در صور تی که در اساسنامه این حق برای مجمع مذکور تصریح شده باشد. ج) بر حسب تصمیم مجمع عمومی و رضایت شر کاء ضامن. د) در صورت فوت یا محجوریت یکی از شر کاء ضامن مشروط بر اینکه انحلال شر کت در این موارد در اساسنامه تصریح شده باشد. در مورد فقرات (ب) و (ج) حکم ماده 72 جاری است."}, {"number": 182, "text": "هر گاه در اساسنامه برای مجمع عمومی حق تصمیم بانحلال معین نشده و بین مجمع عمومی و شر کاء ضامن راجع بانحلال موافقت حاصل نشود و محکمه دلئل طرفداران انحلال را موجّه ببیند حکم بانحلال خواهد داد. همین حکم در موردی نیز جار ی است که یکی از شر کاء ضامن بدلئلی انحلال شر کت را از محکمه تقاضا نموده و محکمه آن دلئل را موجّه ببیند. مبحث ششم- شر کت نسبی"}, {"number": 183, "text": "شرکت نسبی شر کتی است که برای امور تجارتی در تحت اسم مخصوصی بین دو یا چند نفر تشکیل و مسئولیت هر یک از شر کاء بنسبت سرمایهایست که در شر کت گذاشته."}, {"number": 184, "text": "در اسم شر کت نسبی عبارت (شر کت نسبی) و لاقل اسم یکنفر از شر کاء باید ذکر شود- در صورتی که اسم شر کت مشتمل بر اسامی تمام شر کاء نباشد بعد از اسم شریک یا شر کائی که ذکر شده عبارتی از قبیل (و شر کاء) (و برادران) ضرور ی است."}, {"number": 185, "text": "دستور ماده 118- 119- 120- 121- 122- 123 در مورد شر کت نسبی نیز لزمالرعایه است."}, {"number": 186, "text": "اگر دارائی شر کت نسبی بر ای تأدیه تمام قروض شر کت کافی نباشد هر یک از شر کاء بنسبت سرمایة که در شر کت داشته مسئول تأدیه قروض شر کت است."}, {"number": 187, "text": "مادام که شر کت نسبی منحل نشده مطالبه قروض آن باید از خود شر کت بعمل آید فقط پس از انحلال طلبکاران میتوانند با رعایتماده فوق بفرد فرد شر کاء مراجعه کنند."}, {"number": 188, "text": "هر کس بعنوان شریک ضامن در شر کت نسبی موجودی داخل شود بنسبت سرمایة که در شر کت میگذارد مسئول قروضی همخواهد بود که شر کت قبل از ورود او داشته اعم از اینکه در اسم شر کت تغییر ی داده شده یا نشده باشد. قر ار شر کاء برخلاف این ترتیب نسبت باشخاص ثالث اثر ندارد."}, {"number": 189, "text": "مفاد ماده 126 (جز مسئولیت شر کاء که بنسبت سرمایه آنها است) و مواد 127 تا 136 در شر کت های نسبی نیز جار ی است. مبحث هفتم- شر کتهای تعاونی تولید و مصرف"}, {"number": 190, "text": "شرکت تعاونی تولید شر کتی است که بین عدة از ارباب حرف تشکیل میشود و شر کاء مشاغل خود را بر ای تولید و فروش اشیاء یا اجناس بکار میبرند."}, {"number": 191, "text": "اگر در شر کت تولید یک عده از شر کاء در خدمت دائمی شر کت نبوده یا از اهل حرفة که موضوع عملیات شر کت است نباشند لاقل دو ثلث اعضاء اداره کننده شر کت باید از شر کائی انتخاب شوند که حرفه آن ها موضوع عملیات شر کت است."}, {"number": 192, "text": "شرکت تعاونی مصرف شر کتی است که برای مقاصد ذیل تشکیل میشود: 1- فروش اجناس لزمه بر ای مصارف زندگانی اعم از اینکه اجناس مزبوره را شر کاء ایجاد کرده یا خریده باشند. 2- تقسیم نفع و ضرر بین شر کاء بنسبت خرید هر یک از آنها."}, {"number": 193, "text": "شرکت تعاونی اعم از تولید یا مصرف ممکن است مطابق اصول شر کت سهامی یا بر طبق مقررات مخصوصی که با تراضی شر کاء ترتیب داده شده باشد تشکیل بشود ولی در هر حال مفاد مواد 32- 33 لزمالرعایه است."}, {"number": 194, "text": "در صورتیکه شر کت تعاونی تولید یا مصرف مطابق اصول شر کت سهامی تشکیل شود حداقل سهام یا قطعات سهام ده رال خواهد بود و هیچیک از شر کاء نمیتوانند در مجمع عمومی بیش از یک رأی داشته باشد. فصل دوم - در مقررات راجعه بثبت شر کتها و نشر شر کتنامهها"}, {"number": 195, "text": "ثبت کلیه شر کتهای مذکور در اینقانون الزامی و تابع جمیع مقررات قانون ثبت شر کتها است."}, {"number": 196, "text": "اسناد و نوشتجاتی که برای بثبت رسانیدن شر کت لزم است در نظامنامه وزارتعدلیه معین میشود."}, {"number": 197, "text": "در ظرف ماه اول تشکیل هر شر کت خلاصه شر کتنامه و منضمّات آن طبق نظامنامه وزارت عدلیه اعلان خواهد شد."}, {"number": 198, "text": "اگر بعلت عدم رعایت دستور دو ماده فوق بطلان عملیات شر کت اعلام شد هیچیک از شر کاء نمیتوانند این بطلان را در مقابل اشخاص ثالثی که با آنها معامله کردهاند عذر قرار دهند."}, {"number": 199, "text": "هر گاه شر کت در چندین حوزه شعبه داشته باشد مقررات مواد 195 و 197 باید بقسمیکه در نظامنامه وزارت عدلیه معین میشود در هر حوزه جداگانه انجام گردد."}, {"number": 200, "text": "در هر موقع که تصمیماتی برای تغییر اساسنامه شر کت یا تمدید مدت شر کت زائد بر مدت مقرر یا انحلال شر کت (حتی در مواردیکه انحلال بواسطه انقضای مدت شر کت صورت میگیرد) و تعیین کیفیت تفریغ حساب یا تبدیل شر کاء یا خروج بعضی از آنها از شر کت یا تغییر اسم شر کت اتخاذ شود مقررات مواد 195 و 197 لزمالرعایه است. همین ترتیب در موقع هر تصمیمی که نسبت بمورد معین در ماده 79 این قانون اتخاذ میشود رعایت خواهد شد."}, {"number": 201, "text": "در هر گونه اسناد و صورت حسابها و اعلانات و نشریات و غیره که بطور خطی یا چاپی از طرف شر کت های مذکور در این قانون باستثنای شر کتهای تعاونی صادر میشود سرمایه شر کت صریحا باید ذکر گردد و اگر تمام سرمایه پرداخته نشده قسمتی که پرداخته شده نیز باید صریحا معین شود- شر کت متخلف بجزای نقد ی از دویست تا سه هزار ریال محکوم خواهد شد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به000 /000 /10 تا 60.000.000ریال تعدیل یافته است تبصره- شر کتهای خارجی نیز که بوسیله شعبه یا نماینده در ایران اشتغال بتجارت دارند در مورد اسناد و صورت حسابها و اعلانات و نشریات خود در ایران مشمول مقررات این ماده خواهند بود. فصل سوم - در تصفی ه امور شر کتها"}, {"number": 202, "text": "تصفیه امور شر کتها پس از انحلال موافق مواد ذیل خواهد بود مگر در مورد ورشکستگی که تابع مقررات مربوط بورشکستگی است."}, {"number": 203, "text": "در شر کت های تضامنی و نسبی و مختلط سهامی و غیرسهامی امر تصفیه با مدیر یا مدیران شر کت است مگر آنکه شر کاء ضامن اشخاص دیگر ی را از خارج یا از بین خود برای تصفیه معین نمایند."}, {"number": 204, "text": "اگر از طرف یک یا چند شریک ضامن تعیین اشخاص مخصوص برای تصفیه تقاضا شد و سایر شر کاء ضامن آن تقاضا را نپذیرفتند محکمه بدایت اشخاصی را برای تصفیه معین خواهد کرد."}, {"number": 205, "text": "در هر مورد که اشخاصی غیر از مدیران شر کت برای تصفیه معین شوند اسامی آنها باید در اداره ثبت اسناد ثبت و اعلان گردد."}, {"number": 206, "text": "در شر کتهای مختلط (سهامی و غیر سهامی) شر کاء غیر ضامن حق دارند یک یا چند نفر برای نظارت در امر تصفیه معین نمایند."}, {"number": 207, "text": "وظیفه متصدیان تصفیه خاتمه دادن بکارهای جار ی و اجرای تعهدات و وصول مطالبات و تقسیم دارائی شر کت است بترتیب مقرردر مواد 208- 209- 210- 211 و 212 ."}, {"number": 208, "text": "اگر برای اجرای تعهدات شر کت معاملات جدید ی لزم شود متصدیان تصفیه انجام خواهند داد."}, {"number": 209, "text": "متصدیان تصفیه حق دارند شخصا یا بتوسط و کیل از طرف شر کت محاکمه کنند."}, {"number": 210, "text": "متصدی تصفیه وقتی حق اصلاح و تعیین حکم دارد که شر کاء ضامن باو اجازه داده باشند- مواردی که بحکم قانون حکمیت اجبار ی است از اینقاعده مستثنی است."}, {"number": 211, "text": "آن قسمت از دارائی شر کت که در مدت تصفیه محل احتیاج نیست بطور موقت بین شر کاء تقسیم میشود ولی متصدیان تصفیه باید معادل قروضی که هنوز موعد تأدیه آن نرسیده است و همچنین معادل مبلغی که در حساب بین شر کاء مورد اختلاف است موضوع نمایند."}, {"number": 212, "text": "متصدیان تصفیه حساب شر کاء را نسبت بهم و سهم هر یک از شر کاء را از نفع و ضرر معین میکنند- رفع اختلاف در تقسیم بمحکمه بدایت رجوع میشود."}, {"number": 213, "text": "در شر کتهای سهامی و شر کتهای با مسئولیت محدود و شر کتهای تعاونی امر تصفیه بعهده مدیران شر کت است مگر آنکه اساسنامه یا اکثریت مجمع عمومی شر کت ترتیب دیگر ی مقرر داشته باشد."}, {"number": 214, "text": "وظیفه و اختیارات متصدیان تصفیه در شر کت سهامی و شر کتهای با مسئولیت محدود و تعاونی بترتیبی است که در ماده 207 مقررشده با این تفاوت که حق اصلاح و تعیین حکم برای متصدیان تصفیه این شر کتها ( باستثنای مورد حکمیت اجبار ی) فقط وقتی خواهد بود که اساسنامه یا مجمع عمومی این حق را بآنها داده باشد."}, {"number": 215, "text": "تقسیم دارائی شر کتهای مذکور در ماده فوق بین شر کاء خواه در ضمن مدت تصفیه و خواه پس از ختم آن ممکن نیست مگر آن که قبلا سه مرتبه در مجله رسمی و یکی از جر اید اعلان و یکسال از تاریخ انتشار اولین اعلان در مجله گذشته باشد."}, {"number": 216, "text": "تخلف از ماده قبل متصدیان تصفیه را مسئول خسارت طلبکارانی قرار خواهد داد که بطلب خود نرسیدهاند."}, {"number": 217, "text": "دفاتر هر شر کتی که منحل شده با نظر مدیر ثبت اسناد در محل معینی از تاریخ ختم تصفیه تا ده سال محفوظ خواهد ماند."}, {"number": 218, "text": "هر شر کتی مجاز است در اساسنامه خود برای تصفیه ترتیب دیگر ی مقرر دارد ولی در هر حال آن مقررات نباید مخالف مواد 207-- 208 209- 210- 215- 216- 217 و قسمت اخیر ماده 211 باشد. فصل چهارم- مقررات مختلفه"}, {"number": 219, "text": "مدت مر ور زمان در دعاو ی اشخاص ثالث بر علیه شر کاء یا وراث آنها راجع بمعاملات شر کت (در مواردیکه قانون شر کاء یا ورّاث آنها را مسئول قرار داده) پنجسال است. مبداء مرور زمان روز ی است که انحلال شر کت یا کناره گیر ی شریک یا اخراج او از شر کت در اداره ثبت بثبت رسیده و در مجله رسمی اعلان شده باشد. در صورتی که طلب پس از ثبت و اعلان قابل مطالبه شده باشد مرور زمان از روز ی شروع می شود که طلبکار حق مطالبه پیدا کرده. تبصره- دعوائی که سنخا تابع مرور زمان کوتاه تر ی بوده یا بموجب اینقانون مرور زمان طولنی تر ی برای آن معین شده از مقررات این ماده مستثنی است."}, {"number": 220, "text": "هر شر کت ایرانی که فعلا وجود داشته یا در آتیه تشکیل شود و با اشتغال بامور تجارتی خود را بصورت یکی از شر کتهای مذکور دراین قانون در نیاورده و مطابق مقررات مربوطه به آن شر کت عمل ننماید شر کت تضامنی محسوب شده و احکام راجع بشر کتهای تضامنی در مورد آن اجرا میگردد. هر شر کت تجارتی ایرانی مذکور در این قانون و هر شر کت خارجی که بر طبق قانون ثبت شر کتها مصوب خرداد ماه 1310 مکلف بثبت است باید درکلیه اسناد و صورت حسابها و اعلانات و نشریات خطی یا چاپی خود در ایران تصریح نماید که در تحت چه نمره در ایران به ثبت رسیده و ال محکوم بجزای نقد ی از دویست تا دو هزار ریال خواهد شد- این مجازات علاوه بر مجازاتی است که در قانون ثبت شر کتها برای عدم ثبت مقرر شده. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به000 /000 /10 تا 60.000.000ریال تعدیل یافته است"}, {"number": 221, "text": "اگر شر کت سهام یا اوراق استقراضی داشته باشد که مطابق اساسنامه شر کت یا تصمیم مجمع عمومی قیمت آنها بطریق قرعه باید تأدیه شود و قبل از تأدیه قیمت آن سهام یا اوراق منافعی که به آنها تعلق گرفته پرداخته شده باشد شر کت در موقع تأدیه اصل قیمت نمی تواند منافع تأدیه شده را استرداد نماید."}, {"number": 222, "text": "هر شر کت تجارتی می تواند در اساسنامه خود قید کند که سرمایه اولیه خود را بوسیله تأدیه اقساط بعد ی از طرف شر کاء یا قبول شریک جدید زیاد کرده و یا بواسطه برداشت از سرمایه آن را تقلیل دهد. در اساسنامه حداقلی که تا آن میزان می توان سرمایه اولیه را تقلیل داد صراحتا معین می شود. کمتر از عشر سرمایه اولیه شر کت را حداقل قرار دادن ممنوع است. باب چهارم - برات- فتهطلب- چک فصل اول- برات مبحث اول- صورت برات"}, {"number": 223, "text": "برات علاوه بر امضاء یا مهر برات دهنده باید دارای شرایط ذیل باشد: 1) قید کلمه (برات ) در رو ی ورقه. 2) تاریخ تحریر (روز و ماه و سال) 3) اسم شخصی که باید برات را تأدیه کند. 4) تعیین مبلغ برات . 5) تاریخ تأدیه وجه برات . 6) مکان تأدیه وجه برات اعم از اینکه محل اقامت محال علیه باشد یا محل دیگر. 7) اسم شخصی که برات در وجه یا حواله کرد او پرداخته می شود. 8) تصریح باینکه نسخه اول یا دوم یا سوم یا چهارم الخ است."}, {"number": 224, "text": "برات ممکن است بحواله کرد شخص دیگر باشد یا بحواله کرد خود برات دهنده."}, {"number": 225, "text": "تاریخ تحریر و مبلغ برات با تمام حروف نوشته می شود. اگر مبلغ بیش از یکدفعه بتمام حروف نوشته شده و بین آنها اختلاف باشد مبلغ کمتر مناط اعتبار است اگر مبلغ با حروف و رقم هر دو نوشته شده و بین آنها اختلاف باشد مبلغ با حروف معتبر است."}, {"number": 226, "text": "در صورتیکه برات متضمن یکی از شرایط اساسی مقرر در فقرات 2- 3- 4- 5- 6- 7 و 8 ماده 223 نباشد مشمول مقررات راجعه به بروات تجارتی نخواهد بود."}, {"number": 227, "text": "برات ممکن است بدستور و حساب شخص دیگر ی صادر شود. مبحث دوم- در قبول و نکول"}, {"number": 228, "text": "قبولی برات در خود برات با قید تاریخ نوشته شده امضاء یا مهر می شود. در صورتیکه برات بوعده از رؤیت باشد تاریخ قبولی با تمام حروف نوشته خواهد شد- اگر قبولی بدون تاریخ نوشته شد تاریخ برات تاریخ رؤیت حساب می شود."}, {"number": 229, "text": "هر عبارتی که محالعلیه در برات نوشته امضاء یا مهر کند قبولی محسوب است مگر اینکه صریحا عبارت مشعر بر عدم قبول باشد. اگر عبارت فقط مشعر بر عدم قبول یک جزء از برات باشد بقیه وجه برات قبول شده محسوب است. در صورتیکه محالعلیه بدون تحریر هیچ عبارتی برات را امضاء یا مهر نماید برات قبول شده محسوب می شود."}, {"number": 230, "text": "قبولکننده برات ملزم است وجه آنرا سر وعده تأدیه نماید."}, {"number": 231, "text": "قبولکننده حق نکول ندارد."}, {"number": 232, "text": "ممکن است قبولی منحصر بیک قسمت از وجه برات باشد در این صورت دارنده برات باید برای بقیه اعتراض نماید."}, {"number": 233, "text": "اگر قبولی مشر وط بشرط نوشته شد برات نکول شده محسوب میشود ولی معهذا قبولکننده بشرط در حدود شرطی که نوشته مسئول پرداخت وجه برات است."}, {"number": 234, "text": "در قبولی براتی که وجه آن در خارج از محل اقامت قبولکننده باید تأدیه شود تصریح بمکان تأدیه ضرور ی است."}, {"number": 235, "text": "برات باید بمحض ارائه یا منتهی در ظرف 24 ساعت از تاریخ ارائه قبول یا نکول شود."}, {"number": 236, "text": "نکول برات باید بموجب تصدیقنامة که رسما تنظیم میشود محقق گردد- تصدیقنامه مزبور موسوم است باعتراض (پروتست) نکول."}, {"number": 237, "text": "پس از اعتراض نکول ظهرنویسها و برات دهنده بتقاضای دارنده برات باید ضامنی برای تأدیه وجه آن در سر وعده بدهند یا وجه برات را بانضمام مخارج اعتراضنامه و مخارج برات رجوعی (اگر باشد) فورا تأدیه نمایند."}, {"number": 238, "text": "اگر بر علیه کسی که براتی قبول کرده ولی وجه آن را نپرداخته اعتراض عدم تأدیه شود دارنده براتی نیز که همان شخص قبول کرده ولی هنوز موعد پرداخت آن نرسیده است می تواند از قبول کننده تقاضا نماید که برای پرداخت وجه آن ضامن دهد یا پرداخت آنرا بنحو دیگر ی تضمین کند. مبحث سوم- در قبولی شخص ثالث"}, {"number": 239, "text": "هر گاه براتی نکول شد و اعتراض بعمل آمد شخص ثالثی میتواند آنر ا بنام برات دهنده یا یکی از ظهرنویسها قبول کند – قبولی شخص ثالث باید در اعتراضنامه قید شده بامضاء او برسد."}, {"number": 240, "text": "بعد از قبولی شخص ثالث نیز تا برات تأدیه نشده کلیه حقوقی که برای دارنده برات از نکول آن در مقابل برات دهنده و ظهرنویسها حاصل میشود محفوظ خواهد بود. مبحث چهارم- در وعده برات"}, {"number": 241, "text": "برات ممکن است برؤیت باشد یا بوعده یک یا چند روز یا یک یا چند ماه از رؤیت برات یا بوعده یک یا چند روز یا یک یا چند ماه از تاریخ برات - ممکن است پرداخت بروز معینی مو کول شده باشد."}, {"number": 242, "text": "هر گاه برات بی وعده قبول شد باید فورا پرداخته شود."}, {"number": 243, "text": "موعد پرداخت براتی که یک یا چند روز یا یک یا چند ماه از رؤیت وعده دارد بوسیله تاریخ قبولی یا تاریخ اعتراضنامه نکول معین میشود."}, {"number": 244, "text": "اگر موعد پرداخت برات با تعطیل رسمی تصادف کرد باید روز بعد تعطیل تأدیه شود. تبصره- همین قاعده در مورد سایر اوراق تجارتی نیز رعایت خواهد شد. مبحث پنجم- ظهرنویسی"}, {"number": 245, "text": "انتقال برات بوسیله ظهرنویسی بعمل میآید."}, {"number": 246, "text": "ظهرنویسی باید به امضاء ظهرنویس برسد- ممکن است در ظهرنویسی تاریخ و اسم کسی که برات باو انتقال داده میشود قید گر دد."}, {"number": 247, "text": "ظهرنویسی حاکی از انتقال برات است مگر اینکه ظهرنویس و کالت در وصول را قید نموده باشد که در این صورت انتقال برات واقع نشده ولی دارنده برات حق وصول ولد یالقتضاء حق اعتراض و اقامه دعو ی برای وصول خواهد داشت. جز در مو اردیکه خلاف این در برات تصریح شده باشد."}, {"number": 248, "text": "هر گاه ظهرنویس در ظهرنویسی تاریخ مقدمی قید کند مزوّر شناخته میشود. مبحث ششم- مسئولیت"}, {"number": 249, "text": "براتدهنده- کسیکه برات را قبول کرده و ظهر نویسها در مقابل دارنده برات مسئولیت تضامنی دارند. دارنده بر ات در صورت عدم تأدیه و اعتراض می تواند بهر کدام از آنها که بخواهد منفردا یا بچند نفر یا بتمام آنها مجتمعا رجوع نماید. همین حق را هر یک از ظهرنویسها نسبت به برات دهنده و ظهرنویسهای ماقبل خود دارد. اقامه دعو ی بر علیه یک یا چند نفر از مسئولین موجب اسقاط حق رجوع بسایر مسئولین برات نیست – اقامه کننده دعو ی ملزم نیست ترتیب ظهرنویسی را از حیث تاریخ رعایت کند. ضامنی که ضمانت برات دهنده یا محال علیه یا ظهرنویسی را کرده فقط با کسی مسئولیت تضامنی دارد که از او ضمانت نموده است."}, {"number": 250, "text": "هر یک از مسئولین تأدیه برات میتواند پرداخت را به تسلیم برات و اعتراضنامه و صورت حساب متفرعات و مخارج قانونی که باید بپردازد مو کول کند."}, {"number": 251, "text": "هر گاه چند نفر از مسئولین برات ورشکست شوند دارنده برات می تواند در هر یک از غرما یا در تمام غرما برای وصول تمام طلب خود (وجه برات و متفرعات و مخارج قانونی) داخل شود تا اینکه طلب خود را کاملا وصول نماید- مدیر تصفیه هیچیک از ورشکستگان نمی تواند بر ای وجهی که بصاحب چنین طلب پرداخته میشود بمدیر تصفیه ورشکسته دیگر رجوع نماید مگر در صورتی که مجموع وجوهی که از دارائی تمام ورشکستگان بصاحب طلب تخصیص مییابد بیش از میزان طلب او باشد در این صورت مازاد باید بترتیب تاریخ تعهد تا میزان وجهی که هر کدام پرداختهاند- جزء دارائی ورشکستگان محسوب گردد که بسایر ورشکستهها حق رجوع دارند. تبصره- مفاد این ماده در مورد ورشکستگی هر چند نفر ی نیز که برای پرداخت یک دین مسئولیت تضامنی داشته باشند مرعی خواهد بود. مبحث هفتم- در پرداخت"}, {"number": 252, "text": "پرداخت برات با نوع پولی که در آن معین شده بعمل میآید."}, {"number": 253, "text": "اگر دارنده برات به برات دهنده یا کسی که برات را باو منتقل کرده است پولی غیر از آن نوع که در برات معین شده است بدهد و آن برات در نتیجه نکو ل یا امتناع از قبول و یا عدم تأدیه اعتراض شود دارنده برات میتواند از دهنده بر ات یا انتقال دهنده نوع پولی را که داده یا نوع پولی که در برات معین شده مطالبه کند ولی از سایر مسئولین وجه برات جز نوع پولی که در برات معین شده قابل مطالبه نیست."}, {"number": 254, "text": "برات بوعده باید روز آخر وعده پرداخته شود."}, {"number": 255, "text": "روز رؤیت در برواتی که بوعده از رؤیت است و روز صدور برات در برواتی که بوعده از تاریخ صدور است حساب نخواهد شد."}, {"number": 256, "text": "شخصی که وجه برات را قبل از موعد تأدیه نموده در مقابل اشخاصی که نسبت بوجه برات حقی دارند مسئول است."}, {"number": 257, "text": "اگر دارنده برات به کسی که قبولی نوشته مهلتی برای پرداخت بدهد به ظهرنویسهای ماقبل خود و برات دهنده که بمهلت مزبور رضایت ندادهاند حق رجوع نخواهد داشت."}, {"number": 258, "text": "شخصی که در سر وعده وجه برات را میپردازد بر یالذمه محسوب میشود مگر آنکه وجه برات قانونا در نزد او توقیف شده باشد."}, {"number": 259, "text": "پرداخت وجه برات ممکن است بموجب نسخه ثانی یا ثالث یا رابع الخ بعمل آید در صورتیکه در رو ی آن نسخه قید شده باشد که پس از پرداخت وجه بموجب این نسخه نسخ دیگر از اعتبار ساقط است."}, {"number": 260, "text": "شخصی که وجه برات را بر حسب نسخة بپردازد که در رو ی آن قبولی نوشته نشده در مقابل شخصی که نسخه قبولی شده را دارد مسئول پرداخت وجه آن است."}, {"number": 261, "text": "در صورت گم شدن براتی که هنوز قبول نشده است صاحب آن میتواند وصول وجه آن را بر حسب نسخه ثانی یا ثالث یا رابع الختقاضا کند."}, {"number": 262, "text": "اگر نسخه مفقود نسخة باشد که قبولی در رو ی آن نوشته شده تقاضای پرداخت از رو ی نسخههای دیگر فقط بموجب امر محکمه پساز دادن ضامن بعمل میآید."}, {"number": 263, "text": "اگر شخصی که برات را گم کرده- اعم از اینکه قبولی نوشته شده یا نشده باشد میتواند نسخه ثانی یا ثالث یا رابع الخ را تحصیل نماید پس از اثبات اینکه برات متعلق باو است میتواند با دادن ضامن تأدیه وجه آنرا بموجب امر محکمه مطالبه کند."}, {"number": 264, "text": "اگر با وجود تقاضائی که در مورد مواد 261- 262 و 263 بعمل آمده است از تأدیه وجه برات امتناع شود صاحب برات مفقود میتواند تمام حقوق خود را بموجب اعتراضنامه محفوظ بدارد."}, {"number": 265, "text": "اعتراضنامه مذکور در ماده فوق باید در ظرف 24 ساعت از تاریخ وعده برات تنظیم شده و در مواعد و بترتیبی که در این قانون برای ابلاغ اعتراضنامه معین شده است به برات دهنده و ظهرنویسها ابلاغ گردد."}, {"number": 266, "text": "صاحب برات مفقود برای تحصیل نسخه ثانی باید بظهرنویسی که بلافاصله قبل از او بوده است رجوع نماید- ظهرنویس مزبور ملزم است بصاحب برات اختیار مراجعه بظهرنویس ماقبل خود داده و راهنمائی کند و همچنین هر ظهرنویس باید اختیار رجوع بظهرنویس ماقبل خود بدهد تا به برات دهنده برسد- مخارج این اقدامات بر عهده صاحب برات مفقود خواهد بود. ظهرنویس در صورت امتناع از دادن اختیار مسئول تأدیه وجه برات و خساراتی است که بر صاحب برات مفقود وارد شده است."}, {"number": 267, "text": "در صورتی که ضامن برات مفقود (رجوع بمواد 262 و 263) مدتی برای ضمانت خود معین نکرده باشد مدت ضمان سه سال است وهر گاه در ظرف این سه سال رسما مطالبه یا اقامه دعو ی نشده باشد دیگر از این حیث دعو ی بر علیه او در محکمه مسموع نخواهد بود."}, {"number": 268, "text": "اگر مبلغی از وجه برات پرداخته شود بهمان اندازه بر ات دهنده و ظهرنویسها بر ی می شوند و دارنده برات فقط نسبت به بقیه می تواند اعتراض کند."}, {"number": 269, "text": "محاکم نمیتوانند بدون رضایت صاحب برات برای تأدیه وجه برات مهلتی بدهند. مبحث هشتم- تأدیه وجه برات بواسطه شخص ثالث"}, {"number": 270, "text": "هر شخص ثالثی میتواند از طرف بر ات دهنده یا یکی از ظهرنویسها وجه برات اعتراض شده را کارساز ی نماید- دخالت شخص ثالث و پرداخت وجه باید در اعتراضنامه یا در ذیل آن قید شود."}, {"number": 271, "text": "شخص ثالثی که وجه برات را پرداخته دارای تمام حقوق و وظایف دارنده برات است."}, {"number": 272, "text": "اگر وجه برات را شخص ثالث از طرف برات دهنده پرداخت تمام ظهرنویسها بر یالذمه می شوند و اگر پرداخت وجه از طرف یکی از ظهرنویسها بعمل آید ظهرنویسهای بعد از او بر ی الذمهاند."}, {"number": 273, "text": "اگر دو شخص متفقا هر یک از جانب یکی از مسئولین برات برای پرداخت وجه حاضر شوند پیشنهاد آن کس پذیرفته است که تأدیه وجه از طرف او عده زیادتر ی از مسئولین را بر یالذمه میکند- اگر خود محالعلیه پس از اعتراض برای تأدیه وجه حاضر شود بر هر شخص ثالثی ترجیح دارد. مبحث نهم- حقوق و وظایف دارنده برات"}, {"number": 274, "text": "نسبت به برواتی که وجه آن باید در ایران برؤیت یا بوعده از رؤیت تأدیه شود اعم از اینکه برات در ایران صادر شده باشد یا درخارجه دارنده برات مکلف است پرداخت یا قبولی آنرا در ظرف یکسال از تاریخ برات مطالبه نماید و ال حق رجوع بظهرنویسها و همچنین ببرات دهندة که وجه برات را بمحالعلیه رسانیده است نخواهد داشت."}, {"number": 275, "text": "اگر در برات اعم از اینکه در ایر ان صادر شده باشد یا در خارجه برای تقاضای قبولی مدت بیشتر یا کمتر ی مقرر شده باشد دارنده برات باید در همان مدت قبولی برات را تقاضا نماید و ال حق رجوع بظهرنویسها و برات دهندة که وجه برات را بمحالعلیه رسانیده است نخواهد داشت."}, {"number": 276, "text": "اگر ظهرنویسی برای تقاضای قبولی مدتی معین کرده باشد دارنده برات باید در مدت مزبور تقاضای قبولی نماید و ال در مقابل آن ظهرنویس نمیتواند از مقررات مربوطه ببروات استفاده کند."}, {"number": 277, "text": "هر گاه دارنده برات برؤیت یا بوعده که در یکی از شهرهای ایران صادر و باید در ممالک خارجه تأدیه شود در مواعد مقرر در مواد فوق قبولی نوشتن یا پرداخت وجه را مطالبه نکرده باشد مطابق مقررات همان مواد حق او ساقط خواهد شد."}, {"number": 278, "text": "مقررات فوق مانع نخواهد بود که بین دارنده برات و برات دهنده و ظهرنویسها قرارداد دیگر ی مقرر گردد."}, {"number": 279, "text": "دارنده برات باید روز وعده وجه برات را مطالبه کند."}, {"number": 280, "text": "امتناع از تأدیه وجه برات باید در ظرف ده روز از تاریخ وعده بوسیله نوشتة که اعتراض عدم تأدیه نامیده میشود معلوم گردد."}, {"number": 281, "text": "اگر روز دهم تعطیل باشد اعتراض روز بعد آن بعمل خواهد آمد."}, {"number": 282, "text": "نه فوت محالعلیه نه ورشکستگی او نه اعتراض نکولی دارنده برات را از اعتراض عدم تأدیه مستغنی نخو اهد کرد."}, {"number": 283, "text": "در صورتیکه قبول کننده برات قبل از وعده ورشکست شود حق اعتراض برای دارنده بر ات باقی است."}, {"number": 284, "text": "دارنده براتیکه بعلت عدم تأدیه اعتراض شده است باید در ظرف ده روز از تاریخ اعتراض عدم تأدیه را بوسیله اظهارنامه رسمی یا مراسله سفارشی دو قبضه بکسی که برات را باو واگذار نموده اطلاع دهد."}, {"number": 285, "text": "هر یک از ظهرنویسها نیز باید در ظرف ده روز از تاریخ دریافت اطلاع نامه فوق آنرا بهمان وسیله بظهرنویس سابق خود اطلاع دهد."}, {"number": 286, "text": "اگر دارنده براتیکه بایستی در ایران تأدیه شود و بعلت عدم پرداخت اعتراض شده بخواهد از حقی که ماده 249 برای او مقرر داشته استفاده کند باید در ظرف یکسال از تاریخ اعتراض اقامه دعو ی نماید. تبصره- هر گاه محل اقامت مدعیعلیه خارج از محلی باشد که وجه برات باید در آنجا پرداخته شود برای هر شش فرسخ یکروز اضافه خواهدشد."}, {"number": 287, "text": "در مورد برواتیکه باید در خارجه تأدیه شود اقامه دعو ی بر علیه برات دهنده و یا ظهرنویس های مقیم ایران در ظرف دو سال از تاریخ اعتراض باید بعمل آید."}, {"number": 288, "text": "هر یک از ظهرنویسها بخواهد از حقی که در ماده 249 باو داده شده استفاده نماید باید در مواعد ی که بموجب مو اد 286 و 287 مقرراست اقامه دعو ی کند و نسبت باو موعد از فردای ابلاغ احضاریه محکمه محسوب است و اگر وجه برات را بدون اینکه بر علیه او اقامه دعو ی شده باشد تأدیه نماید از فردای روز تأدیه محسوب خواهد شد."}, {"number": 289, "text": "پس از انقضاء مواعد مقرره در مواد فوق دعو ی دارنده برات بر ظهرنویسها و همچنین دعو ی هر یک از ظهرنویسها بر ید سابق خود در محکمه پذیرفته نخواهد شد."}, {"number": 290, "text": "پس از انقضاء مواعد فوق دعو ی دارنده و ظهرنویسهای برات بر علیه برات دهنده نیز پذیرفته نمیشود مشروط بر اینکه برات دهنده ثابت نماید در سر وعده وجه برات را بمحالعلیه رسانیده و در اینصورت دارنده برات فقط حق مراجعه بمحالعلیه خواهد داشت."}, {"number": 291, "text": "اگر پس از انقضاء موعد ی که برای اعتراض و ابلاغ اعتراضنامه یا برای اقامه دعو ی مقرر است برات دهنده یا هر یک از ظهرنویسها بطریق محاسبه یا عنوان دیگر وجهی را که برای تأدیه برات بمحالعلیه رسانیده بود مسترد دارد دارنده برات برخلاف مقررات دو ماده قبل حق خواهدداشت که بر علیه دریافت کننده وجه اقامه دعو ی نماید."}, {"number": 292, "text": "پس از اقامه دعو ی محکمه مکلف است بمجرد تقاضای دارنده براتیکه بعلت عدم تأدیه اعتراض شده است معادل وجه برات را ازاموال مدعیعلیه بعنوان تأمین توقیف نماید. مبحث دهم- در اعتراض (پروتست)"}, {"number": 293, "text": "اعتراض در موارد ذیل بعمل میآید: 1) در مورد نکول. 2) در مورد امتناع از قبول یا نکول. 3) در مورد عدم تأدیه. اعتراضنامه باید در یک نسخه تنظیم و بموجب امر محکمه بدایت بتوسط مأمور اجراء بمحل اقامت اشخاص ذیل ابلاغ شود: 1) محالعلیه. 2) اشخاصیکه در برات برای تأدیه وجه عندالقتضاء معین شدهاند. 3) شخص ثالثی که برات را قبول کرده است. اگر در محلی که اعتراض بعمل میآید محکمه بدایت نباشد وظایف او با رعایت ترتیب بعهده امین صلح یا رئیس ثبت اسناد یا حاکم محل خواهدبود."}, {"number": 294, "text": "اعتراضنامه باید مراتب ذیل را دارا باشد: 1) سواد کامل برات با کلیه محتویات آن اعم از قبولی و ظهرنویسی و غیره. 2) امر بتأدیه وجه برات. مأمور اجرا باید حضور یا غیاب شخصیکه باید وجه برات را بدهد و علل امتناع از تأدیه یا از قبول و همچنین علل عدم امکان امضاء یا امتناع از امضاءرا در ذیل اعتراضنامه قید و امضاء کند."}, {"number": 295, "text": "هیچ نوشتة نمیتواند از طر ف دارنده برات جایگیر اعتراضنامه شود مگر در موارد مندرجه در مواد 261- 262 و 263 راجع بمفقودشدن برات."}, {"number": 296, "text": "مأمور اجرا باید سواد صحیح اعتراضنامه را بمحل اقامت اشخاص مذکور در ماده 293 بدهد."}, {"number": 297, "text": "دفتر محکمه یا دفتر مقاماتیکه وظیفه محکمه را انجام میدهند باید مفاد اعتراضنامه را روز بروز بترتیب تاریخ و نمره در دفترمخصوصی که صفحات آن بتوسط رئیس محکمه یا قائم مقام او نمره و امضاء شده است ثبت نمایند- در صورتیکه محل اقامت برات دهنده یاظهرنویس اولی در رو ی برات قید شده باشد دفتر محکمه باید آنها را توسط کاغذ سفارشی از علل امتناع از تأدیه مستحضر سازد. مبحث یازدهم- برات رجوعی"}, {"number": 298, "text": "برات رجوعی براتی است که دارنده بر ات اصلی پس از اعتراض برای دریافت وجه آن و مخارج صدور اعتراضنامه و تفاوت نرخ بعهده برات دهنده یا یکی از ظهرنویسها صادر میکند."}, {"number": 299, "text": "اگر برات رجوعی بعهده برات دهنده اصلی صادر شود تفاوت بین نرخ مکان تأدیه برات اصلی و نرخ مکان صدور آن بعهده اوخواهد بود و اگر برات رجوعی بعهده یکی از ظهرنویسها صادر شود مشارالیه باید از عهده تفاوت نرخ مکانی که برات اصلی را در آنجا معامله یاتسلیم کرده است و نرخ مکانی که برای رجوعی در آنجا صادر شده است بر آید."}, {"number": 300, "text": "به برات رجوعی باید صورت حسابی (حساب بازگشت ) ضمیمه شود- در صورت حساب مزبور مراتب ذیل قید میگردد: 1) اسم شخصی که برات رجوعی بعهده او صادر شده است. 2) مبلغ اصلی برات اعتراض شده. 3) مخارج اعتراضنامه و سایر مخارج معموله از قبیل حقالعمل صراف و دلل و وجه تمبر و مخارج پست و غیره. 4) مبلغ تفاوت نرخهای مذکور در ماده (299) ."}, {"number": 301, "text": "صورت حساب مذکور در ماده قبل باید توسط دو نفر تاجر تصدیق شود بعلاوه لزم است برات اعتراض شده و سواد مصدقی ازاعتراضنامه بصورت حساب مزبور ضمیمه گردد."}, {"number": 302, "text": "هر گاه برات رجوعی بعهده یکی از ظهرنویسها صادر شود علاوه بر مراتب مذکور در مواد 300 و 301 باید تصدیقنامة که تفاوت بین نرخ مکان تأدیه برات اصلی و مکان صدور آنرا معین نماید ضمیمه شود."}, {"number": 303, "text": "نسبت بیک برات صورت حساب بازگشت متعدد نمیتوان ترتیب داد و اگر برات ر جوعی بعهده یکی از ظهرنویسها صادر شده باشد حساب بازگشت متوالیا بتوسط ظهر نویسها پرداخته میشود تا به برات دهنده اولی برسد. تحمیلات براتهای رجوعی را نمیتوان تماما بر یکنفر وارد ساخت- هر یک از ظهرنویسها و برات دهنده اولی فقط عهده دار یک خرج است."}, {"number": 304, "text": "خسارت تأخیر تأدیه مبلغ اصلی برات که بواسطه عدم تأدیه اعتراض شده است از ر وز اعتراض و خسارت تأخیر تأدیه مخارجاعتراض و مخارج برات رجوعی فقط از روز اقامه دعو ی محسوب میشود. مبحث دوازدهم- قوانین خارجی"}, {"number": 305, "text": "در مورد برواتی که در خارج ایران صادر شده شرایط اساسی برات تابع قوانین مملکت صدور است. هر قسمت از سایر تعهدات براتی (تعهدات ناشی از ظهرنویسی- ضمانت- قبولی و غیره) نیز که در خارجه بوجود آمده تابع قوانین مملکتی است که تعهد در آنجا وجود پیدا کرده است. معذالک اگر شرایط اساسی برات مطابق قانون ایران موجود و یا تعهدات براتی موافق قانون ایران صحیح باشد کسانی که در ایران تعهداتی کر دهاند حقاستناد باین ندارند که شرایط اساسی برات یا تعهدات براتی مقدم بر تعهد آنها مطابق با قوانین خارجی نیست."}, {"number": 306, "text": "اعتراض و بطور کلی هر اقدامی که برای حفظ حقوق ناشیه از برات و استفاده از آن در خارجه باید بعمل آید تابع قوانین مملکتی خواهد بود که آن اقدام باید در آنجا بشود. فصل دوم - در فته طلب"}, {"number": 307, "text": "فته طلب سند ی است که بموجب آن امضاء کننده تعهد میکند مبلغی در موعد معین یا عندالمطالبه در وجه حامل یا شخص معین و یا بحوالهکرد آن شخص کارساز ی نماید."}, {"number": 308, "text": "فته طلب علاوه بر امضاء یا مهر باید دارای تاریخ و متضمن مراتب ذیل باشد: 1) مبلغی که باید تأدیه شود با تمام حروف. 2) گیرنده وجه. 3) تاریخ پرداخت."}, {"number": 309, "text": "تمام مقر رات راجع به بروات تجارتی (از مبحث چهارم الی آخر فصل اول این باب ) در مورد فتهطلب نیز لزمالرعایه است. فصل سوم - چک"}, {"number": 310, "text": "چک نوشته ایست که بموجب آن صادر کننده وجوهی را که در نزد محالعلیه دارد کلا یا بعضا مسترد یا بدیگر ی واگذار مینماید."}, {"number": 311, "text": "در چک باید محل و تاریخ صدور قید شده و بامضای صادر کننده بر سد- پرداخت وجه نباید وعده داشته باشد."}, {"number": 312, "text": "چک ممکن است در وجه حامل یا شخص معین یا بحواله کرد باشد- ممکن است بصرف امضاء در ظهر بدیگر ی منتقل شود."}, {"number": 313, "text": "وجه چک باید بمحض ارائه کارساز ی شود."}, {"number": 314, "text": "صدور چک ولو اینکه از محلی بمحل دیگر باشد ذاتا عمل تجارتی محسوب نیست لیکن مقررات این قانون از ضمانت صادر کننده و ظهرنویس ها و اعتراض و اقامه دعو ی ضمان و مفقود شدن راجع به بروات شامل چک نیز خواهد بود."}, {"number": 315, "text": "اگر چک در همان مکانی که صادر شده است باید تأدیه گردد دارنده چک باید در ظرف پانزده روز از تاریخ صدور وجه آنرا مطالبه کند واگر از یک نقطه به نقطه دیگر ایران صادر شده باشد باید در ظرف چهل و پنج روز از تاریخ صدور چک مطالبه شود. اگر دارنده چک در ظرف مواعد مذکوره در این ماده پرداخت وجه آن را مطالبه نکند دیگر دعو ی او بر علیه ظهرنویس مسموع نخواهد بود و اگر وجه چک بسببی که مربوط بمحالعلیه است از بین برود دعو ی دارنده چک بر علیه صادر کننده نیز در محکمه مسموع نیست."}, {"number": 316, "text": "کسی که وجه چک را دریافت میکند باید ظهر آنرا امضاء یا مهر نماید اگرچه چک در وجه حامل باشد."}, {"number": 317, "text": "مقررات راجعه به چک هائی که در ایران صادر شده است در مورد چکهائی که از خارجه صادر شده و باید در ایران پرداخته شود نیز رعایت خواهد شد- لیکن مهلتی که در ظرف آن دارنده چک می تواند وجه چک را مطالب
