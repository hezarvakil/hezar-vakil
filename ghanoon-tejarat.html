ه کند چهار ماه از تاریخ صدور است. فصل چهارم- در مرور زمان"}, {"number": 318, "text": "دعاوی راجعه به برات و فته طلب و چک که از طرف تجار یا برای امور تجارتی صادر شده پس از انقضای پنجسال از تاریخ صدور اعتراضنامه و یا آخرین تعقیب قضائی در محاکم مسموع نخواهد بود مگر اینکه در ظرف این مدت رسما اقرار به دین واقع شده باشد که در این صورت مبداء مرور زمان از تاریخ اقرار محسوب است. در صورت عدم اعتراض مدت مرور زمان از تاریخ انقضاء مهلت اعتراض شر وع میشود. تبصره- مفاد این ماده در مورد بروات و چک و فته طلبهائی که قبل از تاریخ اجرای قانون تجارت مصوب 25 دلو 1303 و 12 فروردین و 12 خرداد 1304 صادر شده است قابل اجرا نبوده و این اسناد از حیث مرور زمان تابع مقررات مربوط بمرور زمان راجع باموال منقوله است."}, {"number": 319, "text": "اگر وجه برات یا فتهطلب یا چک را نتوان بواسطه حصول مرور زمان پنجسال مطالبه کرد دار نده برات یا فتهطلب یا چک میتواند تاحصول مرور زمان اموال منقوله وجه آنرا از کسی که بضرر او استفاده بلاجهت کرده است مطالبه نماید. تبصره- حکم فوق در موردی نیز جار ی است که برات یا فته طلب یا چک یکی از شرایط اساسی مقرر در این قانون را فاقد باشد. باب پنجم- اسناد در وجه حامل"}, {"number": 320, "text": "دارنده هر سند در وجه حامل مالک و برای مطالبه وجه آن محق محسوب میشود مگر در صورت ثبوت خلاف. معذلک اگر مقامات صلاحیتدار قضائی یا پلیس تأدیه وجه آن سند را منع کند تأدیه وجه بحامل مدیون را نسبت بشخص ثالثی که ممکن است سند متعلق باو باشد بر ی نخواهد کرد."}, {"number": 321, "text": "جز در موردیکه حکم بطلان سند صادر شده مدیون سند در وجه حامل مکلف به تأدیه نیست مگر در مقابل اخذ سند."}, {"number": 322, "text": "در صورت گم شدن سند در وجه حامل که دارای ورقههای کوپن یا دارای ضمیمة برای تجدید اوراق کوپن باشد و همچنین در صورت گم شدن سند در وجه حامل که خود سند بدارنده آن حق میدهد ربح یا منفعتی را مرتبا دریافت کند برای اصدار حکم بطلان مطابق ذیل عمل خواهد شد."}, {"number": 323, "text": "مدعی باید در محکمه محل اقامت مدیون معلوم نماید سند در تصرف او بوده و فعلا گم شده است. اگر مدعی فقط اوراق کوپن یا ضمیمه مربوط بسند خود را گم کرده باشد ابراز خود سند کافی است."}, {"number": 324, "text": "اگر محکمه ادعای مدعی را بنا بر اوضاع و احوال قابل اعتماد دانست باید بوسیله اعلان در جراید بدارنده مجهول سند اخطار کند- هرگاه از تاریخ انتشار اولین اعلان تا سه سال سند را ابراز ننمود حکم بطلان آن صادر خواهد شد- محکمه میتواند لد یالقتضاء مدتی بیش از سه سال تعیین کند."}, {"number": 325, "text": "بتقاضای مدعی محکمه میتواند بمدیون قدغن کند که وجه سند را بکسی نپردازد مگر پس از گرفتن ضامن یا تأمینی که محکمه تصویب نماید."}, {"number": 326, "text": "در مورد گم شدن اوراق کوپن نسبت بکوپنهائی که در ضمن جریان دعو ی لزم التأدیه میشود بترتیب مقرر در مواد 332 و 333 عمل خواهد شد."}, {"number": 327, "text": "اخطار مذکور در ماده 324 باید سه دفعه در مجله رسمی منتشر شود محکمه میتواند بعلاوه اعلان در جراید دیگر را نیز مقرر دارد."}, {"number": 328, "text": "اگر پس از اعلان فوق سند مفقود ابراز شود محکمه بمدعی مهلت متناسبی داده و اخطار خواهد کرد که هر گاه تا انقضای مهلت دعو ی خود را تعقیب و دلئل خود را اظهار نکند محکوم شده و سند به ابراز کننده آن مسترد خواهد گردید."}, {"number": 329, "text": "اگر در ظرف مدتیکه مطابق ماده 324 مقرر و اعلان شده سند ابراز نگردد محکمه حکم بطلان آن را صادر خواهد نمود."}, {"number": 330, "text": "ابطال سند فورا بوسیله درج در مجله رسمی و هر وسیله دیگر ی که محکمه مقتضی بداند به اطلاع عموم خواهد رسید."}, {"number": 331, "text": "پس از صدور حکم ابطال مدعی حق دارد تقاضا کند بخرج او سند جدید یا لد یالقتضاء اوراق کوپن تازه باو بدهند. اگر سند حال شده باشد مدعی حق تقاضای تأدیه خواهد داشت."}, {"number": 332, "text": "هر گاه سند گم شده از اسناد مذکور در ماده (322) نباشد بترتیب ذیل رفتار خواهد شد: محکمه در صورتیکه ادعای مدعی سبق تصرف و گم کردن سند را قابل اعتماد دید حکم میدهد مدیون وجه سند را فورا در صورتیکه حال باشد وپس از انقضاء اجل- در صورت مؤجل بودن- بصندوق عدلیه بسپارد."}, {"number": 333, "text": "اگر قبل از انقضای مدت مرور زمانی که وجه سند مفقود پس از آن مدت قابل مطالبه نیست سند ابراز شد مطابق ماده 328 رفتار و ال وجهی که در صندوق عدلیه امانت گذاشته شده بمدعی داده میشود."}, {"number": 334, "text": "مقررات این باب شامل اسکناس نیست. باب ششم- دلالی فصل اول- کلی ات"}, {"number": 335, "text": "دلل کسی است که در مقابل اجرت واسطه انجام معاملاتی شده یا برای کسیکه میخواهد معاملاتی نماید طرف معامله پیدا میکند.اصول قرارداد دللی تابع مقررات راجع بو کالت است."}, {"number": 336, "text": "دلل میتواند در رشتههای مختلف دللی نموده و شخصا نیز تجارت کند."}, {"number": 337, "text": "دلل باید در نهایت صحت و از رو ی صداقت طرفین معامله را از جزئیات راجعه به معامله مطلع سازد ولو اینکه دللی را فقط برای یکی از طرفین بکند- دلل در مقابل هر یک از طرفین مسئول تقلب و تقصیرات خود میباشد."}, {"number": 338, "text": "دلل نمیتو اند عوض یکی از طرفین معامله قبض وجه یا تأدیه دین نماید و یا آنکه تعهدات آنها را بموقع اجرا گذارد مگر اینکه اجازه نامه مخصوصی داشته باشد."}, {"number": 339, "text": "دلل مسئول تمام اشیاء و اسنادی است که در ضمن معاملات باو داده شده مگر اینکه ثابت نماید که ضایع یا تلف شدن اشیاء یا اسناد مزبوره مربوط بشخص او نبوده است."}, {"number": 340, "text": "در موردیکه فروش از رو ی نمونه باشد دلل باید نمونه مال التجاره را تا موقع ختم معامله نگاه بدارد مگر اینکه طر فین معامله او را ازاین قید معاف دارند."}, {"number": 341, "text": "دلل میتواند در زمان واحد برای چند آمر در یک رشته یا رشتههای مختلف دللی کند ولی در اینصورت باید آمرین را از این ترتیب وامور دیگر ی که ممکن است موجب تغییر رأی آنها شود مطلع نماید."}, {"number": 342, "text": "هر گاه معامله بتوسط دلل واقع و نوشتجات و اسنادی راجع به آن معامله بین طرفین بتوسط او رد و بدل شود در صورتیکه امضاها راجع باشخاصی باشد که بتوسط او معامله را کردهاند دلل ضامن صحت و اعتبار امضاهای نوشتجات و اسناد مزبور است."}, {"number": 343, "text": "دلل ضامن اعتبار اشخاصی که برای آنها دللی میکند و ضامن اجرای معاملاتی که بتوسط او میشود نیست."}, {"number": 344, "text": "دلل در خصوص ارزش یا جنس مالالتجارة که مورد معامله بوده مسئول نیست مگر اینکه ثابت شود تقصیر از جانب او بوده."}, {"number": 345, "text": "هر گاه طرفین معامله یا یکی از آنها باعتبار تعهد شخص دلل معامله نمود دلل ضامن معامله است."}, {"number": 346, "text": "در صور تیکه دلل در نفس معامله منتفع یا سهیم باشد باید بطرفی که این نکته را نمیداند اطلاع دهد و ال مسئول خسارات وارده بوده و بعلاوه به پانصد تا سه هزار ریال جزای نقد ی محکوم خواهد شد. جزای نقدی مندرج در این بند به موجب مصوبه هیات وزیران مورخ 25/12/1399 به000 /000 /25 تا60.000.000ریال تعدیل یافته است"}, {"number": 347, "text": "در صورتیکه دلل در معامله سهیم باشد با آمر خود متضامنا مسئول اجرای تعهد خواهد بود. فصل دوم - اجرت دلال و مخارج"}, {"number": 348, "text": "دلل نمیتواند حق دللی را مطالبه کند مگر در صورتیکه معامله براهنمائی یا وساطت او تمام شده باشد."}, {"number": 349, "text": "اگر دلل برخلاف وظیفه خود نسبت به کسی که باو مأموریت داده بنفع طرف دیگر معامله اقدام نماید و یا برخلاف عرف تجارتی محل از طرف مزبور وجهی دریافت و یا وعده وجهی را قبول کند مستحق اجرت و مخارجی که کرده نخواهد بود بعلاوه محکوم بمجازات مقرر برای خیانت در امانت خواهد شد."}, {"number": 350, "text": "هر گاه معامله مشروط بشرط تعلیقی باشد دلل پس از حصول شرط مستحق اجرت خواهد بود."}, {"number": 351, "text": "اگر شرط شده باشد مخارجی که دلل میکند باو داده شود دلل مستحق اخذ مخارج خواهد بود ولو آنکه معامله سر نگیرد. همین ترتیب در موردی نیز جار ی است که عرف تجارتی محل به پرداخت مخارجی که دلل کرده حکم کند."}, {"number": 352, "text": "در صور تیکه معامله برضایت طرفین یا بواسطه یکی از خیارات قانونی فسخ بشود حق مطالبه دللی از دلل سلب نمیشود مشروط بر اینکه فسخ معامله مستند به دلل نباشد."}, {"number": 353, "text": "دللی معاملات ممنوعه اجرت ندارد."}, {"number": 354, "text": "حقالزحمه دلل بعهده طرفی است که او را مأمور انجام معامله نموده مگر اینکه قرار داد خصوصی غیر این ترتیب را مقرر بدار د."}, {"number": 355, "text": "(منسوخ- حقالزحمه دلل بواسطه قرارداد مخصوصی باید معین شده باشد و ال محکمه با رجوع باهل خبره و رعایت مقتضیات زمانی ومکانی و نوع معامله حقالزحمه را معین خواهد کرد. فصل سوم - دفتر"}, {"number": 356, "text": "(منسوخ- هر دلل باید دفتر ی داشته و کلیه معاملاتی را که بدللی او انجام گرفته بترتیب ذیل در آن ثبت نماید: 1) اسم متعاملین. 2) مالی که موضوع معامله است. 3) نوع معامله. 4) شرایط معامله با تشخیص باینکه تسلیم موضوع معامله فور ی است یا بوعده است. 5) عوض مالی که باید پرداخته شود و تشخیص اینکه فور ی است یا بوعده است وجه نقد است یا مالالتجاره یا بر ات در صورتیکه برات باشد برؤیت است یا بوعده. 6) امضاء طرفین معامله مطابق مقررات نظامنامه وزارت عدلیه. دفتر دللی تابع کلیه مقررات راجع بدفاتر تجارتی است. باب هفتم- حقالعملکار ی ( کم یسیون)"}, {"number": 357, "text": "حقالعملکار کسی است که باسم خود ولی بحساب دیگر ی (آمر) معاملاتی کرده و در مقابل حقالعملی دریافت میدارد."}, {"number": 358, "text": "جز در مواردی که بموجب مواد ذیل استثناء شده مقررات راجعه بو کالت در حقالعملکار ی نیز رعایت خواهد شد."}, {"number": 359, "text": "حقالعملکار باید آمر را از جریان اقدامات خود مستحضر داشته و مخصوصا در صورت انجام مأموریت این نکته را بفوریت باو اطلاع دهد."}, {"number": 360, "text": "حقالعملکار مکلف به بیمه کردن اموالی که موضوع معامله است نیست مگر اینکه آمر دستور داده باشد."}, {"number": 361, "text": "اگر مالالتجارة که برای فروش نزد حقالعملکار ارسال شده دارای عیوب ظاهر ی باشد حقالعملکار باید برای محفوظ داشتن حق رجوع بر علیه متصد ی حمل و نقل و تعیین میزان خسارات بحر ی (آوار ی) بوسایل مقتضیه و محافظت مالالتجاره اقدامات لزمه بعمل آورده و آمر را ازاقدامات خود مستحضر کند و ال مسئول خسارات ناشیه از این غفلت خواهد بود."}, {"number": 362, "text": "اگر بیم فساد سریع مال التجارة رود که نزد حقالعمل کار برای فروش ارسال شده حقالعمل کار می تواند و حتی در صورتیکه منافع آمر ایجاب کند مکلف است مال التجاره را با اطلاع مدعیالعموم محلی که مال التجاره در آنجا است یا نماینده او بفروش برساند."}, {"number": 363, "text": "اگر حقالعمل کار مال التجارة را به کمتر از حداقل قیمتی که آمر معین کرده بفروش رساند مسئول تفاوت خواهد بود مگر اینکه ثابت نماید از ضرر بیشتر ی احتراز کرده و تحصیل اجازه آمر در موقع مقدور نبوده است."}, {"number": 364, "text": "اگر حقالعملکار تقصیر کرده باشد باید از عهده کلیه خساراتی نیز که از عدم رعایت دستور آمر ناشی شده برآید."}, {"number": 365, "text": "اگر حقالعمل کار مال التجارة را به کمتر از قیمتی که آمر معین کرده بخرد و یا به بیشتر از قیمتی که آمر تعیین نموده بفروش رساند حق استفاده از تفاوت نداشته و باید آنرا در حساب آمر محسوب دارد."}, {"number": 366, "text": "اگر حقالعمل کار بدون رضایت آمر مالی را به نسیه بفروشد یا پیش قسطی دهد ضررهای ناشیه از آن متوجه خود او خواهد بود معذالک اگر فروش به نسیه داخل در عرف تجارتی محل باشد حقالعمل کار مأذون بآن محسوب می شود مگر در صورت دستور مخالف آمر."}, {"number": 367, "text": "حقالعمل کار در مقابل آمر مسئول پرداخت وجوه و یا انجام سایر تعهدات طرف معامله نیست مگر اینکه مجاز در معامله باعتبار نبوده و یا شخصا ضمانت طرف معامله را کرده و یا عرف تجارتی بلد او را مسئول قرار دهد."}, {"number": 368, "text": "مخارجی که حقالعمل کار کرده و برای انجام معامله و نفع آمر لزم بوده و همچنین هر مساعدة که بنفع آمر داده باشد باید اصلا ومنفعتا به حقالعمل کار مسترد شود. حقالعمل کار میتواند مخارج انباردار ی و حمل و نقل را نیز بحساب آمر گذارد."}, {"number": 369, "text": "وقتی حقالعمل کار مستحق حقالعمل میشود که معامله اجرا شده و یا عدم اجرای آن مستند بفعل آمر باشد. نسبت باموریکه در نتیجه علل دیگر ی انجام پذیر نشده حقالعمل کار برای اقدامات خود فقط مستحق اجرتی خواهد بود که عرف و عادت محل معین مینماید."}, {"number": 370, "text": "اگر حقالعملکار نادرستی کرده و مخصوصا در موردی که بحساب آمر قیمتی علاوه بر قیمت خرید و یا کمتر از قیمت فروش محسوب دارد مستحق حقالعمل نخواهد بود- بعلاوه در دو صورت اخیر آمر میتواند حقالعملکار را خریدار یا فروشنده محسوب کند. تبصره- دستور فوق مانع از اجرای مجازاتیکه برای خیانت در امانت مقرر است نیست."}, {"number": 371, "text": "حقالعملکار در مقابل آمر برای وصول مطالبات خود از او نسبت باموالی که موضوع معامله بوده و یا نسبت بقیمتی که اخذ کرده- حق حبس خواهد داشت."}, {"number": 372, "text": "اگر فر وش مال ممکن نشده و یا آمر از اجازه فروش رجوع کرده و مال التجاره را بیش از حد متعارف نزد حقالعمل کار بگذارد حقالعمل کار می تواند آن را با نظارت مدعیالعموم بدایت محل یا نماینده او بطریق مزایده بفروش برساند. اگر آمر در محل نبوده و در آنجا نماینده نیز نداشته باشد فروش بدون حضور او یا نماینده او بعمل خواهد آمد ولی در هر حال قبلا باید باو اخطاریه رسمی ارسال گردد مگر اینکه اموال از جمله اموال سریعالفساد باشد."}, {"number": 373, "text": "اگر حقالعمل کار مأمور بخرید یا فروش مال التجاره یا اسناد تجارتی و یا سایر اوراق بهادار ی باشد که مظنه بورسی یا بازار ی دارد میتواند چیزی را که مأمور بخرید آن بوده خود شخصا بعنوان فروشنده تسلیم بکند و یا چیزیرا که مأمور بفروش آن بوده شخصا بعنوان خریدار نگاهدارد مگر اینکه آمر دستور مخالفی داده باشد."}, {"number": 374, "text": "در مورد ماده فوق حقالعمل کار باید قیمت را بر طبق مظنه بورسی یا نرخ بازار در روز ی که و کالت خود را انجام میدهد منظور دارد و حق خو اهد داشت که هم حقالعمل و هم مخارج عادیه حقالعمل کار ی ر ا برداشت کند."}, {"number": 375, "text": "در هر موردیکه حقالعمل کار شخصا میتواند خریدار یا فروشنده واقع شود اگر انجام معامله را به آمر بدون تعیین طرف معامله اطلاع دهد خود طرف معامله محسوب خواهد شد."}, {"number": 376, "text": "اگر آمر از امر خود رجوع کرده و حقالعمل کار قبل از ارسال خبر انجام معامله از این رجوع مستحضر گردد دیگر نمیتواند شخصا خریدار یا فروشنده واقع شود. باب هشتم- قرارداد حمل و نقل"}, {"number": 377, "text": "متصدی حمل و نقل کسی است که در مقابل اجرت حمل اشیاء را بعهده میگیر د."}, {"number": 378, "text": "قرارداد حمل و نقل تابع مقررات و کالت خواهد بود مگر در مواردیکه ذیلا استثناء شده باشد."}, {"number": 379, "text": "ارسال کننده باید نکات ذیل را باطلاع متصد ی حمل و نقل برساند: آدرس صحیح مرسلالیه- محل تسلیم مال- عده عدل یا بسته و طر ز عدل بند ی- وزن و محتو ی عدل ها- مدتی که مال باید در آن مدت تسلیم شود- راهی که حمل باید از آن راه بعمل آید- قیمت اشیائی که گرانبها است. خسارات ناشیه از عدم تعیین نکات فوق و یا از تعیین آنها بغلط متوجه ارسال کننده خواهد بود."}, {"number": 380, "text": "ارسال کننده باید مواظبت نماید که مال التجاره بطرز مناسبی عدل بند ی شود- خسارات بحر ی (آوار ی) ناشی از عیوب عدل بند ی بعهده ارسال کننده است."}, {"number": 381, "text": "اگر عدل بند ی عیب ظاهر داشته و متصد ی حمل و نقل مال را بدون قید عدم مسئولیت قبول کرده باشد مسئول آوار ی خواهد بود."}, {"number": 382, "text": "ارسال کننده میتواند مادام که مال التجاره در ید متصد ی حمل و نقل است آنرا با پرداخت مخارجی که متصد ی حمل و نقل کرده و خسارات او پس بگیرد."}, {"number": 383, "text": "در موارد ذیل ارسال کننده نمیتواند از حق استرداد مذکور در ماده 382 استفاده کند: 1- در صورتیکه بارنامه توسط ارسال کننده تهیه و بوسیله متصد ی حمل و نقل بمرسلالیه تسلیم شده باشد. 2- در صورتیکه متصد ی حمل و نقل رسید ی بارسال کننده داده و ارسال کننده نتواند آنرا پس دهد. 3- در صورتیکه متصد ی حمل و نقل به مرسلالیه اعلام کرده باشد که مال التجاره بمقصد رسیده و باید آن را تحویل گیرد. 4- در صورتیکه پس از وصول مال التجاره به مقصد مرسلالیه تسلیم آنرا تقاضا کرده باشد. در این موارد متصد ی حمل و نقل باید مطابق دستور مرسلالیه عمل کند معذالک اگر متصد ی حمل و نقل رسید ی بارسال کننده داده مادام که مال التجاره بمقصد نرسیده مکلف برعایت دستور مرسلالیه نخواهد بود مگر اینکه رسید بمرسلالیه تسلیم شده باشد."}, {"number": 384, "text": "اگر مرسلالیه مال التجاره را قبول نکند و یا مخارج و سایر مطالبات متصد ی حمل و نقل بابت مال التجاره تأدیه نشود و یا بمرسلالیه دسترسی نباشد متصد ی حمل و نقل باید مراتب را باطلاع ارسال کننده رسانیده و مال التجاره را موقتا نزد خود بطور امانت نگاهداشته یا نزد ثالثی امانت گذارد و در هر دو صورت مخارج و هر نقص و عین بعهده ارسال کننده خواهد بود. اگر ارسال کننده و یا مرسلالیه در مدت مناسبی تکلیف مال التجاره را معین نکند متصد ی حمل و نقل می تواند مطابق ماده 362 آنرا بفروش برساند."}, {"number": 385, "text": "اگر مال التجاره در معرض تضییع سریع باشد و یا قیمتی که میتو ان برای آن فرض کرد با مخارجی که برای آن شده تکافو ننماید متصد ی حمل و نقل باید فورا مراتب را باطلاع مدعیالعموم بدایت محل یا نماینده او رسانیده و با نظارت او مال را بفروش رساند. حتیالمقدور ارسال کننده و مرسلالیه را باید از اینکه مال التجاره بفروش خواهد رسید مسبوق نمود."}, {"number": 386, "text": "اگر مال التجاره تلف یا گم شود متصد ی حمل و نقل مسئول قیمت آن خواهد بود مگر اینکه ثابت نماید تلف یا گم شدن مربوط بجنس خود مال التجاره یا مستند بتقصیر ارسال کننده و یا مرسلالیه و یا ناشی از تعلیماتی بوده که یکی از آنها دادهاند و یا مربوط بحوادثی بوده که هیچ متصد ی مواظبی نیز نمیتوانست از آن جلوگیر ی نماید قرارداد طرفین میتواند برای میزان خسار ت مبلغی کمتر یا زیادتر از قیمت کامل مال التجاره معین نماید."}, {"number": 387, "text": "در مورد خسارات ناشیه از تأخیر تسلیم یا نقص یا خسارات بحر ی (آوار ی) مال التجاره نیز متصد ی حمل و نقل در حدود ماده فوق مسئو ل خواهد بود. خسارات مزبور نمی تواند از خساراتی که ممکن بود در صور ت تلف شدن تمام مال التجاره حکم به آن شود تجاوز نماید مگر اینکه قرارداد طرفین خلاف این ترتیب را مقرر داشته باشد."}, {"number": 388, "text": "متصدی حمل و نقل مسئول حوادث و تقصیراتی است که در مدت حمل و نقل واقع شده اعم از اینکه خود مباشرت بحمل و نقل کرده و یا حمل و نقل کننده دیگریرا مأمور کرده باشد- بدیهی است که در صورت اخیر حق رجوع او به متصد ی حمل و نقلی که از جانب او مأمورشده محفوظ است."}, {"number": 389, "text": "متصدی حمل و نقل باید بمحض وصول مالالتجاره مرسلالیه را مستحضر نماید."}, {"number": 390, "text": "اگر مرسلالیه میزان مخارج و سایر وجوهی ر ا که متصد ی حمل و نقل بابت مال التجاره مطالبه مینماید قبول نکند حق تقاضای تسلیم مال التجاره را نخواهد داشت مگر اینکه مبلغ متنازع فیه را تا ختم اختلاف در صندوق عدلیه امانت گذارد."}, {"number": 391, "text": "اگر مال التجاره بدون هیچ قید ی قبول و کرایه آن تأدیه شود دیگر بر علیه متصد ی حمل و نقل دعو ی پذیرفته نخواهد شد مگر در مورد تدلیس یا تقصیر عمده بعلاوه متصد ی حمل و نقل مسئول آوار ی غیرظاهر نیز خواهد بود در صورتیکه مرسلالی ه آن آوار ی را در مدتیکه مطابق اوضاع و احوال رسیدگی بمال التجاره ممکن بود بعمل آید و یا بایستی بعمل آمده باشد مشاهده کرده و فورا پس از مشاهده بمتصد ی حمل و نقل اطلاع دهد در هر حال این اطلاع باید منتها تا هشت روز بعد از تحویل گرفتن مال التجاره داده شود."}, {"number": 392, "text": "در هر موردی که بین متصد ی حمل و نقل و مرسلالیه اختلاف باشد محکمه صلاحیتدار محل می تواند بتقاضای یکی از طرفین امر دهد مال التجاره نزد ثالثی امانت گذارده شده و یا لد یالقتضاء فروخته شود در صورت اخیر فروش باید پس از تنظیم صورت مجلسی حاکی از آنکه مال التجاره در چه حال بوده بعمل آید. بوسیله پرداخت تمام مخارج و وجوهی که بابت مال التجاره ادعا می شود و یا سپردن آن بصندوق عدلیه از فروش مال التجاره می توان جلوگیر ی کرد."}, {"number": 393, "text": "نسبت بدعو ی خسارت بر علیه متصد ی حمل و نقل مدت مرور زمان یکسال است- مبدأ این مدت در صورت تلف یا گم شدن مال التجار ه و یا تأخیر در تسلیم روز ی است که تسلیم بایستی در آن ر وز بعمل آمده باشد و در صورت خسارات بحر ی (آوار ی) روز ی که مال بمرسلالیه تسلیم شده."}, {"number": 394, "text": "حمل و نقل بوسیله پست تابع مقررات این باب نیست. باب نهم – قائم مقام تجارتی و سایر نمایندگان تجارتی"}, {"number": 395, "text": "قائم مقام تجارتی کسی است که رئیس تجارتخانه او را بر ای انجام کلیه امور مربوطه به تجارتخانه یا یکی از شعب آن نایب خود قرار داده و امضای او برای تجارتخانه الزامآور است. سمت مزبور ممکن است کتبا داده شود یا عملا ."}, {"number": 396, "text": "تحدید اختیار ات قائم مقام تجار تی در مقابل اشخاصی که از آن اطلاع نداشته اند معتبر نیست."}, {"number": 397, "text": "قائم مقام تجارتی ممکن است بچند نفر مجتمعا داده شود با قید اینکه تا تمام امضاء نکنند تجارتخانه ملزم نخواهد شد ولی در مقابل اشخاص ثالثی که از این قید اطلاع نداشتهاند فقط در صورتی می توان از آن استفاده کرد که این قید مطابق مقررات وزارت عدلیه به ثبت رسیده و اعلان شده باشد."}, {"number": 398, "text": "قائم مقام تجارتی بدون اذن رئیس تجارتخانه نمی تواند کسی را در کلیه کارهای تجارتخانه نایب خود قرار دهد."}, {"number": 399, "text": "عزل قائم مقام تجارتی که و کالت او به ثبت رسیده و اعلان شده باید مطابق مقررات وزارت عدلیه به ثبت رسیده و اعلان شود و ال درمقابل ثالثی که از عزل مطلع نبوده و کالت باقی محسوب می شود."}, {"number": 400, "text": "با فوت یا حجر رئیس تجارتخانه قائم مقام تجارتی منعزل نیست- با انحلال شر کت قائم مقام تجارتی منعزل است."}, {"number": 401, "text": "وکالت سایر کسانی که در قسمتی از امور تجارتخانه یا شعبه تجارتخانه سمت نمایندگی دارند تابع مقررات عمومی راجع بو کالت است. باب دهم- ضمانت"}, {"number": 402, "text": "ضامن وقتی حق دارد از مضمون له تقاضا نماید که بدوا بمدیون اصلی رجوع کرده و در صورت عدم وصول طلب باو رجوع نماید که بین طرفین (خواه ضمن قرارداد مخصوص خواه در خود ضمانت نامه) این ترتیب مقرر شده باشد."}, {"number": 403, "text": "در کلیه مواردی که بموجب قوانین یا موافق قراردادهای خصوصی ضمانت تضامنی باشد طلبکار می تواند بضامن و مدیون اصلی مجتمعا رجوع کرده یا پس از رجوع بیکی از آنها و عدم وصول طلب خود برای تمام یا بقیه طلب بدیگر ی رجوع نماید."}, {"number": 404, "text": "حکم فوق در موردی نیز جار ی است که چند نفر بموجب قرارداد یا قانون متضامنا مسئول انجام تعهد ی باشند."}, {"number": 405, "text": "قبل از رسیدن اجل دین اصلی ضامن ملزم بتأدیه نیست ولو اینکه بواسطه ورشکستگی یا فوت مدیون اصلی دین مؤجل او حال شده باشد."}, {"number": 406, "text": "ضمان حال از قاعده فوق مستثنی است."}, {"number": 407, "text": "اگر حق مطالبه دین اصلی مشروط باخطار قبلی است این اخطار نسبت بضامن نیز باید بعمل آید."}, {"number": 408, "text": "همینکه دین اصلی بنحو ی از انحاء ساقط شده ضامن نیز بر ی میشود."}, {"number": 409, "text": "همینکه دین حال شد ضامن میتواند مضمونله را بدریافت طلب یا انصراف از ضمان ملزم کند ولو ضمان مؤجل باشد."}, {"number": 410, "text": "استنکاف مضمونله از دریافت طلب یا امتناع از تسلیم وثیقه- اگر دین با وثیقه بوده- ضامن را فورا و بخودی خود بر ی خواهد ساخت."}, {"number": 411, "text": "پس از آنکه ضامن دین اصلی را پرداخت مضمون له باید تمام اسناد و مدار کی را که برای رجوع ضامن بمضمونعنه لزم و مفید است باو داده و اگر دین اصلی با وثیقه باشد آنرا بضامن تسلیم نماید- اگر دین اصلی وثیقه غیرمنقول داشته مضمونعنه مکلف بانجام تشریفاتی است که برای انتقال وثیقه بضامن لزم است. باب یازدهم- در ورشکستگی فصل اول- در کلی ات"}, {"number": 412, "text": "ورشکستگی تاجر یا شر کت تجارتی در نتیجه توقف از تأدیه وجوهی که بر عهده او است حاصل می شود. حکم ورشکستگی تاجر ی را که حین الفوت در حال توقف بوده تا یکسال بعد از مرگ او نیز میتوان صادر نمود. فصل دوم - در اعلان ورشکستگی و اثرات آن"}, {"number": 413, "text": "تاجر باید در ظرف سه روز از تاریخ وقفة که در تأدیه قروض یا سایر تعهدات نقد ی او حاصل شده است توقف خود را بدفتر محکمه بدایت محل اقامت خود اظهار نموده صورت حساب دارائی و کلیه دفاتر تجارتی خود را بدفتر محکمه مزبوره تسلیم نماید."}, {"number": 414, "text": "صورتحساب مذکور در ماده فوق باید مورخ بوده و بامضاء تاجر رسیده و متضمن مراتب ذیل باشد: 1) تعداد و تقویم کلیه اموال منقول و غیرمنقول تاجر متوقف بطور مشروح. 2) صورت کلیه قروض و مطالبات . 3) صورت نفع و ضرر و صورت مخارج شخصی. در صورت توقف شر کتهای تضامنی- مختلط یا نسبی اسامی و محل اقامت کلیه شر کاء ضامن نیز باید ضمیمه شود."}, {"number": 415, "text": "ورشکستگی تاجر بحکم محکمه بدایت در موارد ذیل اعلام می شود: الف) بر حسب اظهار خود تاجر. ب ) بموجب تقاضای یک یا چند نفر از طلبکارها. ج) بر حسب تقاضای مدعیالعموم بدایت."}, {"number": 416, "text": "محکمه باید در حکم خود تاریخ توقف تاجر را معین نماید و اگر در حکم معین نشد تاریخ حکم تاریخ توقف محسوب است."}, {"number": 417, "text": "حکم ورشکستگی بطور موقت اجرا میشود."}, {"number": 418, "text": "تاجر ورشکسته از تاریخ صدور حکم از مداخله در تمام اموال خود حتی آنچه که ممکن است در مدت ورشکستگی عاید او گردد ممنوع است. در کلیه اختیارات و حقوق مالی ورشکسته که استفاده از آن مؤثر در تأدیه دیون او باشد مدیر تصفیه قائم مقام قانونی ورشکسته بوده و حق دارد بجای او از اختیارات و حقوق مزبوره استفاده کند."}, {"number": 419, "text": "از تاریخ حکم ورشکستگی هر کس نسبت بتاجر ورشکسته دعوائی از منقول یا غیرمنقول داشته باشد باید بر مدیر تصفیه اقامه یا بطرفیت او تعقیب کند- کلیه اقدامات اجرائی نیز مشمول همین دستور خواهد بود."}, {"number": 420, "text": "محکمه هر وقت صلاح بداند میتواند ورود تاجر ورشکسته را بعنوان شخص ثالث در دعو ی مطروحه اجازه دهد."}, {"number": 421, "text": "همینکه حکم ورشکستگی صادر شد قروض مؤجل با رعایت تخفیفات مقتضیه نسبت بمدت بقروض حال مبدل میشود."}, {"number": 422, "text": "هر گاه تاجر ورشکسته فته طلبی داده یا براتی صادر کرده که قبول نشده یا براتی را قبولی نوشته سایر اشخاصیکه مسئول تأدیه وجه فته طلب یا برات میباشند باید با رعایت تخفیفات مقتضیه نسبت بمدت وجه آنرا نقدا بپردازند یا تأدیه آنرا در سر وعده تأمین نمایند."}, {"number": 423, "text": "هر گاه تاجر بعد از توقف معاملات ذیل را بنماید باطل و بلااثر خواهد بود: 1) هر صلح محاباتی یا هبه و بطور کلی هر نقل و انتقال بلاعوض اعم از اینکه راجع بمنقول یا غیرمنقول باشد. 2) تأدیه هر قرض اعم از حال یا مؤجل بهر وسیله که بعمل آمده باشد. 3) هر معاملة که مالی از اموال منقول یا غیرمنقول تاجر را مقید نماید و بضرر طلبکاران تمام شود."}, {"number": 424, "text": "هر گاه در نتیجه اقامه دعو ی از طرف مدیر تصفیه یا طلبکار ی بر اشخاصیکه با تاجر طرف معامله بوده یا بر قائم مقام قانونی آنها ثابت شود تاجر متوقف قبل از تاریخ توقف خود برای فرار از ادای دین یا برای اضرار به طلبکارها معاملة نموده که متضمن ضرر ی بیش از ربع قیمت حین المعامله بوده است آن معامله قابل فسخ است مگر اینکه طرف معامله قبل از صدور حکم فسخ تفاوت قیمت را بپردازد دعو ی فسخ در ظرف دو سال از تاریخ وقوع معامله در محکمه پذیرفته میشود."}, {"number": 425, "text": "هر گاه محکمه بموجب ماده قبل حکم فسخ معامله را صادر نماید محکومعلیه باید پس از قطعی شدن حکم مالی را که موضوع معامله بوده است عینا بمدیر تصفیه تسلیم و قیمت حین المعامله آن را قبل از آنکه دارائی تاجر بغرما تقسیم شود دریافت دارد و اگر عین مال مزبور در تصرف او نباشد تفاوت قیمت را خواهد داد."}, {"number": 426, "text": "اگر در محکمه ثابت شود که معامله بطور صور ی یا مسبوق بتبانی بوده است آن معامله خود بخود باطل- عین و منافع مالیکه موضوع معامله بوده مسترد و طرف معامله اگر طلبکار شود جزو غرما حصة خواهد بود. فصل سوم - در تعیی ن عضو ناظر"}, {"number": 427, "text": "در حکمیکه بموجب آن ورشکستگی تاجر اعلام میشود محکمه یکنفر را بسمت عضو ناظر معین خواهد کرد."}, {"number": 428, "text": "عضو ناظر مکلف است بنظارت در ادار ه امور راجعه بورشکستگی و سرعت جریان آن است."}, {"number": 429, "text": "تمام منازعات ناشیه از ورشکستگی را که حل آن از صلاحیت محکمه است عضو ناظر بمحکمه راپرت خواهد داد."}, {"number": 430, "text": "شکایت از تصمیمات عضو ناظر فقط در مواردی ممکن است که این قانون معین نموده."}, {"number": 431, "text": "مرجع شکایت محکمة است که عضو ناظر را معین کرده."}, {"number": 432, "text": "محکمه همیشه میتواند عضو ناظر را تبدیل و دیگریرا بجای او بگمارد. فصل چهارم- در اقدام بمهر و موم و سایر اقدامات اولی ه نسبت بورشکسته"}, {"number": 433, "text": "محکمه در حکم ورشکستگی امر بمهر و موم را نیز میدهد."}, {"number": 434, "text": "مهر و موم باید فور ا توسط عضو ناظر بعمل آید مگر در صورتی که بعقیده عضو مزبور برداشتن صورت دارائی تاجر در یک روزممکن باشد در این صورت باید فورا شروع به برداشتن صورت شود."}, {"number": 435, "text": "اگر تاجر ورشکسته بمفاد ماده 413- 414 عمل نکرده باشد محکمه در حکم ورشکستگی قرار توقیف تاجر را خواهد داد."}, {"number": 436, "text": "قرار توقیف ورشکسته در مواقعی نیز داده خواهد شد که معلوم گردد بواسطه اقدامات خود از اداره و تسویه شدن عمل ورشکستگی می خواهد جلوگیر ی کند."}, {"number": 437, "text": "در صورتیکه تاجر مقروض فرار کرده یا تمام یا قسمتی از دارائی خود را مخفی نموده باشد امین صلح می تواند بر حسب تقاضای یک یا چند نفر از طلبکاران فورا اقدام بمهر و موم نماید و باید بلافاصله این اقدام خود را بمدعیالعموم اطلاع دهد."}, {"number": 438, "text": "انبارها و حجر هها و صندوق و اسناد و دفاتر و نوشتجات و اسباب و اثاثیه تجارتخانه و منزل تاجر باید مهر موم شود."}, {"number": 439, "text": "در صورت ورشکستگی شر کتهای تضامنی- مختلط یا نسبی اموال شخصی شر کاء ضامن مهر و موم نخواهد شد مگر اینکه حکم ورشکستگی آنها نیز در ضمن حکم ورشکستگی شر کت یا بموجب حکم جداگانه صادر شده باشد. تبصره- در مورد این ماده و ماده فوق مستثنیات دین از مهر و موم معاف است. فصل پنجم- در مدیر تصفی ه"}, {"number": 440, "text": "محکمه در ضمن حکم ورشکستگی یا منتهی در ظرف پنج روز پس از صدور حکم یکنفر را بسمت مدیریت تصفیه معین میکند."}, {"number": 441, "text": "اقدامات مدیر تصفیه برای تهیه صورت طلبکاران و اخطار بآنها و مدتی که در آن مدت طلبکاران باید خود را معرفی نمایند و بطور کلی وظایف مدیر تصفیه علاوه بر آن قسمتی که بموجب این قانون معین شده بر طبق نظامنامة که از طرف وزارت عدلیه تنظیم می شود معین خواهد شد."}, {"number": 442, "text": "میزان حقالزحمه مدیر تصفیه را محکمه در حدود مقرر ات وزارت عدلیه معین خواهد کرد. فصل ششم- در وظایف مدیر تصفیه مبحث اول- در کلیات"}, {"number": 443, "text": "اگر مهر و موم قبل از تعیین مدیر تصفیه بعمل نیامده باشد مدیر مزبور تقاضای انجام آن را خواهد نمود."}, {"number": 444, "text": "عضو ناظر بتقاضای مدیر تصفیه باو اجازه میدهد که اشیاء ذیل ر ا از مهر و موم مستثنی کرده و اگر مهر و موم شده است از توقیف خارج نماید: 1- البسه و اثاثیه و اسبابی که برای حوائج ضرور ی تاجر ورشکسته و خانواده او لزم است. 2- اشیائی که ممکن است قریبا ضایع شود یا کسر قیمت حاصل نماید. 3- اشیائی که برای بکار انداختن سرمایه تاجر ورشکسته و استفاده از آن لزم است در صورتیکه توقیف آنها موجب خسارت ارباب طلب باشد. اشیاء مذکور در فقره ثانیه و ثالثه باید فورا تقویم و صورت آن برداشته شود."}, {"number": 445, "text": "فروش اشیائی که ممکن است قریبا ضایع شده یا کسر قیمت حاصل کند و اشیائی که نگاه داشتن آنها مفید نیست و همچنین بکار انداختن سرمایه تاجر ورشکسته با اجازه عضو ناظر بتوسط مدیر تصفیه بعمل میآید."}, {"number": 446, "text": "دفتردار محکمه دفاتر تاجر ورشکسته را باتفاق عضو ناظر یا امین صلحی که آنها را مهر و موم نموده است از توقیف خارج کرده پس ازآن که ذیل دفاتر ر ا بست آنها را بمدیر تصفیه تسلیم مینماید. دفتردار باید در صورت مجلس کیفیت دفاتر را بطور خلاصه قید کند- اوراق تجارتی هم که وعده آنها نزدیک است یا باید قبولی آنها نوشته شود و یا نسبت بآنها باید اقدامات تأمینیه بعمل آید از توقیف خارج شده در صورت مجلس ذکر و بمدیر تصفیه تحویل میشود تا وجه آنر ا وصول نماید و فهرستی که از مدیر تصفیه گرفته میشود بعضو ناظر تسلیم میگردد- سایر مطالبات را مدیر تصفیه در مقابل قبضیکه میدهد وصول مینماید مراسلاتی که باسم تاجر ورشکسته میرسد بمدیر تصفیه تسلیم و بتوسط او باز میشود و اگر خود ورشکسته حاضر باشد در باز کردن مر اسلات میتواند شر کت کند."}, {"number": 447, "text": "تاجر ورشکسته در صورتی که وسیله دیگر ی برای اعاشه نداشته باشد میتواند نفقه خود و خانوادهاش را از دارائی خود درخواست کند- در این صورت عضو ناظر نفقه و مقدار آن را با تصویب محکمه معین مینماید."}, {"number": 448, "text": "مدیر تصفیه تاجر ورشکسته را برای بستن دفاتر احضار مینماید برای حضور او منتها چهل و هشت ساعت مهلت داده میشود در صورتیکه تاجر حاضر نشد با حضور عضو ناظر اقدام بعمل خواهد آمد- تاجر ورشکسته میتواند در موقع کلیه عملیات تأمینیه حاضر باشد."}, {"number": 449, "text": "در صورتیکه تاجر ورشکسته صورت دارائی خود را تسلیم ننموده باشد مدیر تصفیه آن را فورا بوسیله دفاتر و اسناد مشارالیه و سایر اطلاعاتی که تحصیل مینماید تنظیم میکند."}, {"number": 450, "text": "عضو ناظر مجاز است که راجع به تنظیم صورت دارائی و نسبت باوضاع و احوال ورشکستگی از تاجر ورشکسته و شاگردها ومستخدمین او و همچنین از اشخاص دیگر توضیحات بخواهد و باید از تحقیقات مذکوره صورت مجلس ترتیب دهد. مبحث دوم- در رفع توقیف و ترتیب صورت دارائی"}, {"number": 451, "text": "مدیر تصفیه پس از تقاضای رفع توقیف شروع به تنظیم صورت دارائی نموده و تاجر ورشکسته را هم در اینموقع احضار میکند ولی عدم حضور او مانع از عمل نیست."}, {"number": 452, "text": "مدیر تصفیه بتدریجی که رفع توقیف میشود صورت دارائی را در دو نسخه تهیه مینماید. یکی از نسختین بدفتر محکمه تسلیم شده و دیگر ی در نزد او میماند."}, {"number": 453, "text": "مدیر تصفیه میتواند برای تهیه صورت دارائی و تقویم اموال از اشخاصیکه لزم بداند استمداد کند صورت اشیائی که موافق ماده 444 در تحت توقیف نیامده ولی قبلا تقویم شده است ضمیمه صورت دارائی خواهد شد."}, {"number": 454, "text": "مدیر تصفیه باید در ظرف پانزده روز از تاریخ مأموریت خود صورت خلاصة از وضعیت ورشکستگی و همچنین از علل و اوضاعی که موجب آن شده و نوع ورشکستگی که ظاهرا بنظر میآید ترتیب داده بعضو ناظر بدهد. عضو ناظر صورت مزبور را فورا بمدعیالعموم ابتدائی محل تسلیم مینماید."}, {"number": 455, "text": "صاحبمنصبان پار که می توانند فقط بعنوان نظارت بمنزل تاجر ورشکسته رفته و در حین برداشتن صورت دارائی حضور بهمرسانند. مأمورین پار که در هر موقع حق دارند بدفاتر و اسناد و نوشتجات مربوطه بورشکستگی مراجعه کنند. این مراجعه نباید باعث تعطیل جریان امر باشد. مبحث سوم- در فروش امو ال و وصول مطالبات"}, {"number": 456, "text": "پس از تهیه شدن صورت دارائی تمام مال التجاره و وجه نقد و اسناد طلب و دفاتر و نوشتجات و اثاثیه (بغیر از مستثنیات دین) واشیاء تاجر ورشکسته بمدیر تصفیه تسلیم می شود."}, {"number": 457, "text": "مدیر تصفیه با نظارت عضو ناظر بوصول مطالبات مداومت مینماید و همچنین می تواند با اجازه مدعیالعموم و نظار ت عضو ناظر بفروش اثاث البیت و مال التجاره تاجر مباشرت نماید لیکن قبلا باید اظهارات تاجر ورشکسته را استماع یا لاقل مشارالیه را برای دادن توضیحات احضارکند- ترتیب فروش بموجب نظامنامه وزارت عدلیه معین خواهد شد."}, {"number": 458, "text": "نسبت بتمام دعاو ی که هیئت طلب کارها در آن ذینفع میباشند مدیر تصفیه با اجازه عضو ناظر می تواند دعو ی را بصلح خاتمه دهد اگر چه دعاو ی مزبوره راجع به اموال غیرمنقول باشد و در این مورد تاجر ورشکسته باید احضار شده باشد."}, {"number": 459, "text": "اگر موضوع صلح قابل تقویم نبوده یا بیش از پنجهزار رالن باشد صلح لز مالجرا نخواهد بود مگر اینکه محکمه آن صلح را تصدیق نماید در موقع تصدیق صلحنامه تاجر ورشکسته احضار می شود و در هر صورت مشارالیه حق دارد که بصلح اعتراض کند- اعتراض ورشکسته در صورتیکه صلح راجع باموال غیرمنقول باشد برای جلوگیر ی از صلح کافی خواهد بود تا محکمه تکلیف صلح را معین نماید."}, {"number": 460, "text": "وجوهی که بتوسط مدیر تصفیه دریافت می شود باید فورا بصندوق عدلیه محل تسلیم گردد. صندوق مزبور حساب مخصوصی برای عمل ورشکسته اعم از عایدات و مخارج باز میکند وجوه مزبور از صندوق مسترد نمیگردد مگر بحواله عضو ناظر و تصدیق مدیر تصفیه. مبحث چهارم- در اقدامات تأمینیه"}, {"number": 461, "text": "مدیر تصفیه مکلف است از روز شروع بمأموریت اقدامات تأمینیه برای حفظ حقوق تاجر ورشکسته نسبت بمدیونین او بعمل آورد. مبحث پنجم- در تشخیص مطالبات طلبکارها"}, {"number": 462, "text": "پس از صدور حکم ورشکستگی طلبکارها مکلفند- در مدتی که بموجب اخطار مدیر تصفیه در حدود نظامنامه وزارت عدلیه معین شده- اسناد طلب خود یا سواد مصدق آنرا بانضمام فهرستی که کلیه مطالبات آنها را معین مینماید بدفتردار محکمه تسلیم کرده قبض دریافت دارند."}, {"number": 463, "text": "تشخیص مطالبات طلبکارها در ظرف سه روز از تاریخ انقضای مهلت مذکور در ماده قبل شر وع شده و بدون وقفه در محل و روز و ساعتیکه از طرف عضو ناظر معین میگردد- بترتیبی که در نظامنامه معین خواهد شد- تعقیب میشود."}, {"number": 464, "text": "هر طلبکار ی که طلب او تشخیص یا جزء صورت حساب دارائی منظور شده می تواند در حین تشخیص مطالبات سایر طلبکارها حضور بهمرسانیده و نسبت بطلب هائی که سابقا تشخیص شده یا فعلا در تحت رسیدگی است اعتراض نماید- همین حق را خود تاجر ورشکسته هم خواهد داشت."}, {"number": 465, "text": "محل اقامت طلبکارها و و کلای آنها در صورت مجلس تشخیص مطالبات معین و بعلاوه توصیف مختصر ی از سند داده می شود و تعیین قلم خوردگی یا تراشیدگی یا الحاقات بینالسطور نیز باید در صورت مجلس قید و این نکته مسلّم شود که طلب مسلم یا متنازعفیه است."}, {"number": 466, "text": "عضو ناظر می تواند بنظر خود امر بابر از دفاتر طلبکارها دهد یا از محکمه محل تقاضا نماید صورتی از دفاتر طلبکارها استخراج کرده و نزد او بفرستد."}, {"number": 467, "text": "اگر طلب مسلّم و قبول شد مدیر تصفیه در رو ی سند عبارت ذیل را نوشته امضاء نموده و عضو ناظر نیز آنرا تصدیق میکند: «جزو قروض........ مبلغ....... قبول شد بتاریخ......» هر طلبکار باید در ظرف مدت و بتر تیبی که بموجب نظامنامه وزارت عدلیه معین میشود التزام بدهد طلبی را که اظهار کرده طلب حقیقی و بدون قصد استفاده نامشروع است."}, {"number": 468, "text": "اگر طلب متنازعفیه واقع شد عضو ناظر می تواند حل قضیه را بمحکمه رجوع و محکمه باید فورا از ر و ی راپرت عضو ناظر رسیدگی نماید محکمه می تواند امر دهد که با حضور عضو ناظر تحقیق در امر بعمل آید و اشخاصی را که می توانند راجع باین طلب اطلاعاتی دهند عضو ناظر احضار یا از آنها کسب اطلاع کند."}, {"number": 469, "text": "در موقعی که اختلاف راجع به تشخیص طلبی بمحکمه رجوع شده و قضیه طور ی باشد که محکمه نتواند در ظرف پانزده روز حکم صادر کند باید بر حسب اوضاع امر دهد که انعقاد مجلس هیئت طلبکارها برای ترتیب قرارداد ارفاقی بتأخیر افتد و یا اینکه منتظر نتیجه رسیدگی نشده و مجلس مزبور منعقد شود."}, {"number": 470, "text": "محکمه می تواند در صورت تصمیم بانعقاد مجلس قرار دهد که صاحب طلب متنازع فیه معادل مبلغی که محکمه در قرار مزبور معین میکند موقتا طلبکار شناخته شده در مذاکرات هیئت طلبکارها برای مبلغ مذکور شر کت نماید."}, {"number": 471, "text": "در صورتیکه طلبی مورد تعقیب جزائی واقع شده باشد محکمه میتواند قرار تأخیر مجلس را بدهد ولی اگر تصمیم بعدم تأخیر مجلس نمود نمیتواند صاحب آن طلب را موقتا جزو طلبکاران قبول نماید و مادام که محاکم صالحه حکم خود را ندادهاند طلبکار مزبور نمی تو اند بهیچوجه در عملیات راجعه بورشکستگی شر کت کند."}, {"number": 472, "text": "پس از انقضای مهلتهای معین در مواد 462 و 467 بترتیب قرارداد ارفاقی و بسایر عملیات راجعه بورشکستگی مداومت میشود."}, {"number": 473, "text": "طلبکارهائی که در مواعد معینه حاضر نشده و مطابق ماده 462 عمل نکردند نسبت بعملیات و تشخیصات و تصمیماتی که راجع بتقسیم وجوه قبل از آمدن آنها بعمل آمده حق هیچگونه اعتراضی ندارند ولی در تقسیماتی که ممکن است بعد بعمل آید جزء غرما حساب می شوند بدون اینکه حق داشته باشند حصة را که در تقسیمات سابق بآنها تعلق میگرفت از اموالی که هنوز تقسیم نشده مطالبه نمایند."}, {"number": 474, "text": "اگر اشخاصی نسبت باموال متصرفی تاجر ورشکسته دعو ی خیاراتی دارند و صرفنظر از آن نمیکنند باید آن را در حین تصفیه عمل ورشکستگی ثابت نموده و بموقع اجرا گذارند."}, {"number": 475, "text": "حکم فوق درباره دعو ی خیاراتی نیز مجر ی خواهد بود که تاجر ورشکسته نسبت باموال متصرفی خود یا دیگران دارد مشروط براینکه بر ضرر طلبکارها نباشد. فصل هفتم- در قرارداد ارفاقی و تصفیه حساب تاجر ورشکسته مبحث اول- در دعوت طلبکارها و مجمع عمومی آنها"}, {"number": 476, "text": "عضو ناظر در ظرف هشت روز از تاریخ موعد ی که بموجب نظامنامه مذکور در ماده 467 معین شده بتوسط دفتردار محکمه کلیه طلبکارهائی ر ا که طلب آنها تشخیص و تصدیق یا موقتا قبول شده است برای مشاوره در انعقاد قرارداد ارفاقی دعوت مینماید- موضوع دعوت مجمع عمومی طلبکارها در رقعههای دعوت و اعلانات مندرجه در جراید باید تصریح شود."}, {"number": 477, "text": "مجمع عمومی مزبور در محل و روز و ساعتی که از طرف عضو ناظر معین شده است در تحت ریاست مشارالیه منعقد می شود- طلبکارهائی که طلب آنها تشخیص و تصدیق شده است و همچنین طلبکارهائی که طلب آنها موقتا قبول گردیده یا و کیل ثابت الو کاله آنها حاضر می شوند تاجر ورشکسته نیز باین مجمع احضار می شود مشارالیه باید شخصا حاضر گردد و فقط وقتی می تواند اعزام و کیل نماید که عذر موجه داشته و صحت آن بتصدیق عضو ناظر رسیده باشد."}, {"number": 478, "text": "مدیر تصفیه بمجمع طلبکارها راپورتی از وضعیت ورشکستگی و اقداماتی که بعمل آمده و عملیاتی که با استحضار تاجر ورشکسته شده است می دهد راپورت مزبور بامضاء مدیر تصفیه رسیده بعضو ناظر تقدیم می شود و عضو ناظر باید از کلیه مذاکرات و تصمیمات مجمع طلبکارها صورت مجلسی ترتیب دهد. مبحث دوم- در قرارداد ارفاقی فقره اول - در ترتیب قرارداد ارفاقی"}, {"number": 479, "text": "قرارداد ارفاقی بین تاجر ورشکسته و طلبکارهای او منعقد نمیشود مگر پس از اجرای مراسمی که در فوق مقرر شده است."}, {"number": 480, "text": "قرارداد ارفاقی فقط وقتی منعقد میشود که لاقل نصف بعلاوه یکنفر از طلبکارها با داشتن لاقل سه ربع از کلیه مطالباتی که مطابق مبحث پنجم از فصل ششم تشخیص و تصدیق شده یا موقتا قبول گشته است در آن قرارداد شر کت نموده باشند و ال بلااثر خواهد بود."}, {"number": 481, "text": "هر گاه در مجلس قرارداد ارفاقی اکثریت طلبکارها عددا حاضر شوند ولی از حیث مبلغ دارای سه ربع از مطالبات نباشند یا آنکه دارای سه ربع از مطالبات باشند ولی اکثریت عددی را حائز نباشند نتیجه حاصله از آن مجلس معلّق و قرار انعقاد مجلس ثانی برای یکهفته بعد داده میشود."}, {"number": 482, "text": "طلبکارهائی که در مجلس اول خود یا و کیل ثابتالو کاله آنها حاضر بوده و صورت مجلس را امضاء نمودهاند مجبور نیستند در مجلس ثانی حاضر شوند مگر آنکه بخواهند در تصمیم خود تغییر ی دهند ولی اگر حاضر نشدند تصمیمات سابق آنها باعتبار خود باقی است- اگر در جلسه ثانی اکثریت عددی و مبلغی مطابق ماده 480 تکمیل شود قرارداد ارفاقی قطعی خواهد بود."}, {"number": 483, "text": "اگر تاجر بعنوان ورشکسته به تقلب محکوم شده باشد قرارداد ارفاقی منعقد نمیشود- در موقعی که تاجر بعنوان ورشکسته به تقلب تعقیب میشود لزم است طلب کارها دعوت شوند و معلوم کنند که آیا با احتمال حصول برائت تاجر و انعقاد قرارداد ارفاقی تصمیم خود را در امر مشارالیه بزمان حصول نتیجه رسیدگی بتقلب مو کول خواهند کرد یا تصمیم فور ی خواهند گرفت اگر بخواهند تصمیم را مو کو ل بزمان بعد نمایند باید طلبکارهای حاضر از حیث عده و از حیث مبلغ اکثریت معین در ماده 480 را حائز باشند چنانچه در انقضای مدت و حصول نتیجه رسیدگی بتقلب بنای انعقاد قرارداد ارفاقی شود قواعد ی که بموجب مواد قبل مقرر است در این موقع نیز باید معمول گردد."}, {"number": 484, "text": "اگر تاجر بعنوان ورشکستگی بتقصیر محکوم شود انعقاد قرارداد ارفاقی ممکن است لیکن در صورتیکه تعقیب تاجر شروع شده باشد طلبکارها میتوانند تا حصول نتیجه تعقیب و با رعایت مقررات ماده قبل تصمیم در قرارداد را تأخیر بیندازند."}, {"number": 485, "text": "کلیه طلبکارها که حق شر کت در انعقاد قرارداد ارفاقی داشتهاند میتوانند راجع بقرار داد اعتراض کنند- اعتراض باید موجه بوده و درظرف یکهفته از تاریخ قرارداد بمدیر تصفیه و خود تاجر ورشکسته ابلاغ شود و ال از درجه اعتبار ساقط خواهد بود. مدیر تصفیه و تاجر ورشکسته باولین جلسه محکمه که بعمل ورشکستگی رسیدگی میکند احضار میشوند."}, {"number": 486, "text": "قرارداد ارفاقی باید بتصدیق محکمه برسد و هر یک از طرفین قرارداد میتوانند تصدیق آنرا از محکمه تقاضا نماید. محکمه نمیتواند قبل از انقضای مدت یکهفته مذکور در ماده قبل تصمیمی راجع بتصدیق اتخاذ نماید- هر گاه در ظر ف این مدت از طرف طلبکارهائی که حق اعتراض دارند اعتراضاتی بعمل آمده باشد محکمه باید در موضوع اعتراضات و تصدیق قرارداد ارفاقی حکم واحد صادر کند- اگر اعتراضات تصدیق شود قرارداد نسبت بتمام اشخاص ذینفع بلااثر میشود."}, {"number": 487, "text": "قبل از آن که محکمه در باب تصدیق قرارداد رأی دهد عضو ناظر باید راپورتی که متضمن کیفیت ور شکستگی و امکان قبول قرارداد باشد بمحکمه تقدیم نماید."}, {"number": 488, "text": "در صورت عدم رعایت قواعد مقرره محکمه از تصدیق قر ارداد ارفاقی امتناع خواهد نمود. فقره دوم- در اثرات قرارداد ارفاقی"}, {"number": 489, "text": "همینکه قرارداد ارفاقی تصدیق شد نسبت به طلبکارهائی که در اکثریت بودهاند یا در ظرف ده روز از تاریخ تصدیق آنرا امضاء نمودهاند قطعی خواهد بود ولی طلبکار هائی که جزو اکثریت نبوده و قرارداد را هم امضاء نکردهاند میتوانند سهم خود را موافق آنچه از دارائی تاجر به طلبکارها میر سد دریافت نمایند لیکن حق ندارند در آتیه از دارائی تاجر ورشکسته بقیه طلب خود را مطالبه کنند مگر پس از تأدیه تمام طلب کسانیکه در قرارداد ارفاقی شر کت داشته یا آنرا در ظرف ده روز مزبور امضاء نمودهاند."}, {"number": 490, "text": "پس از تصدیق شدن قرارداد ارفاقی دعو ی بطلان نسبت به آن قبول نمیشود مگر اینکه پس از تصدیق مکشوف شود که در میزان دارائی یا مقدار قروض حیلة بکار رفته و قدر حقیقی قلمداد نشده است."}, {"number": 491, "text": "همینکه حکم محکمه راجع بتصدیق قرارداد قطعی شد مدیر تصفیه صورت حساب کاملی با حضور عضو ناظر بتاجر ورشکسته میدهد که در صورت عدم اختلاف بسته میشود- مدیر تصفیه کلیه دفاتر و اسناد و نوشتجات و همچنین دارائی ورشکسته را باستثنای آنچه که باید بطلبکارانی که قرارداد ارفاقی را امضاء نکردهاند داده شود بمشارالیه رد کرده رسید میگیرد و پس از آنکه قرار تأدیه سهم طلبکاران مذکور را داد مأموریت مدیر تصفیه ختم میشود- از تمام این مراتب عضو ناظر صورت مجلسی تهیه مینماید و مأموریتش خاتمه می یابد- در صورت تولید اختلاف محکمه رسیدگی کرده حکم مقتضی خواهد داد. فقره سوم- در ابطال یا فسخ قرارداد ارفاقی"}, {"number": 492, "text": "در موارد ذیل قرارداد ارفاقی باطل است: در مورد محکومیت تاجر بورشکستگی بتقلّب . 2- در مورد ماده 490."}, {"number": 493, "text": "اگر محکمه حکم بطلان قرارداد ارفاقی را بدهد ضمانت ضامن یا ضامن ها (در صورتی که باشد) بخودی خود ملغی میشود."}, {"number": 494, "text": "اگر تاجر ورشکسته شرایط قرارداد ارفاقی را اجرا نکرد ممکن است برای فسخ قرارداد مزبور بر علیه او اقامه دعو ی نمود."}, {"number": 495, "text": "در صورتیکه اجرای تمام یا قسمتی از قرارداد را یک یا چند نفر ضمانت کرده باشند طلبکارها میتوانند اجرای تمام یا قسمتی از قرارداد را که ضامن دارد از او بخواهند و در مورد اخیر آن قسمت از قرارداد که ضامن نداشته فسخ میشود. در صورت تعدّد ضامن مسئولیت آنها تضامنی است."}, {"number": 496, "text": "اگر تاجر ورشکسته پس از تصدیق قرارداد بعنوان ورشکستگی بتقلب تعقیب شده در تحت توقیف یا حبس در آید محکمه میتواند هر قسم وسایل تأمینیه را که مقتضی بداند اتخاذ کند ولی بمحض صدور قرار منع تعقیب یا حکم تبرئه وسائل مزبوره مرتفع میشود."}, {"number": 497, "text": "پس از صدور حکم ورشکستگی بتقلب یا حکم ابطال یا فسخ قرارداد ارفاقی محکمه یک عضو ناظر و یک مدیر تصفیه معین میکند."}, {"number": 498, "text": "مدیر تصفیه میتواند دارائی تاجر را توقیف و مهر و موم نماید مدیر تصفیه فورا از رو ی صورت دارائی سابق اقدام برسیدگی اسناد و نوشتجات نموده و اگر لزم باشد متممی برای صورت دارائی ترتیب میدهد مدیر تصفیه باید فورا بوسیله اعلان در روزنامه طلبکارهای جدید را اگر باشند دعوت نماید که در ظرف یکماه اسناد مطالبات خود را برای رسیدگی ابراز کنند- در اعلان مزبور مفاد قرار محکمه که بموجب آن مدیر تصفیه معین شده است باید درج شود."}, {"number": 499, "text": "بدون فوت وقت باسنادیکه مطابق ماده قبل ابراز شده رسیدگی میشود- نسبت بمطالباتیکه سابقا تشخ یص یا تصدیق شده است رسیدگی جدید بعمل نمیآید- مطالباتی که تمام یا قسمتی از آنها بعد از تصدیق پرداخته شده است موضوع می شود."}, {"number": 500, "text": "معاملاتی که تاجر ورشکسته پس از صدور حکم راجع بتصدیق قرارداد ارفاقی تا صدور حکم بطلان یا فسخ قرارداد مزبور نموده باطل نمیشود مگر در صورتیکه معلوم شود بقصد اضرار بوده و بضرر طلبکاران هم باشد."}, {"number": 501, "text": "در صورت فسخ یا ابطال قرارداد ارفاقی دارائی تاجر بین طلبکاران ارفاقی و اشخاصیکه بعد از قرارداد ارفاقی طلبکار شدهاند بغرما تقسیم میشود."}, {"number": 502, "text": "اگر طلبکاران ارفاقی بعد از توقف تاجر تا زمان فسخ یا ابطال چیزی گرفتهاند مأخوذ ی آنها از وجهی که به تر تیب غرما به آنها میرسد کسر خواهد شد."}, {"number": 503, "text": "هر گاه تاجر ی ورشکست و امرش منتهی بقرارداد ارفاقی گردید و ثانیا بدون اینکه قرارداد مزبور ابطال یا فسخ شود ورشکست شد مقررات دو ماده قبل در ورشکستگی ثانو ی لزمالجرا است. مبحث سوم- در تفریغ حساب و ختم عمل ور شکستگی"}, {"number": 504, "text": "اگر قرارداد ارفاقی منعقد نشد مدیر تصفیه فورا بعملیات تصفیه و تفریغ عمل ورشکستگی شروع خواهد کرد."}, {"number": 505, "text": "در صورتی که اکثریت مذکور در ماده (480) موافقت نماید محکمه مبلغی را برای اعاشه ورشکسته در حدود مقررات ماده 447 معینخواهد کرد."}, {"number": 506, "text": "اگر شر کت تضامنی- مختلط یا نسبی ورشکست شود طلبکارها میتوانند قرارداد ارفاقی ر ا با شر کت یا منحصرا با یک یا چند نفر ازشر کاء ضامن منعقد نمایند. در صورت ثانی دارائی شر کت تابع مقررات این مبحث و بغرما تقسیم میشود ولی دارائی شخصی شر کائی که با آنها قرارداد ارفاقی منعقد شده است بغرما تقسیم نخواهد شد- شریک یا شر کاء ضامن که با آنها قرارداد خصوصی منعقد شده نمی توانند تعهد حصة نمایند مگر از اموال شخصی خودشان- شریکی که با او قرارداد مخصوص منعقد شده از مسئولیت ضمانتی مبر ی است."}, {"number": 507, "text": "اگر طلبکارها بخواهند تجارت تاجر ورشکسته را ادامه دهند می توانند برای این امر و کیل یا عامل مخصوصی انتخاب نموده یا بخود مدیر تصفیه این مأموریت را بدهند."}, {"number": 508, "text": "در ضمن تصمیمی که و کالت مذکور در ماده فوق را مقرر میدارد باید مدت و حدود و کالت و همچنین میزان وجهی که و کیل میتواند برای مخارج لزمه پیش خود نگاهدارد معین گردد- تصمیم مذکور اتخاذ نمیشود مگر با حضور عضو ناظر و با اکثریت سه ربع از طلبکارها عددا و مبلغا - خود تاجر ورشکسته و همچنین طلبکارهای مخالف (با رعایت ماده 473) می توانند نسبت باین تصمیم در محکمه اعتراض نمایند- این اعتراض اجرای تصمیم را بتأخیر نمیاندازد."}, {"number": 509, "text": "اگر از معاملات و کیل یا عاملیکه تجار ت ورشکسته را ادامه می دهد تعهداتی حاصل شود که بیش از حد دارائی تاجر ورشکسته است فقط طلبکارهائی که آن اجازه را دادهاند شخصا علاوه بر حصة که در دارائی مزبور دارند به نسبت طلبشان در حدود اختیاراتیکه دادهاند مسئول تعهدات مذکوره می باشند."}, {"number": 510, "text": "در صورتی که عمل تاجر ورشکسته منجر بتفریغ حساب شود مدیر تصفیه مکلف است تمام اموال منقول و غیرمنقول تاجر ورشکسته را بفروش رسانیده مطالبات و دیون و حقوق او را صلح و مصالحه و وصول و تفریغ کند تمام این مراتب در تحت نظر عضو ناظر و با حضور تاجر ورشکسته بعمل میآید. اگر تاجر ورشکسته از حضور استنکاف نمود استحضار مدعیالعموم کافی است- فروش اموال مطابق نظامنامه وزارت عدلیه بعمل خواهد آمد."}, {"number": 511, "text": "همینکه تفریغ عمل تاجر به اتمام رسید عضو ناظر طلبکارها و تاجر ورشکسته را دعوت مینماید. در این جلسه مدیر تصفیه حساب خود را خواهد داد."}, {"number": 512, "text": "هر گاه اموالی در اجاره تاجر ورشکسته باشد مدیر تصفیه در فسخ یا ابقاء اجاره بنحو ی که موافق منافع طلبکارها باشد اتخاذ تصمیم میکند- اگر تصمیم بر فسخ اجاره شد صاحبان اموال مستأجره از بابت مالالجارة که تا آن تاریخ مستحق شدهاند جزو غرما منظور میشوند اگر تصمیم بر ابقاء اجاره بوده و تأمیناتی هم سابقا بموجب اجاره نامه بموجر داده شده باشد آن تأمینات ابقاء خواهد شد و ال تأمیناتی که پس از ورشکستگی داده می شود باید کافی باشد- در صورتیکه با تصمیم مدیر تصفیه بر فسخ اجاره موجر راضی بفسخ نشود حق مطالبه تأمین را نخواهد داشت."}, {"number": 513, "text": "مدیر تصفیه میتواند با اجازه عضو ناظر اجاره را برای بقیه مدت بدیگر ی تفویض نماید (مشروط بر اینکه بموجب قرارداد کتبی طرفین این حق منع نشده باشد) و در صورت تفویض بغیر باید وثیقه کافی که تأمین پرداخت مالالجاره را بنماید بمالک اموال مستأجره داده و کلیه شرایط و مقررات اجاره نامه را بموقع خود اجرا کند. فصل هشتم- در اقسام مختلفه طلبکارها و حقوق هر یک از آنها مبحث اول- در طلبکارهائیکه رهینه منقول دارند"}, {"number": 514, "text": "طلبکارهائی که رهینه در دست دارند فقط در صورت غرما برای یادداشت قید میشوند."}, {"number": 515, "text": "مدیر تصفیه میتواند در هر موقع با اجازه عضو ناظر طلب طلبکارها را داده و شیئی مرهون را از رهن خارج و جزو دارائی تاجر ورشکسته منظور دارد."}, {"number": 516, "text": "اگر وثیقه فک نشود مدیر تصفیه باید با نظارت مدعیالعموم آنرا بفروش برساند و مرتهن نیز در آن موقع باید دعوت شود. اگر قیمت فروش وثیقه پس از وضع مخارج بیش از طلب طلبکار باشد مازاد بمدیر تصفیه تسلیم می شود و اگر قیمت فروش کمتر شد مرتهن برای بقیه طلب خود در جزو طلبکارهای عادی در غرما منظور خواهد شد."}, {"number": 517, "text": "مدیر تصفیه صورت طلبکارهائی را که ادعای وثیقه مینمایند بعضو ناظر تقدیم میکند. عضو مزبور در صورت لزوم اجازه میدهد طلب آنها از اولین وجوهی که تهیه میشود پرداخته گردد در صورتیکه نسبت بحق وثیقه طلبکارها اعتراض داشته باشند بمحکمه رجوع میشود. مبحث دوم- در طلبکارهائیکه نسبت باموال غیر منقول حق تقدم دارند"}, {"number": 518, "text": "اگر تقسیم وجوهی که از فروش اموال غیرمنقول حاصل شده قبل از تقسیم دارائی منقول یا در همان حین بعمل آمده باشد طلبکارهائی که نسبت باموال غیرمنقول حقوقی دارند و حاصل فروش اموال مزبور کفایت طلب آنها را ننموده است نسبت ببقیه طلب خود جزو غرماء معمولی منظور و از وجوهی که برای غرماء مزبور مقرر است حصه میبرند مشروط بر اینکه طلب آنها بطوریکه قبلا مذکور شده است تصدیق شده باشد."}, {"number": 519, "text": "اگر قبل از تقسیم وجوهی که از فروش اموال غیرمنقول حاصل شده وجهی از بابت دارائی منقول تقسیم شود طلبکار هائی که نسبت باموال غیرمنقول حقوقی دارند و طلب آنها تصدیق و اعتراف شده است بمیزان کلیه طلب خود جزو سایر غرما وارد و از وجوه مزبوره حصه میبرند ولی عندالقتضاء مبلغ دریافتی در موقع تقسیم حاصل اموال غیرمنقول از طلب آنها موضوع می شود."}, {"number": 520, "text": "در مورد طلبکارهائی که نسبت باموال غیرمنقول حقوقی دارند ولی بواسطه مقدم بودن سایر طلبکارها نمی توانند در حین تقسیم قیمت اموال غیرمنقول طلب خود را تماما وصول کنند ترتیب ذیل مرعی خواهد بود: اگر طلبکارهای مزبور قبل از تقسیم حاصل اموال غیرمنقول از بابت طلب خود وجهی دریافت داشته باشند این مبلغ از حصة که از بابت اموال غیرمنقول بآنها تعلق میگیرد موضوع و بحصة که باید بین طلبکارهای معمولی تقسیم شود اضافه میگردد و بقیه طلبکارهائی که در اموال غیرمنقول ذیحق بودهاند برای بقیه طلب خود بنسبت آن بقیه جزو غرما محسوب شده حصه میبر ند."}, {"number": 521, "text": "اگر بواسطه مقدم بودن طلبکارهای دیگر بعضی از طلبکارهائی که نسبت باموال غیرمنقول حقوق دارند وجهی دریافت نکنند طلب آنها جزو غرما محسوب و بدین سمت هر معاملة که از بابت قرارداد ارفاقی و غیر ه با غرما می شود با آنها نیز بعمل خواهد آمد. فصل نهم- در تقسی م بی ن طلب کارها و فروش اموال منقول"}, {"number": 522, "text": "پس از وضع مخارج اداره امور ورشکستگی و اعانة که ممکن است بتاجر ورشکسته داده شده باشد و وجوهی که باید بصاحبان مطالبات ممتازه تأدیه گردد مجموع دارائی منقول بین طلبکارها بنسبت طلب آنها که قبلا تشخیص و تصدیق شده است خواهد شد."}, {"number": 523, "text": "مدیر تصفیه برای اجرای مقصود مذکور در ماده فوق ماهی یکمرتبه صورت حساب عمل ورشکستگی را با تعیین وجوه موجوده بعضو ناظر میدهد. عضو مذکور در صورت لزوم امر بتقسیم وجوه مزبور بین طلبکارها داده مبلغ آنرا معین و مواظبت مینماید که بتمام طلبکارها اطلاع داده شود."}, {"number": 524, "text": "در موقع تقسیم وجوه بین طلبکارها حصه طلبکارهای مقیم ممالک خارجه بنسبت طلب آنها که در صورت دارائی و قروض منظورشده است موضوع میگردد. چنانچه مطالبات مزبور صحیحا در صورت دارائی و قروض منظور نشده باشد عضو ناظر میتواند حصه موضوعی را زیاد کند. برای مطالباتی که هنوز در باب آنها تصمیم قطعی اتخاذ نشده است باید مبلغی موضوع کرد."}, {"number": 525, "text": "وجوهیکه برای طلبکارهای مقیم خارجه موضوع شده است تا مدتی که قانون برای آنها معین کرده بطور امانت بصندوق عدلیه سپرده خواهد شد- اگر طلبکارهای مذکور مطابق این قانون مطالبات خود را بتصدیق نرسانند مبلغ مزبور بین طلبکارهائی که طلب آنها بتصدیق رسیده تقسیم میگردد. وجوهی که برای مطالبات تصدیق نشده موضوع گردیده در صورت عدم تصدیق آن مطالبات بین طلبکارهائی که طلب آنها تصدیق شده تقسیم می شود."}, {"number": 526, "text": "هیچ طلبی را مدیر تصفیه نمی پردازد مگر آنکه مدار ک و اسناد آنرا قبلا ملاحظه کرده باشد مدیر تصفیه مبلغی را که پرداخته در رو ی سند قید میکند عضو ناظر در صورت عدم امکان ابر از سند میتواند اجازه دهد که بموجب صورت مجلسی که طلب در آن تصدیق شده وجهی پرداخته شود در هر حال باید طلبکارها رسید وجه را در ذیل صورت تقسیم ذکر کنند."}, {"number": 527, "text": "ممکن است هیئت طلبکارها با استحضار تاجر ورشکسته از محکمه تحصیل اجازه نمایند که تمام یا قسمتی از حقوق و مطالبات تاجر ورشکسته را که هنوز وصول نشده بطوریکه صرفه و صلاح تاجر ورشکسته هم منظور شود خودشان قبول و مورد معامله قرار دهند در این صورت مدیر تصفیه اقدامات مقتضیه را بعمل خواهد آورد- در این خصوص هر طلبکار ی میتواند بعضو ناظر مراجعه کرده تقاضا نماید که طلبکارهای دیگر را دعوت نماید تا تصمیم خود را اتخاذ بنمایند. فصل دهم- در دعو ی استرداد"}, {"number": 528, "text": "اگر قبل از ورشکستگی تاجر کسی اوراق تجارتی باو داده باشد که وجه آنرا وصول و بحساب صاحب سند نگاهدارد و یا بمصرف معینی برساند و وجه اوراق مزبور وصول یا تأدیه نگشته و اسناد عینا در حین ورشکستگی در نزد تاجر ورشکسته موجود باشد صاحبان آن میتوانند عین اسناد را استرداد کنند."}, {"number": 529, "text": "مال التجارههائی که در نزد تاجر ورشکسته امانت بوده یا بمشارالیه داده شده است که بحساب صاحب مال التجاره بفروش برساند مادام که عین آنها کلا یا جزء نزد تاجر ورشکسته موجود یا نزد شخص دیگر ی از طرف تاجر مزبور بامانت یا برای فروش گذارده شده و موجود باشد قابل استرداد است."}, {"number": 530, "text": "مال التجارههائی که تاجر ورشکسته بحساب دیگر ی خریدار ی کرده و عین آن موجود است اگر قیمت آن پرداخته نشده باشد از طر ف فروشنده و ال از طرف کسیکه بحساب او آن مال خریدار ی شده قابل استرداد است."}, {"number": 531, "text": "هر گاه تمام یا قسمتی از مال التجارة که بر ای فروش بتاجر ورشکسته داده شده بود معامله شده و بهیچ نحو ی بین خریدار و تاجر ورشکسته احتساب نشده باشد از طرف صاحب مال قابل استرداد است اعم از اینکه نزد تاجر ورشکسته یا خریدار باشد و بطور کلی عین هر مال متعلق بدیگر ی که در نزد تاجر ورشکسته موجود باشد قابل استرداد است."}, {"number": 532, "text": "اگر مال التجارة که برای تاجر ورشکسته حمل شده قبل از وصول از رو ی صورت حساب یا بارنامة که دارای امضاء ارسال کننده است بفروش رسیده و فروش صور ی نباشد دعو ی استرداد پذیرفته نمیشود و ال موافق ماده 529 قابل استرداد است و استرداد کننده باید وجوهی را که بطور علیالحساب گرفته یا مساعدتا از بابت کرایه حمل و حق کمیسیون و بیمه و غیره تأدیه شده یا از این بابتها باید تأدیه بشود بطلبکارها بپردازند."}, {"number": 533, "text": "هر گاه کسی مال التجارة بتاجر ورشکسته فروخته ولیکن هنوز آن جنس نه بخود تاجر ورشکسته تسلیم شده و نه بکس دیگر که بحساب او بیاورد آن کس میتواند باندازة که وجه آنرا نگرفته از تسلیم مال التجاره امتناع کند."}, {"number": 534, "text": "در مورد دو ماده قبل مدیر تصفیه میتواند با اجازه عضو ناظر تسلیم مال التجاره را تقاضا نماید ولی باید قیمتی را که بین فروشنده و تاجر ورشکسته مقرر شده است بپردازد."}, {"number": 535, "text": "مدیر تصفیه میتواند با تصویب عضو ناظر تقاضای استرداد را قبول نماید و در صورت اختلاف محکمه پس از استماع عقیده عضو ناظرحکم مقتضی را میدهد. فصل یازدهم- در طرق شکایت از احکام صادره راجع بورشکستگی"}, {"number": 536, "text": "حکم اعلان ورشکستگی و همچنین حکمی که بموجب آن تاریخ توقف تاجر در زمانی قبل از اعلان ورشکستگی تشخیص شود قابل اعتراض است."}, {"number": 537, "text": "اعتراض باید از طرف تاجر ورشکسته در ظرف ده روز و از طرف اشخاص ذینفع که در ایران مقیمند در ظرف یکماه و از طرف آنهائی که در خارجه اقامت دارند در ظرف دو ماه بعمل آید ابتدای مدتهای مزبور از تاریخی است که احکام مذکوره اعلان میشود. رأی وحدت رویۀ شمار ۀ ۹۸۷–3/4/1399 هیأت عمومی دیوان عالی کشور با توجه به اینکه به لحاظ وضعیت خاص ورشکستگی و احکام راجع به آن و لزوم تسریع در انجام عملیات تصفیه، مقررات خاصی در قانون تجارت وضع شده و از جمله فصل مخصوصی به طرق شکایت از احکام صادره راجع به ورشکستگی تحت همین عنوان اختصاص داده شده و آگه ی کردن حکم ورشکستگی الزامی شده و در ماده ۷۳۵ همین قانون مبدأ اعتراض اشخاص ذینفع به نحو مطلق، تاریخ اعلان (آگه ی) احکام راجع به ورشکستگی دانسته شده است و قرینه کافی بر نسخ مقررات خاص مذکور به موجب مقررات عام قانون مؤخرالتصویب آیین دادرسی دادگاههای عمومی و انقلاب در امور مدنی وجود ندارد و با عنایت به اصل عدم نسخ، اعتراض کلیه اشخاص ذینفع به احکام ورشکستگی، خارج از مهلتهای مذکور در ماده ۷۳۵ قانون یادشده در دادگاه صادرکننده حکم قابلیت استماع ندارد. بنا به مراتب، رأی شمار ۀ ۴۸۲ مورخ ۷۹۳۱/۲۱/۷۲ شعبه دهم دادگاه تجدیدنظر استان اصفهان که با این نظر انطباق دارد به اکثریت قاطع آراء هیأت عمومی صحیح و مطابق قانون تشخیص میگردد. این رأی طبق ماده ۱۷۴ قانون آیین دادرسی کیفر ی مصوب ۲۹۳۱ با اصلاحات بعد ی، در موارد مشابه برای شعب دیوان، دادگاهها و سایر مراجع اعم از قضایی و غیر آن لزمالتباع است. هیأت عمومی دیوان عالی کشور"}, {"number": 538, "text": "پس از انقضای مهلتی که برای تشخیص و تصدیق مطالبات طلبکارها معین شده است دیگر هیچ تقاضائی از طرف طلبکارها راجع بتعیین تاریخ توقف بغیر آن تاریخی که بموجب حکم ورشکستگی یا حکم دیگر ی که در این باب صادر شده قبول نخواهد شد- همینکه مهلتهای مزبور منقضی شد تاریخ توقف نسبت به طلبکارها قطعی و غیرقابل تغییر خواهد بود."}, {"number": 539, "text": "مهلت استیناف از حکم ورشکستگی ده روز از تاریخ ابلاغ است- باین مدت برای کسانی که محل اقامت آنها از مقر محکمه بیش ازشش فرسخ فاصله دارد از قرار هر شش فرسخ یکروز اضافه میشود."}, {"number": 540, "text": "قرارهای ذیل قابل اعتراض و استیناف و تمیز نیست: 1) قرارهای راجعه به تعیین یا تغییر عضو ناظر یا مدیر تصفیه. 2) قرارهای راجعه به تقاضای اعانه بجهت تاجر ور شکسته یا خانواده او. 3) قرارهای فروش اسباب یا مال التجارة که متعلق بورشکسته است. 4) قرارهائی که قرارداد ارفاقی ر ا موقتا موقوف یا قبول موقتی مطالبات متنازع فیه را مقرر میدارد. 5) قرارهای صادره در خصوص شکایت از اوامر ی که عضو ناظر در حدود صلاحیت خود صادر کر ده است. باب دوازدهم- در ورشکستگی بتقصیر و ورشکستگی بتقلب فصل اول- در ورشکستگی بتقصی ر"}, {"number": 541, "text": "تاجر در موارد ذیل ورشکسته بتقصیر اعلان میشود: 1) در صورتیکه محقق شود مخارج شخصی یا مخارج خانه مشارالیه در ایام عادی بالنسبه به عاید ی او فوقالعاده بوده است. 2) در صورتیکه محقق شود که تاجر نسبت بسرمایه خود مبالغ عمده صرف معاملاتی کرده که در عرف تجارت موهوم یا نفع آن منوط به اتفاق محض است. 3) اگر بقصد تأخیر انداختن ورشکستگی خود خرید ی بالتر یا فروشی نازلتر از مظنه روز کرده باشد یا اگر بهمان قصد وسایلی که دور از صرفه است بکار برده تا تحصیل وجهی نماید اعم از اینکه از راه استقراض یا صدور برات یا بطریق دیگر باشد. 4) اگر یکی از طلبکارها را پس از تاریخ توقف بر سایرین ترجیح داده و طلب او را پرداخته باشد."}, {"number": 542, "text": "در موارد ذیل هر تاجر ورشکسته ممکن است ورشکسته به تقصیر اعلان شود: 1) اگر بحساب دیگر ی و بدون آنکه در مقابل عوضی دریافت نماید تعهداتی کرده باشد که نظر بوضعیت مالی او در حین انجام آنها آن تعهدات فوقالعاده باشد. 2) اگر عملیات تجارتی او متوقف شده و مطابق ماده 413 این قانون رفتار نکرده باشد. 3) اگر از تاریخ اجرای قانون تجارت مصوب 25 دلو 1303 و 12 فروردین و 12 خرداد 1304 دفتر نداشته یا دفاتر او ناقص یا بی ترتیب بوده یا در صورت دارائی وضعیت حقیقی خود را اعم از قروض و مطالبات بطور صحیح معین نکرده باشد (مشروط بر اینکه در این موارد مرتکب تقلبی نشده باشد.)"}, {"number": 543, "text": "ورشکستگی به تقصیر جنحه محسوب و مجازات آن از 6 ماه تا سه سال حبس تأدیبی است."}, {"number": 544, "text": "رسیدگی بجرم فوق بر حسب تقاضای مدیر تصفیه یا هر یک از طلبکارها یا تعقیب مدعیالعموم در محکمه جنحه بعمل میآید."}, {"number": 545, "text": "در صورتیکه تعقیب تاجر ورشکسته بتقصیر از طرف مدعیالعموم بعمل آمده باشد مخارج آنرا بهیچوجه نمیتوان بهیئت طلبکارها تحمیل نمود- در صورت انعقاد قرارداد ارفاقی مأمورین اجرا نمیتوانند اقدام بوصول این مخارج کنند مگر پس از انقضای مدتهای معینه در قرارداد."}, {"number": 546, "text": "مخارج تعقیبی که از طرف مدیر تصفیه بنام طلبکارها میشود در صورت برائت تاجر بعهدة هیئت طلبکارها و در صورتیکه محکوم شد بعهده دولت است لیکن دو لت حق دارد مطابق ماده قبل به تاجر ورشکسته مراجعه نماید."}, {"number": 547, "text": "مدیر تصفیه نمیتواند تاجر ورشکسته را بعنوان ورشکستگی بتقصیر تعقیب کند یا از طرف هی ئت طلبکارها مدعی خصوصی واقع شود مگر پس از تصویب اکثریت طلبکارهای حاضر."}, {"number": 548, "text": "مخارج تعقیبی که از طرف یکی از طلبکارها بعمل میآید در صورت محکومیت تاجر ورشکسته بعهده دولت و در صورت برائت ذمه بعهده تعقیب کننده است. فصل دوم - در ورشکستگی به تقلب"}, {"number": 549, "text": "هر تاجر ورشکسته که دفاتر خود را مفقود نموده یا قسمتی از دارائی خود را مخفی کرده و یا بطریق مواضعه و معاملات صور ی از میان برده و همچنین هر تاجر ورشکسته که خود را بوسیله اسناد و یا بوسیله صورت دارائی و قروض بطور تقلب بمیزانی که در حقیقت مدیون نمیباشد مدیون قلمداد نموده است ورشکسته به تقلب اعلام و مطابق قانون جزا مجازات میشود."}, {"number": 550, "text": "راجع بتقاضای تعقیب و مخارج آن در موارد ماده قبل مفاد مواد 545 تا 548 لزمالرعایه است. فصل سوم - در جنحه و جنایاتی که اشخاص غی ر از تاجر ورشکسته در امر ورشکستگی مرتکب می شوند"}, {"number": 551, "text": "در مورد ورشکستگی اشخاص ذیل مجرم محسوب و مطابق قانون جزا بمجازات ورشکسته بتقلب محکوم خو اهند شد: 1) اشخاصیکه عالما بنفع تاجر ورشکسته تمام یا قسمتی از دارائی منقول یا غیرمنقول او را از میان ببرند یا پیش خود نگاهدارند یا مخفی نمایند. 2) اشخاصیکه بقصد تقلب باسم خود یا به اسم دیگر ی طلب غیرمواقعی را قلمداد کرده و مطابق ماده 467 التزام داده باشند."}, {"number": 552, "text": "اشخاصیکه باسم دیگر ی یا به اسم موهومی تجارت نموده و اعمال مندرجه در ماده 549 را مرتکب شدهاند بمجازاتیکه بر ای ورشکسته بتقلب مقرر است محکوم میباشند."}, {"number": 553, "text": "اگر اقوام شخص ورشکسته بدون شر کت مشارالیه اموال او را از میان ببرند یا مخفی نمایند یا پیش خود نگاهدارند بمجازاتی که برای سرقت معین است محکوم خواهند شد."}, {"number": 554, "text": "در موارد معینه در مواد قبل محکمة که ر سیدگی میکند باید در خصوص مسائل ذیل ولو اینکه متهم تبرئه شده باشد- حکم بدهد: 1) راجع برد کلیه اموال و حقوقیکه موضوع جرم بوده است بهیئت طلبکارها- این حکم را محکمه در صورتیکه مدعی خصوصی هم نباشد باید صادر کند. 2) راجع بضرر و خساراتی که ادعا شده است."}, {"number": 555, "text": "اگر مدیر تصفیه در حین تصد ی بامور تاجر ورشکسته وجهی را حیف و میل کرده باشد به مجازات خیانت در امانت محکوم خواهد شد."}, {"number": 556, "text": "هر گاه مدیر تصفیه اعم از اینکه طلبکار باشد یا نباشد در مذاکرات راجعه بورشکستگی با شخص ورشکسته یا با دیگر ی تبانی نماید یا قرارداد خصوصی منعقد کند که آن تبانی یا قرارداد بنفع مرتکب و به ضرر طلبکارها یا بعضی از آنها باشد در محکمه جنحه بحبس تأدیبی از شش ماه تا دو سال محکوم می شود."}, {"number": 557, "text": "کلیه قراردادهائی که پس از تاریخ توقف تاجر منعقد شده باشد نسبت بهر کس حتی خود تاجر ورشکسته محکوم به بطلان است- طرف قرارداد مجبور است که وجوه یا اموالی را که بموجب قرارداد باطل شده دریافت کرده است باشخاص ذیحق مسترد دار د."}, {"number": 558, "text": "هر حکم محکومیتی که بموجب این فصل یا بموجب فصول سابق صادر بشود باید بخرج محکومعلیه اعلان گردد. فصل چهارم- در اداره کردن اموال تاجر ورشکسته در صورت ورشکستگی بتقصیر یا بتقلب"}, {"number": 559, "text": "در تمام مواردی که کسی بواسطه ورشکستگی به تقصیر یا به تقلب تعقیب و محکوم می شود رسید گی به کلیه دعاو ی حقوقی بغیراز آنچه در ماده 554 مذکور است از صلاحیت محکمه جزا خارج خواهد بود."}, {"number": 560, "text": "مدیر تصفیه مکلف است در صورت تقاضای مدعیالعموم بدایت کلیه اسناد و نوشتجات و اوراق و اطلاعات لزمه را باو بدهد. باب سیزدهم- در اعاده اعتبار"}, {"number": 561, "text": "هر تاجر ورشکسته که کلیه دیون خود را با متفرعات و مخارجی که به آن تعلق گرفته است کاملا بپردازد حقا اعاده اعتبار مینماید."}, {"number": 562, "text": "طلبکارها نمی توانند از جهت تأخیر ی که در اداء طلب آنها شده است برای بیش از پنجسال مطالبه متفر عات و خسارت نمایند و در هر حال متفرعاتی که مطالبه میشود در سال نباید بیش از صد ی هفت طلب باشد."}, {"number": 563, "text": "برای آنکه شریک ضامن یک شر کت ورشکسته که حکم ورشکستگی او نیز صادر شده بتواند حق اعاده اعتبار حاصل کند باید ثابت نماید که به ترتیب فوق تمام دیون شر کت ر ا پرداخته است ولو اینکه نسبت بشخص او قرارداد ارفاقی مخصوصی وجود داشته باشد."}, {"number": 564, "text": "در صورتی که یک یا چند نفر از طلبکارها مفقودالثر یا غائب بوده یا اینکه از دریافت وجه امتناع نمایند تاجر ورشکسته باید وجوهی راکه به آنها مدیون است با اطلاع مدعیالعموم در صندوق عدلیه بسپارد و همینکه تاجر معلوم کرد این وجوه را سپرده است بر یالذمه محسوب است."}, {"number": 565, "text": "تجار ورشکسته در دو مورد ذیل پس از اثبات صحت عمل در مدت پنجسال از تاریخ اعلان ورشکستگ ی میتوانند اعتبار خود را اعاده نمایند: 1) تاجر ورشکستة که تحصیل قرارداد ارفاقی نموده و تمام وجوهی را که بموجب قرارداد بعهده گرفته است پرداخته باشد. این ترتیب در مورد شریک شر کت ورشکستة که شخصا تحصیل قرارداد ارفاقی جداگانه نموده است نیز رعایت میشود. 2) تاجر ورشکستة که کلیه طلبکاران ذمه او را بر ی کرده یا به اعاده اعتبار او رضایت دادهاند."}, {"number": 566, "text": "عرضحال اعاده اعتبار باید بانضمام اسناد مثبته آن بمدعیالعموم حوزه ابتدائی داده شود که اعلان ورشکستگی در آن حوزه واقع شده است."}, {"number": 567, "text": "سواد این عرضحال در مدت یکماه در اتاق جلسه محکمه ابتدائی و همچنین در اداره مدعیالعموم بدایت الصاق و اعلان میشود بعلاوه دفتردار محکمه باید مفاد عرضحال مزبور را بکلیه طلبکارهائی که مطالبات آنها در حین تصفیه عمل تاجر و رشکسته یا بعد از آن تصدیق شده وهنوز طلب خود را بر طبق مواد 561 و 562 کاملا دریافت نکردهاند بوسیله مکتوب سفارشی اعلام دارد."}, {"number": 568, "text": "هر طلبکار ی که مطابق مقررات مواد 561 و 562 طلب خود را کاملا دریافت نکرده میتواند در مدت یکماه از تاریخ اعلام مذکور در ماده قبل بعرضحال اعاده اعتبار اعتراض کند."}, {"number": 569, "text": "اعتراض بوسیله اظهارنامه که بضمیمه اسناد مثبته بدفتر محکمه بدایت داده میشود بعمل میآید- طلبکار معترض می تواند بموجب عرضحال در حین رسیدگی بدعو ی اعاده اعتبار بطور شخص ثالث ورود کند."}, {"number": 570, "text": "پس از انقضای موعد نتیجه تحقیقاتی که بتوسط مدعیالعموم بعمل آمده است بانضمام عرایض اعتراض برئیس محکمه داده میشود رئیس مزبور در صورت لزوم مدعی و معترضین را بجلسه خصوصی محکمه احضار میکند."}, {"number": 571, "text": "در مورد ماده 561 محکمه فقط صحت مدار ک را سنجیده در صورت موافقت آنها با قانون حکم اعاده اعتبار میدهد و در مورد ماده 565 محکمه اوضاع و احوال را سنجیده بطوریکه مقتضی عدل و انصاف بداند حکم میدهد و در هر دو صورت حکم باید در جلسه علنی صادر گردد."}, {"number": 572, "text": "مدعی اعاده اعتبار و همچنین مدعی عمومی و طلبکارهای معترض میتوانند در ظرف ده روز از تاریخ اعلام حکم بوسیله مکتوب سفارشی از حکمی که در خصوص اعاده اعتبار صادر شده استیناف بخواهند- محکمه استیناف پس از رسیدگی بر حسب مقررات ماده 571 حکم صادر میکند."}, {"number": 573, "text": "اگر عرضحال اعاده اعتبار رد بشود تجدید ممکن نیست مگر پس از انقضای شش ماه."}, {"number": 574, "text": "اگر عرضحال قبول شود حکمی که صادر میگردد در دفتر مخصوصی که در محکمه بدایت محل اقامت تاجر برای اینکار مقرر است ثبت خواهد شد. اگر محل اقامت تاجر در حوزه محکمة که حکم میدهد نباشد در ستون ملاحظات دفتر ثبت اسامی ورشکستگان که در دائره ثبت اسناد محل موجود است مقابل اسم تاجر ورشکسته با مر کب قرمز بحکم مزبور اشاره میشود."}, {"number": 575, "text": "ورشکستگان بتقلب و همچنین اشخاص یکه برای سرقت یا کلاه بردار ی یا خیانت در امانت محکوم شدهاند مادامی که از جنبه جزائی اعاده حیثیت نکردهاند نمی توانند از جنبه تجارتی اعاده اعتبار کنند. باب چهاردهم- اسم تجارتی"}, {"number": 576, "text": "ثبت اسم تجارتی اختیار ی است مگر در مواردیکه وزارتعدلیه ثبت آنرا الزامی کند."}, {"number": 577, "text": "صاحب تجارتخانة که شریک در تجارتخانه ندارد نمیتواند اسمی برای تجارتخانه خود انتخاب کند که موهم وجود شریک باشد."}, {"number": 578, "text": "اسم تجارتی ثبت شده را هیچ شخص دیگر ی در همان محل نمیتواند اسم تجارتی خود قرار دهد ولو اینکه اسم تجار تی ثبت شده بااسم خانوادگی او یکی باشد."}, {"number": 579, "text": "اسم تجارتی قابل انتقال است."}, {"number": 580, "text": "مدت اعتبار ثبت اسم تجارتی پنجسال است."}, {"number": 581, "text": "در مواردیکه ثبت اسم تجارتی الزامی شده در موعد مقرر ثبت بعمل نیاید اداره ثبت اقدام بثبت کرده و سه برابر حقالثبت مأخوذ خواهد داشت."}, {"number": 582, "text": "وزارتعدلیه بموجب نظامنامه ترتیب ثبت اسم تجارتی و اعلان آن و اصول محاکمات در دعاو ی مربوطه باسم تجارتی را معینخواهد کرد. باب پانزدهم- شخصیت حقوقی فصل اول- اشخاص حقوقی"}, {"number": 583, "text": "کلیه شر کتهای تجارتی مذکور در این قانون شخصیت حقوقی دارند."}, {"number": 584, "text": "تشکیلات و مؤسساتیکه برای مقاصد غیر تجارتی تأسیس شده یا بشوند از تاریخ ثبت در دفتر ثبت مخصوصی که وزارت عدلیه معین خواهد کرد شخصیت حقوقی پیدا میکنند."}, {"number": 585, "text": "شرایط ثبت مؤسسات و تشکیلات مذکور در ماده فوق بموجب نظامنامه وزارتعدلیه معین خواهد شد. حقالثبت مؤسسات و تشکیلات مطابق نظامنامه از پنج ریال طلا تا پنج پهلو ی و بعلاوه مشمول ماده 135 قانون ثبت اسناد و املاک است."}, {"number": 586, "text": "مؤسسات و تشکیلاتی را که مقاصد آنها مخالف با انتظامات عمومی یا نامشروع است نمیتوان ثبت کرد."}, {"number": 587, "text": "مؤسسات و تشکیلات دولتی و بلد ی بمحض ایجاد و بدون احتیاج بثبت دارای شخصیت حقوقی میشوند. فصل دوم - حقوق و وظائف و اقامتگاه و تابعی ت شخص حقوقی"}, {"number": 588, "text": "شخص حقوقی میتو اند دارای کلیه حقوق و تکالیفی شود که قانون برای افراد قائل است مگر حقوق و وظائفی که بالطبیعه فقط انسان ممکن است دارای آن باشد مانند حقوق و وظایف ابّوت - نبوت و امثال ذالک."}, {"number": 589, "text": "تصمیمات شخص حقوقی بوسیله مقاماتیکه بموجب قانون یا اساسنامه صلاحیت اتخاذ تصمیم دارند گرفته میشود."}, {"number": 590, "text": "اقامتگاه شخص حقوقی محلی است که اداره شخص حقوقی در آنجا است."}, {"number": 591, "text": "اشخاص حقوقی تابعیت مملکتی را دارند که اقامتگاه آنها در آن مملکت است. باب شانزدهم- مقررات نهائی"}, {"number": 592, "text": "در مورد معاملاتی که سابقا تجار یا شر کتها و مؤسسات تجارتی باعتبار بیش از یک امضاء کردهاند خواه بعضی از امضاءکنند گان بعنوان ضامن امضاء کرده باشند خواه بعنوان دیگر طلبکار میتواند بامضاءکنندگان مجتمعا یا منفردا رجوع نماید."}, {"number": 593, "text": "در مورد ماده فوق مطالبه از هر یک از اشخاصی که طلبکار حق رجوع بآنها دارد قاطع مرور زمان نسبت بدیگران نیز هست."}, {"number": 594, "text": "باستثنای شر کت های سهامی و شر کتهای مختلط سهامی بکلیه شر کتهای ایرانی موجود که بامور تجارتی اشتغال دارند تا اول تیر ماه1311 مهلت داده میشود که خود ر ا با مقررات یکی از شر کتهای مذکور در اینقانون وفق داده و تقاضای ثبت نمایند و ال نسبت بشر کت متخلف مطابق ماده دوم قانون ثبت شر کتها مصوب خرداد ماه 1310 رفتار خواهد شد."}, {"number": 595, "text": "هر گاه مدت مذکور در ماده فوق برای تهیه مقدمات ثبت کافی نباشد ممکن است تا ششماه دیگر از طرف محکمه صلاحیتدار مهلتاضافی داده شود مشروط بر اینکه در موقع تقاضای تمدید نصف حقالثبت شر کت پرداخته شود."}, {"number": 596, "text": "تاریخ اجرای ماده 15 این قانون در آن قسمتی که مربوط بجزای نقد ی است و تاریخ اجرای ماده 201 و تبصره آن و قسمت اخیر ماده220 اول فروردین 1312 خواهد بود."}, {"number": 597, "text": "شرکت های مختلط سهامی موجود مکلف هستند که در ظرف 6 ماه از تاریخ اجرای این قانون هیئت نظار ی مطابق مقر ر ات این قانون تشکیل دهند و ال هر صاحب سهمی حق دارد انحلال شر کت را تقاضا کند."}, {"number": 598, "text": "طلبکاران تاجر متوقفی که قبل از تاریخ اجرای این قانون طلب خود را مطالبه کردهاند مشمول مقررات ماده 473 نبوده و از حقی که بموجب قانون سابق برای آنها مقرر بوده استفاده خواهند کرد."}, {"number": 599, "text": "نسبت بطلبکارانی که در امور ورشکستگیهای سابق قبل از تاریخ اجرای این قانون طلب خود را مطالبه نکردهاند مدیر تصفیه هرورشکسته اعلانی منتشر کرده و یکماه بآنها مهلت خواهد داد که مطابق ماده 462 اینقانون رفتار کنند و ال مشمول مقررات ماده 473 خواهند شد."}, {"number": 600, "text": "قوانین ذیل: قانون تجارت مصوب 25 دلو 1303 و دوازدهم فروردین و دوازدهم خرداد 1304- قانون اصلاح ماده 206 قانون تجارت راجع باعتراض عدم تأدیه مصوب 2 تیر ماه 1307- قانون اجازه عدم رعایت ماده 270 و قسمتی از ماده 44 قانون تجارت نسبت بتشکیلات و اساسنامه شر کت سهامی بانک ملی و شر کت سهامی بانک پهلو ی مصوب 30 تیر ماه 1307 از تاریخ اول خرداد ماه 1311 نسخ و این قانون از تاریخ مزبور بموقع اجرا گذاشته میشود. چون بموجب قانون 30 فروردین 1310 «وزیر عدلیه مجاز است لوایح قانونی را که بمجلس شورای ملی پیشنهاد مینماید پس از تصویب کمیسیون قوانین عدلیه بموقع اجرا گذارده و پس از آزمایش آنها در عمل نواقصی را که در ضمن جریان ممکن است معلوم شود رفع و قوانین مزبوره را تکمیل نموده ثانیا برای تصویب بمجلس شورای ملی پیشنهاد نماید علیهذا (قانون تجارت) مشتمل بر ششصد ماده که در تاریخ سیزدهم اردیبهشت ماه یکهزار و سیصد و یازده شمسی بتصویب کمیسیون قوانین عدلیه مجلس شورای ملی رسیده است قابل اجراست. رئیس مجلس شورای ملی- دادگر"}], "eslahie": [{"number": 1, "text": "شرکت سهامی شر کتی است که سرمایه آن بسهام تقسیم شده و مسئولیت صاحبان سهام محدود بمبلغ اسمی سهام آنها است."}, {"number": 2, "text": "شرکت سهامی شر کت بازرگان ی محسوب میشود ولو اینکه موضوع عملیات آن امور بازرگان ی نباشد."}, {"number": 3, "text": "در شر کت سهامی تعداد شر کاء نباید از سه نفر کمتر باشد."}, {"number": 4, "text": "شرکت سهامی بدو نوع تقسیم میشود: نوع اول- شر کتهائی که مؤسسین آنها قسمتی از سرمایه شر کت را از طریق فروش سهام بمردم تأمین میکنند. اینگونه شر کتها شر کت سهامی عام نامیده میشوند. نوع دوم- شر کتهائی که تمام سرمایه آنها در موقع تأسیس منحصرا توسط مؤسسین تأمین گردیده است. اینگونه شر کتها شر کت سهامی خاص نامیده میشوند. تبصره - در شر کتهای سهامی عام عبارت شر کت سهامی عام و در شر کتهای سهامی خاص عبارت شر کت سهامی خاص باید قبل از نامشر کت یا بعد از آن بدون فاصله با نام شر کت در کلیه اوراق و اطلاعیهها و آگهیهایهای] شرکت بطور روشن و خوانا قید شود."}, {"number": 5, "text": "در موقع تأسیس سرمایه شر کتهای سهامی عام از پنج میلیون ریال و سرمایه شر کتهای سهامی خاص از یک میلیون ریال نباید کمترباشد. در صورتیکه سرمایه شر کت بعد از تأسیس بهر علت از حداقل مذکور در این ماده کمتر شود باید ظرف یکسال نسبت بافزایش سرمایه تا میزانحداقل مقرر اقدام بعمل آید یا شر کت بنوع دیگر ی از انواع شر کتهای مذکور در قانون تجارت تغییر شکل یابد وگرنه هر ذینفع میتواند انحلال آنرا از دادگاه صلاحیتدار درخواست کند. هرگاه قبل از صدور رأی قطعی موجب درخواست انحلال منتفی گردد دادگاه رسیدگی را موقوف خواهد نمود."}, {"number": 6, "text": "برای تأسیس شر کتهای سهامی عام مؤسسین باید اقلا بیست در صد سرمایه شر کت را خود تعهد کرده و لاقل سی و پنج درصد مبلغ تعهد شده را در حسابی بنام شر کت در شرف تأسیس نزد یکی از بانکها سپرده سپس اظهارنامهای به ضمیمه طرح اساسنامه شر کت و طرح اعلامیه پذیرهنویسی سهام که به امضاء کلیه مؤسسین رسیده باشد در تهران باداره ثبت شر کتها و در شهرستانها بدایره ثبت شر کتها و در نقاطی که دایرهثبت شر کتها وجود ندارد به اداره ثبت اسناد و املاک محل تسلیم و رسید دریافت کنند تبصره - هرگاه قسمتی از تعهد مؤسسین بصورت غیر نقد باشد باید عین آن یا مدار ک مالکیت آنرا در همان بانکی که برای پرداخت مبلغ نقد یحساب باز شده است تودیع و گواهی بانک را به ضمیمه اظهارنامه و ضمائم آن بمرجع ثبت شر کتها تسلیم نمایند."}, {"number": 7, "text": "اظهارنامه مذکور در ماده 6 باید با قید تاریخ به امضاء کلیه مؤسسین رسیده و موضوعات زیر مخصوصا در آن ذکر شده باشد: 1- نام شر کت 2- هویت کامل و اقامتگاه مؤسسین 3- موضوع شر کت 4- مبلغ سرمایه شر کت و تعیین مقدار نقد و غیر نقد آن بتفکیک 5- تعداد سهام با نام و بینام و مبلغ اسمی آنها و در صورتی که سهام ممتاز نیز مورد نظر باشد تعیین تعداد و خصوصیات و امتیازات اینگونه سهام 6- میزان تعهد هر یک از مؤسسین و مبلغی که پرداخت کردهاند با تعیین شماره حساب و نام بانکی که وجوه پرداختی در آن واریز شده است. درمورد آورده غیر نقد تعیین اوصاف و مشخصات و ارزش آن بنحو ی که بتوان از کم و کیف آورده غیر نقد اطلاع حاصل نمود. 7- مرکز اصلی شر کت. 8- مدت شر کت."}, {"number": 8, "text": "طرح اساسنامه باید با قید تاریخ به امضاء مؤسسین رسیده و مشتمل بر مطالب زیر باشد: 1- نام شر کت 2- موضوع شر کت بطور صریح و منجز 3- مدت شر کت 4- مرکز اصلی شر کت و محل شعب آن اگر تأسیس شعبه مورد نظر باشد. 5- مبلغ سرمایه شر کت و تعیین مقدار نقد و غیر نقد آن به تفکیک. 6- تعداد سهام بینام و بانام و مبلغ اسمی آنها و در صورتی که ایجاد سهام ممتاز مورد نظر باشد تعیین تعداد و خصوصیات و امتیازات اینگونه سهام. 7- تعیین مبلغ پرداخت شده هر سهم و نحوه مطالبه بقیه مبلغ اسمی هر سهم و مدتی که ظرف آن باید مطالبه شود که بهر حال از پنج سالمتجاوز نخواهد بود. 8- نحوه انتقال سهام بانام. 9- طریقه تبدیل سهام بانام به سهام بینام و بالعکس. 10- در صورت پیشبینی امکان صدور اوراق قرضه، ذکر شرایط و ترتتب [یب آن. 11- شرایط و ترتیب افزایش و کاهش سرمایه شر کت. 12- مواقع و ترتیب دعوت مجامع عمومی. 13- مقررات راجع بحد نصاب لزم جهت تشکیل مجامع عمومی و ترتیب اداره آنها. 14- طریقه شور و اخذ رأی و اکثریت لزم برای معتبربودن تصمیمات مجامع عمومی. 15- تعداد مدیران و طرز انتخاب و مدت مأموریت آنها و نحوه تعیین جانشین بر ای مدیرانی که فوت یا استعفا میکنند یا محجور یا معزول یا بجهات قانونی ممنوع میگردند. 16- تعیین وظایف و حدود اختیارات مدیران. 17- تعداد سهام تضمینی که مدیران باید بصندوق شر کت بسپارند. 18- قید اینکه شر کت یک بازرس خواهد داشت یا بیشتر و نحوه انتخاب و مدت مأموریت بازرس. 19- تعیین آغاز و پایان سال مالی شر کت و موعد تنظیم ترازنامه و حساب سود و زیان و تسلیم آن به بازرسان و به مجمع عمومی سالنه. 20- نحوه انحلال اختیار ی شر کت و ترتیب تصفیه امور آن. 21- نحوه تغییر اساسنامه."}, {"number": 9, "text": "طرح اعلامیه پذیرهنویسی مذکور در ماده 6 باید مشتمل بر نکات زیر باشد: 1- نام شر کت 2- موضوع شر کت و نوع فعالیتهائی که شر کت بمنظور آن تشکیل میشود. 3- مرکز اصلی شر کت و شعب آن در صورتی که تأسیس شعبه مورد نظر باشد. 4- مدت شر کت. 5- هویت کامل و اقامتگاه و شغل مؤسسین ، در صورتی که تمام یا بعضی از مؤسسین در امور مربوط بموضوع شر کت یا امور مشابه با آن سوابق یا اطلاعات یا تجاربی داشته باشند ذکر آن به اختصار. 6- مبلغ سرمایه شر کت و تعیین مقدار نقد و غیر نقد آن به تفکیک و تعداد و نوع سهام در مورد سرمایه غیر نقد شر کت تعیین مقدار و مشخصات و اوصاف و ارزش آن بنحو ی که بتوان از کم و کیف سرمایه غیر نقد اطلاع حاصل نمود. 7- در صورتی که مؤسسین مزایائی برای خود در نظر گرفتهاند تعیین چگونگی و موجبات آن مزایا به تفصیل. 8- تعیین مقدار ی از سرمایه که مؤسسین تعهد کرده و مبلغی که پرداخت کردهاند. 9- ذکر هزینههائی که مؤسسین تا آنموقع جهت تدار ک مقدمات تشکیل شر کت و مطالعاتی که انجام گرفته است پرداخت کردهاند و برآوردهزینههای لزم تا شروع فعالیتهای شر کت. 10- در صورتی که انجام موضوع شر کت قانونا مستلزم موافقت مراجع خاصی باشد ذکر مشخصات اجازهنامه یا موافقت اصولی آنمراجع. 11- ذکر حداقل تعداد سهامی که هنگام پذیرهنویسی باید توسط پذیرهنویس تعهد شود و تعیین مبلغی از آن که باید مقارن پذیرهنویسی نقدا پرداخت گردد. 12- ذکر شماره و مشخصات حساب بانکی که مبلغ نقد ی سهام مورد تعهد باید به آنحساب پرداخت شود و تعیین مهلتی که طی آن اشخاصذیعلاقه میتوانند بر ای پذیرهنویسی و پرداخت مبلغ نقد ی ببانک مراجعه کنند. 13- تصریح باینکه اظهارنامه مؤسسین بانضمام طرح اساسنامه برای مر اجعه علاقمندان بمرجع ثبت شر کتها تسلیم شده است. 14- ذکر نام روزنامه کثیرالنتشار ی که هر گونه دعوت و اطلاعیه بعد ی تا تشکیل مجمع عمومی مؤسس منحصرا در آن منتشر خواهد شد. 15- چگونگی تخصیص سهام به پذیرهنویسان."}, {"number": 10, "text": "مرجع ثبت شر کتها پس از مطالعه اظهارنامه و ضمائم آن و تطبیق مندرجات آنها با قانون اجازه انتشار اعلامیه پذیرهنویسی را صادرخواهد نمود."}, {"number": 11, "text": "اعلامیه پذیرهنویسی باید توسط مؤسسین در جراید آگهی گردیده و نیز در بانکی که تعهد سهام نزد آن صورت میگیرد در معرض دیدعلاقمندان قرار داده شود."}, {"number": 12, "text": "ظرف مهلتی که در اعلامیه پذیرهنویسی معین شده است علاقمندان ببانک مراجعه و ورقه تعهد سهام را امضاء و مبلغی را که نقدا باید پرداخت شود تأدیه و رسید دریافت خواهند کرد."}, {"number": 13, "text": "ورقه تعهد سهم باید مشتمل بر نکات زیر باشد: 1- نام و موضوع و مر کز اصلی و مدت شر کت 2- سرمایه شر کت. 3- شماره و تاریخ اجازه انتشار اعلامیه پذیرهنویسی و مرجع صدور آن. 4- تعداد سهامی که مورد تعهد واقع میشود و مبلغ اسمی آن و همچنین مبلغی که از آن بابت نقدا در موقع پذیرهنویسی باید پرداخت شود. 5- نام بانک و شماره حسابی که مبلغ لزم توسط پذیرهنویسان باید به آنحساب پرداخت شود. 6- هویت و نشانی کامل پذیرهنویس. 7- قید اینکه پذیرهنویس متعهد است مبلغ پرداخت نشده سهام مورد تعهد را طبق مقررات اساسنامه شر کت پرداخت نماید."}, {"number": 14, "text": "ورقه تعهد سهم در دو نسخه تنظیم و با قید تاریخ بامضاء پذیرهنویس یا قائممقام قانونی او رسیده نسخه اول نزد بانک نگاهدار ی ونسخه دوم با قید رسید وجه و مهر و امضاء بانک به پذیرهنویس تسلیم میشود. تبصره - در صورتیکه ورقه تعهد سهم را شخصی برای دیگر ی امضاء کند هویت و نشانی کامل و سمت امضاء کننده قید و مدر ک سمت او اخذ وضمیمه خواهد شد."}, {"number": 15, "text": "امضاء ورقه تعهد سهم بخودی خود مستلزم قبول اساسنامه شر کت و تصمیمات مجامع عمومی صاحبان سهام میباشد."}, {"number": 16, "text": "پس از گذشتن مهلتی که برای پذیرهنویسی معین شده است و یا در صورتیکه مدت تمدید شده باشد بعد از انقضای مدت تمدید شده مؤسسین حداکثر تا یکماه بتعهدات پذیرهنویسان رسیدگی و پس از احراز اینکه تمام سرمایه شر کت صحیحا تعهد گردیده و اقلا سی و پنج درصد آن پرداخت شده است تعدادسهام هر یک از تعهد کنندگانرا تعیین و اعلام و مجمع عمومی مؤسس را دعوت خواهند نمود."}, {"number": 17, "text": "مجمع عمومی مؤسس با رعایت مقررات این قانون تشکیل میشود و پس از رسیدگی و احراز پذیرهنویسی کلیه سهام شر کت و تأدیه مبالغ لزم و شور درباره اساسنامه شر کت و تصویب آن اولین مدیران و بازرس یا بازرسان شر کت را انتخاب میکند. مدیران و بازرسان شر کت باید کتبا قبول سمت نمایند قبول سمت بخودی خود دلیل بر این است که مدیر و بازرس با علم بتکالیف و مسئولیت های سمت خود عهدهدار آن گردیدهاند از این تاریخ شر کت تشکیل شده محسوب میشود. تبصره- هر گونه دعوت و اطلاعیه برای صاحبان سهام تا تشکیل مجمع عمومی سالنه باید در دو روزنامه کثیرالنتشار منتشر شود یکی از این دو رو زنامه بوسیله مجمع عمومی مؤسس و روزنامه دیگر از طرف وزارت اطلاعات و جهانگردی تعیین میشود."}, {"number": 18, "text": "اساسنامهای که بتصویب مجمع عمومی مؤسس رسیده به ضمیمه صورت جلسه مجمع و اعلامیه قبولی مدیران و بازرسان جهت ثبتشر کت بمرجع ثبت شر کتها تسلیم خواهد شد."}, {"number": 19, "text": "در صورتیکه شر کت تا ششماه از تاریخ تسلیم اظهارنامه مذکور در ماده 6 این قانون به ثبت نرسیده باشد به درخواست هر یک ازمؤسسین یا پذیرهنویسان مرجع ثبت شر کتها که اظهارنامه به آن تسلیم شده است گواهینامه ای حاکی از عدم ثبت شر کت صادر و ببانکی که تعهد سهام و تأدیه وجوه در آن بعمل آمده است ارسال میدارد تا مؤسسین و پذیرهنویسان ببانک مراجعه و تعهدنامه و وجوه پرداختی خود را مسترد دارند. در این صورت هر گونه هزینهای که برای تأسیس شر کت پرداخت یا تعهد شده باشد بعهده مؤسسین خواهد بود."}, {"number": 20, "text": "برای تأسیس و ثبت شر کتهای سهامی خاص فقط تسلیم اظهارنامه به ضمیمه مدار ک زیر بمرجع ثبت شر کتها کافی خواهد بود: 1- اساسنامه شر کت که باید
