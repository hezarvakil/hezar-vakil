<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قانون مجازات اسلامی | هزار و یک وکیل</title><style>:root{--n:#0d1b2a;--g:#c8a45d;--c:#f7f3ea}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#202733;font-family:Tahoma,Arial,sans-serif;line-height:2}header{background:var(--n);color:#fff;text-align:center;padding:25px;border-bottom:4px solid var(--g)}h1{margin:0;font-size:26px}.wrap{max-width:1100px;margin:auto;padding:18px}.search{position:sticky;top:8px;z-index:5;background:rgba(247,243,234,.96);padding:12px 0}.row{display:flex;gap:8px}input{flex:1;padding:13px;border:1px solid #d6cfbf;border-radius:12px;font:inherit}button{padding:0 16px;border:0;border-radius:12px;background:var(--n);color:white;font:inherit}.info{font-size:13px;color:#667085;margin-top:5px}.note{background:#fffaf0;border:1px solid #ead9ae;border-radius:12px;padding:12px;margin:12px 0;font-size:13px}.article{background:#fff;border:1px solid #e6e0d4;border-radius:14px;padding:18px;margin:12px 0}.article h2{margin:0 0 8px;color:var(--n);border-right:4px solid var(--g);padding-right:10px;font-size:19px}.article p{margin:0}.back{display:inline-block;margin:20px 0;color:var(--n);font-weight:bold;text-decoration:none}mark{background:#f3df9b}.empty{text-align:center;padding:30px;color:#667085}</style></head><body><header><h1>هزار و یک وکیل</h1><div>مجموعه حقوقی | قانون مجازات اسلامی</div></header><main class="wrap"><div class="search"><div class="row"><input id="q" placeholder="شماره ماده یا عبارت موردنظر را جست‌وجو کنید..."><button onclick="clearSearch()">پاک کردن</button></div><div id="info" class="info"></div></div><div class="note">متن این صفحه از فایل «قانون مجازات 92.pdf» استخراج شده است. برای استناد حقوقی، متن را با آخرین متن رسمی و اصلاحات و الحاقات تطبیق دهید.</div><section id="list"></section><div id="empty" class="empty" style="display:none">موردی پیدا نشد.</div><a class="back" href="index.html">← بازگشت به صفحه اصلی</a></main><script src="ghanoon-mojazat-data.js"></script><script>const q=document.getElementById('q'),list=document.getElementById('list'),info=document.getElementById('info'),empty=document.getElementById('empty');function norm(s){return s.replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).toLowerCase()}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let x=norm(q.value.trim()),n=0;list.innerHTML='';for(const a of articles){let hay=norm('ماده '+a.number+' '+a.text);if(x&&!hay.includes(x))continue;n++;let text=esc(a.text);if(x){let safe=q.value.trim().replace(/[.*+?^${}()|[\]\]/g,'\$&');text=text.replace(new RegExp('('+safe+')','gi'),'<mark>$1</mark>')}let e=document.createElement('article');e.className='article';e.innerHTML='<h2>ماده '+a.number+'</h2><p>'+text+'</p>';list.appendChild(e)}info.textContent=x?n+' ماده از '+articles.length+' ماده یافت شد.':articles.length+' ماده در صفحه موجود است.';empty.style.display=n?'none':'block'}function clearSearch(){q.value='';render();q.focus()}q.addEventListener('input',render);render();</script></body></html>
